  function meter(v, cls) { const m = el("div", `meter ${cls || ""}`); const t = el("div", "trk"); const i = el("i"); i.style.width = `${v}%`; t.append(i); m.append(t, el("b", null, `${v}%`)); return m; }
  function table(cols, rows) {

  function stats(xs) {
    const c = counted(xs); const ranks = c.filter((a) => a.rank).map((a) => a.rank);
    return { hits: c.filter((a) => a.appeared).length, n: c.length, rank: avg(ranks), first: ranks.filter((x) => x === 1).length, cited: xs.filter((a) => a.sources.length).length, all: xs.length };

    return [...m.values()].sort((x, y) => y.answers - x.answers || y.cites - x.cites);
