<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex,nofollow">
<title>LLMOHack Dashboard · Dapur Contoh</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 24'%3E%3Cpolygon points='14,1 14,7.6 10.1,6.7' fill='%230F6B4E'/%3E%3Cpolygon points='14,1 17.9,6.7 14,7.6' fill='%230A4F39'/%3E%3Cpolygon points='9.32,7.84 14,8.92 14,15.08 5.68,13.16' fill='%231A1A18'/%3E%3Cpolygon points='14,8.92 18.68,7.84 22.32,13.16 14,15.08' fill='%233A4A6A'/%3E%3Cpolygon points='4.9,14.3 14,16.4 14,23 1,20' fill='%231A1A18'/%3E%3Cpolygon points='14,16.4 23.1,14.3 27,20 14,23' fill='%233A4A6A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<style>:root {
  color-scheme: light;
  --bg: #ffffff;
  --side: #F5F5F3;
  --ink: #1A1A18;
  --ink-2: #4B4A45;
  --muted: #76746D;
  --line: #E6E4DE;
  --line2: #CFCCC4;
  --soft: #F5F5F3;
  --hover: #EEEDE8;
  --s1: #10a37f;
  --s2: #4285f4;
  --s3: #d97757;
  --s4: #b8338f;
  --accent: #1A1A18;
  --tint: #FDF3CF;
  --chk: #F7D45C;
  --gray: #9A978F;
  --mark: #F7D45C;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
}
body {
  font:
    14px/1.6 "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1,
h2,
h3,
p {
  margin: 0;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
.s1 {
  --c: var(--s1);
}
.s2 {
  --c: var(--s2);
}
.s3 {
  --c: var(--s3);
}
.s4 {
  --c: var(--s4);
}
.sg {
  --c: var(--gray);
}
.bchips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.bchip {
  border: 1px solid var(--line);
  background: #fff;
  color: var(--muted);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 700;
}
.bchip.on {
  color: var(--ink);
  border-color: var(--line2);
  background: var(--soft);
}
.bchip.me.on {
  color: #fff;
  background: var(--ink);
  border-color: var(--ink);
}
.mgrid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px 18px;
  margin-top: 10px;
}
.mcell {
  min-width: 0;
}
.mtitle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 2px;
}
@media (max-width: 900px) {
  .mgrid {
    grid-template-columns: minmax(0, 1fr);
  }
}
.muted {
  color: var(--muted);
}
.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.app {
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr);
  min-height: 100vh;
}
.side {
  background: var(--side);
  border-right: 1px solid var(--line);
  padding: 16px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: auto;
}
.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 4px 8px 12px;
  color: var(--ink);
}
.logo svg {
  display: block;
  height: 22px;
  width: auto;
  flex: none;
}
.logo b {
  font-weight: 900;
  font-size: 18px;
  letter-spacing: -.025em;
  line-height: 1;
}
.proj {
  padding: 10px 8px 12px;
  border-top: 1px solid var(--line);
}
.proj b {
  display: block;
  font-size: 14px;
  line-height: 1.3;
}
.proj span {
  font-size: 12px;
  color: var(--muted);
}
.group {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: .04em;
  padding: 14px 10px 6px;
}
.navi {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  border: 0;
  background: transparent;
  border-radius: 8px;
  padding: 8px 10px;
  text-align: left;
  color: var(--ink-2);
  font-weight: 600;
}
.navi:hover {
  background: var(--hover);
  color: var(--ink);
}
.navi[aria-current=page] {
  background: var(--tint);
  color: var(--accent);
  font-weight: 700;
}
.navi svg {
  width: 16px;
  height: 16px;
  flex: none;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.navi .cnt {
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
}
.main {
  min-width: 0;
}
.fbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  margin-top: 12px;
}
.mapgrid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 20px;
  margin-top: 8px;
  align-items: start;
}
@media (max-width: 1200px) {
  .mapgrid {
    grid-template-columns: 1fr;
  }
}
.mappanel h3 {
  font-size: 15px;
  margin: 0 0 8px;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
}
.mappanel .mapsum {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
}
.mapwrap {
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  background: #fff;
}
.geomap {
  width: 100%;
  height: auto;
  display: block;
}
.geomap .gpoly {
  fill: #F6F5F2;
  stroke: #DEDBD4;
  stroke-width: 1;
}
.geomap .glab {
  font-size: 13px;
  fill: #A6A39B;
  text-anchor: middle;
  pointer-events: none;
}
.geomap .gname {
  font-size: 16px;
  font-weight: 700;
  fill: var(--ink);
  paint-order: stroke;
  stroke: #fff;
  stroke-width: 4px;
  stroke-linejoin: round;
  pointer-events: none;
}
.geomap .gval {
  font-size: 14px;
  fill: var(--ink-2);
  paint-order: stroke;
  stroke: #fff;
  stroke-width: 4px;
  stroke-linejoin: round;
  pointer-events: none;
}
.geomap .gpt {
  stroke: #fff;
  stroke-width: 2.5;
}
.geomap .gscl {
  font-size: 13px;
  fill: #8E8B84;
}
.geomap .grv {
  fill: #e07020;
  stroke: #fff;
  stroke-width: 2;
}
.geomap .grvname {
  font-size: 15px;
  font-weight: 700;
  fill: #b4530f;
  paint-order: stroke;
  stroke: #fff;
  stroke-width: 4px;
  stroke-linejoin: round;
  pointer-events: none;
}
.maptbl .mbar.rv i {
  background: #e07020;
}
.maptbl .mbar.sch i {
  background: #6b4fd1;
}
.maplegend .sw.swrv {
  border-radius: 2px;
  transform: rotate(45deg) scale(.8);
}
.maptbl tr.rvrow td.pl {
  color: #b4530f;
}
.maptbl .mbar.pub i {
  background: #A6A39B;
}
.geomap .gctx {
  fill: #c4b8f0;
  stroke: #fff;
  stroke-width: 2;
}
.geomap .gctxname {
  font-size: 12px;
  fill: #8E8B84;
  paint-order: stroke;
  stroke: #fff;
  stroke-width: 3px;
  stroke-linejoin: round;
  pointer-events: none;
}
h3.svh {
  font-size: 14px;
  margin: 20px 0 8px;
}
.svwrap {
  overflow-x: auto;
}
table.svmat {
  width: 100%;
  min-width: 620px;
  border-collapse: collapse;
  table-layout: fixed;
}
.svmat th:first-child {
  width: 120px;
}
.svmat th {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  padding: 6px;
  text-align: center;
  line-height: 1.35;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.svmat td {
  padding: 7px 6px;
  border: 1px solid #fff;
  font-size: 13px;
}
.svmat td.pl {
  font-weight: 600;
  text-align: left;
}
.svmat td.cell {
  text-align: center;
  cursor: pointer;
  font-variant-numeric: tabular-nums;
  background: #F5F4F1;
}
.svmat td.cell:hover {
  outline: 2px solid #9ad3c4;
}
.svmat td.sel {
  outline: 2px solid #1f8a7a;
  font-weight: 700;
}
.repwrap {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  margin-top: 10px;
}
.repframe {
  border: 0;
  display: block;
  transform-origin: 0 0;
}
.geomap .gscale {
  fill: none;
  stroke: #8E8B84;
  stroke-width: 1.5;
}
.maplegend {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--muted);
  margin: 12px 0 4px;
}
.maplegend .sw {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  vertical-align: -3px;
  margin-right: 4px;
}
.mapnote {
  font-size: 12px;
  color: var(--muted);
  margin-top: 12px;
  line-height: 1.6;
}
table.maptbl {
  width: 100%;
  margin-top: 10px;
  table-layout: fixed;
}
table.maptbl th:nth-child(1) {
  width: 34%;
}
table.maptbl th:nth-child(2) {
  width: 18%;
}
.maptbl td {
  padding: 7px 8px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.maptbl .pl {
  font-weight: 600;
}
.maptbl .rate {
  white-space: nowrap;
  font-weight: 700;
}
.maptbl .mbar {
  display: block;
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: #EFEEEA;
  margin-top: 4px;
  overflow: hidden;
}
.maptbl .mbar i {
  display: block;
  height: 100%;
  background: #1f8a7a;
}
.maptbl .oth {
  font-size: 12px;
  color: var(--ink-2);
}
.phead.hasbar + .psub {
  margin-top: 12px;
}
.fbar .fl {
  max-width: 100%;
  min-width: 0;
}
.fbar .segc {
  flex-wrap: wrap;
  max-width: 100%;
  min-width: 0;
}
.fl {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.fl > span {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  flex: none;
  white-space: nowrap;
}
.btabs {
  display: flex;
  gap: 2px;
  margin-top: 12px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
}
.btabs::-webkit-scrollbar {
  display: none;
}
.btabs button {
  flex: none;
  border: 0;
  background: transparent;
  padding: 8px 12px;
  font: inherit;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-2);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
  cursor: pointer;
}
.btabs button:hover {
  color: var(--ink);
}
.btabs button[aria-selected=true] {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.compseg {
  margin: 10px 0 4px;
  flex-wrap: wrap;
  max-width: 100%;
}
.segc {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 2px;
  background: #fff;
}
.segc button {
  border: 0;
  background: transparent;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.segc button[aria-pressed=true] {
  background: var(--tint);
  color: var(--accent);
  box-shadow: 0 0 0 1px var(--chk);
}
.chip0 {
  font-size: 12px;
  color: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 10px;
  background: #fff;
}
.bar {
  width: 14px;
  height: 3px;
  border-radius: 2px;
  background: var(--c);
  display: inline-block;
  flex: none;
}
.page {
  padding: 22px 24px 60px;
  max-width: 1360px;
  width: 100%;
  margin-inline: auto;
  box-sizing: border-box;
}
.crumb {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  gap: 6px;
  align-items: center;
}
.crumb button {
  border: 0;
  background: none;
  padding: 0;
  color: var(--muted);
  font-weight: 600;
}
.crumb button:hover {
  color: var(--ink);
  text-decoration: underline;
}
.ptitle {
  font-size: 21px;
  font-weight: 900;
  margin-top: 4px;
  letter-spacing: .01em;
}
.psub {
  color: var(--ink-2);
  margin-top: 4px;
}
.phead {
  display: flex;
  align-items: flex-end;
  gap: 20px;
}
.phead.hasbubble {
  align-items: flex-start;
}
.ptxt {
  flex: 1;
  min-width: 0;
}
.prow {
  display: flex;
  align-items: center;
  gap: 16px;
}
.prow .ptitle {
  min-width: 0;
}
.chara {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
  user-select: none;
}
.chara img {
  display: block;
  height: 72px;
  width: auto;
}
.chara.wide img {
  height: 62px;
}
.chara.flip img {
  scale: -1 1;
}
.chara-name {
  margin-top: 3px;
  padding: 1px 9px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .04em;
  line-height: 1.6;
  white-space: nowrap;
}
.nodata {
  display: flex;
  align-items: center;
  gap: 12px;
}
.nodata img {
  height: 56px;
  width: auto;
  flex: none;
}
td .nodata {
  justify-content: flex-start;
}
.bubble {
  position: relative;
  margin: 4px 0 0 auto;
  flex: 0 1 420px;
  min-width: 240px;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: 12px;
  background: #fff;
  border: 1.5px solid var(--ink);
  border-radius: 14px;
  padding: 8px 14px 8px;
  font-size: 13px;
  line-height: 1.65;
  color: var(--ink);
}
.bubble::before,
.bubble::after {
  content: "";
  position: absolute;
  width: 0;
  height: 0;
  border-style: solid;
}
.bubble::before {
  right: -10px;
  top: 18px;
  border-width: 7px 0 7px 10px;
  border-color: transparent transparent transparent var(--ink);
}
.bubble::after {
  right: -7.5px;
  top: 19.5px;
  border-width: 5.5px 0 5.5px 8px;
  border-color: transparent transparent transparent #fff;
}
.btext {
  flex: 1 1 auto;
  min-width: 0;
  margin: 0;
}
.btext b {
  font-weight: 800;
}
.btext .nw {
  white-space: nowrap;
}
.bfoot {
  margin-left: auto;
  display: flex;
  align-items: baseline;
  gap: 12px;
  white-space: nowrap;
}
.bfoot:empty {
  display: none;
}
.bgo {
  border: 0;
  background: none;
  padding: 0;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
}
.bgo:hover {
  text-decoration: underline;
}
.bnext {
  border: 0;
  background: none;
  padding: 0 2px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.bnext:hover {
  color: var(--ink);
}
.bubble.pop {
  animation: bpop .22s ease-out;
}
@keyframes bpop {
  from {
    transform: scale(.96);
    opacity: .4;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
.chara.hop img {
  animation: chop .32s ease-out;
}
@keyframes chop {
  0%, 100% {
    transform: translateY(0);
  }
  40% {
    transform: translateY(-6px);
  }
}
@media (prefers-reduced-motion: reduce) {
  .bubble.pop,
  .chara.hop img {
    animation: none;
  }
}
@media (max-width: 600px) {
  .phead {
    gap: 10px;
  }
  .chara img {
    height: 52px;
  }
  .chara.wide img {
    height: 46px;
  }
  .phead.hasbar,
  .phead.hasbubble {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "crumb chara" "title chara" "bubble bubble" "tabs tabs" "bar bar";
    align-items: end;
    column-gap: 10px;
  }
  .phead.hasbar .ptxt,
  .phead.hasbubble .ptxt,
  .phead .prow {
    display: contents;
  }
  .phead .crumb {
    grid-area: crumb;
  }
  .phead .ptitle {
    grid-area: title;
  }
  .phead .chara {
    grid-area: chara;
  }
  .phead .fbar {
    grid-area: bar;
  }
  .phead .btabs {
    grid-area: tabs;
  }
  .phead .bubble {
    grid-area: bubble;
    margin: 12px 0 0;
    min-width: 0;
  }
  .phead .bubble::before {
    right: 18px;
    top: -10px;
    border-width: 0 7px 10px 7px;
    border-color: transparent transparent var(--ink) transparent;
  }
  .phead .bubble::after {
    right: 19.5px;
    top: -7.5px;
    border-width: 0 5.5px 8px 5.5px;
    border-color: transparent transparent #fff transparent;
  }
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px;
  margin-top: 18px;
}
.kpi {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
}
.kpi .lab {
  font-size: 12px;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
}
.kpi .val {
  font-size: 30px;
  font-weight: 800;
  line-height: 1.2;
  margin-top: 4px;
  letter-spacing: -.01em;
}
.kpi .val small {
  font-size: 14px;
  color: var(--ink-2);
  font-weight: 700;
  margin-left: 2px;
}
.kpi .cap {
  font-size: 12px;
  color: var(--muted);
}
.panels {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 12px;
  margin-top: 12px;
}
.panel {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  min-width: 0;
}
.panel h2 {
  font-size: 14px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.panel h2 .more {
  border: 0;
  background: none;
  font-size: 12px;
  color: var(--ink-2);
  font-weight: 600;
  padding: 0;
}
.panel h2 .more:hover {
  text-decoration: underline;
}
.panel .desc {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}
.tw {
  overflow-x: auto;
  margin-top: 10px;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}
th {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
td {
  padding: 10px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
tr.go {
  cursor: pointer;
}
tr.go:hover td {
  background: var(--soft);
}
tr.me td {
  background: #fff8de;
