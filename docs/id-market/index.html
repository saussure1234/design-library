<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>インドネシア市場パイ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6a65; --line:#d9d5cc; --edge:#b9b3a6;
  --paid:#1f8a5b; --free:#6fa8dc; --none:#ebe7de; --none-stroke:#cfc9bc; --other:#b3b0a8;
  --accent:#e0701f; --chip:#f1eee7; --hatch:rgba(0,0,0,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151513; --panel:#1e1e1b; --ink:#eeece6; --muted:#a3a097; --line:#3a3934; --edge:#57544c;
    --paid:#34b37a; --free:#5d93c7; --none:#2b2a26; --none-stroke:#45433c; --other:#6d6a62;
    --accent:#f08a3a; --chip:#2a2925; --hatch:rgba(255,255,255,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#151513; --panel:#1e1e1b; --ink:#eeece6; --muted:#a3a097; --line:#3a3934; --edge:#57544c;
  --paid:#34b37a; --free:#5d93c7; --none:#2b2a26; --none-stroke:#45433c; --other:#6d6a62;
  --accent:#f08a3a; --chip:#2a2925; --hatch:rgba(255,255,255,.3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em}
header .sub{font-size:12px;color:var(--muted)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ink)}
button.accent{border-color:var(--accent);color:var(--accent);font-weight:700}
main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;min-width:0;position:relative}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg:active{cursor:grabbing}
aside{width:380px;max-width:42vw;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px 18px 28px}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.8}
.crumbs a{color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
aside h2{font-size:18px;margin:0 0 4px;line-height:1.4}
.total{font-size:26px;font-weight:700;margin:2px 0 2px;letter-spacing:.01em}
.meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);margin-left:6px;vertical-align:1px;color:var(--muted)}
.badge.kari{border-color:var(--accent);color:var(--accent)}
.note{font-size:13px;line-height:1.7;margin:8px 0 12px}
.jp{font-size:12.5px;line-height:1.7;background:var(--chip);border-radius:8px;padding:8px 10px;margin:8px 0 12px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top;line-height:1.5}
tr.row{cursor:default}
tr.row.go{cursor:pointer}
tr.row.go:hover td{background:var(--chip)}
tr.row.hl td{background:var(--chip)}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-1px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pct{color:var(--muted);font-size:12px}
.small{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:3px}
.go-tag{font-size:11px;color:var(--accent);white-space:nowrap}
.src{font-size:11.5px;word-break:break-all;color:var(--muted)}
.src a{color:var(--muted)}
.legend{position:absolute;left:12px;bottom:12px;font-size:11.5px !important;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.9;max-width:calc(100% - 24px)}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-right:10px;white-space:nowrap}
.legend .foot{color:var(--muted);font-size:11px;line-height:1.5;white-space:normal}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;max-width:260px;line-height:1.5}
.hint{position:absolute;top:10px;left:12px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
@media (max-width:760px){
  main{flex-direction:column}
  aside{width:100%;max-width:none;border-left:0;border-top:1px solid var(--line);max-height:44vh;padding:12px 16px 20px}
  .legend{display:none}
  header h1{font-size:15px}
  .btns{margin-left:0}
  .hint{font-size:11px;right:12px}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>インドネシアの市場パイ</h1>
    <div class="sub">全事業者 → 規模・売り方・業種 → 狙いの層 → ソフトを使う店 → 会社ごとの客の数。<span id="updated"></span></div>
  </div>
  <div class="btns">
    <button id="b-all">全体を見る</button>
    <button id="b-root">真ん中のパイ</button>
    <button id="b-target" class="accent">Satu Inbox の狙い</button>
  </div>
</header>
<main>
  <div id="stage">
    <svg id="svg" role="img" aria-label="インドネシアの市場をパイで分けた図"></svg>
    <div class="hint">パイや切れを押すと、その先のパイへ。ドラッグで移動、ホイール・2本指で拡大縮小</div>
    <div class="legend" id="legend"><button id="lg-x" style="float:right;padding:0 8px;font-size:11px;margin-left:8px">閉じる</button>
      <span><i class="sw" style="background:var(--paid)"></i>有料のソフトを使う</span>
      <span><i class="sw" style="background:var(--free)"></i>無料の道具だけ</span>
      <span><i class="sw" style="background:var(--none);border:1px solid var(--none-stroke)"></i>使っていない（白地）</span>
      <span><svg width="14" height="14"><rect width="14" height="14" fill="var(--other)"/><rect width="14" height="14" fill="url(#hatch)"/></svg>斜線＝仮の数字</span>
      <span><i class="sw" style="border:2px dashed var(--accent)"></i>Satu Inbox の狙い</span>
      <div class="foot">パイの大きさは数の桁（対数）で決めています。細すぎる切れは見やすく少し太くしています。各社の客の数は多くが自称です。</div>
    </div>
    <div class="tip" id="tip"></div>
  </div>
  <aside id="panel"></aside>
</main>

ja": "3,021万", "year": "2025-12（ネットは2024）", "basis": "確か", "note_ja": "農業以外の小さな事業者（零細・小・中）の国の名簿で、2025年末の暫定値です。大企業は入っていません。", "source": "https://databoks.katadata.co.id/ekonomi-makro/statistik/6aac8d44ec7e0/hampir-seluruh-umkm-indonesia-masuk-kategori-usaha-mikro-pada-2025", "parent_node": "root", "parent_slice": null, "edge_label_ja": "売り方で分けると", "slices": [{"id": "s_online", "label_ja": "ネットで売る", "value": 4400000, "display_ja": "440万", "basis": "確か", "kind": "区分", "note_ja": "BPS のネット販売の調査（2024年）の数で、前の年より15.3%増えました。名簿とは別の調査で、大企業も少し入るので、足しても正確には合いません。", "source": "https://data.goodstats.id/statistic/jumlah-usaha-e-commerce-indonesia-tembus-4-juta-pada-2024-SJrOt"}, {"id": "s_offline", "label_ja": "ネットで売らない", "value": 25809069, "display_ja": "約2,581万", "basis": "推計", "kind": "区分", "note_ja": "3,021万から440万を引いた数です。BPS の調査では対象の42.02%がネットで売りますが、その対象は約1,050万（計算）しかなく、名簿と数え方が違うので目安です。", "source": "https://data.goodstats.id/statistic/jumlah-usaha-e-commerce-indonesia-tembus-4-juta-pada-2024-SJrOt"}]}, {"id": "online", "title_ja": "ネットで売る事業者", "total": 4400000, "total_display_ja": "440万", "year": "2024", "basis": "確か", "note_ja": "BPS の数で、299万（2022）→382万（2023）→440万（2024）と増えています。規模の割合は北スマトラ州の BPS 資料から取りました。同じ資料の売り方の割合（94.76%など）は全国の値だと確かめられたので、規模も全国の値の可能性が高いですが、※要確認です。", "source": "https://data.goodstats.id/statistic/jumlah-usaha-e-commerce-indonesia-tembus-4-juta-pada-2024-SJrOt", "parent_node": "cut_online", "parent_slice": "s_online", "edge_label_ja": "ネットで売る店を規模で", "slices": [{"id": "online_micro", "label_ja": "零細", "value": 4249960, "display_ja": "約425万", "basis": "推計", "kind": "区分", "note_ja": "440万×96.59%の計算です。資料の値は96.58%ですが、合計を440万に合わせるため、零細でない3.41%の残りを使いました。年商 Rp20億（約1,740万円）以下の店です。", "source": "https://www.unsiap.or.jp/sites/default/files/doc/2026-04/09_E-Commerce-the%20Economy%20of%20North%20Sumatra.pdf"}, {"id": "online_small", "label_ja": "小", "value": 119240, "display_ja": "約11.9万", "basis": "推計", "kind": "区分", "note_ja": "440万×2.71%の計算です。全国の値か※要確認です。", "source": "https://www.unsiap.or.jp/sites/default/files/doc/2026-04/09_E-Commerce-the%20Economy%20of%20North%20Sumatra.pdf"}, {"id": "online_medium", "label_ja": "中", "value": 21560, "display_ja": "約2.2万", "basis": "推計", "kind": "区分", "note_ja": "440万×0.49%の計算です。全国の値か※要確認です。", "source": "https://www.unsiap.or.jp/sites/default/files/doc/2026-04/09_E-Commerce-the%20Economy%20of%20North%20Sumatra.pdf"}, {"id": "online_large", "label_ja": "大", "value": 9240, "display_ja": "約0.9万", "basis": "推計", "kind": "区分", "note_ja": "440万×0.21%の計算です。全国の値か※要確認です。", "source": "https://www.unsiap.or.jp/sites/default/files/doc/2026-04/09_E-Commerce-the%20Economy%20of%20North%20Sumatra.pdf"}]}, {"id": "target", "title_ja": "狙い：払える規模の店", "total": 328969, "total_display_ja": "32.9万", "year": "2024", "basis": "推計", "note_ja": "チャットで売る417万店のうち、担当を置ける従業員6人以上（6〜20人6.7%＋21人以上1.19%＝7.89%）の店。7.89%の出典は北スマトラについての資料なので、全国でも同じかは要確認。", "source": "https://www.unsiap.or.jp/sites/default/files/doc/2026-04/09_E-Commerce-the%20Economy%20of%20North%20Sumatra.pdf", "parent_node": "chat", "parent_slice": "chat_6plus", "edge_label_ja": "従業員6人以上に絞ると", "slices": [{"id": "t_inbox_yes", "label_ja": "受信箱を使う", "value": 32018, "display_ja": "約3.2万", "basis": "仮", "kind": "有料", "note_ja": "有料の受信箱を使う約4.6万のうち、7割をこの規模の店とした（仮）。銀行や学校などネットで売らない客も混ざるので、本当の店の数はこれより少ない見込み。", "source": "/Users/sohayashi/llmohack/id/pos-research/stage4_whitespace.json"}, {"id": "t_inbox_no", "label_ja": "まだ使わない", "value": 296951, "display_ja": "約29.7万", "basis": "仮", "kind": "使っていない", "note_ja": "残りの店（約9割）。無料の WhatsApp Business アプリだけで回している店もここに入る。Satu Inbox の一番の狙い。", "source": "/Users/sohayashi/llmohack/id/pos-research/stage4_whitespace.json"}]}, {"id": "chat", "title_ja": "チャットで売る店", "total": 4169440, "total_display_ja": "約417万", "year": "2024", "basis": "推計", "note_ja": "440万×94.76%（WhatsApp などのチャットで売る割合、2024年の全国の値）の計算です。SNS・モールと重なる複数回答なので、3つを足すと440万を超えます（2023年は95.33%）。", "source": "https://databoks.katadata.co.id/en/technology-telecommunications/statistics/692fe011736e4/instant-messaging-main-channel-for-e-commerce-businesses-in-indonesia", "parent_node": "online", "parent_slice": null, "edge_label_ja": "チャットで売るのは", "slices": [{"id": "chat_6plus", "label_ja": "6人以上の店", "value": 328969, "display_ja": "約32.9万", "basis": "推計", "kind": "区分", "note_ja": "417万×7.89%（働く人6人以上）の計算で、狙いの規模です。ネットで売る店全体の割合をそのまま当てました。チャットで売る店はネットで売る店のほぼ全部なので、ずれは小さいとみました。7.89%は全国の値か※要確認です。", "source": "https://www.unsiap.or.jp/sites/default/files/doc/2026-04/09_E-Commerce-the%20Economy%20of%20North%20Sumatra.pdf"}, {"id": "chat_under6", "label_ja": "5人以下の店", "value": 3840471, "display_ja": "約384万", "basis": "推計", "kind": "区分", "note_ja": "417万から6人以上の店を引いた数です。", "source": "https://www.unsiap.or.jp/sites/default/files/doc/2026-04/09_E-Commerce-the%20Economy%20of%20North%20Sumatra.pdf"}]}, {"id": "sns", "title_ja": "SNS で売る店", "total": 1305040, "total_display_ja": "約130.5万", "year": "2024", "basis": "推計", "note_ja": "440万×29.66%（Instagram・TikTok などの SNS で売る割合、2024年の全国の値）の計算です。チャット・モールと重なる複数回答です（2023年は33.29%で、少し減りました）。", "source": "https://databoks.katadata.co.id/en/technology-telecommunications/statistics/692fe011736e4/instant-messaging-main-channel-for-e-commerce-businesses-in-indonesia", "parent_node": "online", "parent_slice": null, "edge_label_ja": "SNS で売るのは", "slices": [{"id": "sns_6plus", "label_ja": "6人以上の店", "value": 102968, "display_ja": "約10.3万", "basis": "仮", "kind": "区分", "note_ja": "130.5万×7.89%で、ネットで売る店全体の「6人以上」の割合をそのまま当てた仮の数です。SNS で売る店だけの割合は分かりません（※要確認）。", "source": "https://www.unsiap.or.jp/sites/default/files/doc/2026-04/09_E-Commerce-the%20Economy%20of%20North%20Sumatra.pdf"}, {"id": "sns_under6", "label_ja": "5人以下の店", "value": 1202072, "display_ja": "約120.2万", "basis": "仮", "kind": "区分", "note_ja": "130.5万から6人以上の店（仮）を引いた数です。", "source": "https://www.unsiap.or.jp/sites/default/files/doc/2026-04/09_E-Commerce-the%20Economy%20of%20North%20Sumatra.pdf"}]}, {"id": "mall", "title_ja": "モールで売る店", "total": 758120, "total_display_ja": "約75.8万", "year": "2024", "basis": "推計", "note_ja": "440万×17.23%（Shopee・Tokopedia などのモールで売る割合、2024年の全国の値）の計算です。チャット・SNS と重なる複数回答です（2023年は17.80%）。", "source": "https://databoks.katadata.co.id/en/technology-telecommunications/statistics/692fe011736e4/instant-messaging-main-channel-for-e-commerce-businesses-in-indonesia", "parent_node": "online", "parent_slice": null, "edge_label_ja": "モールで売るのは", "slices": [{"id": "mall_6plus", "label_ja": "6人以上の店", "value": 59816, "display_ja": "約6.0万", "basis": "仮", "kind": "区分", "note_ja": "75.8万×7.89%で、ネットで売る店全体の「6人以上」の割合をそのまま当てた仮の数です。モールで売る店では実際はもっと多い可能性があります（※要確認）。", "source": "https://www.unsiap.or.jp/sites/default/files/doc/2026-04/09_E-Commerce-the%20Economy%20of%20North%20Sumatra.pdf"}, {"id": "mall_under6", "label_ja": "5人以下の店", "value": 698304, "display_ja": "約69.8万", "basis": "仮", "kind": "区分", "note_ja": "75.8万から6人以上の店（仮）を引いた数です。", "source": "https://www.unsiap.or.jp/sites/default/files/doc/2026-04/09_E-Commerce-the%20Economy%20of%20North%20Sumatra.pdf"}]}, {"id": "cut_sector", "title_ja": "業種で分けると", "total": 30209069, "total_display_ja": "3,021万", "year": "2025-12", "basis": "確か", "note_ja": "農業以外の小さな事業者（国の名簿、2025年末）を17の業種に分けた数です。半分近くが卸・小売です。", "source": "https://databoks.katadata.co.id/ekonomi-makro/statistik/69e8550c3162d/ada-30-juta-umkm-non-pertanian-di-indonesia-pada-2025-ini-sektor-usahanya", "parent_node": "root", "parent_slice": null, "edge_label_ja": "業種で分けると", "slices": [{"id": "sec_trade", "label_ja": "卸・小売", "value": 14440000, "display_ja": "1,444万", "basis": "確か", "kind": "区分", "note_ja": "車・バイクの修理も入った数です。小売だけの数は見つかりませんでした（※要確認）。", "source": "https://databoks.katadata.co.id/ekonomi-makro/statistik/69e8550c3162d/ada-30-juta-umkm-non-pertanian-di-indonesia-pada-2025-ini-sektor-usahanya"}, {"id": "sec_food", "label_ja": "宿泊・飲食", "value": 6410000, "display_ja": "641万", "basis": "確か", "kind": "区分", "note_ja": "宿泊も入った数です。BPS の別の調査では飲食の事業者は528万（2024年）で、資料が違うので合いません。", "source": "https://databoks.katadata.co.id/ekonomi-makro/statistik/69e8550c3162d/ada-30-juta-umkm-non-pertanian-di-indonesia-pada-2025-ini-sektor-usahanya"}, {"id": "sec_mfg", "label_ja": "製造", "value": 4170000, "display_ja": "417万", "basis": "確か", "kind": "区分", "note_ja": "ものを作る事業者です。", "source": "https://databoks.katadata.co.id/ekonomi-makro/statistik/69e8550c3162d/ada-30-juta-umkm-non-pertanian-di-indonesia-pada-2025-ini-sektor-usahanya"}, {"id": "sec_service", "label_ja": "その他サービス", "value": 1910000, "display_ja": "191万", "basis": "確か", "kind": "区分", "note_ja": "国の業種表で、ほかに入らないサービスをまとめた区分です。", "source": "https://databoks.katadata.co.id/ekonomi-makro/statistik/69e8550c3162d/ada-30-juta-umkm-non-pertanian-di-indonesia-pada-2025-ini-sektor-usahanya"}, {"id": "sec_transport", "label_ja": "運輸・倉庫", "value": 1170000, "display_ja": "117万", "basis": "確か", "kind": "区分", "note_ja": "人やものを運ぶ事業者と倉庫です。", "source": "https://databoks.katadata.co.id/ekonomi-makro/statistik/69e8550c3162d/ada-30-juta-umkm-non-pertanian-di-indonesia-pada-2025-ini-sektor-usahanya"}, {"id": "sec_other", "label_ja": "ほか12業種", "value": 2109069, "display_ja": "約211万", "basis": "推計", "kind": "その他", "note_ja": "建設・情報通信・教育など12業種で、足すと210.6万です。上の5つが四捨五入した数なので、合計に合わせて差の約0.35万をここで調整しました。", "source": "https://databoks.katadata.co.id/ekonomi-makro/statistik/69e8550c3162d/ada-30-juta-umkm-non-pertanian-di-indonesia-pada-2025-ini-sektor-usahanya"}]}, {"id": "cut_legal", "title_ja": "法人（税の申告をする会社）", "total": 2060000, "total_display_ja": "206万", "year": "2024", "basis": "確か", "note_ja": "法人の税の申告を出す義務がある会社の数です（2024年、国税局の年報）。2025年分を期限（2026年5月末）までに出したのは108万でした。", "source": "https://news.ddtc.co.id/berita/nasional/1815710/djp-catat-kepatuhan-wajib-pajak-nonkaryawan-2024-turun-signifikan", "parent_node": "root", "parent_slice": null, "edge_label_ja": "法人だけ数えると", "slices": [{"id": "legal_filed", "label_ja": "申告を出した", "value": 1180000, "display_ja": "118万", "basis": "確か", "kind": "区分", "note_ja": "2024年に法人の申告を出した会社です。出した割合は57.59%でした（記事の値）。", "source": "https://news.ddtc.co.id/berita/nasional/1815710/djp-catat-kepatuhan-wajib-pajak-nonkaryawan-2024-turun-signifikan"}, {"id": "legal_notfiled", "label_ja": "申告を出さない", "value": 880000, "display_ja": "約88万", "basis": "推計", "kind": "区分", "note_ja": "206万から118万を引いた数です。義務があるのに申告を出していない会社です。", "source": "https://news.ddtc.co.id/berita/nasional/1815710/djp-catat-kepatuhan-wajib-pajak-nonkaryawan-2024-turun-signifikan"}]}, {"id": "cut_employer", "title_ja": "労働保険に入る会社", "total": 875641, "total_display_ja": "87.6万", "year": "2025-12", "basis": "確か", "note_ja": "働く人の労働保険（BPJS）に入っている会社で、90.2万（2023）→88.9万（2024）→87.6万（2025）と少しずつ減っています。保険に入らずに人を雇う所も多く、常雇いの人を使う事業主は約507万です（計算、2025年8月）。", "source": "https://www.bpjsketenagakerjaan.go.id/assets/uploads/laporan_tahunan/IR_2025.pdf", "parent_node": "root", "parent_slice": null, "edge_label_ja": "人を雇う会社だけ", "slices": [{"id": "emp_micro", "label_ja": "零細", "value": 705897, "display_ja": "70.6万", "basis": "確か", "kind": "区分", "note_ja": "全体の80.61%です（2025年12月、労働省のデータ）。", "source": "https://data.goodstats.id/statistic/perusahaan-peserta-bpjs-ketenagakerjaan-didominasi-oleh-usaha-mikro-O4JTO"}, {"id": "emp_small", "label_ja": "小", "value": 83251, "display_ja": "8.3万", "basis": "確か", "kind": "区分", "note_ja": "全体の9.51%です（割合は計算）。", "source": "https://data.goodstats.id/statistic/perusahaan-peserta-bpjs-ketenagakerjaan-didominasi-oleh-usaha-mikro-O4JTO"}, {"id": "emp_medium", "label_ja": "中", "value": 36569, "display_ja": "3.7万", "basis": "確か", "kind": "区分", "note_ja": "全体の4.18%です（割合は計算）。", "source": "https://data.goodstats.id/statistic/perusahaan-peserta-bpjs-ketenagakerjaan-didominasi-oleh-usaha-mikro-O4JTO"}, {"id": "emp_large", "label_ja": "大", "value": 49924, "display_ja": "5.0万", "basis": "確か", "kind": "区分", "note_ja": "全体の5.70%です（割合は計算）。国の推計の大企業5.0万とほぼ同じ数です。", "source": "https://data.goodstats.id/statistic/perusahaan-peserta-bpjs-ketenagakerjaan-didominasi-oleh-usaha-mikro-O4JTO"}]}, {"id": "inbox_usage", "title_ja": "受信箱ツールの使い方", "total": 4169440, "total_display_ja": "417万", "year": "2024（店の数）／2023〜2026（各社の数）", "basis": "推計", "note_ja": "チャットで売る417万店（440万×94.76%、BPS 2024の全国の値）を、受信箱ツールの使い方で3つに分けた。有料は各社の数の足し算、無料と道具なしは仮の割合。", "source": "https://databoks.katadata.co.id/en/technology-telecommunications/statistics/692fe011736e4/instant-messaging-main-channel-for-e-commerce-businesses-in-indonesia", "parent_node": "chat", "parent_slice": null, "edge_label_ja": "受信箱の使い方で分けると", "slices": [{"id": "iu_paid", "label_ja": "有料の受信箱", "value": 45740, "display_ja": "約4.6万", "basis": "仮", "kind": "有料", "note_ja": "下の会社ごとの数を足したもの（417万の約1.1%）。銀行・病院・学校などネットで売らない客も入っている（割合は不明）。", "source": "/Users/sohayashi/llmohack/id/pos-research/stage4_whitespace.json"}, {"id": "iu_free", "label_ja": "無料の道具だけ", "value": 2501664, "display_ja": "約250万", "basis": "仮", "kind": "無料", "note_ja": "国の調べが無いので、6割の店が無料の WhatsApp Business アプリなどを使うとした（仮）。BCG と Meta の調べ（2024）では、中小の83%が客とメッセージでやり取りしている。", "source": "https://ukmindonesia.id/baca-deskripsi-posts/perpesanan-bisnis-bikin-penjualan-naik-tiga-kali-lipat-riset-bcg-dan-meta-ungkap-fakta-menarik-ini"}, {"id": "iu_none", "label_ja": "個人のWAだけ", "value": 1622036, "display_ja": "約162万", "basis": "仮", "kind": "使っていない", "note_ja": "残りの店。ふつうの WhatsApp を1台のスマホで使い、道具なしで返信している（仮）。", "source": "/Users/sohayashi/llmohack/id/pos-research/stage4_whitespace.json"}], "jp_note_ja": "日本では LINE 公式アカウントを動かす145万のうち、受信箱・拡張ツールを有料で使うのは約8.1万（5.6%）。無料を含めると最大17.8%で、インドネシアの約1.1%の5倍以上（stage4_whitespace.json）。"}, {"id": "inbox_players", "title_ja": "有料の受信箱の会社", "total": 45740, "total_display_ja": "約4.6万", "year": "2023〜2026（各社の発表）", "basis": "仮", "note_ja": "有料の受信箱を使う会社を、ツールの会社ごとに分けた。約6割は会社の自称の数、約4割は仮に決めた数（海外の会社は世界の客の1割をインドネシア分とした）。", "source": "/Users/sohayashi/llmohack/id/pos-research/stage4_whitespace.json", "parent_node": "inbox_usage", "parent_slice": "iu_paid", "edge_label_ja": "有料はどの会社か", "slices": [{"id": "ip_wablas", "label_ja": "Wablas", "value": 20000, "display_ja": "2万", "basis": "確か", "kind": "有料", "note_ja": "『2万社以上が利用』（自称・時点なし。今の数か累計かも不明）。本業は通知や一斉送信の送り口で、受信箱を使わない会社も入るので多めの数。", "source": "https://wablas.com/"}, {"id": "ip_qontak", "label_ja": "Qontak（Mekari）", "value": 3500, "display_ja": "3,500", "basis": "確か", "kind": "有料", "note_ja": "インドネシアで3,500社以上（自称、2026-07の報道）。Mekari 全体の5.5万社は会計や人事も入るので使っていない。", "source": "https://goodstats.id/article/mekari-qontak-platform-ai-customer-engagement-untuk-bisnis-di-indonesia-nCZDg"}, {"id": "ip_haloai", "label_ja": "HaloAI", "value": 3000, "display_ja": "3,000", "basis": "仮", "kind": "有料", "note_ja": "『数千の会社が信頼』とだけ書いてある→3,000とした（仮）。", "source": "https://haloai.co.id/"}, {"id": "ip_cekat", "label_ja": "Cekat AI", "value": 2700, "display_ja": "2,700", "basis": "仮", "kind": "有料", "note_ja": "3,000社以上（自称。『アジアで』という書き方もある）。インドネシアの会社なので、9割の2,700とした（仮）。", "source": "https://www.cekat.ai/"}, {"id": "ip_wati", "label_ja": "Wati（海外）", "value": 1600, "display_ja": "1,600", "basis": "仮", "kind": "有料", "note_ja": "世界で1.6万社（自称）。インドネシア分は不明なので、1割の1,600とした（仮）。", "source": "https://www.wati.io/about-us/"}, {"id": "ip_desty", "label_ja": "Desty Chat", "value": 1500, "display_ja": "1,500", "basis": "仮", "kind": "有料", "note_ja": "Desty は『数千の店』とだけ発表→3,000とし、チャットを有料で使う店をその半分の1,500とした（仮）。2025年に Mekari が買収。", "source": "https://mekari.com/en/news/mekari-acquires-desty/"}, {"id": "ip_jubelio", "label_ja": "Jubelio Chat", "value": 1500, "display_ja": "1,500", "basis": "仮", "kind": "有料", "note_ja": "Jubelio 全体で『数千の会社』→3,000とし、チャットも使う店をその半分の1,500とした（仮）。", "source": "https://www.jubelio.com/"}, {"id": "ip_watzap", "label_ja": "Watzap", "value": 1200, "display_ja": "1,200", "basis": "確か", "kind": "有料", "note_ja": "『1,200以上の会社』（自称。2026年1〜6月の利用者の平均の説明に出てくる数）。1つの番号を何人もの担当で使える受信箱がある。", "source": "https://watzap.id/"}, {"id": "ip_maxchat", "label_ja": "Maxchat", "value": 1000, "display_ja": "1,000", "basis": "確か", "kind": "有料", "note_ja": "『1,000以上の業界・機関が信頼』（自称・時点なし）。Meta の公式パートナー。", "source": "https://maxchat.id/"}, {"id": "ip_respondio", "label_ja": "respond.io（海外）", "value": 1000, "d ible.com/ ; https://www.sirclo.com/ ; https://ginee.com/id/pricing ; https://ginee.com/id/insights/intro-to-genie", "parent_node": "oms_usage", "parent_slice": "oms_paid", "edge_label_ja": "有料の店を会社で分けると", "slices": [{"id": "p_bigseller", "label_ja": "BigSeller", "value": 10200, "display_ja": "約1万", "basis": "仮", "kind": "有料", "note_ja": "東南アジアの『130万以上の Merchant』（自称）×インドネシアの人口の比47%×今も使う3人に1人（直近2年の登録の分）＝約20.4万。そのうち無料の上限（月3,000件・5店）を超えて払う店を5%とした。", "source": "https://www.bigseller.com/m/id/aboutUs.htm ; https://www.bigseller.com/blog/articleDetails/what-is-bigseller-is-bigseller-easy-to-use-how-does-bigseller-charge.728.htm"}, {"id": "p_jubelio", "label_ja": "Jubelio", "value": 3000, "display_ja": "3,000", "basis": "仮", "kind": "有料", "note_ja": "料金ページは『3.5万以上』、トップは『数千』（どちらも自称）。無料プランが無く1件 Rp150 を払う形なので、今払っている店は『数千』→3,000とした。", "source": "https://jubelio.com/harga/ ; https://jubelio.com/"}, {"id": "p_desty", "label_ja": "Mekari Desty", "value": 3000, "display_ja": "3,000", "basis": "仮", "kind": "有料", "note_ja": "2025-08 の買収発表で『数千の店』とだけ発表→3,000とした。モール管理に Rp0 のプランは無く（Rp0 は Desty Chat だけ）、お試しの後は1件ごとか月額で払う。", "source": "https://mekari.com/en/news/mekari-acquires-desty/ ; https://desty.mekari.com/harga"}, {"id": "p_crewdible", "label_ja": "Crewdible（倉庫）", "value": 2300, "display_ja": "2,300", "basis": "確か", "kind": "有料", "note_ja": "『2,300以上の売り手』（自称、ページは2023年。累計か今の数かは書いていない）。倉庫ごと預かる代行で、ほかの道具と両方使う店もいる。", "source": "https://crewdible.com/"}, {"id": "p_sirclo", "label_ja": "SIRCLO（大手）", "value": 1000, "display_ja": "1,000", "basis": "確か", "kind": "有料", "note_ja": "『大企業のブランド1,000』（自称、日付なし）。ソフトだけでなく運用の代行まで請け負う。", "source": "https://www.sirclo.com/"}, {"id": "p_ginee", "label_ja": "Ginee", "value": 1600, "display_ja": "約1,600", "basis": "仮", "kind": "有料", "note_ja": "今の料金ページは有料の4プラン（Pro・Business・Plus・Enterprise、最低6か月）だけで無料が無い。無料だった2021年の登録4.7万（自称）×今も使う3人に1人×払って残る1割＝約1,600とした。", "source": "https://ginee.com/id/pricing ; https://ginee.com/id/insights/intro-to-genie"}, {"id": "p_other n/2025/11/28/647323224ecc656c2933571b/statistik-e-commerce-2024.html", "parent_node": "online", "parent_slice": null, "edge_label_ja": "お金の受け取り方で", "slices": [{"id": "s_pay_gw", "label_ja": "決済代行を使う", "value": 286000, "display_ja": "約28.6万", "basis": "仮", "kind": "有料", "note_ja": "主に電子マネー（5.92%）かカード（0.58%）で受け取る店を「決済代行を使う店」とみなした（440万×6.50%）。GoPay・DANA・OVO の自分の口座で直接受け取る店（無料）も混じるので、多めに出ている。", "source": "BPS 2024 を GoodStats が引用: https://data.goodstats.id/statistic/metode-pembayaran-tunai-dominasi-transaksi-e-commerce-2024-smjEM"}, {"id": "s_pay_qris", "label_ja": "QRISで受ける", "value": 92400, "display_ja": "約9.2万", "basis": "推計", "kind": "無料", "note_ja": "主に QRIS で受け取る店（2.10%）。銀行や電子マネー会社の QR は無料で作れ、零細の店は Rp50万以下の支払いなら手数料0%（決済代行が出す QRIS を使う店も少し混じる）。QRIS を受け付ける店は全国で4,486万（2026年6月、中央銀行）で、ほとんどは店頭の店。", "source": "BPS 2024（GoodStats 引用）: https://data.goodstats.id/statistic/metode-pembayaran-tunai-dominasi-transaksi-e-commerce-2024-smjEM / QRIS の店の数: https://www.bi.go.id/en/publikasi/ruang-media/news-release/Pages/sp_2815926.aspx / 手数料の決まり: /Users/sohayashi/llmohack/id/pos-research/stage2_result.json（cross.items[7]）"}, {"id": "s_pay_transfer", "label_ja": "銀行振込だけ", "value": 730840, "display_ja": "約73.1万", "basis": "推計", "kind": "使っていない", "note_ja": "主に銀行振込で受け取る店（16.61%）で、振込の写真をチャットで1件ずつ確かめる手間が残る、Satu Inbox の振込写真の読み取りがいちばん役に立つ層。仮想口座（VA）で決済代行を通す店や、振込の確認を自動にする Moota（自称「1万以上の事業者」、有料プランあり）を使う店も少し混じる。", "source": "BPS 2024（GoodStats 引用）: https://data.goodstats.id/statistic/metode-pembayaran-tunai-dominasi-transaksi-e-commerce-2024-smjEM / Moota: https://moota.co/（2026-11-23 に確認）"}, {"id": "s_pay_cod", "label_ja": "現金・代引き", "value": 3290760, "display_ja": "約329.1万", "basis": "推計", "kind": "使っていない", "note_ja": "主に現金・代引きで受け取る店（74.79%）。ネットで売る店のおよそ4店に3店がこれで、決済代行は使っていない。", "source": "BPS 2024（GoodStats 引用）: https://data.goodstats.id/statistic/metode-pembayaran-tunai-dominasi-transaksi-e-commerce-2024-smjEM"}], "jp_note_ja": "日本では全企業368万のうち5.2%以上がネットの決済代行を使っている。GMO-PG の動いている店17.3万（2026年9月）に year": "2024〜2025", "basis": "推計", "note_ja": "飲食店528万（BPS 2024年）と卸・小売1,444万（政府の名簿 2025年末）を足した数。屋台や家の中の小さな店も入り、宿泊（ホテル）は外したが、卸売と車の修理は入っている。", "source": "https://www.bps.go.id/id/publication/2025/12/31/e46a55af756331ede8016b91/statistik-penyediaan-makanan-minuman-2024.html ; https://databoks.katadata.co.id/ekonomi-makro/statistik/69e8550c3162d/ada-30-juta-umkm-non-pertanian-di-indonesia-pada-2025-ini-sektor-usahanya", "parent_node": "cut_sector", "parent_slice": null, "edge_label_ja": "レジを使う業種だけ", "slices": [{"id": "pb_food", "label_ja": "飲食店", "value": 5280000, "display_ja": "528万", "basis": "確か", "kind": "区分", "note_ja": "食べ物・飲み物を出す事業者（2024年、BPS）。屋台（移動販売）も約15%入る。", "source": "https://www.bps.go.id/id/publication/2025/12/31/e46a55af756331ede8016b91/statistik-penyediaan-makanan-minuman-2024.html"}, {"id": "pb_trade", "label_ja": "卸・小売", "value": 14440000, "display_ja": "1,444万", "basis": "確か", "kind": "区分", "note_ja": "卸売・小売・車の修理をまとめた数（2025年末の暫定値、政府の名簿 SIDT）。小売だけの数は※要確認。", "source": "https://databoks.katadata.co.id/ekonomi-makro/statistik/69e8550c3162d/ada-30-juta-umkm-non-pertanian-di-indonesia-pada-2025-ini-sektor-usahanya"}]}, {"id": "pos_usage", "title_ja": "レジの使い方", "total": 19720000, "total_display_ja": "約1,972万", "year": "2020〜2026（各社の発表の時点）", "basis": "仮", "note_ja": "分母はレジを使う業種の店1,972万（屋台を含む）で、有料と無料は各社の発表を足した仮の数。無料は登録の数なので、実際にレジとして使う店は BI の調査（9.24%）から見て約182万以下とみられる。払える規模の会社（小＋中 82万〜186万社・全業種）だけで割ると、有料は1〜3割。", "source": "https://www.bi.go.id/en/publikasi/kajian/Documents/RP-MON-09-2024.pdf ; https://ukmindonesia.id/uploads/attachment/doc/data_sandingan_UMKM_kemenkop_UKM-20162017.pdf ; https://databoks.katadata.co.id/ekonomi-makro/statistik/6ab089685dc68/jumlah-dan-rasio-ukm-di-indonesia-meningkat-pada-2025 ; /Users/sohayashi/llmohack/id/pos-research/stage4_whitespace.json", "parent_node": "pos_base", "parent_slice": null, "edge_label_ja": "レジの使い方で分けると", "slices": [{"id": "pu_paid", "label_ja": "有料のレジアプリ", "value": 231500, "display_ja": "約23万（1.2%）", "basis": "仮", "kind": "有料", "note_ja": "下の会社ごとの数を足した仮の数。はっきりしているのは無料プランの無い Moka と有料の majoo の計9万で、自称を全部足すと26.5万、BI の調査の割合から出すと約9万と幅が大きい。", "source": "https://mokapos.com/en/about ; https://www.fortuneidn.com/tech/incar-pengguna-skala-besar-majoo-hadirkan-fitur-prime-plus-00-ccw2k-6zvb47 ; https://www.bi.go.id/en/publikasi/kajian/Documents/RP-MON-09-2024.pdf"}, {"id": "pu_free", "label_ja": "無料のレジ（登録）", "value": 5676700, "display_ja": "約568万（29%）", "basis": "仮", "kind": "無料", "note_ja": "銀行や GoTo などが無料で配るレジつきアプリに登録した店の数を足した。BI の調査ではレジアプリを使う小さな店は9.24%（この分母なら約182万）だけなので、多くは代金の受け取りだけの店や使っていない店で、2つに登録した店の重なりも入る。", "source": "https://wartaekonomi.co.id/read578524/bank-mandiri-klaim-livin-merchant-digunakan-27-juta-pedagang ; https://www.bi.go.id/en/publikasi/kajian/Documents/RP-MON-09-2024.pdf"}, {"id": "pu_none", "label_ja": "使っていない", "value": 13811800, "display_ja": "約1,381万（70%）", "basis": "仮", "kind": "使っていない", "note_ja": "全体から有料と無料の登録を引いた残り。BI の調査では9割以上の店がレジアプリを使っていないので、本当はもっと多い（9割なら約1,790万）とみられる。", "source": "https://www.bi.go.id/en/publikasi/kajian/Documents/RP-MON-09-2024.pdf"}], "jp_note_ja": "日本は、タブレットのレジ（無料の Airレジ 78.9万を含む）を持つ店が約88万。店のある小売・飲食134万〜166万の約53〜66%にあたる。有料だけ（スマレジ4.8万＋ユビレジ4.2万）で見ると3〜7%で、チェーンの据え置き型レジは入っていない。"}, {"id": "pos_players", "title_ja": "有料レジの会社別", "total": 231500, "total_display_ja": "約23万", "year": "2021〜2026", "basis": "仮", "note_ja": "お金を払ってレジアプリを使う店を会社ごとに分けた。各社の数はほぼ自称で時点もばらばらで、BI の調査の割合では majoo は Moka の1/3なのに自称は同じ数なので、自称は多めに出やすい。", "source": "/Users/sohayashi/llmohack/id/pos-research/stage4_whitespace.json ; https://www.bi.go.id/en/publikasi/kajian/Documents/RP-MON-09-2024.pdf", "parent_node": "pos_usage", "parent_slice": "pu_paid", "edge_label_ja": "有料を会社ごとに", "slices": [{"id": "pp_moka", "label_ja": "Moka（GoTo）", "value": 45000, "display_ja": "4.5万", "basis": "確か", "kind": "有料", "note_ja": "自称「4.5万+の事業者」。無料プランが無いので全部有料と見た。2020年の4万からほぼ横ばい。", "source": "https://mokapos.com/en/about"}, {"id": "pp_majoo", "label_ja": "majoo", "value": 45000, "display_ja": "4.5万", "basis": "確か", "kind": "有料", "note_ja": "自称「有料の客4.5万+」（2024年1月。2025年9月も同じ数）。無料の majoolite は入れていない。", "source": "https://www.fortuneidn.com/tech/incar-pengguna-skala-besar-majoo-hadirkan-fitur-prime-plus-00-ccw2k-6zvb47"}, {"id": "pp_kasirpintar", "label_ja": "Kasir Pintar Pro", "value": 47000, "display_ja": "約4.7万", "basis": "仮", "kind": "有料", "note_ja": "自称「150万の店が使った」（2023年ごろの累計）に、Qasir の有料の割合3.1%をかけた仮の数。Qasir の有料には1回だけ買う追加機能の客も入るので多めの可能性があり、この中でいちばん根拠が弱い。", "source": "https://beritajatim.com/?p=1059576"}, {"id": "pp_qasir", "label_ja": "Qasir Pro", "value": 22000, "display_ja": "約2.2万", "basis": "仮", "kind": "有料", "note_ja": "2021年春に「登録70万のうち有料2.2万」と発表（自称。1回払いの追加機能の客も入る）。新しい数が無いので、そのまま今の数とした。", "source": "https://en.dailysocial.id/post/qasir-pos-startup-plans-to-expand-its-business-to-Southeast-Asia-this-year"}, {"id": "pp_olsera", "label_ja": "Olsera", "value": 18000, "display_ja": "1.8万", "basis": "確か", "kind": "有料", "note_ja": "自称「有料の店1.8万+」（2023年9月）。サイトの「8.5万+」はこれまでの累計。", "source": "https://gizmologi.id/news/olsera-teken-mou-astrapay/"}, {"id": "pp_iseller", "label_ja": "iSeller", "value": 13000, "display_ja": "約1.3万", "basis": "仮", "kind": "有料", "note_ja": "自称「6万+の店が使った」は累計。Olsera の有料÷累計（1.8万÷8.5万＝約2割）をかけた仮の数。", "source": "https://www.isellercommerce.com/id"}, {"id": "pp_mekari", "label_ja": "Mekari POS", "value": 11500, "display_ja": "約1.2万", "basis": "推計", "kind": "有料", "note_ja": "BI の調査の割合（Jurnal POS 12.82%、Moka 50.11%）で、Moka 4.5万から割り戻した計算値。同じ計算だと majoo は1.5万で自称の1/3になるので、少なめの可能性がある。", "source": "https://www.bi.go.id/en/publikasi/kajian/Documents/RP-MON-09-2024.pdf"}, {"id": "pp_esb", "label_ja": "ESB", "value": 6000, "display_ja": "約0.6万", "basis": "仮", "kind": "有料", "note_ja": "自称「3万+のレストラン」はインドネシア・東南アジア・欧州の合計で、無料の POSLite が入るかは不明。iSeller と同じく約2割とした仮の数。", "source": "https://www.esb.id/en"}, {"id": "pp_pawoon", "label_ja": "Pawoon", "value": 4000, "display_ja": "約0.4万", "basis": "推計", "kind": "有料", "note_ja": "BI の調査の割合（4.62%）で Moka から割り戻した計算値（約4,100）。Mekari と同じく少なめの可能性があり、2019年の「10万+」は無料も入った古い数。", "source": "https://www.bi.go.id/en/publikasi/kajian/Documents/RP-MON-09-2024.pdf"}, {"id": "pp_other", "label_ja": "ほか・不明", "value": 20000, "display_ja": "約2万", "basis": "仮", "kind": "その他", "note_ja": "iREAP Pro・Loyverse の有料機能・Jubelio・Accurate・HashMicro など、数が出ていない会社をまとめて仮に2万とした。", "source": "https://www.ireappos.com/"}]}, {"id": "pos_free", "title_ja": "無料レジの道具別", "total": 5676700, "total_display_ja": "約568万", "year": "2020〜2026", "basis": "仮", "note_ja": "無料のレジつきアプリに登録した店を道具ごとに分けた。登録や発表の数なので、使っていない店や代金の受け取りだけの店、重なりも入る。", "source": "/Users/sohayashi/llmohack/id/pos-research/stage4_whitespace.json", "parent_node": "pos_usage", "parent_slice": "pu_free", "edge_label_ja": "無料を道具ごとに", "slices": [{"id": "pf_livin", "label_ja": "Livin' Merchant", "value": 2700000, "display_ja": "270万", "basis": "確か", "kind": "無料", "note_ja": "Mandiri 銀行の発表「270万+の商人」（2025年8月、自称）。QRIS の受け取りだけの店も入り、6か月使っていない口座を消したので今は減っている可能性。", "source": "https://wartaekonomi.co.id/read578524/bank-mandiri-klaim-livin-merchant-digunakan-27-juta-pedagang"}, {"id": "pf_kasirpintar", "label_ja": "Kasir Pintar 無料", "value": 1453000, "display_ja": "約145万", "basis": "仮", "kind": "無料", "note_ja": "自称の累計150万（2023年ごろ）から、有料の仮4.7万を引いた。やめた店も入る。", "source": "https://beritajatim.com/?p=1059576"}, {"id": "pf_gokasir", "label_ja": "GoKasir（GoTo）", "value": 1000000, "display_ja": "約100万", "basis": "仮", "kind": "無料", "note_ja": "GoKasir だけの数は非公開なので、レジが入った GoFood の店用アプリを持つ店（2022年・自称100万）を全部数えた。実際にレジとして使う店はずっと少ないはず。", "source": "https://teknologi.bisnis.com/read/20220131/266/1495410/punya-1-juta-mitra-gofood-"}, {"id": "pf_bri", "label_ja": "BRImerchant", "value": 323700, "display_ja": "約32万", "basis": "仮", "kind": "無料", "note_ja": "BRImerchant だけの数は非公開。BRI の加盟店32.37万（2026年1〜3月）を全部数えた。", "source": "https://www.metrotvnews.com/read/NQAC0jz7-transformasi-digital-bri-pacu-pertumbuhan-merchant-dan-transaksi-qris-tingkatkan-akses-keuangan-ekosistem-danantara"}, {"id": "pf_youtap", "label_ja": "Youtap", "value": 150000, "display_ja": "約15万", "basis": "仮", "kind": "無料", "note_ja": "2020年ごろの自称「15万の店」をそのまま今の数とした。新しい数は見つからない。", "source": "https://en.dailysocial.id/post/youtap-Indonesia-focuses-on-merchants/"}, {"id": "pf_other", "label_ja": "ほか（無料）", "value": 50000, "display_ja": "約5万", "basis": "仮", "kind": "その他", "note_ja": "Loyverse（世界35万を人口の比3.5%で約1.2万）と iREAP（国内分約1.3万・2016年の数）に、数の無い majoolite・ESB POSLite を足して仮に5万とした。BNI の wondr Merchant（2026年8月開始）や GrabMerchant など数の出ていない無料アプリは入れていない。", "source": "https://loyverse.com/ ; https://www.ireappos.com/news/?p=331 ; https://finansial.bisnis.com/read/20260824/90/1998611/bni-luncurkan-wondr-merchant-settlement-dana-hingga-lima-kali-sehari"}]}, {"id": "acct_usage", "title_ja": "法人の会計・税の道具", "total": 1080000, "total_display_ja": "108万社", "year": "2025年分（期限2026年5月末）", "basis": "確か", "note_ja": "2025年分の法人の税の申告を、期限の2026年5月末までに出した会社の数です（国の税務署 DJP）。出す義務がある206万（2024年）の約半分しか出していないので、動いている会社として108万を使い、国の無料の申告システム（Coretax）はほぼ全社が使うので道具には数えていません。", "source": "https://news.ddtc.co.id/berita/nasional/1821494/djp-1212-juta-wp-op-dan-108-juta-wp-badan-lapor-spt-tepat-waktu", "parent_node": "cut_legal", "parent_slice": "legal_filed", "edge_label_ja": "帳簿の道具で分けると", "slices": [{"id": "acct_paid", "label_ja": "有料ソフト", "value": 255000, "display_ja": "約25.5万", "basis": "仮", "kind": "有料", "note_ja": "お金を払って会計・税ソフトを使う会社の合計です（会社ごとの内訳は次のパイ）。確かな数は Accurate と Jurnal の14.5万だけで、名前の出ている会社の数には個人の店や2つ使う会社の重なりも入るので多めです。", "source": "https://accurate.id/tentang-accurate/"}, {"id": "acct_free_s", "label_ja": "無料アプリだけ", "value": 345000, "display_ja": "約34.5万", "basis": "仮", "kind": "無料", "note_ja": "無料の会計・税アプリだけを使う法人です。法人だけの数はどこにも出ていないので、Kledo と OnlinePajak の無料の分に、BukuWarung と Paper.id の法人の分（仮の割合）を足しました。", "source": "https://bukuwarung.com/"}, {"id": "acct_none", "label_ja": "使っていない", "value": 480000, "display_ja": "約48万", "basis": "仮", "kind": "使っていない", "note_ja": "108万から上の2つを引いた残りです。紙や Excel を使う会社と、外の会計士に任せきりの会社が入ります。参考：事業者全体では8割がまだ手でお金と在庫を記録しています（OCBC の調査、2023年）。", "source": "https://www.fortuneidn.com/finance/80-umkm-ri-masih-catat-keuangan-manual-pahami-fungsi-digitalisasi-00-ccw2k-3cjmgn"}], "jp_note_ja": "日本は有料の会計ソフトだけで、法人と青色申告の個人812万のうち26%以上が使っています（freee・マネーフォワード・弥生・TKC の4社で208.5万、2026年）。法人だけで見ても、freee と TKC の2社で約2割です。"}, {"id": "acct_players", "title_ja": "有料ソフトの会社別", "total": 255000, "total_display_ja": "約25.5万社", "year": "2026-11-23 閲覧（各社の自称）", "basis": "仮", "note_ja": "有料で会計・税ソフトを使う会社を、ソフトを売る会社ごとに分けました。名前の出ている数はどれも各社の自称でページに日付がなく、大企業の分と「ほか」は仮です。", "source": "https://accurate.id/tentang-accurate/", "parent_node": "acct_usage", "parent_slice": "acct_paid", "edge_label_ja": "どの会社のソフトか", "slices": [{"id": "ap_accurate", "label_ja": "Accurate", "value": 110000, "display_ja": "11万", "basis": "確か", "kind": "有料", "note_ja": "「契約している会社 11万+」（自称）。インドネシアの会社のソフトで、いちばん多いです。", "source": "https://accurate.id/tentang-accurate/"}, {"id": "ap_jurnal", "label_ja": "Mekari Jurnal", "value": 35000, "display_ja": "3.5万", "basis": "確か", "kind": "有料", "note_ja": "「インドネシアで3.5万+社」（自称）。無料プランはありません。東南アジアの5.5万や Mekari 全体の数は使っていません。", "source": "https://www.jurnal.id/id/"}, {"id": "ap_zahir", "label_ja": "Zahir", "value": 30000, "display_ja": "約3万", "basis": "仮", "kind": "有料", "note_ja": "公式トップは「9万+の事業者」（自称）ですが、長年売ってきた買い切り版の累計とみられます。公式の英語ページの「3万+社（インドネシアと海外、日付なし）」を使って3万としました。", "source": "https://zahiraccounting.com/en/?p=476"}, {"id": "ap_kledo", "label_ja": "Kledo（有料版）", "value": 15000, "display_ja": "約1.5万", "basis": "仮", "kind": "有料", "note_ja": "「7.5万+の会社・UMKM」（自称）は、ずっと無料のプランの客も入った数です。払っている割合は不明なので、2割として1.5万としました。", "source": "https://kledo.com/"}, {"id": "ap_onlinepajak", "label_ja": "OnlinePajak（有料）", "value": 15000, "display_ja": "約1.5万", "basis": "仮", "kind": "有料", "note_ja": "「15万+の事業者」（自称）は無料込みの税アプリです。申告は無料でできるので、払う割合を会計ソフトより低い1割として1.5万としました。", "source": "https://www.online-pajak.com/"}, {"id": "ap_klikpajak", "label_ja": "Klikpajak", "value": 3000, "display_ja": "約3千", "basis": "仮", "kind": "有料", "note_ja": "Mekari の税アプリです。「数千の会社」とだけ書いてあるので3,000としました。無料で始められ、Jurnal とセットの客も多いので、実際はこれより少ない可能性があります。", "source": "https://klikpajak.id/"}, {"id": "ap_hashmicro", "label_ja": "HashMicro", "value": 1750, "display_ja": "1,750", "basis": "仮", "kind": "有料", "note_ja": "「インドネシアで1,750社以上」（自称、日付なし。公式ページは開けず検索結果の要約から）。人事・在庫なども入った全製品の客の数で、会計を使う数は分からないのでそのまま入れました（多め）。", "source": "https://www.hashmicro.com/id/download-skema-harga/"}, {"id": "ap_bigerp", "label_ja": "大企業のSAP等", "value": 25000, "display_ja": "約2.5万", "basis": "仮", "kind": "有料", "note_ja": "大企業（年商 Rp500億超）は約5万社あり（UMKM省、2025年）、多くは SAP・Oracle・Microsoft などの大きな業務ソフトを使います。上の会社に入らない分を仮に半分として2.5万としました。", "source": "https://databoks.katadata.co.id/ekonomi-makro/statistik/6acf639d12f03/jumlah-usaha-mikro-kecil-menengah-dan-besar-di-indonesia-pada-2025"}, {"id": "ap_other", "label_ja": "ほか・不明", "value": 20250, "display_ja": "約2万", "basis": "仮", "kind": "その他", "note_ja": "MYOB・Odoo・Beecloud・Pajakku・レジについてくる会計機能など、中小向けで数が出ていない会社の分です。名前の出ている7社の合計（約21万）の1割ほどとしました。", "source": ""}]}, {"id": "acct_free", "title_ja": "無料アプリの会社別", "total": 345000, "total_display_ja": "約34.5万社", "year": "2026-11-23 閲覧（各社の自称）", "basis": "仮", "note_ja": "無料の会計・税アプリだけを使う法人を、アプリごとに分けました。会計・税のアプリ（OnlinePajak・Kledo）は客を全部法人とし、小さな店向けの BukuWarung・Paper.id だけ仮の割合を掛けています。どれも登録の累計とみられ、重なりも引いていないので多めです。", "source": "https://bukuwarung.com/", "parent_node": "acct_usage", "parent_slice": "acct_free_s", "edge_label_ja": "どの無料アプリか", "slices": [{"id": "af_onlinepajak", "label_ja": "OnlinePajak（無料）", "value": 135000, "display_ja": "約13.5万", "basis": "仮", "kind": "無料", "note_ja": "「15万+の事業者」（自称）から、有料と置いた1.5万を引いた残りです。税の申告だけを無料で使う会社です。", "source": "https://www.online-pajak.com/"}, {"id": "af_bukuwarung", "label_ja": "BukuWarung", "value": 80000, "display_ja": "約8万", "basis": "仮", "kind": "無料", "note_ja": "「800万+の店主」（自称）は登録の数で、今も使う数ではありません。ほとんどが個人の小さな店なので、法人の割合を全事業者の約2%の半分の1%として8万としました。", "source": "https://bukuwarung.com/"}, {"id": "af_paperid", "label_ja": "Paper.id", "value": 70000, "display_ja": "約7万", "basis": "仮", "kind": "無料", "note_ja": "「70万+の事業者」（自称）。請求書が中心で、会社どうしの取引に使う店が多いです。法人の割合は不明なので、1割として7万としました。", "source": "https://www.paper.id/"}, {"id": "af_kledo", "label_ja": "Kledo（無料版）", "value": 60000, "display_ja": "約6万", "basis": "仮", "kind": "無料", "note_ja": "「7.5万+」（自称）から、有料と置いた1.5万を引いた残りです。", "source": "https://kledo.com/"}]}, {"id": "hr_usage", "title_ja": "人事ソフトの使い方", "total": 875641, "total_display_ja": "87.6万社", "year": "2025-12（会社の数）・2026-11（各社の数）", "basis": "確か", "note_ja": "人を雇って労働保険（BPJS）に入る会社87.6万社を、人事・給与・勤怠のクラウドソフトの使い方で分けた。全体の数は確かだが、有料と無料の数は各社の自称を足した仮の値。", "source": "https://www.bpjsketenagakerjaan.go.id/assets/uploads/laporan_tahunan/IR_2025.pdf", "parent_node": "cut_employer", "parent_slice": null, "edge_label_ja": "人事ソフトの使い方で", "slices": [{"id": "hu_paid", "label_ja": "有料の人事ソフト", "value": 43450, "display_ja": "約4.3万社（5%）", "basis": "仮", "kind": "有料", "note_ja": "会社ごとの数（自称と仮の値）を足したもの。お試し中や解約した会社、1社が2つのソフトを使う重なりが入っていれば、本当はもっと少ない。", "source": "/Users/sohayashi/llmohack/id/pos-research/stage4_whitespace.json"}, {"id": "hu_free", "label_ja": "無料の道具だけ", "value": 17250, "display_ja": "約1.7万社（2%）", "basis": "仮", "kind": "無料", "note_ja": "GajiHub や Jibble など、ずっと無料のプランだけで勤怠をつけている会社の目安。どれも仮の値の足し算で、労働保険に入っていない店も混ざりうるので、本当はもっと少ないかもしれない。", "source": "https://gajihub.com/ https://www.jibble.io/about"}, {"id": "hu_none", "label_ja": "使っていない", "value": 814941, "display_ja": "約81.5万社（93%）", "basis": "仮", "kind": "使っていない", "note_ja": "87.6万社から有料と無料を引いた残り。給与は表計算（Excel）や手計算、指紋の勤怠機械やパソコンに入れる箱のソフトで回していると見られる。割合を調べた統計は見つからなかった。", "source": "https://www.talenta.co/en/blog/hris-landscape-indonesia/"}], "jp_note_ja": "日本は人事・給与・勤怠のクラウド大手の客を足すと21.5万〜101.1万社で、会社の数（206.5万〜368.4万）の約6〜49%。箱のソフトも入れると、1,000人以下の会社の7〜8割が何かのソフトを使っている（freee 調べ）。"}, {"id": "hr_players", "title_ja": "有料の客は誰のもの", "total": 43450, "total_display_ja": "約4.3万社", "year": "2022〜2026（各社の発表の時点はばらばら）", "basis": "仮", "note_ja": "有料で使う約4.3万社を会社ごとに分けた。数は各社の自称で、同じグループの重なり（Gadjian と Hadirr、GreatDay と SunFish）は引いていない。", "source": "/Users/sohayashi/llmohack/id/pos-research/stage4_whitespace.json", "parent_node": "hr_usage", "parent_slice": "hu_paid", "edge_label_ja": "有料の客を会社ごとに", "slices": [{"id": "hp_gadjian", "label_ja": "Gadjian", "value": 10000, "display_ja": "1万社", "basis": "確か", "kind": "有料", "note_ja": "「1万超の事業者」と自称（2025年7月）。無料体験の会社を含むかは不明。Hadirr と同じ Fast-8 グループ。", "source": "https://web.archive.org/web/20250713053523/https://gadjian.com/"}, {"id": "hp_talenta", "label_ja": "Mekari Talenta", "value": 6000, "display_ja": "約6,000社", "basis": "仮", "kind": "有料", "note_ja": "Talenta だけの数は2022年7月の3,500社（自称）が最後。Mekari 全体と同じ年14%ほどで4年あまり伸びたとして約6,000社とした。サイトの「3.5万社超」は Mekari の全製品の数と見た。", "source": "https://web.archive.org/web/20220704104046/https://www.talenta.co/ https://www.mekari.com/"}, {"id": "hp_kantorku", "label_ja": "KantorKu", "value": 5000, "display_ja": "5,000社", "basis": "確か", "kind": "有料", "note_ja": "「インドネシアの5,000社超」と自称（2026年11月に閲覧）。Dealls グループの製品。無料体験の会社を含むかは不明。", "source": "https://kantorku.id/"}, {"id": "hp_majoo", "label_ja": "majoo の勤怠", "value": 4500, "display_ja": "約4,500社", "basis": "仮", "kind": "有料", "note_ja": "レジの majoo は「従業員の機能で4.5万の店を助けた」と自称。勤怠は一番安いプランから付くので、これは有料の店ほぼ全部の数。小・中の会社で労働保険に入るのは約6%（12万÷186万）なので、少し多めの1割と見て4,500とした。", "source": "https://majoo.id/aplikasi-karyawan https://majoo.id/harga"}, {"id": "hp_greatday", "label_ja": "GreatDay HR", "value": 2800, "display_ja": "約2,800社", "basis": "仮", "kind": "有料", "note_ja": "「4,000社超」と自称するが、これは東南アジア全体の数（ページに「東南アジアの数千社」とある）。国ごとの数は不明なので、SunFish と同じく7割が国内として2,800社とした。", "source": "https://greatdayhr.com/"}, {"id": "hp_sunfish", "label_ja": "SunFish", "value": 1400, "display_ja": "約1,400社", "basis": "仮", "kind": "有料", "note_ja": "東南アジアなど全体で「2,000社超」と自称。国ごとの数は不明なので、本社がジャカルタなことから7割が国内として1,400社とした。GreatDay と同じ DataOn の製品。", "source": "https://www.dataon.com/"}, {"id": "hp_hadirr", "label_ja": "Hadirr", "value": 1000, "display_ja": "1,000社", "basis": "確か", "kind": "有料", "note_ja": "Hadirr だけの数は2023・2024年の「1,000社超」（自称）。今のページの「1万社超」はグループ全体の数なので使わない。", "source": "https://web.archive.org/web/20240703230719/https://hadirr.com/"}, {"id": "hp_linovhr", "label_ja": "LinovHR", "value": 1000, "display_ja": "約1,000社", "basis": "仮", "kind": "有料", "note_ja": "今のページは「数千社」とだけ書いてある。2025年7月は「500社超」だったので、一番少ない読み方の1,000社とした。", "source": "https://www.linovhr.com/"}, {"id": "hp_gajihub", "label_ja": "GajiHub（有料）", "value": 1000, "display_ja": "約1,000社", "basis": "仮", "kind": "有料", "note_ja": "「1万社超」と自称（無料プランの会社を含む）。給与を使うにはお金が要るが、払う割合は不明なので1割の1,000社とした。", "source": "https://gajihub.com/"}, {"id": "hp_kerjoo", "label_ja": "Kerjoo（有料）", "value": 750, "display_ja": "約750社", "basis": "仮", "kind": "有料", "note_ja": "「1,500社超」と自称（2人まで無料の会社を含む）。払う割合は不明なので半分の750社とした。", "source": "https://web.archive.org/web/20260715074327/https://kerjoo.com/"}, {"id": "hp_other", "label_ja": "ほか・不明", "value": 10000, "display_ja": "約1万社", "basis": "仮", "kind": "有料", "note_ja": "人事ソフトの会社は50〜70社ある（Talenta のブログ）。数を出していない CATAPA・PintarHR・Jojonomic・HashMicro やレジの勤怠（Olsera・Qasir・Moka）など約50社が、平均200社ずつ持つとして1万社とした。", "source": "https://www.talenta.co/en/blog/hris-landscape-indonesia/"}]}, {"id": "hr_free", "title_ja": "無料の客は誰のもの", "total": 17250, "total_display_ja": "約1.7万社", "year": "2026-11", "basis": "仮", "note_ja": "無料の道具だけを使う約1.7万社を道具ごとに分けた。どの会社も無料の客の数を出していないので、全部仮の値。労働保険に入っていない店も混ざりうる。", "source": "https://gajihub.com/ https://www.jibble.io/about", "parent_node": "hr_usage", "parent_slice": "hu_free", "edge_label_ja": "無料の客を道具ごとに", "slices": [{"id": "hf_gajihub", "label_ja": "GajiHub（無料）", "value": 9000, "display_ja": "約9,000社", "basis": "仮", "kind": "無料", "note_ja": "GajiHub の「1万社超」（自称）から、有料と仮定した1,000社を引いた残り。勤怠だけなら人数の上限なしでずっと無料。", "source": "https://gajihub.com/"}, {"id": "hf_jibble", "label_ja": "Jibble", "value": 4500, "display_ja": "約4,500社", "basis": "仮", "kind": "無料", "note_ja": "世界の利用者130万人（自称）。インドネシア分は不明なので、人口の比（約3.5%）で4.5万人、1社10人として4,500社とした。人数の上限なしで無料。人口の比は多めに出やすい。", "source": "https://www.jibble.io/about"}, {"id": "hf_kerjoo", "label_ja": "Kerjoo（無料）", "value": 750, "display_ja": "約750社", "basis": "仮", "kind": "無料", "note_ja": "Kerjoo の「1,500社超」（自称）のうち、有料と仮定した半分を引いた残り。2人までなら無料。", "source": "https://web.archive.org/web/20260715074327/https://kerjoo.com/"}, {"id": "hf_other", "label_ja": "ほか・不明", "value": 3000, "display_ja": "約3,000社", "basis": "仮", "kind": "無料", "note_ja": "ほかの無料の勤怠アプリや、無料お試し中の会社。数が出ていないので、上の3社の合計（約1.4万）の約2割として3,000社とした。", "source": "https://www.talenta.co/en/blog/hris-landscape-indonesia/"}]}], "satu_ids": ["target", "chat", "inbox_usage", "inbox_players"], "target_id": "target"}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
document.getElementById('updated').textContent = '（' + DATA.updated + ' 時点・仮の数字を含む）';
const nodes = DATA.nodes;
const byId = new Map(nodes.map(n => [n.id, n]));
nodes.forEach(n => { if (n.id !== 'root' && !byId.has(n.parent_node)) n.parent_node = 'root'; });
const H = d3.stratify().id(d => d.id).parentId(d => d.id === 'root' ? null : d.parent_node)(nodes);
const SATU = new Set(DATA.satu_ids || []);

// ---- layout (radial) ----
const RING = 340;
const tree = d3.tree().size([2 * Math.PI, 1]).separation((a, b) => (a.parent === b.parent ? 1 : 1.6) / Math.max(1, a.depth * 0.8));
tree(H);
const rOf = v => 18 + 20 * Math.log10(Math.max(v || 1, 1000) / 1000);
H.each(d => {
  const rad = d.depth * RING;
  d.px = rad * Math.cos(d.x - Math.PI / 2);
  d.py = rad * Math.sin(d.x - Math.PI / 2);
  d.r = rOf(d.data.total);
});

// ---- colors ----
const css = getComputedStyle(document.documentElement);
const cv = n => css.getPropertyValue(n).trim();
const CAT = ['#2f6f8f', '#c98a2b', '#8a5a9e', '#3f8f6a', '#b5525a', '#5b7bb8', '#8c7a4b', '#4f9aa0', '#a86a3d', '#6d7f3b', '#7c6bc4', '#9b4f7a'];
function sliceColor(node, s, i) {
  const multiPaid = node.slices.filter(x => x.kind === '有料').length >= 3;
  if (s.kind === '使っていない') return cv('--none');
  if (s.kind === 'その他' || /ほか|不明|その他/.test(s.label_ja)) return cv('--other');
  if (s.kind === '無料' && !multiPaid && node.slices.filter(x => x.kind === '無料').length < 3) return cv('--free');
  if (s.kind === '有料' && !multiPaid) return cv('--paid');
  return CAT[i % CAT.length];
}

// ---- svg ----
const svg = d3.select('#svg');
const defs = svg.append('defs');
const pat = defs.append('pattern').attr('id', 'hatch').attr('width', 6).attr('height', 6).attr('patternUnits', 'userSpaceOnUse').attr('patternTransform', 'rotate(45)');
pat.append('rect').attr('width', 2).attr('height', 6).attr('fill', cv('--hatch'));
// legend's tiny svg uses #hatch too (same document)
const world = svg.append('g');
const gEdges = world.append('g');
const gNodes = world.append('g');
const zoom = d3.zoom().scaleExtent([0.08, 6]).on('zoom', e => world.attr('transform', e.transform));
svg.call(zoom).on('dblclick.zoom', null);

const pie = d3.pie().sort(null).value(d => d._vis).startAngle(Math.PI / 2).endAngle(Math.PI * 2.5);
function arcsFor(d) {
  const tot = d3.sum(d.data.slices, s => Math.max(0, s.value)) || 1;
  d.data.slices.forEach(s => { s._vis = s.value > 0 ? Math.max(s.value, tot * 0.004) : 0; s._pct = s.value / (d.data.total || tot) * 100; });
  return pie(d.data.slices);
}

// edges
const childOfSlice = new Map();
H.descendants().forEach(d => { if (d.parent && d.data.parent_slice) childOfSlice.set(d.parent.id + '|' + d.data.parent_slice, d); });
H.descendants().forEach(d => { d._arcs = arcsFor(d); });
function anchor(d) {
  const p = d.parent; if (!p) return null;
  const a = p._arcs.find(x => x.data.id === d.data.parent_slice);
  if (!a) return [p.px, p.py, null];
  const ang = (a.startAngle + a.endAngle) / 2 - Math.PI / 2;
  return [p.px + Math.cos(ang) * p.r, p.py + Math.sin(ang) * p.r, ang];
}
const links = H.descendants().filter(d => d.parent);
const edge = gEdges.selectAll('g').data(links).join('g');
edge.append('path').attr('fill', 'none').attr('stroke', cv('--edge')).attr('stroke-width', 1.6)
  .attr('stroke-dasharray', d => d.data.parent_slice ? null : '5 5')
  .attr('d', d => {
    const [ax, ay, ang] = anchor(d);
    const dx = d.px - ax, dy = d.py - ay, L = Math.hypot(dx, dy) || 1;
    const ex = d.px - dx / L * d.r, ey = d.py - dy / L * d.r;
    const c1x = ang === null ? ax : ax + Math.cos(ang) * L * 0.35, c1y = ang === null ? ay : ay + Math.sin(ang) * L * 0.35;
    return `M${ax},${ay} Q${c1x},${c1y} ${ex},${ey}`;
  });
edge.append('text').attr('font-size', 13).attr('fill', cv('--muted')).attr('text-anchor', 'middle')
  .attr('x', d => { const [ax] = anchor(d); return (ax + d.px) / 2; })
  .attr('y', d => { const [, ay] = anchor(d); return (ay + d.py) / 2 - 6; })
  .text(d => d.data.edge_label_ja || '');

// nodes
const g = gNodes.selectAll('g.n').data(H.descendants()).join('g').attr('class', 'n')
  .attr('transform', d => `translate(${d.px},${d.py})`).style('cursor', 'pointer');
g.filter(d => SATU.has(d.id)).append('circle').attr('r', d => d.r + 9).attr('fill', 'none')
  .attr('stroke', cv('--accent')).attr('stroke-width', 2.5).attr('stroke-dasharray', '7 5');
g.each(function (d) {
  const sel = d3.select(this);
  const arc = d3.arc().innerRadius(d.r * 0.52).outerRadius(d.r).padAngle(0.006).cornerRadius(2);
  const gs = sel.append('g').selectAll('g').data(d._arcs).join('g').attr('class', 'sl');
  gs.append('path').attr('d', arc).attr('fill', (a, i) => sliceColor(d.data, a.data, i))
    .attr('stroke', a => a.data.kind === '使っていない' ? cv('--none-stroke') : cv('--panel')).attr('stroke-width', 1);
  gs.filter(a => a.data.basis === '仮').append('path').attr('d', arc).attr('fill', 'url(#hatch)').attr('pointer-events', 'none');
  gs.on('mousemove', (e, a) => showTip(e, d, a.data)).on('mouseleave', hideTip)
    .on('click', (e, a) => { e.stopPropagation(); const c = childOfSlice.get(d.id + '|' + a.data.id); focus(c || d, c ? null : a.data.id); });
  const fsz = Math.max(10, d.r * 0.12);
  const lab = d._arcs.filter(a => a.value > 0 && a.data._pct < 55).sort((a, b) => b.data.value - a.data.value).slice(0, 7).map(a => {
    const m = ((a.startAngle + a.endAngle) / 2) % (2 * Math.PI), t = m - Math.PI / 2;
    return { a, side: m < Math.PI ? 1 : -1, x: Math.cos(t) * (d.r + 8), y: Math.sin(t) * (d.r + 8) };
  });
  [1, -1].forEach(side => {           // 同じ側のラベルは重ならないよう縦にずらす
    const L = lab.filter(o => o.side === side).sort((p, q) => p.y - q.y);
    for (let i = 1; i < L.length; i++) if (L[i].y < L[i - 1].y + fsz * 1.25) L[i].y = L[i - 1].y + fsz * 1.25;
  });
  sel.append('g').selectAll('text').data(lab).join('text')
    .attr('x', o => o.x + o.side * 2).attr('y', o => o.y).attr('text-anchor', o => o.side > 0 ? 'start' : 'end')
    .attr('dy', '0.35em').attr('font-size', fsz).attr('fill', cv('--muted')).attr('pointer-events', 'none')
    .text(o => o.a.data.label_ja + ' ' + fmtPct(o.a.data._pct));
  sel.append('circle').attr('r', d.r * 0.5).attr('fill', cv('--panel')).on('click', e => { e.stopPropagation(); focus(d); });
  sel.append('text').attr('text-anchor', 'middle').attr('dy', '0.35em').attr('font-weight', 700)
    .attr('font-size', Math.max(11, d.r * 0.24)).attr('fill', cv('--ink')).attr('pointer-events', 'none')
    .text(short(d.data.total));
  const below = lab.filter(o => Math.abs(o.x) < d.r * 0.95 && o.y > 0).map(o => o.y);
  const ty = Math.max(d.r + 20, below.length ? d3.max(below) + fsz + 12 : 0);
  const t = sel.append('text').attr('text-anchor', 'middle').attr('y', ty).attr('pointer-events', 'none');
  t.append('tspan').attr('font-size', Math.max(13, d.r * 0.17)).attr('font-weight', 700).attr('fill', cv('--ink')).text(d.data.title_ja);
  t.append('tspan').attr('x', 0).attr('dy', Math.max(16, d.r * 0.2)).attr('font-size', Math.max(11.5, d.r * 0.14)).attr('fill', cv('--muted'))
    .text(d.data.total_display_ja + (d.data.basis === '仮' ? '（仮）' : ''));
});

function short(v) {
  if (v == null) return '?';
  if (v >= 1e8) return (v / 1e8).toFixed(1).replace(/\.0$/, '') + '億';
  if (v >= 1e4) { const m = v / 1e4; return (m >= 100 ? Math.round(m).toLocaleString() : m.toFixed(1).replace(/\.0$/, '')) + '万'; }
  return Math.round(v).toLocaleString();
}
function fmtPct(p) { return p >= 10 ? p.toFixed(0) + '%' : p >= 1 ? p.toFixed(1) + '%' : p >= 0.1 ? p.toFixed(2) + '%' : '0.1%未満'; }

// tooltip
const tip = document.getElementById('tip');
function showTip(e, d, s) {
  const box = document.getElementById('stage').getBoundingClientRect();
  tip.innerHTML = `<b>${esc(s.label_ja)}</b><br>${esc(s.display_ja)}　<span class="pct">${fmtPct(s._pct)}</span>${s.basis === '仮' ? ' <span class="badge kari">仮</span>' : ''}`
    + (childOfSlice.get(d.id + '|' + s.id) ? '<br><span class="go-tag">押すと中を見る →</span>' : '');
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX - box.left + 14, box.width - 270) + 'px';
  tip.style.top = (e.clientY - box.top + 14) + 'px';
}
function hideTip() { tip.style.display = 'none'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// panel
const panel = document.getElementById('panel');
function render(d, hlSlice) {
  const n = d.data;
  const crumbs = d.ancestors().reverse().map((a, i, arr) => i === arr.length - 1 ? `<b>${esc(a.data.title_ja)}</b>` : `<a data-id="${a.id}">${esc(a.data.title_ja)}</a>`).join(' › ');
  const kids = (d.children || []).filter(c => !c.data.parent_slice);
  let rows = d._arcs.map((a, i) => {
    const s = a.data, c = childOfSlice.get(d.id + '|' + s.id);
    return `<tr class="row ${c ? 'go' : ''} ${hlSlice === s.id ? 'hl' : ''}" ${c ? `data-id="${c.id}"` : ''}>
      <td style="width:18px"><i class="sw" style="background:${sliceColor(n, s, i)}"></i></td>
      <td>${esc(s.label_ja)}${s.basis === '仮' ? '<span class="badge kari">仮</span>' : s.basis === '推計' ? '<span class="badge">推計</span>' : ''}
        ${c ? '<span class="go-tag">　中を見る →</span>' : ''}
        ${s.note_ja ? `<div class="small">${esc(s.note_ja)}</div>` : ''}</td>
      <td class="num">${esc(s.display_ja)}<div class="pct">${fmtPct(s._pct)}</div></td></tr>`;
  }).join('');
  const more = kids.length ? `<div class="meta" style="margin-top:14px">ここから分かれるパイ：</div>` + kids.map(c => `<button data-id="${c.id}" style="margin:0 6px 6px 0">${esc(c.data.title_ja)} →</button>`).join('') : '';
  panel.innerHTML = `<div class="crumbs">${crumbs}</div>
    <h2>${esc(n.title_ja)}${SATU.has(d.id) ? '<span class="badge kari">Satu Inbox の狙い</span>' : ''}</h2>
    <div class="total">${esc(n.total_display_ja)}</div>
    <div class="meta">${esc(n.year)}<span class="badge ${n.basis === '仮' ? 'kari' : ''}">${esc(n.basis)}</span></div>
    ${n.note_ja ? `<div class="note">${esc(n.note_ja)}</div>` : ''}
    ${n.jp_note_ja ? `<div class="jp"><b>日本だと：</b>${esc(n.jp_note_ja)}</div>` : ''}
    <table>${rows}</table>${more}
    ${n.source ? `<div class="src" style="margin-top:14px">出典：${linkify(n.source)}</div>` : ''}`;
  panel.querySelectorAll('[data-id]').forEach(el => el.addEventListener('click', () => focus(H.find(x => x.id === el.dataset.id))));
  panel.scrollTop = 0;
}
function linkify(s) { return esc(s).replace(/(https?:\/\/[^\s、，,）)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }

// focus / zoom
function size() { const r = svg.node().getBoundingClientRect(); return [r.width, r.height]; }
function focus(d, hlSlice) {
  if (!d) return;
  render(d, hlSlice);
  const [w, h] = size();
  const near = [d].concat(d.children || []).concat(d.parent ? [d.parent] : []);
  const bx = near.map(x => [x.px - x.r - 90, x.px + x.r + 90, x.py - x.r - 50, x.py + x.r + 80]);
  const x0 = Math.min(d3.min(bx, v => v[0]), d.px - d.r - 140), x1 = Math.max(d3.max(bx, v => v[1]), d.px + d.r + 140);
  const y0 = Math.min(d3.min(bx, v => v[2]), d.py - d.r - 100), y1 = Math.max(d3.max(bx, v => v[3]), d.py + d.r + 120);
  const k = Math.min(2.6, Math.min(w / (x1 - x0), h / (y1 - y0)));
  const cx = d.px * 0.6 + (x0 + x1) / 2 * 0.4, cy = d.py * 0.6 + (y0 + y1) / 2 * 0.4;
  svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity.translate(w / 2 - cx * k, h / 2 - cy * k).scale(k));
  g.attr('opacity', x => x === d || x.parent === d || d.parent === x ? 1 : 0.55);
}
function fitAll() {
  const [w, h] = size();
  const xs = H.descendants().map(d => [d.px - d.r - 60, d.px + d.r + 60, d.py - d.r - 40, d.py + d.r + 70]);
  const x0 = d3.min(xs, v => v[0]), x1 = d3.max(xs, v => v[1]), y0 = d3.min(xs, v => v[2]), y1 = d3.max(xs, v => v[3]);
  const k = Math.min(w / (x1 - x0), h / (y1 - y0)) * 0.95;
  svg.transition().duration(650).call(zoom.transform, d3.zoomIdentity.translate(w / 2 - (x0 + x1) / 2 * k, h / 2 - (y0 + y1) / 2 * k).scale(k));
  g.attr('opacity', 1);
  render(H);
}
document.getElementById('b-all').onclick = fitAll;
document.getElementById('lg-x').onclick = () => document.getElementById('legend').style.display = 'none';
document.getElementById('b-root').onclick = () => focus(H);
document.getElementById('b-target').onclick = () => focus(H.find(x => x.id === (DATA.target_id || 'target')));
svg.on('click', () => {});
focus(H);
window.addEventListener('resize', () => {});
})();
</script>
</body>
</html>
