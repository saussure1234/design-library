<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>インドネシア 狙いの絞り込み</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1c1c1e; --sub:#62626a; --faint:#8e8e95; --line:#e4e2dc;
  --go:#1f7a5a; --go-bar:#2f9c74; --go-soft:#dcf1e7;
  --later:#9a6512; --later-bar:#e3b65c; --later-soft:#f7ecd6;
  --no:#6e6e74; --no-bar:#c9c8c4; --no-soft:#efeeea;
  --taken:#c4512b; --open:#cfeedd;
  --best:#0f6b4b;
  --hatch:rgba(255,255,255,.45);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141416; --card:#1e1e21; --ink:#ececef; --sub:#a6a6ad; --faint:#7d7d84; --line:#2f2f34;
    --go:#6fd3a6; --go-bar:#2f9c74; --go-soft:#173a2c;
    --later:#e8bf6e; --later-bar:#b9873a; --later-soft:#3a2f1a;
    --no:#a3a3a9; --no-bar:#55555b; --no-soft:#2a2a2e;
    --taken:#e07a55; --open:#1d3a2d; --best:#6fd3a6;
    --hatch:rgba(0,0,0,.35); --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141416; --card:#1e1e21; --ink:#ececef; --sub:#a6a6ad; --faint:#7d7d84; --line:#2f2f34;
  --go:#6fd3a6; --go-bar:#2f9c74; --go-soft:#173a2c;
  --later:#e8bf6e; --later-bar:#b9873a; --later-soft:#3a2f1a;
  --no:#a3a3a9; --no-bar:#55555b; --no-soft:#2a2a2e;
  --taken:#e07a55; --open:#1d3a2d; --best:#6fd3a6;
  --hatch:rgba(0,0,0,.35); --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:.02em}
.lead{color:var(--sub);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.summary{padding:16px 18px;margin-bottom:28px}
.summary ol{margin:0;padding-left:1.3em}
.summary li{margin:4px 0}
.summary b{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px}
.sw.go{background:var(--go-bar)} .sw.later{background:var(--later-bar)} .sw.no{background:var(--no-bar)}
.sw.kari{background:var(--no-bar);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 5px)}
h2{font-size:18px;margin:34px 0 4px}
h2 small{font-weight:400;color:var(--sub);font-size:13px;margin-left:6px}
.h2lead{color:var(--sub);font-size:13.5px;margin:0 0 14px}

.step{padding:16px 18px 10px}
.stephead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.stepno{font-size:12px;color:var(--faint);font-weight:700;letter-spacing:.06em}
.steptitle{font-size:17px;font-weight:700}
.steptotal{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.axis{margin-left:auto;font-size:12.5px;color:var(--sub);background:var(--no-soft);border-radius:999px;padding:2px 10px}
.bar{display:flex;height:44px;border-radius:8px;overflow:hidden;gap:2px;background:var(--line)}
.seg{position:relative;min-width:3px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;cursor:pointer;transition:filter .15s}
.seg:hover,.seg.hl{filter:brightness(1.08) saturate(1.1)}
.seg.go{background:var(--go-bar)} .seg.later{background:var(--later-bar);color:#3d2a08} .seg.no{background:var(--no-bar);color:#3a3a3e}
.seg.kari{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 2px,transparent 2px 6px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg.later,:root:not([data-theme="light"]) .seg.no{color:#fff}}
:root[data-theme="dark"] .seg.later,:root[data-theme="dark"] .seg.no{color:#fff}
.rows{margin-top:10px}
.row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:2px 10px;padding:9px 6px;border-top:1px solid var(--line);border-radius:6px;transition:background .2s}
.row:first-child{border-top:0}
.row.hl{background:var(--no-soft)}
.row .sw{margin-top:6px}
.rname{font-weight:700}
.rnum{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rnum b{font-size:15px}
.rnum .pct{color:var(--sub);font-size:12.5px;margin-left:6px}
.rreason{grid-column:2 / 4;color:var(--sub);font-size:13px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 7px;margin-left:8px;vertical-align:1px}
.tag.go{background:var(--go-soft);color:var(--go)} .tag.later{background:var(--later-soft);color:var(--later)} .tag.no{background:var(--no-soft);color:var(--no)}
.tag.best{background:var(--go-bar);color:#fff}
.basis{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px;white-space:nowrap}
a{color:inherit;text-decoration-color:var(--faint);text-underline-offset:2px}
a.src{color:var(--faint);font-size:12px;margin-left:6px;white-space:nowrap}
.stepnote{font-size:12.5px;color:var(--faint);margin:6px 6px 4px}
.conn{display:block;width:100%;height:34px}
.conn polygon{fill:var(--go-soft)}

.target{padding:18px;border:2px solid var(--go-bar);background:var(--go-soft)}
.target .t1{font-size:13px;color:var(--go);font-weight:700;letter-spacing:.04em}
.target .t2{font-size:22px;font-weight:800;margin:2px 0}
.target .t3{font-size:13.5px;color:var(--sub)}
.formula{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px}
.formula span{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 8px}

.tools{display:grid;gap:12px}
.tool{padding:16px 18px}
.toolhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.toolname{font-size:17px;font-weight:700}
.toolsub{font-size:12.5px;color:var(--sub);width:100%}
.tpct{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.tpct .c{color:var(--taken)} .tpct .o{color:var(--go)}
.tbar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:4px 0 6px;background:var(--open)}
.tbar .taken{background:var(--taken);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;padding-left:8px;white-space:nowrap;min-width:3px}
.tbar .open{flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:12px;font-weight:700;color:var(--go)}
.tnums{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:13px;color:var(--sub)}
.tnums b{color:var(--ink);font-variant-numeric:tabular-nums}
.tline{margin-top:8px;font-size:13.5px}
.tline .k{display:inline-block;min-width:5.5em;color:var(--faint);font-size:12.5px}
.tline.act{font-weight:700}
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;font-size:13px;color:var(--sub);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--faint)}
details[open] summary::before{content:"▾ "}
.plist{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.plist td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.plist td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.plist .pn{color:var(--sub);font-size:12px;margin-top:2px}
.how{font-size:12.5px;color:var(--faint);margin-top:6px}
.jp{font-size:12.5px;color:var(--sub);margin-top:8px;background:var(--no-soft);border-radius:6px;padding:6px 10px}

footer{margin-top:36px;font-size:12.5px;color:var(--faint)}
footer ul{padding-left:1.2em;margin:6px 0}
.themebtn{position:fixed;top:12px;right:12px;font-size:12px;background:var(--card);color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
@media (max-width:600px){
  h1{font-size:20px}
  .axis{margin-left:0}
  .steptitle,.steptotal{font-size:16px}
  .bar{height:38px}
  .seg{font-size:11.5px}
  .target .t2{font-size:19px}
}
</style>
</head>
<body>
<button class="themebtn" id="themebtn" type="button">明暗</button>
<div class="wrap">
  <h1>インドネシア：どこを狙うか</h1>
  <p class="lead">全事業者を、1段に1つの切り口だけで分けていきます。どの段も、足すとちょうど上の段の緑の部分になります。</p>

  <div class="card summary" id="summary"></div>

  <h2>① 全事業者から狙いまで<small>3回分けるだけ</small></h2>
  <p class="h2lead">帯の長さはその段の中での割合です。緑の部分を次の段で広げています。</p>
  <div id="steps"></div>

  <h2>② 狙いの店で、どの道具が空いているか<small>POS まわりの5分野</small></h2>

  <div class="tools" id="tools"></div>

  <footer id="foot"></footer>
</div>

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function man(v) {
  if (v >= 1e6) return Math.round(v / 1e4).toLocaleString('ja-JP') + '万';
  if (v >= 1e4) return (v / 1e4).toFixed(1).replace(/\.0$/, '') + '万';
  return Math.round(v).toLocaleString('ja-JP');
}
function pct(v, t) {
  const p = v / t * 100;
  return (p >= 10 ? p.toFixed(1) : p >= 1 ? p.toFixed(2) : p.toFixed(2)).replace(/\.?0+$/, '') + '%';
}
const VERD = {go: '狙う', later: '後で', no: '狙わない'};
const BASIS = b => `<span class="basis">${esc(b)}</span>`;
const SRC = u => u ? `<a class="src" href="${esc(String(u).split(/\s+/)[0])}" target="_blank" rel="noopener">出典</a>` : '';

  </div>`;

// ① 段
const stepsEl = $('#steps');
D.steps.forEach((s, i) => {
  const card = document.createElement('div');
  card.className = 'card step';
  const segs = s.slices.map(x => {
    const w = x.value / s.total * 100;
    const inside = w >= 14 ? `${esc(x.label)} ${man(x.value)}` : (w >= 6 ? man(x.value) : '');
    return `<div class="seg ${x.verdict}${x.basis === '仮' ? ' kari' : ''}" data-id="${x.id}" style="flex:0 0 calc(${w}% - 2px)" title="${esc(x.label)} ${man(x.value)}（${pct(x.value, s.total)}）">${inside}</div>`;
  }).join('');
  const rows = [...s.slices.filter(x => x.next), ...s.slices.filter(x => !x.next)].map(x => `
    <div class="row" data-id="${x.id}">
      <i class="sw ${x.verdict}"></i>
      <div><span class="rname">${esc(x.label)}</span><span class="tag ${x.verdict}">${VERD[x.verdict]}</span>${BASIS(x.basis)}</div>
      <div class="rnum"><b>${man(x.value)}</b><span class="pct">${pct(x.value, s.total)}</span></div>
      <div class="rreason">${esc(x.reason)}${SRC(x.source)}</div>
    </div>`).join('');
  card.innerHTML = `
    <div class="stephead">
      <span class="stepno">${i + 1}段目</span>
      <span class="steptitle">${esc(s.title)}</span><span class="steptotal">${man(s.total)}</span>${BASIS(s.basis)}
      <span class="axis">分け方：${esc(s.axis)}</span>
    </div>
    <div class="bar">${segs}</div>
    <div class="rows">${rows}</div>
    <div class="stepnote">${esc(s.note)}</div>`;
  stepsEl.appendChild(card);
  // 緑の部分 → 次の段への台形
  let a = 0, x0 = null, x1 = null;
  s.slices.forEach(x => { const w = x.value / s.total * 100; if (x.next) { if (x0 === null) x0 = a; x1 = a + w; } a += w; });
  const svg = `<svg class="conn" viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true"><polygon points="${x0},0 ${x1},0 100,34 0,34"/></svg>`;
  stepsEl.insertAdjacentHTML('beforeend', svg);
  // 帯と行を連動
  card.querySelectorAll('.seg').forEach(seg => {
    const row = card.querySelector(`.row[data-id="${seg.dataset.id}"]`);
    seg.addEventListener('mouseenter', () => row.classList.add('hl'));
    seg.addEventListener('mouseleave', () => row.classList.remove('hl'));
    seg.addEventListener('click', () => { row.classList.add('hl'); row.scrollIntoView({block: 'nearest', behavior: 'smooth'}); setTimeout(() => row.classList.remove('hl'), 1400); });
    row.addEventListener('mouseenter', () => seg.classList.add('hl'));
    row.addEventListener('mouseleave', () => seg.classList.remove('hl'));
  });
});

  return `

$('#foot').innerHTML = `
  <div>更新 ${esc(D.updated)}。数の確かさ：確か＝公的な統計や会社の公表／推計＝公的な割合を掛けた計算／仮＝根拠が薄く、置いた数。</div>
  <ul>${D.sources.map(([n, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a></li>`).join('')}</ul>`;

// 明暗
(() => {
  const root = document.documentElement;
  try { const t = localStorage.getItem('idm-theme'); if (t) root.dataset.theme = t; } catch (e) {}
  $('#themebtn').addEventListener('click', () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('idm-theme', root.dataset.theme); } catch (e) {}
  });
})();
</script>
</body>
