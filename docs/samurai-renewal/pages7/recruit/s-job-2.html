<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>JOB TYPE＋フッター — 社名に夕日（s-job-2）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0}html{overflow-x:hidden;overflow-x:clip}
body{overflow-x:hidden;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}.nb{white-space:nowrap}

.hd{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px var(--pad);color:#f3ece2;mix-blend-mode:normal;pointer-events:none}
.hd>*{pointer-events:auto}
.hd .lg{display:flex;align-items:center;gap:14px}
.hd .lg img{height:30px;width:auto;filter:invert(1)}
.hd .lg span{font:500 10px/1 "JetBrains Mono",monospace;letter-spacing:.18em;opacity:.6;padding-left:14px;border-left:1px solid rgba(243,236,226,.25)}
.hd nav{display:flex;align-items:center;gap:26px;font:500 11px/1 "JetBrains Mono",monospace;letter-spacing:.14em}
.hd nav a{opacity:.62;transition:opacity .3s}.hd nav a:hover,.hd nav a[aria-current]{opacity:1}
.hd nav .cta{opacity:1;border:1px solid rgba(243,236,226,.4);border-radius:99px;padding:10px 16px}
@media(max-width:760px){.hd{padding:14px 16px}.hd nav a:not(.cta){display:none}.hd .lg span{display:none}.hd .lg img{height:26px}}


:root{--pad:clamp(16px,2.2vw,32px);--ink:#c4c4c4;--hi:#fff;--dim:#5d5d5d;--line:rgba(255,255,255,.12);--or:#ff8a4c}
body{background:#000;color:var(--ink);font-family:"Inter Tight","Noto Sans JP",sans-serif}
.job{padding:clamp(140px,18vh,200px) var(--pad) clamp(90px,12vh,140px);display:grid;grid-template-columns:4fr 8fr;gap:24px}
.job h2{margin:0;font:600 clamp(52px,5.3vw,76px)/.9 "Inter Tight",sans-serif;letter-spacing:-.04em;color:var(--ink)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:0 0 12px;text-align:left;font:500 12px/1 "Inter Tight",sans-serif;color:var(--dim);border-bottom:1px solid var(--line)}
.tbl td{padding:18px 12px 18px 0;border-bottom:1px solid var(--line);vertical-align:top;transition:color .3s}
.tbl tr.r{cursor:pointer}
.tbl .t{font:500 clamp(18px,1.5vw,22px)/1.4 "Noto Sans JP",sans-serif;color:var(--hi)}
.tbl .c{font:400 14px/1.7 "Noto Sans JP",sans-serif;color:var(--ink)}
.tbl .a{text-align:right;white-space:nowrap;font:500 14px/1.7 "Inter Tight",sans-serif;color:var(--or)}
.tbl tr.r:hover td{background:rgba(255,255,255,.03)}
.ft{position:relative;padding:0 var(--pad) 24px}
.ft .row{display:grid;grid-template-columns:4fr 4fr 4fr;gap:24px;align-items:end;padding:clamp(40px,6vh,64px) 0 clamp(24px,3vh,36px);border-top:1px solid var(--line)}
.ft .ct b{display:block;font:600 clamp(40px,4vw,60px)/.9 "Inter Tight",sans-serif;letter-spacing:-.04em;color:var(--hi)}
.ft .ct span{display:block;margin-top:14px;font:400 14px/1.6 "Noto Sans JP",sans-serif;color:var(--ink)}
.ft .ct:hover b{color:var(--or)}
.ft nav.big{display:flex;flex-direction:column;align-items:flex-start;font:600 clamp(20px,1.7vw,26px)/1.1 "Inter Tight",sans-serif;letter-spacing:-.02em;color:var(--hi)}
.ft nav.big a:hover{color:var(--or)}
.ft .lgl{display:flex;flex-direction:column;gap:8px;align-items:flex-start;font:400 12px/1.5 "Noto Sans JP",sans-serif;color:var(--ink)}
.wm{position:relative;width:100%;aspect-ratio:6.4/1;margin-top:8px}
.wm canvas{position:absolute;inset:0;width:100%;height:100%}
.wm video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.bot{display:flex;justify-content:space-between;gap:16px;padding-top:16px;font:400 12px/1.5 "Inter Tight",sans-serif;color:var(--dim)}
@media(max-width:760px){
 .job{grid-template-columns:1fr;gap:36px}
 .tbl thead{display:none}
 .tbl tr{display:grid;grid-template-columns:1fr;border-bottom:1px solid var(--line);padding:18px 0}
 .tbl td{border:0;padding:4px 0}
 .tbl .a{text-align:left;padding-top:10px}
 .ft .row{grid-template-columns:1fr 1fr}
 .ft .ct{grid-column:1/-1}
 .bot{flex-direction:column}
}

</style>
</head>
<body>
<header class="hd"><a class="lg" href="https://samurai-style.tokyo/" aria-label="Samurai-Style"><img src="img/logo.svg" alt="Samurai-Style"><span>RECRUIT</span></a><nav><a href="https://samurai-style.tokyo/">HOME</a><a href="https://samurai-style.tokyo/#service">SERVICE</a><a href="https://samurai-style.tokyo/media">MEDIA</a><a href="https://samurai-style.tokyo/company">COMPANY</a><a href="https://samurai-style.tokyo/recruit" aria-current="page">RECRUIT</a><a class="cta" href="https://samurai-style.tokyo/#contact">CONTACT</a></nav></header>
<section class="job" id="job">
  <h2>JOB TYPE</h2>
  <table class="tbl"><thead><tr><th>Role</th><th>Type / Location</th><th></th></tr></thead>
  <tbody><tr class="r" onclick="location.href='https://samurai-style.tokyo/#contact'"><td class="t">コンテンツディレクター（編集者）</td><td class="c">業務委託 ・ 基本リモート（月1回程度 都内近郊で対面）</td><td class="a"><a href="https://samurai-style.tokyo/#contact">CONTACT →</a></td></tr></tbody></table>
</section>
<footer class="ft">
  <div class="row">
    <a class="ct" href="https://samurai-style.tokyo/#contact"><b>CONTACT →</b><span>お問い合わせはこちらから</span></a>
    <nav class="big"><a href="https://samurai-style.tokyo/">HOME</a><a href="https://samurai-style.tokyo/#service">SERVICE</a><a href="https://samurai-style.tokyo/media">MEDIA</a><a href="https://samurai-style.tokyo/company">COMPANY</a><a href="https://samurai-style.tokyo/recruit">RECRUIT</a></nav>
    <div class="lgl"><a href="https://samurai-style.tokyo/privacy-policy">プライバシーポリシー</a><a href="https://samurai-style.tokyo/commercial-transactions">特定商取引法に基づく表記</a></div>
  </div>
  <div class="wm" aria-label="Samurai-Style"><canvas id="wm"></canvas><video id="wv" src="img/recruit-hero.mp4" muted playsinline loop autoplay preload="auto"></video></div>
  <div class="bot"><span>© 2024- samurai-style All Right Reserved.</span><span>RECRUIT</span></div>
</footer>
<script>
(() => {
  const cv = document.getElementById('wm'), v = document.getElementById('wv'), ctx = cv.getContext('2d');
  const TXT = 'SAMURAI-STYLE';
  let fs = 100, W = 0, H = 0, dpr = 1;
  function size() { const r = cv.getBoundingClientRect(); dpr = Math.min(devicePixelRatio || 1, 2); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `700 100px "Inter Tight"`; ctx.letterSpacing = '-4px'; const m = ctx.measureText(TXT).width; fs = 100 * W / m; }
  function draw() {
    ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, W, H);
    ctx.font = `700 ${fs}px "Inter Tight"`; ctx.letterSpacing = `${-fs * .04}px`; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#ff8a4c';
    const m = ctx.measureText(TXT); ctx.fillText(TXT, (W - m.width) / 2, H - (H - m.actualBoundingBoxAscent) / 2 - 2);
    if (v.readyState >= 2) { ctx.globalCompositeOperation = 'source-in';
      const vr = v.videoWidth / v.videoHeight, cr = W / H; let dw = W, dh = W / vr; if (dh < H) { dh = H; dw = H * vr; }
      ctx.drawImage(v, (W - dw) / 2, (H - dh) / 2, dw, dh);
      ctx.globalCompositeOperation = 'source-atop'; const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(255,128,60,.55)'); g.addColorStop(.55, 'rgba(190,70,80,.38)'); g.addColorStop(1, 'rgba(12,14,40,.6)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
    requestAnimationFrame(draw);
  }
  document.fonts.ready.then(() => { size(); draw(); });
  addEventListener('resize', size);
  v.play && v.play().catch(() => {});
})();
</script>
</body>
</html>
