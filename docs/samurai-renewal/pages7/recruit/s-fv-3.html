<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>採用FV 候補3｜夕方から夜への目盛り</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#04060d;--navy:#0b1230;--dusk:#ff6a2b;--amber:#ffb26b;--sig:#8fdcff;--ink:#f3f1ec;--mute:rgba(243,241,236,.56);--line:rgba(243,241,236,.16);--pad:clamp(16px,3.4vw,50px)}
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-x:hidden;overflow-x:clip}
body{background:var(--night);color:var(--ink);font-family:"Geist","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
.jp{font-family:"Noto Sans JP",sans-serif}
.mono{font-family:"Geist Mono",monospace}
.nb{white-space:nowrap}
.hd{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px var(--pad);font-size:13px;font-weight:500;letter-spacing:.02em}
.hd .lg{display:flex;align-items:center;gap:18px}
.hd .lg img{height:30px;width:auto;filter:brightness(0) invert(1)}
.hd .lg small{font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.08em;color:var(--mute);padding-left:18px;border-left:1px solid var(--line)}
.hd nav{display:flex;align-items:center;gap:26px}
.hd nav a{opacity:.78;transition:opacity .2s}
.hd nav a:hover,.hd nav a[aria-current]{opacity:1}
.hd nav .ct{opacity:1;border:1px solid rgba(243,241,236,.5);border-radius:999px;padding:9px 18px}
.hd .mn{display:none;font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:.08em}
.next{height:60vh;display:grid;place-items:center;color:var(--mute);font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:.12em;border-top:1px solid var(--line)}
@media (max-width:820px){.hd nav{display:none}.hd .mn{display:block}.hd .lg img{height:26px}.hd .lg small{display:none}.hd{padding:14px 16px}}

.tm{position:relative;height:260vh;background:var(--night)}
.stg{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.stg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:filter}
.ov{position:absolute;inset:0;pointer-events:none}
.warm{background:linear-gradient(180deg,#8a6a9a 0%,#e3926a 55%,#d9733f 100%);mix-blend-mode:multiply}
.nite{background:linear-gradient(180deg,#050a24 0%,#0e1a4a 55%,#1d1636 100%);mix-blend-mode:multiply}
.vig{background:radial-gradient(120% 90% at 50% 40%,rgba(4,6,13,0) 40%,rgba(4,6,13,.55) 100%),linear-gradient(180deg,rgba(4,6,13,.45),rgba(4,6,13,0) 22%,rgba(4,6,13,0) 62%,rgba(4,6,13,.7))}
canvas.st{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;pointer-events:none}
.ttl{position:absolute;left:var(--pad);top:clamp(120px,22vh,220px);margin:0;font-weight:600;letter-spacing:-.05em;line-height:.9;font-size:clamp(44px,8vw,132px)}
.ttl .l{display:block}
.ttl .s{display:block;font-size:.4em;letter-spacing:-.03em;font-weight:500;margin-bottom:.35em;color:rgba(243,241,236,.86)}
.rb{position:absolute;right:var(--pad);top:96px;text-align:right;font-family:"Geist Mono",monospace;font-size:12px;line-height:1.35;letter-spacing:.02em;color:rgba(243,241,236,.82)}
.rb b{font-weight:500;color:var(--ink);display:block;margin-bottom:10px}
.lbh{position:absolute;left:var(--pad);bottom:150px;font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:.08em;color:rgba(243,241,236,.8);display:flex;gap:18px}
.lbh em{font-style:normal;color:var(--amber)}
.rul{position:absolute;left:0;right:0;bottom:0;height:128px;border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(4,6,13,0),rgba(4,6,13,.55));overflow:hidden}
.tape{position:absolute;left:0;top:0;height:100%;will-change:transform}
.tape .tk{position:absolute;left:0;right:0;top:0;height:22px;background:repeating-linear-gradient(90deg,rgba(243,241,236,.55) 0 1px,transparent 1px 12px);-webkit-mask:linear-gradient(#000 0 9px,transparent 9px);mask:linear-gradient(#000 0 9px,transparent 9px)}
.tape .tk2{position:absolute;left:0;right:0;top:0;height:22px;background:repeating-linear-gradient(90deg,rgba(243,241,236,.9) 0 1px,transparent 1px 120px)}
.tape .mk{position:absolute;top:34px;transform:translateX(-50%);font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.14em;color:rgba(243,241,236,.55);white-space:nowrap;transition:color .3s}
.tape .mk.cur{color:var(--ink)}
.tape .mk:before{content:"";position:absolute;left:50%;top:-34px;width:1px;height:28px;background:currentColor}
.ndl{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--dusk);box-shadow:0 0 12px var(--dusk)}
.ndl:before{content:"";position:absolute;left:-4px;top:-1px;border:4.5px solid transparent;border-top:6px solid var(--dusk)}
.rd{position:absolute;left:calc(50% + 14px);bottom:22px;font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.12em;color:var(--ink)}
.rd span{color:var(--dusk)}
.rl{position:absolute;left:var(--pad);bottom:22px;font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.12em;color:var(--mute)}
@media (max-width:820px){
 .tm{height:230vh}
 .ttl{font-size:clamp(40px,12.6vw,64px);top:auto;bottom:250px}
 .rb{top:74px;font-size:11px;left:16px;right:16px;text-align:left}
 .rb .x{display:none}
 .lbh{bottom:150px;font-size:11px;gap:12px}
 .rul{height:116px}
 .rl{display:none}
}
</style>
</head>
<body>
<header class="hd"><a class="lg" href="https://samurai-style.tokyo/"><img src="img/logo.svg" alt="SAMURAI STYLE"><small>RECRUIT</small></a><nav><a href="https://samurai-style.tokyo/">HOME</a><a href="https://samurai-style.tokyo/#service">SERVICE</a><a href="https://samurai-style.tokyo/media">MEDIA</a><a href="https://samurai-style.tokyo/company">COMPANY</a><a href="https://samurai-style.tokyo/recruit" aria-current="page">RECRUIT</a><a class="ct" href="https://samurai-style.tokyo/#contact">CONTACT</a></nav><span class="mn">MENU</span></header>

<main>
<section class="tm" id="tm" aria-label="FV">
 <div class="stg">
  <video src="img/recruit-hero.mp4" poster="img/recruit-hero-poster.webp" autoplay muted loop playsinline preload="auto"></video>
  <div class="ov warm"></div><div class="ov nite"></div><canvas class="st"></canvas><div class="ov vig"></div>
  <div class="rb mono" aria-hidden="true"><b>////// RECRUIT SITE</b><span class="x">SAMURAI STYLE<br>SEA ／ SUNSET ／ RICE TERRACE<br>FROM DUSK TO NIGHT</span></div>
  <h1 class="ttl"><span class="s" data-sc>aiming to build the most</span><span class="l" data-sc>fun-loving team</span></h1>
  <div class="lbh"><span>SCENE <em class="sn">01</em></span><span class="sname">SEA</span></div>
  <div class="rul"><div class="tape"><div class="tk"></div><div class="tk2"></div><span class="mk" data-f="0.0">GOLDEN HOUR</span><span class="mk" data-f="0.25">SUNSET</span><span class="mk" data-f="0.5">DUSK</span><span class="mk" data-f="0.75">BLUE HOUR</span><span class="mk" data-f="1.0">NIGHT</span></div><div class="ndl"></div>
   <div class="rd">LIGHT <span class="pc">000</span></div><div class="rl">SCROLL →</div></div>
 </div>
</section>
</main>

<div class="next">NEXT SECTION</div>
<script>
(()=>{
const tm=document.getElementById('tm'),v=tm.querySelector('video'),warm=tm.querySelector('.warm'),nite=tm.querySelector('.nite'),cv=tm.querySelector('canvas'),
 tape=tm.querySelector('.tape'),mks=[...tm.querySelectorAll('.mk')],pc=tm.querySelector('.pc'),sn=tm.querySelector('.sn'),sname=tm.querySelector('.sname');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
let W,H,TRAV,stars=[];
function size(){
 W=innerWidth;H=innerHeight;TRAV=W*2.2;
 tape.style.width=(W+TRAV)+'px';
 mks.forEach(m=>m.style.left=(W/2+(+m.dataset.f)*TRAV)+'px');
 const d=Math.min(2,devicePixelRatio||1);cv.width=W*d;cv.height=H*d;
 stars=[];let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<Math.round(W*H/5200);i++)stars.push([rnd()*W*d,Math.pow(rnd(),1.6)*H*.62*d,rnd()*1.2+.3,rnd()*6.28]);
}
/* Igloo-style scramble reveal */
const G='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz/*-+0123456789';
tm.querySelectorAll('[data-sc]').forEach((el,ix)=>{
 const txt=el.textContent,t0=performance.now()+300+ix*350,dur=1300;
 (function f(now){const p=cl((now-t0)/dur);let o='';for(let i=0;i<txt.length;i++){const c=txt[i];o+=(c===' '||i/txt.length<p)?c:(p>0?G[(Math.random()*G.length)|0]:' ')}
  el.textContent=o;if(p<1)requestAnimationFrame(f);else el.textContent=txt})(performance.now());
});
const T0=performance.now();
function tick(now){
 const r=tm.getBoundingClientRect(),sp=cl(-r.top/(tm.offsetHeight-innerHeight));
 const auto=cl((now-T0)/9000)*.3;
 const t=Math.max(auto,.3+sp*.7*(sp>0?1:0),auto);
 tape.style.transform='translateX('+(-t*TRAV).toFixed(1)+'px)';
 warm.style.opacity=(.92*(1-cl((t-.25)/.55))).toFixed(3);
 nite.style.opacity=(cl((t-.2)/.8)*.92).toFixed(3);
 v.style.filter='sepia('+(.3*(1-t)).toFixed(3)+') brightness('+(.95-.3*t).toFixed(3)+') saturate('+(1.1-.4*t).toFixed(3)+')';
 cv.style.opacity=cl((t-.45)/.45).toFixed(3);
 pc.textContent=String(Math.round(t*100)).padStart(3,'0');
 let ci=0,bd=9;mks.forEach((m,i)=>{const d=Math.abs(+m.dataset.f-t);if(d<bd){bd=d;ci=i}});mks.forEach((m,i)=>m.classList.toggle('cur',i===ci));
 const k=Math.min(2,Math.floor((v.currentTime||0)/8));sn.textContent='0'+(k+1);sname.textContent=['SEA','SUNSET','RICE TERRACE'][k];
 const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);
 for(const s of stars){const a=.45+.55*Math.sin(now/900+s[3]);x.globalAlpha=a;x.fillStyle='#e8f1ff';x.fillRect(s[0],s[1],s[2],s[2])}
 requestAnimationFrame(tick);
}
size();addEventListener('resize',size);requestAnimationFrame(tick);
})();
</script>
</body>
</html>
