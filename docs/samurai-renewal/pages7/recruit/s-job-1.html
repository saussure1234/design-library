<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>JOB TYPE＋フッター — 夜の求人票（s-job-1）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&family=Inter+Tight:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0}html{overflow-x:hidden;overflow-x:clip}
body{overflow-x:hidden;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}.nb{white-space:nowrap}

.hd{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px var(--pad);color:#f3ece2;mix-blend-mode:normal;pointer-events:none}
.hd>*{pointer-events:auto}
.hd .lg{display:flex;align-items:center;gap:14px}
.hd .lg img{height:30px;width:auto;filter:invert(1)}
.hd .lg span{font:500 10px/1 "JetBrains Mono",monospace;letter-spacing:.18em;opacity:.6;padding-left:14px;border-left:1px solid rgba(243,236,226,.25)}
.hd nav{display:flex;align-items:center;gap:26px;font:500 11px/1 "JetBrains Mono",monospace;letter-spacing:.14em}
.hd nav a{opacity:.62;transition:opacity .3s}.hd nav a:hover,.hd nav a[aria-current]{opacity:1}
.hd nav .cta{opacity:1;border:1px solid rgba(243,236,226,.4);border-radius:99px;padding:10px 16px}
@media(max-width:760px){.hd{padding:14px 16px}.hd nav a:not(.cta){display:none}.hd .lg span{display:none}.hd .lg img{height:26px}}


:root{--pad:clamp(16px,3.4vw,52px);--bg:#08090c;--ink:#f7f8f8;--sub:#d0d6e0;--mute:#8a8f98;--line:rgba(255,255,255,.08);--or:#ff8a4c}
body{background:var(--bg);color:var(--ink);font-family:"Inter Tight","Noto Sans JP",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad)}
.job{position:relative;padding:clamp(140px,18vh,200px) 0 clamp(120px,16vh,180px);overflow:hidden}
.job:after{content:"";position:absolute;left:50%;bottom:-260px;width:1600px;height:520px;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(255,128,64,.30) 0%,rgba(190,70,70,.12) 40%,rgba(8,9,12,0) 72%);pointer-events:none}
.eyebrow{display:flex;align-items:center;gap:10px;font:500 13px/1 "Inter Tight",sans-serif;color:var(--mute)}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--or);box-shadow:0 0 10px var(--or)}
.job h2{margin:22px 0 0;font:500 clamp(44px,4.5vw,64px)/1 "Inter Tight",sans-serif;letter-spacing:-.022em}
.lead{margin:20px 0 0;font:400 clamp(17px,1.7vw,24px)/1.33 "Inter Tight",sans-serif;letter-spacing:-.012em;color:var(--mute);max-width:24em}
.roles{margin-top:clamp(56px,8vh,88px)}
.grp{display:flex;justify-content:space-between;padding:0 0 14px;font:400 13px/1 "Inter Tight",sans-serif;color:var(--mute);border-bottom:1px solid var(--line)}
.role{position:relative;display:grid;grid-template-columns:1.2fr 1.5fr auto;align-items:center;gap:24px;padding:28px 20px;margin:0 -20px;border-radius:10px;transition:background .3s}
.role:hover{background:rgba(255,255,255,.035)}
.role .t{font:500 clamp(19px,1.6vw,22px)/1.4 "Noto Sans JP",sans-serif;letter-spacing:.01em}
.role .c{font:400 15px/1.6 "Noto Sans JP",sans-serif;color:var(--sub)}
.role .go{display:inline-flex;align-items:center;gap:10px;font:500 14px/1 "Inter Tight",sans-serif;color:var(--ink);padding:12px 18px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);white-space:nowrap;transition:background .3s}
.role:hover .go{background:var(--or);color:#120a06;border-color:var(--or)}
.role .go b{transition:transform .3s}.role:hover .go b{transform:translateX(3px)}
.glow{position:relative;height:1px;margin-top:0;background:linear-gradient(90deg,transparent,rgba(255,150,90,.0) 5%,rgba(255,170,110,.9) 50%,rgba(255,150,90,0) 95%,transparent)}
.glow:after{content:"";position:absolute;left:20%;right:20%;top:-30px;height:60px;background:radial-gradient(50% 50% at 50% 50%,rgba(255,140,80,.35),transparent 70%);filter:blur(6px)}
.ft{position:relative;border-top:1px solid var(--line);background:#06070a;padding:clamp(64px,9vh,96px) 0 32px}
.cta{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:clamp(56px,8vh,80px)}
.cta b{display:block;font:500 clamp(44px,4.5vw,64px)/1 "Inter Tight",sans-serif;letter-spacing:-.022em}
.cta span{display:block;margin-top:14px;font:400 15px/1.6 "Noto Sans JP",sans-serif;color:var(--mute)}
.cta .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:99px;background:var(--ink);color:#08090c;font:500 15px/1 "Inter Tight",sans-serif;white-space:nowrap}
.cta .btn:hover{background:var(--or)}
.cta .btn i{font-style:normal}
.fl{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px;padding-top:40px;border-top:1px solid var(--line)}
.fl .lg img{height:34px;filter:invert(1)}
.fl h4{margin:0 0 16px;font:500 13px/1 "Inter Tight",sans-serif;color:var(--ink)}
.fl nav{display:flex;flex-direction:column;gap:12px;font:400 13px/1.4 "Noto Sans JP",sans-serif;color:var(--mute)}
.fl nav a:hover{color:var(--ink)}
.cp{margin-top:56px;font:400 12px/1 "Inter Tight",sans-serif;color:var(--mute)}
@media(max-width:760px){
 .role{grid-template-columns:1fr;gap:10px;padding:24px 16px;margin:0 -16px}
 .role .go{justify-self:start;margin-top:8px}
 .cta{flex-direction:column;align-items:flex-start}
 .fl{grid-template-columns:1fr 1fr}.fl .lg{grid-column:1/-1}
}

</style>
</head>
<body>
<header class="hd"><a class="lg" href="https://samurai-style.tokyo/" aria-label="Samurai-Style"><img src="img/logo.svg" alt="Samurai-Style"><span>RECRUIT</span></a><nav><a href="https://samurai-style.tokyo/">HOME</a><a href="https://samurai-style.tokyo/#service">SERVICE</a><a href="https://samurai-style.tokyo/media">MEDIA</a><a href="https://samurai-style.tokyo/company">COMPANY</a><a href="https://samurai-style.tokyo/recruit" aria-current="page">RECRUIT</a><a class="cta" href="https://samurai-style.tokyo/#contact">CONTACT</a></nav></header>
<section class="job" id="job">
  <div class="wrap">
    <div class="eyebrow"><i></i>RECRUIT</div>
    <h2>JOB TYPE</h2>
    <div class="roles">
      <div class="grp"><span>Role</span><span>01</span></div>
      <a class="role" href="https://samurai-style.tokyo/#contact"><span class="t">コンテンツディレクター（編集者）</span><span class="c">業務委託 ・ 基本リモート（月1回程度 都内近郊で対面）</span><span class="go">CONTACT <b>→</b></span></a>
      <div class="glow"></div>
    </div>
  </div>
</section>
<footer class="ft">
  <div class="wrap">
    <div class="cta"><div><b>CONTACT</b><span>お問い合わせはこちらから</span></div><a class="btn" href="https://samurai-style.tokyo/#contact">CONTACT <i>→</i></a></div>
    <div class="fl">
      <a class="lg" href="https://samurai-style.tokyo/" aria-label="Samurai-Style"><img src="img/logo.svg" alt="Samurai-Style"></a>
      <div><nav><a href="https://samurai-style.tokyo/">HOME</a><a href="https://samurai-style.tokyo/#service">SERVICE</a><a href="https://samurai-style.tokyo/media">MEDIA</a><a href="https://samurai-style.tokyo/company">COMPANY</a><a href="https://samurai-style.tokyo/recruit">RECRUIT</a></nav></div>
      <div><nav><a href="https://samurai-style.tokyo/privacy-policy">プライバシーポリシー</a><a href="https://samurai-style.tokyo/commercial-transactions">特定商取引法に基づく表記</a></nav></div>
    </div>
    <p class="cp">© 2024- samurai-style All Right Reserved.</p>
  </div>
</footer>

</body>
</html>
