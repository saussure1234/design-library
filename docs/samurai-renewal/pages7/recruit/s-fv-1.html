<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>採用FV 候補1｜文字の窓から夕景へ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#04060d;--navy:#0b1230;--dusk:#ff6a2b;--amber:#ffb26b;--sig:#8fdcff;--ink:#f3f1ec;--mute:rgba(243,241,236,.56);--line:rgba(243,241,236,.16);--pad:clamp(16px,3.4vw,50px)}
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-x:hidden;overflow-x:clip}
body{background:var(--night);color:var(--ink);font-family:"Geist","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
.jp{font-family:"Noto Sans JP",sans-serif}
.mono{font-family:"Geist Mono",monospace}
.nb{white-space:nowrap}
.hd{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px var(--pad);font-size:13px;font-weight:500;letter-spacing:.02em}
.hd .lg{display:flex;align-items:center;gap:18px}
.hd .lg img{height:30px;width:auto;filter:brightness(0) invert(1)}
.hd .lg small{font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.08em;color:var(--mute);padding-left:18px;border-left:1px solid var(--line)}
.hd nav{display:flex;align-items:center;gap:26px}
.hd nav a{opacity:.78;transition:opacity .2s}
.hd nav a:hover,.hd nav a[aria-current]{opacity:1}
.hd nav .ct{opacity:1;border:1px solid rgba(243,241,236,.5);border-radius:999px;padding:9px 18px}
.hd .mn{display:none;font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:.08em}
.next{height:60vh;display:grid;place-items:center;color:var(--mute);font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:.12em;border-top:1px solid var(--line)}
@media (max-width:820px){.hd nav{display:none}.hd .mn{display:block}.hd .lg img{height:26px}.hd .lg small{display:none}.hd{padding:14px 16px}}

.ko{position:relative;height:280vh;background:var(--night)}
.stg{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.stg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grade{position:absolute;inset:0;background:linear-gradient(180deg,#b39cc4 0%,#f2b08a 58%,#e08a5c 100%);mix-blend-mode:multiply;opacity:.6}
.plate{position:absolute;inset:0;background:linear-gradient(180deg,#070b1c 0%,#0b1230 55%,#2a1409 100%);mix-blend-mode:multiply;will-change:transform;transform-origin:50% 50%}
.word{position:absolute;left:0;right:0;top:50%;transform:translateY(-52%);text-align:center;color:#fff;font-weight:600;letter-spacing:-.05em;line-height:.8;white-space:nowrap}
.word .ln{display:inline-block}
.word .c{display:inline-block;transform:translateY(105%);transition:transform 1.1s cubic-bezier(.2,.7,.1,1)}
.on .word .c{transform:none}
.cap{position:absolute;left:var(--pad);right:var(--pad);display:flex;justify-content:space-between;align-items:flex-end;font-size:clamp(15px,1.5vw,22px);font-weight:500;letter-spacing:-.01em;transition:opacity .4s}
.cap.t{top:calc(50% - var(--wh)*.62 - 1.6em)}
.cap.b{top:calc(50% + var(--wh)*.5 + .6em)}
.cap .mono{font-size:11px;letter-spacing:.12em;color:var(--mute);font-weight:400}
.ttl{position:absolute;left:var(--pad);bottom:clamp(84px,12vh,130px);margin:0;font-weight:600;font-size:clamp(46px,9vw,150px);letter-spacing:-.05em;line-height:.9}
.ttl .l:first-child{font-size:.4em;letter-spacing:-.025em;font-weight:500;margin-bottom:.5em}
.ttl .l{display:block;overflow:hidden;padding-bottom:.06em}
.ttl .l>span{display:block;transform:translateY(110%);transition:transform 1s cubic-bezier(.2,.7,.1,1)}
.ttl.in .l>span{transform:none}
.ttl.in .l:nth-child(2)>span{transition-delay:.08s}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,6,13,.35) 0%,rgba(4,6,13,0) 30%,rgba(4,6,13,0) 55%,rgba(4,6,13,.6) 100%);opacity:0;transition:opacity .6s}
.shade.in{opacity:1}
.hud{position:absolute;left:var(--pad);right:var(--pad);bottom:28px;display:flex;justify-content:space-between;align-items:center;font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.12em;color:var(--mute)}
.hud ol{list-style:none;margin:0;padding:0;display:flex;gap:22px}
.hud li{display:flex;align-items:center;gap:8px;transition:color .4s}
.hud li i{display:block;width:28px;height:1px;background:var(--line);position:relative;overflow:hidden}
.hud li i b{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.hud li.cur{color:var(--ink)}
.sc{display:flex;align-items:center;gap:10px}
.sc i{width:1px;height:26px;background:var(--line);position:relative;overflow:hidden}
.sc i:after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:var(--ink);animation:dr 1.8s infinite}
@keyframes dr{to{top:100%}}
@media (max-width:820px){
 .ko{height:240vh}
 .word .ln{display:block}
 .cap{font-size:14px}
 .cap .mono{display:none}
 .ttl{font-size:clamp(40px,13vw,66px);bottom:92px}
 .ttl .l:first-child{font-size:.5em}
 .hud{bottom:22px}
 .hud ol{gap:12px}
 .hud li i{width:14px}
 .sc span{display:none}
}
</style>
</head>
<body>
<header class="hd"><a class="lg" href="https://samurai-style.tokyo/"><img src="img/logo.svg" alt="SAMURAI STYLE"><small>RECRUIT</small></a><nav><a href="https://samurai-style.tokyo/">HOME</a><a href="https://samurai-style.tokyo/#service">SERVICE</a><a href="https://samurai-style.tokyo/media">MEDIA</a><a href="https://samurai-style.tokyo/company">COMPANY</a><a href="https://samurai-style.tokyo/recruit" aria-current="page">RECRUIT</a><a class="ct" href="https://samurai-style.tokyo/#contact">CONTACT</a></nav><span class="mn">MENU</span></header>

<main>
<section class="ko" id="ko" aria-label="FV">
 <div class="stg">
  <video src="img/recruit-hero.mp4" poster="img/recruit-hero-poster.webp" autoplay muted loop playsinline preload="auto"></video>
  <div class="grade"></div>
  <div class="plate" aria-hidden="true"><div class="word"><span class="ln">fun-</span><span class="ln">loving</span></div></div>
  <div class="shade"></div>
  <div class="cap t" aria-hidden="true"><span>aiming to build the most</span><span class="mono">RECRUIT SITE</span></div>
  <div class="cap b" aria-hidden="true"><span class="mono">SAMURAI STYLE</span><span>team</span></div>
  <h1 class="ttl"><span class="l"><span>aiming to build the most</span></span><span class="l"><span>fun-loving team</span></span></h1>
  <div class="hud"><div class="sc"><i></i><span>SCROLL</span></div>
   <ol><li><i><b></b></i>SEA</li><li><i><b></b></i>SUNSET</li><li><i><b></b></i>RICE TERRACE</li></ol></div>
 </div>
</section>
</main>

<div class="next">NEXT SECTION</div>
<script>
(()=>{
const ko=document.getElementById('ko'),stg=ko.querySelector('.stg'),plate=ko.querySelector('.plate'),word=ko.querySelector('.word'),
 caps=ko.querySelectorAll('.cap'),ttl=ko.querySelector('.ttl'),shade=ko.querySelector('.shade'),v=ko.querySelector('video'),lis=[...ko.querySelectorAll('.hud li')];
/* split letters for the rise-in */
word.querySelectorAll('.ln').forEach(ln=>{ln.innerHTML=[...ln.textContent].map((ch,i)=>'<span class="c" style="transition-delay:'+(i*0.035).toFixed(3)+'s">'+ch+'</span>').join('')});
let ox=0,oy=0;
function fit(){
 const W=innerWidth,sp=W<=820;
 word.style.fontSize='100px';
 const lns=[...word.querySelectorAll('.ln')];
 const w=sp?Math.max(...lns.map(l=>l.getBoundingClientRect().width)):word.scrollWidth&&lns.reduce((a,l)=>a+l.getBoundingClientRect().width,0);
 const fs=100*(W*(sp?.9:.84))/w;
 word.style.fontSize=fs+'px';
 const wh=word.getBoundingClientRect().height;
 stg.style.setProperty('--wh',wh+'px');
 /* zoom origin = centre of the hyphen */
 const hy=[...word.querySelectorAll('.c')].find(c=>c.textContent==='-');
 const tr=hy.style.transition;hy.style.transition='none';hy.style.transform='none';
 const r=hy.getBoundingClientRect(),pr=plate.getBoundingClientRect();
 hy.style.transform='';hy.offsetWidth;hy.style.transition=tr;
 const cx=document.createElement('canvas').getContext('2d');cx.font='600 '+fs+'px Geist';const m=cx.measureText('-');
 const base=r.top+(r.height-(m.fontBoundingBoxAscent+m.fontBoundingBoxDescent))/2+m.fontBoundingBoxAscent;
 ox=r.left+r.width*.5-pr.left; oy=base-(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2-pr.top;
 plate.style.transformOrigin=ox+'px '+oy+'px';
}
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
function tick(){
 const r=ko.getBoundingClientRect(),H=ko.offsetHeight-innerHeight;
 const p=cl(-r.top/H);
 const z=cl((p-.08)/.6),e=Math.pow(z,2.6);
 plate.style.transform='scale('+(1+e*70).toFixed(4)+')';
 plate.style.opacity=(1-cl((p-.6)/.08)).toFixed(3);
 caps.forEach(c=>c.style.opacity=(1-cl(p/.12)).toFixed(3));
 const fin=p>.62; ttl.classList.toggle('in',fin); shade.classList.toggle('in',fin);
 const t=v.currentTime||0,k=Math.min(2,Math.floor(t/8));
 lis.forEach((li,i)=>{li.classList.toggle('cur',i===k);li.querySelector('b').style.transform='scaleX('+(i<k?1:i===k?((t-8*k)/8):0).toFixed(3)+')'});
 requestAnimationFrame(tick);
}
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{fit();requestAnimationFrame(()=>ko.classList.add('on'))});
addEventListener('resize',fit);
fit();tick();
})();
</script>
</body>
</html>
