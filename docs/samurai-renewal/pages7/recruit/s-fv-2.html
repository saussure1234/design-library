<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>採用FV 候補2｜3つの窓・時間差</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#04060d;--navy:#0b1230;--dusk:#ff6a2b;--amber:#ffb26b;--sig:#8fdcff;--ink:#f3f1ec;--mute:rgba(243,241,236,.56);--line:rgba(243,241,236,.16);--pad:clamp(16px,3.4vw,50px)}
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-x:hidden;overflow-x:clip}
body{background:var(--night);color:var(--ink);font-family:"Geist","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
.jp{font-family:"Noto Sans JP",sans-serif}
.mono{font-family:"Geist Mono",monospace}
.nb{white-space:nowrap}
.hd{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px var(--pad);font-size:13px;font-weight:500;letter-spacing:.02em}
.hd .lg{display:flex;align-items:center;gap:18px}
.hd .lg img{height:30px;width:auto;filter:brightness(0) invert(1)}
.hd .lg small{font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.08em;color:var(--mute);padding-left:18px;border-left:1px solid var(--line)}
.hd nav{display:flex;align-items:center;gap:26px}
.hd nav a{opacity:.78;transition:opacity .2s}
.hd nav a:hover,.hd nav a[aria-current]{opacity:1}
.hd nav .ct{opacity:1;border:1px solid rgba(243,241,236,.5);border-radius:999px;padding:9px 18px}
.hd .mn{display:none;font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:.08em}
.next{height:60vh;display:grid;place-items:center;color:var(--mute);font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:.12em;border-top:1px solid var(--line)}
@media (max-width:820px){.hd nav{display:none}.hd .mn{display:block}.hd .lg img{height:26px}.hd .lg small{display:none}.hd{padding:14px 16px}}

.tri{position:relative;height:100vh;height:100svh;min-height:600px;background:var(--night);overflow:hidden}
.row{position:absolute;inset:0;display:flex;gap:3px}
.pn{position:relative;flex:1 1 0;overflow:hidden;clip-path:inset(100% 0 0 0);transition:clip-path 1.3s cubic-bezier(.7,0,.2,1),flex-grow .9s cubic-bezier(.2,.7,.1,1)}
.on .pn{clip-path:inset(0 0 0 0)}
.pn:nth-child(2){transition-delay:.14s,0s}.pn:nth-child(3){transition-delay:.28s,0s}
@media (hover:hover) and (min-width:821px){.row:hover .pn{flex-grow:.8}.row .pn:hover{flex-grow:1.5}}
.pn video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:inset(0 100% 0 0);transition:clip-path 1.2s cubic-bezier(.7,0,.2,1)}
.pn video.cur{clip-path:inset(0 0 0 0);z-index:1}
.pn video.out{z-index:0;clip-path:inset(0 0 0 0);transition:none}
.pn:nth-child(2) video{transition-delay:.12s}.pn:nth-child(3) video{transition-delay:.24s}
.gr{position:absolute;inset:0;z-index:2;pointer-events:none}
.g0 video{filter:sepia(.35) saturate(1.1) brightness(.78) contrast(1.08)}
.g0 .gr{background:linear-gradient(180deg,#9b6f8c 0%,#e79a6a 55%,#c9663a 100%);mix-blend-mode:multiply;opacity:.9}
.g1 video{filter:saturate(1.15) contrast(1.06) brightness(.86)}
.g1 .gr{background:linear-gradient(180deg,rgba(60,20,60,.35),rgba(255,90,30,.32));mix-blend-mode:multiply}
.g2 video{filter:saturate(.5) brightness(.85) contrast(1.1)}
.g2 .gr{background:linear-gradient(180deg,#1a2c78 0%,#3a4a9a 60%,#4a3060 100%);mix-blend-mode:multiply;opacity:.95}
.g2 .gr:after{content:"";position:absolute;inset:0;background:radial-gradient(1px 1px at 20% 18%,#fff,transparent),radial-gradient(1px 1px at 64% 9%,#fff,transparent),radial-gradient(1px 1px at 82% 26%,#cfe6ff,transparent),radial-gradient(1.5px 1.5px at 38% 31%,#fff,transparent),radial-gradient(1px 1px at 9% 40%,#fff,transparent);mix-blend-mode:screen;opacity:.8}
.lb{position:absolute;z-index:3;left:14px;right:14px;top:84px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.lb .n{color:var(--dusk)}
.lb .s{text-align:right;font-weight:500;color:rgba(243,241,236,.85)}
.ft{position:absolute;z-index:3;left:14px;right:14px;bottom:16px;display:flex;align-items:center;gap:10px;font-size:11px;font-family:"Geist Mono",monospace;letter-spacing:.1em;color:rgba(243,241,236,.7)}
.ft i{flex:1;height:1px;background:rgba(243,241,236,.22);position:relative}
.ft i b{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.ttl{position:absolute;z-index:4;left:var(--pad);right:var(--pad);bottom:clamp(70px,11vh,120px);margin:0;font-weight:600;letter-spacing:-.05em;line-height:.88;font-size:clamp(44px,8.2vw,138px);pointer-events:none}
.ttl .l{display:block;overflow:hidden;padding-bottom:.07em}
.ttl .l>span{display:block;transform:translateY(110%);transition:transform 1.1s cubic-bezier(.2,.7,.1,1) .7s}
.ttl .l:nth-child(2)>span{transition-delay:.8s;text-align:right}
.on .ttl .l>span{transform:none}
.ttl .s{font-size:.42em;letter-spacing:-.03em;font-weight:500}
@media (max-width:820px){
 .row{gap:2px}
 .lb{left:8px;right:8px;top:70px;flex-direction:column;gap:4px;font-size:11px}
 .lb .s{text-align:left}
 .ft{left:8px;right:8px;bottom:12px}
 .ft span{display:none}
 .ttl{font-size:clamp(40px,13vw,64px);bottom:54px}
 .ttl .s{font-size:.5em}
}
</style>
</head>
<body>
<header class="hd"><a class="lg" href="https://samurai-style.tokyo/"><img src="img/logo.svg" alt="SAMURAI STYLE"><small>RECRUIT</small></a><nav><a href="https://samurai-style.tokyo/">HOME</a><a href="https://samurai-style.tokyo/#service">SERVICE</a><a href="https://samurai-style.tokyo/media">MEDIA</a><a href="https://samurai-style.tokyo/company">COMPANY</a><a href="https://samurai-style.tokyo/recruit" aria-current="page">RECRUIT</a><a class="ct" href="https://samurai-style.tokyo/#contact">CONTACT</a></nav><span class="mn">MENU</span></header>

<main>
<section class="tri" id="tri" aria-label="FV">
 <div class="row"><div class="pn g0"><video src="img/recruit-sea.mp4" muted loop playsinline preload="auto" data-n="SEA"></video><video src="img/recruit-sunset.mp4" muted loop playsinline preload="auto" data-n="SUNSET"></video><video src="img/recruit-terrace.mp4" muted loop playsinline preload="auto" data-n="RICE TERRACE"></video><div class="gr"></div><div class="lb"><span class="n">01</span><span class="s"><span class="sn">SEA</span></span></div><div class="ft"><span>GOLDEN HOUR</span><i><b></b></i></div></div><div class="pn g1"><video src="img/recruit-sea.mp4" muted loop playsinline preload="auto" data-n="SEA"></video><video src="img/recruit-sunset.mp4" muted loop playsinline preload="auto" data-n="SUNSET"></video><video src="img/recruit-terrace.mp4" muted loop playsinline preload="auto" data-n="RICE TERRACE"></video><div class="gr"></div><div class="lb"><span class="n">02</span><span class="s"><span class="sn">SUNSET</span></span></div><div class="ft"><span>SUNSET</span><i><b></b></i></div></div><div class="pn g2"><video src="img/recruit-sea.mp4" muted loop playsinline preload="auto" data-n="SEA"></video><video src="img/recruit-sunset.mp4" muted loop playsinline preload="auto" data-n="SUNSET"></video><video src="img/recruit-terrace.mp4" muted loop playsinline preload="auto" data-n="RICE TERRACE"></video><div class="gr"></div><div class="lb"><span class="n">03</span><span class="s"><span class="sn">RICE TERRACE</span></span></div><div class="ft"><span>NIGHT</span><i><b></b></i></div></div></div>
 <h1 class="ttl"><span class="l"><span><span class="s">aiming to build the most</span></span></span><span class="l"><span>fun-loving team</span></span></h1>
</section>
</main>

<div class="next">NEXT SECTION</div>
<script>
(()=>{
const tri=document.getElementById('tri'),pns=[...tri.querySelectorAll('.pn')];
const STEP=7000;let k=0,t0=performance.now();
function show(){
 pns.forEach((pn,i)=>{
  const vs=[...pn.querySelectorAll('video')],s=((i-k)%3+3)%3;
  vs.forEach((v,j)=>{
   if(j===s){v.classList.remove('out');v.classList.add('cur');v.currentTime=(i*2.4)%7;v.play().catch(()=>{})}
   else if(v.classList.contains('cur')){v.classList.remove('cur');v.classList.add('out');setTimeout(()=>{v.classList.remove('out');v.pause()},1600)}
  });
  pn.querySelector('.sn').textContent=vs[s].dataset.n;
 });
}
function loop(now){
 const e=now-t0;
 if(e>STEP){k++;t0=now;show()}
 pns.forEach(pn=>pn.querySelector('.ft b').style.transform='scaleX('+Math.min(1,e/STEP).toFixed(3)+')');
 requestAnimationFrame(loop);
}
show();
requestAnimationFrame(()=>requestAnimationFrame(()=>tri.classList.add('on')));
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
