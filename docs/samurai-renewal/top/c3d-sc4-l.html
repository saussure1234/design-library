<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>STORY 場面4 案L｜NoiseからSignalへ切り替える</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#eceef1;--mute:#7b8089;--sig:#ff5a24;--pad:clamp(16px,3.4vw,52px);
--disp:"Space Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--jp:"IBM Plex Sans JP","Hiragino Sans",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{background:var(--bg);font-family:var(--jp);overflow-x:hidden}
a{color:inherit;text-decoration:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.hd{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:22px var(--pad)}
.hd .logo img{height:26px;width:auto;display:block;filter:brightness(0) invert(1)}
.nav{display:flex;align-items:center;gap:26px;font:500 12px/1 var(--mono);letter-spacing:.08em;margin-left:auto}
.nav a{opacity:.82;transition:opacity .2s}.nav a:hover{opacity:1}
.nav .cta{padding:9px 14px;border:1px solid rgba(255,255,255,.35);border-radius:999px}
.nav .lang{display:flex;gap:9px;color:var(--mute)}.nav .lang b{color:var(--ink);font-weight:500}
.burger{display:none;background:none;border:0;width:36px;height:36px;position:relative}
.burger i{position:absolute;left:8px;right:8px;height:1px;background:#fff}.burger i:first-child{top:14px}.burger i:last-child{top:21px}
.snd{display:flex;align-items:center;gap:8px;margin-left:24px;background:none;border:0;padding:8px 4px;color:#fff;font:500 11px/1 var(--mono);letter-spacing:.1em;cursor:pointer}
.snd .eq{display:flex;align-items:flex-end;gap:2px;height:11px}
.snd .eq i{width:2px;height:11px;background:currentColor;transform:scaleY(.22);transform-origin:bottom;transition:transform .3s}
.snd.on .eq i{animation:eq .9s ease-in-out infinite alternate}
.snd.on .eq i:nth-child(2){animation-delay:-.3s}.snd.on .eq i:nth-child(3){animation-delay:-.6s}.snd.on .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
.snd .st{min-width:3ch;text-align:left;opacity:.7}
.snd.wait .st{animation:blink 1.2s steps(2) infinite}@keyframes blink{50%{opacity:.2}}
.nb{white-space:nowrap}
.tx{position:fixed;z-index:6;top:50%;width:min(31vw,470px);transform:translateY(-50%);pointer-events:none;opacity:0;transition:opacity 1.2s ease .3s}
.ready .tx{opacity:1}
.tx.L{left:var(--pad)}
.tx::before{content:"";position:absolute;inset:-60px -80px;background:radial-gradient(closest-side,rgba(0,0,0,.66),rgba(0,0,0,0));z-index:-1}
.tx .no{display:flex;align-items:baseline;gap:8px;font:400 11px/1 var(--mono);letter-spacing:.1em;color:var(--mute);margin-bottom:22px}
.tx .no b{font:500 13px/1 var(--mono);color:#fff}
.tx .no::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.3),transparent);transform:translateY(-3px)}
.tx .t{font:400 clamp(14px,1.08vw,16px)/2.05 var(--jp);letter-spacing:.05em;color:rgba(236,238,241,.92);text-align:justify}
.tx .tcy{font-family:var(--disp);font-weight:500;color:#fff}
.tx .echo{color:#b4b9c1}
.tx.q .t{font-size:clamp(20px,1.9vw,30px);line-height:1.7;letter-spacing:.04em;text-align:left}
.tx.q em{font-style:normal;font-family:var(--disp);font-weight:500}
.tx.q em.sig{color:var(--sig)}
.tx.q em.nz i{font-style:normal;display:inline-block;color:#8d929b}
.hud{position:fixed;inset:0;z-index:5;pointer-events:none;font:400 11px/1.5 var(--mono);letter-spacing:.08em;color:rgba(225,228,234,.62)}
.hud .prog{position:absolute;left:var(--pad);bottom:28px;display:flex;align-items:center;gap:12px}
.hud .prog .bar{width:120px;height:1px;background:rgba(255,255,255,.16);position:relative}
.hud .prog .bar b{position:absolute;left:0;top:0;bottom:0;background:#d9dde3;width:0}
.hud .rd{position:absolute;right:var(--pad);bottom:26px;text-align:right;white-space:pre}
.hud .rd b{color:#fff;font-weight:500}.hud .rd .s{color:var(--sig)}
.hud canvas{position:absolute;right:var(--pad);bottom:56px;width:220px;height:64px}
.hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;font:400 11px/1 var(--mono);letter-spacing:.14em;color:rgba(255,255,255,.5);pointer-events:none;transition:opacity .6s}
#scroller{position:relative;z-index:1;height:420vh}
@media (max-width:820px){
  .nav{display:none}.burger{display:block}
  .hd{padding:16px}.hd .logo img{height:22px}
  .snd{margin-left:auto;margin-right:4px}.snd .lb{display:none}
  .tx,.tx.L{left:16px;right:16px;width:auto;top:auto;bottom:64px;transform:none}
  .tx::before{inset:-40px -16px -64px;background:linear-gradient(0deg,rgba(0,0,0,.92) 45%,rgba(0,0,0,0))}
  .tx .no{margin-bottom:14px}
  .tx .t{font-size:13.5px;line-height:1.95}
  .tx.q .t{font-size:21px}
  .hud .prog{bottom:24px}.hud .prog .bar{width:64px}
  .hud .rd{bottom:22px;font-size:10px}
  .hud canvas{display:none}
  .hint{display:none}
}

.hud .prog{display:none}
#gl{opacity:var(--fo,1)}
.qw{position:fixed;left:50%;top:var(--qy,42%);z-index:6;width:min(88vw,15.5em);font-size:clamp(21px,2.15vw,34px);transform:translate(-50%,-50%) translateY(calc(var(--fy,0px)*-1));text-align:center;pointer-events:none;opacity:0;transition:opacity 1.2s ease .3s}
.ready .qw{opacity:1}
.qw::before{content:"";position:absolute;inset:-50px -70px;background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0));z-index:-1}
.qw .t{font:400 1em/1.75 var(--jp);letter-spacing:.05em;color:rgba(238,240,244,.95);transition:opacity .8s}
.qw em{font-style:normal;font-family:var(--disp);font-weight:500}
.qw em.sig{color:var(--sig)}
.qw em.nz i{font-style:normal;display:inline-block;color:#8d929b}
#act{position:fixed;left:50%;top:var(--by,68%);z-index:8;transform:translate(-50%,-50%) translateY(calc(var(--fy,0px)*-1));opacity:0;transition:opacity 1s ease .9s}
.ready #act{opacity:1}
.next{position:fixed;left:0;right:0;top:100%;z-index:6;padding:0 var(--pad);transform:translateY(calc(var(--fy,0px)*-1));opacity:0;pointer-events:none}
.next .in{padding:4vh 0 30vh;max-width:min(46vw,620px)}
.next .no{display:flex;align-items:baseline;gap:8px;font:400 11px/1 var(--mono);letter-spacing:.1em;color:var(--mute);margin-bottom:22px}
.next .no b{font:500 13px/1 var(--mono);color:#fff}
.next .no::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.3),transparent);transform:translateY(-3px)}
.next .t{font:400 clamp(14px,1.08vw,16px)/2.05 var(--jp);letter-spacing:.05em;color:rgba(236,238,241,.92);text-align:justify}
.next .zs{color:#a9b4c8;border-bottom:1px solid rgba(169,180,200,.5)}.next .ps{color:#fff;border-bottom:1px solid rgba(255,255,255,.7)}.next .sm{color:#fff}
#scroller{height:300vh}
@media (max-width:820px){
  .qw{top:var(--qys,40%)}
  .qw{font-size:21px}.qw .t{line-height:1.8}
  #act{top:var(--bys,70%)}
  .next .in{max-width:none}
  .next .t{font-size:13.5px;line-height:1.95}
}

.sw{display:flex;align-items:center;gap:16px;background:none;border:0;color:#fff;cursor:pointer;font:500 12px/1 var(--disp);letter-spacing:.14em;-webkit-tap-highlight-color:transparent}
.sw .a{color:#9aa0a9;transition:color .4s}.sw .b{color:rgba(255,255,255,.55);transition:color .4s}
.sw .tr{position:relative;width:92px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.32);background:rgba(0,0,0,.4);transition:border-color .4s,background .4s}
.sw .kn{position:absolute;top:50%;left:5px;width:24px;height:24px;margin-top:-12px;border-radius:50%;background:#c9ccd2;transition:left .5s cubic-bezier(.6,.05,.2,1),background .4s,box-shadow .4s}
.sw .kn::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(255,255,255,.0);transition:border-color .3s}
.sw:hover .kn,.sw.is-hov .kn{left:13px}.sw:hover .kn::after,.sw.is-hov .kn::after{border-color:rgba(255,255,255,.35)}.sw:hover .b,.sw.is-hov .b{color:#fff}
.sw:hover .tr,.sw.is-hov .tr{border-color:rgba(255,90,36,.6)}
.pressed .sw{pointer-events:none;opacity:0;transition:opacity .6s 1.1s}
.pressed .sw .kn{left:61px;background:var(--sig);box-shadow:0 0 16px 3px rgba(255,90,36,.7)}
.pressed .sw .tr{border-color:var(--sig);background:rgba(255,90,36,.12)}
.pressed .sw .a{color:#5b6068}.pressed .sw .b{color:var(--sig)}
.sw-tip{display:block;text-align:center;margin-top:16px;font:400 10px/1 var(--mono);letter-spacing:.14em;color:rgba(255,255,255,.42);transition:opacity .4s}
.pressed .sw-tip{opacity:0}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body style="--qy:40%;--by:72%;--qys:36%;--bys:72%">
<header class="hd" id="hd">
  <a class="logo" href="#" aria-label="SAMURAI STYLE"><img src="img/logo.svg" alt="SAMURAI STYLE"></a>
  <nav class="nav"><a href="#">HOME</a><a href="#">SERVICE</a><a href="https://samurai-style.tokyo/media">MEDIA</a><a href="https://samurai-style.tokyo/company">COMPANY</a><a href="https://samurai-style.tokyo/recruit">RECRUIT</a><a class="cta" href="#">CONTACT</a><div class="lang"><span>ID</span><span>EN</span><b>JA</b></div></nav>
  <button class="snd" id="snd" type="button" aria-pressed="false" aria-label="音のオン・オフ"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="lb">SOUND</span><span class="st">OFF</span></button>
  <button class="burger" aria-label="Menu"><i></i><i></i></button>
</header>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="hud" id="hud" aria-hidden="true"><div class="rd" id="rd"></div></div>
<div class="qw"><p class="t"><span class="nb">では、</span><wbr><span class="nb"><em class="sig">Signal</em>と</span><wbr><span class="nb"><em class="nz"><i>N</i><i>o</i><i>i</i><i>s</i><i>e</i></em>を</span><wbr><span class="nb">見極める要素は</span><wbr><span class="nb">どこに</span><wbr><span class="nb">存在するのでしょうか。</span></p></div>
<div id="act"><button class="sw" id="go" type="button" role="switch" aria-checked="false" aria-label="NoiseからSignalへ切り替える（次へ進む）"><span class="a">NOISE</span><span class="tr"><span class="kn"></span></span><span class="b">SIGNAL</span></button><span class="sw-tip">SWITCH TO SIGNAL</span></div>
<section class="next" id="next" aria-hidden="true"><div class="in"><span class="no"><b>05</b><span>/ 06</span></span><p class="t">年収・地位・資産など上下の相対比較で幸福度を測る<span class="zs">ゼロサムゲーム</span>と、成長・信頼・創造など一緒に何かに取り組むことで幸福が生まれる<span class="ps">プラスサムゲーム</span>との視点から様々な事象を捉えた際、創業時に掲げた<span class="sm">「笑顔の総量の最大化」</span>を軸に置くと判断基準は明確になると考えています。</p></div></section>
<div class="hint" id="hint"></div>
<main id="scroller"></main>
<script type="module" src="3d/cand/sc4l.js"></script>
</body>
</html>
