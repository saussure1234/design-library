<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FV 案1 文字で埋める | サムライスタイル 候補</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-x:hidden;overflow-x:clip}
body{background:#efede6;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip}
a{color:inherit;text-decoration:none}
.nb{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.hd{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:16px clamp(16px,2.8vw,40px);font:500 13px/1 "Inter Tight","Noto Sans JP",sans-serif;letter-spacing:.02em;color:var(--hd,#0d0d0d);pointer-events:none}
.hd>*{pointer-events:auto}
.hd .logo{display:block;height:34px}.hd .logo img{height:100%;width:auto;display:block}
.hd.dk{--hd:#fff}.hd.dk .logo img{filter:invert(1)}
.hd .nav{display:flex;align-items:center;gap:2px}
.hd .nav a{padding:9px 12px;border-radius:99px;transition:opacity .3s}
.hd .nav a:hover{opacity:.6}
.hd .nav a.cta{border:1px solid currentColor;margin-left:6px;padding:9px 16px}
.hd .lang{display:flex;gap:2px;margin-left:12px;font-size:11px}
.hd .lang span{padding:6px 7px;opacity:.5}.hd .lang b{padding:6px 7px;font-weight:600;border-bottom:1px solid currentColor}
.hd .mb{display:none;background:none;border:1px solid currentColor;color:inherit;font:500 12px/1 "Inter Tight",sans-serif;letter-spacing:.08em;padding:10px 14px;border-radius:99px;cursor:pointer}
.mov{position:fixed;inset:0;z-index:59;background:#0d0d0d;color:#fff;padding:96px 20px 32px;display:none;flex-direction:column;gap:6px;font:500 34px/1.15 "Inter Tight",sans-serif;letter-spacing:-.02em}
.mov a{padding:4px 0}
body.mopen .mov{display:flex}
@media(max-width:960px){.hd .nav{display:none}.hd .mb{display:block}.hd .logo{height:30px}}


:root{--bg:#efede6;--ink:#0b0b0b}
body{background:var(--bg);color:var(--ink);font-family:"Inter Tight","Noto Sans JP",sans-serif}
.fv{position:relative;height:100vh;height:100svh;min-height:560px;display:flex;flex-direction:column;padding:74px clamp(16px,2.8vw,40px) 26px;overflow:hidden}
.wm{margin:0;font-weight:500;letter-spacing:-.035em;line-height:.78;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:flex-start}
.wm .ln{display:block;white-space:nowrap;overflow:hidden;padding:.02em 0 .2em;margin:0 0 -.17em -.055em}
.wm .ln>span{display:inline-block;transform:translateY(105%);transition:transform 1.15s cubic-bezier(.2,.75,.1,1)}
.wm .ln:nth-child(2)>span{transition-delay:.12s}.wm .ln:nth-child(3)>span{transition-delay:.24s}
.ready .wm .ln>span{transform:none}
.wm .sp3{display:none}
.cap{display:grid;grid-template-columns:auto 1fr auto;gap:0 64px;align-items:end;font-size:15px;line-height:1.45;border-top:1px solid rgba(11,11,11,.18);padding-top:18px;opacity:0;transition:opacity .8s .7s}
.ready .cap{opacity:1}
.cap p{margin:0;font-family:"Noto Sans JP",sans-serif;font-weight:500;letter-spacing:.02em}
.cap .hint{font-size:14px;letter-spacing:.01em;white-space:nowrap}
.dot{color:#1b4dff}
@media(max-width:700px){
  .fv{padding:84px 16px 24px}
  .wm .sp2{display:none}.wm .sp3{display:block}
  .wm{justify-content:center}
  .cap{grid-template-columns:1fr auto;gap:0 16px;font-size:13px}
  .cap p{display:flex;flex-direction:column;line-height:1.6}
  .cap .hint{font-size:12px}
}

</style>
</head>
<body>
<header class="hd" id="hd">
  <a class="logo" href="#top" aria-label="SAMURAI STYLE"><img src="img/logo.svg" alt="SAMURAI STYLE"></a>
  <nav class="nav"><a href="#top">HOME</a><a href="#service">SERVICE</a><a href="https://samurai-style.tokyo/media">MEDIA</a><a href="https://samurai-style.tokyo/company">COMPANY</a><a href="https://samurai-style.tokyo/recruit">RECRUIT</a><a class="cta" href="#contact">CONTACT</a><div class="lang"><span>ID</span><span>EN</span><b>JA</b></div></nav>
  <button class="mb" type="button" onclick="document.body.classList.toggle('mopen')">MENU</button>
</header>
<div class="mov" onclick="document.body.classList.remove('mopen')"><a href="#top">HOME</a><a href="#service">SERVICE</a><a href="https://samurai-style.tokyo/media">MEDIA</a><a href="https://samurai-style.tokyo/company">COMPANY</a><a href="https://samurai-style.tokyo/recruit">RECRUIT</a><a href="#contact">CONTACT</a></div>
<main id="top">
<section class="fv" id="fv">
  <h1 class="wm" aria-label="find the signal.">
    <span class="ln sp2" aria-hidden="true"><span>find the</span></span>
    <span class="ln sp2" aria-hidden="true"><span>signal<span class="dot">.</span></span></span>
    <span class="ln sp3" aria-hidden="true"><span>find</span></span>
    <span class="ln sp3" aria-hidden="true"><span>the</span></span>
    <span class="ln sp3" aria-hidden="true"><span>signal<span class="dot">.</span></span></span>
  </h1>
  <div class="cap"><p><span class="nb">何が本質的なシグナルで</span><wbr><span class="nb">何が一時的なノイズなのかを</span><wbr><span class="nb">見極める。</span></p><span></span><span class="hint">scroll to align ↓</span></div>
</section>
</main>
<script>

const fv=document.getElementById('fv'),wm=fv.querySelector('.wm'),cap=fv.querySelector('.cap');
function fit(){
  const lines=[...wm.querySelectorAll('.ln')].filter(l=>getComputedStyle(l).display!=='none');
  const W=wm.clientWidth;
  const sizes=lines.map(l=>{l.style.fontSize='100px';const w=l.firstElementChild.getBoundingClientRect().width;return 100*W/w*0.995});
  lines.forEach((l,i)=>l.style.fontSize=sizes[i].toFixed(1)+'px');
  // 最後の行（descender込み）が説明行の上 14px に収まるよう全体を縮める
  const top=lines[0].getBoundingClientRect().top,bot=lines[lines.length-1].getBoundingClientRect().bottom,lim=cap.getBoundingClientRect().top-14;
  const k=Math.min(1,(lim-top)/(bot-top));
  if(k<1)lines.forEach((l,i)=>l.style.fontSize=(sizes[i]*k).toFixed(1)+'px');
  window.__fill=k;
}
document.fonts.ready.then(()=>{fit();requestAnimationFrame(()=>document.body.classList.add('ready'))});
addEventListener('resize',fit);

</script>
</body>
</html>
