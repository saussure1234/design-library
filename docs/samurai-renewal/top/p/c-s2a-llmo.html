<style>:root{--disp:"Space Grotesk";--jp:"IBM Plex Sans JP";--m:clamp(20px,5.5vw,80px)}*{box-sizing:border-box}

/* LLMO の図の候補（c-s2a-llmo） */
.lmF{position:relative;height:auto!important;aspect-ratio:560/340}
.lmF svg{display:block;width:100%;height:100%;overflow:visible}
.lmF text{font-family:var(--disp),var(--jp),sans-serif;text-anchor:middle;fill:#151513}
.lmF .pl rect{fill:#fbfaf6;stroke:#1f6f96;stroke-width:1.2;transition:fill .5s}
.lmF .nm{font-size:17px;font-weight:600}.lmF .sb{font-size:10.5px;fill:#5e6b72}
.lmF .lb{font-size:13px;fill:#1f6f96;letter-spacing:.08em}
.lmF .me rect,.lmF .me circle{fill:#143f57}.lmF .mn{font-size:22px;font-weight:600;fill:#fff;font-family:var(--jp)}
/* A */
.lm-a .ln{fill:none;stroke:#1f6f96;stroke-width:1.4;stroke-dasharray:100;stroke-dashoffset:100}
.lm-a.on .ln{transition:stroke-dashoffset 1.1s cubic-bezier(.3,.7,.2,1) calc(.2s + var(--i) * .18s);stroke-dashoffset:0}
.lm-a .dt{fill:#1f6f96;opacity:0}.lm-a.on .dt{opacity:1;transition:opacity .4s 1.6s}
.lm-a.on .pl rect{animation:lmGlow 5s calc(var(--i) * 1s) infinite}
.lm-a .me rect{transform-box:fill-box;transform-origin:center}.lm-a.on .me rect{animation:lmPulse 2.6s 1.6s infinite}
/* B */
.lm-b .fr{fill:#fbfaf6;stroke:#dcd8cd}.lm-b .hd{fill:#e2f4fc}.lm-b .wn{text-anchor:start;font-size:13.5px;font-weight:600}
.lm-b .q{fill:#efeadf}.lm-b .qt{font-size:10.5px;fill:#5e6b72;font-family:var(--jp)}.lm-b .a{fill:#dcd8cd}
.lm-b .hit rect{fill:#cfe9f5;stroke:#1f6f96}.lm-b .ht{font-size:12.5px;font-weight:600;fill:#143f57;font-family:var(--jp)}
.lm-b .win{opacity:0;transform:translateY(8px);transition:opacity .6s calc(var(--i) * .16s),transform .6s calc(var(--i) * .16s)}
.lm-b.on .win{opacity:1;transform:none}
.lm-b.on .hit rect{animation:lmHit 5s calc(1s + var(--i) * .9s) infinite}
/* C */
.lm-c .orb{fill:none;stroke:#cfe9f5;stroke-width:1.2;stroke-dasharray:3 6}
.lm-c .cl{stroke:#1f6f96;stroke-width:1.2;opacity:.55}.lm-c .cdt{fill:#1f6f96}

.lm-d .th{font-size:13.5px;font-family:var(--jp);fill:#3b3a36}.lm-d .rl{stroke:#151513;stroke-width:1}
.lm-d .rb{fill:#fbfaf6;stroke:#dcd8cd;transition:fill .4s}.lm-d .rn{text-anchor:start;font-size:16px;font-weight:600}.lm-d .rs{text-anchor:start;font-size:10px;fill:#5e6b72}
.lm-d .ck circle{fill:#fff;stroke:#dcd8cd;transition:fill .4s,stroke .4s}.lm-d .ck path{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .4s}
.lm-d.on .ck circle{fill:#1f6f96;stroke:#1f6f96;transition-delay:calc(.3s + var(--i) * .35s + var(--j) * .1s)}
.lm-d.on .ck path{opacity:1;transition-delay:calc(.3s + var(--i) * .35s + var(--j) * .1s)}

@keyframes lmPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* LLMO の図の候補：画面に入ったら .on（線が伸びる・札が灯る）。C は札が自社のまわりをゆっくり回る */
(() => { const fs = [...document.querySelectorAll('.lmF')]; if (!fs.length) return;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('on'); e.target._vis = e.isIntersecting; }), { threshold: .25 });
  fs.forEach(f => io.observe(f));
  const c = fs.find(f => f.classList.contains('lm-c')); if (!c) return;
  const ops = [...c.querySelectorAll('.op')], ls = [...c.querySelectorAll('.cl')], ds = [...c.querySelectorAll('.cdt')];
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches; let t = 0, prev = performance.now();
  (function loop(now) { requestAnimationFrame(loop); const dt = Math.min(.05, (now - prev) / 1000); prev = now; if (!c._vis && t) return; if (!RM) t += dt;
    ops.forEach((o, i) => { const a = -Math.PI / 2 + i / ops.length * Math.PI * 2 + t * .12, x = 280 + Math.cos(a) * 188, y = 170 + Math.sin(a) * 116;
      o.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`); ls[i].setAttribute('x2', x.toFixed(1)); ls[i].setAttribute('y2', y.toFixed(1));
      const u = ((t * .5 + i * .37) % 1), k = 1 - u; ds[i].setAttribute('cx', (280 + (x - 280) * k).toFixed(1)); ds[i].setAttribute('cy', (170 + (y - 170) * k).toFixed(1)); ds[i].setAttribute('opacity', (Math.sin(u * Math.PI)).toFixed(2)); }); })(prev);
})();
