<head>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#020203;--ink:#e8eaee;--mute:#7d828c;--sig:#ff5a24;--pad:clamp(16px,3.4vw,52px);--disp:"Space Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--jp:"IBM Plex Sans JP","Hiragino Sans",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{background:var(--bg);font-family:var(--jp);overflow-x:hidden}
a{color:inherit;text-decoration:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.ld{position:fixed;inset:0;z-index:50;background:var(--bg);transition:opacity .8s ease}
.ld.out{opacity:0;pointer-events:none}
.hd{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:22px var(--pad)}
.hd .logo img{height:26px;width:auto;display:block;filter:brightness(0) invert(1)}
.nav{display:flex;align-items:center;gap:26px;margin-left:auto;font:500 12px/1 var(--mono);letter-spacing:.08em}
.nav a{opacity:.82}
.nav .cta{padding:9px 14px;border:1px solid rgba(255,255,255,.35);border-radius:999px}
.nav .lang{display:flex;gap:9px;color:var(--mute)}.nav .lang b{color:var(--ink);font-weight:500}
.snd{display:flex;align-items:center;gap:8px;margin-left:24px;background:none;border:0;padding:8px 4px;color:#fff;font:500 11px/1 var(--mono);letter-spacing:.1em;cursor:pointer}
.snd .eq{display:flex;align-items:flex-end;gap:2px;height:11px}
.snd .eq i{width:2px;height:11px;background:currentColor;transform:scaleY(.22);transform-origin:bottom;transition:transform .3s}
.snd.on .eq i{animation:eq .9s ease-in-out infinite alternate}
.snd.on .eq i:nth-child(2){animation-delay:-.3s}.snd.on .eq i:nth-child(3){animation-delay:-.6s}.snd.on .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
.snd .st{min-width:3ch;text-align:left;opacity:.7}
.snd.wait .st{animation:blink 1.2s steps(2) infinite}@keyframes blink{50%{opacity:.2}}
.burger{display:none;background:none;border:0;width:36px;height:36px;position:relative}
.burger i{position:absolute;left:8px;right:8px;height:1px;background:#fff}.burger i:first-child{top:14px}.burger i:last-child{top:21px}
#scroller{position:relative;z-index:1;height:520vh}
.tx{position:fixed;z-index:6;left:var(--pad);top:50%;width:min(31vw,470px);transform:translateY(-50%);opacity:0;transition:opacity 1.2s ease}
.tx.in{opacity:1}
.tx::before{content:"";position:absolute;inset:-60px -80px;background:radial-gradient(closest-side,rgba(2,2,3,.7),rgba(2,2,3,0));z-index:-1}
.tx .no{display:flex;align-items:baseline;gap:8px;font:400 11px/1 var(--mono);letter-spacing:.1em;color:var(--mute);margin-bottom:22px}
.tx .no b{font:500 13px/1 var(--mono);color:#fff}
.tx .no::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.3),transparent);transform:translateY(-3px)}
.tx .t{font:400 clamp(14px,1.08vw,16px)/2.05 var(--jp);letter-spacing:.05em;color:rgba(232,234,238,.88);text-align:justify}
.tx .t2{margin-top:18px;font:400 clamp(13px,.98vw,15px)/1.9 var(--jp);letter-spacing:.05em;color:rgba(232,234,238,.76)}
.tx .lead{display:block;font-size:1.18em;color:#fff;margin-bottom:6px;text-align:left}
.tx .zs,.tx .ps,.tx .sm,.tx .sh,.tx .lg{transition:color .8s,border-color .8s,text-shadow .8s;border-bottom:1px solid transparent}
.tx .zs.on{color:#c9ced8;border-bottom-color:rgba(201,206,216,.55)}
.tx .ps.on{color:#fff;border-bottom-color:rgba(255,255,255,.75)}
.tx .sm.on{color:var(--sig);text-shadow:0 0 .8em rgba(255,90,36,.35)}
.tx .sh{color:#9aa0aa}
.tx .lg.on{color:#fff}
.nb{white-space:nowrap}
.tocontact{display:inline-flex;gap:10px;align-items:center;margin-top:24px;padding:12px 20px;border:1px solid rgba(255,255,255,.3);border-radius:999px;font:500 12px/1 var(--mono);letter-spacing:.12em;transition:border-color .8s,color .8s,box-shadow .8s}
.tocontact.on{border-color:var(--sig);color:#fff;box-shadow:0 0 24px rgba(255,90,36,.25)}
.tocontact:hover{color:var(--sig)}
.prog{position:fixed;left:var(--pad);bottom:28px;z-index:6;display:flex;align-items:center;gap:12px;font:400 11px/1 var(--mono);letter-spacing:.06em;color:rgba(230,235,245,.6)}
.prog .bar{width:120px;height:1px;background:rgba(255,255,255,.18);position:relative}
.prog .bar b{position:absolute;left:0;top:0;bottom:0;background:#dfe3ea;width:0}
.hint{position:fixed;right:var(--pad);bottom:26px;z-index:6;font:400 11px/1 var(--mono);letter-spacing:.14em;color:rgba(255,255,255,.45)}
@media (max-width:820px){
  .nav{display:none}.burger{display:block}
  .hd{padding:16px}.hd .logo img{height:22px}
  .snd{margin-left:auto;margin-right:4px}.snd .lb{display:none}
  .tx{left:16px;right:16px;width:auto;top:auto;bottom:64px;transform:none}
  .tx::before{inset:-40px -16px -70px;background:linear-gradient(0deg,rgba(2,2,3,.92) 45%,rgba(2,2,3,0))}
  .tx .no{margin-bottom:12px}
  .tx .t{font-size:13px;line-height:1.9}
  .tx .t2{font-size:12.5px;margin-top:10px}
  .tocontact{margin-top:14px;padding:10px 16px}
  .prog{bottom:22px}.hint{display:none}
}
</style>
