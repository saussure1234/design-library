<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FV 案2 全面の写真 | サムライスタイル 候補</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter+Tight:wght@500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-x:hidden;overflow-x:clip}
body{background:#000;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip}
a{color:inherit;text-decoration:none}
.nb{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.hd{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:16px clamp(16px,2.8vw,40px);font:500 13px/1 "Inter Tight","Noto Sans JP",sans-serif;letter-spacing:.02em;color:var(--hd,#0d0d0d);pointer-events:none}
.hd>*{pointer-events:auto}
.hd .logo{display:block;height:34px}.hd .logo img{height:100%;width:auto;display:block}
.hd.dk{--hd:#fff}.hd.dk .logo img{filter:invert(1)}
.hd .nav{display:flex;align-items:center;gap:2px}
.hd .nav a{padding:9px 12px;border-radius:99px;transition:opacity .3s}
.hd .nav a:hover{opacity:.6}
.hd .nav a.cta{border:1px solid currentColor;margin-left:6px;padding:9px 16px}
.hd .lang{display:flex;gap:2px;margin-left:12px;font-size:11px}
.hd .lang span{padding:6px 7px;opacity:.5}.hd .lang b{padding:6px 7px;font-weight:600;border-bottom:1px solid currentColor}
.hd .mb{display:none;background:none;border:1px solid currentColor;color:inherit;font:500 12px/1 "Inter Tight",sans-serif;letter-spacing:.08em;padding:10px 14px;border-radius:99px;cursor:pointer}
.mov{position:fixed;inset:0;z-index:59;background:#0d0d0d;color:#fff;padding:96px 20px 32px;display:none;flex-direction:column;gap:6px;font:500 34px/1.15 "Inter Tight",sans-serif;letter-spacing:-.02em}
.mov a{padding:4px 0}
body.mopen .mov{display:flex}
@media(max-width:960px){.hd .nav{display:none}.hd .mb{display:block}.hd .logo{height:30px}}


:root{--band:88px}
body{background:#000;color:#f2f2f2;font-family:"Archivo","Noto Sans JP",sans-serif}
.fv{position:relative;height:100vh;height:100svh;min-height:600px;background:#000;overflow:hidden}
.ph{position:absolute;left:0;right:0;top:var(--band);bottom:0;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;display:block;transform:scale(1.12);transition:transform 14s cubic-bezier(.2,.6,.2,1)}
.ready .ph img{transform:scale(1.0)}
.ph .glow{position:absolute;width:46vmin;height:46vmin;margin:-23vmin 0 0 -23vmin;border-radius:50%;background:radial-gradient(closest-side,rgba(255,196,120,.55),rgba(255,160,80,.18) 45%,transparent 72%);mix-blend-mode:screen;animation:fl 3.6s ease-in-out infinite;pointer-events:none}
@keyframes fl{0%,100%{opacity:.75;transform:scale(1)}45%{opacity:1;transform:scale(1.06)}70%{opacity:.85;transform:scale(.98)}}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 22%,transparent 48%,rgba(0,0,0,.62) 100%)}
.ttl{position:absolute;left:10px;bottom:10px;margin:0;font-weight:800;font-stretch:125%;font-variation-settings:"wdth" 125;text-transform:none;font-size:clamp(54px,11.2vw,172px);line-height:.86;letter-spacing:-.012em;color:#f1f1ef;z-index:2}
.ttl span{display:block;overflow:hidden;padding-bottom:.16em;margin-bottom:-.12em}
.ttl span i{display:block;font-style:normal;transform:translateY(102%);transition:transform 1.1s cubic-bezier(.2,.75,.1,1)}
.ttl span:nth-child(2) i{transition-delay:.12s}
.ready .ttl span i{transform:none}
.side{position:absolute;right:clamp(16px,2.8vw,40px);bottom:28px;width:min(330px,30vw);z-index:2;font-family:"Noto Sans JP",sans-serif;font-size:14px;line-height:1.85;letter-spacing:.04em;color:#e9e9e6;opacity:0;transition:opacity 1s .6s}
.ready .side{opacity:1}
.side p{margin:0 0 18px}
.side .hint{font:500 12px/1 "Archivo",sans-serif;letter-spacing:.08em;text-transform:none;display:inline-block;border:1px solid rgba(255,255,255,.55);padding:9px 12px}
@media(max-width:820px){
  :root{--band:66px}
  .ttl{left:8px;bottom:auto;top:calc(100% - 300px);font-size:clamp(44px,14.6vw,120px)}
  .side{left:16px;right:16px;width:auto;bottom:22px;font-size:13px}
  .side p{margin-bottom:14px}
}

</style>
</head>
<body>
<header class="hd dk" id="hd">
  <a class="logo" href="#top" aria-label="SAMURAI STYLE"><img src="img/logo.svg" alt="SAMURAI STYLE"></a>
  <nav class="nav"><a href="#top">HOME</a><a href="#service">SERVICE</a><a href="https://samurai-style.tokyo/media">MEDIA</a><a href="https://samurai-style.tokyo/company">COMPANY</a><a href="https://samurai-style.tokyo/recruit">RECRUIT</a><a class="cta" href="#contact">CONTACT</a><div class="lang"><span>ID</span><span>EN</span><b>JA</b></div></nav>
  <button class="mb" type="button" onclick="document.body.classList.toggle('mopen')">MENU</button>
</header>
<div class="mov" onclick="document.body.classList.remove('mopen')"><a href="#top">HOME</a><a href="#service">SERVICE</a><a href="https://samurai-style.tokyo/media">MEDIA</a><a href="https://samurai-style.tokyo/company">COMPANY</a><a href="https://samurai-style.tokyo/recruit">RECRUIT</a><a href="#contact">CONTACT</a></div>
<main id="top">
<section class="fv" id="fv">
  <div class="ph"><img id="ph" src="img/story/s4.webp" alt="霧の立ちこめる水面で、ひとりがランタンを高く掲げている"><i class="glow" id="glow" aria-hidden="true"></i></div>
  <h1 class="ttl" aria-label="find the signal."><span aria-hidden="true"><i>find the</i></span><span aria-hidden="true"><i>signal.</i></span></h1>
  <div class="side"><p><span class="nb">何が本質的なシグナルで</span><wbr><span class="nb">何が一時的なノイズなのかを</span><wbr><span class="nb">見極める。</span></p><span class="hint">scroll to align ↓</span></div>
</section>
</main>
<script>

const img=document.getElementById('ph'),g=document.getElementById('glow');
// ランタン（画像内の位置 x=.535, y=.415）に光を重ねる。object-fit:cover の切り取りを計算
function place(){const b=img.parentElement.getBoundingClientRect(),iw=1536,ih=1024;
  const s=Math.max(b.width/iw,b.height/ih),dw=iw*s,dh=ih*s,ox=(b.width-dw)*.5,oy=(b.height-dh)*.45;
  g.style.left=(ox+dw*.535)+'px';g.style.top=(oy+dh*.415)+'px';}
place();addEventListener('resize',place);
const go=()=>requestAnimationFrame(()=>document.body.classList.add('ready'));
img.complete?go():img.addEventListener('load',go);

</script>
</body>
</html>
