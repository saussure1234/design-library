<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FV 案C｜ピント送り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..600&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#eceef1;--mute:#7b8089;--sig:#ff5a24;--cy:#c8efff;--pad:clamp(16px,3.4vw,52px);
--disp:"Space Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--jp:"IBM Plex Sans JP","Hiragino Sans",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{background:var(--bg);font-family:var(--jp);overflow-x:hidden}
a{color:inherit;text-decoration:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.hd{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:22px var(--pad)}
.hd .logo img{height:26px;width:auto;display:block;filter:brightness(0) invert(1)}
.nav{display:flex;align-items:center;gap:26px;font:500 12px/1 var(--mono);letter-spacing:.08em;margin-left:auto}
.nav a{opacity:.82;transition:opacity .2s}.nav a:hover{opacity:1}
.nav .cta{padding:9px 14px;border:1px solid rgba(255,255,255,.35);border-radius:999px}
.nav .lang{display:flex;gap:9px;color:var(--mute)}.nav .lang b{color:var(--ink);font-weight:500}
.burger{display:none;background:none;border:0;width:36px;height:36px;position:relative}
.burger i{position:absolute;left:8px;right:8px;height:1px;background:#fff}.burger i:first-child{top:14px}.burger i:last-child{top:21px}
.snd{position:fixed;right:var(--pad);bottom:22px;z-index:9;display:flex;align-items:center;gap:8px;background:none;border:0;padding:8px 4px;color:#fff;font:500 11px/1 var(--mono);letter-spacing:.1em;cursor:pointer}
.snd .eq{display:flex;align-items:flex-end;gap:2px;height:11px}
.snd .eq i{width:2px;height:11px;background:currentColor;transform:scaleY(.22);transform-origin:bottom;transition:transform .3s}
.snd.on .eq i{animation:eq .9s ease-in-out infinite alternate}
.snd.on .eq i:nth-child(2){animation-delay:-.3s}.snd.on .eq i:nth-child(3){animation-delay:-.6s}.snd.on .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
.snd .st{min-width:3ch;text-align:left;opacity:.7}
.nb{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* FV の3語（本線と同じ書体） */
.fvx{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;transition:opacity 1.2s ease .2s}
.ready .fvx{opacity:1}
.fvx .wd{position:absolute;left:0;top:0;font-family:"Bricolage Grotesque","Inter Tight",sans-serif;font-weight:250;font-variation-settings:"opsz" 96,"wdth" 92;line-height:1;letter-spacing:-.045em;white-space:nowrap;transform-origin:0 0;will-change:transform,opacity,filter;color:#f3f1ff}
.fvx .wd.sig{color:var(--cy)}
.fvx .wd.sig.lit{text-shadow:0 0 .3em rgba(143,220,255,.55),0 0 .9em rgba(119,197,237,.25)}
.fvx .wd .gh{position:absolute;left:0;top:0;pointer-events:none;mix-blend-mode:screen}
.fvx .sum{position:absolute;left:0;right:0;margin:0;text-align:center;font:300 clamp(14px,1.25vw,18px)/1.9 var(--jp);letter-spacing:.1em;opacity:0;padding:0 var(--pad);color:#f3f1ff}
/* 場面1の文（本線と同じ） */
.tx{position:fixed;z-index:6;top:50%;width:min(31vw,470px);transform:translateY(-50%);pointer-events:none;opacity:0}
.tx.R{right:var(--pad)}
.tx::before{content:"";position:absolute;inset:-60px -80px;background:radial-gradient(closest-side,rgba(0,0,0,.62),rgba(0,0,0,0));z-index:-1}
.tx .no{display:flex;align-items:baseline;gap:8px;font:400 11px/1 var(--mono);letter-spacing:.1em;color:var(--mute);margin-bottom:22px}
.tx .no b{font:500 13px/1 var(--mono);color:#fff}
.tx .no::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.3),transparent);transform:translateY(-3px)}
.tx .t{font:400 clamp(14px,1.08vw,16px)/2.05 var(--jp);letter-spacing:.05em;color:rgba(236,238,241,.92);text-align:justify}
.tx .tcy{font-family:var(--disp);font-weight:500;color:#fff}
.tx .c{opacity:0;transition:opacity .5s}
.hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;font:400 11px/1 var(--mono);letter-spacing:.14em;color:rgba(255,255,255,.55);pointer-events:none;transition:opacity .6s}
#scroller{position:relative;z-index:1;height:720vh}
@media (max-width:820px){
  .nav{display:none}.burger{display:block}
  .hd{padding:16px}.hd .logo img{height:22px}
  .snd{right:16px;bottom:16px}
  .fvx .sum{font-size:14px}
  .tx,.tx.R{left:16px;right:16px;width:auto;top:auto;bottom:64px;transform:none}
  .tx::before{inset:-40px -16px -64px;background:linear-gradient(0deg,rgba(0,0,0,.92) 45%,rgba(0,0,0,0))}
  .tx .no{margin-bottom:14px}
  .tx .t{font-size:13.5px;line-height:1.95}
  .hint{bottom:60px}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<header class="hd" id="hd">
  <a class="logo" href="#" aria-label="SAMURAI STYLE"><img src="img/logo.svg" alt="SAMURAI STYLE"></a>
  <nav class="nav"><a href="#">HOME</a><a href="#">SERVICE</a><a href="https://samurai-style.tokyo/media">MEDIA</a><a href="https://samurai-style.tokyo/company">COMPANY</a><a href="https://samurai-style.tokyo/recruit">RECRUIT</a><a class="cta" href="#">CONTACT</a><div class="lang"><span>ID</span><span>EN</span><b>JA</b></div></nav>
  <button class="burger" aria-label="Menu"><i></i><i></i></button>
</header>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="fvx" id="fvx">
  <h1 class="sr">find the signal.</h1>
  <span class="wd" aria-hidden="true">find</span><span class="wd" aria-hidden="true">the</span><span class="wd sig" aria-hidden="true">signal.</span>
  <p class="sum" id="fsum"><span class="nb">何が本質的なシグナルで</span><wbr><span class="nb">何が一時的なノイズなのかを</span><wbr><span class="nb">見極める。</span></p>
</div>
<div class="tx R" id="tx1"><span class="no"><b>01</b><span>/ 06</span></span><p class="t">「誰かの役に立つ」という営みの中で、これまで人間が担ってきた“考えること”や“実行すること”の一部が、いま急速に<span class="tcy">AI</span>へと置き換わりつつあります。変化の激しさが増し続けるこの時代において、マクロな視点では人間らしさを、ミクロな視点では自分らしさを保ちながら、どう生き残っていくべきか。私たちはその問いを日々考え続けています。</p></div>
<div class="hint" id="hint">scroll ↓</div>
<button class="snd" id="snd" type="button" aria-pressed="false" aria-label="音のオン・オフ"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="lb">SOUND</span><span class="st">OFF</span></button>
<main id="scroller"></main>
<script type="module" src="3d/fv/fvc.js"></script>
</body>
</html>
