<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex,nofollow">
<title>LLMO ダッシュボード｜ケイウノ</title>
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --side: #f7f7f5;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --line: #e7e6e0;
  --soft: #f4f4f1;
  --hover: #efefeb;
  --s1: #2a78d6;   /* ChatGPT */
  --s2: #eb6834;   /* Gemini */
  --mark: #ffec80;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.6 system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Segoe UI", sans-serif; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.s1 { --c: var(--s1); } .s2 { --c: var(--s2); }
.muted { color: var(--muted); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- 骨組み：左メニュー＋右の本体 ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.proj { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.proj b { display: block; font-size: 14px; line-height: 1.3; }
.proj span { font-size: 12px; color: var(--muted); }
.group { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; padding: 14px 10px 6px; }
.navi { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; text-align: left; color: var(--ink-2); font-weight: 600; }
.navi:hover { background: var(--hover); color: var(--ink); }
.navi[aria-current="page"] { background: #fff; color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.navi svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.navi .cnt { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 600; }

.main { min-width: 0; }
.top { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.fl { display: inline-flex; align-items: center; gap: 6px; }
.fl > span { font-size: 12px; color: var(--muted); font-weight: 600; }
.segc { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: #fff; }
.segc button { border: 0; background: transparent; border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.segc button[aria-pressed="true"] { background: var(--soft); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.chip0 { font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; background: #fff; }
.bar { width: 14px; height: 3px; border-radius: 2px; background: var(--c); display: inline-block; flex: none; }
.page { padding: 22px 24px 60px; max-width: 1180px; }
.crumb { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.crumb button { border: 0; background: none; padding: 0; color: var(--muted); font-weight: 600; }
.crumb button:hover { color: var(--ink); text-decoration: underline; }
.ptitle { font-size: 21px; font-weight: 800; margin-top: 4px; }
.psub { color: var(--ink-2); margin-top: 4px; }

/* ---------- 部品 ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 18px; }
.kpi { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.kpi .lab { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; font-weight: 600; }
.kpi .val { font-size: 30px; font-weight: 800; line-height: 1.2; margin-top: 4px; letter-spacing: -.01em; }
.kpi .val small { font-size: 14px; color: var(--ink-2); font-weight: 700; margin-left: 2px; }
.kpi .cap { font-size: 12px; color: var(--muted); }
.panels { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; margin-top: 12px; }
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.panel h2 { font-size: 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel h2 .more { border: 0; background: none; font-size: 12px; color: var(--ink-2); font-weight: 600; padding: 0; }
.panel h2 .more:hover { text-decoration: underline; }
.panel .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tw { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.go { cursor: pointer; }
tr.go:hover td { background: var(--soft); }
tr.me td { background: #fffbe0; }
tr.me td:first-child { font-weight: 800; }
.qcell b { display: block; font-size: 13px; }
.qcell span { display: block; font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 1px; }
.tag { display: inline-block; font-size: 11px; font-weight: 800; color: #fff; background: var(--ink); border-radius: 5px; padding: 0 6px; }
.kind { display: inline-block; font-size: 11px; font-weight: 700; color: var(--ink-2); background: var(--soft); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.dots { display: inline-flex; gap: 4px; vertical-align: middle; margin-right: 8px; }
.d { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px #c9c8c0; display: inline-block; }
.d.on { background: var(--c); box-shadow: none; }
.meter { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.meter .trk { flex: 1; height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.meter .trk i { display: block; height: 100%; background: var(--c, var(--ink)); border-radius: 3px; }
.meter b { font-size: 13px; font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
.chev { color: var(--muted); text-align: right; }
.yes { font-weight: 800; }
.no { color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; padding: 14px 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
.search { border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font: inherit; width: 340px; max-width: 100%; }
.note { margin-top: 12px; font-size: 13px; color: var(--ink-2); background: var(--soft); border-radius: 8px; padding: 8px 12px; }

/* ---------- 質問一覧（記録シートと同じ列） ---------- */
.grid { overflow: auto; max-height: calc(100vh - 230px); border: 1px solid var(--line); border-radius: 10px; margin-top: 14px; }
.grid table { font-size: 12.5px; }
.grid th { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 0; box-shadow: inset 0 -1px 0 var(--line); }
.grid td { vertical-align: top; padding: 9px 10px; background: #fff; }
.grid th:first-child, .grid td:first-child { position: sticky; left: 0; z-index: 1; box-shadow: inset -1px 0 0 var(--line); }
.grid th:first-child { z-index: 3; box-shadow: inset -1px -1px 0 var(--line); }
.grid tr.go:hover td { background: var(--soft); }
.grid tr.gtop td { border-top: 2px solid #d6d5cd; }
.grid td.b { font-weight: 800; }
.grid td.c { text-align: center; font-size: 14px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; overflow-wrap: anywhere; }
.rec { margin: 6px 0 0; }
.rec dt { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 8px; }
.rec dd { margin: 2px 0 0; font-size: 12.5px; line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; }

.pcell { display: flex; gap: 6px; align-items: flex-start; }
.grip { flex: none; cursor: grab; color: var(--muted); font-size: 12px; letter-spacing: -2px; line-height: 1.6; padding: 0 3px; border-radius: 4px; user-select: none; }
.grip:hover { background: var(--soft); color: var(--ink); }
.grip:active { cursor: grabbing; }
.grid tr.dragging td { opacity: .45; }
.grid tr.drop-before td { box-shadow: inset 0 2px 0 var(--s1); }
.grid tr.drop-after td { box-shadow: inset 0 -2px 0 var(--s1); }
a.full { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--s1); text-decoration: none; }
a.full:hover { text-decoration: underline; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.btn:hover { background: var(--soft); }

/* 質問一覧：スプレッドシートと同じ見え方（1行1段・格子・見出し固定） */
.sheet { overflow: auto; max-height: calc(100vh - 230px); border: 1px solid #d6d6d6; margin-top: 12px; background: #fff; }
.sheet table { table-layout: fixed; width: max-content; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.sheet th, .sheet td { border-right: 1px solid #e2e2e2; border-bottom: 1px solid #e2e2e2; padding: 6px 8px; line-height: 1.5; white-space: normal; overflow-wrap: anywhere; overflow: hidden; text-align: left; vertical-align: top; }
.sheet th { vertical-align: bottom; }
.sheet .cl { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.sheet .cl3 { -webkit-line-clamp: 3; }
.sheet .cl4 { -webkit-line-clamp: 4; }
.sheet th { position: sticky; top: 0; z-index: 2; background: #f3f3f3; color: #333; font-weight: 700; }
.sheet .rn { position: sticky; left: 0; z-index: 1; background: #f3f3f3; color: #777; text-align: center; padding: 6px 0; cursor: grab; user-select: none; }
.sheet th.rn { z-index: 3; }
.sheet td.c { text-align: center; }
.sheet td.num { text-align: right; }
.sheet tr.dragging td { opacity: .45; }
.sheet tr.drop-before td { box-shadow: inset 0 2px 0 var(--s1); }
.sheet tr.drop-after td { box-shadow: inset 0 -2px 0 var(--s1); }

.sheet th { padding: 6px 6px 6px 8px; vertical-align: middle; }
.sheet th .thc { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.sheet th .fbtn { flex: none; width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid #c9c9c9; border-radius: 5px; background: #fff; color: #555; padding: 0; }
.sheet th .fbtn svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.sheet th .fbtn:hover { background: #e9e9e9; color: #111; border-color: #aaa; }
.sheet th .fbtn.on { background: var(--s1); border-color: var(--s1); color: #fff; }
.sheet th .fbtn.on svg { fill: currentColor; }
.sheet td.none { text-align: center; color: var(--muted); height: 60px; }
.fpop { position: fixed; z-index: 50; width: 280px; max-width: calc(100vw - 16px); display: flex; flex-direction: column; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,.14); padding: 12px; }
.fpop .ft { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.fpop .search { width: 100%; }
.ftools { display: flex; gap: 14px; }
.lnk { border: 0; background: none; padding: 0; color: var(--s1); font-size: 12px; font-weight: 700; }
.flist { overflow: auto; max-height: 240px; display: grid; gap: 1px; border-top: 1px solid var(--line); padding-top: 6px; }
.fitem { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 6px; align-items: center; font-size: 12.5px; padding: 3px 2px; cursor: pointer; }
.fitem span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #333; }
.btn:disabled { opacity: .45; cursor: default; }

.kpi.clk { cursor: pointer; transition: border-color .15s, background .15s; }
.kpi.clk:hover { border-color: #b8b7ae; background: #fbfbf8; }
td.clk, th.clk { cursor: pointer; }
td.clk:hover { background: var(--soft); }
th.clk:hover { color: var(--ink); text-decoration: underline; }

.legend { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.tsgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 10px; }
.tsbox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 6px; }
.tstitle { font-size: 12.5px; font-weight: 700; color: var(--ink); }
.tschart { width: 100%; height: auto; display: block; margin-top: 4px; }
.tschart .tsgrid-l { stroke: #e6e5df; stroke-width: 1; }
.tschart .tsax { font-size: 10px; fill: #8a8983; }
.tschart .tsval { font-size: 11px; font-weight: 700; fill: #333; }
.tschart circle { cursor: default; }

.tw.trend tr.gtop td { border-top: 2px solid #d6d5cd; }
.tw.trend td.b { font-weight: 800; }

/* ---------- 回答の詳細 ---------- */
.seg { display: grid; gap: 8px; margin-top: 16px; }
.seg.ai { grid-template-columns: 1fr 1fr; }
.seg.rd { grid-template-columns: repeat(var(--n, 3), 1fr); margin-top: 8px; }
.sb { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; min-height: 48px; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-weight: 700; }
.sb small { font-size: 12px; font-weight: 400; color: var(--muted); }
.sb:hover { background: var(--soft); }
.sb[aria-pressed="true"] { border-color: var(--c, var(--ink)); box-shadow: inset 0 0 0 1.5px var(--c, var(--ink)); }
.sb .line { display: flex; align-items: center; gap: 6px; }
.sb:disabled { opacity: .45; cursor: default; }
.banner { margin-top: 14px; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; background: var(--soft); }
.banner .d { width: 14px; height: 14px; }
.banner.off { color: var(--ink-2); }
.meta { margin-top: 8px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.det { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; margin-top: 18px; align-items: start; }
.answer { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.9; font-size: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
mark.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%, 100% { background: var(--mark); } 30% { background: #ffc700; } }
.ahead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.ahead h2 { font-size: 14px; }
.find { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 700; }
.find:hover { background: var(--soft); }
.aside { display: grid; gap: 12px; }
.aside .panel h2 { font-size: 13px; }
.list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.list li { font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; border-top: 1px solid var(--line); padding-top: 8px; }
.list li:first-child { border-top: 0; padding-top: 0; }
.list a { color: var(--s1); font-weight: 700; text-decoration: none; }
.list a:hover { text-decoration: underline; }
.list .u { display: block; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--ink-2); }
.chip.me { border-color: var(--ink); color: var(--ink); font-weight: 800; background: var(--mark); }
.defs p { margin-top: 10px; color: var(--ink-2); }
.defs b { color: var(--ink); }

/* ---------- 狭い画面：左メニューを上に ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; }
  .side nav { display: flex; flex-wrap: wrap; gap: 4px; }
  .group { display: none; }
  .navi { width: auto; padding: 6px 10px; }
  .navi .cnt { display: none; }
  .top { position: static; padding: 10px 16px; }
  .page { padding: 18px 16px 48px; }
  .panels, .det { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="proj"><div class="logo">AI</div><div><b id="projName"></b><span>LLMO ダッシュボード</span></div></div>
    <nav id="nav"></nav>
  </aside>
  <div class="main">
    <div class="top" id="top"></div>
    <main class="page" id="page"></main>
  </div>

デザイン（150種類以上）と手の届きやすい価格帯、充実した永久保証で高い支持を得ています。   \nみんなのウェディング\n他 1 件\n\nI-PRIMO（アイプリモ）   \nみんなのウェディング\n\n特徴: 星座や神話をモチーフにしたロマンチックなネーミングとデザインが豊富。豊富なバリエーションから、一人ひとりの手に似合う指輪を丁寧に見つけてくれます。   \n杢目金屋\n\nNIWAKA（俄・にわか）   \nグリーバー\n\n特徴: 京都発のブランド。日本の美しい情景やストーリーを「和」のテイストで表現しており、お洒落で上品、人と被りにくい洗練されたデザインが特徴です。海外のセレブリティにもファンが多いブランドです。   \nみんなのウェディング\n\n3. 個性を大切にする「オーダーメイド・手作り・セレクトショップ」   \n杢目金屋\n\n「人と被りたくない」「自分たちの想いを形にしたい」というカップルに選ばれています。\n\nK.UNO（ケイウノ）   \nみんなのウェディング\n\n特徴: 日本最大級のオーダーメイドブランド。専属のデザイナーがその場で無料でデザイン画を描いてくれるため、こだわりを詰め込んだ世界に一つの指輪が作れます（ディズニーデザインの取扱うことでも有名）。   \nみんなのウェディング\n\nBRILLIANCE+（ブリリアンスプラス）   \nみんなのウェディング\n\n特徴: オンラインと実店舗をうまく融合させたブランド。数万個のダイヤモンドと数百種類のリング枠を自由に組み合わせて、予算に合わせた納得のリング選びができます。   \nみんなのウェディング\n\n杢目金屋（もくめがねや）   \nみんなのウェディング\n\n特徴: 江戸時代の伝統工芸技法である「木目金」を使い、幾重もの金属が織りなす木目の美しい模様を表現。和の趣と温もりを感じさせる、唯一無二の指輪が作れます。   \nみんなのウェディング\n\n選び方のヒント\n\nパートナーの好みをリサーチする: 普段どんなアクセサリー（ゴールド系かプラチナ系か、シンプルか華やかか）をつけているか、好きなブランドがないかをそれとなくチェックしておくと安心です。\n\nダイヤモンドにこだわるか、ブランドにこだわるか: 「予算内でより品質の良いダイヤを選びたい」のであれば国内ブランドやセレクトショップが強く、「ブランドの持つストーリーやステータス性」を重視するなら海外ハイブランドが満足度につながります。   \nみんなのウェディング\n\nサプライズにするか、一緒に選ぶか: 最近はプロポーズ用の「仮のリング（プロポーズリング）」をブランドで用意してくれるサービス（銀座ダイヤモンドシライシやアイプリモなど）もあるため、デザインはあとから二人で選びに行くスタイルも人気です。\n\n気になるところがあれば、実際に店舗へ足を運んで試着してみると、指につけたときの雰囲気がよりイメージしやすくなりますよ。", "stores": [], "sources": [{"label": "みんなのウェディング、ハピハピリング", "url": "https://www.mwed.jp/articles/10762/", "domain": "mwed.jp", "kind": "メディア"}, {"label": "note", "url": "https://note.com/nobara_jewelog/n/n8a3ff773ad9b?hl=en", "domain": "note.com", "kind": "未分類"}, {"label": "杢目金屋", "url": "https://www.mokumeganeya.com/e/engagementring/topfive_e/", "domain": "mokumeganeya.com", "kind": "ブランド公式"}, {"label": "グリーバー", "url": "https://www.greeber.net/story/story55/", "domain": "greeber.net", "kind": "未分類"}], "cards": [], "reason": "K.UNO（ケイウノ）\nみんなのウェディング\n特徴: 日本最大級のオーダーメイドブランド。\n専属のデザイナーがその場で無料でデザイン画を描いてくれるため、こだわりを詰め込んだ世界に一つの指輪が作れます（ディズニーデザインの取扱うことでも有名）。", "match": "2 ＝ 狙う特徴で説明された", "competitors": ["Tiffany", "Cartier", "杢目金屋", "銀   const P = D.platforms;
  const pc = (id) => "s" + (P.findIndex((p) => p.id === id) + 1);
  const pname = (id) => (P.find((p) => p.id === id) || {}).label || id;
  const Q = D.questions;
  const qById = new Map(Q.map((q) => [q.id, q]));
  const qByNo = new Map(Q.map((q) => [q.no, q]));
  const ALL = D.answers;
  const A = new Map(ALL.map((a) => [`${a.q}|${a.platform}|${a.round}`, a]));
  const ROUNDS = Array.from({ length: D.rounds }, (_, i) => i + 1);
  const LAYERS = { A: "カテゴリ", B: "ポジション", C: "目的・課題", D: "ブランドイメージ" };
  const jst = new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const fmt = (iso) => { const d = new Date(iso); return isNaN(d) ? "—" : jst.format(d); };
  const pct = (h, n) => (n ? Math.round((100 * h) / n) : 0);
  const avg = (xs) => (xs.length ? (xs.reduce((s, x) => s + x, 0) / xs.length).toFixed(1) : null);
  const BATCHES = D.batches || [];
  const fmtBatch = (b) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(b || ""); return m ? `${+m[2]}/${+m[3]}` : (b || "—"); };
  const state = { ai: "all", round: "all", batch: BATCHES[BATCHES.length - 1] || null };

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function svg(d) { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.innerHTML = d; return s; }
  const ICON = {
    overview: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    prompts: '<path d="M4 6h16M4 12h16M4 18h10"/>',
    responses: '<path d="M4 5h16v11H8l-4 4z"/>',
    competitors: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    domains: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    urls: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    about: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  };
  const PAGES = [
    ["一般", [["overview", "ダッシュボード"], ["prompts", "質問一覧"]]],
  ];

  /* ---------- 絞り込み（全画面に効く） ---------- */
  const inAI = (a) => state.ai === "all" || a.platform === state.ai;
  const inRound = (a) => state.round === "all" || a.round === state.round;
  const inBatch = (a) => !state.batch || a.batch === state.batch;
  const sel = () => ALL.filter((a) => inAI(a) && inRound(a) && inBatch(a));
  const counted = (xs) => xs.filter((a) => qByNo.get(a.q).counted);
  const plats = () => (state.ai === "all" ? P : P.filter((p) => p.id === state.ai));

  function renderTop() {
    const t = document.getElementById("top"); t.replaceChildren();
    const f1 = el("div", "fl"); f1.append(el("span", null, "AI"));
    const s1 = el("div", "segc");
    [["all", "すべて"], ...P.map((p) => [p.id, p.label])].forEach(([v, lab]) => {
      const b = el("button"); b.type = "button";
      if (v !== "all") { const i = el("i", `bar ${pc(v)}`); b.append(i); }
      b.append(document.createTextNode(lab));
      b.setAttribute("aria-pressed", String(state.ai === v));
      b.addEventListener("click", () => { state.ai = v; renderTop(); route(); });
      s1.append(b);
    });
    f1.append(s1);
    const f2 = el("div", "fl"); f2.append(el("span", null, "回"));
    const s2 = el("div", "segc");
    [["all", "すべて"], ...ROUNDS.map((r) => [r, `${r}回目`])].forEach(([v, lab]) => {
      const b = el("button", null, lab); b.type = "button";

      b.addEventListener("click", () => { state.round = v; renderTop(); route(); });
      s2.append(b);
    });
    f2.append(s2);
    const f3 = el("div", "fl"); f3.append(el("span", null, "計測日"));
    const s3 = el("div", "segc");
    BATCHES.forEach((bt) => {
      const b = el("button", null, fmtBatch(bt)); b.type = "button";
      b.setAttribute("aria-pressed", String(state.batch === bt));
      b.addEventListener("click", () => { state.batch = bt; renderTop(); route(); });
      s3.append(b);
    });
    f3.append(s3);
    t.append(f3, f1, f2, el("span", "chip0", `${D.region_label}・ログイン${D.login_label}`));
  }

  function renderNav(cur) {
    const n = document.getElementById("nav"); n.replaceChildren();
    const counts = { prompts: Q.length };
    PAGES.forEach(([g, items]) => {
      n.append(el("div", "group", g));
      items.forEach(([id, lab]) => {
        const b = el("button", "navi"); b.type = "button";

  function head(title, sub, crumbs) {
    const w = document.createDocumentFragment();
    if (crumbs) {
      const c = el("div", "crumb");
      crumbs.forEach(([lab, to], i) => {
        if (i) c.append(el("span", null, "›"));

        else c.append(el("span", null, lab));
      });
      w.append(c);
    }
    w.append(el("h1", "ptitle", title));
    if (sub) w.append(el("p", "psub", sub));
    return w;
  }
  function meter(v, cls) { const m = el("div", `meter ${cls || ""}`); const t = el("div", "trk"); const i = el("i"); i.style.width = `${v}%`; t.append(i); m.append(t, el("b", null, `${v}%`)); return m; }
  function table(cols, rows) {
    const w = el("div", "tw"); const t = el("table"); const th = el("thead"); const tr = el("tr");
    cols.forEach((c) => tr.append(el("th", c.num ? "num" : null, c.label)));
    th.append(tr); t.append(th); const tb = el("tbody"); rows.forEach((r) => tb.append(r)); t.append(tb); w.append(t); return w;
  }
  function stats(xs) {
    const c = counted(xs); const ranks = c.filter((a) => a.rank).map((a) => a.rank);
    return { hits: c.filter((a) => a.appeared).length, n: c.length, rank: avg(ranks), first: ranks.filter((x) => x === 1).length, cited: xs.filter((a) => a.sources.length).length, all: xs.length };
  }
  function brandStats(xs) {
    const c = counted(xs);
    return D.tracked.map((b) => { const ranks = c.map((a) => a.brands.indexOf(b)).filter((i) => i >= 0).map((i) => i + 1); return { brand: b, hits: ranks.length, n: c.length, rank: avg(ranks) }; })
      .sort((x, y) => y.hits - x.hits || (x.rank || 99) - (y.rank || 99));
  }
  function domainStats(xs) {
    const m = new Map();
    xs.forEach((a) => { const seen = new Set(); a.sources.forEach((s) => { const k = s.domain; if (!m.has(k)) m.set(k, { domain: k, kind: s.kind, answers: 0, cites: 0, by: {} }); const d = m.get(k); d.cites++; if (!seen.has(k)) { seen.add(k); d.answers++; d.by[a.platform] = (d.by[a.platform] || 0) + 1; } }); });
    return [...m.values()].sort((x, y) => y.answers - x.answers || y.cites - x.cites);
  }

  /* ---------- ページ：ダッシュボード ---------- */
  function pageOverview() {
    const xs = sel(); const w = el("div");
    const parts = plats().map((p) => { const s = stats(xs.filter((a) => a.platform === p.id)); return `${p.label} ${pct(s.hits, s.n)}%`; });
    w.append(head("ダッシュボード", `${SUBJ}の登場率は ${parts.join("・")}。質問にブランド名を入れていない${Q.filter((q) => q.counted).length}問で数えています。数字・A〜Cの行・AIの名前を押すと、その条件で絞り込んだ質問一覧が開きます。`));
    const cards = el("div", "cards");
    plats().forEach((p) => {
      const s = stats(xs.filter((a) => a.platform === p.id));
      const k1 = el("div", `kpi ${pc(p.id)}`); const l1 = el("p", "lab"); l1.append(el("i", "bar"), document.createTextNode(`${p.label}｜登場率`));
      const v1 = el("p", "val", String(pct(s.hits, s.n))); v1.append(el("small", null, "%")); k1.append(l1, v1, el("p", "cap", `${s.n}回中 ${s.hits}回 登場`));
      const k2 = el("div", `kpi ${pc(p.id)}`); const l2 = el("p", "lab"); l2.append(el("i", "bar"), document.createTextNode(`${p.label}｜平均順位`));
      const v2 = el("p", "val", s.rank || "—"); if (s.rank) v2.append(el("small", null, "番目")); k2.append(l2, v2, el("p", "cap", s.rank ? `1番目に挙がった回数 ${s.first}回` : "登場なし"));
      [k1, k2].forEach((k) => { k.classList.add("clk"); k.title = `押すと、${p.label}の回答だけに絞り込んだ質問一覧を開きます`; k.addEventListener("click", () => openFiltered({ ai: p.label })); });
      cards.append(k1, k2);
    });
    w.append(cards);

    // 種類別（A〜C）の表示率と平均順位
    const p2 = el("div", "panel"); const h2 = el("h2"); h2.append(el("span", null, "種類別（A〜C）の表示率と平均順位")); const m2 = el("button", "more", "質問一覧 →"); m2.type = "button"; m2.addEventListener("click", () => { location.hash = "#/prompts"; }); h2.append(m2);
    p2.append(h2, el("p", "desc", "A〜Cは質問にブランド名を入れていない質問。行・数字・AIの名前を押すと、その条件で質問一覧を開きます"));
    const layerFull = (k) => (Q.find((q) => q.layer === k) || {}).layer_full;
    const rows2 = ["A", "B", "C"].filter((k) => Q.some((q) => q.layer === k)).map((k) => {
      const tr = el("tr"); const td0 = el("td", "clk"); td0.append(el("span", "tag", k), document.createTextNode(` ${LAYERS[k]}`));
      td0.title = `押すと、${k}（${LAYERS[k]}）の質問だけに絞り込んだ質問一覧を開きます`; td0.addEventListener("click", () => openFiltered({ layer: layerFull(k) }));
      tr.append(td0);
      plats().forEach((p) => {
        const c = counted(xs.filter((a) => a.platform === p.id && qByNo.get(a.q).layer === k));
        const rk = avg(c.filter((a) => a.rank).map((a) => a.rank));
        const td = el("td", "clk"); td.append(meter(pct(c.filter((a) => a.appeared).length, c.length), pc(p.id)));
        const tdr = el("td", "num clk", rk ? `${rk}番目` : "—");
        [td, tdr].forEach((x) => { x.title = `押すと、${k}（${LAYERS[k]}）×${p.label}に絞り込んだ質問一覧を開きます`; x.addEventListener("click", () => openFiltered({ layer: layerFull(k), ai: p.label })); });
        tr.append(td, tdr);
      });
      return tr;
    });
    const cols2 = [{ label: "種類" }]; plats().forEach((p) => cols2.push({ label: `${p.label}｜表示率` }, { label: "平均順位", num: true }));
    const t2 = table(cols2, rows2);
    [...t2.querySelectorAll("th")].slice(1).forEach((h, i) => { const p = plats()[Math.floor(i / 2)]; h.classList.add("clk"); h.title = `押すと、${p.label}の回答だけに絞り込んだ質問一覧を開きます`; h.addEventListener("click", () => openFiltered({ ai: p.label })); });
    p2.append(t2);
    p2.style.marginTop = "12px"; w.append(p2);

    // D：ブランドイメージの合致率
    const F = D.features_all || [];
    const dAns = (p, list) => list.filter((a) => a.platform === p.id && qByNo.get(a.q).layer === "D");
    const rate = (list) => (list.length && F.length ? Math.round(100 * list.reduce((s2, a) => s2 + (a.feat_hits || []).length / F.length, 0) / list.length) : null);
    if (Q.some((q) => q.layer === "D") && F.length) {
      const p3 = el("div", "panel"); p3.style.marginTop = "12px";
      const h3 = el("h2"); h3.append(el("span", null, "D ブランドイメージの合致率")); p3.append(h3);
      p3.append(el("p", "desc", `「${SUBJ}はどのようなブランドですか？」への回答で、${SUBJ}が打ち出したい特徴${F.length}つのうち何割が説明されたか（回答ごとの割合の平均）`));
      const dc = el("div", "cards");
      plats().forEach((p) => {
        const list = dAns(p, xs); const r = rate(list);
        const k = el("div", `kpi ${pc(p.id)}`); const l = el("p", "lab"); l.append(el("i", "bar"), document.createTextNode(`${p.label}｜合致率`));
        const v = el("p", "val", r == null ? "—" : String(r)); if (r != null) v.append(el("small", null, "%"));
        k.append(l, v, el("p", "cap", `${list.length}回答の平均`)); dc.append(k);
      });
      p3.append(dc);
      const fr = F.map((f) => { const tr = el("tr"); tr.append(el("td", null, f)); plats().forEach((p) => { const list = dAns(p, xs); const n = list.filter((a) => (a.feat_hits || []).includes(f)).length; const td = el("td"); td.append(meter(pct(n, list.length), pc(p.id))); tr.append(td, el("td", "num muted", `${n}/${list.length}`)); }); return tr; });
      const fc = [{ label: "打ち出したい特徴" }]; plats().forEach((p) => fc.push({ label: `${p.label}｜説明された割合` }, { label: "回答数", num: true }));
      p3.append(table(fc, fr));
      w.append(p3);
    }

    // 計測日ごとの推移（A〜D を1つの一覧で）
    const p4 = el("div", "panel"); p4.style.marginTop = "12px";
    const h4 = el("h2"); h4.append(el("span", null, "計測日ごとの推移（一覧）")); p4.append(h4);
    p4.append(el("p", "desc", "A〜Cは表示率、Dは合致率。上の「計測日」の切り替えに関係なく、全部の計測日を横に並べます（回・AIの絞り込みは効きます）"));
    const series = ALL.filter((a) => inAI(a) && inRound(a));
    const valOf = (k, p, bt) => {
      const list = series.filter((a) => a.platform === p.id && a.batch === bt && qByNo.get(a.q).layer === k);
      if (k === "D") return rate(list);
      const c = counted(list); return c.length ? pct(c.filter((a) => a.appeared).length, c.length) : null;
    };
    const trows = [];
    ["A", "B", "C", "D"].filter((k) => Q.some((q) => q.layer === k)).forEach((k) => {
      plats().forEach((p, pi) => {
        const tr = el("tr", pi === 0 ? "gtop" : null);
        const t0 = el("td"); if (pi === 0) t0.append(el("span", "tag", k), document.createTextNode(` ${LAYERS[k]}`)); tr.append(t0);
        tr.append(el("td", "muted", k === "D" ? "合致率" : "表示率"));
        const ta = el("td"); const sp = el("span", `fl ${pc(p.id)}`); sp.append(el("i", "bar"), document.createTextNode(p.label)); ta.append(sp); tr.append(ta);
        const vs = BATCHES.map((bt) => valOf(k, p, bt));
        vs.forEach((v) => tr.append(el("td", "num", v == null ? "—" : `${v}%`)));
        const known = vs.filter((v) => v != null);
        const diff = known.length >= 2 ? known[known.length - 1] - known[known.length - 2] : null;
        tr.append(el("td", "num" + (diff ? " b" : ""), diff == null ? "—" : diff > 0 ? `▲ +${diff}` : diff < 0 ? `▼ ${diff}` : "±0"));
        trows.push(tr);
      });
    });
    const tcols = [{ label: "種類" }, { label: "指標" }, { label: "AI" }, ...BATCHES.map((bt) => ({ label: fmtBatch(bt), num: true })), { label: "前回からの変化", num: true }];
    const tt = table(tcols, trows); tt.classList.add("trend"); p4.append(tt);
    p4.style.marginTop = "18px"; w.insertBefore(p4, cards);   // 計測日ごとの推移は一番上

    return w;
  }

  /* ---------- ページ：質問一覧（記録シート 04_AI回答記録 と同じ列・行はドラッグで入れ替え） ---------- */
  const qIdx = (no) => Q.findIndex((q) => q.no === no);
  const pIdx = (id) => P.findIndex((p) => p.id === id);
  const akey = (a) => `${a.q}|${a.platform}|${a.round}`;
  const defaultCmp = (a, b) => (qIdx(a.q) - qIdx(b.q)) || (pIdx(a.platform) - pIdx(b.platform)) || (a.round - b.round);
  // 入れ替えた並びは、この端末のブラウザにだけ覚えておく（見る人ごと）
  const ORDER_KEY = `llmo-dash-order:${SUBJ}:${D.dates.join(",")}`;
  let rowOrder = (() => { try { return JSON.parse(localStorage.getItem(ORDER_KEY) || "[]"); } catch (e) { return []; } })();
  const saveOrder = () => { try { localStorage.setItem(ORDER_KEY, JSON.stringify(rowOrder)); } catch (e) { /* 保存できなくても画面上の入れ替えは効く */ } };
  function fullOrder() {
    const all = ALL.slice().sort(defaultCmp).map(akey);
    const known = rowOrder.filter((k) => all.includes(k));
    return known.length ? [...known, ...all.filter((k) => !known.includes(k))] : all;
  }
  function moveRow(from, to, after) {
    const ord = fullOrder().filter((k) => k !== from);
    ord.splice(ord.indexOf(to) + (after ? 1 : 0), 0, from);
    rowOrder = ord; saveOrder();
  }
  let dragKey = null;
  // 列の定義（見出し・幅・値・寄せ）。表示・絞り込み・CSVの3つで同じ値を使う（記録シート 04_AI回答記録 と同じ列）
  const COLS = () => [   // [見出し, 幅, 値, 寄せ, 折り返して見せる最大行数（0＝全部）]
    ["設問ID", 80, (a, q) => q.id],
    ["レイヤー", 112, (a, q) => q.layer_full],
    ["仮説テーマ", 110, (a, q) => q.theme],
    ["AI", 90, (a) => pname(a.platform)],
    ["回", 64, (a) => String(a.round), "num"],
    ["使用プロンプト", 200, (a, q) => q.prompt],
    ["取得状況", 100, () => "取得済"],
    ["取得日時", 118, (a) => a.run_at],
    ["回答・保存先", 260, (a) => a.text, null, 3],
    [`${SUBJ}登場`, 128, (a) => (a.appeared ? "○" : "×"), "c"],
    ["推薦順位", 100, (a) => (a.rank ? String(a.rank) : ""), "num"],
    ["選定理由・説明", 240, (a) => a.reason, null, 3],
    ["仮説との一致", 150, (a) => a.match],
    ["引用URL・出典", 200, (a) => (a.sources.length ? a.sources.map((x) => x.url || x.domain).join("\n") : "（引用の表示なし）"), null, 3],
    ["競合", 170, (a) => a.competitors.join(" / "), null, 3],
    ["イメージ要約", 200, (a) => a.image, null, 4],
    ["施策示唆", 112, () => ""],
    ["確認者", 88, () => ""],
  ];
  const colFilters = new Map();   // 列番号 → { text: 含む文字, values: 選んだ値の Set（null＝全部） }
  let fpop = null;
  // ダッシュボードで押した条件（種類・AI）で絞り込んだ質問一覧を開く
  function openFiltered({ layer, ai } = {}) {
    const cols = COLS(); colFilters.clear(); closeFilter();
    if (layer) colFilters.set(cols.findIndex((c) => c[0] === "レイヤー"), { text: "", values: new Set([layer]) });
    if (ai) colFilters.set(cols.findIndex((c) => c[0] === "AI"), { text: "", values: new Set([ai]) });
    location.hash = "#/prompts";
  }
  function closeFilter() { if (fpop) { fpop.remove(); fpop = null; document.removeEventListener("pointerdown", outsideFilter, true); } }
  function outsideFilter(e) { if (fpop && !fpop.contains(e.target) && !e.target.closest(".fbtn")) closeFilter(); }
  // 見出しの ▾ から開く絞り込み（スプレッドシートの「フィルタ」と同じ：含む文字＋値のチェック）
  function openFilter(i, btn, xs, cols, draw) {
    const same = fpop && fpop.dataset.col === String(i);
    closeFilter(); if (same) return;
    const [lab, , get] = cols[i];
    const f = colFilters.get(i) || { text: "", values: null };
    const pop = el("div", "fpop"); pop.dataset.col = String(i); fpop = pop;
    pop.append(el("p", "ft", `「${lab}」で絞り込み`));
    const inp = el("input", "search"); inp.type = "search"; inp.placeholder = "含む文字で絞り込み"; inp.value = f.text;
    pop.append(inp);
    const counts = new Map();
    xs.forEach((a) => { const v = get(a, qByNo.get(a.q)) || ""; counts.set(v, (counts.get(v) || 0) + 1); });
    const boxes = [];
    function apply() {
      const text = inp.value.trim();
      const picked = boxes.length && boxes.some((b) => !b.checked) ? new Set(boxes.filter((b) => b.checked).map((b) => b.value)) : null;
      if (!text && !picked) colFilters.delete(i); else colFilters.set(i, { text, values: picked });
      draw();
    }
    if (counts.size <= 40) {   // 値の種類が少ない列だけ、値の一覧を出す
      const tools = el("div", "ftools");
      const all = el("button", "lnk", "すべて選択"); all.type = "button";
      const none = el("button", "lnk", "クリア"); none.type = "button";
      tools.append(all, none); pop.append(tools);
      const list = el("div", "flist");
      [...counts.entries()].sort((x, y) => x[0].localeCompare(y[0], "ja", { numeric: true })).forEach(([v, n]) => {
        const row = el("label", "fitem"); const cb = el("input"); cb.type = "checkbox"; cb.value = v; cb.checked = !f.values || f.values.has(v);
        cb.addEventListener("change", apply);
        row.append(cb, el("span", null, v === "" ? "（空白）" : v), el("span", "muted", String(n)));
        list.append(row); boxes.push(cb);
      });
      pop.append(list);
      all.addEventListener("click", () => { boxes.forEach((b) => { b.checked = true; }); apply(); });
      none.addEventListener("click", () => { boxes.forEach((b) => { b.checked = false; }); apply(); });
    }
    inp.addEventListener("input", apply);
    pop.addEventListener("keydown", (e) => { if (e.key === "Escape") closeFilter(); });
    const r = btn.getBoundingClientRect();
    pop.style.top = `${Math.round(r.bottom + 6)}px`;
    pop.style.left = `${Math.round(Math.max(8, Math.min(r.right - 280, innerWidth - 290)))}px`;
    document.body.append(pop); inp.focus();
    setTimeout(() => document.addEventListener("pointerdown", outsideFilter, true));
  }
  function downloadCsv(header, rows) {
    const esc = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const csv = "﻿" + [header, ...rows].map((r) => r.map(esc).join(",")).join("\r\n");   // 先頭のBOMでExcelでも文字化けしない
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    const a = el("a"); a.href = url; a.download = `${SUBJ}_AI回答記録_${state.batch || D.dates.join("_")}.csv`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  function pagePrompts() {
    const xs = sel(); const w = el("div"); const cols = COLS();
    const nQ = new Set(xs.map((a) => a.q)).size;
    w.append(head("質問一覧", `${nQ}設問 × ${plats().length}AI × ${state.round === "all" ? D.rounds : 1}回 ＝ ${xs.length}件。記録シート（CSV）と同じ列です。見出しの右端にあるフィルタボタン（漏斗のマーク）で、列ごとに絞り込めます。セルに重ねると全文が出ます。左端の行番号をつかんで上下に動かすと、行を入れ替えられます。`));
    const bar = el("div", "toolbar"); const s = el("input", "search"); s.type = "search"; s.placeholder = "回答・選定理由の中を検索（例：ディズニー）";
    const reset = el("button", "btn", "並びを元に戻す"); reset.type = "button";
    const clearF = el("button", "btn", "絞り込みを解除"); clearF.type = "button";
    const dl = el("button", "btn primary", "CSVダウンロード"); dl.type = "button";
    bar.append(s, reset, clearF, dl); w.append(bar);
    const box = el("div"); w.append(box);
    let shown = [];
    const vals = (a) => { const q = qByNo.get(a.q); return cols.map((c) => c[2](a, q) || ""); };
    const pass = (v) => {
      for (const [i, f] of colFilters) {
        if (f.text && !v[i].toLowerCase().includes(f.text.toLowerCase())) return false;
        if (f.values && !f.values.has(v[i])) return false;
      }
      return true;
    };
    const draw = () => {
      const kw = s.value.trim();
      const pos = new Map(fullOrder().map((k, i) => [k, i]));
      const ys = xs.filter((a) => !kw || a.text.includes(kw) || a.reason.includes(kw) || qByNo.get(a.q).prompt.includes(kw))
        .map((a) => ({ a, v: vals(a) })).filter((r) => pass(r.v))
        .sort((r1, r2) => pos.get(akey(r1.a)) - pos.get(akey(r2.a)));
      shown = ys;
      dl.textContent = `CSVダウンロード（${ys.length}件）`; dl.disabled = !ys.length;
      clearF.disabled = !colFilters.size;
      const g = el("div", "sheet"); const t = el("table"); const th = el("thead"); const hr = el("tr");
      const rn = el("th", "rn", ""); rn.style.width = "44px"; hr.append(rn);
      cols.forEach(([lab, px], i) => {
        const c = el("th"); c.style.width = `${px}px`; c.title = lab;
        const b = el("button", "fbtn" + (colFilters.has(i) ? " on" : "")); b.type = "button"; b.setAttribute("aria-label", `${lab}で絞り込み`);
        b.title = colFilters.has(i) ? `${lab}：絞り込み中（押して変更）` : `${lab}で絞り込み`;
        b.append(svg('<path d="M3 5h18l-7 8v5l-4 2v-7z"/>'));
        b.addEventListener("click", (e) => { e.stopPropagation(); openFilter(i, b, xs, cols, draw); });
        const hc = el("div", "thc"); hc.append(el("span", null, lab), b); c.append(hc); hr.append(c);
      });
      th.append(hr); t.append(th); const tb = el("tbody");
      if (!ys.length) {
        const tr = el("tr"); const c = el("td", "none", "該当する行はありません。絞り込みを見直してください。"); c.colSpan = cols.length + 1; tr.append(c); tb.append(tr);
      }
      const clearMarks = () => tb.querySelectorAll(".drop-before, .drop-after").forEach((x) => x.classList.remove("drop-before", "drop-after"));
      ys.forEach(({ a, v }, n) => {
        const key = akey(a); const tr = el("tr");
        const num = el("td", "rn", String(n + 1)); num.title = "つかんで上下に動かすと行を入れ替えられます";
        tr.append(num);
        v.forEach((x, i) => {
          const c = el("td", cols[i][3] || null); const lines = cols[i][4];
          if (cols[i][0] === "取得日時" && x.includes("T")) { const [d, t2] = x.split("T"); c.append(`${d}T`, el("wbr"), t2); }
          else if (lines && x) c.append(el("div", `cl cl${lines}`, x));
          else c.textContent = x;
          if (x) c.title = x; tr.append(c);
        });
        // 行番号をつかんだ時だけ行をドラッグできるようにする（スプレッドシートの行移動と同じ）
        num.addEventListener("pointerdown", () => { tr.draggable = true; });
        tr.addEventListener("dragstart", (e) => { dragKey = key; tr.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", key); });
        tr.addEventListener("dragend", () => { tr.draggable = false; tr.classList.remove("dragging"); clearMarks(); dragKey = null; });
        tr.addEventListener("dragover", (e) => {
          if (!dragKey || dragKey === key) return;
          e.preventDefault(); const r = tr.getBoundingClientRect(); const after = e.clientY > r.top + r.height / 2;
          clearMarks(); tr.classList.add(after ? "drop-after" : "drop-before");
        });
        tr.addEventListener("drop", (e) => {
          e.preventDefault(); if (!dragKey || dragKey === key) return;
          const top = g.scrollTop, left = g.scrollLeft;
          moveRow(dragKey, key, tr.classList.contains("drop-after")); dragKey = null; draw();
          const ng = box.querySelector(".sheet"); if (ng) { ng.scrollTop = top; ng.scrollLeft = left; }
        });
        tb.append(tr);
      });
      t.append(tb); g.append(t);
      const old = box.querySelector(".sheet"); const top = old ? old.scrollTop : 0, left = old ? old.scrollLeft : 0;
      box.replaceChildren(g); g.scrollTop = top; g.scrollLeft = left;
    };
    reset.addEventListener("click", () => { rowOrder = []; saveOrder(); draw(); });
    clearF.addEventListener("click", () => { colFilters.clear(); closeFilter(); draw(); });
    dl.addEventListener("click", () => downloadCsv(cols.map((c) => c[0]), shown.map((r) => r.v)));
    s.addEventListener("input", draw); draw();
    return w;
  }

  /* ---------- ページ：回答の詳細 ---------- */
  function pageDetail(qid, pid, r) {
    const q = qById.get(qid); const a = A.get(`${q.no}|${pid}|${r}`); const w = el("div");
    w.append(head(q.prompt, null, [["質問一覧", "#/prompts"], [`${q.id} ${q.theme}`, null]]));
    const ai = el("div", "seg ai");
    P.forEach((p) => { const ys = ROUNDS.map((x) => A.get(`${q.no}|${p.id}|${x}`)).filter(Boolean); const hits = ys.filter((y) => y.appeared).length;
      const b = el("button", `sb ${pc(p.id)}`); b.type = "button"; const ln = el("span", "line"); ln.append(el("i", "bar"), document.createTextNode(p.label));
      b.append(ln, el("small", null, q.counted ? `${ys.length}回中 ${hits}回 登場` : `${ys.length}回分の回答`)); b.setAttribute("aria-pressed", String(p.id === pid));
      b.addEventListener("click", () => { location.hash = `#/prompts/${qid}/${p.id}/${A.get(`${q.no}|${p.id}|${r}`) ? r : 1}`; }); ai.append(b); });
    const rd = el("div", `seg rd ${pc(pid)}`); rd.style.setProperty("--n", ROUNDS.length);
    ROUNDS.forEach((rr) => { const x = A.get(`${q.no}|${pid}|${rr}`); const b = el("button", "sb"); b.type = "button"; const ln = el("span", "line");
      if (q.counted) ln.append(el("i", "d" + (x && x.appeared ? " on" : ""))); ln.append(document.createTextNode(`${rr}回目`));
      b.append(ln, el("small", null, !x ? "未取得" : !q.counted ? "回答あり" : x.appeared ? `登場・${x.rank}番目` : "登場せず")); b.setAttribute("aria-pressed", String(rr === r));
      if (!x) b.disabled = true; else b.addEventListener("click", () => { location.hash = `#/prompts/${qid}/${pid}/${rr}`; }); rd.append(b); });
    w.append(ai, rd);
    if (!a) { w.append(el("p", "empty", "この回の回答はありません。")); return w; }
    if (q.counted) { const bn = el("div", `banner ${pc(pid)}` + (a.appeared ? "" : " off")); bn.append(el("i", "d" + (a.appeared ? " on" : "")), document.createTextNode(a.appeared ? `${SUBJ}が登場しました（${a.rank}番目）` : `${SUBJ}は登場しませんでした`)); w.append(bn); }
    const meta = el("p", "meta"); [`${fmt(a.run_at)}（日本時間）`, a.model === "不明" ? "モデル名表示なし" : a.model, a.region, a.login ? `ログイン${a.login}` : ""].filter(Boolean).forEach((t) => meta.append(el("span", null, t))); w.append(meta);

    const det = el("div", "det");
    const left = el("div"); const ah = el("div", "ahead"); ah.append(el("h2", null, "AIの回答（原文）"));
    const box = el("div", "answer"); let count = 0;
    for (const part of a.text.split(/(\*\*[^*\n]+\*\*)/)) { const bold = /^\*\*[^*\n]+\*\*$/.test(part); const target = bold ? el("b") : box; const s = bold ? part.slice(2, -2) : part; let last = 0, m; SUBJ_RE.lastIndex = 0;
      while ((m = SUBJ_RE.exec(s))) { if (m.index > last) target.append(s.slice(last, m.index)); target.append(el("mark", null, m[0])); count++; last = m.index + m[0].length; if (!m[0].length) SUBJ_RE.lastIndex++; }
      target.append(s.slice(last)); if (bold) box.append(target); }
    if (count) { const f = el("button", "find", `${SUBJ}の出てくる所へ（${count}か所）`); f.type = "button"; let k = 0; f.addEventListener("click", () => { const ms = box.querySelectorAll("mark"); const t = ms[k % ms.length]; k++; t.scrollIntoView({ behavior: "smooth", block: "center" }); t.classList.remove("flash"); void t.offsetWidth; t.classList.add("flash"); }); ah.append(f); }
    left.append(ah, box);
    const right = el("div", "aside");
    const pn = (title, body) => { const p = el("div", "panel"); p.append(el("h2", null, title), body); return p; };
    const rec = el("dl", "rec");
    [["仮説との一致", a.match], ["推薦順位", a.rank ? `${a.rank}番目` : "—"], ["選定理由・説明", a.reason || "—"], ["競合", a.competitors.join(" / ") || "—"], ...(a.image ? [["イメージ要約", a.image]] : [])]
      .forEach(([k, v]) => rec.append(el("dt", null, k), el("dd", null, v)));
    right.append(pn("記録（シートと同じ項目）", rec));
    if (a.brands.length) { const c = el("div", "chips"); a.brands.forEach((b) => c.append(el("span", "chip" + (b === SUBJ ? " me" : ""), b))); right.append(pn("回答に出たブランド（出た順）", c)); }
    const ul = el("ul", "list");
    if (a.sources.length) a.sources.forEach((s) => { const li = el("li"); li.append(el("span", "kind", s.kind), document.createTextNode(" "));
      if (s.url && /^https?:\/\//.test(s.url)) { const l = el("a", null, s.label); l.href = s.url; l.target = "_blank"; l.rel = "noopener noreferrer"; li.append(l, el("span", "u", s.url)); } else li.append(el("b", null, s.label), el("span", "u", s.domain)); ul.append(li); });
    right.append(pn(`引用元URL（${a.sources.length}件）`, a.sources.length ? ul : el("p", "empty", "出典の表示はありませんでした。")));
    if (a.stores && a.stores.length) { const u2 = el("ul", "list"); a.stores.forEach((x) => u2.append(el("li", null, x))); right.append(pn(`回答の上に出た店舗カード（${a.stores.length}件）`, u2)); }
    if (a.cards.length) { const u3 = el("ul", "list"); a.cards.forEach((x) => u3.append(el("li", null, x))); right.append(pn(`商品カード（${a.cards.length}件）`, u3)); }
    det.append(left, right); w.append(det);
    return w;
  }

  /* ---------- 画面の切り替え ---------- */
  function route() {
    closeFilter();
    const parts = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/");
    let page = parts[0] || "overview", body;
    if (page === "responses") page = "prompts";   // 旧「回答ログ」は質問一覧に統合
    // 旧URL（#B1/chatgpt/1）も開けるようにする
    if (qById.has(page)) { parts.unshift("prompts"); page = "prompts"; }
    const pageEl = document.getElementById("page");
    if (page === "prompts" && parts[1] && qById.has(parts[1]) && P.some((p) => p.id === parts[2])) { body = pageDetail(parts[1], parts[2], Number(parts[3]) || 1); page = "prompts"; }
    else { if (page !== "prompts") page = "overview"; body = (page === "prompts" ? pagePrompts : pageOverview)(); }
    renderNav(page);
    pageEl.replaceChildren(body);
    window.scrollTo(0, 0);
  }
  document.getElementById("projName").textContent = SUBJ;
  document.title = `LLMO ダッシュボード｜${SUBJ}`;
  window.addEventListener("hashchange", route);
  renderTop(); route();
})();
</script>
