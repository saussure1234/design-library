<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex,nofollow">
<title>LLMO ダッシュボード｜ケイウノ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 24'%3E%3Cpolygon points='14,1 14,7.6 10.1,6.7' fill='%232460DD'/%3E%3Cpolygon points='14,1 17.9,6.7 14,7.6' fill='%231A47A8'/%3E%3Cpolygon points='9.32,7.84 14,8.92 14,15.08 5.68,13.16' fill='%230F1A2E'/%3E%3Cpolygon points='14,8.92 18.68,7.84 22.32,13.16 14,15.08' fill='%233A4A6A'/%3E%3Cpolygon points='4.9,14.3 14,16.4 14,23 1,20' fill='%230F1A2E'/%3E%3Cpolygon points='14,16.4 23.1,14.3 27,20 14,23' fill='%233A4A6A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400..900&display=swap">
<style>
/* 色と書体は LLMOHack の LP（design-library/llmo-lp4）に合わせる */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --side: #f4f5f7;
  --ink: #0f1a2e;
  --ink-2: #46506a;
  --muted: #7a8296;
  --line: #e6e8ec;
  --line2: #d5d9e0;
  --soft: #f4f5f7;
  --hover: #eceff3;
  --s1: #10a37f;   /* ChatGPT（緑） */
  --s2: #4285f4;   /* Gemini（青） */
  --s3: #d97757;   /* Claude（オレンジ） */
  --s4: #b8338f;   /* Copilot（赤紫） ※4色で色覚チェック済み。アイコンと線の端の数字でも見分けられる */
  --accent: #2460dd;   /* リンク・押せる所・絞り込み中の印（AIの色とは分ける） */
  --tint: #e7eefd;     /* 選んでいる所の地 */
  --chk: #bcd0ff;      /* 選んでいる所の枠 */
  --gray: #8a92a5;     /* 競合（灰色） */
  --mark: #ffe27a;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.6 "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.s1 { --c: var(--s1); } .s2 { --c: var(--s2); } .s3 { --c: var(--s3); } .s4 { --c: var(--s4); }
.sg { --c: var(--gray); }   /* 競合（灰色） */
.bchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.bchip { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
.bchip.on { color: var(--ink); border-color: var(--line2); background: var(--soft); }
.bchip.me.on { color: #fff; background: var(--ink); border-color: var(--ink); }
.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; margin-top: 10px; }
.mcell { min-width: 0; }
.mtitle { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; margin-bottom: 2px; }
@media (max-width: 900px) { .mgrid { grid-template-columns: minmax(0, 1fr); } }
.muted { color: var(--muted); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- 骨組み：左メニュー＋右の本体 ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.logo { display: flex; align-items: center; gap: 9px; padding: 4px 8px 12px; color: var(--ink); }
.logo svg { display: block; height: 22px; width: auto; flex: none; }
.logo b { font-weight: 900; font-size: 18px; letter-spacing: -.025em; line-height: 1; }
.proj { padding: 10px 8px 12px; border-top: 1px solid var(--line); }
.proj b { display: block; font-size: 14px; line-height: 1.3; }
.proj span { font-size: 12px; color: var(--muted); }
.group { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; padding: 14px 10px 6px; }
.navi { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; text-align: left; color: var(--ink-2); font-weight: 600; }
.navi:hover { background: var(--hover); color: var(--ink); }
.navi[aria-current="page"] { background: var(--tint); color: var(--accent); font-weight: 700; }
.navi svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.navi .cnt { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 600; }

.main { min-width: 0; }
.fbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 12px; }
.phead.hasbar + .psub { margin-top: 12px; }
.fbar .fl { max-width: 100%; min-width: 0; }
.fbar .segc { flex-wrap: wrap; max-width: 100%; min-width: 0; }   /* 狭い画面ではボタンを折り返す（横にはみ出さない） */
.fl { display: inline-flex; align-items: center; gap: 6px; }
.fl > span { font-size: 12px; color: var(--muted); font-weight: 600; flex: none; white-space: nowrap; }
.segc { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: #fff; }
.segc button { border: 0; background: transparent; border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.segc button[aria-pressed="true"] { background: var(--tint); color: var(--accent); box-shadow: 0 0 0 1px var(--chk); }
.chip0 { font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; background: #fff; }
.bar { width: 14px; height: 3px; border-radius: 2px; background: var(--c); display: inline-block; flex: none; }
.page { padding: 22px 24px 60px; max-width: 1180px; }
.crumb { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.crumb button { border: 0; background: none; padding: 0; color: var(--muted); font-weight: 600; }
.crumb button:hover { color: var(--ink); text-decoration: underline; }
.ptitle { font-size: 21px; font-weight: 900; margin-top: 4px; letter-spacing: .01em; }
.psub { color: var(--ink-2); margin-top: 4px; }

/* キャラ（エルモーくん）：LP と同じく見出しの横に立たせる。最初の画面だけ名札 */
.phead { display: flex; align-items: flex-end; gap: 20px; }
.phead.hasbubble { align-items: flex-start; }   /* ひとことを言う時は、顔を吹き出しの高さに */
.ptxt { flex: 1; min-width: 0; }
.prow { display: flex; align-items: center; gap: 16px; }
.prow .ptitle { min-width: 0; }
.chara { flex: none; display: flex; flex-direction: column; align-items: center; pointer-events: none; user-select: none; }
.chara img { display: block; height: 72px; width: auto; }
.chara.wide img { height: 62px; }
.chara.flip img { scale: -1 1; }
.chara-name { margin-top: 3px; padding: 1px 9px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; line-height: 1.6; white-space: nowrap; }
.nodata { display: flex; align-items: center; gap: 12px; }
.nodata img { height: 56px; width: auto; flex: none; }
td .nodata { justify-content: flex-start; }   /* 質問一覧は横に長いので、中央だと見えない所に出る */

/* 吹き出し：エルモーくんのひとこと（データから自動で。操作の説明は言わせない） */
.bubble { position: relative; margin: 4px 0 0 auto; flex: 0 1 420px; min-width: 240px; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; background: #fff; border: 1.5px solid var(--ink); border-radius: 14px; padding: 8px 14px 8px; font-size: 13px; line-height: 1.65; color: var(--ink); }
.bubble::before, .bubble::after { content: ""; position: absolute; width: 0; height: 0; border-style: solid; }
.bubble::before { right: -10px; top: 18px; border-width: 7px 0 7px 10px; border-color: transparent transparent transparent var(--ink); }
.bubble::after { right: -7.5px; top: 19.5px; border-width: 5.5px 0 5.5px 8px; border-color: transparent transparent transparent #fff; }
.btext { flex: 1 1 auto; min-width: 0; margin: 0; }
.btext b { font-weight: 800; }
.btext .nw { white-space: nowrap; }
.bfoot { margin-left: auto; display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
.bfoot:empty { display: none; }
.bgo { border: 0; background: none; padding: 0; font-size: 12px; font-weight: 700; color: var(--accent); }
.bgo:hover { text-decoration: underline; }
.bnext { border: 0; background: none; padding: 0 2px; font-size: 11.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.bnext:hover { color: var(--ink); }
.bubble.pop { animation: bpop .22s ease-out; }
@keyframes bpop { from { transform: scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }
.chara.hop img { animation: chop .32s ease-out; }
@keyframes chop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .bubble.pop, .chara.hop img { animation: none; } }

@media (max-width: 600px) {
  .phead { gap: 10px; } .chara img { height: 52px; } .chara.wide img { height: 46px; }
  /* スマホはキャラをタイトルの横に置き、吹き出しと絞り込みは横幅いっぱいに使う */
  .phead.hasbar, .phead.hasbubble { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "crumb chara" "title chara" "bubble bubble" "bar bar"; align-items: end; column-gap: 10px; }
  .phead.hasbar .ptxt, .phead.hasbubble .ptxt, .phead .prow { display: contents; }
  .phead .crumb { grid-area: crumb; }
  .phead .ptitle { grid-area: title; }
  .phead .chara { grid-area: chara; }
  .phead .fbar { grid-area: bar; }
  .phead .bubble { grid-area: bubble; margin: 12px 0 0; min-width: 0; }
  .phead .bubble::before { right: 18px; top: -10px; border-width: 0 7px 10px 7px; border-color: transparent transparent var(--ink) transparent; }
  .phead .bubble::after { right: 19.5px; top: -7.5px; border-width: 0 5.5px 8px 5.5px; border-color: transparent transparent #fff transparent; }
}

/* ---------- 部品 ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 18px; }
.kpi { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.kpi .lab { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; font-weight: 600; }
.kpi .val { font-size: 30px; font-weight: 800; line-height: 1.2; margin-top: 4px; letter-spacing: -.01em; }
.kpi .val small { font-size: 14px; color: var(--ink-2); font-weight: 700; margin-left: 2px; }
.kpi .cap { font-size: 12px; color: var(--muted); }
.panels { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; margin-top: 12px; }
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.panel h2 { font-size: 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel h2 .more { border: 0; background: none; font-size: 12px; color: var(--ink-2); font-weight: 600; padding: 0; }
.panel h2 .more:hover { text-decoration: underline; }
.panel .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tw { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.go { cursor: pointer; }
tr.go:hover td { background: var(--soft); }
tr.me td { background: #fff8de; }
tr.me td:first-child { font-weight: 800; }
.qcell b { display: block; font-size: 13px; }
.qcell span { display: block; font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 1px; }
.tag { display: inline-block; font-size: 11px; font-weight: 800; color: #fff; background: var(--ink); border-radius: 5px; padding: 0 6px; }
.kind { display: inline-block; font-size: 11px; font-weight: 700; color: var(--ink-2); background: var(--soft); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.dots { display: inline-flex; gap: 4px; vertical-align: middle; margin-right: 8px; }
.d { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px #c9ced8; display: inline-block; }
.d.on { background: var(--c); box-shadow: none; }
.meter { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.meter .trk { flex: 1; height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.meter .trk i { display: block; height: 100%; background: var(--c, var(--ink)); border-radius: 3px; }
.meter b { font-size: 13px; font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
.chev { color: var(--muted); text-align: right; }
.yes { font-weight: 800; }
.no { color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; padding: 14px 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
.search { border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font: inherit; width: 340px; max-width: 100%; }
.note { margin-top: 12px; font-size: 13px; color: var(--ink-2); background: var(--soft); border-radius: 8px; padding: 8px 12px; }

/* ---------- 質問一覧（記録シートと同じ列） ---------- */
.grid { overflow: auto; max-height: calc(100vh - 230px); border: 1px solid var(--line); border-radius: 10px; margin-top: 14px; }
.grid table { font-size: 12.5px; }
.grid th { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 0; box-shadow: inset 0 -1px 0 var(--line); }
.grid td { vertical-align: top; padding: 9px 10px; background: #fff; }
.grid th:first-child, .grid td:first-child { position: sticky; left: 0; z-index: 1; box-shadow: inset -1px 0 0 var(--line); }
.grid th:first-child { z-index: 3; box-shadow: inset -1px -1px 0 var(--line); }
.grid tr.go:hover td { background: var(--soft); }
.grid tr.gtop td { border-top: 2px solid var(--line2); }
.grid td.b { font-weight: 800; }
.grid td.c { text-align: center; font-size: 14px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; overflow-wrap: anywhere; }
.rec { margin: 6px 0 0; }
.rec dt { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 8px; }
.rec dd { margin: 2px 0 0; font-size: 12.5px; line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; }

.pcell { display: flex; gap: 6px; align-items: flex-start; }
.grip { flex: none; cursor: grab; color: var(--muted); font-size: 12px; letter-spacing: -2px; line-height: 1.6; padding: 0 3px; border-radius: 4px; user-select: none; }
.grip:hover { background: var(--soft); color: var(--ink); }
.grip:active { cursor: grabbing; }
.grid tr.dragging td { opacity: .45; }
.grid tr.drop-before td { box-shadow: inset 0 2px 0 var(--accent); }
.grid tr.drop-after td { box-shadow: inset 0 -2px 0 var(--accent); }
a.full { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; }
a.full:hover { text-decoration: underline; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.btn:hover { background: var(--soft); }

/* 質問一覧：スプレッドシートと同じ見え方（1行1段・格子・見出し固定） */
.sheet { overflow: auto; max-height: calc(100vh - 230px); border: 1px solid var(--line2); margin-top: 12px; background: #fff; }
.sheet table { table-layout: fixed; width: max-content; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.sheet th, .sheet td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px 8px; line-height: 1.5; white-space: normal; overflow-wrap: anywhere; overflow: hidden; text-align: left; vertical-align: top; }
.sheet th { vertical-align: bottom; }
.sheet .cl { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.sheet .cl3 { -webkit-line-clamp: 3; }
.sheet .cl4 { -webkit-line-clamp: 4; }
.sheet th { position: sticky; top: 0; z-index: 2; background: var(--soft); color: var(--ink); font-weight: 700; }
.sheet .rn { position: sticky; left: 0; z-index: 1; background: var(--soft); color: var(--muted); text-align: center; padding: 6px 0; cursor: grab; user-select: none; }
.sheet th.rn { z-index: 3; }
.sheet td.c { text-align: center; }
.sheet td.num { text-align: right; }
.sheet tr.dragging td { opacity: .45; }
.sheet tr.drop-before td { box-shadow: inset 0 2px 0 var(--accent); }
.sheet tr.drop-after td { box-shadow: inset 0 -2px 0 var(--accent); }

.sheet th { padding: 6px 6px 6px 8px; vertical-align: middle; }
.sheet th .thc { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.sheet th .fbtn { flex: none; width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid #c9ced8; border-radius: 5px; background: #fff; color: var(--ink-2); padding: 0; }
.sheet th .fbtn svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.sheet th .fbtn:hover { background: var(--hover); color: var(--ink); border-color: #a9b0bf; }
.sheet th .fbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.sheet th .fbtn.on svg { fill: currentColor; }
.sheet td.none { text-align: left; color: var(--muted); height: 60px; padding: 10px 16px; }
.fpop { position: fixed; z-index: 50; width: 280px; max-width: calc(100vw - 16px); display: flex; flex-direction: column; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px rgba(15,26,46,.14); padding: 12px; }
.fpop .ft { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.fpop .search { width: 100%; }
.ftools { display: flex; gap: 14px; }
.lnk { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12px; font-weight: 700; }
.flist { overflow: auto; max-height: 240px; display: grid; gap: 1px; border-top: 1px solid var(--line); padding-top: 6px; }
.fitem { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 6px; align-items: center; font-size: 12.5px; padding: 3px 2px; cursor: pointer; }
.fitem span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #1b2a47; }
.btn:disabled { opacity: .45; cursor: default; }

.kpi.clk { cursor: pointer; transition: border-color .15s, background .15s; }
.kpi.clk:hover { border-color: #bfc5d0; background: #f9fafb; }
td.clk, th.clk { cursor: pointer; }
td.clk:hover { background: var(--soft); }
th.clk:hover { color: var(--ink); text-decoration: underline; }

.legend { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.tsgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 10px; }
.tsbox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 6px; }
.tstitle { font-size: 12.5px; font-weight: 700; color: var(--ink); }
.tschart { width: 100%; height: auto; display: block; margin-top: 4px; }
.tschart .tsgrid-l { stroke: var(--line); stroke-width: 1; }
.tschart .tsax { font-size: 10px; fill: var(--muted); }
.tschart .tsval { font-size: 11px; font-weight: 700; fill: var(--ink); }
.tschart circle { cursor: default; }

.tw.trend tr.gtop td { border-top: 2px solid var(--line2); }
.tw.trend td.b { font-weight: 800; }

.tctl { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 10px; }
.tctl .fl > span { font-size: 12px; color: var(--muted); font-weight: 600; }
.sel { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px; background: #fff; }
.tlegend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.titem { display: inline-flex; align-items: center; gap: 6px; }
.tcwrap { position: relative; margin-top: 6px; overflow-x: auto; }
.tchart { display: block; }
.tchart .tgl { stroke: var(--line); stroke-width: 1; }
.tchart .tax { font-size: 11px; fill: var(--muted); }
.tchart .tlab { font-size: 11.5px; font-weight: 700; fill: var(--ink); }

しやクリーニング、磨き直しが永久保証かどうかも確認。\n来店予約：ブランドによっては来店予約で特典があり、待ち時間なく相談できる 。\nこれらのブランドは、世界で一つだけの婚約指輪を予算内で作りたい方に特におすすめです。デザインの好みや予算、納期に合わせて選ぶと満足度の高い一生ものの指輪が手に入ります。", "stores": [], "sources": [{"label": "株式会社EXIDEA", "url": "https://exidea.co.jp/blog/wedding/marriage/made-to-order/", "domain": "exidea.co.jp", "kind": "メディア"}, {"label": "www.mwed.jp", "url": "https://www.mwed.jp/articles/11032/", "domain": "mwed.jp", "kind": "メディア"}, {"label": "SAKIDORI（サキドリ）", "url": "https://sakidori.co/article/2187569", "domain": "sakidori.co", "kind": "未分類"}, {"label": "ウエディングパーク", "url": "https://ringraph.weddingpark.net/kodawari/search/ho1", "domain": "ringraph.weddingpark.net", "kind": "メディア"}, {"label": "マイナビウエディング", "url": "https://wedding.mynavi.jp/ring/ranking/engage/73/", "domain": "wedding.mynavi.jp", "kind": "メディア"}, {"label": "goodpick.appmatch.jp", "url": "https://goodpick.appmatch.jp/6951-q1/", "domain": "goodpick.appmatch.jp", "kind": "未分類"}, {"label": "Mybest", "url": "https://my-best.com/22762", "domain": "my-best.com", "kind": "メディア"}, {"label": "net-toolbox.jp", "url": "https://net-toolbox.jp/guide/bridal-jewelry-comparison", "domain": "net-toolbox.jp", "kind": "未分類"}], "cards": [], "reason": "オーダーメイド婚約指輪は、銀座ダイヤモンドシライシやケイウノ、エクセルコ ダイヤモンドなど、日本国内の人気ブランドで世界に一つだけのリングを作ることができます。\n人気ブランド一覧と特徴\n2. K.UNO（ケイウノ）\nポイント：豊富な素材とデザインでオーダーメイドが可能。\nディズニーコラボも独自展開。\n150名以上の職人と約50名のデザイナーが手作り 。", "match": "2 ＝ 狙う特徴で説明された", "competitors": ["銀座ダイヤモンドシライシ", "エクセルコ", "杢目金屋", "BRILLIANCE+", "ith", "TANZO"], "image": "", "batch": "2026-09-28", "feat_hits": []}, {"q": 3, "platform": "copilot_bing", "round": 1, "run_at": "2026-09-28T05:06:45+07:00", "model": "不明（画面に表示なし）", "region": "東京（VPN）", "login": "あり", "appeared": 0, "rank": null, "brands": ["アイプリモ", "NIWAKA", "杢目金屋", "ith"], "text": "婚約指輪には「物語や個性を込められるブランド」があり、I-PRIMO、NIWAKA、杢目金屋、ithなどで二人の思いやエピソードをデザインに反映できます。\nストーリー性のある代表的ブランド\nI-PRIMO（アイプリモ）\n特徴: 星座や神話、花などにちなんだ「リングストーリー」があり、正統派からウェーブラインまで選べる多彩なデザイン 。\nおすすめポイント: 婚約指輪・結婚指輪をセットで重ね付けでき、プロポーズ後にデザイン変更も可能。専用のカラーダイヤや刻印で二人だけの物語を完成させられる 。\n例: 「オリオン」は夜空の星をイメージしたシンプルなストレートリング、「フラネリー」は花言葉「いつも愛して」を表現したウェーブラインの華やかなリング 。\nNIWAKA（ニワカ）\n特徴: 京都発のブランドで、婚約指輪1本1本に美しい情景や名前、ストーリーが込められている 。\nおすすめポイント: セミオーダーで自分だけの意味を込められる。伝統美と現代の感性を融合させたデザインが魅力 。\n杢目金屋（もくめがねや）\n特徴: 江戸時代発祥の「木目金」技法を用いた指輪。桜や木目を活かして二人の個性を象徴できる 。\nおすすめポイント: 婚約指輪と結婚指輪を同素材でセットリングにでき、二人の物語を刻むことが可能。フルオーダーや刻印も対応 。\nith（イズ）\n特徴: 女性職人のアトリエで手作りされるブランド。幅・素材・テクスチャを自由に変更でき、一点物の婚約指輪が作れる 。\nおすすめポイント: カラーストーンを用いて記念日や誕生石を反映、熟練職人が耐久性や輝きを考慮して丁寧に仕立てるため、お二人だけの特別な指輪が完成 。\nブランド選びのポイント\nデザイン×ストーリー: 二人の価値観やエピソードに合うモチーフ（星座、花、神話など）を選ぶと、より特別感が増す 。\nオーダーメイド・刻印: キャラクターや誕生石、数字、メッセージ刻印でオンリーワンを演出できる 。\n実店舗での確認: 形状や輝き、着用感を確認することが大切。オンライン相談やパーソナル診断を活用するとより具体的にイメージできる 。\nまとめ\n二人の物語やエピソードを婚約指輪に込めたい場合、日本国内では I-PRIMO、NIWAKA、杢目金屋、ith のブランドがおすすめです。既製品でもストーリー性を持つデザインがありますが、セミオーダーやフルオーダーを活用することで、誕生石や刻印などを通して特別なメッセージやエピソードを反映した世界に一つだけの婚約指輪を作ることができます。\n特に「二人の人生の記念日や思い出を形に残したい」「既存デザインに二人だけの意味を込めたい」カップルには、これらのブランドが最適です。", "stores": [], "sources": [{"label": "＠BAILA", "url": "https://baila.hpplus.jp/wedding/ring/83169", "domain": "baila.hpplus.jp", "kind": "未分類"}, {"label": "マイナビウエディング", "url": "https://wedding.mynavi.jp/ring/recommended/67/", "domain": "wedding.mynavi.jp", "kind": "メディア"}, {"label": "東京ヘッドライン", "url": "https://www.tokyoheadline.com/recon/ginza-marriage-rings/column/iprimo-ring-story/", "domain": "tokyoheadline.com", "kind": "メディア"}, {"label": "ジュエリーの総合情報サイト【Jewelry Town】", "url": "https://www.jewel-town.com/tips/unique-engagementrings/", "domain": "jewel-town.com", "kind": "メディア"}, {"label": "SAKIDORI（サキドリ）", "url": "https://sakidori.co/article/2187569", "domain": "sakidori.co", "kind": "未分類"}, {"label": "www.mwed.jp", "url": "https://www.mwed.jp/articles/11417/", "domain": "mwed.jp", "kind": "メディア"}, {"label": "オーダーメイド結婚指輪・婚約指輪のブランドith（イズ）", "url": "https://www.ateliermarriage.com/column/case_study", "domain": "ateliermarriage.com", "kind": "未分類"}, {"label": "TRILL [トリル]", "url": "https://trilltrill.jp/articles/5055179", "domain": "trilltrill.j インによっては初回でのリング交換も対応可能です 。\n鎌倉彫金工房 / renri\n手作り指輪ブランドですが、クリーニング・サイズ直し・歪み直しなどを永年無料で提供。郵送対応も可能で、遠方でも安心です 。\n海外ブランドのアフターサービスの特色\nティファニー：全てのダイヤモンド婚約指輪に生涯保証を付与し、クリーニングも無料 。\nカルティエ・ヴァンクリーフ&アーペル・ブルガリ：基本メンテナンスは無料ですが、サイズ直しは購入後一定期間のみ無償など条件付きが多く、国内ブランドに比べると保証範囲は限定的です 。\n選ぶ際のポイント\n保証範囲の広さで選ぶ：エクセルコダイヤモンド、銀座ダイヤモンドシライシ。\n保証項目数の多さで選ぶ：4℃ブライダル。\nサイズ交換まで対応してほしい場合：アイプリモ、ラザールダイヤモンド。\n手作り指輪で永年保証を希望：renri、鎌倉彫金工房。\n注意点\n永久保証でも、深い傷や大幅なデザイン変更、大粒ダイヤの留め直しなどは有償となるケースがあります 。\nデザインや素材によってサイズ直しに制限がある場合があります（エタニティリングやピンクゴールドなど） 。\n郵送修理に対応しているか、引越し後の利用可否も事前に確認しておくと安心です 。\n購入時には、無料になるサービス範囲・回数・期間、店舗数や配送対応の可否を比較し、ご自身の生活スタイルや指輪のデザインに合わせて選ぶことが最も現実的で安心です。", "stores": [], "sources": [{"label": "HOW TO MARRY", "url": "https://how-to-inc.com/after-service-39678", "domain": "how-to-inc.com", "kind": "メディア"}, {"label": "マイナビウエディング", "url": "https://wedding.mynavi.jp/ring/contents/pages/after_service/", "domain": "wedding.mynavi.jp", "kind": "メディア"}, {"label": "www.weddingnews.jp", "url": "https://www.weddingnews.jp/magazine/277622", "domain": "weddingnews.jp", "kind": "メディア"}, {"label": "www.lucie.jp", "url": "https://www.lucie.jp/bridal/after-service/", "domain": "lucie.jp", "kind": "未分類"}, {"label": "trecenti.jp", "url": "https://trecenti.jp/after/", "domain": "trecenti.jp", "kind": "ブランド公式"}, {"label": "www.lazarediamond.jp", "url": "https://www.lazarediamond.jp/service/", "domain": "lazarediamond.jp", "kind": "未分類"}, {"label": "www.iprimo.jp", "url": "https://www.iprimo.jp/service/after_service/", "domain": "iprimo.jp", "kind": "ブランド公式"}, {"label": "K.UNO（ケイウノ）", "url": "https://www.k-uno.co.jp/service/afterservice/", "domain": "k-uno.co.jp", "kind": "ブランド公式"}, {"label": "俄 NIWAKA", "url": "https://www.niwaka.com/bridal/faq/after-service.html", "domain": "niwaka.com", "kind": "ブランド公式"}], "cards": [], "reason": "", "match": "0 ＝ 登場せず", "competitors": ["エクセルコ", "銀座ダイヤモンドシライシ", "アイプリモ", "鎌倉彫金工房", "Tiffany", "Cartier", "4℃"], "image": "", "batch": "2026-09-28", "feat_hits": []}, {"q": 6, "platform": "copilot_bing", "round": 1, "run_at": "2026-09-28T05:09:58+07:00", "model": "不明（画面に表示なし）", "region": "東京（VPN）", "login": "あり", "appeared": 1, "rank": 1, "brands": ["ケイウノ", "鎌倉彫金工房", "BRILLIANCE+"], "text": "日本国内には、自社工房で熟練職人が手作りする高品質な婚約指輪ブランドが複数あり、それぞれオーダーメイドや手作り体験に対応しています。\n代表的なブランドと特徴\nK.UNO（ケイウノ）\n全国30以上の店舗を展開し、自社工房で婚約指輪・結婚指輪を製作。プラチナやゴールドの自社配合素材を使用し、デザイナーと職人が目の前で相談や制作サポートを行うため、オリジナリティの高い指輪作りが可能 。\n鎌倉彫金工房\n神奈川県鎌倉と横浜に工房を持ち、鍛造による手作りが可能。シンプルなストレートリングや強度のある素材で作る婚約指輪に向いており、当日持ち帰り可能なコースもある 。\n工房スミス（Smith）\n東京青山、札幌、新潟に工房を構え、完全予約制で貸切体験ができる。ジュエリー専門学校出身の職人がサポートし、プライベート空間で手作りできるため、完成度の高い指輪が作れる 。\nWAIJEWELRY（ワイジュエリー）\nデザインから石留め、仕上げまで全工程を同じ自社工房で行い、デザイナーとの距離も近いため柔軟なオーダー対応が可能。細部まで職人技を反映できることが特徴です 。\nBRILLIANCE+（ブリリアンスプラス）\n日本の熟練宝飾職人が細部まで手作業で仕上げる婚約指輪を提供。原型作りや石留め、仕上げまで完全自社工房で行い、マテリアルや着け心地を極めた品質に定評があります 。\nMITUBACI TOKYO\n鍛造・鋳造技術を駆使したファインブライダルジュエリーを提供し、手作り体験も可能。石留めなどの高度な加工も自社工房で完結するため、高品質をその場で体感できる点が特徴です 。\nジュエリーかまた\n90年以上の伝統を持つ職人たちが自社工房で婚約指輪を製作。若手からベテランまで幅広い年代の職人が在籍し、熟練の技術を活かして一つひとつ丁寧に仕上げます 。\n選ぶポイント\n自社工房での製造：中間業者を挟まず、希望が正確に反映される。\n職人のサポート体制：初心者でも安心して手作りが可能。\nオーダーメイド・セミオーダー対応：素材、デザイン、宝石の配置まで自由度が高い。\nアフターサービス：サイズ直しやクリーニング、保証が充実しているブランドが安心。\nこれらのブランドでは、単なる既製品購入では得られない個性と職人技の融合を体験できるため、婚約指輪選びに特におすすめです。", "stores": [], "sources": [{"label": "ジュエリーかまた", "url": "https://www.j-kamata.com/pickup/craftsmanship/", "domain": "j-kamata.com", "kind": "未分類"}, {"label": "STAR JEWELRY(スタージュエリー)", "url": "https://www.star-jewelry.com/bridal/pages/starquality/sjb-craftsmanship.html", "domain": "star-jewelry.com", "kind": "未分類"}, {"label": "K.UNO（ケイウノ）", "url": "https://www.k-uno.co.jp/about/craftsmanship/", "domain": "k-uno.co.jp", "kind": "ブランド公式"}, {"label": "smith-bridal.com", "url": "https://smith-bridal.com/", "domain": "smith-bridal.com", "kind": "未分類"}, {"label": "waijewelry.jp", "url": "https://waijewelry.jp/waiwai-column/20725/", "domain": "waijewelry.jp", "kind": "未分類"}, {"label": "ブリリアンス・プラス", "url": "https://www.brilliance.co.jp/about/madeinjapan/", "domain": "brilliance.co.jp", "kind": "ブランド公式"} 10762/", "domain": "mwed.jp", "kind": "メディア"}, {"label": "株式会社EXIDEA", "url": "https://exidea.co.jp/blog/wedding/marriage/made-to-order/", "domain": "exidea.co.jp", "kind": "メディア"}, {"label": "みんなのウェディング、みんなのウェディング", "url": "https://www.mwed.jp/articles/11032/", "domain": "mwed.jp", "kind": "メディア"}, {"label": "ウェディングニュース", "url": "https://www.weddingnews.jp/magazine/269364", "domain": "weddingnews.jp", "kind": "メディア"}], "cards": ["Jeulia カスタム スリーストーン 婚約指輪 10K/14K/18K ゴールド & プラチナ ¥96,050 Jeulia その他 評価: 4.9 4.9 （10）"], "reason": "K.UNO（ケイウノ）\nみんなのウェディング\n特徴: 日本最大級のオーダーメイドブランドで、専門のデザイナーがその場で無料でデザイン画を提案してくれます。\nディズニーデザインのオーダーにも対応しており、細部までこだわった世界に一つの指輪が作れます。\nデザインの自由度を重視するなら: ケイウノ、ith\n株式会社EXIDEA", "match": "2 ＝ 狙う特徴で説明された", "competitors": ["銀座ダイヤモンドシライシ", "エクセルコ", "ith", "杢目金屋", "TANZO", "BRILLIANCE+"], "image": "", "batch": "2026-09-28", "feat_hits": []}, {"q": 3, "platform": "gemini_nologin", "round": 1, "run_at": "2026-09-28T05:14:03+07:00", "model": "Gemini 3.5 Flash-Lite", "region": "東京（VPN）", "login": "なし", "appeared": 0, "rank": null, "brands": ["ith", "SORA", "Hamri", "NIWAKA"], "text": "二人だけの思いやエピソードをデザインに反映させたい場合、既製品を選ぶだけでなく、「オーダーメイド（フルオーダー・セミオーダー）」に強いブランドや、一つひとつの指輪に深いストーリーや情景を込めているブランドを選ぶのがおすすめです。\n\n具体的にどのようなアプローチで思いを反映できるか、特徴別の代表的なブランドをご紹介します。\n\n1. ゼロから二人の物語を形にする「オーダーメイド・手作りブランド」\n\n二人の出会いの場所、趣味、思い出のエピソードをデザイナーや職人と一から相談し、世界に一つのデザインとして指輪に落とし込んでくれるブランドです。\n\nith（イズ）   \nマイナビウエディング\n\n特徴: 「One Story. One Ring.（ひとつの物語に、ひとつの指輪）」をコンセプトに掲げるオーダーメイドブランド。クラフトマンが二人のヒアリングを行い、思い出や好みの雰囲気をヒントにデザインを提案・形にしてくれます。   \nマイナビウエディング\n他 1 件\n\n反映できること: 「旅行先で見た景色」「共通の趣味」「思い出のモチーフ」などを、アームの形状や彫り模様、石の留め方などに自由に組み込むことができます。\n\nSORA（ソラ）\n\n特徴: 発色の美しいレアメタル（ジルコニウムやタンタルなど）を使い、鮮やかなグラデーションカラーや独創的なフォルムを表現できるブランド。   \nマイベスト\n\n反映できること: 二人が出会った「夕焼け空の色」や「海のグラデーション」などを指輪の色やデザインとしてダイレクトに反映させたい場合に最適です。\n\nHamri（ハムリ） / 各種手作り工房\n\n特徴: 専門の職人のサポートを受けながら、自分たち自身でワックス（原型）を削ったり、デザインを手がけたりできるブランド。\n\n反映できること: 不器用でも、二人の手で作り上げるプロセスそのものがかけがえのない思い出になり、デザインにも温かみのあるエピソードが宿ります。\n\n2. 情景や「名前（ストーリー）」に二人の思い出を重ねられるブランド\n\n日本の美しい情景や、インスピレーションを大切にするブランドでは、指輪一つひとつに名前やポエム（情景）が用意されており、二人のエピソードに最もしっくりくるものを選ぶことができます。\n\n俄（NIWAKA）   \nマイベスト\n\n特徴: 京都で誕生した、日本の美しい情景や四季、情緒ある言葉をリングに込めるブランド。   \nマイベスト\n\n反映できること: 「初桜（うすざくら）」「白鈴（しろすず）」など、指輪一つひとつにストーリーやテーマがあります。「二人の思い出の季節」や「プロポーズのシチュエーション」に重なる名前・デザインを選ぶことで、指輪を見るたびにそのエピソードがよみがえります。\n\nRosettE（ロゼット）   \nみんなのウェディング\n\n特徴: イングリッシュガーデンをテーマにした、クラシカルで温かみのあるデザインが特徴のブランド。   \nマイベスト\n\n反映できること: 「小枝」「魔法」「穏やかな時間」など、自然や物語をモチーフにしたリングが多く、「出会った頃の雰囲気」や「二人らしい穏やかな関係性」をデザインから選ぶことができます。\n\n3. モチーフや刻印・内側へのこだわりで思いを託せるブランド\n\nCAFERING（カフェリング）\n\n特徴: プラチナ専門店でありながら、上品で優しいデザインが揃うブランド。日常のカフェで過ごすような心地よさを大切にしています。\n\n反映できること: 二人の記念のインスピレーションを大切にしており、リングの内側に二人だけのオリジナルマークや、記念のモチーフを刻印するなど、パーソナライズの相談にも柔軟に対応してくれます。\n\nMAILE（マイレ）※ハワイアンジュエリー\n\n特徴: ハワイの伝統的な彫りを施すオーダーメイド・ジュエリー。\n\n反映できること: スクロール（波＝「永遠に途切れない愛」）やマイレの葉（「神聖な結びつき」）など、彫り模様一つひとつに意味があり、二人の誓いやエピソードを模様の組み合わせで表現できます。\n\n💡 エピソードをデザインに反映させるためのポイント\n\nコンシェルジュ・デザイナーにエピソードを話してみる\n「付き合った場所が海だった」「二人の共通の趣味は〇〇」など、一見ジュエリーに関係なそうなエピソードでも、経験豊富なデザイナーは「では、このウェーブのラインでそれを表現しましょう」と形にしてくれます。\n\n内側（刻印・シークレットストーン）にこだわる\n外側のデザインはシンプルに保ちつつ、指輪の内側に二人だけの暗号や、思い出の日の星空、思い出のモチーフの刻印、お互いの誕生石（シークレットストーン）を埋め込むことで、こっそりとエピソードを忍ばせることも可能です。\n\nまずは、二人で「どんな思い出を形にしたいか」を少し話し合ってみてから、オーダーメイドに対応している店舗（ithやSORAなど）に足を運び、デザイナーに相談してみてはいかがでしょうか。", "stores": [], "sources": [{"label": "マイナビウエディング、マイナビウエディング", "url": "https://wedding.mynavi.jp/us/article/72196/", "domain": "wedding.mynavi.jp", "kind": "メディア"}, {"label": "マイベスト", "url": "https://my-best.com/22762", "domain": "my-best.com", "kind": "メディア"}, {"label": "みんなのウェディング", "url": "https://www.mwed.jp/articles/10999/", "domain": "mwed.jp", "kind": "メディア"}], "cards": [], "reason": "", "match": "0 ＝ 登場せず", "competitors": ["ith", "SORA", "Hamri", "NIWAKA"], "image": "", "batch": "2026-09-28", "feat_hits": []}, {"q": 4, "platform": "gemini_nologin", "round": 1, "run_at": "2026-09-28T05:17:21+07:00", "model": "Gemini 3.5 Flash-Lite", "region": "東京（VPN）", "login": "なし", "appeared": 1, "rank": 5, "brands": ["GROWTH RING", "BRILLI , "Cartier", "NIWAKA", "銀座ダイヤモンドシライシ", "エクセルコ", "アイプリモ"], "text": "予算内で、素材やダイヤモンドの品質、そしてデザイン性にもこだわりたい場合、「国内のブライダルリング専門ブランド」や「ダイヤモンドに強い老舗ブランド」が非常に有力な選択肢になります。\n\n海外ハイブランド（ティファニーやカルティエなど）はネームバリューや箱の特別感がある一方で、同じ予算でもブランド料が上乗せされ、ダイヤモンドのグレードや選択肢が限られてしまうことがあります。\n\n以下に、20万〜40万円前後の予算でも、素材（プラチナやゴールドの種類）や細やかなデザイン、高品質なダイヤモンドにこだわることができる人気のブランドを厳選してご紹介します。\n\n1. 独自の美意識と繊細なデザイン：俄（NIWAKA）\n\n特徴: 京都で誕生した日本のジュエリーブランド。日本の美しい情景やストーリーがリング一つひとつに込められており、和のテイストを取り入れた上品で洗練されたデザインが魅力です。どの角度から見ても美しい立体的なフォルムや、指が綺麗に見えるウェーブデザインなどに定評があります。\n\nこだわり: プラチナの純度や強度にもこだわりがあり、職人の高い技術による滑らかな着け心地が特徴です。   \nマイベスト\n\n価格帯の目安: 20万円台〜（ダイヤモンドの品質やデザインにより変動しますが、予算内でも十分素敵なモデルが選べます）\n\n2. 日本最大級の品質とセミオーダーの自由度：銀座ダイヤモンドシライシ / エクセルコ ダイヤモンド\n\n銀座ダイヤモンドシライシ   \nRingraph(リングラフ) - ウエディングパーク\n\n特徴: 日本初のブライダルリング専門店。シンプルから華やかなメレダイヤ付きまで、約数百種類のデザインから選べます。   \nマイベスト\n\nこだわり: 世界三大市場の一つであるイスラエルに現地法人を持ち、最高品質のダイヤモンドを中間マージンを抑えて調達。枠とダイヤモンドを自由に組み合わせる「セミオーダー」が充実しているため、予算内で「ダイヤモンドのランクを上げる」か「デザインにこだわるか」の調整がしやすいです。   \nマイベスト\n\nエクセルコ ダイヤモンド   \nRingraph(リングラフ) - ウエディングパーク\n\n特徴: 上記の姉妹ブランドであり、世界的なダイヤモンドカッターズブランドの歴史を持ちます。   \nマイベスト\n\nこだわり: ダイヤモンドの輝きを最大限に引き出す独自のカット技術（サクラダイヤモンドなど）や、アンティーク調からモダンなデザインまで、細部までこだわり抜いたディテールが特徴です。   \nマイベスト\n\n3. 日本人の手に馴染むつけ心地と豊富な選択肢：I-PRIMO（アイプリモ）   \n株式会社マイナビ\n\n特徴: 国内外に広く展開するブライダルリング専門店。常時150種類以上の豊富なデザインを取り揃えており、王道のソリティアから個性派まで幅広くカバーしています。   \nマイベスト\n\nこだわり: プロのスタッフが手の特徴や好みを診断して似合うリングを提案してくれる「パーソナルハンド診断」があり、素材もプラチナだけでなく、肌馴染みの良いピンクゴールドやイエローゴールドへの変更など柔軟に対応してくれます。   \nマイベスト\n\n価格帯の目安: 20万円台〜\n\n4. 世界基準の最高品質ダイヤモンド：ラザール ダイヤモンド / ロイヤル・アッシャー\n\nラザール ダイヤモンド（ニューヨーク発）\n\n七色に輝く「アイディアルメイク」と呼ばれる美しいカットにこだわり、ダイヤモンドのまばゆい輝きを重視したい人におすすめ。シンプルながら洗練されたアームのデザインも豊富です。\n\nロイヤル・アッシャー（オランダ・アムステルダム発）\n\n英国王室御用達。白く上品で気品のある輝き（ロイヤル・アッシャー・カットなど）が特徴で、ヨーロッパ流のクラシカルで気品あるデザインが揃っています。\n\n価格帯の目安: 20万〜40万円台（選び方次第で予算内に収まります）\n\n💡 予算内で「素材・デザイン・品質」すべてにこだわるためのコツ\n\n「セミオーダー（枠とダイヤの別売り）」のブランドを選ぶ\n\nブランドの店頭で「予算〇〇万円以内で、ダイヤの品質（大きすぎず綺麗なもの）とこのデザインを両立させたい」と伝えると、予算に合わせてダイヤモンドのルース（裸石）とリング枠を上手に組み合わせてくれます。\n\n素材の選択肢を広げる\n\n定番のプラチナだけでなく、K18（イエローゴールド・ピンクゴールド）を選ぶと、プラチナより です。土日祝日は混雑するため、事前の来店予約がおすすめです。 \nexidea\nexidea\n\nそのほかの選択肢\n\nビジュピコ:評判や費用相場、納期をまとめた解説記事があり、婚約指輪の人気ブランドとして紹介されています。\n杢目金屋:個性的な素材(木目金)を使った指輪で知られています。\n\nオーダーの種類と選び方\n\nオーダーには2つのパターンがあります。セミオーダーは、予算に合わせてダイヤモンドのルース(裸石)を選び、好きなデザインの空枠を選ぶ方法です。フルオーダーは、ゼロからデザインを起こす方法です。既製品では希望通りのものが見つからない、二人らしさを加えたいという場合は、フルオーダーやセミオーダーがおすすめとされています。 \nallabout\nzexy\n\n一般的には、フルオーダーは費用が高く、納期も長くなる傾向があります。プロポーズの日や結婚式の日程が決まっているなら、逆算して早めに相談するのがおすすめです。\n\n相談前にできる準備\n\n好きなモチーフ、思い出の場所、誕生石など、二人らしさの手がかりを書き出す\n予算と、いつまでに必要かを決める\n普段使いしやすいか(爪の高さ、指へのなじみ)を考えておく\n2〜3ブランドで相見積もりをとり、提案力や雰囲気を比べる\n\n費用や納期、対応範囲は店舗や時期によって変わるため、来店予約の際に公式サイトや店頭で最新情報を確認してください。\n\nプロポーズ用に贈る側として探しているのか、二人で選びに行く予定なのか、予算のイメージなどを教えていただければ、絞り込みのお手伝いもできます。", "stores": [], "sources": [{"label": "mwed", "url": "https://www.mwed.jp/articles/11032/", "domain": "mwed.jp", "kind": "メディア"}, {"label": "exidea", "url": "https://exidea.co.jp/blog/wedding/marriage/engagement-ring-ranking/", "domain": "exidea.co.jp", "kind": "メディア"}, {"label": "allabout", "url": "https://allabout.co.jp/gm/gl/23031/5/", "domain": "allabout.co.jp", "kind": "未分類"}, {"label": "zexy", "url": "https://zexy.net/article/app002308014/", "domain": "zexy.net", "kind": "未分類"}], "cards": [], "reason": "みんなのウェディングのアンケートでは、婚約指輪のオーダーメイドに対応するブランドで人気が高かったのは、銀座ダイヤモンドシライシ、ケイウノ ブライダル、エクセルコダイヤモンドの順でした。\nmwed\nケイウノ ブライダル(K.UNO):オーダーメイドの体験談では、好きな花をモチーフにした台座にするなど、思い入れを形にした例が紹介されています。\nストーリーを込めたい二人に合いそうです。\nmwed", "match": "2 ＝ 狙う特徴で説明された", "competitors": ["銀座ダイヤモンドシライシ", "エクセルコ", "杢目金屋"], "image": "", "batch": "2026-09-28", "feat_hits": []}, {"q": 12, "platform": "claude_free", "round": 2, "run_at": "2026-09-28T06:52:22+07:00", "model": "Sonnet 5", "region": "東京（VPN）", "login": "あり", "appeared": 1, "rank": 5, "brands": ["銀座ダイヤモンドシライシ", "アイプリモ", "4℃", "ith", "ケイウノ", "NIWAKA"], "text": "予算を抑えつつ素材やデザインにもこだわれるブランドを、タイプ別に挙げます。価格帯は私の把握している目安で、変動しやすいので、購入前に各公式サイトで確認してください。\n\nコスパと品質のバランスが良い定番\n\n銀座ダイヤモンドシライシ:全国に60店舗以上ある国内最大級のブライダル専門店で、数百種類のデザインを組み合わせるセミオーダー式です。2026年の憧れブランドランキングでも国内ブランドとして上位に入っており、迷ったらここは押さえておくと安心です。 \nmwed\nI-PRIMO(アイプリモ):デザインが豊富で、比較的手が届きやすい価格帯から選べます。素材や石の品質が価格に見合っているという声が多く、店舗数も多いので下見がしやすいです。\n4℃(ヨンドシー):普段使いしやすい繊細なデザインが得意です。ダイヤの大きさより雰囲気を重視する人に向いています。\n\nデザインや素材の個性で選ぶ\n\nith(イズ):オーダーメイドやセミオーダーで、素材や石の選択肢が広く、自分たちらしい一本を作りやすいです。\nK.UNO(ケイウノ):職人の手仕事にこだわったブランドで、着け心地や作りの丁寧さに定評があります。\nNIWAKA(俄):和の要素を取り入れた個性的なデザインです。やや価格は上がりますが、他と被りにくいです。\n\nとにかく予算を抑えたい場合\n\nラボグロウン(人工)ダイヤモンドを選ぶと、同じ予算でカラット数や品質を上げやすくなります。取り扱いは新しいブランドやオーダー系ショップが中心なので、鑑定書の有無や再販価値は事前に確認してください。\nプロポーズ用のリングを先に贈る方法もあります。婚約指輪より価格を抑えやすい選択肢として、最近増えています。\n\nコストを抑えるコツは、ダイヤのカラット数を少し下げて、カットとプラチナなどの地金の質に予算を回すことです。見た目の輝きと長持ちしやすさは、大きさよりカットや地金で決まる部分が大きいです。\n\nご予算(例:20万円前後、30万〜40万円など)と、好みのデザイン(シンプル、華やか、個性的など)を教えていただければ、もう少し絞り込んでご提案できます。", "stores": [], "sources": [{"label": "mwed", "url": "https://www.mwed.jp/articles/11660/", "domain": "mwed.jp", "kind": "メディア"}], "cards": [], "reason": "K.UNO(ケイウノ):職人の手仕事にこだわったブランドで、着け心地や作りの丁寧さに定評があります。", "match": "1 ＝ 登場したが特徴には触れず", "competitors": ["銀座ダイヤモンドシライシ", "アイプリモ", "4℃", "ith", "NIWAKA"], "image": "", "batch": "2026-09-28", "feat_hits": []}, {"q": 13, "platform": "claude_free", "round": 2, "run_at": "2026-09-28T06:53:59+07:00", "model": "Sonnet 5", "region": "東京（VPN）", "login": "あり", "appeared": 0, "rank": null, "brands": ["銀座ダイヤモンドシライシ", "4℃", "アイプリモ", "Tiffany", "Cartier"], "text": "長く使うなら、期間無制限の「永久保証」を掲げるブライダル専門店が候補になります。内容は店ごとに違うので、契約前に確認してください。\n\n国内ブライダル専門店\n\n銀座ダイヤモンドシライシ: 無期限でメンテナンスを受けられる永久保証サービスがあり、全国50店舗以上どこでもサポートを受けられます。転勤や引っ越しがあっても通いやすい点が強みです。 \nmwed\n4℃ BRIDAL: アフターサービスが生涯無料の永久保証とされています。 \nexidea\nI-PRIMO: クリーニング、サイズ直し、ゆがみ直し、石留め直しは無料で、サイズ交換は初回のみ無料、2回目以降は有料です(2026年8月時点の情報)。 \nexidea\nトレセンテ: 担当者によると、紹介したサービスは基本的に期間の制限なく行っており、メレダイヤ・センターダイヤともに紛失保証がついています。 \nzexy\n\n契約前に確認したいこと\n\n「永久」の条件: 会員登録や定期的な来店が必要な店もあります。無料の範囲(例:±2号まで)や、回数の上限も確認してください。\nサイズ直しの回数と素材: サイズ直しを何度も行うと指輪の厚みが薄くなることがあり、デザインによっては対応できない商品もあります。 \nmwed\n石の紛失補償: 石が外れやすい爪留めタイプの婚約指輪では、特に重要です。\n通いやすさ: 店舗数が多いほど、将来の転居時にも安心です。\n無料と有料の線引き: サービス内容、保証期間、料金はショップによって異なるため、書面で確認するのが確実です。 \nzexy\n\nハイブランド(ティファニー、カルティエなど)\n\n憧れのブランドとしては上位ですが、修理やサイズ直しは有料になることが多く、対応範囲もデザインによって異なります。私はこれらの最新の条件までは調べていないので、気になるブランドは公式サイトや店頭で確認してください。\n\n予算やデザインの好み(華奢、爪留め、伏せ込みなど)を教えていただければ、絞り込みもできます。", "stores": [], "sources": [{"label": "mwed", "url": "https://www.mwed.jp/articles/7830/", "domain": "mwed.jp", "kind": "メディア"}, {"label": "exidea", "url": "https://exidea.co.jp/blog/users-honne/marriage/marriage-ring-employee-straight/", "domain": "exidea.co.jp", "kind": "メディア"}, {"label": "exidea", "url": "https://exidea.co.jp/blog/users-honne/marriage/marriage-ring-female-age40/", "domain": "exidea.co.jp", "kind": "メディア"}, {"label": "zexy", "url": "https://zexy.net/article/app000100702/", "domain": "zexy.net", "kind": "未分類"}, {"label": "mwed", "url": "https://www.mwed.jp/ring/brands/13/", "domain": "mwed.jp", "kind": "メディア"}, {"label": "zexy", "url": "https://zexy.net/mar/manual/ring_info/kiso_faq_article6.html", "domain": "zexy.net", "kind": "未分類"}], "cards": [], "reason": "", "match": "0 ＝ 登場せず", "competitors": ["銀座ダイヤモンドシライシ", "4℃", "アイプリモ", "Tiffany", "Cartier"], "image": "", "batch": "2026-09-28", "feat_hits": []}, {"q": 14, "platform": "claude_free", "round": 2, "run_at": "2026-09-28T06:56:09+07:00", "model": "Sonnet 5", "region": "東京（VPN）", "login": "あり", "appeared": 1, "rank": 1, "brands": ["ケイウノ"], "text": "「ケイウノ」は、ここでは婚約指輪・結婚指輪などを扱うジュエリーブランド「K.UNO（ケイウノ）」のことだと想定して回答します。別のブランドのことでしたら教えてください。\n\nブランドの全体像\n\nケイウノは、ブライダルとファッションのジュエリーを展開するブランドです。ブライダルジュエリーが製品構成の71%を占めるため、結婚指輪・婚約指輪のイメージが中心です。ディズニー・ジャパンとライセンス契約を結んだ「Disney Treasure created by K.UNO」も展開しています。 \nifis\nifis\n\n主なイメージ\n\n「ふたりでひとつ」のオーダーメイド感：オーダーメイドのコンセプトは「ふたりでひとつ」とされ、二人で自分たちらしい指輪をつくる点が特徴です。製作方法は既製品・セミオーダー・フルオーダーから選べ、DIYコースもあります。 \nzexy\nexidea\n可憐で繊細、上品なデザイン：「すっきりとシンプルに。繊細なフォルムで心地よく手元に溶け込むデザイン」のように、シンプルで普段使いしやすいリングが多い印象です。草花や葉と実、王冠、ハートなど、モチーフに意味や物語を込めたデザインも目立ちます。 \nzexy\nディズニーデザインが選べる：ディズニーデザインの指輪は他ブランドにない特徴として口コミで評判で、女性に人気があるようです。 \nexidea\n手の届きやすい価格帯：結婚指輪・婚約指輪は既製品に近い価格設定で、フルオーダーでもプラチナの結婚指輪2本で20万円台からとされています。ゼクシィ掲載のペアリングにも、女性用88,000円・男性用99,000円のものがあります。 \nexidea\n\nまとめると、「ロマンチックで可愛らしく、オーダーやディズニーで自分たちらしさを出せる、比較的手に取りやすいブライダルジュエリーブランド」というイメージです。ただし、上記は公式情報や口コミサイトをもとにした印象です。実際の雰囲気は店舗で試着して確かめるのがおすすめです。\n\n比較したいブランドがあれば、その点も調べます。", "stores": [], "sources": [{"label": "ifis", "url": "https://column.ifis.co.jp/wp-content/uploads/2024/10/259A241011.pdf", "domain": "column.ifis.co.jp", "kind": "未分類"}, {"label": "zexy", "url": "https://zexy.net/ring/c_7770005012/shohin/s_4040259609/", "domain": "zexy.net", "kind": "未分類"}, {"label": "exidea", "url": "https://exidea.co.jp/blog/wedding/marriage/k-uno/", "domain": "exidea.co.jp", "kind": "メディア"}, {"label": "zexy", "url": "https://zexy.net/ring/c_7770005012/shohin/s_4010499659/", "domain": "zexy.net", "kind": "未分類"}], "cards": [], "reason": "「ケイウノ」は、ここでは婚約指輪・結婚指輪などを扱うジュエリーブランド「K.UNO（ケイウノ）」のことだと想定して回答します。\n別のブランドのことでしたら教えてください。\nブランドの全体像\nケイウノは、ブライダルとファッションのジュエリーを展開するブランドです。\nケイウノは、ブライダルとファッションのジュエリーを展開するブランドです。\nブライダルジュエリーが製品構成の71%を占めるため、結婚指輪・婚約指輪のイメージが中心です。\nディズニー・ジャパンとライセンス契約を結んだ「Disney Treasure created by K.UNO」も展開しています。\nifis\nディズニー・ジャパンとライセンス契約を結んだ「Disney Treasure created by K.UNO」も展開しています。\nifis\nifis\n主なイメージ", "match": "－（イメージ設問のため対象外）", "competitors": [], "image": "イメージ: 　特徴: ディズニー　懸念: ただし、上記は公式情報や口コミサイトをもとにした印象です。", "batch": "2026-09-28", "feat_hits": ["オーダーメイド", "人と被らない・二人の物語", "価格との両立", "ディズニー"]}, {"q": 1, "platform": "gemini_nologin", "round": 2, "run_at": "2026-09-28T07:00:23+07:00", "model": "Gemini 3.5 Flash-Lite", "region": "東京（VPN）", "login": "なし", "appeared": 1, "rank": 6, "brands": ["Tiffany", "Cartier", "銀座ダイヤモンドシライシ", "アイプリモ", "NIWAKA", "ケイウノ"], "text": "婚約指輪（エンゲージリング）を選ぶ際、ブランドの持つストーリーやデザイン、ダイヤモンドの品質、価格帯など、重視するポイントによっておすすめのブランドは異なります。\n\n人気や支持を集めている代表的なブランドを、系統別にご紹介します。\n\n1. 憧れの海外ハイブランド（世界5大ジュエラーなど）\n\n「誰もが知るステータスや、特別感のあるボックスに憧れる」という方におすすめです。\n\nTiffany & Co.（ティファニー）   \nマイベスト\n\n特徴: 婚約指輪の代名詞ともいえる「ティファニー・セッティング」（6本爪でダイヤモンドを高く掲げるデザイン）を考案したブランド。タイムレスで洗練された美しさは、世代を超えて愛され続けています。あのアイコニックな「ブルーボックス」も大きな魅力です。   \nみんなのウェディング\n\nCartier（カルティエ）   \nマイベスト\n\n特徴: 王室御用達の格式高いフランスのジュエラー。代表作「1895 ソリテール」など、気品と重厚感のあるデザインが揃っています。手元を彩る情熱的な赤いケースも人気の理由です。   \nみんなのウェディング\n他 1 件\n\nHARRY WINSTON（ハリー・ウィンストン）   \nチャームスジュエリー\n\n特徴: 「キング・オブ・ダイヤモンド」と称される最高峰のハイブランド。極上の大粒ダイヤモンドと、それを引き立てる繊細で贅沢なセッティング技術が特徴で、ハリウッドスターやセレブリティにも愛されています。   \nみんなのウェディング\n\n2. 品質・ダイヤモンドにこだわるブランド\n\n「せっかくなら、ダイヤの輝きや品質に妥協したくない」という方におすすめの世界三大ダイヤモンドブランドなどです。\n\nLAZARE DIAMOND（ラザール ダイヤモンド）   \nWedding Park\n\n特徴: 虹色の強い輝きを引き出すカッティング技術に優れた、ニューヨーク発のブランド。ダイヤモンドの美しさを最優先に考えたい方にぴったりです。   \nみんなのウェディング\n\nROYAL ASSCHER（ロイヤル・アッシャー）   \nチャームスジュエリー\n\n特徴: 英国王室御用達としても知られる、オランダ発の老舗。白く上品で気品のある輝き（ロイヤル・アッシャー・カット）が特徴です。   \nみんなのウェディング\n\n3. 日本人の手に馴染む品質と手厚いサポートの国内ブランド\n\n「日本人の指を美しく魅せる繊細なデザイン」や「アフターサービスの充実度」を重視したい場合に最適です。\n\n銀座ダイヤモンドシライシ   \nみんなのウェディング\n\n特徴: 日本初のブライダルジュエリー専門店。品質の高いダイヤモンドを適正価格で提供しており、豊富なデザインからセミオーダーを楽しめます。全国に店舗が多く、メンテナンスも安心です。   \nみんなのウェディング\n他 1 件\n\nI-PRIMO（アイプリモ）   \n株式会社マイナビ\n\n特徴: 専門店のきめ細やかなカウンセリングと、豊富なデザイン数が魅力。指輪一つひとつに星座や神話にちなんだストーリーが込められており、手の特徴に合わせて似合うリングを提案してくれます。   \nWedding Park\n\n俄（NIWAKA）\n\n特徴: 京都で誕生した、日本の美しい情景や和の趣を表現するブランド。洗練された立体的なデザインと、リングに込められた「情景」の美しさが、多くのこだわり派のカップルに支持されています。   \nみんなのウェディング\n\nK.UNO（ケイウノ）   \nみんなのウェディング\n\n特徴: 国内最大級のオーダーメイドブランド。熟練のデザイナーが在籍しており、既製品にはないアレンジや完全フルオーダー、ディズニーなどのライセンスデザインも手掛けています。   \nみんなのウェディング\n\n💡 選び方のヒント\n\nパートナーの好みをリサーチする: 普段よくつけているアクセサリーの色（プラチナ、ゴールドなど）や、ブランドの好みをそれとなしにリサーチしておくと安心です。\n\nサプライズか、二人で選ぶか: 最近は「プロポーズ用の仮リング（ダイヤモンドだけを先に選ぶ）」を用意する男性も増えています。相手の好みのデザインやサイズがわからない場合は、こうしたサービスを活用するのもおすすめです。\n\n結婚指輪との重ねづけ: 結婚後も日常的に重ねづけするシーンを想定し、セットリング（相性が良くデザインされているもの）を視野に入れて選ぶのも人気です。\n\n気になったブランドがあれば、まずは公式サイトやカタログを見たり、実際に店頭で試着したりして、雰囲気や着け心地を確かめてみてくださいね。", "stores": [], "sources": [{"label": "マイベスト", "url": "https://my-best.com/22762", "domain": "my-best.com", "kind": "メディア"}, {"label": "みんなのウェディング、みんなのウェディング", "url": "https://www.mwed.jp/articles/10762/", "domain": "mwed.jp", "kind": "メディア"}, {"label": "チャームスジュエリー", "url": "https://charms.jp/column260204/", "domain": "charms.jp", "kind": "未分類"}, {"label": "Wedding Park", "ur ドの一真堂(いっしんどう)\n\n3. CITIZEN（シチズン）のブライダルコレクション\n\n時計メーカーとして有名なCITIZENですが、高品質なブライダルリングも手掛けており、ディズニーの世界観を表現したコレクションを展開しています。\n\n特徴: 『ファンタジア』や『シンデレラ』、『蒸気船ウィリー』など、期間限定モデルや物語性のあるシリーズが豊富です。   \nハウツーマリー\n\n魅力: リングの内側にキャラクターのイラストや、物語にちなんだ「お守り石（ブルートパーズやサファイアなど）」が秘められていることが多いです。ガラスの靴やオルゴールボックスといった、専用の豪華なノベルティやケースがついてくるのも人気の理由です。   \n長野県 結婚指輪・婚約指輪・ダイヤモンドの一真堂(いっしんどう)\n\n4. Princess Bijou（プリンセスビジュー）   \nハウツーマリー\n\n物語のヒロインたちをテーマにした、花嫁のためのブライダルジュエリーブランドです。\n\n特徴: 『白雪姫』『リトル・マーメイド（アリエル）』『美女と野獣（ベル）』『眠れる森の美女』『アラジン（ジャスミン）』などをモチーフにした洗練されたリングが揃っています。   \n長野県 結婚指輪・婚約指輪・ダイヤモンドの一真堂(いっしんどう)\n他 1 件\n\n魅力: 各プリンセスのイメージカラーや象徴的なモチーフ（バラ、泡、魔法のランプなど）がデザインに美しく落とし込まれており、大人っぽいおしゃれな世界観が楽しめます。   \n長野県 結婚指輪・婚約指輪・ダイヤモンドの一真堂(いっしんどう)\n他 1 件\n\n選び方のヒント   \n新潟の婚約指輪・結婚指輪｜一真堂(いっしんどう)\n\n「隠れディズニー」で上品にいきたいなら： 4℃ BridalやCITIZENなどの、パッと見はシンプルで美しい王道デザイン。\n\nとことんこだわりたい・好きな作品があるなら： K.UNOの豊富なキャラクターラインナップやオーダーメイド。\n\nプリンセスの世界観に浸りたいなら： Princess Bijouや、各プリンセスを専門にフィーチャーした限定コレクション（シンデレラやラプンツェルなど）。\n\nまた、多くのディズニーコレクションでは、「専用のオリジナルリングケース」や「オルゴールボックス」「ガラスの靴のリングピロー」といった、プロポーズや記念に残る豪華な特典・ノベルティが用意されているのも大きな魅力です。パートナーの好きな作品やキャラクターに合わせて選んでみてくださいね。", "stores": [], "sources": [{"label": "長野県 結婚指輪・婚約指輪・ダイヤモンドの一真堂(いっしんどう)、新潟の婚約指輪・結婚指輪｜一真堂(いっしんどう)", "url": "https://1sd-bridal-nagano.jp/blog/?p=34116", "domain": "1sd-bridal-nagano.jp", "kind": "販売店"}, {"label": "ハウツーマリー、ハウツーマリー", "url": "https://how-to-inc.com/disney-engagement-ring-19559", "domain": "how-to-inc.com", "kind": "メディア"}, {"label": "新潟の婚約指輪・結婚指輪｜一真堂(いっしんどう)", "url": "https://1sd-niigata.jp/niigatablog/recommend/post-17217/", "domain": "1sd-niigata.jp", "kind": "販売店"}], "cards": [], "reason": "1. K.UNO（ケイ・ウノ）\nハウツーマリー\n日本最大級のオーダーメイドブランドでありながら、公式のディズニーデザインジュエリーを多数展開していることで非常に有名なブランドです。\n特徴: 定番のミッキー＆ミニーモチーフから、ディズニープリンセス（シンデレラ、美女と野獣、白雪姫など）、『くまのプーさん』『ファンタジア』など幅広い作品のリングが揃っています。\nとことんこだわりたい・好きな作品があるなら： K.UNOの豊富なキャラクターラインナップやオーダーメイド。\nプリンセスの世界観に浸りたいなら： Princess Bijouや、各プリンセスを専門にフィーチャーした限定コレクション（シンデレラやラプンツェルなど）。\nまた、多くのディズニーコレクションでは、「専用のオリジナルリングケース」や「オルゴールボックス」「ガラスの靴のリングピロー」といった、プロポーズや記 モンドシライシ"], "image": "", "batch": "2026-09-28", "feat_hits": []}, {"q": 9, "platform": "gemini_nologin", "round": 2, "run_at": "2026-09-28T10:37:31+07:00", "model": "Gemini 3.5 Flash-Lite", "region": "東京（VPN）", "login": "なし", "appeared": 0, "rank": null, "brands": ["銀座ダイヤモンドシライシ", "アイプリモ", "BRILLIANCE+"], "text": "相手のサイズや好みが分からない状態でのサプライズプロポーズは不安が大きいですよね。しかし、「プロポーズ専用の仮リング」を用意してくれるサービスや、「あとからデザインやサイズを変更できるプラン」を用意しているブランドを選べば、失敗を大きく防げます。\n\nサプライズを成功させやすい、おすすめのブランドと仕組みをご紹介します。\n\n1. 銀座ダイヤモンドシライシ   \nハピハピリング\n\nおすすめの理由: 業界に先駆けて「スマイルプロポーズリング」という画期的なサービスを導入したブランドです。\n\n仕組み: 一旦、本物のダイヤモンドだけを選んで購入し、専用の簡易リング枠（シルバー製等）に留めてプロポーズできます。プロポーズ成功後、二人で店舗へ行き、彼女の好きなデザインやぴったりのサイズを選んで作り直すことができます（枠の代金はダイヤモンド代金に含まれるか、返金されるシステム）。   \nハピハピリング\n\n公式サイト: 銀座ダイヤモンドシライシ\n\n2. アイプリモ（I-PRIMO）\n\nおすすめの理由: ブライダルジュエリー専門店の大手で、サポートの手厚さに定評があります。\n\n仕組み: 「パーフェクトプロポーズリング」というサービスがあり、選んだダイヤモンドを一度プロポーズ用の専用枠にセットして贈ることができます。後日、彼女の好みのデザイン（リングやネックレス）への変更やサイズ調整が可能です。好みが全く分からなくても、彼女の「本当に欲しい」を叶えられます。   \nハピハピリング\n\n公式サイト: アイプリモ\n\n3. BRILLIANCE+（ブリリアンス+）\n\nおすすめの理由: オンラインと実店舗を展開する、自由度の高いジュエリーブランドです。\n\n仕組み: サプライズ専用の「diamain（ダイヤメイン）」プロポーズプランや、仮のリングにダイヤモンドを留めて贈るプランがあります。また、購入後のサイズ直しが永久無料（※条件あり）なのも、サイズ変動の不安を減らせる大きなメリットです。\n\n公式サイト: ブリリアンスプラス\n\nサプライズを成功させるためのヒント\n\n「プロポーズ専用リング」を活用する: 最初から本番用のデザイン・サイズで作ってしまうと、サイズ直しができてもデザインが好みでなかった場合に気まずくなってしまいます。上記のような「ダイヤモンドだけ選んで、あとからデザインを選べるプラン」が一番安全です。   \nハピハピリング\n\nそれとなくリサーチできそうなら: もし可能であれば、彼女が普段つけているファッションリングのサイズを目元や他の指との比較で把握したり、友人経由で好みのブランドを聞き出したりするのも一つの手です。\n\nどのブランドも親身に相談に乗ってくれるので、まずは公式サイトや店舗で「サプライズでサイズも好みも分からない」と相談してみてはいかがでしょうか？", "stores": [], "sources": [{"label": "ハピハピリング", "url": "https://www.hapihapiring.jp/feature_contents/3095", "domain": "hapihapiring.jp", "kind": "メディア"}], "cards": [], "reason": "", "match": "0 ＝ 登場せず", "competitors": ["銀座ダイヤモンドシライシ", "アイプリモ", "BRILLIANCE+"], "image": "", "batch": "2026-09-28", "feat_hits": []}, {"q": 10, "platform": "gemini_nologin", "round": 2, "run_at": "2026-09-28T10:41:00+07:00", "model": "Gemini 3.5 Flash-Lite", "region": "東京（VPN）", "login": "なし", "appeared": 1, "rank": 2, "brands": ["SORA", "ケイウノ", "鎌倉彫金工房", "Hamri"], "text": "二人で婚約指輪（または結婚指輪）を選ぶ際、好みが異なると「どちらかが妥協しなくてはいけないのかな…」と心配になりますよね。しかし、お互いの好みを尊重しながら、形や素材、コンセプトで上手に調和させたり、一から一緒に作り上げたりできるブランドはたくさんあります。\n\n以下に、好みが違っても相談しながら理想の形にできる、おすすめのアプローチと代表的なブランドをご紹介します。\n\n1. カスタマイズ・セミオーダーの自由度が高いブランド\n\nベースのデザインに、石の種類や留め方、表面の加工（マットや鏡面など）をそれぞれ選べるブランドであれば、お互いの好みを反映しつつ「統一感」を持たせることができます。\n\nSORA（ソラ）   \nビジュピコ\n\n特徴: 発色の美しいカラーチタンやジルコニウム、希少な貴金属を扱い、色やフォルム、表面加工を自由自在にオーダーできるブランドです。\n\nおすすめの理由: 「シンプルなプラチナが良い」人と「個性的な色味やデザインが良い」人それぞれの希望を、素材や形の組み合わせで綺麗に調和させることができます。\n\nK.uno（ケイ・ウノ）\n\n特徴: 日本最大級のオーダーメイドブランド。専属のデザイナーが二人の想いや好みをヒアリングし、その場でデザイン画を描いてくれます。\n\nおすすめの理由: 「それぞれの好みが全く違う」というカップルに最適です。例えば、共通のデザインモチーフを使いつつ、片方はシンプルに、片方は華やかにするなど、二人で一つのストーリーを持たせた指輪を形にできます。\n\n2. 「手作り（DIY）」で一緒にカタチにする工房\n\n職人のサポートを受けながら、自分たちで指輪の原型を作ったり、実際に制作したりできる工房です。\n\n鎌倉彫金工房 / 各地のオーダー・手作り工房\n\n特徴: 一つのアトリエで、素材（プラチナ、ゴールド各種）や表面のテクスチャー（つちめ加工、鏡面、マットなど）をそれぞれが選んで制作できます。\n\nおすすめの理由: 「形やデザインは違っても、二人で同じ空間で一緒に作った思い出」そのものが指輪に宿ります。また、素材の色味を合わせたり、内側に同じ石や刻印を入れたりすることで、デザインが異なっていても自然な「ペア感」が生まれます。\n\n3. 多様なデザインから「同じ世界観」で選べるセレクトショップ\n\nそもそもお揃いのデザインにする必要はなく、「同じブランドの世界観」の中でそれぞれが気に入ったものを選ぶのも素敵な方法です。\n\nBIJOUPIKO（ビジュピコ）などのブライダルセレクトショップ\n\n特徴: 国内外の多様なブランドを数多く取り扱っているため、一つの店舗の中でテイストの異なる指輪を同時に比較できます。\n\nおすすめの理由: 「婚約指輪は華やかなものがいい」「普段使いしやすい控えめなものがいい」といったお互いの希望を伝えながら、プロのスタッフに重ねづけのバランスや相性の良い組み合わせを相談できます。\n\n好みが違う二人が指輪を形にするためのヒント\n\n素材や色味を揃える: デザインや形状が違っても、プラチナや特定のゴールドの色味を合わせるだけで、並べたときに統一感が出ます。   \nHamri ハムリ\n\n内側に共通のこだわりを入れる: お互いの誕生石を埋め込んだり、同じフォントで記念日やイニシャルを刻印したりすることで、見えないお揃い感を楽しめます。   \n鎌倉彫金工房\n\nまずは、気になるブランドのショップや手作り工房の「無料相談」に行き、お互いの希望を素直に伝えてプロの意見を聞いてみるのがおすすめですよ。   \n鎌倉彫金工房\n\nお二人の好みに寄り添いながら、楽しく指輪選びを進めるために、「今現在、お二人の間でそれぞれ具体的に気になっているデザインや、意見が分かれているポイント」などはありますか？ もしよろしければ教えてくださいね。", "stores": [], "sources": [{"label": "ビジュピコ", "url": "https://bijoupiko.com/bridalnote/archives/9109/", "domain": "bijoupiko.com", "kind": "販売店"}, {"label": "Hamri ハムリ", "url": "https://hamri.jp/column/columncat/marriage/4475", "domain": "hamri.jp" エクセルコ", "アイプリモ", "ケイウノ"], "text": "相手の好みが分からないまま婚約指輪を選ぶのは、本当に悩ましいですよね。しかし、「サプライズで完璧なものを渡さなきゃ」と抱え込まず、一緒に相談しながら選べる仕組みやブランドを選ぶ男性はとても増えています。\n\nプロポーズの時はダイヤモンドだけを先に購入して、デザインは後から二人で選べるプランを用意しているブランドや、親身に相談に乗ってくれるおすすめのブランドをご紹介します。\n\n1. 「ダイヤモンドでプロポーズ」ができるブランド   \nRingraph - ウエディングパーク\n\n相手の好みが分からなくても、まずは「輝くダイヤモンド（ルース）」だけを先に購入してプロポーズし、後から彼女と一緒に店舗へ行って好みのデザインに仕立ててもらえる人気のシステムです。\n\n銀座ダイヤモンドシライシ   \nみんなのウェディング\n\n特徴: 「スマイルプロポーズリング」という人気プランがあります。仮枠のリングにダイヤモンドを留めてプロポーズし、後日二人で店頭に行って彼女の好きなデザイン（婚約指輪または普段使いしやすいリングなど）に作り直すことができます。   \n長野県 結婚指輪・婚約指輪・ダイヤモンドの一真堂(いっしんどう)\n\nおすすめ理由: 経験豊富なスタッフが「彼女の普段の服装や雰囲気に合うのはどれか」を親身になって一緒に考えてくれます。   \nみんなのウェディング\n\nEXELCO DIAMOND（エクセルコ ダイヤモンド）   \nウェディングニュース\n\n特徴: ダイヤモンド専門店ならではの「ローズボックス（バラのケース）」やプロポーズ用リングを使ったプランがあります。   \n長野県 結婚指輪・婚約指輪・ダイヤモンドの一真堂(いっしんどう)\n他 1 件\n\nおすすめ理由: 高品質なダイヤモンド選びをプロがマンツーマンでサポートしてくれ、後からのデザイン変更もスムーズに行えます。\n\n2. 丁寧なカウンセリングと豊富な選択肢があるブランド\n\n二人で一緒にショップへ行き、専任のスタッフと相談しながら「似合うデザイン」を導き出せるブランドです。\n\nI-PRIMO（アイプリモ）\n\n特徴: 日本全国に店舗を展開するブライダルリング専門店。数多くのデザインを取り扱っているだけでなく、独自の「パーソナルハンド診断」を行っています。\n\nおすすめ理由: 手の特徴や肌の色などから、その人に本当に似合う指輪の傾向を理論的に診断してくれるため、好みが分からなくても「これが似合うんだ！」と納得しながら楽しく選べます。\n\nK.UNO（ケイ・ウノ）\n\n特徴: 日本最大級のオーダーメイドブランドです。店頭には常駐のデザイナーがおり、会話の中にある何気ない好みや好みのニュアンスをその場でサッとデザイン画にしてくれます。\n\nおすすめ理由: 「既製品だとどれもしっくりこないかも…」という場合でも、二人で相談しながらゼロから形にできるため、世界に一つの特別な指輪を楽しく作ることができます。\n\n3. 多彩なブランドを比較できる「セレクトショップ」   \nRingraph - ウエディングパーク\n\n特定のブランドに絞るよりも、一度にたくさんのブランドを見比べたい場合におすすめなのがブライダルリングのセレクトショップです。\n\nBIJOUPIKO（ビジュピコ） など   \nウェディングニュース\n\n特徴: 国内外の数十〜百以上のブランドを取り扱う大型セレクトショップ。   \n長野県 結婚指輪・婚約指輪・ダイヤモンドの一真堂(いっしんどう)\n\nおすすめ理由: 一つの店舗でテイストの異なるさまざまな指輪を見比べられるため、「彼女が可愛い系とシンプル系のどちらが好きか分からない」という段階でも、実物を見ながら好みの方向性を探ることができます。   \nRingraph - ウエディングパーク\n\n💡 相談しやすくするためのアドバイス\n\nお店に行く前に、彼女の普段の持ち物（シルバー系とゴールド系どちらのアクセサリーが多いか）、洋服のテイスト、仕事柄指輪を普段使いできるかなどをスマートフォンにメモしておくと、スタッフにより具体的な提案をしてもらえます。\n\nもし「サプライズでどうしても指輪の箱パカをしたい」というご希望がなければ、最初から「一緒に選びに行こう」と伝えてデートを兼ねてお店に行くのも、今の時代とても自然で喜ばれる選択肢ですよ。\n\n彼女とどのようなプロポーズにしたいか、あるいはサプライズの演出について、もう少しご希望があればぜひ教えてくださいね。", "stores": [], "sources": [{"label のウェディング\n\n特徴: 日本最大級の店舗数を誇るブランド。豊富なデザインから選ぶことができます。   \n結婚指輪のすべて\n他 1 件\n\nアフターサービス: 永久保証として、クリーニングや歪み直しなどを無期限で対応。サイズ直しも対応しており（※サイズ交換は初回無料などの規定あり）、全国のネットワークで手軽にメンテナンスに出せます。   \nみんなのウェディング\n他 1 件\n\n2. 自社工房を持ち、柔軟な対応ができるブランド\n\nケイウノ (K.UNO)   \nみんなのウェディング\n\n特徴: 日本発のオーダーメイドブランド。全国の店舗に専門の職人（クラフトマン）が常駐しているのが大きな強みです。   \n結婚指輪のすべて\n\nアフターサービス: 自社工房で一貫して対応するため、一般的なサイズ直しだけでなく、デザインの変更や万が一のトラブルにも柔軟に対応してくれます。生涯にわたる保証やメンテナンスが受けられます。   \nRingraph(リングラフ) - ウエディングパーク\n他 1 件\n\n杢目金屋（もくめがねや）   \nみんなのウェディング\n\n特徴: 江戸時代からの伝統技法「木目金（もくめがね）」を用いた、唯一無二の美しい木目模様が特徴のブランド。   \n結婚指輪のすべて\n\nアフターサービス: 専属の職人が「カルテ」に基づいて生涯保証（サイズ直し、修理、磨き直しなど）を無料で対応してくれます。日本の伝統技術をしっかりと永年引き継いでいける体制があります。   \nみんなのウェディング\n\n3. 一流のクオリティと信頼感がある老舗・海外ハイブランド\n\nティファニーやカルティエ、ハリー・ウィンストンといった世界的なハイブランドでも、クリーニングや基本的なメンテナンス（サイズ直しや修理）は有料・または条件付きで受け付けています。\n\nメリット: ブランド自体の歴史や信頼性が非常に高く、ブランドが消滅するリスクが極めて低いため、何十年先も安心して店舗に持ち込むことができます。また、資産価値としての側面も高いです。\n\n注意点: 国内ブランドの「永久・無料」の保証に比べると、サイズ直しや修理が「有料」であったり、デザインや構造（全周にダイヤモンドが入ったフルエタニティなど）によっては「そもそもサイズ直し不可（お預かりして作り直し＝買い替えに近い費用がかかる場合がある）」といった制限が厳しめな傾向があります。\n\n💡 長く使い続けるために選ぶときの「3つのチェックポイント」\n\n「サイズ直し」の仕様と制限を確認する\n\n指のデザイン（裏側までダイヤが入っているデザインなど）や素材（硬いプラチナ、加工が特殊なものなど）によっては、構造上「サイズ直しができない（または数号しか変えられない）」ものがあります。将来のサイズ変化を見据え、「プレーンなストレートデザイン」や「サイズ直しがしやすい作り」のものを選ぶと安心です。\n\n「全国展開しているか」「ブランドが長く続きそうか」\n\n引っ越しや転勤、ライフスタイルの変化があった際、近くに店舗がないとメンテナンスに出しづらくなります。全国に店舗があるブランドや、オンラインでの受付体制が整っているブランドは便利です。   \nみんなのウェディング\n\n保証が「無料」か「有料」か、内容の範囲を確かめる\n\n「サイズ直しは初回のみ無料、2回目以降は有料」「クリーニングは一生無料だが、石の紛失保証は別」など、ブランドによって規約が細かく異なります。購入前に必ず「どのようなメンテナンスが、どこまで無料・または有料になるのか」を確認しておきましょう。\n\nもし具体的なデザインの好み（シンプルが良い、華やかな方が好きなど）や、ご予算のイメージなどがあれば、さらに絞り込んでご提案することも可能です。   \n結婚指輪のすべて", "stores": [], "sources": [{"label": "みんなのウェディング、Ringraph(リングラフ) - ウエディングパーク", "url": "https://www.mwed.jp/articles/13903/", "domain": "mwed.jp", "kind": "メディア"}, {"label": "結婚指輪のすべて、結婚指輪のすべて", "url": "https://www.all-marriagering.com/how-to-choose/after-service.html", "domain": "all-marriagering.com", "kind": "メディア"}, {"label": "Ringraph(リングラフ) - ウエディングパーク、銀座ダイヤモン     // 見出しは2段：上＝AIの名前（2列ぶん）、数字の意味は数字の真上の行に書く（A〜C＝登場率・平均順位／D＝合致率）

    t2.append(tb2); tw2.append(t2); p2.append(tw2);
    // 種類ごとの内訳
    //   A〜C：質問（仮説テーマ）ごとの登場率
    //   D　 ：打ち出したい特徴ごとに、答えの中で説明された割合（答え全体がケイウノの説明なので、答え全体で数える）
    function breakdown(k) {

  /* ---------- ページ：推移（伸びているかが一目で分かればよい） ---------- */
  function pageTrend() {
    const w = el("div");
    const rows = ALL.filter((a) => inRound(a) && inLayer(a));
    const valAt = (p, bt) => { const c = counted(rows.filter((a) => a.platform === p.id && a.batch === bt)); return c.length ? pct(c.filter((a) => a.appeared).length, c.length) : null; };
    const inTR = (bt) => bt >= state.trange.from && bt <= state.trange.to;
    // AIごとに「期間の最後の計測日」と「その前の計測日からの変化」
    const cards = el("div", "cards cards4");
    plats().forEach((p) => {
      const all = BATCHES.map((bt) => ({ bt, v: valAt(p, bt) })).filter((o) => o.v != null);
      const pts = all.filter((o) => inTR(o.bt));
      const last = pts[pts.length - 1], prev = pts[pts.length - 2];
      const k = el("div", `kpi ${pc(p.id)}`);
      const hd = el("p", "lab"); hd.append(aiMark(p.id), document.createTextNode(p.label)); k.append(hd);
      const v = el("p", "val", last ? String(last.v) : "—"); if (last) v.append(el("small", null, "%")); k.append(v);
      let cap = "この期間は計測なし", cls = "";
      if (last && !prev) cap = all[0].bt === last.bt ? `${fmtBatch(last.bt)} が初回` : `期間内の計測は${fmtBatch(last.bt)}だけ`;
      if (last && prev) { const d2 = last.v - prev.v; cls = d2 > 0 ? "up" : d2 < 0 ? "down" : ""; cap = `${d2 > 0 ? "▲" : d2 < 0 ? "▼" : "±"} ${d2 > 0 ? "+" : ""}${d2 === 0 ? "0" : d2}pt（${fmtBatch(prev.bt)} ${prev.v}% → ${fmtBatch(last.bt)}）`; }
      k.append(el("p", `cap delta ${cls}`, cap)); cards.append(k);
    });
    w.append(cards);
    // 登場率の推移：自社と競合を1枚に。ブランドの札で線を出す／消す。AI を1つ選ぶとそのAIだけ、「すべて」は測ったAIの平均
    const BR = (D.tracked || [SUBJ]).filter(Boolean);
    const on = new Set(state.brand === "all" || !BR.includes(state.brand) ? BR : [state.brand]);
    const panel = el("div", "panel"); panel.style.marginTop = "12px";
    const one = state.ai !== "all" ? P.find((p) => p.id === state.ai) : null;
    // ブランドを1つだけ選び、AIが「すべて」のときは、AIごとの線にする（平均の1本だと、AIによる違いが見えないため）
    const onBrands = BR.filter((b) => on.has(b));
    const perAI = !one && onBrands.length === 1;
    const h2 = el("h2"); h2.append(el("span", null, perAI ? `登場率の推移（${onBrands[0]}・AIごと）` : `登場率の推移（${one ? (onBrands.length === 1 ? `${onBrands[0]}・${one.label}` : one.label) : "測ったAIの平均"}）`)); panel.append(h2);
    const box = el("div"); panel.append(box); w.append(panel);
    const dates = BATCHES.filter(inTR);
    const aiRate = (pid, bt, b) => { const c = counted(rows.filter((a) => a.platform === pid && a.batch === bt)); return c.length ? (100 * c.filter((a) => (a.brands || []).includes(b)).length) / c.length : null; };
    const rateAt = (bt, b) => {
      const ids = one ? [one.id] : plats().map((p) => p.id);
      const vs = ids.map((id) => aiRate(id, bt, b)).filter((v) => v != null);
      return vs.length ? Math.round(vs.reduce((s3, v) => s3 + v, 0) / vs.length) : null;
    };
    // 「すべて」のとき、測ったAIが増えた日に区切り線を引く（平均の中身が変わるため）
    const marks = [];
    if (!one && !perAI) { let prev = null; dates.forEach((bt, j) => { const set = plats().filter((p) => aiRate(p.id, bt, SUBJ) != null).map((p) => p.label); if (prev && set.length > prev.length) marks.push({ j, text: `+${set.filter((x) => !prev.includes(x)).join("・")}` }); prev = set; }); }
    let lastW = -1;
    const draw = (anim = true) => {
      lastW = box.clientWidth;
      const series = perAI
        ? plats().map((p) => ({ name: p.label, color: `var(--${pc(p.id)})`, pts: dates.map((bt) => { const v = aiRate(p.id, bt, onBrands[0]); return v == null ? null : Math.round(v); }) })).filter((sr) => sr.pts.some((v) => v != null))
        : onBrands.map((b) => ({ name: b, me: b === SUBJ, color: brandColor(b), strong: b === SUBJ, pts: dates.map((bt) => rateAt(bt, b)) }));
      miniLines(box, dates, series, one ? `var(--${pc(one.id)})` : "#0f1a2e", { height: 300, marks, label: perAI ? `${onBrands[0]}のAIごとの推移` : "自社と競合の推移", animate: anim });

    const rd = el("div", `seg rd ${pc(pid)}`); rd.style.setProperty("--n", ROUNDS.length);
    ROUNDS.forEach((rr) => { const x = A.get(`${q.no}|${pid}|${rr}`); const b = el("button", "sb"); b.type = "button"; const ln = el("span", "line");
      if (q.counted) ln.append(el("i", "d" + (x && x.appeared ? " on" : ""))); ln.append(document.createTextNode(`${rr}回目`));
      b.append(ln, el("small", null, !x ? "未取得" : !q.counted ? "回答あり" : x.appeared ? `登場・${x.rank}番目` : "登場せず")); b.setAttribute("aria-pressed", String(rr === r));
      if (!x) b.disabled = true; else b.addEventListener("click", () => { location.hash = `#/prompts/${qid}/${pid}/${rr}`; }); rd.append(b); });
    w.append(ai, rd);
    if (!a) { w.append(nodata("この回の回答はありません。", "empty")); return w; }
    if (q.counted) { const bn = el("div", `banner ${pc(pid)}` + (a.appeared ? "" : " off")); bn.append(el("i", "d" + (a.appeared ? " on" : "")), document.createTextNode(a.appeared ? `${SUBJ}が登場しました（${a.rank}番目）` : `${SUBJ}は登場しませんでした`)); w.append(bn); }
    const meta = el("p", "meta"); [`${fmt(a.run_at)}（日本時間）`, a.model === "不明" ? "モデル名表示なし" : a.model, a.region, a.login ? `ログイン${a.login}` : ""].filter(Boolean).forEach((t) => meta.append(el("span", null, t))); w.append(meta);

    const det = el("div", "det");
    const left = el("div"); const ah = el("div", "ahead"); ah.append(el("h2", null, "AIの回答（原文）"));
    const box = el("div", "answer"); let count = 0;
    for (const part of a.text.split(/(\*\*[^*\n]+\*\*)/)) { const bold = /^\*\*[^*\n]+\*\*$/.test(part); const target = bold ? el("b") : box; const s = bold ? part.slice(2, -2) : part; let last = 0, m; SUBJ_RE.lastIndex = 0;
      while ((m = SUBJ_RE.exec(s))) { if (m.index > last) target.append(s.slice(last, m.index)); target.append(el("mark", null, m[0])); count++; last = m.index + m[0].length; if (!m[0].length) SUBJ_RE.lastIndex++; }
      target.append(s.slice(last)); if (bold) box.append(target); }
    if (count) { const f = el("button", "find", `${SUBJ}の出てくる所へ（${count}か所）`); f.type = "button"; let k = 0; f.addEventListener("click", () => { const ms = box.querySelectorAll("mark"); const t = ms[k % ms.length]; k++; t.scrollIntoView({ behavior: "smooth", block: "center" }); t.classList.remove("flash"); void t.offsetWidth; t.classList.add("flash"); }); ah.append(f); }
    left.append(ah, box);
    const right = el("div", "aside");
    const pn = (title, body) => { const p = el("div", "panel"); p.append(el("h2", null, title), body); return p; };
    const rec = el("dl", "rec");
    [["仮説との一致", a.match], ["推薦順位", a.rank ? `${a.rank}番目` : "—"], ["選定理由・説明", a.reason || "—"], ["競合", a.competitors.join(" / ") || "—"], ...(a.image ? [["イメージ要約", a.image]] : [])]
      .forEach(([k, v]) => rec.append(el("dt", null, k), el("dd", null, v)));
    right.append(pn("記録（シートと同じ項目）", rec));
    if (a.brands.length) { const c = el("div", "chips"); a.brands.forEach((b) => c.append(el("span", "chip" + (b === SUBJ ? " me" : ""), b))); right.append(pn("回答に出たブランド（出た順）", c)); }
    const ul = el("ul", "list");
    if (a.sources.length) a.sources.forEach((s) => { const li = el("li"); li.append(el("span", "kind", s.kind), document.createTextNode(" "));
      if (s.url && /^https?:\/\//.test(s.url)) { const l = el("a", null, s.label); l.href = s.url; l.target = "_blank"; l.rel = "noopener noreferrer"; li.append(l, el("span", "u", s.url)); } else li.append(el("b", null, s.label), el("span", "u", s.domain)); ul.append(li); });
    right.append(pn(`引用元URL（${a.sources.length}件）`, a.sources.length ? ul : el("p", "empty", "出典の表示はありませんでした。")));
    if (a.stores && a.stores.length) { const u2 = el("ul", "list"); a.stores.forEach((x) => u2.append(el("li", null, x))); right.append(pn(`回答の上に出た店舗カード（${a.stores.length}件）`, u2)); }
    if (a.cards.length) { const u3 = el("ul", "list"); a.cards.forEach((x) => u3.append(el("li", null, x))); right.append(pn(`商品カード（${a.cards.length}件）`, u3)); }
    det.append(left, right); w.append(det);
    return w;
  }

  /* ---------- 画面の切り替え ---------- */
  function route() {
    closeFilter();
    const parts = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/");
    let page = parts[0] || "overview", body;
    if (page === "responses") page = "prompts";   // 旧「回答ログ」は質問一覧に統合
    // 旧URL（#B1/chatgpt/1）も開けるようにする
    if (qById.has(page)) { parts.unshift("prompts"); page = "prompts"; }
    const pageEl = document.getElementById("page");
    if (page === "prompts" && parts[1] && qById.has(parts[1]) && P.some((p) => p.id === parts[2])) { body = pageDetail(parts[1], parts[2], Number(parts[3]) || 1); page = "prompts"; }
    else {
      if (!["prompts", "trend"].includes(page)) page = "overview";
      if (page === "trend" && state.layer === "D") state.layer = "all";   // 推移に D は出さない
      body = ({ prompts: pagePrompts, trend: pageTrend, overview: pageOverview }[page])();
    }
    closeCalendar(); renderNav(page);
    pageEl.replaceChildren(body);
    window.scrollTo(0, 0);
  }
  document.getElementById("projName").textContent = SUBJ;
  document.title = `LLMO ダッシュボード｜${SUBJ}`;
  window.addEventListener("hashchange", route);
  route();
})();
</script>
