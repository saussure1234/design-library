<!doctype html><meta charset="utf-8">
<style>
body{margin:0;background:#fff;font-family:system-ui;display:flex;gap:30px;padding:30px}
figure{margin:0;text-align:center}
.box{width:200px;height:200px;background:#F8F8F8;border:1px solid #eee}
figcaption{font-size:12px;color:#555;margin-top:6px}
</style>
<figure><div class="box" id="a"></div><figcaption>dot-green</figcaption></figure>
<figure><div class="box" id="b"></div><figcaption>dot-yellow</figcaption></figure>
<figure><div class="box" id="c"></div><figcaption>check</figcaption></figure>
<script src="./vendor/lottie_light.min.js"></script>
<script>
window.__anims=[];
[["a","dot-green"],["b","dot-yellow"],["c","check"]].forEach(([id,n])=>{
  const an=lottie.loadAnimation({container:document.getElementById(id),renderer:'svg',
    loop:true,autoplay:true,path:'./lottie/'+n+'.json'});
  window.__anims.push(an);
});
</script>
