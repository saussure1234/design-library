<!doctype html><meta charset="utf-8">
<style>
body{margin:0;background:#fff;font-family:system-ui;display:grid;
  grid-template-columns:repeat(3,1fr);gap:0;width:1200px}
figure{margin:0;text-align:center;padding:6px}
.box{width:100%;aspect-ratio:1;background:#F8F8F8;border:1px solid #eee}
figcaption{font-size:12px;color:#333;margin-top:4px}
</style>
<div id="wrap" style="display:contents"></div>
<script src="./vendor/lottie_light.min.js"></script>
<script>
const N=["happy-students","kids-home","gold-medal","story","letters","drawing"];
window.__a=[];
N.forEach(n=>{
  const f=document.createElement('figure');
  f.innerHTML='<div class="box" id="b_'+n+'"></div><figcaption>'+n+'</figcaption>';
  document.getElementById('wrap').appendChild(f);
  window.__a.push(lottie.loadAnimation({container:f.querySelector('.box'),renderer:'svg',
    loop:true,autoplay:true,path:'./lottie/lf/'+n+'.json'}));
});
</script>
