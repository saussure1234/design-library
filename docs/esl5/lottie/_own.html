<!doctype html><meta charset="utf-8">
<style>body{margin:0;background:#fff;font-family:system-ui;display:grid;
grid-template-columns:repeat(5,1fr);width:1000px}
figure{margin:0;text-align:center;padding:6px}
.box{width:100%;aspect-ratio:1;background:#FAFAFA;border:1px solid #EEE}
figcaption{font-size:11px;color:#333;margin-top:4px}</style>
<div id="w" style="display:contents"></div>
<script src="../vendor/lottie_light.min.js"></script>
<script>
const N=["blob-green", "blob-yellow", "bubble-green", "bubble-white", "dot-green2", "plane-green", "plane-yellow", "ring-green", "star-yellow", "underline-yellow"]; window.__a=[];
N.forEach(n=>{const f=document.createElement('figure');
 f.innerHTML='<div class="box"></div><figcaption>'+n+'</figcaption>';
 document.getElementById('w').appendChild(f);
 window.__a.push(lottie.loadAnimation({container:f.querySelector('.box'),renderer:'svg',
  loop:true,autoplay:true,path:'./own/'+n+'.json'}));});
window.__at=f=>window.__a.forEach(a=>{a.pause();a.goToAndStop(Math.floor(a.totalFrames*f),true);});
</script>
