<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ESL 実績の案</title>
<style>
:root{--bg:#F4F6F4;--ink:#1F2A22;--sub:#5B675F;--line:#D5DDD7;--ac:#00A01C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--ink:#E8EEE9;--sub:#A3B0A7;--line:#2E3631}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.bar h1{font-size:15px;margin:0 8px 0 0}
.g{display:flex;flex-wrap:wrap;gap:6px}
.g button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.g button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{padding:8px 16px;margin:0;font-size:14px;color:var(--sub);min-height:2.6em}
.note b{color:var(--ink)}
.frame{position:relative;margin:0 16px 16px;height:calc(100% - 150px);min-height:520px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff}
.frame iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0}
@media (max-width:820px){.frame{height:75vh}}
</style>
</head>
<body>
<div class="bar">
  <h1>ESL clubの実績　見せ方の案</h1>
  <div class="g" id="vs"></div>
  <div class="g"><button type="button" data-w="390" aria-pressed="true">スマホ</button><button type="button" data-w="1440" aria-pressed="false">PC</button></div>
</div>
<p class="note" id="note"></p>
<div class="frame"><iframe id="F" title="実績の案"></iframe></div>
<script>
var V = [
  ["a", "A 今の案", "<b>A　今の案：</b>はじまり → 期間 → 結果を縦に並べた一覧。「くわしく」で本人の紹介文とコメント"],
  ["b", "B 公式の図", "<b>B　公式の図をそのまま主役に：</b>公式トップの各カードにある「白い丸 → 黄色い矢印 → 緑の丸」をコードで描き直し、いちばん上に。文字は公式の図と同じ"],
  ["c", "C 級のはしご", "<b>C　級のはしご：</b>3人が「どの級から・どの級まで」上がったかを、1枚の目盛りにそろえて比べる。差がひと目で分かる"],
  ["d", "D 誌面", "<b>D　誌面：</b>1人（杉江さん）を大きな写真と見出しで主役に、残り2人を横に小さく。本人のコメントも載せる"],
  ["e", "E 本人の声", "<b>E　本人の声が主役：</b>公式トップにある本人のコメントを吹き出しで大きく。その下に「はじまり → 結果」の札"]
];
var F = document.getElementById("F"), W = 390, cur = "a";
function fit(){ var box = F.parentNode, s = Math.min(1, box.clientWidth / W);
  F.style.width = W + "px"; F.style.height = (box.clientHeight / s) + "px"; F.style.left = Math.max(0, (box.clientWidth - W * s) / 2) + "px"; F.style.transform = "scale(" + s + ")"; }
function show(){ F.src = "index.html?case=" + cur + "#case";
  F.onload = function(){ fit(); try { var w = F.contentWindow; w.document.documentElement.style.scrollBehavior = "auto";
    setTimeout(function(){ var el = w.document.getElementById("case"); if (el) w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY - (W < 768 ? 70 : 90)); }, 500); } catch(e){} }; }
var vs = document.getElementById("vs"), note = document.getElementById("note");
V.forEach(function(v){ var b = document.createElement("button"); b.type = "button"; b.textContent = v[1]; b.setAttribute("aria-pressed", v[0] === cur ? "true" : "false");
  b.onclick = function(){ cur = v[0]; [].forEach.call(vs.children, function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); }); note.innerHTML = v[2]; show(); };
  vs.appendChild(b); });
note.innerHTML = V[0][2];
[].forEach.call(document.querySelectorAll("[data-w]"), function(b){ b.onclick = function(){
  [].forEach.call(document.querySelectorAll("[data-w]"), function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
  W = +b.getAttribute("data-w"); fit(); show(); }; });
addEventListener("resize", fit); fit(); show();
</script>
</body>
</html>
