function cls(c){if(!c||c==="none"||c.indexOf("url")===0) return null;c=c.toUpperCase();var f=function(a){return a.some(function(x){return x.toUpperCase()===c})};if(f(EN))return"en";if(f(NV))return"nv";if(f(SK))return"sk";if(f(WH))return"wh";return null}
var MAP={
 D:{nv:"#FFFFFF",sk:"#8FD6EE",wh:"#2E5585",en:"#FF8FA9"},
 E:{nv:"#6E8EB3",sk:"#BFE0EE",wh:"#FFFFFF",en:"#E58FA9"},
 F:{nv:"#2E2E2E",sk:"#BDBDBD",wh:"#FFFFFF",en:"#A50031"}
};
document.querySelectorAll("section").forEach(function(sec){
  var t=sec.className.slice(1); if(t==="A") return;
  sec.querySelectorAll(".art *").forEach(function(e){
    var f=e.getAttribute("fill"), s=e.getAttribute("stroke"), cf=cls(f), cs=cls(s);
    if(e.tagName==="ellipse"&&f&&f.indexOf("url")===0){ if(t==="B"||t==="C"||t==="D") e.setAttribute("display","none"); return; }
    if(MAP[t]){ if(cf) e.setAttribute("fill",MAP[t][cf]); if(cs) e.setAttribute("stroke",MAP[t][cs]); return; }
    if(t==="B"||t==="C"){
      var line=(cf==="en")?"#A50031":"#1F3A5F";
      if(cf){ e.setAttribute("fill", cf==="en"?(t==="C"?"#A50031":"#fff"):(t==="C"?(cf==="wh"?"#FFFFFF":"#DCEEF6"):"#fff")); e.setAttribute("stroke",line); e.setAttribute("stroke-width", (e.getAttribute("height")&&+e.getAttribute("height")<6)?"0":"2.2"); if(e.getAttribute("height")&&+e.getAttribute("height")<6){e.setAttribute("fill",cf==="en"?"#A50031":"#9FB4C6");} }
      if(cs){ e.setAttribute("stroke", cs==="en"?"#A50031":"#1F3A5F"); }
    }
  });
});
</script></body></html>
