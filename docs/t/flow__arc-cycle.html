<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>/* =========================================================
   トークン契約 v1
   すべてのパーツは「ここに定義された変数だけ」を使う。
   案件ごとに :root を差し替えれば、全パーツが即座に着替える。
   ここに無い色・サイズをパーツ内で直書きしたら契約違反。
   ========================================================= */
:root{
  /* --- 色 --- */
  --c-primary:#00B220;      /* 主色（CTA・強調） */
  --c-primary-d:#05A81F;    /* 主色の押下/hover */
  --c-primary-l:#E8F7EA;    /* 主色の淡色（面） */
  --c-accent:#FF9301;       /* 差し色（1箇所だけ効かせる） */
  --c-ink:#111111;          /* 見出し */
  --c-ink2:#333333;         /* 本文 */
  --c-ink3:#707070;         /* 補足・注記 */
  /* 地は「階段」にする。セクションごとに必ず1段動かす。
     同じ明るさが続くと面が消える（＝最頻の指摘「薄すぎて見えない」の正体） */
  --c-bg:#FFFFFF;           /* base   L255  カード・面 */
  --c-bg2:#F0F3F0;          /* tint   L241  1段落とす */
  --c-bg3:#E4F1E8;          /* accent L238  主色寄りの淡色 */
  --c-dark:#0E3113;         /* dark   L39   句読点。1ページに2回まで */
  --c-on-dark:#FFFFFF;      /* dark の上の文字（14.3:1） */
  --c-line:#E3E3E3;         /* 罫 */
  --c-on-primary:#FFFFFF;   /* 主色の上に乗る文字 */

  /* --- 書体 --- */
  --f-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-disp:var(--f-sans);   /* 見出し用に別書体を当てる場合はここだけ変える */
  --f-num:"Helvetica Neue",Arial,var(--f-sans);

  /* --- 文字サイズ（PC基準・clampはパーツ側で組む） --- */
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px;
  --fs-lg:21px;   --fs-xl:28px; --fs-2xl:38px;  --fs-3xl:50px; --fs-4xl:64px;
  --lh-tight:1.35; --lh-head:1.5; --lh-body:1.9;

  /* --- 余白 --- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --s6:36px; --s7:52px; --s8:76px; --s9:110px;
  --sec-y:clamp(56px,7vw,110px);   /* セクションの上下 */

  /* --- 形 --- */
  --r-s:6px; --r-m:12px; --r-l:24px; --r-pill:999px;
  --shadow:0 6px 24px rgba(14,49,19,.10), 0 1px 2px rgba(14,49,19,.06);
  --shadow-lg:0 12px 32px rgba(14,49,19,.16);

  /* --- 動き --- */
  --e:cubic-bezier(.23,1,.32,1);
  --d:.5s;

  /* --- 版面 --- */
  --w-max:1120px;
  --w-gut:clamp(18px,4vw,32px);
}

/* =========================================================
   基盤 v1  — リセット + 版面 + スクロール表示
   IntersectionObserver も GSAP も使わない（scroll位置 + class）
   JSが死んでも .fx-on が付かず、中身は最初から見えている
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--f-sans);color:var(--c-ink2);background:var(--c-bg);
  line-height:var(--lh-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
:where(a,button,input,textarea,select):focus-visible{
  outline:3px solid var(--c-primary);outline-offset:3px;border-radius:var(--r-s)}

/* 版面 */
.wrap{width:100%;max-width:var(--w-max);margin-inline:auto;padding-inline:var(--w-gut)}
.sec{padding-block:var(--sec-y)}
.sec--alt{background:var(--c-bg2)}
/* 地の階段。kit の tone で切り替える */
.tone-base{background:var(--c-bg)}
.tone-tint{background:var(--c-bg2)}
.tone-accent{background:var(--c-bg3)}
.tone-dark{background:var(--c-dark);color:#D9E3DB}
.tone-dark .h-lead,.tone-dark h2,.tone-dark h3{color:var(--c-on-dark)}
.tone-dark .h-eyebrow{color:#8FD6A0}
/* 面は必ず地から浮かせる。白の上の白は最頻の指摘 */
.card,.panel,[class*="__card"],[class*="__panel"]{box-shadow:var(--shadow)}
.nb{white-space:nowrap}          /* 日本語の改行制御。必ず <wbr> と併用 */

/* 見出しの型（案件をまたいで共通の骨） */
.h-eyebrow{display:flex;align-items:center;gap:var(--s3);
  font-size:var(--fs-sm);font-weight:700;color:var(--c-primary);letter-spacing:.08em}
.h-eyebrow::before{content:"";width:28px;height:2px;background:currentColor;flex:none}
.h-lead{font-family:var(--f-disp);font-weight:900;color:var(--c-ink);
  font-size:clamp(24px,3.4vw,var(--fs-2xl));line-height:var(--lh-head);letter-spacing:.01em}
.h-sub{margin-top:var(--s4);font-size:var(--fs-base);color:var(--c-ink3)}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s3);
  background:var(--c-primary);color:var(--c-on-primary);font-weight:700;font-size:var(--fs-md);
  padding:18px 34px;border-radius:var(--r-s);border:0;cursor:pointer;
  transition:background .16s var(--e),transform .16s var(--e)}
.btn:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.btn:hover{background:var(--c-primary-d)}}
.btn--ghost{background:transparent;color:var(--c-primary);box-shadow:inset 0 0 0 2px currentColor}
.btn--accent{background:var(--c-accent)}

/* ── スクロール表示 ───────────────────────────────
   .fx を付けた要素が、画面に入ったら .hh-in が付いて現れる。
   親（body）に .fx-on が無い間は「最初から見えている」＝失敗しても安全。
   data-fx で出方を指定：fadeup / fadeblur / left / right / scale / clip / mask
   data-d で遅延（ms）を指定：<div class="fx" data-fx="left" data-d="120">
   ─────────────────────────────────────────────── */
.fx-on .fx{opacity:0;will-change:opacity,transform,filter,clip-path;
  transition:opacity var(--d) var(--e),transform var(--d) var(--e),
             filter var(--d) var(--e),clip-path var(--d) var(--e)}
.fx-on .fx[data-fx="fadeup"],
.fx-on .fx:not([data-fx]){transform:translateY(26px)}
.fx-on .fx[data-fx="fadeblur"]{filter:blur(10px);transform:translateY(14px)}
.fx-on .fx[data-fx="left"]{transform:translateX(-44px)}
.fx-on .fx[data-fx="right"]{transform:translateX(44px)}
.fx-on .fx[data-fx="scale"]{transform:scale(.94)}
.fx-on .fx[data-fx="clip"]{clip-path:inset(0 100% 0 0)}
.fx-on .fx[data-fx="mask"]{clip-path:inset(100% 0 0 0)}
.fx-on .fx.hh-in{opacity:1;transform:none;filter:none;clip-path:inset(0 0 0 0)}

/* 常時動くもの（うるさくならない程度に） */
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.floaty{animation:floaty 4.5s var(--e) infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fx-on .fx{opacity:1!important;transform:none!important;filter:none!important;clip-path:none!important;transition:none!important}
  .floaty{animation:none}
  *{animation-duration:.001s!important}
}

body{padding:0;margin:0;background:var(--c-bg)}</style></head>
<body><style>
/* トークンのフォールバック。:where() で詰めているので、
   _tokens.css が読み込まれていればそちらが必ず勝つ。 */
:where(:root){
  --c-primary:#00B220; --c-primary-d:#05A81F; --c-primary-l:#E8F7EA; --c-accent:#FF9301;
  --c-ink:#111111; --c-ink2:#333333; --c-ink3:#707070;
  --c-bg:#FFFFFF; --c-bg2:#F7F8F7; --c-line:#E3E3E3; --c-on-primary:#FFFFFF;
  --f-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-disp:var(--f-sans); --f-num:"Helvetica Neue",Arial,var(--f-sans);
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px;
  --fs-lg:21px; --fs-xl:28px; --fs-2xl:38px;
  --lh-tight:1.35; --lh-head:1.5; --lh-body:1.9;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px; --s7:52px; --s8:76px;
  --sec-y:clamp(56px,7vw,110px);
  --r-s:6px; --r-m:12px; --r-l:24px; --r-pill:999px;
  --w-max:1120px; --w-gut:clamp(18px,4vw,32px);
}

.tq-arc-cycle{font-family:var(--f-sans); color:var(--c-ink2); background:var(--c-bg); padding-block:var(--s7)}
.tq-arc-cycle *{box-sizing:border-box}
.tq-arc-cycle__wrap{max-width:var(--w-max); margin-inline:auto; padding-inline:var(--w-gut)}
.tq-arc-cycle__grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--s7); align-items:center}
.tq-arc-cycle__blk{margin:0}
.tq-arc-cycle__tag{
  display:inline-block; margin:0 0 var(--s5);
  font-size:var(--fs-note); letter-spacing:.08em; line-height:1;
  padding:var(--s2) var(--s3); border-radius:var(--r-pill);
  background:var(--c-bg2); color:var(--c-ink3);
}
.tq-arc-cycle__tag--on{background:var(--c-primary-l); color:var(--c-primary-d)}
.tq-arc-cycle__cap{margin:var(--s5) 0 0; font-size:var(--fs-sm); line-height:var(--lh-body); color:var(--c-ink3)}

/* ============ 普通：横一列＋同じ直線矢印 ============ */
.tq-arc-cycle__row{display:flex; align-items:center; justify-content:center; gap:var(--s2)}
.tq-arc-cycle__box{
  flex:1 1 0; min-width:0; text-align:center;
  border:1px solid var(--c-line); border-radius:var(--r-m);
  padding:var(--s3) var(--s2); background:var(--c-bg);
}
.tq-arc-cycle__box img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:var(--r-s); display:block}
.tq-arc-cycle__box span{display:block; margin-top:var(--s2); font-size:var(--fs-sm); font-weight:700; color:var(--c-ink)}
.tq-arc-cycle__str{position:relative; flex:0 0 26px; height:3px; background:var(--c-ink3)}
.tq-arc-cycle__str::after{
  content:""; position:absolute; right:-12px; top:-7px;
  border:8px solid transparent; border-left-color:var(--c-ink3);
}

/* ============ この工夫：正三角に円を置き、外周を回る弧で結ぶ ============ */
.tq-arc-cycle__cycle{position:relative; aspect-ratio:1; max-width:420px; margin-inline:auto}
.tq-arc-cycle__cycle>svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1}

.tq-arc-cycle__node{
  position:absolute; width:36%; aspect-ratio:1; border-radius:50%; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:var(--s2); padding:var(--s2); text-align:center;
}
.tq-arc-cycle__node img{width:60%; aspect-ratio:1; object-fit:cover; border-radius:50%; display:block}
.tq-arc-cycle__node span{font-size:var(--fs-sm); font-weight:700; color:var(--c-ink); line-height:var(--lh-tight)}
/* 円の中心を正三角形（半径31.5%）に置く */
.tq-arc-cycle__node--1{left:32%;    top:.5%;   background:color-mix(in srgb, var(--c-primary) 20%, var(--c-bg))}
.tq-arc-cycle__node--2{left:59.25%; top:47.75%; background:color-mix(in srgb, var(--c-accent) 24%, var(--c-bg))}
.tq-arc-cycle__node--3{left:4.75%;  top:47.75%; background:color-mix(in srgb, var(--c-ink3) 20%, var(--c-bg))}

.tq-arc-cycle__core{
  position:absolute; left:50%; top:50%; translate:-50% -50%;
  width:26%; aspect-ratio:1; border-radius:50%; z-index:3;
  background:color-mix(in srgb, var(--c-accent) 45%, var(--c-bg));
  display:grid; place-items:center; text-align:center; padding:var(--s2);
  font-size:var(--fs-note); font-weight:700; color:var(--c-ink); line-height:var(--lh-tight);
}

/* 区間ごとに線を描き分ける。矢羽は小さく、円に触れない位置で終わる */
.tq-arc-cycle__arc{fill:none; stroke-width:2; stroke-dasharray:7 7}
.tq-arc-cycle__arc--1{stroke:var(--c-primary)}
.tq-arc-cycle__arc--2{stroke:var(--c-accent)}
.tq-arc-cycle__arc--3{stroke:var(--c-ink3)}
.tq-arc-cycle__ah--1{fill:none; stroke:var(--c-primary); stroke-width:1.5}
.tq-arc-cycle__ah--2{fill:none; stroke:var(--c-accent);  stroke-width:1.5}
.tq-arc-cycle__ah--3{fill:none; stroke:var(--c-ink3);    stroke-width:1.5}

@media (max-width:768px){
  .tq-arc-cycle__grid{grid-template-columns:1fr; gap:var(--s7)}
}
</style>

<section class="tq-arc-cycle">
  <div class="tq-arc-cycle__wrap">
    <div class="tq-arc-cycle__grid">

      <figure class="tq-arc-cycle__blk">
        <p class="tq-arc-cycle__tag">普通の場合</p>
        <div class="tq-arc-cycle__row">
          <div class="tq-arc-cycle__box"><img src="../demo/ph_a.jpg" alt=""><span>要素A</span></div>
          <span class="tq-arc-cycle__str"></span>
          <div class="tq-arc-cycle__box"><img src="../demo/ph_b.jpg" alt=""><span>要素B</span></div>
          <span class="tq-arc-cycle__str"></span>
          <div class="tq-arc-cycle__box"><img src="../demo/ph_a.jpg" alt=""><span>要素C</span></div>
        </div>
        <figcaption class="tq-arc-cycle__cap">横一列＋同じ直線矢印1種類。左から右へ進んで終わる図に見え、CからAへ戻ることが伝わらない。</figcaption>
      </figure>

      <figure class="tq-arc-cycle__blk">
        <p class="tq-arc-cycle__tag tq-arc-cycle__tag--on">この工夫</p>
        <div class="tq-arc-cycle__cycle">
          <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <marker id="tqArcAh1" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
                <path class="tq-arc-cycle__ah--1" d="M0 0 L8 4 L0 8"/>
              </marker>
              <marker id="tqArcAh2" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
                <path class="tq-arc-cycle__ah--2" d="M0 0 L8 4 L0 8"/>
              </marker>
              <marker id="tqArcAh3" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
                <path class="tq-arc-cycle__ah--3" d="M0 0 L8 4 L0 8"/>
              </marker>
            </defs>
            <!-- 弧の半径175 ＝ 円配置半径126 の約1.4倍。円の外側だけを通る -->
            <path class="tq-arc-cycle__arc tq-arc-cycle__arc--1" d="M323.7,76.3 A175 175 0 0 1 369,154.7" marker-end="url(#tqArcAh1)"/>
            <path class="tq-arc-cycle__arc tq-arc-cycle__arc--2" d="M245.3,369 A175 175 0 0 1 154.7,369" marker-end="url(#tqArcAh2)"/>
            <path class="tq-arc-cycle__arc tq-arc-cycle__arc--3" d="M31,154.7 A175 175 0 0 1 76.3,76.3" marker-end="url(#tqArcAh3)"/>
          </svg>

          <div class="tq-arc-cycle__node tq-arc-cycle__node--1">
            <img src="../demo/ph_a.jpg" alt=""><span>要素A</span>
          </div>
          <div class="tq-arc-cycle__node tq-arc-cycle__node--2">
            <img src="../demo/ph_b.jpg" alt=""><span>要素B</span>
          </div>
          <div class="tq-arc-cycle__node tq-arc-cycle__node--3">
            <img src="../demo/ph_a.jpg" alt=""><span>要素C</span>
          </div>
          <p class="tq-arc-cycle__core">総括の<br>ラベル</p>
        </div>
        <figcaption class="tq-arc-cycle__cap">円の外側を回る弧なので、図を横切らずに順路だけが残る。区間ごとに線色を変え、矢羽は円に触れない位置で終わる。中心の円が3つを1つの名前にまとめる。</figcaption>
      </figure>

    </div>
  </div>
</section>
</body></html>
