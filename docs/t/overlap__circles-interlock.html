<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>/* =========================================================
   トークン契約 v1
   すべてのパーツは「ここに定義された変数だけ」を使う。
   案件ごとに :root を差し替えれば、全パーツが即座に着替える。
   ここに無い色・サイズをパーツ内で直書きしたら契約違反。
   ========================================================= */
:root{
  /* --- 色 --- */
  --c-primary:#00B220;      /* 主色（CTA・強調） */
  --c-primary-d:#05A81F;    /* 主色の押下/hover */
  --c-primary-l:#E8F7EA;    /* 主色の淡色（面） */
  --c-accent:#FF9301;       /* 差し色（1箇所だけ効かせる） */
  --c-ink:#111111;          /* 見出し */
  --c-ink2:#333333;         /* 本文 */
  --c-ink3:#707070;         /* 補足・注記 */
  /* 地は「階段」にする。セクションごとに必ず1段動かす。
     同じ明るさが続くと面が消える（＝最頻の指摘「薄すぎて見えない」の正体） */
  --c-bg:#FFFFFF;           /* base   L255  カード・面 */
  --c-bg2:#F0F3F0;          /* tint   L241  1段落とす */
  --c-bg3:#E4F1E8;          /* accent L238  主色寄りの淡色 */
  --c-dark:#0E3113;         /* dark   L39   句読点。1ページに2回まで */
  --c-on-dark:#FFFFFF;      /* dark の上の文字（14.3:1） */
  --c-line:#E3E3E3;         /* 罫 */
  --c-on-primary:#FFFFFF;   /* 主色の上に乗る文字 */

  /* --- 書体 --- */
  --f-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-disp:var(--f-sans);   /* 見出し用に別書体を当てる場合はここだけ変える */
  --f-num:"Helvetica Neue",Arial,var(--f-sans);

  /* --- 文字サイズ（PC基準・clampはパーツ側で組む） --- */
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px;
  --fs-lg:21px;   --fs-xl:28px; --fs-2xl:38px;  --fs-3xl:50px; --fs-4xl:64px;
  --lh-tight:1.35; --lh-head:1.5; --lh-body:1.9;

  /* --- 余白 --- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --s6:36px; --s7:52px; --s8:76px; --s9:110px;
  /* 余白は3値に固定する。検算で「24箇所に21通り」が出たため */
  --sp-sec:clamp(88px,10vw,160px);   /* セクション間 */
  --sp-blk:clamp(56px,6vw,104px);    /* セクション内のブロック間 */
  --sp-el:clamp(36px,4vw,64px);      /* 要素間 */
  --sec-y:var(--sp-sec);

  /* --- 形 --- */
  --r-s:6px; --r-m:12px; --r-l:24px; --r-pill:999px;
  --shadow:0 6px 24px rgba(14,49,19,.10), 0 1px 2px rgba(14,49,19,.06);
  --shadow-lg:0 12px 32px rgba(14,49,19,.16);

  /* --- 動き --- */
  --e:cubic-bezier(.23,1,.32,1);
  --d:.5s;

  /* --- 版面 --- */
  --w-max:1120px;
  --w-gut:clamp(18px,4vw,32px);
}

/* =========================================================
   基盤 v1  — リセット + 版面 + スクロール表示
   IntersectionObserver も GSAP も使わない（scroll位置 + class）
   JSが死んでも .fx-on が付かず、中身は最初から見えている
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--f-sans);color:var(--c-ink2);background:var(--c-bg);
  line-height:var(--lh-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
:where(a,button,input,textarea,select):focus-visible{
  outline:3px solid var(--c-primary);outline-offset:3px;border-radius:var(--r-s)}

/* 版面 */
.wrap{width:100%;max-width:var(--w-max);margin-inline:auto;padding-inline:var(--w-gut)}
.sec{padding-block:var(--sec-y)}
.sec--alt{background:var(--c-bg2)}
/* 地の階段。kit の tone で切り替える */
.tone-base{background:var(--c-bg)}
.tone-tint{background:var(--c-bg2)}
.tone-accent{background:var(--c-bg3)}
.tone-dark{background:var(--c-dark);color:#D9E3DB}
.tone-dark .h-lead,.tone-dark h2,.tone-dark h3{color:var(--c-on-dark)}
.tone-dark .h-eyebrow{color:#8FD6A0}
/* 面は必ず地から浮かせる。白の上の白は最頻の指摘 */
.card,.panel,[class*="__card"],[class*="__panel"]{box-shadow:var(--shadow)}
.nb{white-space:nowrap}          /* 日本語の改行制御。必ず <wbr> と併用 */

/* ── セクション見出し：1系統に統一する ──────────────
   type/two-tier-latin-jp  欧文ラベルと和文を2段に組み、
   級数・太さ・色の主従をわざと逆転させる（欧文は極小・和文が主）。
   検算で「見出しの様式が8系統」と出たため、全セクションこれに揃える。 */
.sec-head{margin-bottom:var(--sp-el)}
.sec-head__en{display:flex;align-items:center;gap:var(--s3);
  font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--c-primary);
  text-transform:uppercase;margin-bottom:var(--s3)}
.sec-head__en::before{content:"";width:24px;height:2px;background:currentColor;flex:none}
.sec-head__ja{font-family:var(--f-disp);font-weight:900;color:var(--c-ink);
  font-size:clamp(23px,3.2vw,34px);line-height:1.42;letter-spacing:.01em}
.sec-head__sub{margin-top:var(--s4);font-size:var(--fs-base);color:var(--c-ink3);max-width:44em}
.tone-dark .sec-head__en{color:#8FD6A0}
.tone-dark .sec-head__ja{color:var(--c-on-dark)}

/* 見出しの型（案件をまたいで共通の骨） */
.h-eyebrow{display:flex;align-items:center;gap:var(--s3);
  font-size:var(--fs-sm);font-weight:700;color:var(--c-primary);letter-spacing:.08em}
.h-eyebrow::before{content:"";width:28px;height:2px;background:currentColor;flex:none}
.h-lead{font-family:var(--f-disp);font-weight:900;color:var(--c-ink);
  font-size:clamp(24px,3.4vw,var(--fs-2xl));line-height:var(--lh-head);letter-spacing:.01em}
.h-sub{margin-top:var(--s4);font-size:var(--fs-base);color:var(--c-ink3)}

/* ボタン */
/* CTAは1形だけ。ピル＋右端に白丸の矢印。
   検算で「10個・6種類の形」が出たため、形の差で主従を作るのをやめ、
   大きさだけで主従をつける（.btn--sm が従）。 */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--s3);
  background:var(--c-primary);color:var(--c-on-primary);font-weight:700;font-size:var(--fs-md);
  height:72px;padding:0 76px 0 40px;border-radius:var(--r-pill);border:0;cursor:pointer;
  transition:background .16s var(--e),transform .16s var(--e)}
.btn::after{content:"";position:absolute;right:20px;top:50%;width:32px;height:32px;margin-top:-16px;
  border-radius:50%;background:var(--c-on-primary);
  -webkit-mask:no-repeat center/11px 11px url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 1l5 5-5 5' fill='none' stroke='%23000' stroke-width='2'/></svg>");
  mask:no-repeat center/11px 11px url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 1l5 5-5 5' fill='none' stroke='%23000' stroke-width='2'/></svg>")}
.btn--sm{height:48px;padding:0 24px;font-size:var(--fs-sm)}
.btn--sm::after{display:none}
.btn:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.btn:hover{background:var(--c-primary-d)}}
.btn--ghost{background:transparent;color:var(--c-primary);box-shadow:inset 0 0 0 2px currentColor}
.btn--accent{background:var(--c-accent)}

/* ── スクロール表示 ───────────────────────────────
   .fx を付けた要素が、画面に入ったら .hh-in が付いて現れる。
   親（body）に .fx-on が無い間は「最初から見えている」＝失敗しても安全。
   data-fx で出方を指定：fadeup / fadeblur / left / right / scale / clip / mask
   data-d で遅延（ms）を指定：<div class="fx" data-fx="left" data-d="120">
   ─────────────────────────────────────────────── */
.fx-on .fx{opacity:0;will-change:opacity,transform,filter,clip-path;
  transition:opacity var(--d) var(--e),transform var(--d) var(--e),
             filter var(--d) var(--e),clip-path var(--d) var(--e)}
.fx-on .fx[data-fx="fadeup"],
.fx-on .fx:not([data-fx]){transform:translateY(26px)}
.fx-on .fx[data-fx="fadeblur"]{filter:blur(10px);transform:translateY(14px)}
.fx-on .fx[data-fx="left"]{transform:translateX(-44px)}
.fx-on .fx[data-fx="right"]{transform:translateX(44px)}
.fx-on .fx[data-fx="scale"]{transform:scale(.94)}
.fx-on .fx[data-fx="clip"]{clip-path:inset(0 100% 0 0)}
.fx-on .fx[data-fx="mask"]{clip-path:inset(100% 0 0 0)}
.fx-on .fx.hh-in{opacity:1;transform:none;filter:none;clip-path:inset(0 0 0 0)}

/* 常時動くもの（うるさくならない程度に） */
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.floaty{animation:floaty 4.5s var(--e) infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fx-on .fx{opacity:1!important;transform:none!important;filter:none!important;clip-path:none!important;transition:none!important}
  .floaty{animation:none}
  *{animation-duration:.001s!important}
}

body{padding:0;margin:0;background:var(--c-bg)}</style></head>
<body><style>
/* ==========================================================
   overlap/circles-interlock — 円どうしを食い込ませ、欠けさせて噛み合わせる
   :where(:root) はトークン未読込時のフォールバック（優先度0）。
   ========================================================== */
:where(:root){
  --c-primary:#00B220; --c-primary-d:#05A81F; --c-primary-l:#E8F7EA; --c-accent:#FF9301;
  --c-ink:#111111; --c-ink2:#333333; --c-ink3:#707070;
  --c-bg:#FFFFFF; --c-bg2:#F7F8F7; --c-line:#E3E3E3; --c-on-primary:#FFFFFF;
  --f-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-num:"Helvetica Neue",Arial,var(--f-sans);
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px; --fs-lg:21px; --fs-xl:28px;
  --lh-tight:1.35; --lh-head:1.5; --lh-body:1.9;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px; --s7:52px;
  --r-s:6px; --r-m:12px; --r-l:24px; --r-pill:999px;
  --shadow:0 6px 24px rgba(17,17,17,.08);
  --w-max:1120px; --w-gut:clamp(18px,4vw,32px);
}

.tq-cil{
  font-family:var(--f-sans); color:var(--c-ink2); background:var(--c-bg);
  max-width:var(--w-max); margin:0 auto; padding:var(--s6) var(--w-gut);
}
.tq-cil, .tq-cil *{ box-sizing:border-box; }
.tq-cil :where(p,figure,figcaption){ margin:0; }
.tq-cil__h{ font-size:var(--fs-md); font-weight:700; color:var(--c-ink); line-height:var(--lh-tight); margin:0 0 var(--s2); }
.tq-cil__lead{ font-size:var(--fs-sm); line-height:var(--lh-body); color:var(--c-ink3); margin:0 0 var(--s5); }
.tq-cil__row{ display:grid; gap:var(--s5); grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); }
.tq-cil__cap{ font-size:var(--fs-note); line-height:var(--lh-head); color:var(--c-ink3); margin:var(--s3) 0 0; }
.tq-cil__cap b{ display:block; color:var(--c-ink); font-size:var(--fs-sm); margin-bottom:2px; }

.tq-cil__stage{
  position:relative; height:330px; box-sizing:border-box; overflow:visible;
  background:var(--c-bg2); border:1px solid var(--c-line); border-radius:var(--r-m);
  display:grid; place-items:center; padding:var(--s4);
}

/* --- A｜普通：等間隔に並べ、線でつなぐ --- */
.tq-cil__even{ position:relative; display:flex; gap:36px; align-items:center; }
.tq-cil__even::before{
  content:""; position:absolute; z-index:0; left:0; right:0; top:50%;
  height:1px; background:var(--c-line);
}
.tq-cil__even span{
  position:relative; z-index:1; width:84px; height:84px; border-radius:50%;
  background:var(--c-primary-l); border:3px solid var(--c-primary);
  display:grid; place-content:center; text-align:center;
  font-size:var(--fs-note); color:var(--c-ink); line-height:var(--lh-tight);
}

/* --- B｜2円を噛み合わせる（写真の円＋時計の円） --- */
.tq-cil__pair{ position:relative; width:200px; height:120px; }
.tq-cil__photo{
  position:absolute; z-index:2; right:0; top:0;
  width:112px; height:112px; object-fit:cover; display:block; box-sizing:border-box;
  border-radius:50%; border:4px solid var(--c-primary);
}
.tq-cil__clock{
  position:absolute; z-index:1; right:82px; top:24px;   /* 直径の約27%を食い込ませる */
  width:92px; height:92px; box-sizing:border-box;
  border-radius:50%; border:4px solid var(--c-primary);
  background:conic-gradient(from 180deg, var(--c-accent) 0 25%, var(--c-bg) 0);
}
.tq-cil__clock b{
  position:absolute; left:50%; bottom:-11px; transform:translateX(-50%);
  background:var(--c-primary); color:var(--c-on-primary);
  font-size:var(--fs-note); font-weight:700; line-height:1;
  padding:4px 10px; border-radius:var(--r-pill); white-space:nowrap;
}

/* --- C｜中心の円を“まとめ”にして周りへ食い込ませる --- */
.tq-cil__tri{ position:relative; width:300px; height:280px; }
.tq-cil__tri > *{
  position:absolute; width:110px; height:110px; border-radius:50%;
  display:grid; place-content:center; text-align:center;
  font-size:var(--fs-note); line-height:var(--lh-tight); padding:var(--s2); box-sizing:border-box;
}
.tq-cil__n1{ left:95px;  top:3px;   background:var(--c-primary-l); color:var(--c-ink); }
.tq-cil__n2{ left:31px;  top:145px; background:var(--c-primary);   color:var(--c-on-primary); }
.tq-cil__n3{ left:159px; top:145px; background:var(--c-ink2);      color:var(--c-on-primary); }
.tq-cil__hub{
  left:95px; top:88px; z-index:2;                       /* まとめ役を常に上 */
  background:var(--c-accent); color:var(--c-ink); font-weight:700;
}

/* --- D｜リングに埋め、欠けの向きを中心方向に揃える --- */
.tq-cil__ring{
  position:relative; width:240px; height:240px; border-radius:50%;
  background:var(--c-primary-l);
}
.tq-cil__dot{
  position:absolute; z-index:1; left:50%; top:50%; width:60px; height:60px;
  margin:-30px 0 0 -30px; border-radius:50%; background:var(--c-primary);
}
.tq-cil__dot--a{ transform:rotate(0deg)   translateY(-84px); }
.tq-cil__dot--b{ transform:rotate(130deg) translateY(-84px); }
.tq-cil__dot--c{ transform:rotate(230deg) translateY(-84px); }
.tq-cil__hole{
  position:absolute; z-index:2; inset:52px; border-radius:50%;   /* この円盤が3つの円を弧で食う */
  background:var(--c-bg);
  display:grid; place-content:center; text-align:center;
  font-size:var(--fs-sm); font-weight:700; color:var(--c-ink); line-height:var(--lh-tight);
}
/* 文字は欠けていない外側の帯に置く（半径95px相当） */
.tq-cil__lbl{
  position:absolute; z-index:3; width:60px; text-align:center;
  font-size:10px; color:var(--c-on-primary); line-height:1.3;
}
.tq-cil__lbl--a{ left:90px;  top:12px;  }
.tq-cil__lbl--b{ left:163px; top:168px; }
.tq-cil__lbl--c{ left:17px;  top:168px; }

@media (max-width:420px){
  .tq-cil__stage{ height:300px; }
  .tq-cil__even{ gap:14px; }
  .tq-cil__even span{ width:74px; height:74px; }
  .tq-cil__tri{ transform:scale(.92); }
}
</style>

<div class="tq-cil">

  <p class="tq-cil__h">円は並べない。食い込ませて噛み合わせる</p>
  <p class="tq-cil__lead">
    左上は等間隔＋線でつないだ普通の関係図。残り3つは円どうしを直径の20〜30%だけ食い込ませ、
    重なった側を隠している。線を1本も引いていないのに「まとめ」「所属」「同時に起きる」の関係が読める。
  </p>

  <div class="tq-cil__row">

    <figure>
      <div class="tq-cil__stage">
        <div class="tq-cil__even">
          <span>項目<br>01</span>
          <span>項目<br>02</span>
          <span>項目<br>03</span>
        </div>
      </div>
      <p class="tq-cil__cap"><b>普通</b>円は等間隔に並べ、線でつないで関係を示す。線を読まないと関係が分からず、3つは別々のものに見える。</p>
    </figure>

    <figure>
      <div class="tq-cil__stage">
        <div class="tq-cil__pair">
          <img class="tq-cil__photo" src="../demo/ph_a.jpg" alt="">
          <div class="tq-cil__clock"><b>00分</b></div>
        </div>
      </div>
      <p class="tq-cil__cap"><b>この工夫｜2円を噛ませる</b>時計の円を写真の円へ30px食い込ませ、重なった右側は写真の下に隠す。「この場面＝この時間」が線なしで1かたまりになる。</p>
    </figure>

    <figure>
      <div class="tq-cil__stage">
        <div class="tq-cil__tri">
          <div class="tq-cil__n1">項目 01</div>
          <div class="tq-cil__n2">項目 02</div>
          <div class="tq-cil__n3">項目 03</div>
          <div class="tq-cil__hub">まとめの<br>言葉</div>
        </div>
      </div>
      <p class="tq-cil__cap"><b>中心の円がまとめ役</b>中央の円が3つすべての縁へ25px食い込み、重なった側は必ず中央が上。3項目が中央に属していることが形で伝わる。</p>
    </figure>

    <figure>
      <div class="tq-cil__stage">
        <div class="tq-cil__ring">
          <div class="tq-cil__dot tq-cil__dot--a"></div>
          <div class="tq-cil__dot tq-cil__dot--b"></div>
          <div class="tq-cil__dot tq-cil__dot--c"></div>
          <div class="tq-cil__hole">中心の<br>言葉</div>
          <span class="tq-cil__lbl tq-cil__lbl--a">項目01</span>
          <span class="tq-cil__lbl tq-cil__lbl--b">項目02</span>
          <span class="tq-cil__lbl tq-cil__lbl--c">項目03</span>
        </div>
      </div>
      <p class="tq-cil__cap"><b>欠けの向きを揃える</b>手前の白い円盤が3つの円の内側を弧で食う。欠け方が3つとも中心方向に揃うので、輪に埋まっているように見える。</p>
    </figure>

  </div>
</div>
</body></html>
