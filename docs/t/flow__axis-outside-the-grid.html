<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>/* =========================================================
   トークン契約 v1
   すべてのパーツは「ここに定義された変数だけ」を使う。
   案件ごとに :root を差し替えれば、全パーツが即座に着替える。
   ここに無い色・サイズをパーツ内で直書きしたら契約違反。
   ========================================================= */
:root{
  /* --- 色 --- */
  --c-primary:#00B220;      /* 主色（CTA・強調） */
  --c-primary-d:#05A81F;    /* 主色の押下/hover */
  --c-primary-l:#E8F7EA;    /* 主色の淡色（面） */
  --c-accent:#FF9301;       /* 差し色（1箇所だけ効かせる） */
  --c-ink:#111111;          /* 見出し */
  --c-ink2:#333333;         /* 本文 */
  --c-ink3:#707070;         /* 補足・注記 */
  /* 地は「階段」にする。セクションごとに必ず1段動かす。
     同じ明るさが続くと面が消える（＝最頻の指摘「薄すぎて見えない」の正体） */
  --c-bg:#FFFFFF;           /* base   L255  カード・面 */
  --c-bg2:#F0F3F0;          /* tint   L241  1段落とす */
  --c-bg3:#E4F1E8;          /* accent L238  主色寄りの淡色 */
  --c-dark:#0E3113;         /* dark   L39   句読点。1ページに2回まで */
  --c-on-dark:#FFFFFF;      /* dark の上の文字（14.3:1） */
  --c-line:#E3E3E3;         /* 罫 */
  --c-on-primary:#FFFFFF;   /* 主色の上に乗る文字 */

  /* --- 書体 --- */
  --f-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-disp:var(--f-sans);   /* 見出し用に別書体を当てる場合はここだけ変える */
  --f-num:"Helvetica Neue",Arial,var(--f-sans);

  /* --- 文字サイズ（PC基準・clampはパーツ側で組む） --- */
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px;
  --fs-lg:21px;   --fs-xl:28px; --fs-2xl:38px;  --fs-3xl:50px; --fs-4xl:64px;
  --lh-tight:1.35; --lh-head:1.5; --lh-body:1.9;

  /* --- 余白 --- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --s6:36px; --s7:52px; --s8:76px; --s9:110px;
  --sec-y:clamp(56px,7vw,110px);   /* セクションの上下 */

  /* --- 形 --- */
  --r-s:6px; --r-m:12px; --r-l:24px; --r-pill:999px;
  --shadow:0 6px 24px rgba(14,49,19,.10), 0 1px 2px rgba(14,49,19,.06);
  --shadow-lg:0 12px 32px rgba(14,49,19,.16);

  /* --- 動き --- */
  --e:cubic-bezier(.23,1,.32,1);
  --d:.5s;

  /* --- 版面 --- */
  --w-max:1120px;
  --w-gut:clamp(18px,4vw,32px);
}

/* =========================================================
   基盤 v1  — リセット + 版面 + スクロール表示
   IntersectionObserver も GSAP も使わない（scroll位置 + class）
   JSが死んでも .fx-on が付かず、中身は最初から見えている
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--f-sans);color:var(--c-ink2);background:var(--c-bg);
  line-height:var(--lh-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
:where(a,button,input,textarea,select):focus-visible{
  outline:3px solid var(--c-primary);outline-offset:3px;border-radius:var(--r-s)}

/* 版面 */
.wrap{width:100%;max-width:var(--w-max);margin-inline:auto;padding-inline:var(--w-gut)}
.sec{padding-block:var(--sec-y)}
.sec--alt{background:var(--c-bg2)}
/* 地の階段。kit の tone で切り替える */
.tone-base{background:var(--c-bg)}
.tone-tint{background:var(--c-bg2)}
.tone-accent{background:var(--c-bg3)}
.tone-dark{background:var(--c-dark);color:#D9E3DB}
.tone-dark .h-lead,.tone-dark h2,.tone-dark h3{color:var(--c-on-dark)}
.tone-dark .h-eyebrow{color:#8FD6A0}
/* 面は必ず地から浮かせる。白の上の白は最頻の指摘 */
.card,.panel,[class*="__card"],[class*="__panel"]{box-shadow:var(--shadow)}
.nb{white-space:nowrap}          /* 日本語の改行制御。必ず <wbr> と併用 */

/* 見出しの型（案件をまたいで共通の骨） */
.h-eyebrow{display:flex;align-items:center;gap:var(--s3);
  font-size:var(--fs-sm);font-weight:700;color:var(--c-primary);letter-spacing:.08em}
.h-eyebrow::before{content:"";width:28px;height:2px;background:currentColor;flex:none}
.h-lead{font-family:var(--f-disp);font-weight:900;color:var(--c-ink);
  font-size:clamp(24px,3.4vw,var(--fs-2xl));line-height:var(--lh-head);letter-spacing:.01em}
.h-sub{margin-top:var(--s4);font-size:var(--fs-base);color:var(--c-ink3)}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s3);
  background:var(--c-primary);color:var(--c-on-primary);font-weight:700;font-size:var(--fs-md);
  padding:18px 34px;border-radius:var(--r-s);border:0;cursor:pointer;
  transition:background .16s var(--e),transform .16s var(--e)}
.btn:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.btn:hover{background:var(--c-primary-d)}}
.btn--ghost{background:transparent;color:var(--c-primary);box-shadow:inset 0 0 0 2px currentColor}
.btn--accent{background:var(--c-accent)}

/* ── スクロール表示 ───────────────────────────────
   .fx を付けた要素が、画面に入ったら .hh-in が付いて現れる。
   親（body）に .fx-on が無い間は「最初から見えている」＝失敗しても安全。
   data-fx で出方を指定：fadeup / fadeblur / left / right / scale / clip / mask
   data-d で遅延（ms）を指定：<div class="fx" data-fx="left" data-d="120">
   ─────────────────────────────────────────────── */
.fx-on .fx{opacity:0;will-change:opacity,transform,filter,clip-path;
  transition:opacity var(--d) var(--e),transform var(--d) var(--e),
             filter var(--d) var(--e),clip-path var(--d) var(--e)}
.fx-on .fx[data-fx="fadeup"],
.fx-on .fx:not([data-fx]){transform:translateY(26px)}
.fx-on .fx[data-fx="fadeblur"]{filter:blur(10px);transform:translateY(14px)}
.fx-on .fx[data-fx="left"]{transform:translateX(-44px)}
.fx-on .fx[data-fx="right"]{transform:translateX(44px)}
.fx-on .fx[data-fx="scale"]{transform:scale(.94)}
.fx-on .fx[data-fx="clip"]{clip-path:inset(0 100% 0 0)}
.fx-on .fx[data-fx="mask"]{clip-path:inset(100% 0 0 0)}
.fx-on .fx.hh-in{opacity:1;transform:none;filter:none;clip-path:inset(0 0 0 0)}

/* 常時動くもの（うるさくならない程度に） */
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.floaty{animation:floaty 4.5s var(--e) infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fx-on .fx{opacity:1!important;transform:none!important;filter:none!important;clip-path:none!important;transition:none!important}
  .floaty{animation:none}
  *{animation-duration:.001s!important}
}

body{padding:0;margin:0;background:var(--c-bg)}</style></head>
<body><style>
/* トークンのフォールバック。:where() で詰めているので、
   _tokens.css が読み込まれていればそちらが必ず勝つ。 */
:where(:root){
  --c-primary:#00B220; --c-primary-d:#05A81F; --c-primary-l:#E8F7EA; --c-accent:#FF9301;
  --c-ink:#111111; --c-ink2:#333333; --c-ink3:#707070;
  --c-bg:#FFFFFF; --c-bg2:#F7F8F7; --c-line:#E3E3E3; --c-on-primary:#FFFFFF;
  --f-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-disp:var(--f-sans); --f-num:"Helvetica Neue",Arial,var(--f-sans);
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px;
  --fs-lg:21px; --fs-xl:28px; --fs-2xl:38px;
  --lh-tight:1.35; --lh-head:1.5; --lh-body:1.9;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px; --s7:52px; --s8:76px;
  --sec-y:clamp(56px,7vw,110px);
  --r-s:6px; --r-m:12px; --r-l:24px; --r-pill:999px;
  --w-max:1120px; --w-gut:clamp(18px,4vw,32px);
}

.tq-axis-out{font-family:var(--f-sans); color:var(--c-ink2); background:var(--c-bg); padding-block:var(--s7)}
.tq-axis-out *{box-sizing:border-box}
.tq-axis-out__wrap{max-width:var(--w-max); margin-inline:auto; padding-inline:var(--w-gut)}
.tq-axis-out__grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--s7); align-items:start}
.tq-axis-out__blk{margin:0}
.tq-axis-out__tag{
  display:inline-block; margin:0 0 var(--s5);
  font-size:var(--fs-note); letter-spacing:.08em; line-height:1;
  padding:var(--s2) var(--s3); border-radius:var(--r-pill);
  background:var(--c-bg2); color:var(--c-ink3);
}
.tq-axis-out__tag--on{background:var(--c-primary-l); color:var(--c-primary-d)}
.tq-axis-out__cap{margin:var(--s5) 0 0; font-size:var(--fs-sm); line-height:var(--lh-body); color:var(--c-ink3)}

/* 共通の中身 */
.tq-axis-out__head{
  text-align:center; padding:var(--s3) var(--s2) var(--s2);
  font-size:var(--fs-note); line-height:var(--lh-tight); color:var(--c-ink3);
}
.tq-axis-out__head b{display:block; margin-top:var(--s1); font-size:var(--fs-sm); color:var(--c-ink)}
.tq-axis-out__cell{padding:var(--s2); display:grid; place-items:center}
.tq-axis-out__cell img{
  width:100%; max-width:88px; aspect-ratio:3/4; object-fit:cover; display:block;
  border-radius:var(--r-s);
}
.tq-axis-out__note{margin:var(--s3) 0 0; font-size:var(--fs-note); color:var(--c-ink3); text-align:right}

/* ============ 普通：年の見出し列を格子の中に入れ、縦罫で区切る ============ */
.tq-axis-out__table{display:grid; grid-template-columns:auto repeat(3,1fr); border:1px solid var(--c-line)}
.tq-axis-out__table>*{border-right:1px solid var(--c-line); border-bottom:1px solid var(--c-line)}
.tq-axis-out__table>*:nth-child(4n){border-right:0}
.tq-axis-out__th{
  display:grid; place-items:center; padding:var(--s2) var(--s3);
  font-size:var(--fs-sm); color:var(--c-ink); background:var(--c-bg2);
}

/* ============ この工夫：進行の軸を表の外に出し、間に▼を挟む ============ */
.tq-axis-out__chart{
  --tq-axis-out-cols:clamp(46px,10%,64px) repeat(3,1fr);
  position:relative; display:grid; grid-template-columns:var(--tq-axis-out-cols);
}
/* 色帯は同じ列組の別レイヤーに敷く。中身の自動配置を邪魔しない */
.tq-axis-out__bands{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  display:grid; grid-template-columns:var(--tq-axis-out-cols);
}
.tq-axis-out__band{border-radius:var(--r-m)}   /* 縦罫でなく色帯で列を分ける */
.tq-axis-out__band--1{grid-column:2; background:color-mix(in srgb, var(--c-primary) 12%, var(--c-bg))}
.tq-axis-out__band--2{grid-column:3; background:color-mix(in srgb, var(--c-accent)  14%, var(--c-bg))}
.tq-axis-out__band--3{grid-column:4; background:color-mix(in srgb, var(--c-ink3)    12%, var(--c-bg))}
.tq-axis-out__chart>.tq-axis-out__head,
.tq-axis-out__chart>.tq-axis-out__cell,
.tq-axis-out__chart>.tq-axis-out__year{position:relative; z-index:1}

/* 軸ラベルは色帯の左外・白地に置く */
.tq-axis-out__year{
  grid-column:1; z-index:1; padding-right:var(--s4);
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
}
.tq-axis-out__year b{
  padding-top:10px; font-size:var(--fs-sm); font-weight:400; color:var(--c-ink2);
  white-space:nowrap;                     /* 各行の書影の上端に揃える */
}
.tq-axis-out__year i{
  display:block; width:0; height:0; margin-bottom:var(--s3);
  border:6px solid transparent; border-top:9px solid var(--c-accent);
}

@media (max-width:768px){
  .tq-axis-out__grid{grid-template-columns:1fr; gap:var(--s7)}
  .tq-axis-out__year{padding-right:var(--s2)}
  .tq-axis-out__year b{font-size:var(--fs-note)}
}
</style>

<section class="tq-axis-out">
  <div class="tq-axis-out__wrap">
    <div class="tq-axis-out__grid">

      <figure class="tq-axis-out__blk">
        <p class="tq-axis-out__tag">普通の場合</p>
        <div class="tq-axis-out__table">
          <span class="tq-axis-out__th"></span>
          <div class="tq-axis-out__head">前半<b>分類A</b></div>
          <div class="tq-axis-out__head">中盤<b>分類B</b></div>
          <div class="tq-axis-out__head">後半<b>分類C</b></div>

          <span class="tq-axis-out__th">1年目</span>
          <div class="tq-axis-out__cell"><img src="../demo/ph_a.jpg" alt=""></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_b.jpg" alt=""></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_a.jpg" alt=""></div>

          <span class="tq-axis-out__th">2年目</span>
          <div class="tq-axis-out__cell"><img src="../demo/ph_b.jpg" alt=""></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_a.jpg" alt=""></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_b.jpg" alt=""></div>

          <span class="tq-axis-out__th">3年目</span>
          <div class="tq-axis-out__cell"><img src="../demo/ph_a.jpg" alt=""></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_b.jpg" alt=""></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_a.jpg" alt=""></div>
        </div>
        <figcaption class="tq-axis-out__cap">軸が格子の中にあるので、全体が「囲われた表」になる。縦罫と横罫が要り、年が進んでいることは文字を読むまで分からない。</figcaption>
      </figure>

      <figure class="tq-axis-out__blk">
        <p class="tq-axis-out__tag tq-axis-out__tag--on">この工夫</p>
        <div class="tq-axis-out__chart">
          <div class="tq-axis-out__bands" aria-hidden="true">
            <span class="tq-axis-out__band tq-axis-out__band--1"></span>
            <span class="tq-axis-out__band tq-axis-out__band--2"></span>
            <span class="tq-axis-out__band tq-axis-out__band--3"></span>
          </div>

          <span></span>
          <div class="tq-axis-out__head">前半<b>分類A</b></div>
          <div class="tq-axis-out__head">中盤<b>分類B</b></div>
          <div class="tq-axis-out__head">後半<b>分類C</b></div>

          <div class="tq-axis-out__year"><b>1年目</b><i></i></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_a.jpg" alt=""></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_b.jpg" alt=""></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_a.jpg" alt=""></div>

          <div class="tq-axis-out__year"><b>2年目</b><i></i></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_b.jpg" alt=""></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_a.jpg" alt=""></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_b.jpg" alt=""></div>

          <div class="tq-axis-out__year"><b>3年目</b></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_a.jpg" alt=""></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_b.jpg" alt=""></div>
          <div class="tq-axis-out__cell"><img src="../demo/ph_a.jpg" alt=""></div>
        </div>
        <p class="tq-axis-out__note">※注記がここに入ります</p>
        <figcaption class="tq-axis-out__cap">軸を色帯の左外・白地へ出し、年と年の間に▼を1つずつ挟む。ラベルは行の中央でなく各行の上端に揃える。縦罫は1本も無く、列は色帯だけで分かれている。</figcaption>
      </figure>

    </div>
  </div>
</section>
</body></html>
