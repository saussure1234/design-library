<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>FV案7 茗溪型 v01｜ESL club オンライン校</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   FV案7 ── ベンチマーク：茗溪学園 Meikei High School
   https://meikei.ac.jp/   （_shortlist.json の 000／ユーザーが選択）
   ★見たのは docs/esl4/ref/bench/000_meikei_ac_jp.png のみ。コードは読んでいない

   ── 茗溪の構成（実物を見て書き出したもの）──────────────
   1 地＝淡い水色。ドットで描いた世界地図が薄く敷いてある（ベタ塗りではない）
   2 中央に【有機的な形で抜いた写真1枚】。正円ではない
   3 右に縦組みの日本語2行（18字）
   4 左下に細い罫線1本で区切った小さいブロック（重要なお知らせ）
   5 最下部に画面幅いっぱいの巨大タイポ。極太＋細の混植
   6 ヘッダー右上にボタン1つ
   7 色は実質2色（紺・淡水色）。カード無し・影無し・角丸の箱無し

   ── ★禁止事項（先に書く。20回やって一度も書かなかったもの）──
   実務例(zenn/shotakada)もデザイナー(note/design_oyaji)も、
   AIっぽさを消した唯一の技法が「機能の要求」ではなく【禁止の列挙】だった。
     × カードを使わない          茗溪にカードは1枚も無い
     × 影を使わない              茗溪は影ゼロ
     × 角丸の箱を使わない
     × 3つ横並びの均等グリッドを使わない
     × 写真を矩形で置かない      有機的な形で抜く
     × 色を3色目に増やさない     地＋墨＋深緑。差し色はCTAの黄1つだけ
     × 黄色のマーカーを使わない  v20はこれで潰れた
     × 英字のスローガンを創作しない  ESL clubに無い言葉は作らない

   ── ★借りられなかったもの（正直に書く）──────────────
   茗溪の一番の武器は【地のドット世界地図】。これは「世界を舞台に」
   というコピーと意味が結びついているから効いている。
   ESL clubのコピーは「受験勉強と並走しながら…英検2級…準1級」で、
   世界地図に対応しない。意味の無いテクスチャを足すのは
   CRITERIA.md「勝手に要素を足すな」に反する。
   → 地のテクスチャは借りない。代わりに【地の輝度】で段差を作る

   ── ★置き換えたもの（ここが tailoring）─────────────
   (1) 最下部の巨大タイポ
       茗溪 = "MAKING THE DIFFERENCE."（英語のスローガン）
       ESL club に英語のスローガンは無い。創作は禁止。
       → 同じ【役割】を持つ実在のコピー＝ロゴに入っているタグライン
         「”英語”を教えない英語塾」を使う。日本語なので英字の混植ではなく、
         真ん中の3字だけ細くして極太＋細の対比を作る
   (2) 縦組みコピーの行数
       茗溪 = 18字を2行（9字/行）
       ESL club = 39字。2行だと20字/行になり、画面高660pxでは1字27pxで弱い。
       → 3行に割る（11/13/15字）。最長15字なら1字44pxで茗溪の迫力に届く
   (3) 数字3つ（1,000名 / 2015年 / 英検1級）
       茗溪にこの要素は無い。だが ESL club の一番強い札なので落とせない。
       → 茗溪の【左下の細い罫線1本のブロック】と同じ扱いにする。
         カードにしない。罫線だけで区切る
   (4) 色
       茗溪 紺 + 淡水色 → ESL club 深緑#0A7A2B + 淡緑
       黄#FFEE03 は CTA 1箇所だけ（CRITERIA.md ⑥ 強調は1〜2箇所）

   ── CRITERIA.md（発注者の判定6観点）の当て方 ──────────
   (1) 見えるか（輝度差）… 地の輝度を 0.872 にする（#E8F3EA）。
       白ベース(0.94)だと白い面が段差を作れず枠線を引く羽目になる。
       067=0.867 / 072=0.876 を実測して決めた値
   (2) 読めるか … 装飾は本文に一切かけない
   (3) 自然か  … 動きを入れない
   (4) 品があるか … ブランド色の外を持ち込まない
   (5) 位置を変えるな … コピーは esl3 から一字一句そのまま
   (6) 過剰でないか … 強調は【巨大タグライン】と【黄のCTA】の2箇所のみ

   v01 = 1回目
   ══════════════════════════════════════════════════════════ */
:root{
  --ink:#12262C;        /* 墨 */
  --ink2:#5F7266;       /* 弱い文字 */
  --g:#0A7A2B;          /* ブランド深緑（茗溪の紺の位置） */
  --y:#FFEE03;          /* 差し色。CTA 1箇所のみ */
  --bg:#E8F3EA;         /* 地。輝度0.872 */
  --line:#C3D8C8;       /* 罫線。茗溪は罫線1本で区切る */
  --u:8px;
  --pad:calc(max(0px,(100vw - 1360px)/2) + 40px);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color:var(--ink);background:var(--bg);font-size:16px;line-height:1.9;
  -webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

/* ── ヘッダー：茗溪と同じくロゴ左・ナビ・右上にボタン1つ ── */
.hd{position:relative;z-index:30;display:flex;align-items:center;gap:24px;
  padding:calc(var(--u)*2.5) var(--pad)}
.hd__logo img{height:34px;width:auto}
.hd__nav{display:flex;gap:26px;font-size:14px;font-weight:700;margin-left:auto}
/* ★強調その1：CTAの黄。ページ内で黄はここだけ */
.hd__btn{font-size:14px;font-weight:700;padding:11px 22px;border-radius:2px;
  background:var(--y);color:var(--ink);white-space:nowrap}

/* ── FV本体 ── */
.fv{position:relative;min-height:min(90vh,830px);overflow:hidden}

/* 2 有機的な形で抜いた写真1枚。正円にしない */
.ph{position:absolute;left:28%;top:3%;width:min(40%,540px);z-index:2;margin:0}
.ph::before{content:"";display:block;padding-top:104%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:56% 30%;
  border-radius:49% 51% 44% 56% / 53% 46% 54% 47%;
  filter:saturate(.9) contrast(1.03)}

/* 3 右に縦組み。39字なので3行に割る（茗溪は18字2行） */
.vt{position:absolute;right:var(--pad);top:8%;z-index:6;
  writing-mode:vertical-rl;
  font-size:clamp(22px,3.0vw,43px);font-weight:900;
  line-height:1.66;letter-spacing:.03em;margin:0}
.vt .l{display:block}

/* 前置き。縦組みの脇に細く添える */
.eyebrow{position:absolute;right:calc(var(--pad) + 4.2em);top:8%;z-index:6;
  writing-mode:vertical-rl;font-size:13px;font-weight:700;color:var(--ink2);
  letter-spacing:.12em;margin:0}

/* 4 左下：茗溪の「重要なお知らせ」と同じ扱い。細い罫線1本だけ。
      ★カードにしない・影を付けない・角丸の箱にしない */
.facts{position:absolute;left:var(--pad);bottom:23%;z-index:6;width:min(440px,34%)}
.facts__hd{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.14em;
  margin:0 0 calc(var(--u)*1.5)}
.nums{display:flex;gap:calc(var(--u)*3.5);margin:0;padding:calc(var(--u)*2) 0 0;
  border-top:1px solid var(--line)}
.num small{display:block;font-size:11px;font-weight:700;color:var(--ink2);
  line-height:1.4;margin:0 0 2px}
.num b{display:block;font-size:33px;font-weight:900;color:var(--g);line-height:1;
  letter-spacing:-.01em}
.num b i{font-style:normal;font-size:14px;margin-left:1px}
.num em{font-style:normal;display:block;font-size:11px;font-weight:700;
  color:var(--ink2);margin-top:3px}

/* CTA：茗溪はFV内にCTAが無いが、ESL clubには必要。
   罫線ブロックの下に、線1本のボタンで置く（黄はヘッダーで既に1回使っている） */
.cta{display:flex;align-items:center;gap:calc(var(--u)*2);margin:calc(var(--u)*3.5) 0 0}
.btn{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:700;
  padding:14px 26px;border:1.5px solid var(--g);color:var(--g);border-radius:2px;
  white-space:nowrap}
.btn::after{content:"";width:7px;height:7px;border-top:2px solid currentColor;
  border-right:2px solid currentColor;transform:rotate(45deg)}
.note{font-size:11px;color:var(--ink2);line-height:1.6;margin:0}

/* 5 最下部：画面幅いっぱいの巨大タイポ。★強調その2。
      茗溪の "MAKING THE DIFFERENCE." の位置と役割。
      文言は創作せず、ロゴにある実在のタグラインを使う */
.tag{position:absolute;left:0;right:0;bottom:calc(var(--u)*3);z-index:4;
  margin:0;padding:0 var(--pad);
  font-size:clamp(40px,8.2vw,118px);font-weight:900;line-height:1;
  letter-spacing:-.02em;color:var(--g);white-space:nowrap}
/* 極太＋細の対比。茗溪は MAKING が極太で THE DIFFERENCE が細い */
.tag .th{font-weight:400}

@media(max-width:900px){
  :root{--pad:20px}
  .hd{padding:calc(var(--u)*1.5) var(--pad);gap:12px}
  .hd__nav{display:none}
  .fv{min-height:0;padding:0 0 calc(var(--u)*4)}
  /* スマホ：写真をCTAより上に（全LP共通の決めごと） */
  .ph{position:relative;left:auto;top:auto;width:76%;margin:calc(var(--u)*2) auto 0}
  .eyebrow{position:relative;right:auto;top:auto;
    writing-mode:horizontal-tb;padding:calc(var(--u)*3) var(--pad) 0;letter-spacing:.06em}
  .vt{position:relative;right:auto;top:auto;
    writing-mode:horizontal-tb;font-size:23px;line-height:1.55;
    padding:calc(var(--u)*1.5) var(--pad) 0}
  .facts{position:relative;left:auto;bottom:auto;width:auto;
    padding:calc(var(--u)*3.5) var(--pad) 0}
  .nums{gap:calc(var(--u)*2);justify-content:space-between}
  .num b{font-size:25px}
  .cta{flex-direction:column;align-items:stretch;gap:calc(var(--u)*1.5)}
  .btn{justify-content:center}
  .tag{position:relative;bottom:auto;font-size:30px;white-space:normal;
    padding:calc(var(--u)*4) var(--pad) 0;line-height:1.35}
}
</style></head><body>

<header class="hd">
  <a class="hd__logo" href="#"><img src="../img/logo.svg" alt="ESL club"></a>
  <nav class="hd__nav">
    <a href="#">4つの特徴</a><a href="#">保護者さまの声</a>
    <a href="#">他塾との違い</a><a href="#">教室紹介</a>
  </nav>
  <a class="hd__btn" href="https://eslclub.jp/trial/">無料体験レッスン</a>
</header>

<section class="fv">

  <!-- 2 有機的な形で抜いた写真1枚。茗溪と同じく写真は1枚だけ。
       素材には少女の写真もあるが、茗溪型は1枚構成なので使わない -->
  <figure class="ph">
    <img src="../img/fv_boy.webp" alt="自宅の机で英検対策に取り組む小学生">
  </figure>

  <p class="eyebrow">2015年の開塾以降 ”英検に特化” してきたからできる</p>

  <!-- 3 縦組み。文言は esl3 から一字一句そのまま。3行に割った -->
  <h1 class="vt">
    <span class="l">受験勉強と並走しながら</span>
    <span class="l">小学生・中学生で英検2級、</span>
    <span class="l">高校生で準1級を目指せる英語塾</span>
  </h1>

  <!-- 4 左下。罫線1本だけで区切る。カード・影・角丸は使わない -->
  <div class="facts">
    <p class="facts__hd">これまでの実績</p>
    <!-- ★数字は esl3 のコピーにあるものだけ。捏造しない -->
    <div class="nums">
      <div class="num"><small>合格に導いた</small><b>1,000<i>名</i></b><em>以上</em></div>
      <div class="num"><small>開塾から</small><b>2015<i>年</i></b><em>英検に特化</em></div>
      <div class="num"><small>講師は全員</small><b>英検1<i>級</i></b><em>以上</em></div>
    </div>
    <div class="cta">
      <a class="btn" href="https://eslclub.jp/trial/">無料体験レッスンはこちら</a>
      <p class="note">いつまでに2級合格できるか<br>レッスン後にご案内します</p>
    </div>
  </div>

  <!-- 5 最下部の巨大タイポ。茗溪の "MAKING THE DIFFERENCE." の位置。
       英語のスローガンは創作せず、ロゴにある実在のタグラインを使う -->
  <p class="tag">”英語”を<span class="th">教えない</span>英語塾</p>

</section>

</body></html>
