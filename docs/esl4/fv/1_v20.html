<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FV案1 egaco型 v02｜ESL club オンライン校</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   FV案1 ── ベンチマーク：egaco（comic.smiles55.jp／MUUUUU掲載2022）
   イラスト・マンガ教室。個別指導・成果の約束・無料体験へ落とす。
   ESL clubと【FVの仕事が一致】していて、かつギャラリー掲載。
   ★見たのはスクリーンショットのみ。コードは読んでいない
   ★文言・数字・画像・リンク先は esl3 から一字一句そのまま
   ── egacoから取った構造 ────────────────────────────
   1 白地。色は小さなアクセントだけ
   2 背景に極薄の縦罫グリッド（版面が見える）
   3 巨大タイポを【塗らず輪郭線だけ】にして画面外へ流す
   4 見出しは極太。色を散らさない。下は1行だけ
   5 切り抜き人物を右半分に大きく置き、下端で切る
   6 CTAを2つ並べる（主＝無料体験／副）
   7 白い角丸カードを浮かせて副次的な導線
   ══════════════════════════════════════════════════════════
   v01 = 1回目
   v20 = 最終。スマホでカードがCTAの下＝スクロールしないと見えない。
         ★1回目の変更は【効かなかった】。実測で781のまま動かず。
           原因：v19でカードを .fv__in の中へ移したので、.fv 直下の
           子に効く order が届かなくなっていた。
           → .fv__in を flex 列にして、その中で順を決める
         ★これで順は 見出し→カード→CTA になったが、CTA下端が
           652→753px に落ちた。カードを挟むぶん必ず押し下がる。
           753px は 390x844 の画面内なので許容する（844-753=91px 余裕）
           それ以下の端末（iPhone SE 667px）では要スクロール
   v19 = カードがPCで左下に浮いて所属が曖昧。v13で人物の足元へ移したら
         24,945px² 被ったので、別の解にする。
         ★1つだけ：絶対配置をやめ、CTAの直下（文字欄の中）に置く。
           所属が文字欄になり、被りも構造的に起きない
   v18 = 輪郭タイポの緑線が見出しの読みを邪魔する。
         ★1つだけ：線の濃さを .22→.13 に落とす（位置は動かさない）
   v17 = 女の子（人物B）が右端で見切れて顔がほぼ出ていない。
         ★1つだけ変える（v13の反省）：女の子の right だけを動かす
   v16 = ★実測で犯人が確定。見出しの右端(680px)が【人物Aの左端(673px)】を
         7px 超えていただけ。女の子(人物B)は重なり0で無関係だった。
         v14・v15で女の子を2回いじったのは全部見当違い。
         → 文字欄を 50vw→47vw に。7px の超過を確実に消す
         ★「どちらが犯人か」を先に実測すれば1回で済んだ
   v15 = v14でカードは0に戻ったが見出しがまだ1,476px²被っていた。
         犯人は【v13で女の子を right:0→-2%、50%→56% に広げたこと】。
         文字欄を戻しても、人物側が広がったままだった。
         ★2つ同時に変えると、片方を戻しても原因が残る
         → 女の子を v11 の値（right:0 / 50%）に戻す
   v14 = ★v12とv13で2つとも悪化させた。実測で判明：
         ・v12 文字欄を50vw→54vwに広げたら見出しが人物に 8,004px² 被った
           → 52vw に戻す（v04の値）
         ・v13 カードを人物の足元へ移したら 24,945px² 被った
           → 左下へ戻す。カードは人物に属させない
         「広げる」「近づける」は必ず衝突を生む。実測で戻すのが正しい
   v13 = ①カードがPCで左下に浮いていて、どこに属するか曖昧だった
           → 人物の足元（右下）へ移し、人物の発言に見えるようにする
         ②女の子の表情が横顔で見えない → 拡大して顔を出す
   v12 = ①輪郭タイポが1語だけで、egacoのように画面外へ流れていない
           → 2語にして右端で切る（egacoは "Let's egaco" が右で切れる）
         ②見出しと人物の間に空きが残る → 文字欄の幅を50vw→54vwに
   v11 = ①女の子が男の子とほぼ同じ位置で重なっている
           → 女の子を左へずらし、高さを下げて2人の関係を作る
         ②スマホでカードが人物とピルの間に挟まって流れが切れる
           → カードを最後（CTAの下）へ。v07で一度失敗したが、
             v08でカードを32pxに細くしたので今度は押し下げが小さい
   v10 = ①輪郭タイポが人物の裏に隠れて「ESL clu」までしか見えない
           → タイポを人物より手前(z:4)に出す。塗っていない輪郭なので
             人物を隠さずに文字だけが乗る
         ②左の余白が広く文字が中央寄りに見える → 文字欄を左端へ
   v09 = スマホのCTA下端がまだ797px（画面外）。カードを細くしても
         足りなかった。原因は【人物の268px】。人物を228pxに詰め、
         前置きと見出しの余白も1段落とす。目標は CTA下端 <700px
   v08 = ①v07でスマホが悪化（CTA下端 691→818）。カードをCTAの上に
           戻したら100px押し下げた。カードを【1行の細いリンク】にして
           高さを52px→32pxに落とす。これでCTAの上でも画面内に収まる
         ②v06で見出し×タイポの重なりが 0→2,728px² 出た（タイポを
           1語にして級数を上げたため）→ top:5%→3%、級数を少し戻す
   v07 = ①スマホでカードがCTAの下＝スクロールしないと見えない
           → 人物の直後（CTAより上）に戻し、高さを詰める
         ②スマホの人物が246pxで小さい → 268pxに
   v06 = ①輪郭タイポが "ESL club ESL club" と2回繰り返して途中で切れていた
           → 1語だけにして、画面幅に収める
         ②左の余白が広く文字が中央寄りに見えた → 文字欄を左端へ寄せる
         ③女の子が男の子の影に入って暗い → 影を弱め、位置をずらす
   v05 = ①スマホでカードが人物とCTAの間に挟まり流れが切れていた
           → カードをCTAの下（最後）に移す
         ②スマホのCTA下端が833pxで画面外だった → 余白を詰める
   v04 = ①人物が右に寄りすぎて中央が空いていた → 人物Aを右2%→14%、
           女の子を人物Aの手前・左寄りに出して2人を見せる
         ②輪郭タイポが画面上端で切れていた → top:2%→5%、級数を落とす
         ③女の子が男の子の完全に後ろに隠れていた → z順と位置を変える
   v03 = ①スマホでカードが901px＝画面外だった。egacoはFV内に収める
           → スマホでは card を人物のすぐ下に持ち上げる
         ②スマホの縦が長い（CTA下端764px）→ 各余白を1段詰める
   v02 = ①輪郭タイポが見出しの真後ろで読みにくい（重なり104,831px²）
           → egaco同様、見出しの【上】へ移す
         ②人物が小さい → 82%→96%、右10%→2%
         ③スマホでカードが901px＝画面外 → 表示順を見直す
   ══════════════════════════════════════════════════════════ */
:root{--ink:#12262C;--ink2:#5A6E75;--line:#E3EAEC;
  --g:#00B21F;--g2:#0A7A2B;--y:#FFEE03;--u:8px;
  --f1:13px;--f2:15px;--f3:18px;--f4:24px;
  --pad:calc(max(0px,(100vw - 1360px)/2) + 32px)}
*{box-sizing:border-box}html,body{margin:0}
html,body{overflow-x:clip}
body{font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;color:var(--ink);
  background:#fff;font-size:var(--f3);line-height:1.85;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.nb{white-space:nowrap}

/* 2 縦罫のグリッド */
.g-lines{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:repeating-linear-gradient(90deg,rgba(18,38,44,.055) 0 1px,transparent 1px 320px)}

.hd{position:relative;z-index:20;display:flex;align-items:center;gap:20px;
  padding:calc(var(--u)*2) var(--pad)}
.hd__logo img{height:32px;width:auto}
.hd__nav{display:flex;gap:24px;font-size:var(--f2);font-weight:700;margin-left:auto}
.hd__btns{display:flex;gap:8px}
.hd__btn{font-size:var(--f2);font-weight:700;padding:11px 18px;border-radius:999px;
  white-space:nowrap;border:1.6px solid var(--g);color:var(--g2);background:#fff}
.hd__btn--main{background:var(--y);border-color:var(--y);color:var(--ink);box-shadow:0 4px 0 #D9C900}

.fv{position:relative;overflow:hidden;min-height:min(86vh,780px)}
/* 3 輪郭線だけの巨大タイポ */
.ghost{position:absolute;left:1.5%;top:3%;z-index:4;margin:0;
  font-size:clamp(88px,12.2vw,178px);font-weight:900;line-height:.84;letter-spacing:-.04em;
  white-space:nowrap;pointer-events:none;color:transparent;
  -webkit-text-stroke:2.2px rgba(0,178,31,.13)}
.fv__in{position:relative;z-index:6;padding:calc(var(--u)*12) 0 calc(var(--u)*6);
  max-width:min(576px,47vw);margin-left:var(--pad)}
.pill{display:inline-block;padding:6px 18px;border-radius:999px;border:1.6px solid var(--g);
  color:var(--g2);background:#fff;font-size:var(--f1);font-weight:700;letter-spacing:.1em}
.eyebrow{font-size:var(--f2);font-weight:700;color:var(--ink2);margin:calc(var(--u)*2) 0}
.eyebrow .mk{background:linear-gradient(var(--y),var(--y)) no-repeat 0 88%/100% 7px;color:var(--ink)}
/* 4 見出しは極太。色を散らさない */
.h1{font-size:clamp(30px,3.8vw,50px);font-weight:900;line-height:1.36;letter-spacing:.01em;
  margin:0 0 calc(var(--u)*3)}
.h1 .hi{background:linear-gradient(var(--y),var(--y)) no-repeat 0 84%/100% 12px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:0}
.btn{display:inline-flex;align-items:center;gap:11px;font-weight:700;font-size:var(--f4);
  padding:18px 30px;border-radius:12px}
.btn--main{background:var(--y);color:var(--ink);box-shadow:0 8px 0 #D9C900,0 16px 26px rgba(11,95,35,.16)}
.btn--sub{background:#fff;color:var(--g2);border:2px solid var(--g);font-size:var(--f3);padding:16px 24px}
.btn::after{content:"";width:9px;height:9px;border-top:2.4px solid currentColor;
  border-right:2.4px solid currentColor;transform:rotate(45deg)}
.note{font-size:var(--f1);color:var(--ink2);margin:calc(var(--u)*2) 0 0}
/* 5 切り抜き人物 */
.kids{position:absolute;inset:0;z-index:3;pointer-events:none}
.kid{position:absolute;bottom:0;filter:drop-shadow(0 14px 20px rgba(11,95,35,.13))}
.kid--a{right:17%;height:96%;width:auto;z-index:2}
.kid--b{right:3%;height:50%;width:auto;z-index:1}
/* 7 白い角丸カード */
.card{position:relative;margin-top:calc(var(--u)*3);z-index:8;
  display:inline-flex;align-items:center;gap:12px;background:#fff;border-radius:14px;
  padding:10px 16px 10px 10px;box-shadow:0 10px 26px rgba(18,38,44,.14);max-width:340px}
.card img{width:52px;height:52px;object-fit:cover;border-radius:10px;flex:none}
.card b{display:block;font-size:var(--f1);font-weight:700;line-height:1.7}
.card em{font-style:normal;display:inline-flex;align-items:center;gap:5px;font-size:var(--f1);
  font-weight:700;color:var(--g2);margin-top:2px}
.card em::before{content:"";width:0;height:0;border-left:7px solid var(--g);
  border-top:5px solid transparent;border-bottom:5px solid transparent}

@media(max-width:900px){
  :root{--pad:20px}
  .hd{padding:calc(var(--u)*1.5) var(--pad);flex-wrap:wrap}
  .hd__nav{display:none}
  .fv{min-height:0;padding-bottom:calc(var(--u)*3);display:flex;flex-direction:column}
  /* ★スマホは 人物 → カード → 文字 の順。カードをFV内に収める */
  .kids{position:relative;height:212px;order:1;flex:none}
  .kid--a{right:34%;height:100%}
  .kid--b{right:4%;height:56%}
    .fv__in{display:flex;flex-direction:column}
  .fv__in > .pill{order:1;align-self:flex-start}
  .fv__in > .eyebrow{order:2}
  .fv__in > .h1{order:3}
  .fv__in > .card{order:4;align-self:stretch}
  .fv__in > .cta{order:5;margin-top:calc(var(--u)*2)}
  .fv__in > .note{order:6}
  .card{position:static;margin:calc(var(--u)*1.5) 20px 0;max-width:none;
    padding:9px 14px;box-shadow:none;border:1.5px solid var(--line);gap:9px}
  .card img{display:none}
  .card b{font-size:var(--f1);line-height:1.5}
  .card b br{display:none}
  .fv__in{order:3;max-width:none;padding:calc(var(--u)*1) 20px 0;margin:0}
  .ghost{position:absolute;font-size:70px;top:auto;bottom:1%;left:-4%;order:0}
  .h1{font-size:23px;line-height:1.5;margin-bottom:calc(var(--u)*1.5)}
  .eyebrow{margin:calc(var(--u)*1) 0}
  .cta{flex-direction:column;gap:10px}
  .btn{width:100%;justify-content:center;font-size:var(--f3);padding:15px 20px}
}
</style></head><body>

<header class="hd">
  <a class="hd__logo" href="#"><img src="../img/logo.svg" alt="ESL club"></a>
  <nav class="hd__nav"><a href="#">4つの特徴</a><a href="#">保護者さまの声</a><a href="#">他塾との違い</a><a href="#">教室紹介</a></nav>
  <div class="hd__btns">
    <a class="hd__btn" href="https://eslclub.jp/">資料を見る</a>
    <a class="hd__btn hd__btn--main" href="https://eslclub.jp/trial/">無料体験レッスン</a>
  </div>
</header>

<section class="fv">
  <span class="g-lines"></span>
  <p class="ghost" aria-hidden="true">ESL club&nbsp;ESL</p>

  <div class="kids">
    <img class="kid kid--a" src="../img/fv_boy_cut.png" alt="自宅の机で学習に取り組む小学生">
    <img class="kid kid--b" src="../img/fv_girl_cut.png" alt="オンラインで英検対策を受ける中高生">
  </div>

  <div class="fv__in">
    <span class="pill">英検®︎特化・オンライン</span>
    <p class="eyebrow">2015年の開塾以降<span class="mk">”英検に特化”</span>してきたからできる</p>
    <h1 class="h1"><span class="nb">受験勉強と並走しながら</span><wbr>
      <span class="nb"><span class="hi">小学生・中学生で英検2級、</span></span><wbr>
      <span class="nb"><span class="hi">高校生で準1級</span>を目指せる英語塾</span></h1>
    <div class="cta">
      <a class="btn btn--main" href="https://eslclub.jp/trial/">無料体験レッスンはこちら</a>
      <a class="btn btn--sub" href="#">4つの特徴を見る</a>
    </div>
    <p class="note">いつまでに2級合格できるかレッスン後にご案内します</p>
    <a class="card" href="#">
      <img src="../img/fv_girl.png" alt="" aria-hidden="true">
      <span><b>3ヶ月で英検準2級を取得した<br>ご家庭の声</b><em>読む</em></span>
    </a>
  </div>
</section>

</body></html>
