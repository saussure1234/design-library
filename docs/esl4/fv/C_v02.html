<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FV案C 下部2枚型 v02｜ESL club オンライン校</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   FV案C 下部2枚型 v02 ── ベンチマーク：028 ひろがり保育プロジェクト
   https://seiwagakuen.ed.jp/hhp/
   ★見たのは ref/bench/028_seiwagakuen_ed_jp_hhp.png のみ。コードは読んでいない

   ── ★v01 は読み取りを間違えていた ──────────────────
   480pxの一覧サムネだけで書いていた。実寸で開いたら3つ違っていた。
     私が書いたこと      実物
     帯は斜めの直線     → 【大きな弧を描く曲線】。右上から右下へ抜ける
     帯は画面を横断     → 【右半分だけ】。見出しにはかからない
     写真は密着         → 【隙間がある】。その隙間に帯の続きが走る

   ── 028の実測値（PNGから数値で出したもの）──────────────
   地            RGB(245,245,245)
   帯が上端に入る x=727〜1103（幅377px）
   帯が右端を抜ける y=331〜673（高さ343px）
   帯1本の太さ    約125px（3本で約375px＝上端の入り幅と一致）
   ★この4点から弧の中心と半径を連立で解いた：
       内側の弧が (1103,105) と (1440,331) を通る
       外側の弧が (727,105) と (1440,673) を通る
       → 中心 (1547, -193)  内R 535  外R 873  3本×113px
     （FVの上端を原点にすると中心のyは -298）

   ── ★禁止事項 ──────────────────────────────
     × 帯を直線にしない（弧である）
     × 帯を見出しにかけない（右半分だけ）
     × 写真を密着させない（隙間を空ける）
     × カードを使わない        × 影を使わない
     × 角丸の箱を使わない
     × 帯を多色にしない        028は緑青赤黄の4色。ESL clubの色数が増えるので
                               ブランド緑の濃淡3本にする（CRITERIA.md ④）
     × ESL clubに無い言葉を作らない
     × 同じ訴求を2回出さない

   ── ★置き換えたもの（tailoring）────────────────────
   (1) 帯の色：028は4色。ESL clubは緑の濃淡3本にする。
       弧・太さ・入り位置・抜け位置は実測値をそのまま使う
   (2) 028は見出しの下に英語の補足2行がある。
       ESL clubに対応する英文は無いので【借りない】。作らない
   (3) 028の見出しは2行・約30字。ESL clubは39字なので3行。
       級数は上げずに行数で吸収する（028も極太にしていない）
   (4) 地：028は無彩色の#F5F5F5。ESL clubはブランド色の淡緑にする（④）

   ── ★訴求の重複（1回ずつ）──────────────────────
   ・前置きは入れない ＝ 数字②と同内容
   ・ヘッダーは「資料を見る」＝ 本文CTAと文言を分ける
   ・注記は入れない ＝ 見出しの「英検2級」と重複
   ・残す重複：見出し「準1級」と数字③「英検1級」＝ 主体が違う
   ══════════════════════════════════════════════════════════ */
:root{
  --ink:#12262C; --ink2:#5F7266;
  --g:#0A7A2B; --g2:#4FA86A; --g3:#A8D2B6;
  --y:#FFEE03; --bg:#E8F3EA; --line:#C3D8C8; --u:8px;
  --pad:calc(max(0px,(100vw - 1280px)/2) + 40px);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color:var(--ink);background:var(--bg);font-size:16px;line-height:1.9;
  -webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

.hd{position:relative;z-index:30;display:flex;align-items:center;gap:24px;
  padding:calc(var(--u)*2.5) var(--pad)}
.hd__logo img{height:34px;width:auto}
.hd__nav{display:flex;gap:26px;font-size:14px;font-weight:700;margin-left:auto}
.hd__btn{font-size:14px;font-weight:700;padding:11px 22px;border-radius:2px;
  border:1.5px solid var(--g);color:var(--g);white-space:nowrap}

.fv{position:relative;min-height:min(calc(100vh - 90px),820px);
  display:grid;grid-template-rows:1fr auto;overflow:hidden}

/* ★弧の帯。実測から解いた中心(1547,-298)・R535〜873・3本×113px を
     そのままCSSの円で再現する。直線ではない */
.arc{position:absolute;border-radius:50%;border-style:solid;z-index:1;
  pointer-events:none;border-color:transparent}
.arc--1{width:1632px;height:1632px;left:calc(100% - 709px);top:-1114px;
  border-width:113px;border-color:var(--g3)}
.arc--2{width:1406px;height:1406px;left:calc(100% - 596px);top:-1001px;
  border-width:113px;border-color:var(--g2)}
.arc--3{width:1180px;height:1180px;left:calc(100% - 483px);top:-888px;
  border-width:113px;border-color:var(--g)}

.fv__in{position:relative;z-index:4;
  padding:calc(var(--u)*4) var(--pad) calc(var(--u)*7)}
/* 3 見出しは中くらいの級数。極太にしない（028も極太ではない） */
.h1{font-size:clamp(23px,2.72vw,39px);font-weight:700;line-height:1.52;
  letter-spacing:.01em;margin:0;max-width:min(720px,58%)}
.h1 .l{display:block}

.nums{display:flex;gap:calc(var(--u)*6);margin:calc(var(--u)*4) 0 0;
  padding:calc(var(--u)*2.5) 0 0;border-top:1px solid var(--line);max-width:700px}
.num small{display:block;font-size:11px;font-weight:700;color:var(--ink2);line-height:1.4}
.num b{display:block;font-size:30px;font-weight:900;color:var(--g);line-height:1.1;
  letter-spacing:-.01em}
.num b i{font-style:normal;font-size:13px;margin-left:1px}
.num em{font-style:normal;display:block;font-size:11px;font-weight:700;color:var(--ink2)}

.cta{margin:calc(var(--u)*4) 0 0}
.btn{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:700;
  padding:15px 26px;background:var(--y);color:var(--ink);border-radius:2px;white-space:nowrap}
.btn::after{content:"";width:7px;height:7px;border-top:2px solid currentColor;
  border-right:2px solid currentColor;transform:rotate(45deg)}

/* 下半分に写真2枚。★密着させない。隙間93px（028の実測）。
   隙間には帯の続きが短く走る */
.ph{position:relative;z-index:2;display:grid;
  grid-template-columns:1fr 93px 1fr;height:44%;min-height:290px}
.ph figure{position:relative;margin:0;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph figure:nth-of-type(1) img{object-position:44% 52%}
.ph figure:nth-of-type(2) img{object-position:56% 44%}
/* 隙間を走る短い帯。028も隙間に帯の続きがある */
.slit{position:relative;display:grid;grid-template-rows:1fr auto auto 1fr;
  gap:14px;align-content:center}
.slit i{display:block;height:34px}
.slit i:nth-of-type(1){background:var(--g2)}
.slit i:nth-of-type(2){background:var(--g)}

@media(max-width:900px){
  :root{--pad:20px}
  .hd{padding:calc(var(--u)*1.5) var(--pad);gap:12px}
  .hd__nav{display:none}
  /* スマホ：写真をCTAより上に（全LP共通の決めごと） */
  .fv{min-height:0;display:flex;flex-direction:column;padding:0 0 calc(var(--u)*5)}
  .ph{order:1;height:230px;min-height:0;grid-template-columns:1fr 46px 1fr}
  .fv__in{order:2;padding:calc(var(--u)*4) var(--pad) 0}
  .arc--1{width:760px;height:760px;left:calc(100% - 330px);top:-520px;border-width:52px}
  .arc--2{width:656px;height:656px;left:calc(100% - 278px);top:-468px;border-width:52px}
  .arc--3{width:552px;height:552px;left:calc(100% - 226px);top:-416px;border-width:52px}
  .h1{font-size:23px;line-height:1.55;max-width:none}
  .nums{gap:calc(var(--u)*3)}
  .num b{font-size:24px}
  .btn{width:100%;justify-content:center}
  .slit i{height:22px}
}
</style></head><body>

<header class="hd">
  <a class="hd__logo" href="#"><img src="../img/logo.svg" alt="ESL club"></a>
  <nav class="hd__nav">
    <a href="#">4つの特徴</a><a href="#">保護者さまの声</a>
    <a href="#">他塾との違い</a><a href="#">教室紹介</a>
  </nav>
  <a class="hd__btn" href="https://eslclub.jp/">資料を見る</a>
</header>

<section class="fv">

  <!-- ★弧の帯。実測から解いた中心と半径。右半分だけを通り、見出しにかけない -->
  <span class="arc arc--1" aria-hidden="true"></span>
  <span class="arc arc--2" aria-hidden="true"></span>
  <span class="arc arc--3" aria-hidden="true"></span>

  <div class="fv__in">
    <!-- 文言は esl3 から一字一句そのまま -->
    <h1 class="h1">
      <span class="l">受験勉強と並走しながら</span>
      <span class="l">小学生・中学生で英検2級、</span>
      <span class="l">高校生で準1級を目指せる英語塾</span>
    </h1>
    <!-- ★数字は esl3 のコピーにあるものだけ。捏造しない -->
    <div class="nums">
      <div class="num"><small>合格に導いた</small><b>1,000<i>名</i></b><em>以上</em></div>
      <div class="num"><small>開塾から</small><b>2015<i>年</i></b><em>英検に特化</em></div>
      <div class="num"><small>講師は全員</small><b>英検1<i>級</i></b><em>以上</em></div>
    </div>
    <div class="cta">
      <a class="btn" href="https://eslclub.jp/trial/">無料体験レッスンはこちら</a>
    </div>
  </div>

  <!-- 下半分に写真2枚。隙間93px、隙間に帯の続き -->
  <div class="ph">
    <figure><img src="../img/p07.jpg" alt="自宅の机で英検対策に取り組む小学生"></figure>
    <span class="slit" aria-hidden="true"><i></i><i></i></span>
    <figure><img src="../img/p20.jpg" alt="オンラインで英検対策を受ける中高生"></figure>
  </div>

</section>

</body></html>
