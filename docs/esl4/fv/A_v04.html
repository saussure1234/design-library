<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FV案A 縦帯型 v04｜ESL club オンライン校</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   FV案A 縦帯型 v04 ── ベンチマーク：045 桃山学院大学
   https://www.andrew.ac.jp/
   ★見たのは ref/bench/045_www_andrew_ac_jp.png のみ。コードは読んでいない

   ── ★v01/v02 は読み取りを間違えていた ────────────────
   480pxの一覧サムネだけで書いていた。実寸で開いたら4つ違っていた。
   （「一覧のサムネで判断しない・1本ずつ実寸で開く」は自分の記録したルール）
     私が書いたこと          実物
     帯は等幅               → 不等幅。29% / 43% / 29%（左右同じ・中央が広い）
     文字は左の地に置く      → 文字は全部【写真の上に白抜き】。地の文字ゾーンは無い
     帯は画面の高さいっぱい  → ヘッダー下の【高さ540pxの帯】。下は別セクション
     （記載なし）           → 【巨大文字が3枚をまたいで下部を横断】これが主役

   ── 045の実測値（PNGから数値で出したもの）──────────────
   帯      y=120〜660  高さ540px
   パネル  412 / 614 / 414 px ＝ 29% / 43% / 29%
   巨大文字 13字が幅1293pxを横断 ＝ 1字あたり約99px
   縦組み  x=1070〜1401（右パネルの中）
   スクリム 無し（左パネル 上部の明るさ39／下部74。暗くしていない）

   ── ★禁止事項 ──────────────────────────────
     × カードを使わない        × 影を使わない
     × 角丸の箱を使わない      × パネルを等幅にしない
     × パネルの間に隙間を作らない
     × 帯を画面の高さいっぱいにしない（045は540pxの帯）
     × 色を3色目に増やさない
     × ESL clubに無い言葉を作らない
     × 同じ訴求を2回出さない

   ── ★置き換えたもの（tailoring）────────────────────
   (1) スクリム
       045はスクリム無しで白抜きが読める。写真が元から暗いから。
       ESL clubの写真は【明るい家庭のシーン】。同じことをすると読めない。
       → CRITERIA.md ②「読めるか」は譲れないので、帯の下部にだけ
         暗いグラデーションを敷く。045と違う点として明記する
   (2) パネル枚数
       045は3枚。ESL clubの写真は2枚 → 2枚にする。
       不等幅の考え方（片方を広く）は残す。57% / 43%
   (3) 巨大文字の級数
       045は13字を1行で99px。ESL clubは39字。1行にはできない。
       実測で決めた：3行×54px、1行15字＝810px。
       帯540pxのうち文字が219px、写真の見える部分が321px。
       099pxのまま3行にすると写真が潰れる（3行×99×1.3＝386px）
   (4) 縦組み
       045は縦組みの別コピー「響き合う、未来へ。」を右パネルに持つ。
       ESL clubのFVコピーは1本だけ。無いものを作らないので縦組みは借りない
   (5) 数字3つとCTA
       045の帯の下は別セクション。ESL clubもそこに置く（地は明るいまま）

   ── ★v04：見出しが読めていなかった ──────────────────
   新しく入れた「見出しの可読性」検査が捕まえた：
     コントラスト比 1.36（PC） / 1.12（スマホ）。白抜きがほぼ読めない
   逆算：白(輝度1.0)で比3.0を満たすには背景の輝度が
     (1.0+0.05)/3.0 - 0.05 ＝ 0.30 以下でなければならない。
     写真の明るい側が0.9なら、必要な黒の不透明度は
     0.9(1-a) + 0.01a ≦ 0.30  →  a ≧ 0.68
   見出しの上端は帯の53%の位置にあるので、そこで既に0.74まで
   落ちている必要がある。→ グラデーションを引き直した。
   ★045より濃く敷くことになる。045の写真は元から暗いので不要だった。
     素材が明るいぶんの差。ここは045と違うと明記しておく

   ── ★訴求の重複（1回ずつ）──────────────────────
   ・前置きは入れない ＝ 数字②と同内容
   ・ヘッダーは「資料を見る」＝ 本文CTAと文言を分ける
   ・注記は入れない ＝ 見出しの「英検2級」と重複
   ・残す重複：見出し「準1級」と数字③「英検1級」＝ 主体が違う
   ══════════════════════════════════════════════════════════ */
:root{
  --ink:#12262C; --ink2:#5F7266; --g:#0A7A2B; --y:#FFEE03;
  --bg:#E8F3EA; --line:#C3D8C8; --u:8px;
  --pad:calc(max(0px,(100vw - 1360px)/2) + 40px);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color:var(--ink);background:var(--bg);font-size:16px;line-height:1.9;
  -webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

/* 045のヘッダーは白。帯との境で面が変わる */
.hd{position:relative;z-index:30;display:flex;align-items:center;gap:24px;
  padding:calc(var(--u)*2.5) var(--pad);background:#fff}
.hd__logo img{height:34px;width:auto}
.hd__nav{display:flex;gap:26px;font-size:14px;font-weight:700;margin-left:auto}
.hd__btn{font-size:14px;font-weight:700;padding:11px 22px;border-radius:2px;
  border:1.5px solid var(--g);color:var(--g);white-space:nowrap}

.fv{position:relative}

/* ── 写真の帯。高さ540px（045の実測値）。パネルは不等幅・密着 ── */
.band{position:relative;height:min(60vh,540px);
  display:grid;grid-template-columns:57% 43%;overflow:hidden}
.band figure{position:relative;margin:0;overflow:hidden}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.band figure:nth-child(1) img{object-position:44% 50%}
.band figure:nth-child(2) img{object-position:58% 44%}
/* ★045との違い：045はスクリム無し（写真が元から暗い）。
   ESL clubの写真は明るいので、下部にだけ暗さを足さないと白抜きが読めない */
.band::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(
    rgba(4,24,12,0) 16%,
    rgba(4,24,12,.40) 36%,
    rgba(4,24,12,.76) 53%,
    rgba(4,24,12,.88) 74%,
    rgba(4,24,12,.92) 100%)}

/* ★主役：巨大文字がパネルをまたいで下部を横断する（045の一番効いている要素） */
.h1{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(var(--u)*4);
  z-index:4;margin:0;color:#fff;
  font-size:clamp(22px,3.75vw,54px);font-weight:900;line-height:1.35;
  letter-spacing:.01em;text-shadow:0 2px 18px rgba(4,24,12,.35)}
.h1 .l{display:block}

/* 帯の下は明るい地のまま。045も帯の下は別セクション */
.under{display:flex;align-items:flex-end;gap:calc(var(--u)*6);flex-wrap:wrap;
  padding:calc(var(--u)*4) var(--pad) calc(var(--u)*5)}
.nums{display:flex;gap:calc(var(--u)*6)}
.num small{display:block;font-size:11px;font-weight:700;color:var(--ink2);line-height:1.4}
.num b{display:block;font-size:30px;font-weight:900;color:var(--g);line-height:1.1;
  letter-spacing:-.01em}
.num b i{font-style:normal;font-size:13px;margin-left:1px}
.num em{font-style:normal;display:block;font-size:11px;font-weight:700;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:700;
  padding:15px 26px;background:var(--y);color:var(--ink);border-radius:2px;
  white-space:nowrap;margin-left:auto}
.btn::after{content:"";width:7px;height:7px;border-top:2px solid currentColor;
  border-right:2px solid currentColor;transform:rotate(45deg)}

@media(max-width:900px){
  :root{--pad:20px}
  .hd{padding:calc(var(--u)*1.5) var(--pad);gap:12px}
  .hd__nav{display:none}
  .band{height:400px;grid-template-columns:56% 44%}
  .h1{font-size:22px;line-height:1.5;bottom:calc(var(--u)*2.5)}
  .under{display:block;padding:calc(var(--u)*4) var(--pad) calc(var(--u)*5)}
  .nums{gap:calc(var(--u)*2);justify-content:space-between}
  .num b{font-size:24px}
  .btn{width:100%;justify-content:center;margin:calc(var(--u)*4) 0 0}
}
</style></head><body>

<header class="hd">
  <a class="hd__logo" href="#"><img src="../img/logo.svg" alt="ESL club"></a>
  <nav class="hd__nav">
    <a href="#">4つの特徴</a><a href="#">保護者さまの声</a>
    <a href="#">他塾との違い</a><a href="#">教室紹介</a>
  </nav>
  <a class="hd__btn" href="https://eslclub.jp/">資料を見る</a>
</header>

<section class="fv">

  <!-- 写真の帯。2枚・不等幅・密着（045は3枚 29/43/29） -->
  <div class="band">
    <figure><img src="../img/p07.jpg" alt="自宅の机で英検対策に取り組む小学生"></figure>
    <figure><img src="../img/p20.jpg" alt="オンラインで英検対策を受ける中高生"></figure>

    <!-- ★主役：パネルをまたいで横断する見出し。文言は esl3 から一字一句そのまま -->
    <h1 class="h1">
      <span class="l">受験勉強と並走しながら</span>
      <span class="l">小学生・中学生で英検2級、</span>
      <span class="l">高校生で準1級を目指せる英語塾</span>
    </h1>
  </div>

  <!-- 帯の下。045も帯の下は別の面 -->
  <div class="under">
    <!-- ★数字は esl3 のコピーにあるものだけ。捏造しない -->
    <div class="nums">
      <div class="num"><small>合格に導いた</small><b>1,000<i>名</i></b><em>以上</em></div>
      <div class="num"><small>開塾から</small><b>2015<i>年</i></b><em>英検に特化</em></div>
      <div class="num"><small>講師は全員</small><b>英検1<i>級</i></b><em>以上</em></div>
    </div>
    <a class="btn" href="https://eslclub.jp/trial/">無料体験レッスンはこちら</a>
  </div>

</section>

</body></html>
