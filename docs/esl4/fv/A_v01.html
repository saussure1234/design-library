<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FV案A 縦帯型 v01｜ESL club オンライン校</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   FV案A 縦帯型 ── ベンチマーク：045 桃山学院大学
   https://www.andrew.ac.jp/   （_shortlist.json 045）
   ★見たのは ref/bench/045_www_andrew_ac_jp.png のみ。コードは読んでいない

   ── なぜこのベンチか ────────────────────────────
   素材が【シーン写真2枚＋見出し39字＋数字3つ】に変わった。
   茗溪(000)は写真1枚構成なので、2枚だと成立しない。
   61本の中で【写真を複数枚、縦の帯に割って並べている】のが045。
   素材の構成が一致する。

   ── 045の構成（実物を見て書き出した）──────────────────
   1 画面を縦の帯に割り、帯ごとに別の写真を上下フルブリードで入れる
   2 帯の境目に隙間を作らない。密着させて1枚の面にする
   3 文字は写真の上に白抜きで置く
   4 右端の帯に縦組みの日本語
   5 上部に白い横帯を敷いてロゴを置く
   6 色は写真の色だけ。地の色を持ち込まない

   ── ★禁止事項 ──────────────────────────────
     × カードを使わない          045にカードは無い
     × 影を使わない
     × 角丸の箱を使わない
     × 帯の間に隙間を空けない    045は密着している
     × 写真の上の白抜き文字に、読みにくい場所を作らない（②読めるか）
     × 色を3色目に増やさない     差し色はCTAの黄1つだけ
     × ESL clubに無い言葉を作らない
     × 同じ訴求を2回出さない

   ── ★置き換えたもの（tailoring）────────────────────
   (1) 045は写真3帯。ESL clubの素材は2枚なので【2帯】にする。
       残りの面は地にして文字ゾーンにあてる（045も左端に文字の面がある）
   (2) 045の縦組みは9字程度。ESL clubの見出しは39字で縦組み3行だと
       帯の幅に収まらない。→ 見出しは【左の文字ゾーンに横組み】で置く。
       縦組みは借りない（茗溪版 7_v05 がその型なので役割が重複する）
   (3) 数字3つは、写真帯の【下端に白抜きで重ねる】。
       045が写真の上に文字を白抜きで置いているのと同じ扱い。
       カードにはしない

   ── ★訴求の重複（1回ずつに揃えた）──────────────────
   ・前置き「2015年の開塾以降 ”英検に特化”」は入れない ＝ 数字②と同内容
   ・ヘッダーは「資料を見る」＝ 本文CTA「無料体験レッスン」と文言を分ける
   ・注記は入れない ＝ 見出しの「英検2級」と重複する
   ・残す重複：見出し「準1級」と数字③「英検1級」
     → 生徒の目標 / 講師の資格 で主体が違うので別訴求

   ── CRITERIA.md ─────────────────────────────
   (1)見えるか   写真の上の文字は白抜き＋暗い部分に置く。地の輝度0.872
   (2)読めるか   衝突0。写真の明るい部分に白抜きを置かない
   (3)自然か     動きを入れない
   (4)品        ブランド色の外を持ち込まない
   (5)位置      コピーは esl3 から一字一句そのまま
   (6)過剰でない 強調は【黄のCTA】1箇所のみ
   v01 = 1回目
   ══════════════════════════════════════════════════════════ */
:root{
  --ink:#12262C; --ink2:#5F7266; --g:#0A7A2B; --y:#FFEE03;
  --bg:#E8F3EA;               /* 地。輝度0.872 */
  --line:#C3D8C8; --u:8px;
  --pad:calc(max(0px,(100vw - 1360px)/2) + 40px);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color:var(--ink);background:var(--bg);font-size:16px;line-height:1.9;
  -webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

/* 5 上部に白い横帯を敷いてロゴを置く（045と同じ） */
.hd{position:relative;z-index:30;display:flex;align-items:center;gap:24px;
  padding:calc(var(--u)*2.5) var(--pad);background:#fff}
.hd__logo img{height:34px;width:auto}
.hd__nav{display:flex;gap:26px;font-size:14px;font-weight:700;margin-left:auto}
.hd__btn{font-size:14px;font-weight:700;padding:11px 22px;border-radius:2px;
  border:1.5px solid var(--g);color:var(--g);white-space:nowrap}

/* ── FV：左＝文字ゾーン／右＝写真の縦帯2本（密着） ── */
.fv{position:relative;min-height:min(calc(100vh - 90px),820px);
  display:grid;grid-template-columns:minmax(0,1fr) 26% 26%;overflow:hidden}

.fv__in{grid-column:1;display:flex;flex-direction:column;justify-content:center;
  padding:calc(var(--u)*4) calc(var(--u)*5) calc(var(--u)*4) var(--pad)}
.h1{font-size:clamp(24px,2.62vw,38px);font-weight:900;line-height:1.5;
  letter-spacing:.01em;margin:0}
.h1 .l{display:block}

/* 3・6 数字は写真帯の上ではなく文字ゾーンに置く版もあるが、
      045に合わせて【写真の下端に白抜きで重ねる】 */
.cta{margin:calc(var(--u)*4.5) 0 0}
.btn{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:700;
  padding:15px 26px;background:var(--y);color:var(--ink);border-radius:2px;
  white-space:nowrap}
.btn::after{content:"";width:7px;height:7px;border-top:2px solid currentColor;
  border-right:2px solid currentColor;transform:rotate(45deg)}

/* 1・2 写真の縦帯。上下フルブリード、帯の間に隙間を作らない */
.strip{position:relative;overflow:hidden;margin:0}
.strip--a{grid-column:2}
.strip--b{grid-column:3}
.strip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.strip--a img{object-position:46% 40%}
.strip--b img{object-position:56% 38%}
/* 白抜き文字を読ませるため、下端だけ暗く落とす（②読めるか） */
.strip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56%;
  background:linear-gradient(transparent,rgba(6,28,14,.78))}

/* 3 数字は写真の上に白抜きで重ねる。カードにしない */
.num{position:absolute;left:0;right:0;bottom:calc(var(--u)*3);z-index:3;
  padding:0 calc(var(--u)*2.5);color:#fff;text-align:left}
.num small{display:block;font-size:11px;font-weight:700;opacity:.86;line-height:1.4}
.num b{display:block;font-size:clamp(24px,2.3vw,34px);font-weight:900;line-height:1.05;
  letter-spacing:-.01em}
.num b i{font-style:normal;font-size:13px;margin-left:1px}
.num em{font-style:normal;display:block;font-size:11px;font-weight:700;opacity:.86}
/* 3つ目の数字は文字ゾーン側に置く（帯は2本しかないため） */
.num3{display:flex;align-items:baseline;gap:8px;margin:calc(var(--u)*3.5) 0 0;
  padding-top:calc(var(--u)*2);border-top:1px solid var(--line)}
.num3 small{font-size:11px;font-weight:700;color:var(--ink2)}
.num3 b{font-size:26px;font-weight:900;color:var(--g);line-height:1}
.num3 b i{font-style:normal;font-size:12px;margin-left:1px}
.num3 em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink2)}

@media(max-width:900px){
  :root{--pad:20px}
  .hd{padding:calc(var(--u)*1.5) var(--pad);gap:12px}
  .hd__nav{display:none}
  /* スマホ：写真をCTAより上に（全LP共通の決めごと）→ 帯を上、文字を下 */
  .fv{min-height:0;display:block;padding:0 0 calc(var(--u)*5)}
  .strips{display:grid;grid-template-columns:1fr 1fr}
  .strip{height:280px}
  .fv__in{padding:calc(var(--u)*4) var(--pad) 0}
  .h1{font-size:23px;line-height:1.55}
  .btn{width:100%;justify-content:center}
}
</style></head><body>

<header class="hd">
  <a class="hd__logo" href="#"><img src="../img/logo.svg" alt="ESL club"></a>
  <nav class="hd__nav">
    <a href="#">4つの特徴</a><a href="#">保護者さまの声</a>
    <a href="#">他塾との違い</a><a href="#">教室紹介</a>
  </nav>
  <a class="hd__btn" href="https://eslclub.jp/">資料を見る</a>
</header>

<section class="fv">

  <div class="fv__in">
    <!-- 文言は esl3 から一字一句そのまま -->
    <h1 class="h1">
      <span class="l">受験勉強と並走しながら</span>
      <span class="l">小学生・中学生で英検2級、</span>
      <span class="l">高校生で準1級を目指せる英語塾</span>
    </h1>
    <!-- 3つ目の数字。帯が2本しかないのでこちらに置く。カードにしない -->
    <p class="num3"><small>講師は全員</small><b>英検1<i>級</i></b><em>以上</em></p>
    <div class="cta">
      <a class="btn" href="https://eslclub.jp/trial/">無料体験レッスンはこちら</a>
    </div>
  </div>

  <!-- 1・2 写真の縦帯2本。上下フルブリード・帯の間に隙間なし -->
  <figure class="strip strip--a">
    <img src="../img/p06.jpg" alt="自宅の机で英検対策に取り組む小学生">
    <span class="num"><small>合格に導いた</small><b>1,000<i>名</i></b><em>以上</em></span>
  </figure>
  <figure class="strip strip--b">
    <img src="../img/p20.jpg" alt="オンラインで英検対策を受ける中高生">
    <span class="num"><small>開塾から</small><b>2015<i>年</i></b><em>英検に特化</em></span>
  </figure>

</section>

</body></html>
