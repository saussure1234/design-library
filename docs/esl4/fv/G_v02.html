<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FV案G 濃地＋左右縦組み型 v02｜ESL club オンライン校</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   FV案G 濃地＋左右縦組み型 ── ベンチマーク：027 TOPCON DX
   https://www.topcon.co.jp/dx/ja/
   ★見たのは ref/bench/027_www_topcon_co_jp_dx_ja.png のみ。コードは読んでいない

   ── 027の構成（実寸で見て書き出した）──────────────────
   1 地は【ブランド色のベタ】が全面。淡色ではなく濃い色
   2 中央に主役の1枚が大きく、地から浮いて置かれる
   3 縦組みの日本語が【左右に1本ずつ】。白。1文を2つに割って
     右→左の順で読ませる（右「尖ったDXで、」→ 左「世界を丸く。」）
   4 ヘッダーは白い文字＋白い丸みのバー
   5 書体は明朝（セリフ）

   ── 027の実測値（PNGから数値で出したもの）──────────────
   地        RGB(1,109,175)  輝度0.140
   白文字とのコントラスト比 5.52
   縦組み    左は6字で高さ約510px → 1字あたり約85px
   右の列    幅78px（2列ぶん）

   ── ★禁止事項 ──────────────────────────────
     × 地を淡色にしない（027の肝は【濃いベタ地】。淡くすると別物になる）
     × カードを使わない        × 影で浮かせすぎない
     × 角丸の箱を使わない
     × 色を3色目に増やさない（地の緑＋白＋CTAの黄まで）
     × 明朝体を使わない
       027は明朝だが、ESL clubのLPは全ページ Noto Sans JP で組んである。
       【フォントは触ってはいけない4つ】に入っている（CRITERIA.md）
     × ESL clubに無い言葉を作らない
     × 同じ訴求を2回出さない

   ── ★置き換えたもの（tailoring）────────────────────
   (1) 地の色
       027 RGB(1,109,175) 輝度0.140 → ESL clubのブランド深緑 #0A7A2B。
       白文字とのコントラスト比を計算して同等（約5.0）になることを確認する
   (2) 縦組みの列数
       027は1文を2つに割って左右1本ずつ。6字なので85pxで置ける。
       ESL clubは39字。2本だと右が24字になり、
       使える高さ660px ÷ 24字 ＝ 27px で見出しとして弱い。
       → 3本に割る（11字／13字／15字）。
         660 ÷ 15字 ＝ 44px を共通の級数にする。
         右に1〜2本目、左に3本目。読み順は右から左のまま（027と同じ）
   (3) 中央の主役
       027は主役1枚。ESL clubは写真2枚なので、中央に2枚を並べる。
       枚数を偽装して同じ写真を並べたりはしない
   (4) 数字とCTA
       027のFVには無い。ESL clubには必要なので下部に白抜きで置く

   ── ★訴求の重複（1回ずつ）──────────────────────
   ・前置きは入れない ＝ 数字②と同内容
   ・ヘッダーは「資料を見る」＝ 本文CTAと文言を分ける
   ・注記は入れない ＝ 見出しの「英検2級」と重複
   ・残す重複：見出し「準1級」と数字③「英検1級」＝ 主体が違う
   v02 = 縦組みが画面外に293px出ていた。
         ★原因：.vt を display:flex にしていた。縦書き(vertical-rl)では
           flexの主軸も縦になるので、2本の行が【縦に積まれて】倍の高さになった。
           縦書きでは block のままにすれば、行は自然に右から左へ列になる
         → display:block にして、列の間隔は line-height で取る
   v01 = 1回目
   ══════════════════════════════════════════════════════════ */
:root{
  --ink:#12262C; --g:#0A7A2B; --y:#FFEE03; --u:8px;
  --pad:calc(max(0px,(100vw - 1360px)/2) + 40px);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color:#fff;background:var(--g);font-size:16px;line-height:1.9;
  -webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

/* 4 ヘッダーは白い文字。ナビは白い丸みのバー */
.hd{position:relative;z-index:30;display:flex;align-items:center;gap:20px;
  padding:calc(var(--u)*2.5) var(--pad)}
.hd__logo img{height:32px;width:auto;filter:brightness(0) invert(1)}
.hd__nav{display:flex;gap:22px;font-size:14px;font-weight:700;margin-left:auto;
  background:rgba(255,255,255,.14);border-radius:999px;padding:9px 22px}
.hd__btn{font-size:14px;font-weight:700;padding:11px 22px;border-radius:999px;
  border:1.5px solid rgba(255,255,255,.6);color:#fff;white-space:nowrap}

/* 1 地はブランド色のベタ。淡くしない */
.fv{position:relative;min-height:min(calc(100vh - 90px),820px);
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;gap:calc(var(--u)*4);
  padding:calc(var(--u)*2) var(--pad) calc(var(--u)*3);overflow:hidden}

/* 3 縦組み。右に1〜2本目、左に3本目。読み順は右から左 */
.vt{writing-mode:vertical-rl;display:block;   /* ★flexにすると縦書きでは行が縦に積まれる */
  font-size:clamp(19px,3.06vw,44px);font-weight:900;line-height:1.6;
  letter-spacing:.03em;margin:0;align-self:start}
.vt--r{grid-column:3;order:3}
.vt--l{grid-column:1;order:1;align-self:end}
.vt .l{display:block}

/* 2 中央に主役。027は1枚、ESL clubは2枚なので並べる */
.mid{grid-column:2;order:2;display:flex;gap:calc(var(--u)*2.5);
  align-items:center;justify-content:center}
.mid figure{margin:0;width:min(46%,420px);aspect-ratio:.82;overflow:hidden;
  border-radius:10px}
.mid figure:nth-of-type(1){margin-top:calc(var(--u)*-5)}
.mid figure:nth-of-type(2){margin-top:calc(var(--u)*7)}
.mid img{width:100%;height:100%;object-fit:cover}
.mid figure:nth-of-type(1) img{object-position:44% 48%}
.mid figure:nth-of-type(2) img{object-position:58% 42%}

/* 4 数字とCTA。027には無い要素なので下部に置いた */
.under{grid-column:1 / -1;order:4;display:flex;align-items:flex-end;
  gap:calc(var(--u)*5);flex-wrap:wrap;margin:calc(var(--u)*2) 0 0}
.nums{display:flex;gap:calc(var(--u)*5)}
.num small{display:block;font-size:11px;font-weight:700;opacity:.78;line-height:1.4}
.num b{display:block;font-size:26px;font-weight:900;line-height:1.1;letter-spacing:-.01em}
.num b i{font-style:normal;font-size:11px;margin-left:1px}
.num em{font-style:normal;display:block;font-size:11px;font-weight:700;opacity:.78}
.btn{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:700;
  padding:15px 26px;background:var(--y);color:var(--ink);border-radius:2px;
  white-space:nowrap;margin-left:auto}
.btn::after{content:"";width:7px;height:7px;border-top:2px solid currentColor;
  border-right:2px solid currentColor;transform:rotate(45deg)}

@media(max-width:900px){
  :root{--pad:20px}
  .hd{padding:calc(var(--u)*1.5) var(--pad);gap:10px}
  .hd__nav{display:none}
  .fv{min-height:0;display:flex;flex-direction:column;
    padding:calc(var(--u)*3) var(--pad) calc(var(--u)*5)}
  /* スマホ：写真をCTAより上に（全LP共通の決めごと） */
  .mid{order:1;margin:0 0 calc(var(--u)*3)}
  .mid figure{width:50%}
  .mid figure:nth-of-type(1),.mid figure:nth-of-type(2){margin-top:0}
  .vt{writing-mode:horizontal-tb;font-size:23px;line-height:1.55;display:block}
  .vt .l{display:block}
  .vt--r{order:2} .vt--l{order:3;margin-top:0}
  .under{order:4;display:block;margin-top:calc(var(--u)*3)}
  .nums{gap:calc(var(--u)*3)}
  .num b{font-size:22px}
  .btn{width:100%;justify-content:center;margin:calc(var(--u)*4) 0 0}
}
</style></head><body>

<header class="hd">
  <a class="hd__logo" href="#"><img src="../img/logo.svg" alt="ESL club"></a>
  <nav class="hd__nav">
    <a href="#">4つの特徴</a><a href="#">保護者さまの声</a>
    <a href="#">他塾との違い</a><a href="#">教室紹介</a>
  </nav>
  <a class="hd__btn" href="https://eslclub.jp/">資料を見る</a>
</header>

<section class="fv">

  <!-- 3 縦組み。右に1〜2本目（読み始め）。文言は esl3 から一字一句そのまま -->
  <h1 class="vt vt--r">
    <span class="l">受験勉強と並走しながら</span>
    <span class="l">小学生・中学生で英検2級、</span>
  </h1>

  <!-- 2 中央に主役。027は1枚、ESL clubは2枚 -->
  <div class="mid">
    <figure><img src="../img/p07.jpg" alt="自宅の机で英検対策に取り組む小学生"></figure>
    <figure><img src="../img/p20.jpg" alt="オンラインで英検対策を受ける中高生"></figure>
  </div>

  <!-- 3 縦組みの続き。左が読み終わり（027と同じ右→左） -->
  <p class="vt vt--l"><span class="l">高校生で準1級を目指せる英語塾</span></p>

  <div class="under">
    <!-- ★数字は esl3 のコピーにあるものだけ。捏造しない -->
    <div class="nums">
      <div class="num"><small>合格に導いた</small><b>1,000<i>名</i></b><em>以上</em></div>
      <div class="num"><small>開塾から</small><b>2015<i>年</i></b><em>英検に特化</em></div>
      <div class="num"><small>講師は全員</small><b>英検1<i>級</i></b><em>以上</em></div>
    </div>
    <a class="btn" href="https://eslclub.jp/trial/">無料体験レッスンはこちら</a>
  </div>

</section>

</body></html>
