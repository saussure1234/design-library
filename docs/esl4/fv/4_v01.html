<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FV案4 日暮里ゼミナール型 v01｜ESL club オンライン校</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   FV案4 日暮里ゼミナール型 ── ベンチマーク：nippori.lamm.tokyo（塾／2025掲載）
   白地に極太の英文タイポを画面幅いっぱい／黒一色／写真は矩形で並べる
   ★見たのはスクリーンショットのみ。コードは読んでいない
   ★文言・数字・画像・リンク先は esl3 から一字一句そのまま
   v01 = 1回目
   ══════════════════════════════════════════════════════════ */
:root{--ink:#12262C;--ink2:#5A6E75;--line:#E3EAEC;--g:#00B21F;--g2:#0A7A2B;--y:#FFEE03;
  --u:8px;--f1:13px;--f2:15px;--f3:18px;--f4:24px;
  --pad:calc(max(0px,(100vw - 1300px)/2) + 32px)}
*{box-sizing:border-box}html,body{margin:0}html,body{overflow-x:clip}
body{font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;color:var(--ink);background:#fff;font-size:var(--f3);
  line-height:1.85;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}.nb{white-space:nowrap}
.hd{position:relative;z-index:20;display:flex;align-items:center;gap:20px;padding:calc(var(--u)*2) var(--pad)}
.hd__logo img{height:32px;width:auto}
.hd__nav{display:flex;gap:24px;font-size:var(--f2);font-weight:700;margin-left:auto}
.hd__btn{font-size:var(--f2);font-weight:700;padding:11px 18px;border-radius:999px;white-space:nowrap;
  border:1.6px solid var(--g);color:var(--g2);background:#fff}
.hd__btn--main{background:var(--y);border-color:var(--y);color:var(--ink);box-shadow:0 4px 0 #D9C900}
.btn{display:inline-flex;align-items:center;gap:11px;font-weight:700;font-size:var(--f4);
  padding:18px 30px;border-radius:12px}
.btn--main{background:var(--y);color:var(--ink);box-shadow:0 8px 0 #D9C900,0 16px 26px rgba(11,95,35,.16)}
.btn--sub{background:#fff;color:var(--g2);border:2px solid var(--g);font-size:var(--f3);padding:16px 24px}
.btn::after{content:"";width:9px;height:9px;border-top:2.4px solid currentColor;
  border-right:2.4px solid currentColor;transform:rotate(45deg)}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:0}
.note{font-size:var(--f1);color:var(--ink2);margin:calc(var(--u)*2) 0 0}
.pill{display:inline-block;padding:6px 18px;border-radius:999px;border:1.6px solid var(--g);
  color:var(--g2);background:#fff;font-size:var(--f1);font-weight:700;letter-spacing:.1em}
.eyebrow{font-size:var(--f2);font-weight:700;color:var(--ink2);margin:calc(var(--u)*2) 0}
.eyebrow .mk{background:linear-gradient(var(--y),var(--y)) no-repeat 0 88%/100% 7px;color:var(--ink)}
.card{display:inline-flex;align-items:center;gap:12px;background:#fff;border-radius:14px;
  padding:10px 16px 10px 10px;box-shadow:0 10px 26px rgba(18,38,44,.14);max-width:340px;
  margin-top:calc(var(--u)*3)}
.card img{width:56px;height:56px;object-fit:cover;border-radius:10px;flex:none}
.card b{display:block;font-size:var(--f1);font-weight:700;line-height:1.7}
.card em{font-style:normal;font-size:var(--f1);font-weight:700;color:var(--g2)}
.fv{position:relative;padding:calc(var(--u)*4) var(--pad) calc(var(--u)*8)}
.big{font-size:clamp(46px,8.6vw,132px);font-weight:900;line-height:.98;letter-spacing:-.03em;
  margin:0 0 calc(var(--u)*4);color:var(--ink)}
.fv__grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:calc(var(--u)*5);align-items:end}
.h1{font-size:clamp(24px,2.7vw,34px);font-weight:900;line-height:1.5;margin:0 0 calc(var(--u)*3)}
.h1 .hi{background:linear-gradient(var(--y),var(--y)) no-repeat 0 86%/100% 9px}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shots figure{margin:0;overflow:hidden;background:#EDF4EF;aspect-ratio:1/1.1}
.shots img{width:100%;height:100%;object-fit:cover}
@media(max-width:900px){:root{--pad:20px}.hd__nav{display:none}
 .big{font-size:34px}.fv__grid{grid-template-columns:1fr;gap:calc(var(--u)*3)}
 .shots{order:-1}.h1{font-size:23px}
 .cta{flex-direction:column}.btn{width:100%;justify-content:center;font-size:var(--f3);padding:15px 20px}
 .card{max-width:none}}
</style></head><body>
<header class="hd">
  <a class="hd__logo" href="#"><img src="../img/logo.svg" alt="ESL club"></a>
  <nav class="hd__nav"><a href="#">4つの特徴</a><a href="#">保護者さまの声</a><a href="#">他塾との違い</a><a href="#">教室紹介</a></nav>
  <a class="hd__btn hd__btn--main" href="https://eslclub.jp/trial/">無料体験レッスン</a>
</header>
<section class="fv">
  <p class="big" aria-hidden="true">EIKEN,<br>ON PURPOSE.</p>
  <div class="fv__grid">
    <div><span class="pill">英検®︎特化・オンライン</span>
    <p class="eyebrow">2015年の開塾以降<span class="mk">”英検に特化”</span>してきたからできる</p>
    <h1 class="h1"><span class="nb">受験勉強と並走しながら</span><wbr>
      <span class="nb"><span class="hi">小学生・中学生で英検2級、</span></span><wbr>
      <span class="nb"><span class="hi">高校生で準1級</span>を目指せる英語塾</span></h1>
    <div class="cta">
      <a class="btn btn--main" href="https://eslclub.jp/trial/">無料体験レッスンはこちら</a>
      <a class="btn btn--sub" href="#">4つの特徴を見る</a>
    </div>
    <p class="note">いつまでに2級合格できるかレッスン後にご案内します</p>
    <a class="card" href="#"><img src="../img/fv_girl.png" alt="" aria-hidden="true">
      <span><b>3ヶ月で英検準2級を取得したご家庭の声</b><em>▶ 読む</em></span></a></div>
    <div class="shots">
      <figure><img src="../img/fv_boy.webp" alt="自宅の机で学習に取り組む小学生"></figure>
      <figure><img src="../img/fv_girl.png" alt="オンラインで英検対策を受ける中高生"></figure>
    </div>
  </div>
</section>
</body></html>
