<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>比較バー（ラベル＋横バー＋右端の数値を積む）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>/* =========================================================
   トークン契約 v1
   すべてのパーツは「ここに定義された変数だけ」を使う。
   案件ごとに :root を差し替えれば、全パーツが即座に着替える。
   ここに無い色・サイズをパーツ内で直書きしたら契約違反。
   ========================================================= */
:root{
  /* --- 色 --- */
  --c-primary:#00B220;      /* 主色（CTA・強調） */
  --c-primary-d:#05A81F;    /* 主色の押下/hover */
  --c-primary-l:#E8F7EA;    /* 主色の淡色（面） */
  --c-accent:#FF9301;       /* 差し色（1箇所だけ効かせる） */
  --c-ink:#111111;          /* 見出し */
  --c-ink2:#333333;         /* 本文 */
  --c-ink3:#707070;         /* 補足・注記 */
  /* 地は「階段」にする。セクションごとに必ず1段動かす。
     同じ明るさが続くと面が消える（＝最頻の指摘「薄すぎて見えない」の正体） */
  --c-bg:#FFFFFF;           /* base   L255  カード・面 */
  --c-bg2:#F0F3F0;          /* tint   L241  1段落とす */
  --c-bg3:#E4F1E8;          /* accent L238  主色寄りの淡色 */
  --c-dark:#0E3113;         /* dark   L39   句読点。1ページに2回まで */
  --c-on-dark:#FFFFFF;      /* dark の上の文字（14.3:1） */
  --c-line:#E3E3E3;         /* 罫 */
  --c-on-primary:#FFFFFF;   /* 主色の上に乗る文字 */

  /* --- 書体 --- */
  --f-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-disp:var(--f-sans);   /* 見出し用に別書体を当てる場合はここだけ変える */
  --f-num:"Helvetica Neue",Arial,var(--f-sans);

  /* --- 文字サイズ（PC基準・clampはパーツ側で組む） --- */
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px;
  --fs-lg:21px;   --fs-xl:28px; --fs-2xl:38px;  --fs-3xl:50px; --fs-4xl:64px;
  --lh-tight:1.35; --lh-head:1.5; --lh-body:1.9;

  /* --- 余白 --- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --s6:36px; --s7:52px; --s8:76px; --s9:110px;
  /* 余白は3値に固定する。検算で「24箇所に21通り」が出たため */
  --sp-sec:clamp(88px,10vw,160px);   /* セクション間 */
  --sp-blk:clamp(56px,6vw,104px);    /* セクション内のブロック間 */
  --sp-el:clamp(36px,4vw,64px);      /* 要素間 */
  --sec-y:var(--sp-sec);

  /* --- 形 --- */
  --r-s:6px; --r-m:12px; --r-l:24px; --r-pill:999px;
  --shadow:0 6px 24px rgba(14,49,19,.10), 0 1px 2px rgba(14,49,19,.06);
  --shadow-lg:0 12px 32px rgba(14,49,19,.16);

  /* --- 動き --- */
  --e:cubic-bezier(.23,1,.32,1);
  --d:.5s;

  /* --- 版面 --- */
  --w-max:1120px;
  --w-gut:clamp(18px,4vw,32px);
}

/* =========================================================
   基盤 v1  — リセット + 版面 + スクロール表示
   IntersectionObserver も GSAP も使わない（scroll位置 + class）
   JSが死んでも .fx-on が付かず、中身は最初から見えている
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--f-sans);color:var(--c-ink2);background:var(--c-bg);
  line-height:var(--lh-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
:where(a,button,input,textarea,select):focus-visible{
  outline:3px solid var(--c-primary);outline-offset:3px;border-radius:var(--r-s)}

/* 版面 */
.wrap{width:100%;max-width:var(--w-max);margin-inline:auto;padding-inline:var(--w-gut)}
.sec{padding-block:var(--sec-y)}
.sec--alt{background:var(--c-bg2)}
/* 地の階段。kit の tone で切り替える */
.tone-base{background:var(--c-bg)}
.tone-tint{background:var(--c-bg2)}
.tone-accent{background:var(--c-bg3)}
.tone-dark{background:var(--c-dark);color:#D9E3DB}
.tone-dark .h-lead,.tone-dark h2,.tone-dark h3{color:var(--c-on-dark)}
.tone-dark .h-eyebrow{color:#8FD6A0}
/* 面は必ず地から浮かせる。白の上の白は最頻の指摘 */
.card,.panel,[class*="__card"],[class*="__panel"]{box-shadow:var(--shadow)}
.nb{white-space:nowrap}          /* 日本語の改行制御。必ず <wbr> と併用 */

/* ── セクション見出し：1系統に統一する ──────────────
   type/two-tier-latin-jp  欧文ラベルと和文を2段に組み、
   級数・太さ・色の主従をわざと逆転させる（欧文は極小・和文が主）。
   検算で「見出しの様式が8系統」と出たため、全セクションこれに揃える。 */
.sec-head{margin-bottom:var(--sp-el)}
.sec-head__en{display:flex;align-items:center;gap:var(--s3);
  font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--c-primary);
  text-transform:uppercase;margin-bottom:var(--s3)}
.sec-head__en::before{content:"";width:24px;height:2px;background:currentColor;flex:none}
.sec-head__ja{font-family:var(--f-disp);font-weight:900;color:var(--c-ink);
  font-size:clamp(23px,3.2vw,34px);line-height:1.42;letter-spacing:.01em}
.sec-head__sub{margin-top:var(--s4);font-size:var(--fs-base);color:var(--c-ink3);max-width:44em}
.tone-dark .sec-head__en{color:#8FD6A0}
.tone-dark .sec-head__ja{color:var(--c-on-dark)}

/* 見出しの型（案件をまたいで共通の骨） */
.h-eyebrow{display:flex;align-items:center;gap:var(--s3);
  font-size:var(--fs-sm);font-weight:700;color:var(--c-primary);letter-spacing:.08em}
.h-eyebrow::before{content:"";width:28px;height:2px;background:currentColor;flex:none}
.h-lead{font-family:var(--f-disp);font-weight:900;color:var(--c-ink);
  font-size:clamp(24px,3.4vw,var(--fs-2xl));line-height:var(--lh-head);letter-spacing:.01em}
.h-sub{margin-top:var(--s4);font-size:var(--fs-base);color:var(--c-ink3)}

/* ボタン */
/* CTAは1形だけ。ピル＋右端に白丸の矢印。
   検算で「10個・6種類の形」が出たため、形の差で主従を作るのをやめ、
   大きさだけで主従をつける（.btn--sm が従）。 */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--s3);
  background:var(--c-primary);color:var(--c-on-primary);font-weight:700;font-size:var(--fs-md);
  height:72px;padding:0 76px 0 40px;border-radius:var(--r-pill);border:0;cursor:pointer;
  transition:background .16s var(--e),transform .16s var(--e)}
.btn::after{content:"";position:absolute;right:20px;top:50%;width:32px;height:32px;margin-top:-16px;
  border-radius:50%;background:var(--c-on-primary);
  -webkit-mask:no-repeat center/11px 11px url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 1l5 5-5 5' fill='none' stroke='%23000' stroke-width='2'/></svg>");
  mask:no-repeat center/11px 11px url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 1l5 5-5 5' fill='none' stroke='%23000' stroke-width='2'/></svg>")}
.btn--sm{height:48px;padding:0 24px;font-size:var(--fs-sm)}
.btn--sm::after{display:none}
.btn:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.btn:hover{background:var(--c-primary-d)}}
.btn--ghost{background:transparent;color:var(--c-primary);box-shadow:inset 0 0 0 2px currentColor}
.btn--accent{background:var(--c-accent)}

/* ── スクロール表示 ───────────────────────────────
   .fx を付けた要素が、画面に入ったら .hh-in が付いて現れる。
   親（body）に .fx-on が無い間は「最初から見えている」＝失敗しても安全。
   data-fx で出方を指定：fadeup / fadeblur / left / right / scale / clip / mask
   data-d で遅延（ms）を指定：<div class="fx" data-fx="left" data-d="120">
   ─────────────────────────────────────────────── */
.fx-on .fx{opacity:0;will-change:opacity,transform,filter,clip-path;
  transition:opacity var(--d) var(--e),transform var(--d) var(--e),
             filter var(--d) var(--e),clip-path var(--d) var(--e)}
.fx-on .fx[data-fx="fadeup"],
.fx-on .fx:not([data-fx]){transform:translateY(26px)}
.fx-on .fx[data-fx="fadeblur"]{filter:blur(10px);transform:translateY(14px)}
.fx-on .fx[data-fx="left"]{transform:translateX(-44px)}
.fx-on .fx[data-fx="right"]{transform:translateX(44px)}
.fx-on .fx[data-fx="scale"]{transform:scale(.94)}
.fx-on .fx[data-fx="clip"]{clip-path:inset(0 100% 0 0)}
.fx-on .fx[data-fx="mask"]{clip-path:inset(100% 0 0 0)}
.fx-on .fx.hh-in{opacity:1;transform:none;filter:none;clip-path:inset(0 0 0 0)}

/* 常時動くもの（うるさくならない程度に） */
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.floaty{animation:floaty 4.5s var(--e) infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fx-on .fx{opacity:1!important;transform:none!important;filter:none!important;clip-path:none!important;transition:none!important}
  .floaty{animation:none}
  *{animation-duration:.001s!important}
}

/* numbers/numbers-compare-bars — 同じ指標を区分ごとに横バーで積む
   ── 効かせている工夫 ─────────────────────────────
   color/rival-desaturated : 結論の1本だけが色相を持ち、残りは【同じ明度の無彩色】。
     ばらけた明度で「薄い＝悪い」と読ませない。差し色を消しても順位は数値が持つ。
   rule/table-no-grid      : 枠・格子罫・ヘッダ地色を全部消し、線は行の区切り1本だけ。
     線が減るぶん、面の1段（地→パネル）と数値の位置揃えが表として効く。
   ───────────────────────────────────────────── */

.ncb{
  /* バーの無彩色。--c-accent とほぼ同じ相対輝度（0.42）に合わせてあるので、
     並べたときに差として残るのは【彩度の有無だけ】になる。
     ここを薄くすると 100% の行が「悪い数字」に見えるので落とさない。 */
  --ncb-dim:color-mix(in srgb,var(--c-ink) 36%,var(--c-bg));
  --ncb-dim-l:color-mix(in srgb,var(--c-ink) 18%,var(--c-bg));  /* 基準バー（比較型） */
  --ncb-rule:color-mix(in srgb,var(--c-ink) 8%,transparent);    /* 行の区切り1本 */
  --ncb-numw:var(--s8);   /* 数値の列幅。右端で揃えるための固定列 */
  --ncb-h:var(--s5);      /* バーの高さ */
}

/* ── 見出し ─────────────────────────────
   .sec-head（欧文ラベル＋和文）をそのまま使う。独自の様式は作らない */
.ncb__head{max-width:44em}

/* ── バーを載せる面 ───────────────────────
   枠線も影も持たない。地（tone）から明度を1段だけ落として面を作る。
   ＝ 線を1本も足さずに①輝度の段差を作るのがこの面の役目 */
.ncb__chart{background:var(--c-bg2);border-radius:var(--r-l);
  padding:var(--s7) var(--s6)}
/* 地がすでに1段落ちているトーンでは、逆に1段上げて段差を保つ */
.tone-tint .ncb__chart,.tone-accent .ncb__chart{background:var(--c-bg)}

/* ＼ 一言 ／（任意）。斜線は擬似要素。押せる場所ではないので緑は使わない */
.ncb__ttl{display:flex;align-items:center;justify-content:center;gap:var(--s4);
  font-family:var(--f-disp);font-weight:900;color:var(--c-ink);
  font-size:var(--fs-md);line-height:var(--lh-tight);letter-spacing:.04em;
  margin-bottom:var(--s5)}
.ncb__ttl::before,.ncb__ttl::after{content:"";flex:none;
  width:.12em;height:1.5em;background:var(--c-ink3);border-radius:var(--r-pill)}
.ncb__ttl::before{transform:rotate(-20deg)}
.ncb__ttl::after{transform:rotate(20deg)}

/* ── 行 ───────────────────────────────
   罫は行と行のあいだの1本だけ。縦罫・外枠・ヘッダ地色は引かない。
   行の面色も敷かない（主役の行に面を敷くと「2色で塗り分け」に戻る） */
.ncb__rows{display:flex;flex-direction:column}
.ncb__row{display:grid;grid-template-columns:var(--s8) minmax(0,1fr);
  align-items:center;column-gap:var(--s5);padding-block:var(--s4)}
.ncb__row+.ncb__row{border-top:1px solid var(--ncb-rule)}
.ncb__row:first-child{padding-top:0}
.ncb__row:last-child{padding-bottom:0}

.ncb__label{text-align:right;font-weight:700;color:var(--c-ink);
  font-size:var(--fs-md);line-height:var(--lh-tight);font-feature-settings:"palt"}
.ncb__sub{display:block;margin-top:var(--s1);font-size:var(--fs-note);font-weight:500;color:var(--c-ink3)}

/* バー＋数値。数値は固定幅の列に入れて右端で縦に揃える。
   位置揃えが揃うほど、罫が無くても「表」として読める */
.ncb__bars{display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.ncb__line{display:grid;grid-template-columns:minmax(0,1fr) var(--ncb-numw);
  align-items:center;column-gap:var(--s4);min-width:0}

/* バー長は --ncb-p（0〜100の素の数値）＝ 列幅に対する％。
   目盛りの溝（トラック）は敷かない。残りを塗ると「もう一つのデータ」に見える */
.ncb__bar{width:calc(var(--ncb-p) * 1%);min-width:var(--s5);height:var(--ncb-h);
  border-radius:0 var(--r-s) var(--r-s) 0;overflow:hidden;
  display:flex;align-items:center;padding-inline:var(--s3);
  background:var(--ncb-dim);color:var(--c-ink)}
.ncb__bar--base{background:var(--ncb-dim-l);color:var(--c-ink2)}
/* 色相を持つのはここ1本だけ。＝このセクションの差し色は1箇所 */
.ncb__row--lead .ncb__bar--main{background:var(--c-accent)}
.ncb__inbar{font-size:var(--fs-note);font-weight:700;line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 数値。色は全行そろえ、主役だけ級数を上げる。
   ウェイトは全行 900 のまま落とさない（落とすと 100% が弱く見える） */
.ncb__num{justify-self:end;white-space:nowrap;font-family:var(--f-num);font-weight:900;
  line-height:1;color:var(--c-ink);font-variant-numeric:tabular-nums;font-size:var(--fs-xl)}
.ncb__num b{font-weight:inherit}
.ncb__num i{font-style:normal;font-family:var(--f-sans);font-size:.5em;
  color:var(--c-ink3);margin-left:.08em}
.ncb__num--base{font-size:var(--fs-sm);font-weight:700;color:var(--c-ink3)}
.ncb__row--lead .ncb__num{font-size:var(--fs-2xl)}

/* 差分チップ（任意）。数値の下・右端に揃える。差し色はバーで使い切っている */
.ncb__badge{grid-column:2;justify-self:end;margin-top:var(--s2);
  padding:var(--s1) var(--s3);border-radius:var(--r-pill);
  background:color-mix(in srgb,var(--c-ink) 10%,var(--c-bg));color:var(--c-ink);
  font-weight:900;font-size:var(--fs-sm);line-height:1.5;white-space:nowrap}

.ncb__note{margin-top:var(--s4);font-size:var(--fs-note);color:var(--c-ink3);line-height:var(--lh-body)}

/* ── 動き ─────────────────────────────
   行に .hh-in が付いたらバーが左から伸び、遅れて数値が出る。気配の範囲に留める。
   JSが動かないと .fx-on が付かない＝最初から全部見えている（安全側） */
.fx-on .ncb__bar{clip-path:inset(0 100% 0 0);transition:clip-path var(--d) var(--e) .08s}
.fx-on .ncb__row.hh-in .ncb__bar{clip-path:inset(0)}
.fx-on .ncb__num{opacity:0;transform:translateX(calc(var(--s2) * -1));
  transition:opacity .34s var(--e) .34s,transform .34s var(--e) .34s}
.fx-on .ncb__row.hh-in .ncb__num{opacity:1;transform:none}
.fx-on .ncb__badge{opacity:0;transition:opacity .34s var(--e) .46s}
.fx-on .ncb__row.hh-in .ncb__badge{opacity:1}

/* ── SP：ラベルをバーの上へ。数値の列だけは揃えたまま残す ── */
@media(max-width:900px){
  .ncb__chart{padding:var(--s6) var(--s5)}
  .ncb__row{grid-template-columns:minmax(0,1fr);row-gap:var(--s2);padding-block:var(--s5)}
  .ncb__label{text-align:left;font-size:var(--fs-base)}
  .ncb__sub{display:inline;margin-left:var(--s2)}
}
@media(max-width:560px){
  .ncb{--ncb-numw:var(--s7);--ncb-h:var(--s4)}
  .ncb__chart{padding:var(--s5) var(--s4)}
  .ncb__line{column-gap:var(--s3)}
  .ncb__num{font-size:var(--fs-lg)}
  .ncb__row--lead .ncb__num{font-size:var(--fs-xl)}
  .ncb__label{font-size:var(--fs-sm)}
}

@media(prefers-reduced-motion:reduce){
  .fx-on .ncb__bar{clip-path:none!important;transition:none!important}
  .fx-on .ncb__num{opacity:1!important;transform:none!important;transition:none!important}
  .fx-on .ncb__badge{opacity:1!important;transition:none!important}
}

body{background:#fff}</style></head><body>
<section class="sec ncb">
  <div class="wrap">

    <div class="sec-head ncb__head">
      <p class="sec-head__en fx" data-fx="left">小見出しがここに入ります</p>
      <h2 class="sec-head__ja fx" data-fx="fadeup" data-d="70"><span class="nb">見出しがここに入り、</span><wbr><span class="nb">数字の<em>結論</em>まで</span><wbr><span class="nb">言い切ります</span></h2>
    </div>

    <div class="ncb__chart fx" data-fx="fadeup" data-d="120">
      <p class="ncb__ttl">カードの上に置く一言</p>

      <ul class="ncb__rows" role="list">
        <li class="ncb__row fx" data-fx="fadeup" data-d="0">
          <p class="ncb__label">区分A</p>
          <div class="ncb__bars">
            
            <div class="ncb__line">
              <div class="ncb__bar ncb__bar--main" style="--ncb-p:100"></div>
              <p class="ncb__num"><b>100</b><i>%</i></p>
              
            </div>
          </div>
        </li><li class="ncb__row fx" data-fx="fadeup" data-d="90">
          <p class="ncb__label">区分B</p>
          <div class="ncb__bars">
            
            <div class="ncb__line">
              <div class="ncb__bar ncb__bar--main" style="--ncb-p:88"></div>
              <p class="ncb__num"><b>88</b><i>%</i></p>
              
            </div>
          </div>
        </li><li class="ncb__row fx" data-fx="fadeup" data-d="180">
          <p class="ncb__label">区分C</p>
          <div class="ncb__bars">
            
            <div class="ncb__line">
              <div class="ncb__bar ncb__bar--main" style="--ncb-p:86"></div>
              <p class="ncb__num"><b>86</b><i>%</i></p>
              
            </div>
          </div>
        </li><li class="ncb__row fx" data-fx="fadeup" data-d="270">
          <p class="ncb__label">区分D</p>
          <div class="ncb__bars">
            
            <div class="ncb__line">
              <div class="ncb__bar ncb__bar--main" style="--ncb-p:64"></div>
              <p class="ncb__num"><b>64</b><i>%</i></p>
              
            </div>

<script>
/* スクロール表示：画面に入ったら .hh-in を付ける（IO不使用） */
(function(){
  var els=[].slice.call(document.querySelectorAll('.fx'));
  if(!els.length) return;
  document.body.classList.add('fx-on');
  var scrolled=false, ticking=false;
  function show(el){
    var d=parseInt(el.dataset.d||'0',10);
    if(d) setTimeout(function(){el.classList.add('hh-in')},d);
    else el.classList.add('hh-in');
  }
  function check(){
    ticking=false;
    var vh=window.innerHeight, i;
    for(i=els.length-1;i>=0;i--){
      var el=els[i], r=el.getBoundingClientRect();
      if(r.top < vh*0.88 && r.bottom > 0){ show(el); els.splice(i,1); }
    }
  }
  function onScroll(){ scrolled=true; if(!ticking){ ticking=true; requestAnimationFrame(check); } }
  addEventListener('scroll',onScroll,{passive:true});
  addEventListener('resize',onScroll,{passive:true});
  check();                                   /* 初期表示分 */
  /* 保険：20秒たっても一度もスクロールされなければ全部出す */
  setTimeout(function(){ if(!scrolled){ els.forEach(function(e){e.classList.add('hh-in')}); els.length=0; } },20000);
})();
</script></body></html>
