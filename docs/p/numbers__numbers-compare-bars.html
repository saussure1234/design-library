<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>比較バー（ラベル＋横バー＋右端の数値を積む）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>/* =========================================================
   トークン契約 v1
   すべてのパーツは「ここに定義された変数だけ」を使う。
   案件ごとに :root を差し替えれば、全パーツが即座に着替える。
   ここに無い色・サイズをパーツ内で直書きしたら契約違反。
   ========================================================= */
:root{
  /* --- 色 --- */
  --c-primary:#00B220;      /* 主色（CTA・強調） */
  --c-primary-d:#05A81F;    /* 主色の押下/hover */
  --c-primary-l:#E8F7EA;    /* 主色の淡色（面） */
  --c-accent:#FF9301;       /* 差し色（1箇所だけ効かせる） */
  --c-ink:#111111;          /* 見出し */
  --c-ink2:#333333;         /* 本文 */
  --c-ink3:#707070;         /* 補足・注記 */
  --c-bg:#FFFFFF;           /* 地 */
  --c-bg2:#F7F8F7;          /* 交互に敷く面 */
  --c-line:#E3E3E3;         /* 罫 */
  --c-on-primary:#FFFFFF;   /* 主色の上に乗る文字 */

  /* --- 書体 --- */
  --f-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-disp:var(--f-sans);   /* 見出し用に別書体を当てる場合はここだけ変える */
  --f-num:"Helvetica Neue",Arial,var(--f-sans);

  /* --- 文字サイズ（PC基準・clampはパーツ側で組む） --- */
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px;
  --fs-lg:21px;   --fs-xl:28px; --fs-2xl:38px;  --fs-3xl:50px; --fs-4xl:64px;
  --lh-tight:1.35; --lh-head:1.5; --lh-body:1.9;

  /* --- 余白 --- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --s6:36px; --s7:52px; --s8:76px; --s9:110px;
  --sec-y:clamp(56px,7vw,110px);   /* セクションの上下 */

  /* --- 形 --- */
  --r-s:6px; --r-m:12px; --r-l:24px; --r-pill:999px;
  --shadow:0 6px 24px rgba(17,17,17,.08);

  /* --- 動き --- */
  --e:cubic-bezier(.23,1,.32,1);
  --d:.5s;

  /* --- 版面 --- */
  --w-max:1120px;
  --w-gut:clamp(18px,4vw,32px);
}

/* =========================================================
   基盤 v1  — リセット + 版面 + スクロール表示
   IntersectionObserver も GSAP も使わない（scroll位置 + class）
   JSが死んでも .fx-on が付かず、中身は最初から見えている
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--f-sans);color:var(--c-ink2);background:var(--c-bg);
  line-height:var(--lh-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
:where(a,button,input,textarea,select):focus-visible{
  outline:3px solid var(--c-primary);outline-offset:3px;border-radius:var(--r-s)}

/* 版面 */
.wrap{width:100%;max-width:var(--w-max);margin-inline:auto;padding-inline:var(--w-gut)}
.sec{padding-block:var(--sec-y)}
.sec--alt{background:var(--c-bg2)}
.nb{white-space:nowrap}          /* 日本語の改行制御。必ず <wbr> と併用 */

/* 見出しの型（案件をまたいで共通の骨） */
.h-eyebrow{display:flex;align-items:center;gap:var(--s3);
  font-size:var(--fs-sm);font-weight:700;color:var(--c-primary);letter-spacing:.08em}
.h-eyebrow::before{content:"";width:28px;height:2px;background:currentColor;flex:none}
.h-lead{font-family:var(--f-disp);font-weight:900;color:var(--c-ink);
  font-size:clamp(24px,3.4vw,var(--fs-2xl));line-height:var(--lh-head);letter-spacing:.01em}
.h-sub{margin-top:var(--s4);font-size:var(--fs-base);color:var(--c-ink3)}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s3);
  background:var(--c-primary);color:var(--c-on-primary);font-weight:700;font-size:var(--fs-md);
  padding:18px 34px;border-radius:var(--r-s);border:0;cursor:pointer;
  transition:background .16s var(--e),transform .16s var(--e)}
.btn:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.btn:hover{background:var(--c-primary-d)}}
.btn--ghost{background:transparent;color:var(--c-primary);box-shadow:inset 0 0 0 2px currentColor}
.btn--accent{background:var(--c-accent)}

/* ── スクロール表示 ───────────────────────────────
   .fx を付けた要素が、画面に入ったら .hh-in が付いて現れる。
   親（body）に .fx-on が無い間は「最初から見えている」＝失敗しても安全。
   data-fx で出方を指定：fadeup / fadeblur / left / right / scale / clip / mask
   data-d で遅延（ms）を指定：<div class="fx" data-fx="left" data-d="120">
   ─────────────────────────────────────────────── */
.fx-on .fx{opacity:0;will-change:opacity,transform,filter,clip-path;
  transition:opacity var(--d) var(--e),transform var(--d) var(--e),
             filter var(--d) var(--e),clip-path var(--d) var(--e)}
.fx-on .fx[data-fx="fadeup"],
.fx-on .fx:not([data-fx]){transform:translateY(26px)}
.fx-on .fx[data-fx="fadeblur"]{filter:blur(10px);transform:translateY(14px)}
.fx-on .fx[data-fx="left"]{transform:translateX(-44px)}
.fx-on .fx[data-fx="right"]{transform:translateX(44px)}
.fx-on .fx[data-fx="scale"]{transform:scale(.94)}
.fx-on .fx[data-fx="clip"]{clip-path:inset(0 100% 0 0)}
.fx-on .fx[data-fx="mask"]{clip-path:inset(100% 0 0 0)}
.fx-on .fx.hh-in{opacity:1;transform:none;filter:none;clip-path:inset(0 0 0 0)}

/* 常時動くもの（うるさくならない程度に） */
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.floaty{animation:floaty 4.5s var(--e) infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fx-on .fx{opacity:1!important;transform:none!important;filter:none!important;clip-path:none!important;transition:none!important}
  .floaty{animation:none}
  *{animation-duration:.001s!important}
}

/* numbers/numbers-compare-bars — 割合／前後を横バーで1行ずつ積む
   行＝1単位。左に固定幅ラベル、右にバー、数値はバーの右端の「外」。
   lead を立てた行だけ差し色＋級数を上げて主役にする。
   基準バー（basePct）を足すと「受講前→受講後」の比較型になる。 */

/* 値100のときバーが取る幅。残りが数値とふきだしの置き場になる。
   数値が大きいほど、ここを絞らないと右端からはみ出す。 */
.ncb{--ncb-span:86%}

/* ── 見出し ───────────────────────────── */
.ncb__head{text-align:center}
.ncb__eyebrow{justify-content:center;margin-bottom:var(--s3)}
.ncb__h{margin-bottom:clamp(20px,3vw,var(--s6))}
.ncb__h em{font-style:normal;color:var(--c-primary-d)}

/* ── 白カード ─────────────────────────── */
.ncb__card{background:var(--c-bg);border:1px solid var(--c-line);
  border-radius:var(--r-l);box-shadow:var(--shadow);
  padding:clamp(20px,3.2vw,var(--s7)) clamp(14px,3.2vw,var(--s7))}

/* ＼ 一言 ／ の斜線は擬似要素で。em基準なので文字サイズに追従する */
.ncb__cardtitle{display:flex;align-items:center;justify-content:center;gap:var(--s4);
  font-family:var(--f-disp);font-weight:900;color:var(--c-ink);
  font-size:clamp(15px,1.9vw,var(--fs-md));line-height:var(--lh-tight);letter-spacing:.04em;
  margin-bottom:clamp(16px,2.4vw,var(--s5))}
.ncb__cardtitle::before,.ncb__cardtitle::after{content:"";flex:none;
  width:.12em;height:1.5em;background:var(--c-primary);border-radius:var(--r-pill)}
.ncb__cardtitle::before{transform:rotate(-20deg)}
.ncb__cardtitle::after{transform:rotate(20deg)}

/* ── 行 ───────────────────────────────── */
.ncb__rows{display:flex;flex-direction:column;gap:var(--s2)}
.ncb__row{display:grid;grid-template-columns:clamp(52px,6.4vw,84px) minmax(0,1fr);
  align-items:center;gap:var(--s4);
  padding:var(--s2) var(--s3);border-radius:var(--r-m)}
.ncb__row--lead{background:var(--c-bg2)}

.ncb__label{text-align:right;font-weight:700;color:var(--c-ink);
  font-size:clamp(13px,1.5vw,var(--fs-md));line-height:var(--lh-tight);
  font-feature-settings:"palt"}
.ncb__sub{display:block;margin-top:.15em;font-size:var(--fs-note);font-weight:500;color:var(--c-ink3)}

.ncb__bars{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.ncb__line{display:flex;align-items:center;gap:var(--s3);min-width:0}

/* バー長は --ncb-p（0〜100の素の数値）× --ncb-span。
   min-width は「短い値でもバーとして見える」下限。
   flex-shrink を1にしてあるのは、数値やふきだしが長すぎたときに
   バーだけが縮んで受け止め、カードの外へはみ出さないようにするため。 */
.ncb__bar{flex:0 1 auto;width:calc(var(--ncb-p) * var(--ncb-span) / 100);min-width:var(--s6);
  height:clamp(18px,2.2vw,var(--s5));border-radius:var(--r-pill);overflow:hidden;
  display:flex;align-items:center;padding-inline:var(--s3);
  background:var(--c-primary);color:var(--c-on-primary)}
.ncb__bar--base{background:var(--c-line);color:var(--c-ink2)}
.ncb__row--lead .ncb__bar--main{background:var(--c-accent);color:var(--c-ink)}
.ncb__inbar{font-size:var(--fs-note);font-weight:700;line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 数値。主役と基準で級数差を大きく取るのがこの型の肝 */
.ncb__num{flex:none;white-space:nowrap;font-family:var(--f-num);font-weight:900;
  line-height:1;color:var(--c-ink);font-variant-numeric:tabular-nums;
  font-size:clamp(19px,2.4vw,var(--fs-xl))}
.ncb__num b{font-weight:inherit}
.ncb__num i{font-style:normal;font-family:var(--f-sans);font-size:.5em;margin-left:.08em}
.ncb__num--base{font-size:var(--fs-sm);font-weight:700;color:var(--c-ink3)}
.ncb__row--lead .ncb__num{color:var(--c-accent);font-size:clamp(28px,4vw,var(--fs-2xl))}

/* 差分ふきだし（任意）。バー領域の外へ出す */
.ncb__badge{position:relative;flex:none;display:inline-flex;align-items:center;
  margin-left:var(--s2);padding:var(--s1) var(--s3);border-radius:var(--r-pill);
  background:var(--c-accent);color:var(--c-ink);font-weight:900;
  font-size:clamp(11px,1.3vw,var(--fs-sm));line-height:1.5}
.ncb__badge::before{content:"";position:absolute;left:calc(.46em * -1);top:50%;
  width:.5em;height:.66em;transform:translateY(-50%);background:var(--c-accent);
  clip-path:polygon(100% 0,100% 100%,0 50%)}

.ncb__note{margin-top:var(--s4);font-size:var(--fs-note);color:var(--c-ink3);line-height:1.8}

/* ── 動き ─────────────────────────────
   行に .hh-in が付いた時点でバーが左から伸び、遅れて数値・ふきだしが出る。
   JSが動かないと .fx-on が付かない＝最初から全部見えている（安全側） */
.fx-on .ncb__bar{clip-path:inset(0 100% 0 0 round var(--r-pill));
  transition:clip-path .62s var(--e) .08s}
.fx-on .ncb__row.hh-in .ncb__bar{clip-path:inset(0 round var(--r-pill))}
.fx-on .ncb__num{opacity:0;transform:translateX(calc(var(--s2) * -1));
  transition:opacity .34s var(--e) .5s,transform .34s var(--e) .5s}
.fx-on .ncb__row.hh-in .ncb__num{opacity:1;transform:none}
@keyframes ncb-pop{0%{opacity:0;transform:scale(.8)}60%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
.fx-on .ncb__badge{opacity:0}
.fx-on .ncb__row.hh-in .ncb__badge{animation:ncb-pop .42s var(--e) .62s both}

/* ── SP：ラベルをバーの上へ、行間を広げて境目を保つ ── */
@media(max-width:900px){
  .ncb{--ncb-span:84%}   /* ラベルが上に移り、行の全幅がバーに使える */
  .ncb__rows{gap:var(--s3)}
  .ncb__row{grid-template-columns:minmax(0,1fr);gap:var(--s2);padding:var(--s3)}
  .ncb__label{text-align:left;font-size:var(--fs-sm)}
  .ncb__sub{display:inline;margin-left:var(--s2)}
  .ncb__num{font-size:clamp(19px,4.4vw,var(--fs-xl))}
  .ncb__row--lead .ncb__num{font-size:clamp(25px,6.2vw,var(--fs-xl))}
  .ncb__note{margin-top:var(--s3)}
}
@media(max-width:560px){
  .ncb{--ncb-span:74%}   /* 数値が相対的に大きくなるぶん、バーの取り分を絞る */
  .ncb__line{flex-wrap:wrap;gap:var(--s2)}
  .ncb__bar{padding-inline:var(--s2)}
  .ncb__badge{font-size:var(--fs-note);margin-left:auto}
  .ncb__badge::before{display:none}
}

@media(prefers-reduced-motion:reduce){
  .fx-on .ncb__bar{clip-path:none!important;transition:none!important}
  .fx-on .ncb__num{opacity:1!important;transform:none!important;transition:none!important}
  .fx-on .ncb__badge{opacity:1!important;animation:none!important}
}

body{background:#fff}</style></head><body>
<section class="sec sec--alt ncb">
  <div class="wrap">

    <div class="ncb__head">
      <p class="h-eyebrow ncb__eyebrow fx" data-fx="left">小見出しがここに入ります</p>
      <h2 class="h-lead ncb__h fx" data-fx="fadeup" data-d="70"><span class="nb">見出しがここに入り、</span><wbr><span class="nb">数字の<em>結論</em>まで</span><wbr><span class="nb">言い切ります</span></h2>
    </div>

    <div class="ncb__card fx" data-fx="fadeup" data-d="120">
      <p class="ncb__cardtitle">カードの上に置く一言</p>

      <ul class="ncb__rows" role="list">
        <li class="ncb__row fx" data-fx="fadeup" data-d="0">
          <p class="ncb__label">区分A</p>
          <div class="ncb__bars">
            
            <div class="ncb__line">
              <div class="ncb__bar ncb__bar--main" style="--ncb-p:100"></div>
              <p class="ncb__num"><b>100</b><i>%</i></p>
              
            </div>
          </div>
        </li><li class="ncb__row fx" data-fx="fadeup" data-d="90">
          <p class="ncb__label">区分B</p>
          <div class="ncb__bars">
            
            <div class="ncb__line">
              <div class="ncb__bar ncb__bar--main" style="--ncb-p:88"></div>
              <p class="ncb__num"><b>88</b><i>%</i></p>
              
            </div>
          </div>
        </li><li class="ncb__row fx" data-fx="fadeup" data-d="180">
          <p class="ncb__label">区分C</p>
          <div class="ncb__bars">
            
            <div class="ncb__line">
              <div class="ncb__bar ncb__bar--main" style="--ncb-p:86"></div>
              <p class="ncb__num"><b>86</b><i>%</i></p>
              
            </div>
          </div>
        </li><li class="ncb__row fx" data-fx="fadeup" data-d="270">
          <p class="ncb__label">区分D</p>
          <div class="ncb__bars">
            
            <div class="ncb__line">
              <div class="ncb__bar ncb__bar--main" style="--ncb-p:64"></div>
              <p class="ncb__num"><b>64</b><i>%</i></p>
              
            </div>
          </div>
        </li><li class="ncb__row ncb__row--lead fx" data-fx="fadeup" data-d="360">
          <p class="ncb__label">区分E</p>
          <div class="ncb__bars">
            
            <div class="ncb__line">
              <div class="ncb__bar ncb__bar--main" style="--ncb-p:75"></div>
              <p class="ncb__num"><b>75</b><i>%</i></p>
              <p class="ncb__badge">ここを強調</p>
            </div>
          </div>
        </li>
      </ul>
    </div>

    <p class="ncb__note fx" data-fx="fadeup">※注記。調査の対象・期間・条件や出典をここに1行で書きます</p>

  </div>
</section>

<script>
/* スクロール表示：画面に入ったら .hh-in を付ける（IO不使用） */
(function(){
  var els=[].slice.call(document.querySelectorAll('.fx'));
  if(!els.length) return;
  document.body.classList.add('fx-on');
  var scrolled=false, ticking=false;
  function show(el){
    var d=parseInt(el.dataset.d||'0',10);
    if(d) setTimeout(function(){el.classList.add('hh-in')},d);
    else el.classList.add('hh-in');
  }
  function check(){
    ticking=false;
    var vh=window.innerHeight, i;
    for(i=els.length-1;i>=0;i--){
      var el=els[i], r=el.getBoundingClientRect();
      if(r.top < vh*0.88 && r.bottom > 0){ show(el); els.splice(i,1); }
    }
  }
  function onScroll(){ scrolled=true; if(!ticking){ ticking=true; requestAnimationFrame(check); } }
  addEventListener('scroll',onScroll,{passive:true});
  addEventListener('resize',onScroll,{passive:true});
  check();                                   /* 初期表示分 */
  /* 保険：20秒たっても一度もスクロールされなければ全部出す */
  setTimeout(function(){ if(!scrolled){ els.forEach(function(e){e.classList.add('hh-in')}); els.length=0; } },20000);
})();
</script></body></html>
