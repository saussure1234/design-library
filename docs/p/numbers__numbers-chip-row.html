<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>ラベルタブ付きチップの横並び（数値でも名前でも置ける）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>/* =========================================================
   トークン契約 v1
   すべてのパーツは「ここに定義された変数だけ」を使う。
   案件ごとに :root を差し替えれば、全パーツが即座に着替える。
   ここに無い色・サイズをパーツ内で直書きしたら契約違反。
   ========================================================= */
:root{
  /* --- 色 --- */
  --c-primary:#00B220;      /* 主色（CTA・強調） */
  --c-primary-d:#05A81F;    /* 主色の押下/hover */
  --c-primary-l:#E8F7EA;    /* 主色の淡色（面） */
  --c-accent:#FF9301;       /* 差し色（1箇所だけ効かせる） */
  --c-ink:#111111;          /* 見出し */
  --c-ink2:#333333;         /* 本文 */
  --c-ink3:#707070;         /* 補足・注記 */
  --c-bg:#FFFFFF;           /* 地 */
  --c-bg2:#F7F8F7;          /* 交互に敷く面 */
  --c-line:#E3E3E3;         /* 罫 */
  --c-on-primary:#FFFFFF;   /* 主色の上に乗る文字 */

  /* --- 書体 --- */
  --f-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-disp:var(--f-sans);   /* 見出し用に別書体を当てる場合はここだけ変える */
  --f-num:"Helvetica Neue",Arial,var(--f-sans);

  /* --- 文字サイズ（PC基準・clampはパーツ側で組む） --- */
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px;
  --fs-lg:21px;   --fs-xl:28px; --fs-2xl:38px;  --fs-3xl:50px; --fs-4xl:64px;
  --lh-tight:1.35; --lh-head:1.5; --lh-body:1.9;

  /* --- 余白 --- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --s6:36px; --s7:52px; --s8:76px; --s9:110px;
  --sec-y:clamp(56px,7vw,110px);   /* セクションの上下 */

  /* --- 形 --- */
  --r-s:6px; --r-m:12px; --r-l:24px; --r-pill:999px;
  --shadow:0 6px 24px rgba(17,17,17,.08);

  /* --- 動き --- */
  --e:cubic-bezier(.23,1,.32,1);
  --d:.5s;

  /* --- 版面 --- */
  --w-max:1120px;
  --w-gut:clamp(18px,4vw,32px);
}

/* =========================================================
   基盤 v1  — リセット + 版面 + スクロール表示
   IntersectionObserver も GSAP も使わない（scroll位置 + class）
   JSが死んでも .fx-on が付かず、中身は最初から見えている
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--f-sans);color:var(--c-ink2);background:var(--c-bg);
  line-height:var(--lh-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
:where(a,button,input,textarea,select):focus-visible{
  outline:3px solid var(--c-primary);outline-offset:3px;border-radius:var(--r-s)}

/* 版面 */
.wrap{width:100%;max-width:var(--w-max);margin-inline:auto;padding-inline:var(--w-gut)}
.sec{padding-block:var(--sec-y)}
.sec--alt{background:var(--c-bg2)}
.nb{white-space:nowrap}          /* 日本語の改行制御。必ず <wbr> と併用 */

/* 見出しの型（案件をまたいで共通の骨） */
.h-eyebrow{display:flex;align-items:center;gap:var(--s3);
  font-size:var(--fs-sm);font-weight:700;color:var(--c-primary);letter-spacing:.08em}
.h-eyebrow::before{content:"";width:28px;height:2px;background:currentColor;flex:none}
.h-lead{font-family:var(--f-disp);font-weight:900;color:var(--c-ink);
  font-size:clamp(24px,3.4vw,var(--fs-2xl));line-height:var(--lh-head);letter-spacing:.01em}
.h-sub{margin-top:var(--s4);font-size:var(--fs-base);color:var(--c-ink3)}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s3);
  background:var(--c-primary);color:var(--c-on-primary);font-weight:700;font-size:var(--fs-md);
  padding:18px 34px;border-radius:var(--r-s);border:0;cursor:pointer;
  transition:background .16s var(--e),transform .16s var(--e)}
.btn:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.btn:hover{background:var(--c-primary-d)}}
.btn--ghost{background:transparent;color:var(--c-primary);box-shadow:inset 0 0 0 2px currentColor}
.btn--accent{background:var(--c-accent)}

/* ── スクロール表示 ───────────────────────────────
   .fx を付けた要素が、画面に入ったら .hh-in が付いて現れる。
   親（body）に .fx-on が無い間は「最初から見えている」＝失敗しても安全。
   data-fx で出方を指定：fadeup / fadeblur / left / right / scale / clip / mask
   data-d で遅延（ms）を指定：<div class="fx" data-fx="left" data-d="120">
   ─────────────────────────────────────────────── */
.fx-on .fx{opacity:0;will-change:opacity,transform,filter,clip-path;
  transition:opacity var(--d) var(--e),transform var(--d) var(--e),
             filter var(--d) var(--e),clip-path var(--d) var(--e)}
.fx-on .fx[data-fx="fadeup"],
.fx-on .fx:not([data-fx]){transform:translateY(26px)}
.fx-on .fx[data-fx="fadeblur"]{filter:blur(10px);transform:translateY(14px)}
.fx-on .fx[data-fx="left"]{transform:translateX(-44px)}
.fx-on .fx[data-fx="right"]{transform:translateX(44px)}
.fx-on .fx[data-fx="scale"]{transform:scale(.94)}
.fx-on .fx[data-fx="clip"]{clip-path:inset(0 100% 0 0)}
.fx-on .fx[data-fx="mask"]{clip-path:inset(100% 0 0 0)}
.fx-on .fx.hh-in{opacity:1;transform:none;filter:none;clip-path:inset(0 0 0 0)}

/* 常時動くもの（うるさくならない程度に） */
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.floaty{animation:floaty 4.5s var(--e) infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fx-on .fx{opacity:1!important;transform:none!important;filter:none!important;clip-path:none!important;transition:none!important}
  .floaty{animation:none}
  *{animation-duration:.001s!important}
}

/* numbers/numbers-chip-row — ラベルタブ付きチップの横並び
   等価な事実を並べて「信用の面」を作る型。
   この型の要は「タブが白い箱の上辺を跨いで乗り上げている」こと。
   タブを箱の中に入れた瞬間、ただの箱に落ちる。

   ★ 実装上の急所：_base.css の .fx.hh-in は clip-path:inset(0) を掛ける。
     つまり .fx を付けた要素からはみ出したものは、出現後に切り落とされる。
     だから li（=.fx）は透明な器にして、白い箱は中の .nch__body に持たせ、
     タブは li の中で body の上辺を跨がせる。はみ出しは器の中で完結させる。
     吹き出しのしっぽ・ずらし影も同じ理由で .nch__bubblewrap の内側に収める。

   値は数字でも名前でもよい。名前（学校名・資格名など長い語）を入れるときは
   ルートに .nch--wordy を付ける（テンプレの wordy スロット）。
   級数を落として2〜3行の折り返しを許し、等幅グリッドに切り替わる。 */

.nch{--nch-tab-h:calc(var(--fs-note) * 1.6 + var(--s1) * 2)}
.nch__inner{text-align:center}

/* ── 吹き出し見出し ─────────────────────
   白い吹き出しの背後に、同じ形をわずかにずらした主色ベタを敷いて二重に見せる。
   ずらしは擬似要素ではなく box-shadow のオフセット（ぼかし0）で作る。
   器（bubblewrap）の下と横に、しっぽとずらしぶんの逃げを取ってある */
.nch__bubblewrap{padding:0 var(--s2) var(--s4);
  margin-bottom:clamp(12px,2vw,var(--s5))}
.nch__bubble{position:relative;display:inline-block;max-width:100%;
  background:var(--c-bg);border-radius:var(--r-l);
  box-shadow:var(--s1) var(--s1) 0 0 var(--c-primary),
             inset 0 0 0 .08em var(--c-primary);
  padding:clamp(12px,1.8vw,var(--s4)) clamp(20px,3.4vw,var(--s6))}
.nch__bubble::after{content:"";position:absolute;left:50%;bottom:0;
  width:1.05em;height:.6em;background:var(--c-primary);
  transform:translate(-50%,100%);
  clip-path:polygon(50% 100%,0 0,100% 0)}
.nch__h{font-size:clamp(19px,2.6vw,var(--fs-xl));letter-spacing:.04em}
.nch__h em{font-style:normal;color:var(--c-primary-d)}

.nch__eyebrow{justify-content:center;margin-bottom:var(--s4)}

/* ── 主張コピー（キーワードだけ差し色） ──
   両端の「あしらい」は3本の短い線。要素自身の背景が中央の1本、
   ::before / ::after が上下の斜め線で、右端を軸に左へ扇状に開く。
   flex-wrap:nowrap が肝。wrap にすると本文が2行に折れたときに
   あしらいだけ別行へ飛ぶ。nowrap なら本文の中だけが折れ、
   あしらいは2行ぶんの中央で左右から挟んだままになる */
.nch__copy{display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;
  font-family:var(--f-disp);font-weight:900;color:var(--c-ink);
  font-size:clamp(17px,2.2vw,var(--fs-lg));line-height:var(--lh-head);
  letter-spacing:.02em;font-feature-settings:"palt";
  margin-bottom:clamp(24px,3.4vw,var(--s6))}
.nch__copy em{font-style:normal;font-weight:900;color:var(--c-accent)}

.nch__copytext{min-width:0}

.nch__spark{flex:none;position:relative;
  width:.62em;height:1em;margin-inline:var(--s2);
  color:var(--c-primary);
  background:linear-gradient(currentColor,currentColor) right center/100% .07em no-repeat}
.nch__spark::before,.nch__spark::after{content:"";position:absolute;right:0;
  width:.52em;height:.07em;background:currentColor;border-radius:var(--r-pill);
  transform-origin:right center}
.nch__spark::before{top:.2em;transform:rotate(-46deg)}
.nch__spark::after{bottom:.2em;transform:rotate(46deg)}
.nch__spark--r{transform:scaleX(-1)}

/* ── チップ群 ───────────────────────────
   既定（数値）は中央寄せの横並び。名前モードは等幅グリッドで、
   3列→2列→1列と自動で畳む */
.nch__chips{display:flex;flex-wrap:wrap;justify-content:center;
  gap:var(--s5) var(--s4)}
.nch--wordy .nch__chips{display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));
  align-items:stretch}

/* li は透明な器。上の padding がタブの乗り上げぶんの逃げになる */
.nch__chip{position:relative;flex:0 1 auto;min-width:min(100%,160px);
  display:flex;flex-direction:column;
  padding-top:calc(var(--nch-tab-h) / 2)}

/* 白い箱。影を落とさず1本の罫で締めるのは、器が clip-path で
   切られる以上、器の外へ滲む影は必ず断ち切られるため */
.nch__body{flex:1;display:flex;flex-direction:column;justify-content:center;
  background:var(--c-bg);border:1px solid var(--c-line);border-radius:var(--r-s);
  padding:var(--s5) var(--s4) var(--s4)}

/* タブ。白い箱の上辺にちょうど半分だけ乗り上げる＝この型の署名。
   高さを --nch-tab-h で固定してあるので、器の padding-top と必ず噛み合う。
   max-width と ellipsis は、タブ文言が長すぎたときに箱の外へ
   はみ出させないための保険（本来は4〜6文字で置く） */
.nch__tab{position:absolute;top:0;left:50%;transform:translateX(-50%);
  z-index:1;height:var(--nch-tab-h);
  display:flex;align-items:center;justify-content:center;
  max-width:calc(100% - var(--s5));padding-inline:var(--s3);
  background:var(--c-primary);color:var(--c-on-primary);
  font-size:var(--fs-note);font-weight:700;letter-spacing:.06em;
  border-radius:var(--r-s);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 値。数字は等幅・極大、名前は級数を落として折り返しを許す */
.nch__val{font-family:var(--f-num);font-weight:900;color:var(--c-ink);
  font-size:clamp(26px,3.6vw,var(--fs-2xl));line-height:var(--lh-tight);
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.nch__unit{font-style:normal;font-family:var(--f-sans);font-weight:700;
  font-size:.38em;margin-left:.1em;letter-spacing:0}
.nch--wordy .nch__val{font-family:var(--f-disp);
  font-size:clamp(15px,1.8vw,var(--fs-md));line-height:var(--lh-head);
  letter-spacing:.01em;font-feature-settings:"palt";
  text-wrap:balance;overflow-wrap:anywhere}
.nch--wordy .nch__unit{font-size:.85em;margin-left:0}

.nch__cnote{margin-top:var(--s1);font-size:var(--fs-note);color:var(--c-ink3);
  line-height:var(--lh-head)}

.nch__source{margin-top:var(--s4);text-align:right;
  font-size:var(--fs-note);color:var(--c-ink3);line-height:1.8}

/* ── 動き ─────────────────────────────
   チップ本体は .fx（data-d で60msずつずらす）。
   タブと値はチップに .hh-in が付いてから遅れて乗る。
   .fx-on が付かない＝JSが死んだ環境では最初から全部見えている */
@keyframes nch-pop{0%{transform:scale(.94)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.fx-on .nch__bubblewrap.hh-in .nch__bubble{animation:nch-pop .55s var(--e) both}

.fx-on .nch__tab{opacity:0;transform:translateX(-50%) scale(.9);
  transition:opacity .3s var(--e) .12s,transform .34s var(--e) .12s}
.fx-on .nch__chip.hh-in .nch__tab{opacity:1;transform:translateX(-50%) scale(1)}

.fx-on .nch__val{opacity:0;transform:translateY(var(--s2));
  transition:opacity .34s var(--e) .1s,transform .34s var(--e) .1s}
.fx-on .nch__chip.hh-in .nch__val{opacity:1;transform:none}

/* ── SP：チップを畳む ─────────────────
   2個までは横並びを保つ。3個以上（:has で数える）は全幅で縦積み。
   :has が効かない環境でも2列で止まるだけで、崩れはしない */
@media(max-width:900px){
  .nch__chips{gap:var(--s5) var(--s3)}
  .nch__chip{flex:1 1 calc(50% - var(--s3))}
  .nch__chips:has(> :nth-child(3)) .nch__chip{flex-basis:100%}
  .nch__body{padding:var(--s5) var(--s3) var(--s3)}
  .nch--wordy .nch__chips{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
  .nch__val{font-size:clamp(24px,6.4vw,var(--fs-xl))}
  .nch--wordy .nch__val{font-size:var(--fs-base)}
  .nch__copy{font-size:clamp(16px,4.4vw,var(--fs-md))}
  .nch__source{margin-top:var(--s3)}
}
@media(max-width:560px){
  .nch__chips{gap:var(--s4) var(--s2)}
  .nch--wordy .nch__chips{grid-template-columns:minmax(0,1fr)}
  .nch__tab{letter-spacing:.03em}
  .nch__h{font-size:clamp(17px,5vw,var(--fs-lg))}
  /* 幅が無いと本文が2行に折れ、あしらいだけが左右の端まで
     引き離されて浮く。スマホでは潔く落とす */
  .nch__spark{display:none}
}

@media(prefers-reduced-motion:reduce){
  .fx-on .nch__bubblewrap.hh-in .nch__bubble{animation:none!important}
  .fx-on .nch__tab,.fx-on .nch__val{opacity:1!important;transition:none!important}
  .fx-on .nch__tab{transform:translateX(-50%)!important}
  .fx-on .nch__val{transform:none!important}
}

body{background:#fff}</style></head><body>
<section class="sec sec--alt nch nch--wordy">
  <div class="wrap nch__inner">

    <p class="h-eyebrow nch__eyebrow fx" data-fx="fadeup">小見出しがここに入ります</p>

    <div class="nch__bubblewrap fx" data-fx="fadeup" data-d="60">
      <div class="nch__bubble">
        <h2 class="h-lead nch__h"><span class="nb">見出しがここに</span><wbr><span class="nb">入ります</span></h2>
      </div>
    </div>

    <p class="nch__copy fx" data-fx="fadeup" data-d="140">
      <span class="nch__spark" aria-hidden="true"></span><span class="nch__copytext"><span class="nb">ここに主張コピーが1行、</span><wbr><span class="nb"><em>キーワード</em>だけ差し色</span></span><span class="nch__spark nch__spark--r" aria-hidden="true"></span>
    </p>

    <ul class="nch__chips" role="list">
      <li class="nch__chip fx" data-fx="fadeup" data-d="0">
        <span class="nch__tab">区分A</span>
        <div class="nch__body">
          <p class="nch__val">項目名がここに入ります</p>
          
        </div>
      </li><li class="nch__chip fx" data-fx="fadeup" data-d="90">
        <span class="nch__tab">区分A</span>
        <div class="nch__body">
          <p class="nch__val">やや長めの項目名がここに入る場合の見え方</p>
          
        </div>
      </li><li class="nch__chip fx" data-fx="fadeup" data-d="180">
        <span class="nch__tab">区分A</span>
        <div class="nch__body">
          <p class="nch__val">項目名がここに入ります</p>
          
        </div>
      </li><li class="nch__chip fx" data-fx="fadeup" data-d="270">
        <span class="nch__tab">区分B</span>
        <div class="nch__body">
          <p class="nch__val">項目名がここに入ります</p>
          
        </div>
      </li><li class="nch__chip fx" data-fx="fadeup" data-d="360">
        <span class="nch__tab">区分B</span>
        <div class="nch__body">
          <p class="nch__val">項目名がここに入ります</p>
          
        </div>
      </li><li class="nch__chip fx" data-fx="fadeup" data-d="450">
        <span class="nch__tab">区分B</span>
        <div class="nch__body">
          <p class="nch__val">項目名がここに入ります</p>
          <p class="nch__cnote">補足がここに入ります</p>
        </div>
      </li>
    </ul>

    <p class="nch__source fx" data-fx="fadeup">※注記。対象・期間・条件をここに短く書きます</p>

  </div>
</section>

<script>
/* スクロール表示：画面に入ったら .hh-in を付ける（IO不使用） */
(function(){
  var els=[].slice.call(document.querySelectorAll('.fx'));
  if(!els.length) return;
  document.body.classList.add('fx-on');
  var scrolled=false, ticking=false;
  function show(el){
    var d=parseInt(el.dataset.d||'0',10);
    if(d) setTimeout(function(){el.classList.add('hh-in')},d);
    else el.classList.add('hh-in');
  }
  function check(){
    ticking=false;
    var vh=window.innerHeight, i;
    for(i=els.length-1;i>=0;i--){
      var el=els[i], r=el.getBoundingClientRect();
      if(r.top < vh*0.88 && r.bottom > 0){ show(el); els.splice(i,1); }
    }
  }
  function onScroll(){ scrolled=true; if(!ticking){ ticking=true; requestAnimationFrame(check); } }
  addEventListener('scroll',onScroll,{passive:true});
  addEventListener('resize',onScroll,{passive:true});
  check();                                   /* 初期表示分 */
  /* 保険：20秒たっても一度もスクロールされなければ全部出す */
  setTimeout(function(){ if(!scrolled){ els.forEach(function(e){e.classList.add('hh-in')}); els.length=0; } },20000);
})();
</script></body></html>
