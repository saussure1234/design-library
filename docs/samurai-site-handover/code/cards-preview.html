<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Card Videos Preview</title>
<style>
:root{--bg:#f4f4f2;--ink:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--ink:#eee}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Hiragino Sans",sans-serif}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:1100px;margin:0 auto;padding:24px 16px}
figure{margin:0}video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#000}
figcaption{margin-top:8px;font-size:14px;font-weight:700}
@media (max-width:640px){.g{grid-template-columns:minmax(0,1fr)}}
</style></head><body>
<div class="g">
<figure><video src="cards/strategy2action.mp4" poster="cards/strategy2action.jpg" muted loop playsinline autoplay></video><figcaption>Strategy2Action</figcaption></figure>
<figure><video src="cards/hookhack.mp4" poster="cards/hookhack.jpg" muted loop playsinline autoplay></video><figcaption>HookHack</figcaption></figure>
<figure><video src="cards/hookhacker.mp4" poster="cards/hookhacker.jpg" muted loop playsinline autoplay></video><figcaption>HookHacker</figcaption></figure>
<figure><video src="https://samurai-style.tokyo/videos/video-production.mp4" poster="https://samurai-style.tokyo/images/video-production-poster.webp" muted loop playsinline autoplay></video><figcaption>動画制作（今のまま）</figcaption></figure>
</div></body></html>
