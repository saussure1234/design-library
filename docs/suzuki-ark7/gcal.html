<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Googleカレンダーに追加｜ARK Hills Music Week 2026 音の遊び場</title>
<!-- 🚨 iPhone で「Googleカレンダーに追加」を押すと、calendar.google.com のリンクを
     Universal Links が横取りして Google カレンダーのアプリを開く。アプリは
     render?action=TEMPLATE の中身を読まないので、カレンダーが開くだけで予定は入らない
     （So 2026-09-22「safariでやって アプリは開いたけど追加されない」）。
     タップではなく【スクリプトの遷移】にすると Universal Links は働かないので、
     この中継ページから飛ばして Safari の中で Google カレンダーの入力画面を出す。 -->
<meta http-equiv="refresh" content="0;url=https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=ARK%20Hills%20Music%20Week%202026%EF%BD%9C%E9%9F%B3%E3%81%AE%E9%81%8A%E3%81%B3%E5%A0%B4&amp;dates=20261010/20261012&amp;details=10%E6%9C%8810%E6%97%A5%EF%BC%88%E5%9C%9F%EF%BC%89%E3%83%BB11%E6%97%A5%EF%BC%88%E6%97%A5%EF%BC%8911%3A00%EF%BC%8D17%3A00%20%E3%82%A2%E3%83%BC%E3%82%AF%E3%83%BB%E3%82%AB%E3%83%A9%E3%83%A4%E3%83%B3%E5%BA%83%E5%A0%B4&amp;location=%E3%82%A2%E3%83%BC%E3%82%AF%E3%83%BB%E3%82%AB%E3%83%A9%E3%83%A4%E3%83%B3%E5%BA%83%E5%A0%B4">
<style>
:root{color-scheme:light}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#FDF9F6;color:#1F1C19;
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;text-align:center;padding:24px}
.box{max-width:22em}
p{margin:0 0 18px;font-size:16px;line-height:1.9}
a{display:inline-block;margin:6px;padding:14px 22px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none}
.g{background:#5AB651;color:#15240F}
.i{background:#fff;color:#9C529C;border:2px solid #9C529C}
</style>
</head>
<body>
<div class="box">
  <p>Googleカレンダーを開いています…<br>開かない場合は下のボタンからどうぞ。</p>
  <a class="g" id="g" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=ARK%20Hills%20Music%20Week%202026%EF%BD%9C%E9%9F%B3%E3%81%AE%E9%81%8A%E3%81%B3%E5%A0%B4&amp;dates=20261010/20261012&amp;details=10%E6%9C%8810%E6%97%A5%EF%BC%88%E5%9C%9F%EF%BC%89%E3%83%BB11%E6%97%A5%EF%BC%88%E6%97%A5%EF%BC%8911%3A00%EF%BC%8D17%3A00%20%E3%82%A2%E3%83%BC%E3%82%AF%E3%83%BB%E3%82%AB%E3%83%A9%E3%83%A4%E3%83%B3%E5%BA%83%E5%A0%B4&amp;location=%E3%82%A2%E3%83%BC%E3%82%AF%E3%83%BB%E3%82%AB%E3%83%A9%E3%83%A4%E3%83%B3%E5%BA%83%E5%A0%B4">Googleカレンダーを開く</a>
  <a class="i" href="event.ics" type="text/calendar">端末のカレンダーに追加</a>
</div>
<script>location.replace(document.getElementById("g").href)</script>
</body>
</html>
