<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ESL コラムLP 前後比較（構成）</title>
<style>
:root{--bg:#F4F6F4;--ink:#1F2A22;--sub:#5B675F;--line:#D5DDD7;--ac:#00A01C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--ink:#E8EEE9;--sub:#A3B0A7;--line:#2E3631}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.bar h1{font-size:15px;margin:0 8px 0 0}
.sw{display:flex;gap:4px}
.sw button,.jump button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.sw button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jump{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.jump button.on{border-color:var(--ac);color:var(--ac);font-weight:700}
.note{padding:8px 16px;font-size:13.5px;color:var(--sub);min-height:2.4em}
.note b{color:var(--ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px;height:calc(100% - 150px);min-height:520px}
.col{display:flex;flex-direction:column;min-width:0}
.col p{margin:0 0 6px;font-size:13px;font-weight:700}
.col p span{font-weight:400;color:var(--sub);margin-left:6px}
.frame{position:relative;flex:1;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff}
.frame iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0}
.sync{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
@media (max-width:820px){.pair{grid-template-columns:1fr;height:auto}.frame{height:70vh}}
</style>
</head>
<body>
<div class="bar">
  <h1>ESL コラム流入LP　前（esl-col1）と後（esl-col3）</h1>
  <div class="sw" role="group" aria-label="画面の幅">
    <button type="button" data-w="390" aria-pressed="true">スマホ</button>
    <button type="button" data-w="1440" aria-pressed="false">PC</button>
  </div>
  <label class="sync"><input type="checkbox" id="sync" checked>左右のスクロールを合わせる</label>
</div>
<div class="jump" id="jump"></div>
<p class="note" id="note">上のボタンを押すと、左右が同じ場所に飛びます。右の赤い点線の枠が、作り直した節です（文言は変えていません。文字の大きさも元のまま）。</p>
<div class="pair">
  <div class="col"><p>前<span>esl-col1</span></p><div class="frame"><iframe id="A" src="../esl-col1/index.html" title="前 esl-col1"></iframe></div></div>
  <div class="col"><p>後<span>esl-col3（変えた所に赤い枠）</span></p><div class="frame"><iframe id="B" src="index.html?mark=1" title="後 esl-col3"></iframe></div></div>
</div>
<script>
var SPOTS = [
  ["section.res", "合格実績", "<b>そのまま：</b>合格実績は文も並びも同じ（1,000名以上の数え上げだけ足した）"],
  ["section.fnc", "① 3つの特徴", "<b>変更①　特徴：</b>01（高い英検合格率）は直前の合格実績と重なるので外し、POINT02〜04を01〜03に。「3つの特徴」に。作りは元のまま・上の3枚にアイコン"],
  ["section.cmx", "比較表", "<b>比較表：</b>元のまま"],
  ["section.cas", "② 実績", "<b>変更②　ESL clubの実績：</b>公式トップ（コラムの飛び先）と同じ3人（小学生）。横に流すカード → 「はじまり → 期間 → 結果」が並ぶ一覧（緑の地に白いカード）。顔を大きく"],
  ["section.vbi", "③ 保護者の声", "<b>変更③　保護者の声：</b>PCは保護者のコメントを全部出す（講師のコメントだけ「続きを読む」）。スマホは最初の段落だけ出し、残りは「続きを読む」"],
  ["section.mbl", "スクールマネジャー", "<b>スクールマネジャー・講師：</b>元のまま（PC・スマホとも）"],
  ["section.cts", "④ 教室・料金", "<b>変更④　教室・料金・時間割：</b>料金を横一列に／時間割を曜日3列の表に／教室の情報を詰めた表に（「本日の受付」の札は外した）"],
  ["section.flw", "⑤ 体験の流れ", "<b>変更⑤　体験の流れ（スマホ）：</b>大きく場所を取っていたアイコンを、STEP番号と見出しの右に小さく"]
];
var A = document.getElementById("A"), B = document.getElementById("B"), W = 390, lock = false;
function fit(){ [A, B].forEach(function(f){ var box = f.parentNode, s = Math.min(1, box.clientWidth / W);
  f.style.width = W + "px"; f.style.height = (box.clientHeight / s) + "px"; f.style.left = Math.max(0, (box.clientWidth - W * s) / 2) + "px"; f.style.transform = "scale(" + s + ")"; }); }
function win(f){ try { return f.contentWindow; } catch(e){ return null; } }
function go(sel, again){
  [A, B].forEach(function(f){ var w = win(f); if (!w) return; var d = w.document, el = d.querySelector(sel); if (!el) return;
    d.documentElement.style.scrollBehavior = "auto";
    var y = sel === "body" ? 0 : el.getBoundingClientRect().top + w.scrollY - (W < 768 ? 80 : 100);
    if (again) { w.scrollTo(0, y + 2000); }
    setTimeout(function(){ w.scrollTo(0, y); }, again ? 60 : 0); });
}
var jump = document.getElementById("jump"), note = document.getElementById("note");
SPOTS.forEach(function(s){ var b = document.createElement("button"); b.type = "button"; b.textContent = s[1];
  b.onclick = function(){ [].forEach.call(jump.children, function(x){ x.classList.toggle("on", x === b); }); note.innerHTML = s[2]; reloadThen(s[0]); };
  jump.appendChild(b); });
function reloadThen(sel){
  var n = 0; [A, B].forEach(function(f){ f.onload = function(){ fit(); bind(f); if (++n === 2) setTimeout(function(){ go(sel); }, 700); }; f.contentWindow.location.reload(); });
}
function bind(f){ var w = win(f); if (!w) return; w.addEventListener("scroll", function(){
  if (lock || !document.getElementById("sync").checked) return; lock = true;
  var other = win(f === A ? B : A), r = w.scrollY / Math.max(1, w.document.documentElement.scrollHeight - w.innerHeight);
  if (other) other.scrollTo(0, r * (other.document.documentElement.scrollHeight - other.innerHeight));
  setTimeout(function(){ lock = false; }, 30); }, {passive:true}); }
[].forEach.call(document.querySelectorAll(".sw button"), function(b){ b.onclick = function(){
  [].forEach.call(document.querySelectorAll(".sw button"), function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
  W = +b.getAttribute("data-w"); fit(); }; });
[A, B].forEach(function(f){ f.addEventListener("load", function(){ fit(); bind(f); }); });
addEventListener("resize", fit); fit();
</script>
</body>
</html>
