ce", "group": "目視", "name": "実機スマホ", "by": "human", "state": "human", "msg": "iPhoneで開いて、改行・被り・タップできるか。Chromeとフォント幅が違うので機械では出ない"}]}, "esl8": {"project": "ESL club オンライン校 小学生向け", "script_v": "v2", "at": "", "script": "# ESL club オンライン校 小学生向けLP 原稿 v2\n受領: 2026-09-10（梶さんFB反映） ／ 反映先: esl17\n\n## FV\nバイリンガル講師のマンツーマンレッスンでオンラインでも集中が続く\n\"小学生で英検2級\"を目指せる英語塾\n\n## CTA（1回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 短期で英検合格を目指せる4つの特徴\n- POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\n- POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\n- POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\n- POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n\n## POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\nESL clubでは、英検1級・TOEFL iBT95点・TOEIC900点レベル以上のバイリンガル講師のみを採用しています。1対1のため、お子さまが画面の前で手を止めたり、表情が曇ったりすれば、すぐに声をかけられます。分からないところは日本語に切り替えて説明するので、低学年のお子さまでも分からないまま時間だけが過ぎることがありません。年齢の近い講師との距離の近さも、英語を好きなまま続ける支えになります。\n見出し：実際のレッスンの様子をご覧ください\n（画像：YouTube動画サムネイル　小3男子　初学者　ハシモトカズマくん）\n（画像：YouTube動画サムネイル　小4女子　学習経験者　オオツカキサちゃん）\n\n## POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\nスクールマネージャーが中心となり、学習計画どおりにレッスンが進むよう講師へ内容を伝達し、生徒さまの進捗をレッスンごとに保護者さまへ共有します。レッスン後、保護者さまへフィードバックを行うので、レッスンに付き添わなくとも、お子さまの英語力の伸びを安心して見守っていただけます。\n\n## POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\nESL clubでは2015年の開塾以降、英検をカリキュラムに用いて、着実な英語力の向上と英検合格に導いてきました。国際基準であるCEFRに対応した英検を用いることで、バランスよく4技能＋語彙力を高めていきます。一般的には、英検2級が高校卒業時の到達目標とされていますが、ESL clubでは、小学生、中学生の時点での高い合格率を誇っています。\n（表：ESL clubの小中学生の英検合格率）5級100%、4級88%、3級86%、準2級64%、2級75%\n注記：2023年度第2回の実績（ESL clubオンライン校）／受験者のうち1次・2次受験双方に合格した生徒の割合\n\n## POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n目標とする級と時期、現在の英語レベル、学習に充てられる時間の4点から逆算して個別の学習計画を作成し、確保できる学習時間に合わせてレッスンの進め方と宿題量を設計します。学習時間そのものを増やすのではなく、限られた時間の使い方を組み立て直すため、他の習い事で忙しいお子さまでも無理なく進められます。将来中学受験をお考えのご家庭でも、低学年のうちに英語を進めておくことで、高学年になったときに他の教科へ時間を回しやすくなります。\n\n## CTA（2回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## CTA（3回目・4回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 以降\n現状のLP（/online-c）と同様：キャンペーンバナー／スクールマネジャー紹介／講師紹介／保護者さ const ORDER=Object.keys(D).sort(function(a,b){return (D[b].at||'')<(D[a].at||'')?-1:1});
const q=new URLSearchParams(location.search);
const sel=document.getElementById('sel');
ORDER.forEach(function(v){const o=document.createElement('option');o.value=v;
  o.textContent=D[v].project+'  '+v+(D[v].at?'   '+D[v].at:'');sel.appendChild(o);});
let cur=(q.get('v')&&D[q.get('v')])?q.get('v'):ORDER[0];      // 既定は一番新しい版
sel.value=cur;
sel.addEventListener('change',function(){location.search='?v='+sel.value});
function esc(s){return String(s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function card(i){
  const who=i.by==='machine'?'機械':i.by==='claude'?'Claude':'目視';
  const rows=[];
  if(i.where) rows.push('<dt>どこ</dt><dd>'+esc(i.where)+'</dd>');
  rows.push('<dt>何が</dt><dd>'+esc(i.what||i.msg||'')+'</dd>');
  if(i.how) rows.push('<dt>どう直す</dt><dd class="how">'+esc(i.how)+'</dd>');
  return '<div class="f '+i.state+'"><div class="t">'+esc(i.name)+
    '<span class="w" style="margin-left:auto">'+who+'</span></div><dl>'+rows.join('')+'</dl></div>';
}
function draw(){
  const d=D[cur];
  document.getElementById('h-s').textContent='原稿 '+(d.script_v||'（未登録）');
  document.getElementById('md').innerHTML=d.script?esc(d.script)
    :'<span class="none">原稿がまだ無い。<br>lpv.py script &lt;案件id&gt; --new で登録する。</span>';
  const g={ng:[],claude:[],human:[],warn:[],ok:[]};
  (d.items||[]).forEach(function(i){ if(g[i.state]) g[i.state].push(i); });
  let h='<div class="sum">'+
    (g.ng.length?'<span class="a">直す '+g.ng.length+'</span>':'')+
    (g.human.length?'<span class="b">あなたが見る '+g.human.length+'</span>':'')+
    '<span class="c">問題なし '+(g.ok.length+g.claude.length)+'</span></div>';
  if(g.ng.length)    h+='<div class="cap">直した方がよい</div>'+g.ng.map(card).join('');
  if(g.human.length) h+='<div class="cap">あなたが実機で見る</div>'+g.human.map(card).join('');
  if(g.warn.length)  h+='<div class="cap">公開前に確かめる</div>'+g.warn.map(card).join('');
  const fine=g.ok.concat(g.claude);
  if(fine.length)    h+='<div class="cap">見たが問題なかった</div>'+fine.map(card).join('');
  document.getElementById('notes').innerHTML=h||'<p class="none">まだチェックしていない。</p>';
}
