<title>レビュー ─ LP版管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.75 -apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  color:#2b3138;background:#eef1f5}
.bar{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#141a24;color:#fff}
.bar b{font-size:14px}
.bar a{color:#9fb6d4;font-size:12.5px;text-decoration:none}
.bar select{margin-left:auto;background:#232b38;color:#fff;border:0;border-radius:8px;padding:7px 11px;font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(340px,1.15fr);
  gap:14px;padding:14px;height:calc(100vh - 46px)}
.col{background:#fff;border:1px solid #e3e7ee;border-radius:12px;display:flex;flex-direction:column;min-height:0}
.col>h2{margin:0;padding:12px 16px;font-size:12px;letter-spacing:.06em;color:#78818e;
  border-bottom:1px solid #eef0f3;font-weight:700}
.col>div{overflow:auto;padding:14px 16px}
pre.md{white-space:pre-wrap;margin:0;color:#3c434c;font-size:12.5px;line-height:1.95;
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
code{font:11.5px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;background:#f1f3f6;
  border-radius:4px;padding:1px 5px}
.sum{display:flex;gap:8px;padding:0 0 12px;flex-wrap:wrap}
.sum span{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.sum .a{background:#fdeaea;color:#b3261e}
.sum .b{background:#fff4e0;color:#9a6b12}
.sum .c{background:#e8f7ee;color:#1a7f45}
.sum .d{background:#eef1f5;color:#6b7480}
.f.todo{border-style:dashed;border-color:#d7dce4}
.f.todo>.t{background:#fafbfc;color:#78818e}
.cap{font-size:11.5px;letter-spacing:.05em;color:#8b94a3;margin:16px 0 8px}
.cap:first-child{margin-top:0}
.f{border:1px solid #e6e9ee;border-radius:10px;padding:0;margin:0 0 10px;overflow:hidden}
.f>.t{display:flex;align-items:center;gap:8px;padding:9px 12px;font-weight:700;font-size:13.5px;
  border-bottom:1px solid #f1f3f6}
.f .w{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:#f1f3f6;color:#6b7480}
.f dl{margin:0;padding:8px 12px 10px;display:grid;grid-template-columns:64px 1fr;gap:4px 10px;font-size:12.5px}
.f dt{color:#98a1ad;font-size:11.5px;padding-top:2px}
.f dd{margin:0;color:#3c434c;overflow-wrap:anywhere}
.f dd.how{background:#f6f9fc;border-left:3px solid #cfe0f2;padding:6px 9px;border-radius:0 6px 6px 0;color:#2b3138}
.f.ng{border-color:#f0c7c2}
.f.ng>.t{background:#fff6f5;color:#b3261e}
.f.human{border-color:#eddcb4}
.f.human>.t{background:#fffaf0;color:#8a6210}
.f.warn>.t{background:#fffdf4;color:#8a6210}
.f.ok>.t{background:#f7fbf8;color:#1a7f45}
.none{color:#98a1ad;font-size:12.5px;line-height:1.9}
@media(max-width:700px){.wrap{grid-template-columns:1fr;height:auto}}
</style></head><body>

なります。\n\n## CTA（2回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子様のレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## CTA（3回目・4回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：いつまでに2級合格できるかレッスン後にご案内します\n\n## 以降\n現状のLP（/online-c）と同様：キャンペーンバナー／スクールマネジャー紹介／講師紹介／保護者さまの声／中学受験合格実績／他の英語スクールとの違い／教室紹介／フッター\n", "shot": null, "items": [], "rules": []}, "esl17": {"project": "ESL club オンライン校 小学生向け", "project_id": "eslclub-kids", "script_v": "v2", "inherit": false, "at": "2026-09-10 11:54", "script": "# ESL club オンライン校 小学生向けLP 原稿 v2\n受領: 2026-09-10（梶さんFB反映） ／ 反映先: esl17\n\n## FV\nバイリンガル講師のマンツーマンレッスンでオンラインでも集中が続く\n\"小学生で英検2級\"を目指せる英語塾\n\n## CTA（1回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 短期で英検合格を目指せる4つの特徴\n- POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\n- POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\n- POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\n- POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n\n## POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\nESL clubでは、英検1級・TOEFL iBT95点・TOEIC900点レベル以上のバイリンガル講師のみを採用しています。1対1のため、お子さまが画面の前で手を止めたり、表情が曇ったりすれば、すぐに声をかけられます。分からないところは日本語に切り替えて説明するので、低学年のお子さまでも分からないまま時間だけが過ぎることがありません。年齢の近い講師との距離の近さも、英語を好きなまま続ける支えになります。\n見出し：実際のレッスンの様子をご覧ください\n（画像：YouTube動画サムネイル　小3男子　初学者　ハシモトカズマくん）\n（画像：YouTube動画サムネイル　小4女子　学習経験者　オオツカキサちゃん）\n\n## POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\nスクールマネージャーが中心となり、学習計画どおりにレッスンが進むよう講師へ内容を伝達し、生徒さまの進捗をレッスンごとに保護者さまへ共有します。レッスン後、保護者さまへフィードバックを行うので、レッスンに付き添わなくとも、お子さまの英語力の伸びを安心して見守っていただけます。\n\n## POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\nESL clubでは2015年の開塾以降、英検をカリキュラムに用いて、着実な英語力の向上と英検合格に導いてきました。国際基準であるCEFRに対応した英検を用いることで、バランスよく4技能＋語彙力を高めていきます。一般的には、英検2級が高校卒業時の到達目標とされていますが、ESL clubでは、小学生、中学生の時点での高い合格率を誇っています。\n（表：ESL clubの小中学生の英検合格率）5級100%、4級88%、3級86%、準2級64%、2級75%\n注記：2023年度第2回の実績（ESL clubオンライン校）／受験者のうち1次・2次受験双方に合格した生徒の割合\n\n## POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n目標とする級と時期、現在の英語レベル、学習に充てられる時間の4点から逆算して個別の学習計画を作成し、確保できる学習時間に合わせてレッスンの進め方と宿題量を設計します。学習時間そのものを増やすのではなく、限られた時間の使い方を組み立て直すため、他の習い事で忙しいお子さまでも無理なく進められます。将来中学受験をお考えのご家庭でも、低学年のうちに英語を進めておくことで、高学年になったときに他の教科へ時間を回し al-device", "group": "目視", "name": "実機スマホ", "by": "human", "state": "human", "msg": "iPhoneで開いて、改行・被り・タップできるか。Chromeとフォント幅が違うので機械では出ない"}, {"id": "kinsoku", "group": "見た目", "name": "行頭の禁則", "by": "claude", "state": "ng", "msg": "私が意味を見る（context/<案件>.md を前提に）", "where": "①4つの特徴 01 ②4つの特徴 02 ③比較表の項目名「日々の保護者のフォロー」", "what": "1文字だけ次行に落ちている。①③は長音「ー」が行頭に来ていて日本語の禁則違反", "how": "①②はカードの見出しに <br> を入れて意味の切れ目で折る。③は .cmx__item に line-break:strict を足すか、項目名を「日々の保護者フォロー」に1文字詰める"}], "rules": []}, "esl19": {"project": "ESL club オンライン校 小学生向け", "project_id": "eslclub-kids", "script_v": "v2", "inherit": true, "at": "2026-09-11 01:02", "script": "# ESL club オンライン校 小学生向けLP 原稿 v2\n受領: 2026-09-10（梶さんFB反映） ／ 反映先: esl17\n\n## FV\nバイリンガル講師のマンツーマンレッスンでオンラインでも集中が続く\n\"小学生で英検2級\"を目指せる英語塾\n\n## CTA（1回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 短期で英検合格を目指せる4つの特徴\n- POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\n- POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\n- POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\n- POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n\n## POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\nESL clubでは、英検1級・TOEFL iBT95点・TOEIC900点レベル以上のバイリンガル講師のみを採用しています。1対1のため、お子さまが画面の前で手を止めたり、表情が曇ったりすれば、すぐに声をかけられます。分からないところは日本語に切り替えて説明するので、低学年のお子さまでも分からないまま時間だけが過ぎることがありません。年齢の近い講師との距離の近さも、英語を好きなまま続ける支えになります。\n見出し：実際のレッスンの様子をご覧ください\n（画像：YouTube動画サムネイル　小3男子　初学者　ハシモトカズマくん）\n（画像：YouTube動画サムネイル　小4女子　学習経験者　オオツカキサちゃん）\n\n## POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\nスクールマネージャーが中心となり、学習計画どおりにレッスンが進むよう講師へ内容を伝達し、生徒さまの進捗をレッスンごとに保護者さまへ共有します。レッスン後、保護者さまへフィードバックを行うので、レッスンに付き添わなくとも、お子さまの英語力の伸びを安心して見守っていただけます。\n\n## POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\nESL clubでは2015年の開塾以降、英検をカリキュラムに用いて、着実な英語力の向上と英検合格に導いてきました。国際基準であるCEFRに対応した英検を用いることで、バランスよく4技能＋語彙力を高めていきます。一般的には、英検2級が高校卒業時の到達目標とされていますが、ESL clubでは、小学生、中学生の時点での高い合格率を誇っています。\n（表：ESL clubの小中学生の英検合格率）5級100%、4級88%、3級86%、準2級64%、2級75%\n注記：2023年度第2回の実績（ESL clubオンライン校）／受験者のうち1次・2次受験双方に合格した生徒の割合\n\n## POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n目標とする級と時期、現在の英語レベル、学習に充てられる時間の4点から逆算して個別の学習計画を作成し、確保できる学習時間に合わせてレッスンの進め方と宿題量を設計します。学習時間そのものを増やすのではなく、限られた時間の使い方を組み立て直すため、他の習い事で忙しいお子さまでも無理なく進められます。将来中学受験をお考えのご家庭でも、低学年のうちに英語を進めておくことで、高学年になったときに他の教科へ時間を回しやすくなります。\n\n## CTA（2回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## CTA（3回目・4回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 以降\n現状のLP（/online-c）と同様：キャンペーンバナー／スクールマネジャー紹介／講師紹介／保護者さまの声／中学受験合格実績／他の英語スクールとの違い／教室紹介／フッター\n\n## v1 からの変更（梶さんFB 2026-09-10）\n- 4つの特徴の一覧：POINT1 を「学習効率を向上」→「オンラインでも集中が続く」（詳細と不一致だった）\n- POINT2 本文を差し替え\n- POINT3 の注記を一段小さく（デザイン指示）\n- 比較表の ESL club ロゴを大きく（デザイン指示）\n- 表記を「お子さま／保護者さま／生徒さま」に統一\n- CTA補助コピーは4回とも同じ文言に（施主判断。原稿の3・4回目とは異なる）\n- ※要確認：ハシモトカズマくんの動画が「ログインしてください」になる（YouTube側の公開設定）\n", "shot": "../esl19/_shot.jpg", "items": [{"id": "script-diff", "group": "中身", "name": "原稿との一致", "by": "machine", "state": "ok", "msg": "原稿（v2.md）の文はすべてLPにある"}, {"id": "wording", "group": "中身", "name": "表記ゆれ", "by": "machine", "state": "ok", "msg": "「さま」に統一されている"}, {"id": "self-consistency", "group": "中身", "name": "ページ内の不一致", "by": "machine", "state": "ok", "msg": "一覧と詳細の見出しが一致（4件）"}, {"id": "lineage", "group": "中身", "name": "版の系統（先祖返り）", "by": "machine", "state": "ok", "msg": "派生元 esl17 は最新のFB反映版"}, {"id": "sibling", "group": "中身", "name": "別LPとの食い違い", "by": "machine", "state": "ng", "msg": "フッターの表記が別LPと違う（こちらは 会社概要 / プライバシーポリシー）: ESL club 英検プレテスト の esl-pretest-1018: 会社概要（明光ネットワークジャパン） / プライバシーポリシー（クライアントに提示中なので直せない）", "where": "フッターの「会社概要 / プライバシーポリシー」", "how": "英検プレテストのリンクは【クライアントに提示中】なので、いま中身を直すと先方が見ている最中に変わる。次にそのLPを直すタイミングで一緒に直す。オンライン校・小学生向けの2本は揃っているので、この2本については直すところなし。", "what": "フッターの表記が別LPと違う（こちらは 会社概要 / プライバシーポリシー）: ESL club 英検プレテスト の esl-pretest-1018: 会社概要（明光ネットワークジャパン） / プライバシーポリシー（クライアントに提示中なので直せない）"}, {"id": "links", "group": "動作", "name": "リンク・動画・画像の生存", "by": "machine", "state": "ok", "msg": "画像・動画とも生きている", "where": "レッスンの様子の動画2本（8ZYwvDv7rQ8 / 7TLrJshYhXY）", "what": "2本とも生きていて、埋め込みでも再生できる（2026-09-11 確認）", "how": "※要確認：新しいカズマ ame": "スマホのFVは写真をCTAより上に", "what": "375〜900pxで、FV内の写真の上端がCTA（a/button）の上端より上", "why": "全LP共通の必須条件。スマホは1画面に入る量が少ないので、写真→文字→CTAの順でないと何のLPか分からないまま押させることになる", "scope": "全案件（FVに写真がある型だけ）", "state": "ok", "note": ""}, {"id": "h1-accent", "name": "FV見出しにブランドカラーの強調を1箇所", "what": "FVの見出しの中に、地と区別できる強調が1つ以上（色・下線・地色・マーカー・枠のいずれか）", "why": "見出しのどこかをブランドカラーでハイライト（ADS 2026-09-09）。墨一色だと読点まで読まれない。★2026-09-11 色だけで見ると、地が濃い雰囲気（白い見出し＋白い下線）を誤判定したので広げた", "scope": "全案件", "state": "ok", "note": ""}, {"id": "no-boilerplate-note", "name": "フォームに定型の注記を置かない", "what": "「ご記入いただいた内容は」で始まる注記が無いこと", "why": "フォームの「ご記入いただいた内容は…」の注記は不要（ADS 2026-09-09）。プライバシーポリシーへのリンクがあれば足りる", "scope": "全案件", "state": "ok", "note": ""}, {"id": "header-fixed", "name": "ヘッダーを画面上部に固定する", "what": "最初の header（または親）が position:fixed か sticky で、スクロールしても画面に残ること", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）。品質チェックは壊れていないかしか見ないので、作りが素朴なまま全項目を通ってリンクを渡していた", "scope": "全案件", "state": "ok", "note": ""}, {"id": "open-at-top", "name": "開いたらいちばん上から表示する", "what": "history.scrollRestoration を 'manual' にし、#付きで開いた時以外は読み込み時に最上部へ。再読み込みでスクロール位置を戻さない", "why": "「ARK Hills Music Week 2026｜音の遊び場 開いたときにこれが見えない 一番スクロール上になった上でやらんと」（So 2026-09-14、suzuki-ark1）。少し下げて再読み込みすると、ブラウザが44pxの位置を戻し、FVの一行目が固定ヘッダーの裏に隠れていた。撮影は必ず最上部から始まるので、機械の撮影では出ない", "scope": "全案件（固定ヘッダーのある型）", "state": "ng", "note": "history.scrollRestoration='manual' が無い（再読み込みで途中から始まり、FVの上端が固定ヘッダーの裏に隠れる）"}, {"id": "scroll-motion", "name": "スクロールで中身が順に出る", "what": "IntersectionObserver で、画面に入った .fx（または data-rv）を出していること。対象6つ以上", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）。動きが無いと作りかけに見える。FVは読み込んだら出す振り付けにする（監視に任せると、縦の短い画面でCTAが透明のまま残る）", "scope": "全案件", "state": "ng", "note": "スクロールで出る演出が無い（IntersectionObserver が無い）"}, {"id": "mobile-sticky-cta", "name": "スマホで画面に残るCTAがある", "what": "900px以下で、ヘッダー・ナビ・全画面メニューの外に position:fixed / sticky のボタンがあること（FVを見ている間は隠してよい）", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）の「他にも」の1つ。長いLPはスマホで行き先のボタンが画面から消える（ESL・ADSでは入れていた）", "scope": "全案件（申込・来場など行き先がある型）", "state": "ng", "note": "［375px］スマホで画面に残るCTAが無い（ヘッダーの外に position:fixed / sticky のボタンが無い） / ［600px］スマホで画面に残るCTAが無い（ヘッダーの外に position:fixed / sticky のボタンが無い）"}]}, "suzuki-ark1": {"project": "スズキ・メソード ARK Hills Music Week 2026", "project_id": "suzuki-ark", "script_v": "v2", "inherit": false, "at": "2026-09-14 23:15", "script": "# ARK Hills Music Week 2026｜音の遊び場 ── LP原稿 v2\n受領: 2026-09-14（So がチャットに貼った原文。文字は原文のまま、見出しの形だけ Markdown にした） ／ 反映先: suzuki-ark1\n\n## １．ファーストビュー\n- 上部タグ：ARK Hills Music Week 2026｜音の遊び場\n- メインコピー：カラヤン広場ではじめての楽器に出会う2日間\n- サブコピー：スズキ・メソードの指導者・卒業生・子どもたちがカラヤン広場に敷かれた芝生の上で演奏します。 演奏の後はヴァイオリン・チェロ・フルート・ピアノに触れられます。\n- イベント概要\n  - 10月10日（土）・11日（日）\n  - アークヒルズ　アーク・カラヤン広場\n- 条件ブロック（アイコン付きで横並び。コピーより先に目に入る位置）\n  - 入場無料・事前予約不要・参加費不要\n  - 出入り自由\n  - 3歳から体験いただけます\n- CTA\n  - 会場へのアクセス（主CTA・ページ内アクセスへ）\n  - 演奏スケジュールを見る（ページ内リンク）\n\n## ２．3つの安心\n- 見出し：思い立ったらお立ち寄りいただけます\n- カード3枚\n  - ①予約・申込不要　当日広場に来ていただくだけです。参加費もかかりません。\n  - ②途中入場も途中退出も自由　演奏の途中でも体験の途中でもご自由に出入りいただけます。お子さまの機嫌に合わせて15分だけでも大丈夫です。\n  - ③走っても大丈夫な芝生の広場　静かに座って聴く場所ではありません。屋根のある広場に芝生が敷かれますので、赤ちゃん連れでも動き回る年齢でもお楽しみいただけます。\n\n## ３．演奏会\n- 見出し：広場の芝生の上で、すぐそばで音楽が生まれる30分\n- リード：ステージと客席を区切らず、奏者が広場の中に散らばってみなさんと同じ場所から演奏します。\n\n### 演奏スケジュール\n| 日時 | プログラム名 | 内容 |\n| --- | --- | --- |\n| 10月10日（土）11:15－11:45 | スズキチルドレン アンサンブル | ヴァイオリン・チェロ・フルート・ピアノを学ぶ子どもたちによるアンサンブル演奏 |\n| 10月11日（日）11:00－11:30 | スズキ・メソードコンサート | 弦楽器とフルートによるアンサンブル・コンサート |\n\n- 出演：幼児から大人までスズキ・メソードで学ぶ生徒・卒業生・指導者約100名\n- 曲目：スズキ・メソードで最初に学ぶ曲を中心に6曲から7曲を予定しています。フィナーレは子どもたちが一番はじめに学ぶキラキラ星変奏曲。小さな子どもから大人までが同じ曲を一緒に弾きます。\n- 保護者の方へ：こんなに小さな子どもたちが弾いている。子どもと大人が一緒に演奏している。音楽はこんなに身近なんだと感じていただける演奏です。\n\n## ４．ブース\n- 見出し：演奏のあとはそのまま楽器体験へ\n- リード：聴くだけではありません。芝生の上のテーブルとブースで楽器に触れて、メニューから1曲えらんで、写真を持ち帰れます。\n\n### 4-1．楽器体験\n- 小見出し：楽器に触ったことがないお子さまでも楽器を体験できます\n- 本文：ヴァイオリン・チェロ・フルート・ピアノ。興味のある楽器を実際に構えて鳴らしてみてください。複数の楽器を試すこともできます。指導者が横につきますので楽器を触ったことがなくても大丈夫です。\n- ※ヴァイオリン・チェロ・フルートは芝生の上のテーブルで、ピアノはブース内で体験できます。 ピアノは電子ピアノでの体験となります。\n\n### 4-2．音楽レストラン\n- 小見出し：メニューから1曲えらんで注文すると目の前で演奏します\n- コンセプト：音楽を鑑賞するものから、子どもが自分で選び注文し受け取るものへ。ブースの一角を小さなレストランに見立ててメニューボードと食券受付を設置します。演奏者はシェフとして白いエプロンで来場者を迎えます。メニューの8曲から子どもが自分で選び、音楽家とやり取りし、生の音を受け取る体験です。\n- 流れ\n  - 缶バッジをつくる\n  - できあがったら食券をもらう\n  - メニューの8曲から聴きたい曲を1曲えらぶ\n  - シェフ役の先生に食券を渡して注文する\n  - 目の前で2人の先生が生演奏\n- メニュー（8曲）\n\n| 曲名 | 曲名 |\n| --- | --- |\n| タカタカタッタのキラキラ星 | クリスマスの歌 |\n| ちょうちょう | かすみか雲か |\n| こぎつね | ロング・ロング・アゴー |\n| むすんでひらいて | アレグロ |\n\n- いずれもスズキ・メソードの子どもたちが実際に最初に学んでいる曲です。\n- 演奏編成：ヴァイオリン＋ヴァイオリン／ヴァイオリン＋ピアノ／ヴァイオリン＋フルート／ヴァイオリン＋チェロ。同じ曲でも組み合わせで響きが変わりますので2回目のご注文も可能です。\n- シェフのひとこと：演奏者がスズキのロゴの缶バッジをつけた白いエプロンを着用し、シェフとしてお迎えします\n- ＜シェフのセリフ例＞\n  - いらっしゃいませ。食券お預かりいたします\n  - アレグロのオーダー入りました\n  - 毎度ありがとうございました\n\n### 4-3．来場者特典\n- 小見出し：ご来場特典あります\n\n| 特典 | 内容と条件 | 数量 |\n| --- | --- | --- |\n| 缶バッジ | ブースで自分でつくった缶バッジをそのまま持ち帰れます。完成すると音楽レストランの食券がもらえます。 | 材料がなくなり次第終了【要確認】 |\n| 記念フォトカード | 楽器体験のあと簡単なアンケートにご協力いただいた方に、お子さまが好きな楽器と一緒にチェキで記念撮影。その場でオリジナル台紙に貼ってお渡し。 | 各日150名分。なくなり次第終了 |\n\n- 記念フォトカード本文\n  - はじめて楽器にふれた日を一枚の写真に。\n  - 撮影した写真はその場で二つ折りの台紙に貼ってお渡しします。表紙にはイベント名、内側に写真と「きょう、わたしが出会った楽器」のメッセージ、裏面にスズキ・メソードの紹介を掲載しています。帰ってからもご家庭で開けるカードです。\n\n## ５．会場・アクセス\n- 会場　アーク・カラヤン広場（サントリーホール前）。\n- 開催時間　10月10日（土）・11日（日）11:00－17:00\n- アクセス　【最寄駅・所要時間を公式サイトから転記】\n- ベビーカー　【要確認】\n- 雨天時　雨天の場合は一部プログラムが中止となる可能性があります。当日の実施状況は【確認先】でご確認ください。\n- 地図　Googleマップ埋め込み\n- 会場では、ほかにもさまざまな音楽体験をお楽しみいただけます\n- CTA：アークヒルズの公式イベントページへリンク\n\n## ６．よくある質問\n- Q．予約は必要ですか　不要です。当日直接広場へお越しください。\n- Q．参加費はかかりますか　かかりません。同じ広場で開催される他社のワークショップには有料のものがあります。\n- Q．何歳から参加できますか　楽器体験は3歳からを目安にしています。演奏を聴くだけであれば年齢制限はありません。\n- Q．楽器を触ったことがなくても大丈夫ですか　大丈夫です。指導者が横についてご案内します。はじめての方のための体験です。\n- Q．途中で帰っても大丈夫ですか　はい。演奏中でも体験の途中でもご自由にどうぞ。\n- Q．子どもが泣いたり走り回ったりしそうです　芝生の広場ですので問題ありません。静かに座って聴くことを求める場ではありません。\n- Q．教室の勧誘はありますか　【先方確認のうえ記載。書けない場合は項目ごと削除】\n- Q．雨の場合はどうなりますか　一部プログラムが中止となる可能性があります。当日の状況は【確認先】をご覧ください。\n\n## ７．スズキ・メソードについて\n- 見出し：どの子も育つ　育て方ひとつ\n- 本文：スズキ・メソードは世界74の国と地域に広がる音楽教育です。母語を覚えるように聴くことから音楽を学びます。今回演奏する子どもたちも最初はキラキラ星から始めました。\n\n## ８．フッターCTA\n- コピー：10月10日（土）・11日（日）アーク・カラヤン広場。聴いてさわって持ち帰る2日間。\n- ボタン\n  - 会場へのアクセスを見る（主CTA）\n  - Googleカレンダーに追加\n  - アークヒルズ公式イベントページ（外部リンク・参考導線）\n\n## 制作メモ\n- ファーストビューの条件ブロックはコピーを読む前に目に入る位置に置く。日付が最初\n- さわれることを全体の主語にする。演奏会だけのイベントに見えないようにする\n- 音楽レストランと記念フォトカードは公式サイトに載っていない差分。動画広告にも活用。\n\n## v1 からの変更（2026-09-14 原文と突き合わせ）\nv1 は原文を書き写す時に次を落としていた。v2 で原文どおりに戻した（原稿の中身は変わっていない）。\n- 4-3 の小見出し「ご来場特典あります」が v1 に無かった\n- 「演奏スケジュール」の見出しと、メニューの表の見出し「曲名｜曲名」が v1 に無かった\n- 「＜シェフのセリフ例＞」を v1 は「セリフ例：」に書き換えていた\n- 記念フォトカード本文の1行目「はじめて楽器にふれた日を一枚の写真に。」を v1 は次の文とつなげていた\n- 会場の末尾「。」、制作メモ3つ目の末尾「。」が v1 に無かった\n- サブコピーと 4-1 の注記は「。」の後に半角スペースがある。v1 は詰めていた\n- メニューは原文では2列×4行の表。v1 は行ごとに1列へ並べていた（左列＝キラキラ星・ちょうちょう・こぎつね・むすんでひらいて、右列＝クリスマスの歌・かすみか雲か・ロング・ロング・アゴー・アレグロ）\n", "shot": "../suzuki-ark1/_shot.jpg", "items": [{"id": "script-diff", "group": "中身", "name": "原稿との一致", "by": "machine", "state": "ok", "msg": "原稿（v2.md）の文はすべてLPにある"}, {"id": "wording", "group": "中身", "name": "表記ゆれ", "by": "machine", "state": "ok", "msg": "「さま」に統一されている"}, {"id": "self-consistency", "group": "中身", "name": "ページ内の不一致", "by": "machine", "state": "skip", "msg": "対象の型ではない"}, {"id": "lineage", "group": "中身", "name": "版の系統（先祖返り）", "by": "machine", "state": "skip", "msg": "派生元が無い（初版）"}, {"id": "sibling", "group": "中身", "name": "別LPとの食い違い", "by": "machine", "state": "skip", "msg": "フッターの法的リンクが見つからない（この作りではない）"}, {"id": "links", "group": "動作", "name": "リンク・動画・画像の生存", "by": "machine", "state": "ok", "msg": "画像・動画とも生きている"}, {"id": "content-gone", "group": "見た目", "name": "消えている中身", "by": "machine", "state": "ok", "msg": "隠れて消えている中身は無い（幅ごとの出し分けは正常）"}, {"id": "responsive", "group": "見た目", "name": "レスポンシブの崩れ", "by": "machine", "state": "ok", "msg": "5幅とも崩れなし"}, {"id": "overlap", "group": "見た目", "name": "文字と写真の被り", "by": "machine", "state": "ok", "msg": "文字と写真の矩形は重なっていない（5幅で実測）"}, {"id": "orphan-line", "group": "見た目", "name": "改行の孤立", "by": "machine", "state": "ok", "msg": "孤立した行なし"}, {"id": "contrast", "group": "見た目", "name": "罫・面の地との差", "by": "machine", "state": "ok", "msg": "罫・枠は地との ame=\"lp-audience\" content=\"b2c\"> のページは2枚まで", "why": "FVの写真は複数点でなく1枚にする（ADS 2026-09-09）。複数並べると1枚も見られない／B2Cは2枚まで許す（So 2026-09-14。ESL club は小学生と中高生の2枚でクライアントに通っている）", "scope": "全案件（B型は写真ゼロなので対象外）／★例外：suzuki-ark は So の指示で複数写真＋切り抜き（2026-09-14「ぴったり決まる1枚が無い。素材の『名称未設定のデザイン.png』のように複数、ときに背景を透過」）", "state": "ng", "note": "［1440px］FVに幅120px以上の写真が3枚ある / ［375px］FVに幅120px以上の写真が2枚ある / ［1024px］FVに幅120px以上の写真が3枚ある"}, {"id": "mobile-fv-photo-above-cta", "name": "スマホのFVは写真をCTAより上に", "what": "375〜900pxで、FV内の写真の上端がCTA（a/button）の上端より上", "why": "全LP共通の必須条件。スマホは1画面に入る量が少ないので、写真→文字→CTAの順でないと何のLPか分からないまま押させることになる", "scope": "全案件（FVに写真がある型だけ）", "state": "ok", "note": ""}, {"id": "h1-accent", "name": "FV見出しにブランドカラーの強調を1箇所", "what": "FVの見出しの中に、地と区別できる強調が1つ以上（色・下線・地色・マーカー・枠のいずれか）", "why": "見出しのどこかをブランドカラーでハイライト（ADS 2026-09-09）。墨一色だと読点まで読まれない。★2026-09-11 色だけで見ると、地が濃い雰囲気（白い見出し＋白い下線）を誤判定したので広げた", "scope": "全案件", "state": "ok", "note": ""}, {"id": "no-boilerplate-note", "name": "フォームに定型の注記を置かない", "what": "「ご記入いただいた内容は」で始まる注記が無いこと", "why": "フォームの「ご記入いただいた内容は…」の注記は不要（ADS 2026-09-09）。プライバシーポリシーへのリンクがあれば足りる", "scope": "全案件", "state": "skip", "note": "この型では判定の対象が無い"}, {"id": "header-fixed", "name": "ヘッダーを画面上部に固定する", "what": "最初の header（または親）が position:fixed か sticky で、スクロールしても画面に残ること", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）。品質チェックは壊れていないかしか見ないので、作りが素朴なまま全項目を通ってリンクを渡していた", "scope": "全案件", "state": "ok", "note": ""}, {"id": "open-at-top", "name": "開いたらいちばん上から表示する", "what": "history.scrollRestoration を 'manual' にし、#付きで開いた時以外は読み込み時に最上部へ。再読み込みでスクロール位置を戻さない", "why": "「ARK Hills Music Week 2026｜音の遊び場 開いたときにこれが見えない 一番スクロール上になった上でやらんと」（So 2026-09-14、suzuki-ark1）。少し下げて再読み込みすると、ブラウザが44pxの位置を戻し、FVの一行目が固定ヘッダーの裏に隠れていた。撮影は必ず最上部から始まるので、機械の撮影では出ない", "scope": "全案件（固定ヘッダーのある型）", "state": "ok", "note": ""}, {"id": "scroll-motion", "name": "スクロールで中身が順に出る", "what": "IntersectionObserver で、画面に入った .fx（または data-rv）を出していること。対象6つ以上", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）。動きが無いと作りかけに見える。FVは読み込んだら出す振り付けにする（監視に任せると、縦の短い画面でCTAが透明のまま残る）", "scope": "全案件", "state": "ok", "note": ""}, {"id": "mobile-sticky-cta", "name": "スマホで画面に残るCTAがある", "what": "900px以下で、ヘッダー・ナビ・全画面メニューの外に position:fixed / sticky のボタンがあること（FVを見ている間は隠してよい）", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）の「他にも」の1つ。長いLPはスマホで行き先のボタンが画面から消える（ESL・ADSでは入れていた）", "scope": "全案件（申込・来場など行き先がある型）", "state": "ok", "note": ""}]}, "suzuki-ark2": {"project": "スズキ・メソード ARK Hills Music Week 2026", "project_id": "suzuki-ark", "script_v": "v2", "inherit": true, "at": "2026-09-15 15:01", "script": "# ARK Hills Music Week 2026｜音の遊び場 ── LP原稿 v2\n受領: 2026-09-14（So がチャットに貼った原文。文字は原文のまま、見出しの形だけ Markdown にした） ／ 反映先: suzuki-ark1\n\n## １．ファーストビュー\n- 上部タグ：ARK Hills Music Week 2026｜音の遊び場\n- メインコピー：カラヤン広場ではじめての楽器に出会う2日間\n- サブコピー：スズキ・メソードの指導者・卒業生・子どもたちがカラヤン広場に敷かれた芝生の上で演奏します。 演奏の後はヴァイオリン・チェロ・フルート・ピアノに触れられます。\n- イベント概要\n  - 10月10日（土）・11日（日）\n  - アークヒルズ　アーク・カラヤン広場\n- 条件ブロック（アイコン付きで横並び。コピーより先に目に入る位置）\n  - 入場無料・事前予約不要・参加費不要\n  - 出入り自由\n  - 3歳から体験いただけます\n- CTA\n  - 会場へのアクセス（主CTA・ページ内アクセスへ）\n  - 演奏スケジュールを見る（ページ内リンク）\n\n## ２．3つの安心\n- 見出し：思い立ったらお立ち寄りいただけます\n- カード3枚\n  - ①予約・申込不要　当日広場に来ていただくだけです。参加費もかかりません。\n  - ②途中入場も途中退出も自由　演奏の途中でも体験の途中でもご自由に出入りいただけます。お子さまの機嫌に合わせて15分だけでも大丈夫です。\n  - ③走っても大丈夫な芝生の広場　静かに座って聴く場所ではありません。屋根のある広場に芝生が敷かれますので、赤ちゃん連れでも動き回る年齢でもお楽しみいただけます。\n\n## ３．演奏会\n- 見出し：広場の芝生の上で、すぐそばで音楽が生まれる30分\n- リード：ステージと客席を区切らず、奏者が広場の中に散らばってみなさんと同じ場所から演奏します。\n\n### 演奏スケジュール\n| 日時 | プログラム名 | 内容 |\n| --- | --- | --- |\n| 10月10日（土）11:15－11:45 | スズキチルドレン アンサンブル | ヴァイオリン・チェロ・フルート・ピアノを学ぶ子どもたちによるアンサンブル演奏 |\n| 10月11日（日）11:00－11:30 | スズキ・メソードコンサート | 弦楽器とフルートによるアンサンブル・コンサート |\n\n- 出演：幼児から大人までスズキ・メソードで学ぶ生徒・卒業生・指導者約100名\n- 曲目：スズキ・メソードで最初に学ぶ曲を中心に6曲から7曲を予定しています。フィナーレは子どもたちが一番はじめに学ぶキラキラ星変奏曲。小さな子どもから大人までが同じ曲を一緒に弾きます。\n- 保護者の方へ：こんなに小さな子どもたちが弾いている。子どもと大人が一緒に演奏している。音楽はこんなに身近なんだと感じていただける演奏です。\n\n## ４．ブース\n- 見出し：演奏のあとはそのまま楽器体験へ\n- リード：聴くだけではありません。芝生の上のテーブルとブースで楽器に触れて、メニューから1曲えらんで、写真を持ち帰れます。\n\n### 4-1．楽器体験\n- 小見出し：楽器に触ったことがないお子さまでも楽器を体験できます\n- 本文：ヴァイオリン・チェロ・フルート・ピアノ。興味のある楽器を実際に構えて鳴らしてみてください。複数の楽器を試すこともできます。指導者が横につきますので楽器を触ったことがなくても大丈夫です。\n- ※ヴァイオリン・チェロ・フルートは芝生の上のテーブルで、ピアノはブース内で体験できます。 ピアノは電子ピアノでの体験となります。\n\n### 4-2．音楽レストラン\n- 小見出し：メニューから1曲えらんで注文すると目の前で演奏します\n- コンセプト：音楽を鑑賞するものから、子どもが自分で選び注文し受け取るものへ。ブースの一角を小さなレストランに見立ててメニューボードと食券受付を設置します。演奏者はシェフとして白いエプロンで来場者を迎えます。メニューの8曲から子どもが自分で選び、音楽家とやり取りし、生の音を受け取る体験です。\n- 流れ\n  - 缶バッジをつくる\n  - できあがったら食券をもらう\n  - メニューの8曲から聴きたい曲を1曲えらぶ\n  - シェフ役の先生に食券を渡して注文する\n  - 目の前で2人の先生が生演奏\n- メニュー（8曲）\n\n| 曲名 | 曲名 |\n| --- | --- |\n| タカタカタッタのキラキラ星 | クリスマスの歌 |\n| ちょうちょう | かすみか雲か |\n| こぎつね | ロング・ロング・アゴー |\n| むすんでひらいて | アレグロ |\n\n- いずれもスズキ・メソードの子どもたちが実際に最初に学んでいる曲です。\n- 演奏編成：ヴァイオリン＋ヴァイオリン／ヴァイオリン＋ピアノ／ヴァイオリン＋フルート／ヴァイオリン＋チェロ。同じ曲でも組み合わせで響きが変わりますので2回目のご注文も可能です。\n- シェフのひとこと：演奏者がスズキのロゴの缶バッジをつけた白いエプロンを着用し、シェフとしてお迎えします\n- ＜シェフのセリフ例＞\n  - いらっしゃいませ。食券お預かりいたします\n  - アレグロのオーダー入りました\n  - 毎度ありがとうございました\n\n### 4-3．来場者特典\n- 小見出し：ご来場特典あります\n\n| 特典 | 内容と条件 | 数量 |\n| --- | --- | --- |\n| 缶バッジ | ブースで自分でつくった缶バッジをそのまま持ち帰れます。完成すると音楽レストランの食券がもらえます。 | 材料がなくなり次第終了【要確認】 |\n| 記念フォトカード | 楽器体験のあと簡単なアンケートにご協力いただいた方に、お子さまが好きな楽器と一緒にチェキで記念撮影。その場でオリジナル台紙に貼ってお渡し。 | 各日150名分。なくなり次第終了 |\n\n- 記念フォトカード本文\n  - はじめて楽器にふれた日を一枚の写真に。\n  - 撮影した写真はその場で二つ折りの台紙に貼ってお渡しします。表紙にはイベント名、内側に写真と「きょう、わたしが出会った楽器」のメッセージ、裏面にスズキ・メソードの紹介を掲載しています。帰ってからもご家庭で開けるカードです。\n\n## ５．会場・アクセス\n- 会場　アーク・カラヤン広場（サントリーホール前）。\n- 開催時間　10月10日（土）・11日（日）11:00－17:00\n- アクセス　【最寄駅・所要時間を公式サイトから転記】\n- ベビーカー　【要確認】\n- 雨天時　雨天の場合は一部プログラムが中止となる可能性があります。当日の実施状況は【確認先】でご確認ください。\n- 地図　Googleマップ埋め込み\n- 会場では、ほかにもさまざまな音楽体験をお楽しみいただけます\n- CTA：アークヒルズの公式イベントページへリンク\n\n## ６．よくある質問\n- Q．予約は必要ですか　不要です。当日直接広場へお越しください。\n- Q．参加費はかかりますか　かかりません。同じ広場で開催される他社のワークショップには有料のものがあります。\n- Q．何歳から参加できますか　楽器体験は3歳からを目安にしています。演奏を聴くだけであれば年齢制限はありません。\n- Q．楽器を触ったことがなくても大丈夫ですか　大丈夫です。指導者が横についてご案内します。はじめての方のための体験です。\n- Q．途中で帰っても大丈夫ですか　はい。演奏中でも体験の途中でもご自由にどうぞ。\n- Q．子どもが泣いたり走り回ったりしそうです　芝生の広場ですので問題ありません。静かに座って聴くことを求める場ではありません。\n- Q．教室の勧誘はありますか　【先方確認のうえ記載。書けない場合は項目ごと削除】\n- Q．雨の場合はどうなりますか　一部プログラムが中止となる可能性があります。当日の状況は【確認先】をご覧ください。\n\n## ７．スズキ・メソードについて\n- 見出し：どの子も育つ　育て方ひとつ\n- 本文：スズキ・メソードは世界74の国と地域に広がる音楽教育です。母語を覚えるように聴くことから音楽を学びます。今回演奏する子どもたちも最初はキラキラ星から始めました。\n\n## ８．フッターCTA\n- コピー：10月10日（土）・11日（日）アーク・カラヤン広場。聴いてさわって持ち帰る2日間。\n- ボタン\n  - 会場へのアクセスを見る（主CTA）\n  - Googleカレンダーに追加\n  - アークヒルズ公式イベントページ（外部リンク・参考導線）\n\n## 制作メモ\n- ファーストビューの条件ブロックはコピーを読む前に目に入る位置に置く。日付が最初\n- さわれることを全体の主語にする。演奏会だけのイベントに見えないようにする\n- 音楽レストランと記念フォトカードは公式サイトに載っていない差分。動画広告にも活用。\n\n## v1 からの変更（2026-09-14 原文と突き合わせ）\nv1 は原文を書き写す時に次を落としていた。v2 で原文どおりに戻した（原稿の中身は変わっていない）。\n- 4-3 の小見出し「ご来場特典あります」が v1 に無かった\n- 「演奏スケジュール」の見出しと、メニューの表の見出し「曲名｜曲名」が v1 に無かった\n- 「＜シェフのセリフ例＞」を v1 は「セリフ例：」に書き換えていた\n- 記念フォトカード本文の1行目「はじめて楽器にふれた日を一枚の写真に。」を v1 は次の文とつなげていた\n- 会場の末尾「。」、制作メモ3つ目の末尾「。」が v1 に無かった\n- サブコピーと 4-1 の注記は「。」の後に半角スペースがある。v1 は詰めていた\n- メニューは原文では2列×4行の表。v1 は行ごとに1列へ並べていた（左列＝キラキラ星・ちょうちょう・こぎつね・むすんでひらいて、右列＝クリスマスの歌・かすみか雲か・ロング・ロング・アゴー・アレグロ）\n", "shot": "../suzuki-ark2/_shot.jpg", "items": [{"id": "script-diff", "group": "中身", "name": "原稿との一致", "by": "machine", "state": "ok", "msg": "原稿（v2.md）の文はすべてLPにある"}, {"id": "wording", "group": "中身", "name": "表記ゆれ", "by": "machine", "state": "ok", "msg": "「さま」に統一されている"}, {"id": "self-consistency", "group": "中身", "name": "ページ内の不一致", "by": "machine", "state": "skip", "msg": "対象の型ではない"}, {"id": "lineage", "group": "中身", "name": "版の系統（先祖返り）", "by": "machine", "state": "ok", "msg": "派生元 suzuki-ark1 は最新のFB反映版"}, {"id": "sibling", "group": "中身", "name": "別LPとの食い違い", "by": "machine", "state": "skip", "msg": "フッターの法的リンクが見つからない（この作りではない）"}, {"id": "links", "group": "動作", "name": "リンク・動画・画像の生存", "by": "machine", "state": "ok", "msg": "画像・動画とも生きている"}, {"id": "content-gone", "group": "見た目", "name": "消えている中身", "by": "machine", "state": "ok", "msg": "隠れて消えている中身は無い（幅ごとの出し分けは正常）"}, {"id": "responsive", "group": "見た目", "name": "レスポンシブの崩れ", "by": "machine", "state": "ok", "msg": "5幅とも崩れなし"}, {"id": "overlap", "group": "見た目", "name": "文字と写真の被り", "by": "machine", "state": "ok", "msg": "文字 ーポリシーへのリンクがあれば足りる", "scope": "全案件", "state": "skip", "note": "この型では判定の対象が無い"}, {"id": "header-fixed", "name": "ヘッダーを画面上部に固定する", "what": "最初の header（または親）が position:fixed か sticky で、スクロールしても画面に残ること", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）。品質チェックは壊れていないかしか見ないので、作りが素朴なまま全項目を通ってリンクを渡していた", "scope": "全案件", "state": "ok", "note": ""}, {"id": "open-at-top", "name": "開いたらいちばん上から表示する", "what": "history.scrollRestoration を 'manual' にし、#付きで開いた時以外は読み込み時に最上部へ。再読み込みでスクロール位置を戻さない", "why": "「ARK Hills Music Week 2026｜音の遊び場 開いたときにこれが見えない 一番スクロール上になった上でやらんと」（So 2026-09-14、suzuki-ark1）。少し下げて再読み込みすると、ブラウザが44pxの位置を戻し、FVの一行目が固定ヘッダーの裏に隠れていた。撮影は必ず最上部から始まるので、機械の撮影では出ない", "scope": "全案件（固定ヘッダーのある型）", "state": "ok", "note": ""}, {"id": "scroll-motion", "name": "スクロールで中身が順に出る", "what": "IntersectionObserver で、画面に入った .fx（または data-rv）を出していること。対象6つ以上", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）。動きが無いと作りかけに見える。FVは読み込んだら出す振り付けにする（監視に任せると、縦の短い画面でCTAが透明のまま残る）", "scope": "全案件", "state": "ok", "note": ""}, {"id": "mobile-sticky-cta", "name": "スマホで画面に残るCTAがある", "what": "900px以下で、ヘッダー・ナビ・全画面メニューの外に position:fixed / sticky のボタンがあること（FVを見ている間は隠してよい）", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）の「他にも」の1つ。長いLPはスマホで行き先のボタンが画面から消える（ESL・ADSでは入れていた）", "scope": "全案件（申込・来場など行き先がある型）", "state": "ng", "note": "［375px］スマホで画面に残るCTAが無い（ヘッダーの外に position:fixed / sticky のボタンが無い）"}]}, "suzuki-ark3": {"project": "スズキ・メソード ARK Hills Music Week 2026", "project_id": "suzuki-ark", "script_v": "v2", "inherit": true, "at": "2026-09-20 11:10", "script": "# ARK Hills Music Week 2026｜音の遊び場 ── LP原稿 v2\n受領: 2026-09-14（So がチャットに貼った原文。文字は原文のまま、見出しの形だけ Markdown にした） ／ 反映先: suzuki-ark1\n\n## １．ファーストビュー\n- 上部タグ：ARK Hills Music Week 2026｜音の遊び場\n- メインコピー：カラヤン広場ではじめての楽器に出会う2日間\n- サブコピー：スズキ・メソードの指導者・卒業生・子どもたちがカラヤン広場に敷かれた芝生の上で演奏します。 演奏の後はヴァイオリン・チェロ・フルート・ピアノに触れられます。\n- イベント概要\n  - 10月10日（土）・11日（日）\n  - アークヒルズ　アーク・カラヤン広場\n- 条件ブロック（アイコン付きで横並び。コピーより先に目に入る位置）\n  - 入場無料・事前予約不要・参加費不要\n  - 出入り自由\n  - 3歳から体験いただけます\n- CTA\n  - 会場へのアクセス（主CTA・ページ内アクセスへ）\n  - 演奏スケジュールを見る（ページ内リンク）\n\n## ２．3つの安心\n- 見出し：思い立ったらお立ち寄りいただけます\n- カード3枚\n  - ①予約・申込不要　当日広場に来ていただくだけです。参加費もかかりません。\n  - ②途中入場も途中退出も自由　演奏の途中でも体験の途中でもご自由に出入りいただけます。お子さまの機嫌に合わせて15分だけでも大丈夫です。\n  - ③走っても大丈夫な芝生の広場　静かに座って聴く場所ではありません。屋根のある広場に芝生が敷かれますので、赤ちゃん連れでも動き回る年齢でもお楽しみいただけます。\n\n## ３．演奏会\n- 見出し：広場の芝生の上で、すぐそばで音楽が生まれる30分\n- リード：ステージと客席を区切らず、奏者が広場の中に散らばってみなさんと同じ場所から演奏します。\n\n### 演奏スケジュール\n| 日時 | プログラム名 | 内容 |\n| --- | --- | --- |\n| 10月10日（土）11:15－11:45 | スズキチルドレン アンサンブル | ヴァイオリン・チェロ・フルート・ピアノを学ぶ子どもたちによるアンサンブル演奏 |\n| 10月11日（日）11:00－11:30 | スズキ・メソードコンサート | 弦楽器とフルートによるアンサンブル・コンサート |\n\n- 出演：幼児から大人までスズキ・メソードで学ぶ生徒・卒業生・指導者約100名\n- 曲目：スズキ・メソードで最初に学ぶ曲を中心に6曲から7曲を予定しています。フィナーレは子どもたちが一番はじめに学ぶキラキラ星変奏曲。小さな子どもから大人までが同じ曲を一緒に弾きます。\n- 保護者の方へ：こんなに小さな子どもたちが弾いている。子どもと大人が一緒に演奏している。音楽はこんなに身近なんだと感じていただける演奏です。\n\n## ４．ブース\n- 見出し：演奏のあとはそのまま楽器体験へ\n- リード：聴くだけではありません。芝生の上のテーブルとブースで楽器に触れて、メニューから1曲えらんで、写真を持ち帰れます。\n\n### 4-1．楽器体験\n- 小見出し：楽器に触ったことがないお子さまでも楽器を体験できます\n- 本文：ヴァイオリン・チェロ・フルート・ピアノ。興味のある楽器を実際に構えて鳴らしてみてください。複数の楽器を試すこともできます。指導者が横につきますので楽器を触ったことがなくても大丈夫です。\n- ※ヴァイオリン・チェロ・フルートは芝生の上のテーブルで、ピアノはブース内で体験できます。 ピアノは電子ピアノでの体験となります。\n\n### 4-2．音楽レストラン\n- 小見出し：メニューから1曲えらんで注文すると目の前で演奏します\n- コンセプト：音楽を鑑賞するものから、子どもが自分で選び注文し受け取るものへ。ブースの一角を小さなレストランに見立ててメニューボードと食券受付を設置します。演奏者はシェフとして白いエプロンで来場者を迎えます。メニューの8曲から子どもが自分で選び、音楽家とやり取りし、生の音を受け取る体験です。\n- 流れ\n  - 缶バッジをつくる\n  - できあがったら食券をもらう\n  - メニューの8曲から聴きたい曲を1曲えらぶ\n  - シェフ役の先生に食券を渡して注文する\n  - 目の前で2人の先生が生演奏\n- メニュー（8曲）\n\n| 曲名 | 曲名 |\n| --- | --- |\n| タカタカタッタのキラキラ星 | クリスマスの歌 |\n| ちょうちょう | かすみか雲か |\n| こぎつね | ロング・ロング・アゴー |\n| むすんでひらいて | アレグロ |\n\n- いずれもスズキ・メソードの子どもたちが実際に最初に学んでいる曲です。\n- 演奏編成：ヴァイオリン＋ヴァイオリン／ヴァイオリン＋ピアノ／ヴァイオリン＋フルート／ヴァイオリン＋チェロ。同じ曲でも組み合わせで響きが変わりますので2回目のご注文も可能です。\n- シェフのひとこと：演奏者がスズキのロゴの缶バッジをつけた白いエプロンを着用し、シェフとしてお迎えします\n- ＜シェフのセリフ例＞\n  - いらっしゃいませ。食券お預かりいたします\n  - アレグロのオーダー入りました\n  - 毎度ありがとうございました\n\n### 4-3．来場者特典\n- 小見出し：ご来場特典あります\n\n| 特典 | 内容と条件 | 数量 |\n| --- | --- | --- |\n| 缶バッジ | ブースで自分でつくった缶バッジをそのまま持ち帰れます。完成すると音楽レストランの食券がもらえます。 | 材料がなくなり次第終了【要確認】 |\n| 記念フォトカード | 楽器体験のあと簡単なアンケートにご協力いただいた方に、お子さまが好きな楽器と一緒にチェキで記念撮影。その場でオリジナル台紙に貼ってお渡し。 | 各日150名分。なくなり次第終了 |\n\n- 記念フォトカード本文\n  - はじめて楽器にふれた日を一枚の写真に。\n  - 撮影した写真はその場で二つ折りの台紙に貼ってお渡しします。表紙にはイベント名、内側に写真と「きょう、わたしが出会った楽器」のメッセージ、裏面にスズキ・メソードの紹介を掲載しています。帰ってからもご家庭で開けるカードです。\n\n## ５．会場・アクセス\n- 会場　アーク・カラヤン広場（サントリーホール前）。\n- 開催時間　10月10日（土）・11日（日）11:00－17:00\n- アクセス　【最寄駅・所要時間を公式サイトから転記】\n- ベビーカー　【要確認】\n- 雨天時　雨天の場合は一部プログラムが中止となる可能性があります。当日の実施状況は【確認先】でご確認ください。\n- 地図　Googleマップ埋め込み\n- 会場では、ほかにもさまざまな音楽体験をお楽しみいただけます\n- CTA：アークヒルズの公式イベントページへリンク\n\n## ６．よくある質問\n- Q．予約は必要ですか　不要です。当日直接広場へお越しください。\n- Q．参加費はかかりますか　かかりません。同じ広場で開催される他社のワークショップには有料のものがあります。\n- Q．何歳から参加できますか　楽器体験は3歳からを目安にしています。演奏を聴くだけであれば年齢制限はありません。\n- Q．楽器を触ったことがなくても大丈夫ですか　大丈夫です。指導者が横についてご案内します。はじめての方のための体験です。\n- Q．途中で帰っても大丈夫ですか　はい。演奏中でも体験の途中でもご自由にどうぞ。\n- Q．子どもが泣いたり走り回ったりしそうです　芝生の広場ですので問題ありません。静かに座って聴くことを求める場ではありません。\n- Q．教室の勧誘はありますか　【先方確認のうえ記載。書けない場合は項目ごと削除】\n- Q．雨の場合はどうなりますか　一部プログラムが中止となる可能性があります。当日の状況は【確認先】をご覧ください。\n\n## ７．スズキ・メソードについて\n- 見出し：どの子も育つ　育て方ひとつ\n- 本文：スズキ・メソードは世界74の国と地域に広がる音楽教育です。母語を覚えるように聴くことから音楽を学びます。今回演奏する子どもたちも最初はキラキラ星から始めました。\n\n## ８．フッターCTA\n- コピー：10月10日（土）・11日（日）アーク・カラヤン広場。聴いてさわって持ち帰る2日間。\n- ボタン\n  - 会場へのアクセスを見る（主CTA）\n  - Googleカレンダーに追加\n  - アークヒルズ公式イベントページ（外部リンク・参考導線）\n\n## 制作メモ\n- ファーストビューの条件ブロックはコピーを読む前に目に入る位置に置く。日付が最初\n- さわれることを全体の主語にする。演奏会だけのイベントに見えないようにする\n- 音楽レストランと記念フォトカードは公式サイトに載っていない差分。動画広告にも活用。\n\n## v1 からの変更（2026-09-14 原文と突き合わせ）\nv1 は原文を書き写す時に次を落としていた。v2 で原文どおりに戻した（原稿の中身は変わっていない）。\n- 4-3 の小見出し「ご来場特典あります」が v1 に無かった\n- 「演奏スケジュール」の見出しと、メニューの表の見出し「曲名｜曲名」が v1 に無かった\n- 「＜シェフのセリフ例＞」を v1 は「セリフ例：」に書き換えていた\n- 記念フォトカード本文の1行目「はじめて楽器にふれた日を一枚の写真に。」を v1 は次の文とつなげていた\n- 会場の末尾「。」、制作メモ3つ目の末尾「。」が v1 に無かった\n- サブコピーと 4-1 の注記は「。」の後に半角スペースがある。v1 は詰めていた\n- メニューは原文では2列×4行の表。v1 は行ごとに1列へ並べていた（左列＝キラキラ星・ちょうちょう・こぎつね・むすんでひらいて、右列＝クリスマスの歌・かすみか雲か・ロング・ロング・アゴー・アレグロ）\n", "shot": "../suzuki-ark3/_shot.jpg", "items": [{"id": "script-diff", "group": "中身", "name": " ", "how": "重い側から、固まっている所（写真の角・見出しの横など3個以上寄っている所）の飾りを外す。並びの規則（1つおき・等間隔）が残る外し方にし、位置は動かさない"}, {"id": "fv-wrap", "group": "見た目", "name": "横並びの半端な折り返し", "by": "machine", "state": "ok", "msg": "1画面目の横並び（2〜5個）は、折り返しても段ごとの個数がそろっている"}, {"id": "first-read", "group": "意味", "name": "初めて読んで仕組みが分かるか", "by": "claude", "state": "ok", "msg": "私が意味を見る（context/<案件>.md を前提に）", "where": "③音楽レストラン（流れ・メニュー・シェフ・演奏編成）／ヘッダーのナビ／FVの先頭／ご来場特典の缶バッジ", "what": "缶バッジの写真が3個なので「3個もらえる」と読まれないかを見た：本文「自分でつくった缶バッジをそのまま持ち帰れます」は1人いくつとは書いておらず、札は「材料がなくなり次第終了」。3個は絵柄の違う例に見えるが、数の誤解が出ないとは言い切れない（写真と本文の整合に書いた）。／以下 suzuki-ark2 の判定：流れは絵つきで1〜5の順に追え、その下にメニュー（③で選ぶ）・シェフのひとこと（④）・演奏編成（⑤）が手順の順に並ぶ。見出しの前の番号は So「無くて良い」で外した（並び順と絵で追える）。ヘッダーのナビは節の名前でなく、初めての人が知りたい「演奏スケジュール・楽器体験・よくある質問」の3つ。FVは先頭の白いカード（縁の線1本）に日付・会場と条件3つがまとまり、スマホは 日付・会場 → 条件 → イベント名・見出し → 写真 → リード → CTA（So が3案からB。見出しが1画面目に全部入る）、イベント名が見出しの直上にある。原稿で特典の表の下にある「記念フォトカード本文」を、枠の中の2段落目から独立したまとまりに出した（1行目「はじめて楽器にふれた日を一枚の写真に。」を見出しの行にし、子どもの顔にピントが合った写真（チェロを構える男の子）をチェキの枠で添えた。PCは写真が左・文が右、スマホは1行目→写真→本文）。スマホの音楽レストランはメニュー→演奏編成→シェフのひとこと、スズキ・メソードについては見出し→写真→本文の順（So 9/15）。", "how": "直す所なし"}, {"id": "image-fit", "group": "意味", "name": "写真と本文の整合", "by": "claude", "state": "ng", "msg": "私が意味を見る（context/<案件>.md を前提に）", "where": "③演奏会の節の横長写真（前回から）／ご来場特典の缶バッジの写真", "what": "本文は「ステージと客席を区切らず、奏者が広場の中に散らばって…芝生の上で」なのに、演奏会の節の写真は舞台の上に並ぶ演奏と、分かれて聴く観客で、本文と逆の絵になっている（前回から変わっていない）。FVのピアノの写真は、鍵盤のある左下がチェロの写真に隠れて何を弾いているか分からなかったので、ピアノを手前に出し、顔・手・鍵盤が入るように切り直した（今は男の子が鍵盤を弾いているのが見える）。楽器体験の丸写真4枚は体験会の写真で、本文「指導者が横につきます」と合う。流れの絵とシェフの絵は、ページの画風で作り直し、手順の文と1枚ずつ合っている（②の食券に英語の文字が入った・④で先生がギターを持った2枚は作り直した）。シェフはシェフ帽なしで、原稿どおり白いエプロンと丸いバッジ。シェフのひとことの絵は、丸い枠で音符と体が切れていたので、全身が入る絵（先生が親子を迎える）を角丸の四角にした。【今回】缶バッジの画像は、編集依頼で来た実物の写真（フルート・ピアノ・ヴァイオリンの子の絵の缶バッジ3個）を macOS の Vision で切り抜いたもの（絵の中身は変えていない。外部サービスには出していない）。前回の「支給の絵と、ブースで自作する缶バッジが同じ物か」は、編集依頼でこの写真が来場者バッジとして来たので、当日の缶バッジはこの絵柄と読める。ただし本文は「ブースで自分でつくった缶バッジ」で、写真は絵柄が印刷済みの3個。3種から選んでつくるのか・自分で描くのかは原稿からは分からない（音楽レストランの流れの絵①は、テーブルで缶バッジに描く子）", "how": "①演奏会の写真の下に「写真は昨年の様子」と添える（原稿に無い文なので追加の判断が要る）②写真を先生のすぐそ 期状態で全部閉じる", "what": "details に open が付いていないこと", "why": "FAQは1問目もデフォルトで閉じる（ADS 2026-09-09）。1つだけ開いていると、そこが答えだと誤解される", "scope": "全案件", "state": "ok", "note": ""}, {"id": "faq-anim", "name": "FAQの開閉はなめらかに動く", "what": "FAQに開閉のアニメーション（WAAPI）が入っていること", "why": "FAQに開閉のアニメーションを入れる（ADS 2026-09-09）。details の既定は瞬間的に開くので、詰まった印象になる", "scope": "全案件", "state": "ok", "note": ""}, {"id": "fv-one-photo", "name": "FVの写真は1枚（B2Cは2枚まで）", "what": "FV（#fv → h1の親 → 最初のsection）の中で、幅120px以上の画像が1枚だけ。<meta name=\"lp-audience\" content=\"b2c\"> のページは2枚まで", "why": "FVの写真は複数点でなく1枚にする（ADS 2026-09-09）。複数並べると1枚も見られない／B2Cは2枚まで許す（So 2026-09-14。ESL club は小学生と中高生の2枚でクライアントに通っている）", "scope": "全案件（B型は写真ゼロなので対象外）／★例外：suzuki-ark は So の指示で複数写真＋切り抜き（2026-09-14「ぴったり決まる1枚が無い。素材の『名称未設定のデザイン.png』のように複数、ときに背景を透過」）", "state": "ng", "note": "［1440px］FVに幅120px以上の写真が3枚ある / ［375px］FVに幅120px以上の写真が2枚ある"}, {"id": "mobile-fv-photo-above-cta", "name": "スマホのFVは写真をCTAより上に", "what": "375〜900pxで、FV内の写真の上端がCTA（a/button）の上端より上", "why": "全LP共通の必須条件。スマホは1画面に入る量が少ないので、写真→文字→CTAの順でないと何のLPか分からないまま押させることになる", "scope": "全案件（FVに写真がある型だけ）", "state": "ok", "note": ""}, {"id": "h1-accent", "name": "FV見出しにブランドカラーの強調を1箇所", "what": "FVの見出しの中に、地と区別できる強調が1つ以上（色・下線・地色・マーカー・枠のいずれか）", "why": "見出しのどこかをブランドカラーでハイライト（ADS 2026-09-09）。墨一色だと読点まで読まれない。★2026-09-11 色だけで見ると、地が濃い雰囲気（白い見出し＋白い下線）を誤判定したので広げた", "scope": "全案件", "state": "ok", "note": ""}, {"id": "no-boilerplate-note", "name": "フォームに定型の注記を置かない", "what": "「ご記入いただいた内容は」で始まる注記が無いこと", "why": "フォームの「ご記入いただいた内容は…」の注記は不要（ADS 2026-09-09）。プライバシーポリシーへのリンクがあれば足りる", "scope": "全案件", "state": "skip", "note": "この型では判定の対象が無い"}, {"id": "header-fixed", "name": "ヘッダーを画面上部に固定する", "what": "最初の header（または親）が position:fixed か sticky で、スクロールしても画面に残ること", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）。品質チェックは壊れていないかしか見ないので、作りが素朴なまま全項目を通ってリンクを渡していた", "scope": "全案件", "state": "ok", "note": ""}, {"id": "open-at-top", "name": "開いたらいちばん上から表示する", "what": "history.scrollRestoration を 'manual' にし、#付きで開いた時以外は読み込み時に最上部へ。再読み込みでスクロール位置を戻さない", "why": "「ARK Hills Music Week 2026｜音の遊び場 開いたときにこれが見えない 一番スクロール上になった上でやらんと」（So 2026-09-14、suzuki-ark1）。少し下げて再読み込みすると、ブラウザが44pxの位置を戻し、FVの一行目が固定ヘッダーの裏に隠れていた。撮影は必ず最上部から始まるので、機械の撮影では出ない", "scope": "全案件（固定ヘッダーのある型）", "state": "ok", "note": ""}, {"id": "scroll-motion", "name": "スクロールで中身が順に出る", "what": "IntersectionObserver で、画面に入った .fx（または data-rv）を出していること。対象6つ以上", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）。動きが無いと作りかけに見える。FVは読み込んだら出す振り付けにする（監視に任せると、縦の短い画面でCTAが透明のまま残る）", "scope": "全案件", "state": "ok", "note": ""}, {"id": "mobile-sticky-cta", "name": "スマホで画面に残るCTAがある", "what": "900px以下で、ヘッダー・ナビ・全画面メニューの外に position:fixed / sticky のボタンがあること（FVを見ている間は隠してよい）", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）の「他にも」の1つ。長いLPはスマホで行き先のボタンが画面から消える（ESL・ADSでは入れていた）", "scope": "全案件（申込・来場など行き先がある型）", "state": "ng", "note": "［375px］スマホで画面に残るCTAが無い（ヘッダーの外に position:fixed / sticky のボタンが無い）"}]}, "suzuki-ark4": {"project": "スズキ・メソード ARK Hills Music Week 2026", "project_id": "suzuki-ark", "script_v": "v3", "inherit": false, "at": "2026-09-22 22:40", "script": "# ARK Hills Music Week 2026｜音の遊び場 ── LP原稿 v3\n受領: 2026-09-19（クライアントの「修正項目まとめ」PDF＝実行委員会の回答つき。v2 に黄色マーカー＝追加・変更／取り消し線＝削除を反映） ／ 反映先: suzuki-ark4\n\n## １．ファーストビュー\n- 上部タグ：ARK Hills Music Week 2026｜音の遊び場\n- メインコピー：カラヤン広場ではじめての楽器に出会う2日間\n- サブコピー：スズキ・メソードの指導者・卒業生・子どもたちがカラヤン広場に敷かれた芝生の上で演奏します。 演奏の後はヴァイオリン・チェロ・フルート・ピアノに触れられます。\n- イベント概要\n  - 10月10日（土）・11日（日）11:00–17:00\n  - アークヒルズ　アーク・カラヤン広場\n- 条件ブロック（アイコン付きで横並び。コピーより先に目に入る位置）\n  - 入場無料・事前予約不要・参加費不要\n  - 出入り自由\n  - 3歳前後から体験いただけます\n- CTA\n  - 会場へのアクセス（主CTA・ページ内アクセスへ）\n  - 演奏スケジュールを見る（ページ内リンク）\n\n## ２．3つの安心\n- 見出し：思い立ったらお立ち寄りいただけます\n- カード3枚\n  - ①予約・申込不要　当日広場に来ていただくだけです。参加費もかかりません。\n  - ②途中入場も途中退出も自由　演奏の途中でも体験の途中でもご自由に出入りいただけます。お子さまの機嫌に合わせて15分だけでも大丈夫です。\n  - ③走っても大丈夫な芝生の広場　静かに座って聴く場所ではありません。屋根のある広場に芝生が敷かれますので、赤ちゃん連れでも動き回る年齢でもお楽しみいただけます。\n\n## ３．2つのコンサート\n- 見出し：広場の芝生の上で、すぐそばで音楽が生まれる30分\n- リード：芝生コンサートではステージと客席を区切らず、子どもから大人までヴァイオリン、チェロ、フルートの奏者が広場の中に散らばって、みなさんと同じ場所から演奏します。\n\n### 演奏スケジュール（リード文の次に挿入）\n| 日時 | コンサート | 内容 |\n| --- | --- | --- |\n| 10/10（土）11:15–11:45 | スズキチルドレン アンサンブル ～芝生コンサート～ | 子どもたち・OB・OG・指導者 約100名によるアンサンブル |\n| 10/11（日）11:00–11:30 | スズキ・メソード コンサート ～滝前コンサート～ | 子どもたちによる、毎年恒例のコンサート　ヴァイオリン、チェロ、フルート、それぞれの魅力もお楽しみください |\n\n- 各コンサート欄に小さく：YouTube LIVE配信予定\n- 曲目：スズキ・メソードで最初に学ぶ曲を中心に6曲から7曲を予定しています。フィナーレは子どもたちが一番はじめに学ぶキラキラ星変奏曲。\n- 【コンサートの写真を曲目の下に配置】\n- キャプション：昨年の「滝前コンサート」より\n- 保護者の方へ：音楽はこんなに身近で、小さな子どもから大人まで一緒に演奏できるんだと感じていただけるコンサートです\n\n### ライブ配信\n- 当日はライブ配信も予定しています！\n- 会場にお越しになれない方にも、2日間のコンサートの様子をYouTubeでライブ配信します。\n- また、楽器体験の様子もSNSでライブ配信予定です。\n\n## ４．ブース\n- 見出し：演奏のあとはそのまま楽器体験へ\n- リード：聴くだけではありません。広場で楽器に触れて、鳴らしてみましょう。\n\n### 4-1．楽器体験\n- 小見出し：楽器に触ったことがないお子さまでも楽器を体験できます\n- 本文：指導者が横につきますので、楽器を触ったことがなくても大丈夫です。\n\n### 4-2．音楽レストラン\n- 小見出し：♪ 音楽レストラン\n- 煽り：メニューから曲を選んで、オーダー！\n- 本文（トピックス掲載分）\n  - 缶バッジをつくったら、音楽レストランの食券をもらって、メニューから好きな曲をオーダー。\n  - すると……\n  - 生演奏がやってきます♪\n  - 音楽家とやり取りし、生の音を受け取る体験です。\n- イメージ画像【流れとしては見せない。4つの楽器のイラストを散らす】\n  - 缶バッジをつくる\n  - メニューから1曲えらぶ\n  - 生演奏がとどく\n\n### 4-3．来場者特典\n- 小見出し：ご来場特典あります\n\n| 特典 | 内容と条件 | 数量 |\n| --- | --- | --- |\n| 缶バッジ | ブースで自分でつくった缶バッジをそのまま持ち帰れます。完成すると音楽レストランの食券がもらえます。 | お一人様１回、各日先着150名様 |\n| 記念フォトカード | 楽器体験のあと簡単なアンケートにご協力いただいた方に、お子さまが好きな楽器と一緒にチェキで記念撮影。その場でオリジナル台紙に貼ってお渡し。 | 各日100名分。アンケートにご回答いただいた方にお渡しします。なくなり次第終了。 |\n\n- 記念フォトカード本文\n  - はじめて楽器にふれた日を一枚の写真に。\n  - 楽器との出会いを、思い出の一枚に。\n\n## ５．会場・アクセス\n- 会場　アーク・カラヤン広場（サントリーホール前）。\n- 開催時間　10月10日（土）・11日（日）11:00－17:00\n- アクセス　東京メトロ南北線「六本木一丁目駅」3番出口より徒歩1分／東京メトロ銀座線「溜池山王駅」13番出口より徒歩1分\n- ベビーカー　【要確認】\n- 雨天時　事前に雨天が見込まれる場合、ブースにはテントが設置される予定です。楽器体験の実施については各団体判断とのことです。芝生エリアには屋根のある部分もあります。\n- 地図　Googleマップ埋め込み\n- 会場では、ほかにもさまざまな音楽体験をお楽しみいただけます\n- CTA：【会場の下のバナーのリンク先を音の遊び場のページ /events/2026/10/0216.html に変更。フッターの参考導線はイベント全体のページのまま】アークヒルズの公式イベントページへリンク\n\n## ６．よくある質問\n- Q．予約は必要ですか　不要です。当日直接広場へお越しください。\n- Q．参加費はかかりますか　かかりません。同じ広場で開催される他社のワークショップには有料のものがあります。\n- Q．何歳から参加できますか　楽器体験は3歳前後からしていただけます。演奏を聴くだけであれば年齢制限はありません。\n- Q．楽器を触ったことがなくても大丈夫ですか　もちろん大丈夫です。初めて楽器に触れる方にも楽しんでいただけるよう、そばで丁寧にサポートします。\n- Q．途中で帰っても大丈夫ですか　はい。演奏中でも体験の途中でもご自由にどうぞ。\n- Q．子どもが泣いたり走り回ったりしそうです　芝生の広場ですので問題ありません。静かに座って聴くことを求める場ではありません。\n- Q．雨の場合はどうなりますか　事前に雨天が見込まれる場合、ブースにはテントが設置される予定です。楽器体験の実施については各団体判断とのことです。芝生エリアには屋根のある部分もあります。\n\n## ７．スズキ・メソードについて\n- 見出し：どの子も育つ　育て方ひとつ\n- 本文：スズキ・メソードは世界74の国と地域に広がる音楽教育です。母語を覚えるように聴くことから音楽を学びます。今回演奏する子どもたちも最初はキラキラ星から始めました。\n\n## ８．フッターCTA\n- コピー：10月10日（土）・11日（日）はアーク・カラヤン広場へ。聴いて、鳴らして、持ち帰る2日間。\n- ボタン\n  - 会場へのアクセスを見る（主CTA）\n  - Googleカレンダーに追加\n  - アークヒルズ公式イベントページ（外部リンク・参考導線）\n\n## 制作メモ\n- ファーストビューの条件ブロックはコピーを読む前に目に入る位置に置く。日付が最初\n- 日付の後に開催時間を出す（実行委員会の意図＝コンサートを逃したからもう行かないと受け取られるのを防ぎ、一日楽しめると最初に伝える）\n- さわれることを全体の主語にする。演奏会だけのイベントに見えないようにする\n- 音楽レストランは初めての企画。当日やりながら変わる余地と想像の余地を残すため、細かく規定しない\n- 雨天時は周知方法が未定なので、LP上は確定的に書きすぎない\n\n## v2 からの変更（2026-09-19 クライアントFB「修正項目まとめ」の反映）\n黄色マーカー＝追加・変更、取り消し線＝削除。以下は原稿側の差分。\n1. 日時に「11:00－17:00」を追加（FV・メタ情報）\n2. 条件ブロック「3歳から」→「3歳前後から」（実行委員会に確認のうえ）\n3. コンサート：リード文を差し替え（芝生コンサートでは…／楽器名を明記）\n4. コンサート：表の見出し列「プログラム名」→「コンサート」。各行の名称（～芝生コンサート～／～滝前コンサート～）と内容を差し替え\n5. コンサート：「出演　幼児から大人まで…約100名」を項目ごと削除（内容の列に約100名が入ったため）\n6. 曲目：最後の一文「小さな子どもから大人までが同じ曲を一緒に弾きます。」を削除\n7. コンサートの写真を曲目の下に配置し、キャプション「昨年の『滝前コンサート』より」を追加\n8. 保護者の方へ：一文に差し替え\n9. 楽器体験：リードを短く（芝生の上のテーブルとブース…を削除）、本文は後半のみ、体験場所の注記を削除\n10. 音楽レストラン：本文をトピックス掲載分に差し替え。メニュー（8曲）・シェフのひとこと・シェフのセリフ例・演奏編成・「2回目のご注文も可能です」「同じ曲でも組み合わせで響きが変わります」を削除。流れは「流れ」ではなくイメージ画像として3枚＋楽器のイラスト\n11. 来場者特典：缶バッジの数量を「お一人様1回、各日先着150名様」に確定。記念フォトカードは「各日100名分。アンケートにご回答いただいた方にお渡しします。なくなり次第終了。」（アンケートの条件が数量側に移ったので本文からは外した）\n12. 記念フォトカード本文：「楽器との出会いを、思い出の一枚に。」のみ（以後の説明文は削除）\n13. アークヒルズ公式イベントページのリンク先を音の遊び場のページ（/events/2026/10/0216.html）へ\n14. 雨天時：実行委員会の回答に差し替え（テント設置予定・実施は各団体判断・屋根のある部分もある）。FAQの雨の項目も同じ文に\n15. FAQ：何歳から＝3歳前後から／楽器を触ったことがなくても＝文面差し替え／「教室の勧誘はありますか」は項目ごと削除\n16. フッターのコピーを差し替え\n17. ライブ配信を追加（コンサートはYouTube・楽器体験はSNS）。各コンサート欄に小さく「YouTube LIVE配信予定」\n\n## v3 の修正（2026-09-22 So の指摘）\n先方の指示を一字一句そのまま入れ直した。落としていた／変えていた所は次の7つ。\n- 音楽レストランの本文6行のうち「♪ 音楽レストラン」「メニューから曲を選んで、オーダー！」を入れていなかった（今の小見 const ORDER=Object.keys(D).sort(function(a,b){return (D[b].at||'')<(D[a].at||'')?-1:1});
const q=new URLSearchParams(location.search);

const GRP={};
ORDER.forEach(function(v){ (GRP[D[v].project]=GRP[D[v].project]||[]).push(v) });
Object.keys(GRP).forEach(function(pn){
  const og=document.createElement('optgroup'); og.label=pn;
  GRP[pn].forEach(function(v){const o=document.createElement('option');o.value=v;
    o.textContent=v+(D[v].at?'   '+D[v].at:'   （チェックまだ）');og.appendChild(o);});
  sel.appendChild(og);});

sel.value=cur;
sel.addEventListener('change',function(){location.search='?v='+sel.value});
function esc(s){return String(s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function card(i){
  const who=i.by==='machine'?'機械':i.by==='claude'?'Claude':'目視';
  const rows=[];
  if(i.where) rows.push('<dt>どこ</dt><dd>'+esc(i.where)+'</dd>');
  rows.push('<dt>何が</dt><dd>'+esc(i.what||i.msg||'判定をまだ書いていないので、この観点は誰も見ていない')+'</dd>');
  if(i.how) rows.push('<dt>どう直す</dt><dd class="how">'+esc(i.how)+'</dd>');
  return '<div class="f '+i.state+'"><div class="t">'+esc(i.name)+
    '<span class="w" style="margin-left:auto">'+who+'</span></div><dl>'+rows.join('')+'</dl></div>';
}
function draw(){
  const d=D[cur];
  document.getElementById('h-s').innerHTML='原稿 '+(d.script_v||'（未登録）')+
    (d.inherit?' <span style="font-weight:400;color:#a7b0bd">（'+esc(cur)+' 自身には記録が無いので派生元から）</span>':'');
  document.getElementById('md').innerHTML=d.script?esc(d.script)
    :'<span class="none">原稿がまだ無い。<br><code>lpv.py script '+esc(d.project_id||'&lt;案件id&gt;')
      +' --new --file &lt;原稿&gt;</code> で登録し、<br><code>lpv.py script '
      +esc(d.project_id||'&lt;案件id&gt;')+' --set '+esc(cur)+' v1</code> でこのリンクに紐づける。</span>';
  // ★どの項目も必ずどこかに出す。落ちた項目があると「見たつもり」になるのが一番危ない。
  const g={ng:[],claude:[],human:[],warn:[],ok:[],todo:[]};
  (d.items||[]).forEach(function(i){
    (g[i.state]||g[['todo','skip','pending'].indexOf(i.state)>=0?'todo':'ok']).push(i); });
  let h='<div class="sum">'+
    (g.ng.length?'<span class="a">直す '+g.ng.length+'</span>':'')+
    (g.human.length?'<span class="b">あなたが見る '+g.human.length+'</span>':'')+
    (g.warn.length?'<span class="b">公開前 '+g.warn.length+'</span>':'')+
    (g.todo.length?'<span class="d">未判定 '+g.todo.length+'</span>':'')+
    '<span class="c">問題なし '+(g.ok.length+g.claude.length)+'</span></div>';
  if(g.ng.length)    h+='<div class="cap">直した方がよい</div>'+g.ng.map(card).join('');
  if(g.human.length) h+='<div class="cap">あなたが実機で見る</div>'+g.human.map(card).join('');
  if(g.warn.length)  h+='<div class="cap">公開前に確かめる</div>'+g.warn.map(card).join('');
  if(g.todo.length)  h+='<div class="cap">まだ誰も見ていない（判定を書いていない項目）</div>'
                       +g.todo.map(card).join('');
  const fine=g.ok.concat(g.claude);
  if(fine.length)    h+='<div class="cap">見たが問題なかった</div>'+fine.map(card).join('');
  // ★我々の決めごと。壊れているかではなく「決めたとおりか」の層。

  const R=(d.rules||[]);
  if(R.length){
    const brk=R.filter(function(r){return r.state==='ng'});
    const kept=R.filter(function(r){return r.state==='ok'});
    const na=R.filter(function(r){return r.state==='skip'});
    h+='<div class="cap">我々の決めごと（'+kept.length+'/'+(R.length-na.length)+' 守れている）</div>';

      const st=r.state==='ng'?'ng':(r.state==='skip'?'todo':'ok');
      const rows=['<dt>決めごと</dt><dd>'+esc(r.what)+'</dd>'];
      if(r.state==='ng') rows.push('<dt>いま</dt><dd>'+esc(r.note)+'</dd>');
      if(r.state==='skip') rows.push('<dt>いま</dt><dd>'+esc(r.note)+'</dd>');
      rows.push('<dt>なぜ</dt><dd class="how">'+esc(r.why)+'</dd>');
      return '<div class="f '+st+'"><div class="t">'+esc(r.name)+
        '<span class="w" style="margin-left:auto">決めごと</span></div><dl>'+
        rows.join('')+'</dl></div>';
    }).join('');
  }
  document.getElementById('notes').innerHTML=h||'<p class="none">まだチェックしていない。</p>';
}
