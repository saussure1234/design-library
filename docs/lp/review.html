<title>レビュー ─ LP版管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.75 -apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  color:#2b3138;background:#eef1f5}
.bar{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#141a24;color:#fff}
.bar b{font-size:14px}
.bar a{color:#9fb6d4;font-size:12.5px;text-decoration:none}
.bar select{margin-left:auto;background:#232b38;color:#fff;border:0;border-radius:8px;padding:7px 11px;font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(340px,1.15fr);
  gap:14px;padding:14px;height:calc(100vh - 46px)}
.col{background:#fff;border:1px solid #e3e7ee;border-radius:12px;display:flex;flex-direction:column;min-height:0}
.col>h2{margin:0;padding:12px 16px;font-size:12px;letter-spacing:.06em;color:#78818e;
  border-bottom:1px solid #eef0f3;font-weight:700}
.col>div{overflow:auto;padding:14px 16px}
pre.md{white-space:pre-wrap;margin:0;color:#3c434c;font-size:12.5px;line-height:1.95;
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
code{font:11.5px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;background:#f1f3f6;
  border-radius:4px;padding:1px 5px}
.sum{display:flex;gap:8px;padding:0 0 12px;flex-wrap:wrap}
.sum span{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.sum .a{background:#fdeaea;color:#b3261e}
.sum .b{background:#fff4e0;color:#9a6b12}
.sum .c{background:#e8f7ee;color:#1a7f45}
.sum .d{background:#eef1f5;color:#6b7480}
.f.todo{border-style:dashed;border-color:#d7dce4}
.f.todo>.t{background:#fafbfc;color:#78818e}
.cap{font-size:11.5px;letter-spacing:.05em;color:#8b94a3;margin:16px 0 8px}
.cap:first-child{margin-top:0}
.f{border:1px solid #e6e9ee;border-radius:10px;padding:0;margin:0 0 10px;overflow:hidden}
.f>.t{display:flex;align-items:center;gap:8px;padding:9px 12px;font-weight:700;font-size:13.5px;
  border-bottom:1px solid #f1f3f6}
.f .w{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:#f1f3f6;color:#6b7480}
.f dl{margin:0;padding:8px 12px 10px;display:grid;grid-template-columns:64px 1fr;gap:4px 10px;font-size:12.5px}
.f dt{color:#98a1ad;font-size:11.5px;padding-top:2px}
.f dd{margin:0;color:#3c434c;overflow-wrap:anywhere}
.f dd.how{background:#f6f9fc;border-left:3px solid #cfe0f2;padding:6px 9px;border-radius:0 6px 6px 0;color:#2b3138}
.f.ng{border-color:#f0c7c2}
.f.ng>.t{background:#fff6f5;color:#b3261e}
.f.human{border-color:#eddcb4}
.f.human>.t{background:#fffaf0;color:#8a6210}
.f.warn>.t{background:#fffdf4;color:#8a6210}
.f.ok>.t{background:#f7fbf8;color:#1a7f45}
.none{color:#98a1ad;font-size:12.5px;line-height:1.9}
@media(max-width:700px){.wrap{grid-template-columns:1fr;height:auto}}
</style></head><body>

なります。\n\n## CTA（2回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子様のレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## CTA（3回目・4回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：いつまでに2級合格できるかレッスン後にご案内します\n\n## 以降\n現状のLP（/online-c）と同様：キャンペーンバナー／スクールマネジャー紹介／講師紹介／保護者さまの声／中学受験合格実績／他の英語スクールとの違い／教室紹介／フッター\n", "shot": null, "items": [], "rules": []}, "esl17": {"project": "ESL club オンライン校 小学生向け", "project_id": "eslclub-kids", "script_v": "v2", "inherit": false, "at": "2026-09-10 11:54", "script": "# ESL club オンライン校 小学生向けLP 原稿 v2\n受領: 2026-09-10（梶さんFB反映） ／ 反映先: esl17\n\n## FV\nバイリンガル講師のマンツーマンレッスンでオンラインでも集中が続く\n\"小学生で英検2級\"を目指せる英語塾\n\n## CTA（1回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 短期で英検合格を目指せる4つの特徴\n- POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\n- POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\n- POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\n- POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n\n## POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\nESL clubでは、英検1級・TOEFL iBT95点・TOEIC900点レベル以上のバイリンガル講師のみを採用しています。1対1のため、お子さまが画面の前で手を止めたり、表情が曇ったりすれば、すぐに声をかけられます。分からないところは日本語に切り替えて説明するので、低学年のお子さまでも分からないまま時間だけが過ぎることがありません。年齢の近い講師との距離の近さも、英語を好きなまま続ける支えになります。\n見出し：実際のレッスンの様子をご覧ください\n（画像：YouTube動画サムネイル　小3男子　初学者　ハシモトカズマくん）\n（画像：YouTube動画サムネイル　小4女子　学習経験者　オオツカキサちゃん）\n\n## POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\nスクールマネージャーが中心となり、学習計画どおりにレッスンが進むよう講師へ内容を伝達し、生徒さまの進捗をレッスンごとに保護者さまへ共有します。レッスン後、保護者さまへフィードバックを行うので、レッスンに付き添わなくとも、お子さまの英語力の伸びを安心して見守っていただけます。\n\n## POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\nESL clubでは2015年の開塾以降、英検をカリキュラムに用いて、着実な英語力の向上と英検合格に導いてきました。国際基準であるCEFRに対応した英検を用いることで、バランスよく4技能＋語彙力を高めていきます。一般的には、英検2級が高校卒業時の到達目標とされていますが、ESL clubでは、小学生、中学生の時点での高い合格率を誇っています。\n（表：ESL clubの小中学生の英検合格率）5級100%、4級88%、3級86%、準2級64%、2級75%\n注記：2023年度第2回の実績（ESL clubオンライン校）／受験者のうち1次・2次受験双方に合格した生徒の割合\n\n## POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n目標とする級と時期、現在の英語レベル、学習に充てられる時間の4点から逆算して個別の学習計画を作成し、確保できる学習時間に合わせてレッスンの進め方と宿題量を設計します。学習時間そのものを増やすのではなく、限られた時間の使い方を組み立て直すため、他の習い事で忙しいお子さまでも無理なく進められます。将来中学受験をお考えのご家庭でも、低学年のうちに英語を進めておくことで、高学年になったときに他の教科へ時間を回し al-device", "group": "目視", "name": "実機スマホ", "by": "human", "state": "human", "msg": "iPhoneで開いて、改行・被り・タップできるか。Chromeとフォント幅が違うので機械では出ない"}, {"id": "kinsoku", "group": "見た目", "name": "行頭の禁則", "by": "claude", "state": "ng", "msg": "私が意味を見る（context/<案件>.md を前提に）", "where": "①4つの特徴 01 ②4つの特徴 02 ③比較表の項目名「日々の保護者のフォロー」", "what": "1文字だけ次行に落ちている。①③は長音「ー」が行頭に来ていて日本語の禁則違反", "how": "①②はカードの見出しに <br> を入れて意味の切れ目で折る。③は .cmx__item に line-break:strict を足すか、項目名を「日々の保護者フォロー」に1文字詰める"}], "rules": []}, "esl19": {"project": "ESL club オンライン校 小学生向け", "project_id": "eslclub-kids", "script_v": "v2", "inherit": true, "at": "2026-09-11 01:02", "script": "# ESL club オンライン校 小学生向けLP 原稿 v2\n受領: 2026-09-10（梶さんFB反映） ／ 反映先: esl17\n\n## FV\nバイリンガル講師のマンツーマンレッスンでオンラインでも集中が続く\n\"小学生で英検2級\"を目指せる英語塾\n\n## CTA（1回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 短期で英検合格を目指せる4つの特徴\n- POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\n- POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\n- POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\n- POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n\n## POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\nESL clubでは、英検1級・TOEFL iBT95点・TOEIC900点レベル以上のバイリンガル講師のみを採用しています。1対1のため、お子さまが画面の前で手を止めたり、表情が曇ったりすれば、すぐに声をかけられます。分からないところは日本語に切り替えて説明するので、低学年のお子さまでも分からないまま時間だけが過ぎることがありません。年齢の近い講師との距離の近さも、英語を好きなまま続ける支えになります。\n見出し：実際のレッスンの様子をご覧ください\n（画像：YouTube動画サムネイル　小3男子　初学者　ハシモトカズマくん）\n（画像：YouTube動画サムネイル　小4女子　学習経験者　オオツカキサちゃん）\n\n## POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\nスクールマネージャーが中心となり、学習計画どおりにレッスンが進むよう講師へ内容を伝達し、生徒さまの進捗をレッスンごとに保護者さまへ共有します。レッスン後、保護者さまへフィードバックを行うので、レッスンに付き添わなくとも、お子さまの英語力の伸びを安心して見守っていただけます。\n\n## POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\nESL clubでは2015年の開塾以降、英検をカリキュラムに用いて、着実な英語力の向上と英検合格に導いてきました。国際基準であるCEFRに対応した英検を用いることで、バランスよく4技能＋語彙力を高めていきます。一般的には、英検2級が高校卒業時の到達目標とされていますが、ESL clubでは、小学生、中学生の時点での高い合格率を誇っています。\n（表：ESL clubの小中学生の英検合格率）5級100%、4級88%、3級86%、準2級64%、2級75%\n注記：2023年度第2回の実績（ESL clubオンライン校）／受験者のうち1次・2次受験双方に合格した生徒の割合\n\n## POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n目標とする級と時期、現在の英語レベル、学習に充てられる時間の4点から逆算して個別の学習計画を作成し、確保できる学習時間に合わせてレッスンの進め方と宿題量を設計します。学習時間そのものを増やすのではなく、限られた時間の使い方を組み立て直すため、他の習い事で忙しいお子さまでも無理なく進められます。将来中学受験をお考えのご家庭でも、低学年のうちに英語を進めておくことで、高学年になったときに他の教科へ時間を回しやすくなります。\n\n## CTA（2回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## CTA（3回目・4回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 以降\n現状のLP（/online-c）と同様：キャンペーンバナー／スクールマネジャー紹介／講師紹介／保護者さまの声／中学受験合格実績／他の英語スクールとの違い／教室紹介／フッター\n\n## v1 からの変更（梶さんFB 2026-09-10）\n- 4つの特徴の一覧：POINT1 を「学習効率を向上」→「オンラインでも集中が続く」（詳細と不一致だった）\n- POINT2 本文を差し替え\n- POINT3 の注記を一段小さく（デザイン指示）\n- 比較表の ESL club ロゴを大きく（デザイン指示）\n- 表記を「お子さま／保護者さま／生徒さま」に統一\n- CTA補助コピーは4回とも同じ文言に（施主判断。原稿の3・4回目とは異なる）\n- ※要確認：ハシモトカズマくんの動画が「ログインしてください」になる（YouTube側の公開設定）\n", "shot": "../esl19/_shot.jpg", "items": [{"id": "script-diff", "group": "中身", "name": "原稿との一致", "by": "machine", "state": "ok", "msg": "原稿（v2.md）の文はすべてLPにある"}, {"id": "wording", "group": "中身", "name": "表記ゆれ", "by": "machine", "state": "ok", "msg": "「さま」に統一されている"}, {"id": "self-consistency", "group": "中身", "name": "ページ内の不一致", "by": "machine", "state": "ok", "msg": "一覧と詳細の見出しが一致（4件）"}, {"id": "lineage", "group": "中身", "name": "版の系統（先祖返り）", "by": "machine", "state": "ok", "msg": "派生元 esl17 は最新のFB反映版"}, {"id": "sibling", "group": "中身", "name": "別LPとの食い違い", "by": "machine", "state": "ng", "msg": "フッターの表記が別LPと違う（こちらは 会社概要 / プライバシーポリシー）: ESL club 英検プレテスト の esl-pretest-1018: 会社概要（明光ネットワークジャパン） / プライバシーポリシー（クライアントに提示中なので直せない）", "where": "フッターの「会社概要 / プライバシーポリシー」", "how": "英検プレテストのリンクは【クライアントに提示中】なので、いま中身を直すと先方が見ている最中に変わる。次にそのLPを直すタイミングで一緒に直す。オンライン校・小学生向けの2本は揃っているので、この2本については直すところなし。", "what": "フッターの表記が別LPと違う（こちらは 会社概要 / プライバシーポリシー）: ESL club 英検プレテスト の esl-pretest-1018: 会社概要（明光ネットワークジャパン） / プライバシーポリシー（クライアントに提示中なので直せない）"}, {"id": "links", "group": "動作", "name": "リンク・動画・画像の生存", "by": "machine", "state": "ok", "msg": "画像・動画とも生きている", "where": "レッスンの様子の動画2本（8ZYwvDv7rQ8 / 7TLrJshYhXY）", "what": "2本とも生きていて、埋め込みでも再生できる（2026-09-11 確認）", "how": "※要確認：新しいカズマ -ark1\n\n## １．ファーストビュー\n- 上部タグ：ARK Hills Music Week 2026｜音の遊び場\n- メインコピー：カラヤン広場ではじめての楽器に出会う2日間\n- サブコピー：スズキ・メソードの指導者・卒業生・子どもたちがカラヤン広場に敷かれた芝生の上で演奏します。 演奏の後はヴァイオリン・チェロ・フルート・ピアノに触れられます。\n- イベント概要\n  - 10月10日（土）・11日（日）\n  - アークヒルズ　アーク・カラヤン広場\n- 条件ブロック（アイコン付きで横並び。コピーより先に目に入る位置）\n  - 入場無料・事前予約不要・参加費不要\n  - 出入り自由\n  - 3歳から体験いただけます\n- CTA\n  - 会場へのアクセス（主CTA・ページ内アクセスへ）\n  - 演奏スケジュールを見る（ページ内リンク）\n\n## ２．3つの安心\n- 見出し：思い立ったらお立ち寄りいただけます\n- カード3枚\n  - ①予約・申込不要　当日広場に来ていただくだけです。参加費もかかりません。\n  - ②途中入場も途中退出も自由　演奏の途中でも体験の途中でもご自由に出入りいただけます。お子さまの機嫌に合わせて15分だけでも大丈夫です。\n  - ③走っても大丈夫な芝生の広場　静かに座って聴く場所ではありません。屋根のある広場に芝生が敷かれますので、赤ちゃん連れでも動き回る年齢でもお楽しみいただけます。\n\n## ３．演奏会\n- 見出し：広場の芝生の上で、すぐそばで音楽が生まれる30分\n- リード：ステージと客席を区切らず、奏者が広場の中に散らばってみなさんと同じ場所から演奏します。\n\n### 演奏スケジュール\n| 日時 | プログラム名 | 内容 |\n| --- | --- | --- |\n| 10月10日（土）11:15－11:45 | スズキチルドレン アンサンブル | ヴァイオリン・チェロ・フルート・ピアノを学ぶ子どもたちによるアンサンブル演奏 |\n| 10月11日（日）11:00－11:30 | スズキ・メソードコンサート | 弦楽器とフルートによるアンサンブル・コンサート |\n\n- 出演：幼児から大人までスズキ・メソードで学ぶ生徒・卒業生・指導者約100名\n- 曲目：スズキ・メソードで最初に学ぶ曲を中心に6曲から7曲を予定しています。フィナーレは子どもたちが一番はじめに学ぶキラキラ星変奏曲。小さな子どもから大人までが同じ曲を一緒に弾きます。\n- 保護者の方へ：こんなに小さな子どもたちが弾いている。子どもと大人が一緒に演奏している。音楽はこんなに身近なんだと感じていただける演奏です。\n\n## ４．ブース\n- 見出し：演奏のあとはそのまま楽器体験へ\n- リード：聴くだけではありません。芝生の上のテーブルとブースで楽器に触れて、メニューから1曲えらんで、写真を持ち帰れます。\n\n### 4-1．楽器体験\n- 小見出し：楽器に触ったことがないお子さまでも楽器を体験できます\n- 本文：ヴァイオリン・チェロ・フルート・ピアノ。興味のある楽器を実際に構えて鳴らしてみてください。複数の楽器を試すこともできます。指導者が横につきますので楽器を触ったことがなくても大丈夫です。\n- ※ヴァイオリン・チェロ・フルートは芝生の上のテーブルで、ピアノはブース内で体験できます。 ピアノは電子ピアノでの体験となります。\n\n### 4-2．音楽レストラン\n- 小見出し：メニューから1曲えらんで注文すると目の前で演奏します\n- コンセプト：音楽を鑑賞するものから、子どもが自分で選び注文し受け取るものへ。ブースの一角を小さなレストランに見立ててメニューボードと食券受付を設置します。演奏者はシェフとして白いエプロンで来場者を迎えます。メニューの8曲から子どもが自分で選び、音楽家とやり取りし、生の音を受け取る体験です。\n- 流れ\n  - 缶バッジをつくる\n  - できあがったら食券をもらう\n  - メニューの8曲から聴きたい曲を1曲えらぶ\n  - シェフ役の先生に食券を渡して注文する\n  - 目の前で2人の先生が生演奏\n- メニュー（8曲）\n\n| 曲名 | 曲名 |\n| --- | --- |\n| タカタカタッタのキラキラ星 | クリスマスの歌 |\n| ちょうちょう | かすみか雲か |\n| こぎつね | ロング・ロング・アゴー |\n| むすんでひらいて | アレグロ |\n\n- いずれもスズキ・メソードの子どもたちが実際に最初に学んでいる曲です。\n- 演奏編成：ヴァイオリン＋ヴァイオリン／ヴァイオリン＋ピアノ／ヴァイオリン＋フルート／ヴァイオリン＋チェロ。同じ曲でも組み合わせで響きが変わりますので2回目のご注文も可能です。\n- シェフのひとこと：演奏者がスズキのロゴの缶バッジをつけた白いエプロンを着用し、シェフとしてお迎えします\n- ＜シェフのセリフ例＞\n  - いらっしゃいませ。食券お預かりいたします\n  - アレグロのオーダー入りました\n  - 毎度ありがとうございました\n\n### 4-3．来場者特典\n- 小見出し：ご来場特典あります\n\n| 特典 | 内容と条件 | 数量 |\n| --- | --- | --- |\n| 缶バッジ | ブースで自分でつくった缶バッジをそのまま持ち帰れます。完成すると音楽レストランの食券がもらえます。 | 材料がなくなり次第終了【要確認】 |\n| 記念フォトカード | 楽器体験のあと簡単なアンケートにご協力いただいた方に、お子さまが好きな楽器と一緒にチェキで記念撮影。その場でオリジナル台紙に貼ってお渡し。 | 各日150名分。なくなり次第終了 |\n\n- 記念フォトカード本文\n  - はじめて楽器にふれた日を一枚の写真に。\n  - 撮影した写真はその場で二つ折りの台紙に貼ってお渡しします。表紙にはイベント名、内側に写真と「きょう、わたしが出会った楽器」のメッセージ、裏面にスズキ・メソードの紹介を掲載しています。帰ってからもご家庭で開けるカードです。\n\n## ５．会場・アクセス\n- 会場　アーク・カラヤン広場（サントリーホール前）。\n- 開催時間　10月10日（土）・11日（日）11:00－17:00\n- アクセス　【最寄駅・所要時間を公式サイトから転記】\n- ベビーカー　【要確認】\n- 雨天時　雨天の場合は一部プログラムが中止となる可能性があります。当日の実施状況は【確認先】でご確認ください。\n- 地図　Googleマップ埋め込み\n- 会場では、ほかにもさまざまな音楽体験をお楽しみいただけます\n- CTA：アークヒルズの公式イベントページへリンク\n\n## ６．よくある質問\n- Q．予約は必要ですか　不要です。当日直接広場へお越しください。\n- Q．参加費はかかりますか　かかりません。同じ広場で開催される他社のワークショップには有料のものがあります。\n- Q．何歳から参加できますか　楽器体験は3歳からを目安にしています。演奏を聴くだけであれば年齢制限はありません。\n- Q．楽器を触ったことがなくても大丈夫ですか　大丈夫です。指導者が横についてご案内します。はじめての方のための体験です。\n- Q．途中で帰っても大丈夫ですか　はい。演奏中でも体験の途中でもご自由にどうぞ。\n- Q．子どもが泣いたり走り回ったりしそうです　芝生の広場ですので問題ありません。静かに座って聴くことを求める場ではありません。\n- Q．教室の勧誘はありますか　【先方確認のうえ記載。書けない場合は項目ごと削除】\n- Q．雨の場合はどうなりますか　一部プログラムが中止となる可能性があります。当日の状況は【確認先】をご覧ください。\n\n## ７．スズキ・メソードについて\n- 見出し：どの子も育つ　育て方ひとつ\n- 本文：スズキ・メソードは世界74の国と地域に広がる音楽教育です。母語を覚えるように聴くことから音楽を学びます。今回演奏する子どもたちも最初はキラキラ星から始めました。\n\n## ８．フッターCTA\n- コピー：10月10日（土）・11日（日）アーク・カラヤン広場。聴いてさわって持ち帰る2日間。\n- ボタン\n  - 会場へのアクセスを見る（主CTA）\n  - Googleカレンダーに追加\n  - アークヒルズ公式イベントページ（外部リンク・参考導線）\n\n## 制作メモ\n- ファーストビューの条件ブロックはコピーを読む前に目に入る位置に置く。日付が最初\n- さわれることを全体の主語にする。演奏会だけのイベントに見えないようにする\n- 音楽レストランと記念フォトカードは公式サイトに載っていない差分。動画広告にも活用。\n\n## v1 からの変更（2026-09-14 原文と突き合わせ）\nv1 は原文を書き写す時に次を落としていた。v2 で原文どおりに戻した（原稿の中身は変わっていない）。\n- 4-3 の小見出し「ご来場特典あります」が v1 に無かった\n- 「演奏スケジュール」の見出しと、メニューの表の見出し「曲名｜曲名」が v1 に無かった\n- 「＜シェフのセリフ例＞」を v1 は「セリフ例：」に書き換えていた\n- 記念フォトカード本文の1行目「はじめて楽器にふれた日を一枚の写真に。」を v1 は次の文とつなげていた\n- 会場の末尾「 "project_id": "suzuki-ark", "script_v": "v2", "inherit": true, "at": "2026-09-15 14:31", "script": "# ARK Hills Music Week 2026｜音の遊び場 ── LP原稿 v2\n受領: 2026-09-14（So がチャットに貼った原文。文字は原文のまま、見出しの形だけ Markdown にした） ／ 反映先: suzuki-ark1\n\n## １．ファーストビュー\n- 上部タグ：ARK Hills Music Week 2026｜音の遊び場\n- メインコピー：カラヤン広場ではじめての楽器に出会う2日間\n- サブコピー：スズキ・メソードの指導者・卒業生・子どもたちがカラヤン広場に敷かれた芝生の上で演奏します。 演奏の後はヴァイオリン・チェロ・フルート・ピアノに触れられます。\n- イベント概要\n  - 10月10日（土）・11日（日）\n  - アークヒルズ　アーク・カラヤン広場\n- 条件ブロック（アイコン付きで横並び。コピーより先に目に入る位置）\n  - 入場無料・事前予約不要・参加費不要\n  - 出入り自由\n  - 3歳から体験いただけます\n- CTA\n  - 会場へのアクセス（主CTA・ページ内アクセスへ）\n  - 演奏スケジュールを見る（ページ内リンク）\n\n## ２．3つの安心\n- 見出し：思い立ったらお立ち寄りいただけます\n- カード3枚\n  - ①予約・申込不要　当日広場に来ていただくだけです。参加費もかかりません。\n  - ②途中入場も途中退出も自由　演奏の途中でも体験の途中でもご自由に出入りいただけます。お子さまの機嫌に合わせて15分だけでも大丈夫です。\n  - ③走っても大丈夫な芝生の広場　静かに座って聴く場所ではありません。屋根のある広場に芝生が敷かれますので、赤ちゃん連れでも動き回る年齢でもお楽しみいただけます。\n\n## ３．演奏会\n- 見出し：広場の芝生の上で、すぐそばで音楽が生まれる30分\n- リード：ステージと客席を区切らず、奏者が広場の中に散らばってみなさんと同じ場所から演奏します。\n\n### 演奏スケジュール\n| 日時 | プログラム名 | 内容 |\n| --- | --- | --- |\n| 10月10日（土）11:15－11:45 | スズキチルドレン アンサンブル | ヴァイオリン・チェロ・フルート・ピアノを学ぶ子どもたちによるアンサンブル演奏 |\n| 10月11日（日）11:00－11:30 | スズキ・メソードコンサート | 弦楽器とフルートによるアンサンブル・コンサート |\n\n- 出演：幼児から大人までスズキ・メソードで学ぶ生徒・卒業生・指導者約100名\n- 曲目：スズキ・メソードで最初に学ぶ曲を中心に6曲から7曲を予定しています。フィナーレは子どもたちが一番はじめに学ぶキラキラ星変奏曲。小さな子どもから大人までが同じ曲を一緒に弾きます。\n- 保護者の方へ：こんなに小さな子どもたちが弾いている。子どもと大人が一緒に演奏している。音楽はこんなに身近なんだと感じていただける演奏です。\n\n## ４．ブース\n- 見出し：演奏のあとはそのまま楽器体験へ\n- リード：聴くだけではありません。芝生の上のテーブルとブースで楽器に触れて、メニューから1曲えらんで、写真を持ち帰れます。\n\n### 4-1．楽器体験\n- 小見出し：楽器に触ったことがないお子さまでも楽器を体験できます\n- 本文：ヴァイオリン・チェロ・フルート・ピアノ。興味のある楽器を実際に構えて鳴らしてみてください。複数の楽器を試すこともできます。指導者が横につきますので楽器を触ったことがなくても大丈夫です。\n- ※ヴァイオリン・チェロ・フルートは芝生の上のテーブルで、ピアノはブース内で体験できます。 ピアノは電子ピアノでの体験となります。\n\n### 4-2．音楽レストラン\n- 小見出し：メニューから1曲えらんで注文すると目の前で演奏します\n- コンセプト：音楽を鑑賞するものから、子どもが自分で選び注文し受け取るものへ。ブースの一角を小さなレストランに見立ててメニューボードと食券受付を設置します。演奏者はシェフとして白いエプロンで来場者を迎えます。メニューの8曲から子どもが自分で選び、音楽家とやり取りし、生の音を受け取る体験です。\n- 流れ\n  - 缶バッジをつくる\n  - できあがったら食券をもらう\n  - メニューの8曲から聴きたい曲を1曲えらぶ\n  - シェフ役の先生に食券を渡して注文する\n  - 目の前で2人の先生が生演奏\n- メニュー（8曲）\n\n| 曲名 | 曲名 |\n| --- | --- |\n| タカタカタッタのキラキラ星 | クリスマスの歌 |\n| ちょうちょう | かすみか雲か |\n| こぎつね | ロング・ロング・アゴー |\n| むすんでひらいて | アレグロ |\n\n- いずれもスズキ・メソードの子どもたちが実際に最初に学んでいる曲です。\n- 演奏編成：ヴァイオリン＋ヴァイオリン／ヴァイオリン＋ピアノ／ヴァイオリン＋フルート／ヴァイオリン＋チェロ。同じ曲でも組み合わせで響きが変わりますので2回目のご注文も可能です。\n- シェフのひとこと：演奏者がスズキのロゴの缶バッジをつけた白いエプロンを着用し、シェフとしてお迎えします\n- ＜シェフのセリフ例＞\n  - いらっしゃいませ。食券お預かりいたします\n  - アレグロのオーダー入りました\n  - 毎度ありがとうございました\n\n### 4-3．来場者特典\n- 小見出し：ご来場特典あります\n\n| 特典 | 内容と条件 | 数量 |\n| --- | --- | --- |\n| 缶バッジ | ブースで自分でつくった缶バッジをそのまま持ち帰れます。完成すると音楽レストランの食券がもらえます。 | 材料がなくなり次第終了【要確認】 |\n| 記念フォトカード | 楽器体験のあと簡単なアンケートにご協力いただいた方に、お子さまが好きな楽器と一緒にチェキで記念撮影。その場でオリジナル台紙に貼ってお渡し。 | 各日150名分。なくなり次第終了 |\n\n- 記念フォトカード本文\n  - はじめて楽器にふれた日を一枚の写真に。\n  - 撮影した写真はその場で二つ折りの台紙に貼ってお渡しします。表紙にはイベント名、内側に写真と「きょう、わたしが出会った楽器」のメッセージ、裏面にスズキ・メソードの紹介を掲載しています。帰ってからもご家庭で開けるカードです。\n\n## ５．会場・アクセス\n- 会場　アーク・カラヤン広場（サントリーホール前）。\n- 開催時間　10月10日（土）・11日（日）11:00－17:00\n- アクセス　【最寄駅・所要時間を公式サイトから転記】\n- ベビーカー　【要確認】\n- 雨天時　雨天の場合は一部プログラムが中止となる可能性があります。当日の実施状況は【確認先】でご確認ください。\n- 地図　Googleマップ埋め込み\n- 会場では、ほかにもさまざまな音楽体験をお楽しみいただけます\n- CTA：アークヒルズの公式イベントページへリンク\n\n## ６．よくある質問\n- Q．予約は必要ですか　不要です。当日直接広場へお越しください。\n- Q．参加費はかかりますか　かかりません。同じ広場で開催される他社のワークショップには有料のものがあります。\n- Q．何歳から参加できますか　楽器体験は3歳からを目安にしています。演奏を聴くだけであれば年齢制限はありません。\n- Q．楽器を触ったことがなくても大丈夫ですか　大丈夫です。指導者が横についてご案内します。はじめての方のための体験です。\n- Q．途中で帰っても大丈夫ですか　はい。演奏中でも体験の途中でもご自由にどうぞ。\n- Q．子どもが泣いたり走り回ったりしそうです　芝生の広場ですので問題ありません。静かに座って聴くことを求める場ではありません。\n- Q．教室の勧誘はありますか　【先方確認のうえ記載。書けない場合は項目ごと削除】\n- Q．雨の場合はどうなりますか　一部プログラムが中止となる可能性があります。当日の状況は【確認先】をご覧ください。\n\n## ７．スズキ・メソードについて\n- 見出し：どの子も育つ　育て方ひとつ\n- 本文：スズキ・メソードは世界74の国と地域に広がる音楽教育です。母語を覚えるように聴くことから音楽を学びます。今回演奏する子どもたちも最初はキラキラ星から始めました。\n\n## ８．フッターCTA\n- コピー：10月10日（土）・11日（日）アーク・カラヤン広場。聴いてさわって持ち帰る2日間。\n- ボタン\n  - 会場へのアクセスを見る（主CTA）\n  - Googleカレンダーに追加\n  - アークヒルズ公式イベントページ（外部リンク・参考導線）\n\n## 制作メモ\n- ファーストビューの条件ブロックはコピーを読む前に目に入る位置に置く。日付が最初\n- さわれることを全体の主語にする。演奏会だけのイベントに見えないようにする\n- 音楽レストランと記念フォトカードは公式サイトに載っていない差分。動画広告にも活用。\n\n## v1 からの変更（2026-09-14 原文と突き合わせ）\nv1 は原文を書き写す時に次   const g={ng:[],claude:[],human:[],warn:[],ok:[],todo:[]};
  (d.items||[]).forEach(function(i){
    (g[i.state]||g[['todo','skip','pending'].indexOf(i.state)>=0?'todo':'ok']).push(i); });
  let h='<div class="sum">'+
    (g.ng.length?'<span class="a">直す '+g.ng.length+'</span>':'')+
    (g.human.length?'<span class="b">あなたが見る '+g.human.length+'</span>':'')+
    (g.warn.length?'<span class="b">公開前 '+g.warn.length+'</span>':'')+
    (g.todo.length?'<span class="d">未判定 '+g.todo.length+'</span>':'')+
    '<span class="c">問題なし '+(g.ok.length+g.claude.length)+'</span></div>';
  if(g.ng.length)    h+='<div class="cap">直した方がよい</div>'+g.ng.map(card).join('');
  if(g.human.length) h+='<div class="cap">あなたが実機で見る</div>'+g.human.map(card).join('');
  if(g.warn.length)  h+='<div class="cap">公開前に確かめる</div>'+g.warn.map(card).join('');
  if(g.todo.length)  h+='<div class="cap">まだ誰も見ていない（判定を書いていない項目）</div>'
                       +g.todo.map(card).join('');
  const fine=g.ok.concat(g.claude);
  if(fine.length)    h+='<div class="cap">見たが問題なかった</div>'+fine.map(card).join('');
  // ★我々の決めごと。壊れているかではなく「決めたとおりか」の層。
  //   FBの半分は仕様の指示で、品質チェックでは1件も防げない。別の見出しで出す。
  const R=(d.rules||[]);
  if(R.length){
    const brk=R.filter(function(r){return r.state==='ng'});
    const kept=R.filter(function(r){return r.state==='ok'});
    const na=R.filter(function(r){return r.state==='skip'});
    h+='<div class="cap">我々の決めごと（'+kept.length+'/'+(R.length-na.length)+' 守れている）</div>';
    h+=R.map(function(r){
      const st=r.state==='ng'?'ng':(r.state==='skip'?'todo':'ok');
      const rows=['<dt>決めごと</dt><dd>'+esc(r.what)+'</dd>'];
      if(r.state==='ng') rows.push('<dt>いま</dt><dd>'+esc(r.note)+'</dd>');
      if(r.state==='skip') rows.push('<dt>いま</dt><dd>'+esc(r.note)+'</dd>');
      rows.push('<dt>なぜ</dt><dd class="how">'+esc(r.why)+'</dd>');
      return '<div class="f '+st+'"><div class="t">'+esc(r.name)+
        '<span class="w" style="margin-left:auto">決めごと</span></div><dl>'+
        rows.join('')+'</dl></div>';
    }).join('');
  }
  document.getElementById('notes').innerHTML=h||'<p class="none">まだチェックしていない。</p>';
}
draw();
</script></body></html>
