ップできるか。Chromeとフォント幅が違うので機械では出ない", "how": "iPhoneで開いて、①FV見出しの3行目（375px以下だと『塾』が1文字で落ちる）②CTA下の補助コピーが2行か ③動画の全画面ボタンが出るか、の3つを見る"}, {"id": "kinsoku", "group": "見た目", "name": "行頭の禁則", "by": "claude", "state": "ng", "msg": "私が意味を見る（context/<案件>.md を前提に）", "where": "①4つの特徴 03「バイリンガル講師のマンツーマンレッスン」 ②4つの特徴 04・POINT04 見出し「保護者さまが忙しくても安心」 ③比較表の項目名「日々の保護者のフォロー」", "what": "①③は長音「ー」が行頭に落ちて日本語の禁則違反。②は「心」1文字だけが次行に残る", "how": "①カードの見出しを「バイリンガル講師の<br>マンツーマンレッスン」と明示改行にする ②「保護者さまが<br>忙しくても安心」に割る（4つの特徴カードとPOINT04見出しの両方） ③項目名を「日々の保護者フォロー」と1文字詰めるか、.cmx__item に line-break:strict を足す"}]}, "esl15": {"project": "ESL club オンライン校 小学生向け", "project_id": "eslclub-kids", "script_v": "v1", "inherit": false, "at": "", "script": "# ESL club オンライン校 小学生向けLP 原稿 v1\n受領: 2026-09-09 ／ 反映先: esl15\n\n## FV\nバイリンガル講師のマンツーマンレッスンでオンラインでも集中が続く\n\"小学生で英検2級\"を目指せる英語塾\n\n## CTA（1回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子様のレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 短期で英検合格を目指せる4つの特徴\n- POINT1　学習効率を向上｜バイリンガル講師のマンツーマンレッスン\n- POINT2　保護者様が忙しくても安心｜計画の実行をフォローするスクールマネージャー\n- POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\n- POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n\n## POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\nESL clubでは、英検1級・TOEFL iBT95点・TOEIC900点レベル以上のバイリンガル講師のみを採用しています。1対1のため、お子様が画面の前で手を止めたり、表情が曇ったりすれば、すぐに声をかけられます。分からないところは日本語に切り替えて説明するので、低学年のお子様でも分からないまま時間だけが過ぎることがありません。年齢の近い講師との距離の近さも、英語を好きなまま続ける支えになります。\n見出し：実際のレッスンの様子をご覧ください\n（画像：YouTube動画サムネイル　小3男子　初学者　ハシモトカズマくん）\n（画像：YouTube動画サムネイル　小4女子　学習経験者　オオツカキサちゃん）\n\n## POINT2　保護者様が忙しくても安心｜計画の実行をフォローするスクールマネージャー\nスクールマネージャーが中心となり、学習計画どおりにレッスンが進むよう講師へ内容を伝達し、生徒様の進捗をレッスンごとに保護者様へ共有します。保護者様が学習内容を把握したり、レッスンに付き添っていただく必要はありません。お忙しいご家庭でも安心してお任せいただけます。\n\n## POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\nESL clubでは2015年の開塾以降、英検をカリキュラムに用いて、着実な英語力の向上と英検合格に導いてきました。国際基準であるCEFRに対応した英検を用いることで、バランスよく4技能＋語彙力を高めていきます。一般的には、英検2級が高校卒業時の到達目標とされていますが、ESL clubでは、小学生、中学生の時点での高い合格率を誇っています。\n（表：ESL clubの小中学生の英検合格率）5級100%、4級88%、3級86%、準2級64%、2級75%\n注記：2023年度第2回の実績（ESL clubオンライン校）／受験者のうち1次・2次受験双方に合格した生徒の割合\n\n## POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n目標とする級と時期、現在の英語レベル、学習に充てられる時間の4点から逆算して個別の学習計画を作成し、確保できる学習時間に合わせてレッスンの進め方と宿題量を設計します。学習時間そのものを増やすのではなく、限られた時間の使い方を組み立て直すため、他の習い事で忙しいお子様でも無理なく進められます。将来中学受験をお考えのご家庭でも、低学年のうちに英語を進めておくことで、高学年になったときに他の教科へ時間を回しやすくなります。\n\n## CTA（2回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子様のレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## CTA（3回目・4回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：いつまでに2級合格できるかレッスン後にご案内します\n\n## 以降\n現状のLP（/online-c）と同様：キャンペーンバナー／スクールマネジャー紹介／講師紹介／保護者さまの声／中学受験合格実績／他の英語スクールとの違い／教室紹介／フッター\n", "shot": null, "items": []}, "esl17": {"project": "ESL club オンライン校 小学生向け", "project_id": "eslclub-kids", "script_v": "v2", "inherit": false, "at": "2026-09-10 11:18", "script": "# ESL club オンライン校 小学生向けLP 原稿 v2\n受領: 2026-09-10（梶さんFB反映） ／ 反映先: esl17\n\n## FV\nバイリンガル講師のマンツーマンレッスンでオンラインでも集中が続く\n\"小学生で英検2級\"を目指せる英語塾\n\n## CTA（1回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 短期で英検合格を目指せる4つの特徴\n- POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\n- POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\n- POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\n- POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n\n## POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\nESL clubでは、英検1級・TOEFL iBT95点・TOEIC900点レベル以上のバイリンガル講師のみを採用しています。1対1のため、お子さまが画面の前で手を止めたり、表情が曇ったりすれば、すぐに声をかけられます。分からないところは日本語に切り替えて説明するので、低学年のお子さまでも分からないまま時間だけが過ぎることがありません。年齢の近い講師との距離の近さも、英語を好きなまま続ける支えになります。\n見出し：実際のレッスンの様子をご覧ください\n（画像：YouTube動画サムネイル　小3男子　初学者　ハシモトカズマくん）\n（画像：YouTube動画サムネイル　小4女子　学習経験者　オオツカキサちゃん）\n\n## POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\nスクールマネージャーが中心となり、学習計画どおりにレッスンが進むよう講師へ内容を伝達し、生徒さまの進捗をレッスンごとに保護者さまへ共有します。レッスン後、保護者さまへフィードバックを行うので、レッスンに付き添わなくとも、お子さまの英語力の伸びを安心して見守っていただけます。\n\n## POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\nESL clubでは2015年の開塾以降、英検をカリキュラムに用いて、着実な英語力の向上と英検合格に導いてきました。国際基準であるCEFRに対応した英検を用いることで、バランスよく4技能＋語彙力を高めていきます。一般的には、英検2級が高校卒業時の到達目標とされていますが、ESL clubでは、小学生、中学生の時点での高い合格率を誇っています。\n（表：ESL clubの小中学生の英検合格率）5級100%、4級88%、3級86%、準2級64%、2級75%\n注記：2023年度第2回の実績（ESL clubオンライン校）／受験者のうち1次・2次受験双方に合格した生徒の割合\n\n## POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n目標とする級と時期、現在の英語レベル、学習に充てられる時間の4点から逆算して個別の学習計画を作成し、確保できる学習時間に合わせてレッスンの進め方と宿題量を設計します。学習時間そのものを増やすのではなく、限られた時間の使い方を組み立て直すため、他の習い事で忙しいお子さまでも無理なく進められます。将来中学受験をお考えのご家庭でも、低学年のうちに英語を進めておくことで、高学年になったときに他の教科へ時間を回しやすくなります。\n\n## CTA（2回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## CTA（3回目・4回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 以降\n現状のLP（/online-c）と同様：キャンペーンバナー／スクールマネジャー紹介／講師紹介／保護者さまの声／中学受験合格実績／他の英語スクールとの違い／教室紹介／フッター\n\n## v1 からの変更（梶さんFB 2026-09-10）\n- 4つの特徴の一覧：POINT1 を「学習効率を向上」→「オンラインでも集中が続く」（詳細と不一致だった）\n- POINT2 本文を差し替え\n- POINT3 の注記を一段小さく（デザイン指示）\n- 比較表の ESL club ロゴを大きく（デザイン指示）\n- 表記を「お子さま／保護者さま／生徒さま」に統一\n- CTA補助コピーは4回とも同じ文言に（施主判断。原稿の3・4回目とは異なる）\n- ※要確認：ハシモトカズマくんの動画が「ログインしてください」になる（YouTube側の公開設定）\n", "shot": "../esl17/_shot.jpg", "items": [{"id": "script-diff", "group": "中身", "name": "原稿との一致", "by": "machine", "state": "ok", "msg": "原稿（v2.md）の文はすべてLPにある"}, {"id": "wording", "group": "中身", "name": "表記ゆれ", "by": "machine", "state": "ok", "msg": "「さま」に統一されている"}, {"id": "self-consistency", "group": "中身", "name": "ページ内の不一致", "by": "machine", "state": "ok", "msg": "一覧と詳細の見出しが一致（4件）"}, {"id": "lineage", "group": "中身", "name": "版の系統（先祖返り）", "by": "machine", "state": "ok", "msg": "派生元 esl15 は最新のFB反映版"}, {"id": "links", "group": "動作", "name": "リンク・動画・画像の生存", "by": "machine", "state": "ok", "msg": "画像・動画とも生きている", "how": "★機械は oEmbed しか見ていない。ハシモトカズマくんの動画は『Please sign in』で再生できない＝YouTube側の公開設定。先方への依頼事項"}, {"id": "responsive", "group": "見た目", "name": "レスポンシブの崩れ", "by": "machine", "state": "ok", "msg": "5幅とも崩れなし"}, {"id": "orphan-line", "group": "見た目", "name": "改行の孤立", "by": "machine", "state": "ok", "msg": "孤立した行なし"}, {"id": "unreadable", "group": "見た目", "name": "読めない文字", "by": "claude", "state": "ok", "msg": "私が意味を見る（context/<案件>.md を前提に）", "how": "直すところなし。比較表の「定期面談あり」はグレーだが十分に読める"}, {"id": "scale", "group": "見た目", "name": "要素の大きさの釣り合い", "by": "claude", "state": "ng", "msg": "私が意味を見る（context/<案件>.md を前提に）", "where": "POINT02（保護者さまが忙しくても安心）の情報共有図", "what": "他の3枚より図が大きく、緑の面からのはみ出しが目立つ", "how": "points-b.css の .tone-brand .vhr__top > .vhr__fig の列を 0.53fr → 0.46fr にするか、図に max-width:88% を掛けて1〜2割小さくする"}, {"id": "alignment", "group": "見た目", "name": "高さ・位置の揃い", "by": "machine", "state": "todo", "msg": "自動判定はこれから"}, {"id": "image-fit", "group": "意味", "name": "写真と本文の整合", "by": "claude", "state": "ok", "msg": "私が意味を見る（context/<案件>.md を前提に）", "how": "直すところなし。01=講師3人／02=情報共有図／03=合格率／04=勉強＋サッカー"}, {"id": "tone", "group": "意味", "name": "言い過ぎ・トーン", "by": "claude", "state": "ok", "msg": "私が意味を見る（context/<案件>.md を前提に）", "how": "直すところなし。合格率には注記が付き、context のNGも守られている"}, {"id": "br-margin", "group": "見た目", "name": "明示改行の余裕", "by": "machine", "state": "ng", "msg": "5幅のいずれかで検出（まとめ画像の左上を見る）", "where": "POINT01のリード「累計1,000名以上を合格に導いた／英検ベースのカリキュラム」（375px）と、320px以下での FVのアイキャッチ・4つの特徴・POINTリード", "what": "375pxでは262/291px＝余り10%で、ぎりぎり収まっている（実機Safariは字が数%広いので、ここが1行増える可能性がある）。320px以下では -5〜-11% で実際に溢れている", "how": "375pxは様子見でよい。320px以下まで守るなら @media(max-width:360px) で .vhr__sub / .fnc__d を1px小さくする。★ただし『リードを15pxにしたら小さすぎた』と以前に言われているので、勝手には触っていません"}, {"id": "embed-controls", "group": "動作", "name": "埋め込み動画の操作", "by": "machine", "state": "ng", "msg": "動画は280px以上あり、allow に fullscreen も入っている", "where": "レッスンの様子の動画2本（PC・タブレット幅）", "what": "esl16 と同じ。スマホは331pxに直したが、901px以上では 220〜274px のまま", "how": "esl16 と同じ直し方。2本まとめてどうするか決めてください"}, {"id": "motion", "group": "動作", "name": "動き", "by": "machine", "state": "ok", "msg": "出る順は DOM の順（data-d 59箇所）。最初から見えていないかは5幅の撮影で判定"}, {"id": "publish", "group": "公開前", "name": "公開前の設定", "by": "machine", "state": "warn", "msg": "noindex あり＝提示用。本番公開の前に外す ／ 未設定: OGPタイトル / OGP画像 / OGP説明 / favicon / 計測タグ（提示用なら不要）", "how": "本番公開の直前に robots の noindex を外す。OGP・favicon・計測タグは提示用なら不要"}, {"id": "secrets", "group": "公開前", "name": "出してはいけないもの", "by": "machine", "state": "ok", "msg": "金額はあるが料金表のページ（19件）。手元のパス・鍵は無い"}, {"id": "real-device", "group": "目視", "name": "実機スマホ", "by": "human", "state": "human", "msg": const ORDER=Object.keys(D).sort(function(a,b){return (D[b].at||'')<(D[a].at||'')?-1:1});
const q=new URLSearchParams(location.search);
const sel=document.getElementById('sel');

    (g.warn.length?'<span class="b">公開前 '+g.warn.length+'</span>':'')+
    (g.todo.length?'<span class="d">未判定 '+g.todo.length+'</span>':'')+
    '<span class="c">問題なし '+(g.ok.length+g.claude.length)+'</span></div>';
  if(g.ng.length)    h+='<div class="cap">直した方がよい</div>'+g.ng.map(card).join('');
  if(g.human.length) h+='<div class="cap">あなたが実機で見る</div>'+g.human.map(card).join('');
  if(g.warn.length)  h+='<div class="cap">公開前に確かめる</div>'+g.warn.map(card).join('');
  if(g.todo.length)  h+='<div class="cap">まだ誰も見ていない（判定を書いていない項目）</div>'
                       +g.todo.map(card).join('');
  const fine=g.ok.concat(g.claude);
  if(fine.length)    h+='<div class="cap">見たが問題なかった</div>'+fine.map(card).join('');
  document.getElementById('notes').innerHTML=h||'<p class="none">まだチェックしていない。</p>';
}
draw();
</script></body></html>
