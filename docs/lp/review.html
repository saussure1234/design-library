<title>レビュー ─ LP版管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.75 -apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  color:#2b3138;background:#eef1f5}
.bar{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#141a24;color:#fff}
.bar b{font-size:14px}
.bar a{color:#9fb6d4;font-size:12.5px;text-decoration:none}
.bar select{margin-left:auto;background:#232b38;color:#fff;border:0;border-radius:8px;padding:7px 11px;font-size:13px}
.wrap{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(340px,1.15fr);
  gap:14px;padding:14px;height:calc(100vh - 46px)}
.col{background:#fff;border:1px solid #e3e7ee;border-radius:12px;display:flex;flex-direction:column;min-height:0}
.col>h2{margin:0;padding:12px 16px;font-size:12px;letter-spacing:.06em;color:#78818e;
  border-bottom:1px solid #eef0f3;font-weight:700}
.col>div{overflow:auto;padding:14px 16px}
pre.md{white-space:pre-wrap;margin:0;color:#3c434c;font-size:12.5px;line-height:1.95;
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
code{font:11.5px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;background:#f1f3f6;
  border-radius:4px;padding:1px 5px}
.sum{display:flex;gap:8px;padding:0 0 12px;flex-wrap:wrap}
.sum span{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.sum .a{background:#fdeaea;color:#b3261e}
.sum .b{background:#fff4e0;color:#9a6b12}
.sum .c{background:#e8f7ee;color:#1a7f45}
.sum .d{background:#eef1f5;color:#6b7480}
.f.todo{border-style:dashed;border-color:#d7dce4}
.f.todo>.t{background:#fafbfc;color:#78818e}
.cap{font-size:11.5px;letter-spacing:.05em;color:#8b94a3;margin:16px 0 8px}
.cap:first-child{margin-top:0}
.f{border:1px solid #e6e9ee;border-radius:10px;padding:0;margin:0 0 10px;overflow:hidden}
.f>.t{display:flex;align-items:center;gap:8px;padding:9px 12px;font-weight:700;font-size:13.5px;
  border-bottom:1px solid #f1f3f6}
.f .w{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:#f1f3f6;color:#6b7480}
.f dl{margin:0;padding:8px 12px 10px;display:grid;grid-template-columns:64px 1fr;gap:4px 10px;font-size:12.5px}
.f dt{color:#98a1ad;font-size:11.5px;padding-top:2px}
.f dd{margin:0;color:#3c434c;overflow-wrap:anywhere}
.f dd.how{background:#f6f9fc;border-left:3px solid #cfe0f2;padding:6px 9px;border-radius:0 6px 6px 0;color:#2b3138}
.f.ng{border-color:#f0c7c2}
.f.ng>.t{background:#fff6f5;color:#b3261e}
.f.human{border-color:#eddcb4}
.f.human>.t{background:#fffaf0;color:#8a6210}
.f.warn>.t{background:#fffdf4;color:#8a6210}
.f.ok>.t{background:#f7fbf8;color:#1a7f45}
.none{color:#98a1ad;font-size:12.5px;line-height:1.9}
@media(max-width:700px){.wrap{grid-template-columns:1fr;height:auto}}
</style></head><body>

なります。\n\n## CTA（2回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子様のレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## CTA（3回目・4回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：いつまでに2級合格できるかレッスン後にご案内します\n\n## 以降\n現状のLP（/online-c）と同様：キャンペーンバナー／スクールマネジャー紹介／講師紹介／保護者さまの声／中学受験合格実績／他の英語スクールとの違い／教室紹介／フッター\n", "shot": null, "items": [], "rules": []}, "esl17": {"project": "ESL club オンライン校 小学生向け", "project_id": "eslclub-kids", "script_v": "v2", "inherit": false, "at": "2026-09-10 11:54", "script": "# ESL club オンライン校 小学生向けLP 原稿 v2\n受領: 2026-09-10（梶さんFB反映） ／ 反映先: esl17\n\n## FV\nバイリンガル講師のマンツーマンレッスンでオンラインでも集中が続く\n\"小学生で英検2級\"を目指せる英語塾\n\n## CTA（1回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 短期で英検合格を目指せる4つの特徴\n- POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\n- POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\n- POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\n- POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n\n## POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\nESL clubでは、英検1級・TOEFL iBT95点・TOEIC900点レベル以上のバイリンガル講師のみを採用しています。1対1のため、お子さまが画面の前で手を止めたり、表情が曇ったりすれば、すぐに声をかけられます。分からないところは日本語に切り替えて説明するので、低学年のお子さまでも分からないまま時間だけが過ぎることがありません。年齢の近い講師との距離の近さも、英語を好きなまま続ける支えになります。\n見出し：実際のレッスンの様子をご覧ください\n（画像：YouTube動画サムネイル　小3男子　初学者　ハシモトカズマくん）\n（画像：YouTube動画サムネイル　小4女子　学習経験者　オオツカキサちゃん）\n\n## POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\nスクールマネージャーが中心となり、学習計画どおりにレッスンが進むよう講師へ内容を伝達し、生徒さまの進捗をレッスンごとに保護者さまへ共有します。レッスン後、保護者さまへフィードバックを行うので、レッスンに付き添わなくとも、お子さまの英語力の伸びを安心して見守っていただけます。\n\n## POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\nESL clubでは2015年の開塾以降、英検をカリキュラムに用いて、着実な英語力の向上と英検合格に導いてきました。国際基準であるCEFRに対応した英検を用いることで、バランスよく4技能＋語彙力を高めていきます。一般的には、英検2級が高校卒業時の到達目標とされていますが、ESL clubでは、小学生、中学生の時点での高い合格率を誇っています。\n（表：ESL clubの小中学生の英検合格率）5級100%、4級88%、3級86%、準2級64%、2級75%\n注記：2023年度第2回の実績（ESL clubオンライン校）／受験者のうち1次・2次受験双方に合格した生徒の割合\n\n## POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n目標とする級と時期、現在の英語レベル、学習に充てられる時間の4点から逆算して個別の学習計画を作成し、確保できる学習時間に合わせてレッスンの進め方と宿題量を設計します。学習時間そのものを増やすのではなく、限られた時間の使い方を組み立て直すため、他の習い事で忙しいお子さまでも無理なく進められます。将来中学受験をお考えのご家庭でも、低学年のうちに英語を進めておくことで、高学年になったときに他の教科へ時間を回し al-device", "group": "目視", "name": "実機スマホ", "by": "human", "state": "human", "msg": "iPhoneで開いて、改行・被り・タップできるか。Chromeとフォント幅が違うので機械では出ない"}, {"id": "kinsoku", "group": "見た目", "name": "行頭の禁則", "by": "claude", "state": "ng", "msg": "私が意味を見る（context/<案件>.md を前提に）", "where": "①4つの特徴 01 ②4つの特徴 02 ③比較表の項目名「日々の保護者のフォロー」", "what": "1文字だけ次行に落ちている。①③は長音「ー」が行頭に来ていて日本語の禁則違反", "how": "①②はカードの見出しに <br> を入れて意味の切れ目で折る。③は .cmx__item に line-break:strict を足すか、項目名を「日々の保護者フォロー」に1文字詰める"}], "rules": []}, "esl19": {"project": "ESL club オンライン校 小学生向け", "project_id": "eslclub-kids", "script_v": "v2", "inherit": true, "at": "2026-09-11 01:02", "script": "# ESL club オンライン校 小学生向けLP 原稿 v2\n受領: 2026-09-10（梶さんFB反映） ／ 反映先: esl17\n\n## FV\nバイリンガル講師のマンツーマンレッスンでオンラインでも集中が続く\n\"小学生で英検2級\"を目指せる英語塾\n\n## CTA（1回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 短期で英検合格を目指せる4つの特徴\n- POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\n- POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\n- POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\n- POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n\n## POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\nESL clubでは、英検1級・TOEFL iBT95点・TOEIC900点レベル以上のバイリンガル講師のみを採用しています。1対1のため、お子さまが画面の前で手を止めたり、表情が曇ったりすれば、すぐに声をかけられます。分からないところは日本語に切り替えて説明するので、低学年のお子さまでも分からないまま時間だけが過ぎることがありません。年齢の近い講師との距離の近さも、英語を好きなまま続ける支えになります。\n見出し：実際のレッスンの様子をご覧ください\n（画像：YouTube動画サムネイル　小3男子　初学者　ハシモトカズマくん）\n（画像：YouTube動画サムネイル　小4女子　学習経験者　オオツカキサちゃん）\n\n## POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\nスクールマネージャーが中心となり、学習計画どおりにレッスンが進むよう講師へ内容を伝達し、生徒さまの進捗をレッスンごとに保護者さまへ共有します。レッスン後、保護者さまへフィードバックを行うので、レッスンに付き添わなくとも、お子さまの英語力の伸びを安心して見守っていただけます。\n\n## POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\nESL clubでは2015年の開塾以降、英検をカリキュラムに用いて、着実な英語力の向上と英検合格に導いてきました。国際基準であるCEFRに対応した英検を用いることで、バランスよく4技能＋語彙力を高めていきます。一般的には、英検2級が高校卒業時の到達目標とされていますが、ESL clubでは、小学生、中学生の時点での高い合格率を誇っています。\n（表：ESL clubの小中学生の英検合格率）5級100%、4級88%、3級86%、準2級64%、2級75%\n注記：2023年度第2回の実績（ESL clubオンライン校）／受験者のうち1次・2次受験双方に合格した生徒の割合\n\n## POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n目標とする級と時期、現在の英語レベル、学習に充てられる時間の4点から逆算して個別の学習計画を作成し、確保できる学習時間に合わせてレッスンの進め方と宿題量を設計します。学習時間そのものを増やすのではなく、限られた時間の使い方を組み立て直すため、他の習い事で忙しいお子さまでも無理なく進められます。将来中学受験をお考えのご家庭でも、低学年のうちに英語を進めておくことで、高学年になったときに他の教科へ時間を回しやすくなります。\n\n## CTA（2回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## CTA（3回目・4回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 以降\n現状のLP（/online-c）と同様：キャンペーンバナー／スクールマネジャー紹介／講師紹介／保護者さまの声／中学受験合格実績／他の英語スクールとの違い／教室紹介／フッター\n\n## v1 からの変更（梶さんFB 2026-09-10）\n- 4つの特徴の一覧：POINT1 を「学習効率を向上」→「オンラインでも集中が続く」（詳細と不一致だった）\n- POINT2 本文を差し替え\n- POINT3 の注記を一段小さく（デザイン指示）\n- 比較表の ESL club ロゴを大きく（デザイン指示）\n- 表記を「お子さま／保護者さま／生徒さま」に統一\n- CTA補助コピーは4回とも同じ文言に（施主判断。原稿の3・4回目とは異なる）\n- ※要確認：ハシモトカズマくんの動画が「ログインしてください」になる（YouTube側の公開設定）\n", "shot": "../esl19/_shot.jpg", "items": [{"id": "script-diff", "group": "中身", "name": "原稿との一致", "by": "machine", "state": "ok", "msg": "原稿（v2.md）の文はすべてLPにある"}, {"id": "wording", "group": "中身", "name": "表記ゆれ", "by": "machine", "state": "ok", "msg": "「さま」に統一されている"}, {"id": "self-consistency", "group": "中身", "name": "ページ内の不一致", "by": "machine", "state": "ok", "msg": "一覧と詳細の見出しが一致（4件）"}, {"id": "lineage", "group": "中身", "name": "版の系統（先祖返り）", "by": "machine", "state": "ok", "msg": "派生元 esl17 は最新のFB反映版"}, {"id": "sibling", "group": "中身", "name": "別LPとの食い違い", "by": "machine", "state": "ng", "msg": "フッターの表記が別LPと違う（こちらは 会社概要 / プライバシーポリシー）: ESL club 英検プレテスト の esl-pretest-1018: 会社概要（明光ネットワークジャパン） / プライバシーポリシー（クライアントに提示中なので直せない）", "where": "フッターの「会社概要 / プライバシーポリシー」", "how": "英検プレテストのリンクは【クライアントに提示中】なので、いま中身を直すと先方が見ている最中に変わる。次にそのLPを直すタイミングで一緒に直す。オンライン校・小学生向けの2本は揃っているので、この2本については直すところなし。", "what": "フッターの表記が別LPと違う（こちらは 会社概要 / プライバシーポリシー）: ESL club 英検プレテスト の esl-pretest-1018: 会社概要（明光ネットワークジャパン） / プライバシーポリシー（クライアントに提示中なので直せない）"}, {"id": "links", "group": "動作", "name": "リンク・動画・画像の生存", "by": "machine", "state": "ok", "msg": "画像・動画とも生きている", "where": "レッスンの様子の動画2本（8ZYwvDv7rQ8 / 7TLrJshYhXY）", "what": "2本とも生きていて、埋め込みでも再生できる（2026-09-11 確認）", "how": "※要確認：新しいカズマ const ORDER=Object.keys(D).sort(function(a,b){return (D[b].at||'')<(D[a].at||'')?-1:1});
const q=new URLSearchParams(location.search);
const sel=document.getElementById('sel');
const GRP={};
ORDER.forEach(function(v){ (GRP[D[v].project]=GRP[D[v].project]||[]).push(v) });
Object.keys(GRP).forEach(function(pn){
  const og=document.createElement('optgroup'); og.label=pn;
  GRP[pn].forEach(function(v){const o=document.createElement('option');o.value=v;
    o.textContent=v+(D[v].at?'   '+D[v].at:'   （チェックまだ）');og.appendChild(o);});
  sel.appendChild(og);});
let cur=(q.get('v')&&D[q.get('v')])?q.get('v'):ORDER[0];      // 既定は一番新しい版
sel.value=cur;
sel.addEventListener('change',function(){location.search='?v='+sel.value});
function esc(s){return String(s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function card(i){
  const who=i.by==='machine'?'機械':i.by==='claude'?'Claude':'目視';
  const rows=[];
  if(i.where) rows.push('<dt>どこ</dt><dd>'+esc(i.where)+'</dd>');
  rows.push('<dt>何が</dt><dd>'+esc(i.what||i.msg||'判定をまだ書いていないので、この観点は誰も見ていない')+'</dd>');
  if(i.how) rows.push('<dt>どう直す</dt><dd class="how">'+esc(i.how)+'</dd>');
  return '<div class="f '+i.state+'"><div class="t">'+esc(i.name)+
    '<span class="w" style="margin-left:auto">'+who+'</span></div><dl>'+rows.join('')+'</dl></div>';
}
function draw(){
  const d=D[cur];
  document.getElementById('h-s').innerHTML='原稿 '+(d.script_v||'（未登録）')+
    (d.inherit?' <span style="font-weight:400;color:#a7b0bd">（'+esc(cur)+' 自身には記録が無いので派生元から）</span>':'');
  document.getElementById('md').innerHTML=d.script?esc(d.script)
    :'<span class="none">原稿がまだ無い。<br><code>lpv.py script '+esc(d.project_id||'&lt;案件id&gt;')
      +' --new --file &lt;原稿&gt;</code> で登録し、<br><code>lpv.py script '
      +esc(d.project_id||'&lt;案件id&gt;')+' --set '+esc(cur)+' v1</code> でこのリンクに紐づける。</span>';
  // ★どの項目も必ずどこかに出す。落ちた項目があると「見たつもり」になるのが一番危ない。
  const g={ng:[],claude:[],human:[],warn:[],ok:[],todo:[]};
  (d.items||[]).forEach(function(i){
    (g[i.state]||g[['todo','skip','pending'].indexOf(i.state)>=0?'todo':'ok']).push(i); });
  let h='<div class="sum">'+
    (g.ng.length?'<span class="a">直す '+g.ng.length+'</span>':'')+
    (g.human.length?'<span class="b">あなたが見る '+g.human.length+'</span>':'')+
    (g.warn.length?'<span class="b">公開前 '+g.warn.length+'</span>':'')+
    (g.todo.length?'<span class="d">未判定 '+g.todo.length+'</span>':'')+
    '<span class="c">問題なし '+(g.ok.length+g.claude.length)+'</span></div>';
  if(g.ng.length)    h+='<div class="cap">直した方がよい</div>'+g.ng.map(card).join('');
  if(g.human.length) h+='<div class="cap">あなたが実機で見る</div>'+g.human.map(card).join('');
  if(g.warn.length)  h+='<div class="cap">公開前に確かめる</div>'+g.warn.map(card).join('');
  if(g.todo.length)  h+='<div class="cap">まだ誰も見ていない（判定を書いていない項目）</div>'
                       +g.todo.map(card).join('');
  const fine=g.ok.concat(g.claude);
  if(fine.length)    h+='<div class="cap">見たが問題なかった</div>'+fine.map(card).join('');
  // ★我々の決めごと。壊れているかではなく「決めたとおりか」の層。
  //   FBの半分は仕様の指示で、品質チェックでは1件も防げない。別の見出しで出す。
  const R=(d.rules||[]);
  if(R.length){
    const brk=R.filter(function(r){return r.state==='ng'});
    const kept=R.filter(function(r){return r.state==='ok'});
    const na=R.filter(function(r){return r.state==='skip'});
    h+='<div class="cap">我々の決めごと（'+kept.length+'/'+(R.length-na.length)+' 守れている）</div>';
    h+=R.map(function(r){
      const st=r.state==='ng'?'ng':(r.state==='skip'?'todo':'ok');
      const rows=['<dt>決めごと</dt><dd>'+esc(r.what)+'</dd>'];
      if(r.state==='ng') rows.push('<dt>いま</dt><dd>'+esc(r.note)+'</dd>');
      if(r.state==='skip') rows.push('<dt>いま</dt><dd>'+esc(r.note)+'</dd>');
      rows.push('<dt>なぜ</dt><dd class="how">'+esc(r.why)+'</dd>');
      return '<div class="f '+st+'"><div class="t">'+esc(r.name)+
        '<span class="w" style="margin-left:auto">決めごと</span></div><dl>'+
        rows.join('')+'</dl></div>';
    }).join('');
  }
  document.getElementById('notes').innerHTML=h||'<p class="none">まだチェックしていない。</p>';
}
