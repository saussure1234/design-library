2026｜音の遊び場 開いたときにこれが見えない 一番スクロール上になった上でやらんと」（So 2026-09-14、suzuki-ark1）。少し下げて再読み込みすると、ブラウザが44pxの位置を戻し、FVの一行目が固定ヘッダーの裏に隠れていた。撮影は必ず最上部から始まるので、機械の撮影では出ない", "scope": "全案件（固定ヘッダーのある型）", "state": "ok", "note": ""}, {"id": "scroll-motion", "name": "スクロールで中身が順に出る", "what": "IntersectionObserver で、画面に入った .fx（または data-rv）を出していること。対象6つ以上", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）。動きが無いと作りかけに見える。FVは読み込んだら出す振り付けにする（監視に任せると、縦の短い画面でCTAが透明のまま残る）", "scope": "全案件", "state": "ok", "note": ""}, {"id": "mobile-sticky-cta", "name": "スマホで画面に残るCTAがある", "what": "900px以下で、ヘッダー・ナビ・全画面メニューの外に position:fixed / sticky のボタンがあること（FVを見ている間は隠してよい）", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）の「他にも」の1つ。長いLPはスマホで行き先のボタンが画面から消える（ESL・ADSでは入れていた）", "scope": "全案件（申込・来場など行き先がある型）", "state": "ng", "note": "［375px］スマホで画面に残るCTAが無い（ヘッダーの外に position:fixed / sticky のボタンが無い）"}]}, "samurai-marke1": {"project": "マーケ壁打ちから実行まで丸ごと外注（仮）", "project_id": "samurai-marke", "script_v": "v1", "inherit": false, "at": "2026-10-27 01:14", "script": "# マーケ壁打ちから実行まで丸ごと外注（仮） ── LP原稿 v1\n受領: 2026-10-26（So から claude.ai のアーティファクトで。画面の文字を上から順にそのまま写した。言い換え・並べ替えなし） ／ 反映先: 未定\n\n## ヘッダー\nマーケ壁打ちから実行まで丸ごと外注\nサムライスタイル株式会社\n選ばれる理由\n支援の進め方\nLLM対応\n代表紹介\n資料ダウンロード\n\n## ファーストビュー\nマーケ壁打ちから実行まで丸ごと外注（仮）\n戦略を考え、実行まで伴走し、\nダッシュボード作成による\n経営層・上長への可視化まで対応。\nマーケティング・営業双方の経験を元に、『数値が停滞しているボトルネックが何か』を明らかにした上で、改善のための広告運用・SEO／LLMO・制作の実行からダッシュボードによる可視化まで対応します。\n資料をダウンロード\n相談する\n01\nボトルネックと改善方針をすり合わせ\n02\nタスクの優先順位を整理\n03\nタスクごとに役割分担\n04\nダッシュボードで可視化\n\n## よくある悩み\n施策は進めているが、目標に届かない\n目標数値に未達だが、ボトルネックが何で、どうすれば改善するか分からない\n広告、SEO、LLMO。施策の優先順位も、それぞれが最適化できているかも自信がない\nベンダーごとにレポートは届くが、内容を理解しきれないまま次の月に進んでいる\n\n## 提供価値と比較表\nマーケティングの戦略から実務まで、\n丸ごとお任せください\n何に取り組み、どの順番で進め、成果をどう確かめるか。マーケティング部門が担う判断と実務を、ひとつの窓口で、必要な時に必要な分だけ対応します。施策ごとにベンダーを探し、説明を聞き、調整する手間はなくなります。\n施策ごとにベンダーが分かれている状態\nマーケ壁打ちから実行まで丸ごと外注（仮）\n優先順位\n各社が自社の施策を提案する\n事業目的から施策と順序を決める\nレポート\n施策ごとに届き、つながりが見えない\n戦略の実現状況として一つにまとまる\n改善\n施策の中で最適化される\nギャップから次に打つ施策を選ぶ\n窓口\nベンダーの数だけある\nひとつ\n\n## 選ばれる理由\n丸ごとお任せいただける、3つの理由\n理由１\n事業会社とベンダー、マーケティングと営業双方の経験による一貫支援\n代表・橋本が、事業会社とマーケティング支援会社の双方で、戦略立案から施策の意思決定・実行に関わり、リード獲得後の営業まで対応してきた経験を元に、数値のボトルネックが何かをともに解明し、改善に向けて伴走します。\n理由２\nAI活用による運用・制作・テクニカル領域の効率化\n広告運用、制作、SEO／LLMOのテクニカル領域は、AIと自社開発のツールで効率化しています。実務経験のあるエンジニアが社内にいるため、サイトの改修や構造化データなどの技術対応も内製で進められます。\n自社プロダクト：HookHack（動画広告生成）、LPHack（LP制作・改修）\n理由３\n窓口ひとつで、必要な施策を必要な分だけ\n戦略策定から実務まで、窓口はひとつです。施策ごとにベンダーを探し、説明を聞き、調整する必要はありません。貴社の体制や予算に合わせて、必要な施策をレ点でお選びいただけます。\n戦略策定\n広告運用\nWeb制作\nSEO\nLLMO\nホワイトペーパー制作\nアウトバウンド営業\n\n## 支援の進め方\n現状把握から可視化まで、4つのステップで伴走\n現状把握と方針のすり合わせ、優先順位、役割分担、可視化の4段で進めます。可視化した結果は次のすり合わせに戻り、改善を続けます。\n01\n3C分析と施策の現状から、ボトルネックと改善方針をすり合わせ\n顧客・競合・自社の3C分析と、現状の施策の実施状況を照らし合わせます。Webでのリサーチに加え、貴社の営業・CS担当など顧客接点を持つ方の声をもとにニーズを把握し、競争環境と貴社のアセットを比較。現状の施策や課題をお伺いした上で、ボトルネックと改善の方針を提案し、すり合わせます。\n02\nすり合わせた方針から、タスクの優先順位を整理\nすり合わせた改善方針をもとに、取り組むタスクを洗い出し、事業への重要性も踏まえて着手する順序を整理します。\n03\nタスクごとに役割分担\n広告運用、Web制作、SEO／LLMO、ホワイトペーパー制作、アウトバウンド営業など、整理したタスクごとに弊社と貴社の役割を分担します。貴社の体制に合わせて、必要な施策をレ点式でご依頼いただけます。\n04\nダッシュボードで可視化し、経営層・上長へのレポートもスムーズに\nマーケティングの数値をKPIツリーに沿って並べ、どこがボトルネックになっているかを確認できるようにします。施策ごとに分かれていたレポートがひとつにまとまるため、経営層・上長への報告にもそのまま使えます。\nLLMOにおいては狙うカテゴリ、ポジション、顧客の目的・課題ごとに、AI回答での見え方を確認します。引用率や言及率に加え、「狙った場面で紹介されているか」「意図した強みが伝わっているか」を捉え、戦略と計測をつなぎます。\nマーケティング数値\nKPIツリーに沿った各施策の数値とボトルネック\nLLMO\nAI回答での引用率・言及率、狙った場面での紹介、意図した強みの伝わり方\n［ダッシュボードの画面イメージ］\n施策を進める理由を説明する3つのフレームワーク\n施策の中身ではなく、順序の根拠が問われた時の対処法をまとめました。\n資料をダウンロード\n\n## LLM対応\nLLM対応に求められること\nAIは、担当の境目を越えて答えている\nこの流れのまま、LLMOにも対応します。3C分析で決めた強みがAIの答えでどう伝わっているかをダッシュボードで確かめ、必要な改善をほかのタスクと同じ優先順位の中で進めます。\n顧客（AIに相談して選ぶ）\n↑ ひとつの答え\n生成AIの回答\n↑ 複数の情報源をまとめて参照\n自社サイト・LP\n制作会社\n検索上位の記事\nSEO会社\n比較・紹介メディア\n広告・PR会社\nSNS・口コミ\nSNS運用会社\n各社は担当範囲を最適化。AIの答え全体を見る担当はいない\n顧客はAIに相談して候補を絞るようになっています。AIは自社サイト、検索上位の記事、比較・紹介メディア、SNSをまとめて読み、ひとつの答えを返します。LLMOに求められているのは、施策ごとの部分最適ではなく、戦略で決めた強みがすべての接点で同じように伝わっているかを見ることです。\n縦割りで起きること\nLLM対応に求められること\n自社サイト、LP、外部の記事で説明がそろわず、AIの紹介が狭くなったりぶれたりする\n戦略で決めた強みを、すべての接点で同じ言葉で伝える\n検索では上位なのに、AIの答えには出てこない場面を誰も見ていない\n顧客の課題ごとに、AI回答での見え方を確かめる\n改善が必要な場所が他社の担当範囲にあり、手が止まる\nひとつの窓口で、必要な施策を選んで動かす\n改善の例\n困りごとから始まる質問で登場しない\n→\n課題別の記事やFAQ、導入事例を整備\nAIが対応範囲を狭く説明している\n→\nサービスページの記載や外部の紹介情報を見直す\n\n## 代表紹介\n代表紹介\n橋本 圭司\n代表取締役\n早稲田大学政治経済学部卒業後、大手通信会社で営業、事業企画を経験。Webコンサル会社へ転職した後、2018年にイラスト世界チャンピオンとともにDT合同会社を設立し、CMO着任。並行して事業会社・ベンダー双方での経験を生かし、様々な業種・規模の企業で事業企画・マーケティング・セールスまでのコンサルとして事業を推進。2024年にサムライスタイル株式会社を設立。\n\n## 資料ダウンロード\n資料ダウンロード\n施策を進める理由を説明する\n3つのフレームワーク\n施策の中身ではなく、順序の根拠が問われた時の対処法をまとめました。\n1\n事業戦略誰に、何を\n2\nマーケティング戦略どこで、どの順番で\n3\n施策実行いつ、どのように\n資料を受け取る\n会社名\nお名前\nメールアドレス\n役職（任意）\n資料をダウンロード\n\n## 最後のCTA・フッター\nマーケティングの戦略から実務まで、\n一度ご相談ください\n相談する\nサムライスタイル株式会社\n\n## 制作メモ（元ページにあったが LP の文ではないもの）\n- ［ダッシュボードの画面イメージ］：画像の差し込み位置\n- ［写真］：代表の写真の差し込み位置\n- 「入力イメージです。送信はされません。」：元ページが試作であることの注記\n- ［プライバシーポリシーへのリンク］：リンク先は※要確認\n", "shot": "../samurai-marke1/_shot.jpg", "items": [{"id": "script-diff", "group": "中身", "name": "原稿との一致", "by": "machine", "state": "ok", "msg": "原稿（v1.md）の文はすべてLPにある"}, {"id": "wording", "group": "中身", "name": "表記ゆれ", "by": "machine", "state": "ok", "msg": "「さま」に統一されている"}, {"id": "self-consistency", "group": "中身", "name": "ページ内の不一致", "by": "machine", "state": "skip", "msg": "対象の型ではない"}, {"id": "lineage", "group": "中身", "name": "版の系統（先祖返り）", "by": "machine", "state": "skip", "msg": "派生元が無い（初版）"}, {"id": "sibling", "group": "中身", "name": "別LPとの食い違い", "by": "machine", "state": "skip", "msg": "フッターの法的リンクが見つからない（この作りではない）"}, {"id": "links", "group": "動作", "name": "リンク・動画・画像の生存", "by": "machine", "state": "ok", "msg": "画像・動画とも生きている"}, {"id": "content-gone", "group": "見た目", "name": "消えている中身", "by": "machine", "state": "ok", "msg": "隠れて消えている中身は無い（幅ごとの出し分けは正常）"}, {"id": "responsive", "group": "見た目", "name": "レスポンシブの崩れ", "by": "machine", "state": "ok", "msg": "5幅とも崩れなし"}, {"id": "overlap", "group": "見た目", "name": "文字と写真の被り", "by": "machine", "state": "ok", "msg": "文字と写真の矩形は重なっていない（5幅で実測）"}, {"id": "cell-overflow", "group": "見た目", "name": "セルからの文字のはみ出し", "by": "machine", "state": "ok", "msg": "表のセルの中の ・受注率・リード数・商談化率・単価・案件数・ボトルネック・改善・サンプル）だけ。元のページのナビ（選ばれる理由／支援の進め方／LLM対応／代表紹介）は、ナビ3つまでの決めごとで外した", "how": "ナビを戻すかは So の判断"}, {"id": "br-margin", "group": "見た目", "name": "明示改行の余裕", "by": "machine", "state": "ok", "msg": "明示改行はどの区間も1割以上の余りがある（実機で溢れにくい）"}, {"id": "embed-controls", "group": "動作", "name": "埋め込み動画の操作", "by": "machine", "state": "ok", "msg": "動画は280px以上あり、allow に fullscreen も入っている"}, {"id": "motion", "group": "動作", "name": "動き", "by": "machine", "state": "ok", "msg": "data-d による順番指定は無い（順番の事故は起きない作り）"}, {"id": "motion-calm", "group": "見た目", "name": "飾りの動きの同時数", "by": "machine", "state": "ok", "msg": "1画面目で動く飾りは6個未満か、平均して同時に動くのが2.5個以下"}, {"id": "publish", "group": "公開前", "name": "公開前の設定", "by": "machine", "state": "warn", "msg": "noindex あり＝提示用。本番公開の前に外す ／ 未設定: OGP画像 / OGP説明 / favicon / 計測タグ（提示用なら不要）"}, {"id": "secrets", "group": "公開前", "name": "出してはいけないもの", "by": "machine", "state": "ok", "msg": "金額・手元のパス・鍵とも無い"}, {"id": "real-device", "group": "目視", "name": "実機スマホ", "by": "human", "state": "human", "msg": "iPhoneで開いて、改行・被り・タップできるか。Chromeとフォント幅が違うので機械では出ない"}, {"id": "kinsoku", "group": "見た目", "name": "行頭の禁則", "by": "machine", "state": "ok", "msg": "行頭に落ちてはいけない字は無い（全幅で実測）"}], "rules": [{"id": "faq-closed", "name": "FAQは初期状態で全部閉じる", "what": "details に open が付いていないこと", "why": "FAQは1問目もデフォルトで閉じる（ADS 2026-09-09）。1つだけ開いていると、そこが答えだと誤解される", "scope": "全案件", "state": "skip", "note": "この型では判定の対象が無い"}, {"id": "faq-anim", "name": "FAQの開閉はなめらかに動く", "what": "FAQに開閉のアニメーション（WAAPI）が入っていること", "why": "FAQに開閉のアニメーションを入れる（ADS 2026-09-09）。details の既定は瞬間的に開くので、詰まった印象になる", "scope": "全案件", "state": "skip", "note": "この型では判定の対象が無い"}, {"id": "fv-one-photo", "name": "FVの写真は1枚（B2Cは2枚まで）", "what": "FV（#fv → h1の親 → 最初のsection）の中で、幅120px以上の画像が1枚だけ。<meta name=\"lp-audience\" content=\"b2c\"> のページは2枚まで", "why": "FVの写真は複数点でなく1枚にする（ADS 2026-09-09）。複数並べると1枚も見られない／B2Cは2枚まで許す（So 2026-09-14。ESL club は小学生と中高生の2枚でクライアントに通っている）", "scope": "全案件（B型は写真ゼロなので対象外）／★例外：suzuki-ark は So の指示で複数写真＋切り抜き（2026-09-14「ぴっ 」の1つ。長いLPはスマホで行き先のボタンが画面から消える（ESL・ADSでは入れていた）", "scope": "全案件（申込・来場など行き先がある型）", "state": "ng", "note": "［375px］スマホで画面に残るCTAが無い（ヘッダーの外に position:fixed / sticky のボタンが無い）"}]}, "samurai-marke2": {"project": "マーケ壁打ちから実行まで丸ごと外注（仮）", "project_id": "samurai-marke", "script_v": "v1", "inherit": false, "at": "2026-10-28 04:07", "script": "# マーケ壁打ちから実行まで丸ごと外注（仮） ── LP原稿 v1\n受領: 2026-10-26（So から claude.ai のアーティファクトで。画面の文字を上から順にそのまま写した。言い換え・並べ替えなし） ／ 反映先: 未定\n\n## ヘッダー\nマーケ壁打ちから実行まで丸ごと外注\nサムライスタイル株式会社\n選ばれる理由\n支援の進め方\nLLM対応\n代表紹介\n資料ダウンロード\n\n## ファーストビュー\nマーケ壁打ちから実行まで丸ごと外注（仮）\n戦略を考え、実行まで伴走し、\nダッシュボード作成による\n経営層・上長への可視化まで対応。\nマーケティング・営業双方の経験を元に、『数値が停滞しているボトルネックが何か』を明らかにした上で、改善のための広告運用・SEO／LLMO・制作の実行からダッシュボードによる可視化まで対応します。\n資料をダウンロード\n相談する\n01\nボトルネックと改善方針をすり合わせ\n02\nタスクの優先順位を整理\n03\nタスクごとに役割分担\n04\nダッシュボードで可視化\n\n## よくある悩み\n施策は進めているが、目標に届かない\n目標数値に未達だが、ボトルネックが何で、どうすれば改善するか分からない\n広告、SEO、LLMO。施策の優先順位も、それぞれが最適化できているかも自信がない\nベンダーごとにレポートは届くが、内容を理解しきれないまま次の月に進んでいる\n\n## 提供価値と比較表\nマーケティングの戦略から実務まで、\n丸ごとお任せください\n何に取り組み、どの順番で進め、成果をどう確かめるか。マーケティング部門が担う判断と実務を、ひとつの窓口で、必要な時に必要な分だけ対応します。施策ごとにベンダーを探し、説明を聞き、調整する手間はなくなります。\n施策ごとにベンダーが分かれている状態\nマーケ壁打ちから実行まで丸ごと外注（仮）\n優先順位\n各社が自社の施策を提案する\n事業目的から施策と順序を決める\nレポート\n施策ごとに届き、つながりが見えない\n戦略の実現状況として一つにまとまる\n改善\n施策の中で最適化される\nギャップから次に打つ施策を選ぶ\n窓口\nベンダーの数だけある\nひとつ\n\n## 選ばれる理由\n丸ごとお任せいただける、3つの理由\n理由１\n事業会社とベンダー、マーケティングと営業双方の経験による一貫支援\n代表・橋本が、事業会社とマーケティング支援会社の双方で、戦略立案から施策の意思決定・実行に関わり、リード獲得後の営業まで対応してきた経験を元に、数値のボトルネックが何かをともに解明し、改善に向けて伴走します。\n理由２\nAI活用による運用・制作・テクニカル領域の効率化\n広告運用、制作、SEO／LLMOのテクニカル領域は、AIと自社開発のツールで効率化しています。実務経験のあるエンジニアが社内にいるため、サイトの改修や構造化データなどの技術対応も内製で進められます。\n自社プロダクト：HookHack（動画広告生成）、LPHack（LP制作・改修）\n理由３\n窓口ひとつで、必要な施策を必要な分だけ\n戦略策定から実務まで、窓口はひとつです。施策ごとにベンダーを探し、説明を聞き、調整する必要はありません。貴社の体制や予算に合わせて、必要な施策をレ点でお選びいただけます。\n戦略策定\n広告運用\nWeb制作\nSEO\nLLMO\nホワイトペーパー制作\nアウトバウンド営業\n\n## 支援の進め方\n現状把握から可視化まで、4つのステップで伴走\n現状把握と方針のすり合わせ、優先順位、役割分担、可視化の4段で進めます。可視化した結果は次のすり合わせに戻り、改善を続けます。\n01\n3C分析と施策の現状から、ボトルネックと改善方針をすり合わせ\n顧客・競合・自社の3C分析と、現状の施策の実施状況を照らし合わせます。Webでのリサーチに加え、貴社の営業・CS担当など顧客接点を持つ方の声をもとにニーズを把握し、競争環境と貴社のアセットを比較。現状の施策や課題をお伺いした上で、ボトルネックと改善の方針を提案し、すり合わせます。\n02\nすり合わせた方針から、タスクの優先順位を整理\nすり合わせた改善方針をもとに、取り組むタスクを洗い出し、事業への重要性も踏まえて着手する順序を整理します。\n03\nタスクごとに役割分担\n広告運用、Web制作、SEO／LLMO、ホワイトペーパー制作、アウトバウンド営業など、整理したタスクごとに弊社と貴社の役割を分担します。貴社の体制に合わせて、必要な施策をレ点式でご依頼いただけます。\n04\nダッシュボードで可視化し、経営層・上長へのレポートもスムーズに\nマーケティングの数値をKPIツリーに沿って並べ、どこがボトルネックになっているかを確認できるようにします。施策ごとに分かれていたレポートがひとつにまとまるため、経営層・上長への報告にもそのまま使えます。\nLLMOにおいては狙うカテゴリ、ポジション、顧客の目的・課題ごとに、AI回答での見え方を確認します。引用率や言及率に加え、「狙った場面で紹介されているか」「意図した強みが伝わっているか」を捉え、戦略と計測をつなぎます。\nマーケティング数値\nKPIツリーに沿った各施策の数値とボトルネック\nLLMO\nAI回答での引用率・言及率、狙った場面での紹介、意図した強みの伝わり方\n［ダッシュボードの画面イメージ］\n施策を進める理由を説明する3つのフレームワーク\n施策の中身ではなく、順序の根拠が問われた時の対処法をまとめました。\n資料をダウンロード\n\n## LLM対応\nLLM対応に求められること\nAIは、担当の境目を越えて答えている\nこの流れのまま、LLMOにも対応します。3C分析で決めた強みがAIの答えでどう伝わっているかをダッシュボードで確かめ、必要な改善をほかのタスクと同じ優先順位の中で進めます。\n顧客（AIに相談して選ぶ）\n↑ ひとつの答え\n生成AIの回答\n↑ 複数の情報源をまとめて参照\n自社サイト・LP\n制作会社\n検索上位の記事\nSEO会社\n比較・紹介メディア\n広告・PR会社\nSNS・口コミ\nSNS運用会社\n各社は担当範囲を最適化。AIの答え全体を見る担当はいない\n顧客はAIに相談して候補を絞るようになっています。AIは自社サイト、検索上位の記事、比較・紹介メディア、SNSをまとめて読み、ひとつの答えを返します。LLMOに求められているのは、施策ごとの部分最適ではなく、戦略で決めた強みがすべての接点で同じように伝わっているかを見ることです。\n縦割りで起きること\nLLM対応に求められること\n自社サイト、LP、外部の記事で説明がそろわず、AIの紹介が狭くなったりぶれたりする\n戦略で決めた強みを、すべての接点で同じ言葉で伝える\n検索では上位なのに、AIの答えには出てこない場面を誰も見ていない\n顧客の課題ごとに、AI回答での見え方を確かめる\n改善が必要な場所が他社の担当範囲にあり、手が止まる\nひとつの窓口で、必要な施策を選んで動かす\n改善の例\n困りごとから始まる質問で登場しない\n→\n課題別の記事やFAQ、導入事例を整備\nAIが対応範囲を狭く説明している\n→\nサービスページの記載や外部の紹介情報を見直す\n\n## 代表紹介\n代表紹介\n橋本 圭司\n代表取締役\n早稲田大学政治経済学部卒業後、大手通信会社で営業、事業企画を経験。Webコンサル会社へ転職した後、2018年にイラスト世界チャンピオンとともにDT合同会社を設立し、CMO着任。並行して事業会社・ベンダー双方での経験を生かし、様々な業種・規模の企業で事業企画・マーケティング・セールスまでのコンサルとして事業を推進。2024年にサムライスタイル株式会社を設立。\n\n## 資料ダウンロード\n資料ダウンロード\n施策を進める理由を説明する\n3つのフレームワーク\n施策の中身ではなく、順序の根拠が問われた時の対処法をまとめました。\n1\n事業戦略誰に、何を\n2\nマーケティング戦略どこで、どの順番で\n3\n施策実行いつ、どのように\n資料を受け取る\n会社名\nお名前\nメールアドレス\n役職（任意）\n資料をダウンロード\n\n## 最後のCTA・フッター\nマーケティングの戦略から実務まで、\n一度ご相談ください\n相談する\nサムライスタイル株式会社\n\n## 制作メモ（元ページにあったが LP の文ではないもの）\n- ［ダッシュボードの画面イメージ］：画像の差し込み位置\n- ［写真］：代表の写真の差し込み位置\n- 「入力イメージです。送信はされません。」：元ページが試作であることの注記\n- ［プライバシーポリシーへのリンク］：リンク先は※要確認\n", "shot": "../samurai-marke2/_shot.jpg", "items": [{"id": "script-diff", "group": "中身", "name": "原稿との一致", "by": "machine", "state": "ok", "msg": "原稿（v1.md）の文はすべてLPにある"}, {"id": "wording", "group": "中身", "name": "表記ゆれ", "by": "machine", "state": "ok", "msg": "「さま」に統一されている"}, {"id": "self-consistency", "group": "中身", "name": "ページ内の不一致", "by": "machine", "state": "skip", "msg": "対象の型ではない"}, {"id": "lineage", "group": "中身", "name": "版の系統（先祖返り）", "by": "machine", "state": "ok", "msg": "派生元 samurai-marke1 は最新のFB反映版"}, {"id": "sibling", "group": "中身", "name": "別LPとの食い違い", "by": "machine", "state": "skip", "msg": "フッターの法的リンクが見つからない（この作りではない）"}, {"id": "links", "group": "動作", "name": "リンク・動画・画像の生存", "by": "machine", "state": "ok", "msg": "画像・動画とも生きている"}, {"id": "content-gone", "group": "見た目", "name": "消えている中身", "by": "machine", "state": "ok", "msg": "隠れて消えている中身は無い（幅ごとの出し分けは正常）"}, {"id": "responsive", "group": "見た目", "name": "レスポンシブの崩れ", "by": "machine", "state": "ok", "msg": "5幅とも崩れなし"}, {"id": "overlap", "group": "見た目", "name": "文字と写真の被り", "by": "machine", "state": "ok", "msg": "文字と写真の矩形は重なっていない（5幅で実測）"}, {"id": "cell-overflow", "group": "見た目", "name": "セルからの文字のはみ出し", "by": "machine", "state": "ok", "msg": "表のセルの中の文字は、どれも自分の列に収まっている（5幅で実測）"}, {"id": "letter-spread", "group": "見た目", "name": "字間の広がり", "by": "machine", "state": "ok", "msg": "両端揃えの行で字間が広がりすぎている所は無い（5幅で実測・1字あたり2.5px未満）"}, {"id": "orphan-line", "group": "見た目", "name": "改行の孤立", "by": "machine", "state": "ok", "msg": "孤立した行なし"}, {"id": "contrast", "group": "見た目", "name": "罫・面の地との差", "by": "machine", "state": "ok", "msg": "罫・枠は地との差が1.35以上ある"}, {"id": "text-contrast", "group": "見た目", "name": "文字と地の比", "by": "machine", "state": "ok", "msg": "単色の地の上の文字はすべて基準以上（大きい字3.0・本文4.5）"}, {"id": "h2-uniform", "group": "見た目", "name": "節見出しの統一", "by": "machine", "state": "ok", "msg": "節見出しは全節で同じ級数・太さ・行送り"}, {"id": "unreadable", "group": "見た目", "name": "読めない文字", "by": "claude", , "name": "ヘッダーを画面上部に固定する", "what": "最初の header（または親）が position:fixed か sticky で、スクロールしても画面に残ること", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）。品質チェックは壊れていないかしか見ないので、作りが素朴なまま全項目を通ってリンクを渡していた", "scope": "全案件", "state": "ok", "note": ""}, {"id": "open-at-top", "name": "開いたらいちばん上から表示する", "what": "history.scrollRestoration を 'manual' にし、#付きで開いた時以外は読み込み時に最上部へ。再読み込みでスクロール位置を戻さない", "why": "「ARK Hills Music Week 2026｜音の遊び場 開いたときにこれが見えない 一番スクロール上になった上でやらんと」（So 2026-09-14、suzuki-ark1）。少し下げて再読み込みすると、ブラウザが44pxの位置を戻し、FVの一行目が固定ヘッダーの裏に隠れていた。撮影は必ず最上部から始まるので、機械の撮影では出ない", "scope": "全案件（固定ヘッダーのある型）", "state": "ok", "note": ""}, {"id": "scroll-motion", "name": "スクロールで中身が順に出る", "what": "IntersectionObserver で、画面に入った .fx（または data-rv）を出していること。対象6つ以上", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）。動きが無いと作りかけに見える。FVは読み込んだら出す振り付けにする（監視に任せると、縦の短い画面でCTAが透明のまま残る）", "scope": "全案件", "state": "ok", "note": ""}, {"id": "mobile-sticky-cta", "name": "スマホで画面に残るCTAがある", "what": "900px以下で、ヘッダー・ナビ・全画面メニューの外に position:fixed / sticky のボタンがあること（FVを見ている間は隠してよい）", "why": "「初歩的なヘッダー固定、アニメーションとかはやってよ 他にもあると思うけど」（So 2026-09-14、suzuki-ark1）の「他にも」の1つ。長いLPはスマホで行き先のボタンが画面から消える（ESL・ADSでは入れていた）", "scope": "全案件（申込・来場など行き先がある型）", "state": "ok", "note": ""}]}, "samurai-marke3": {"project": "マーケ壁打ちから実行まで丸ごと外注（仮）", "project_id": "samurai-marke", "script_v": "v2", "inherit": false, "at": "2026-10-28 04:39", "script": "# MarkeHack（仮） ── LP原稿 v2\n受領: 2026-10-28（v1 から So の指示で仮のサービス名「MarkeHack（仮）」を入れた。1画面目の札と比較表の見出しだけ。ほかは v1 のまま） ／ 反映先: samurai-marke3\n\n## ヘッダー\nマーケ壁打ちから実行まで丸ごと外注\nサムライスタイル株式会社\n選ばれる理由\n支援の進め方\nLLM対応\n代表紹介\n資料ダウンロード\n\n## ファーストビュー\nMarkeHack（仮）｜マーケ壁打ちから実行まで丸ごと外注\n戦略を考え、実行まで伴走し、\nダッシュボード作成による\n経営層・上長への可視化まで対応。\nマーケティング・営業双方の経験を元に、『数値が停滞しているボトルネックが何か』を明らかにした上で、改善のための広告運用・SEO／LLMO・制作の実行からダッシュボードによる可視化まで対応します。\n資料をダウンロード\n相談する\n01\nボトルネックと改善方針をすり合わせ\n02\nタスクの優先順位を整理\n03\nタスクごとに役割分担\n04\nダッシュボードで可視化\n\n## よくある悩み\n施策は進めているが、目標に届かない\n目標数値に未達だが、ボトルネックが何で、どうすれば改善するか分からない\n広告、SEO、LLMO。施策の優先順位も、それぞれが最適化できているかも自信がない\nベンダーごとにレポートは届くが、内容を理解しきれないまま次の月に進んでいる\n\n## 提供価値と比較表\nマーケティングの戦略から実務まで、\n丸ごとお任せください\n何に取り組み、どの順番で進め、成果をどう確かめるか。マーケティング部門が担う判断と実務を、ひとつの窓口で、必要な時に必要な分だけ対応します。施策ごとにベンダーを探し、説明を聞き、調整する手間はなくなります。\n施策ごとにベンダーが分かれている状態\nMarkeHack（仮）\n優先順位\n各社が自社の施策を提案する\n事業目的から施策と順序を決める\nレポート\n施策ごとに届き、つながりが見えない\n戦略の実現状況として一つにまとまる\n改善\n施策の中で最適化される\nギャップから次に打つ施策を選ぶ\n窓口\nベンダーの数だけある\nひとつ\n\n## 選ばれる理由\n丸ごとお任せいただける、3つの理由\n理由１\n事業会社とベンダー、マーケティングと営業双方の経験による一貫支援\n代表・橋本が、事業会社とマーケティング支援会社の双方で、戦略立案から施策の意思決定・実行に関わり、リード獲得後の営業まで対応してきた経験を元に、数値のボトルネックが何かをともに解明し、改善に向けて伴走します。\n理由２\nAI活用による運用・制作・テクニカル領域の効率化\n広告運用、制作、SEO／LLMOのテクニカル領域は、AIと自社開発のツールで効率化しています。実務経験のあるエンジニアが社内にいるため、サイトの改修や構造化データなどの技術対応も内製で進められます。\n自社プロダクト：HookHack（動画広告生成）、LPHack（LP制作・改修）\n理由３\n窓口ひとつで、必要な施策を必要な分だけ\n戦略策定から実務まで、窓口はひとつです。施策ごとにベンダーを探し、説明を聞き、調整する必要はありません。貴社の体制や予算に合わせて、必要な施策をレ点でお選びいただけます。\n戦略策定\n広告運用\nWeb制作\nSEO\nLLMO\nホワイトペーパー制作\nアウトバウンド営業\n\n## 支援の進め方\n現状把握から可視化まで、4つのステップで伴走\n現状把握と方針のすり合わせ、優先順位、役割分担、可視化の4段で進めます。可視化した結果は次のすり合わせに戻り、改善を続けます。\n01\n3C分析と施策の現状から、ボトルネックと改善方針をすり合わせ\n顧客・競合・自社の3C分析と、現状の施策の実施状況を照らし合わせます。Webでのリサーチに加え、貴社の営業・CS担当など顧客接点を持つ方の声をもとにニーズを把握し、競争環境と貴社のアセットを比較。現状の施策や課題をお伺いした上で、ボトルネックと改善の方針を提案し、すり合わせます。\n02\nすり合わせた方針から、タスクの優先順位を整理\nすり合わせた改善方針をもとに、取り組むタスクを洗い出し、事業への重要性も踏まえて着手する順序を整理します。\n03\nタスクごとに役割分担\n広告運用、Web制作、SEO／LLMO、ホワイトペーパー制作、アウトバウンド営業など、整理したタスクごとに弊社と貴社の役割を分担します。貴社の体制に合わせて、必要な施策をレ点式でご依頼いただけます。\n04\nダッシュボードで可視化し、経営層・上長へのレポートもスムーズに\nマーケティングの数値をKPIツリーに沿って並べ、どこがボトルネックになっているかを確認できるようにします。施策ごとに分かれていたレポートがひとつにまとまるため、経営層・上長への報告にもそのまま使えます。\nLLMOにおいては狙うカテゴリ、ポジション、顧客の目的・課題ごとに、AI回答での見え方を確認します。引用率や言及率に加え、「狙った場面で紹介されているか」「意図した強みが伝わっているか」を捉え、戦略と計測をつなぎます。\nマーケティング数値\nKPIツリーに沿った各施策の数値とボトルネック\nLLMO\nAI回答での引用率・言及率、狙った場面での紹介、意図した強みの伝わり方\n［ダッシュボードの画面イメージ］\n施策を進める理由を説明する3つのフレームワーク\n施策の中身ではなく、順序の根拠が問われた時の対処法をまとめました。\n資料をダウンロード\n\n## LLM対応\nLLM対応に求められること\nAIは、担当の境目を越えて答えている\nこの流れのまま、LLMOにも対応します。3C分析で決めた強みがAIの答えでどう伝わっているかをダッシュボードで確かめ、必要な改善をほかのタスクと同じ優先順位の中で進めます。\n顧客（AIに相談して選ぶ）\n↑ ひとつの答え\n生成AIの回答\n↑ 複数の情報源をまとめて参照\n自社サイト・LP\n制作会社\n検索上位の記事\nSEO会社\n比較・紹介メディア\n広告・PR会社\nSNS・口コミ\nSNS運用会社\n各社は担当範囲を最適化。AIの答え全体を見る担当はいない\n顧客はAIに相談して候補を絞るようになっています。AIは自社サイト、検索上位の記事、比較・紹介メディア、SNSをまとめて読み、ひとつの答えを返します。LLMOに求められているのは、施策ごとの部分最適ではなく、戦略で決めた強みがすべての接点で同じように伝わっているかを見ることです。\n縦割りで起きること\nLLM対応に求められること\n自社サイト、LP、外部の記事で説明がそろわず、AIの紹介が狭くなったりぶれたりする\n戦略で決めた強みを、すべての接点で同じ言葉で伝える\n検索では上位なのに、AIの答えには出てこない場面を誰も見ていない\n顧客の課題ごとに、AI回答での見え方を確かめる\n改善が必要な場所が他社の担当範囲にあり、手が止まる\nひとつの窓口で、必要な施策を選んで動かす\n改善の例\n困りごとから始まる質問で登場しない\n→\n課題別の記事やFAQ、導入事例を整備\nAIが対応範囲を狭く説明している\n→\nサービスページの記載や外部の紹介情報を見直す\n\n## 代表紹介\n代表紹介\n橋本 圭司\n代表取締役\n早稲田大学政治経済学部卒業後、大手通信会社で営業、事業企画を経験。Webコンサル会社へ転職した後、2018年にイラスト世界チャンピオンとともにDT合同会社を設立し、CMO着任。並行して事業会社・ベンダー双方での経験を生かし、様々な業種・規模の企業で事業企画・マーケティング・セールスまでのコンサルとして事業を推進。2024年にサムライスタイル株式会社を設立。\n\n## 資料ダウンロード\n資料ダウンロード\n施策を進める理由を説明する\n3つのフレームワーク\n施策の中身ではなく、順序の根拠が問われた時の対処法をまとめました。\n1\n事業戦略誰に、何を\n2\nマーケティング戦略どこで、どの順番で\n3\n施策実行いつ、どのように\n資料を受け取る\n会社名\nお名前\nメールアドレス\n役職（任意）\n資料をダウンロード\n\n## 最後のCTA・フッター\nマーケティングの戦略から実務まで、\n一度ご相談ください\n相談する\nサムライスタイル株式会社\n\n## 制作メモ（元ページにあったが LP の文ではないもの）\n- ［ダッシュボードの画面イメージ］：画像の差し込み位置\n- ［写真］：代表の写真の差し込み位置\n- 「入力イメージです。送信はされません。」：元ページが試作であることの注記\n- ［プライバシーポリシーへのリンク］：リンク先は※要確認\n", "shot": "../samurai-marke3/_shot.jpg", "items": [{"id": "script-diff", "group": "中身", "name": "原稿との一致", "by": "machine", "state": "ok", "msg": "原稿（v1.md）の文はすべてLPにある"}, {"id": "wording", "group": "中身", "name": "表記ゆれ", "by": "machine", "state": "ok", "msg": "「さま」に統一されている"}, {"id": "self-consistency", "group": "中身", "name": "ページ内の不一致", "by": "machine", "state": "skip", "msg": "対象の型ではない"}, {"id": "lineage", "group": "中身", "name": "版の系統（先祖返り）", "by": "machine", "state": "ok", "msg": "派生元 samurai-marke1 は最新のFB反映版"}, {"id": "sibling", "group": "中身", "name": "別LPとの食い違い", "by": "machine", "state": "skip", "msg": "フッターの法的リンクが見つからない（この作りではない）"}, {"id": "links", "group": "動作", "name": "リンク・動画・画像の生存", "by": "machine", "state": "ok", "msg": "画像・動画とも生きている"}, {"id": "content-gone", "group": "見た目", "name": "消えている中身", "by": " }

    (g.human.length?'<span class="b">あなたが見る '+g.human.length+'</span>':'')+
    (g.warn.length?'<span class="b">公開前 '+g.warn.length+'</span>':'')+
    (g.todo.length?'<span class="d">未判定 '+g.todo.length+'</span>':'')+
    '<span class="c">問題なし '+(g.ok.length+g.claude.length)+'</span></div>';
  if(g.ng.length)    h+='<div class="cap">直した方がよい</div>'+g.ng.map(card).join('');
  if(g.human.length) h+='<div class="cap">あなたが実機で見る</div>'+g.human.map(card).join('');
  if(g.warn.length)  h+='<div class="cap">公開前に確かめる</div>'+g.warn.map(card).join('');
  if(g.todo.length)  h+='<div class="cap">まだ誰も見ていない（判定を書いていない項目）</div>'
                       +g.todo.map(card).join('');
  const fine=g.ok.concat(g.claude);
  if(fine.length)    h+='<div class="cap">見たが問題なかった</div>'+fine.map(card).join('');
  // ★我々の決めごと。壊れているかではなく「決めたとおりか」の層。
  //   FBの半分は仕様の指示で、品質チェックでは1件も防げない。別の見出しで出す。
  const R=(d.rules||[]);
  if(R.length){
    const brk=R.filter(function(r){return r.state==='ng'});
    const kept=R.filter(function(r){return r.state==='ok'});
    const na=R.filter(function(r){return r.state==='skip'});
    h+='<div class="cap">我々の決めごと（'+kept.length+'/'+(R.length-na.length)+' 守れている）</div>';
    h+=R.map(function(r){
      const st=r.state==='ng'?'ng':(r.state==='skip'?'todo':'ok');
      const rows=['<dt>決めごと</dt><dd>'+esc(r.what)+'</dd>'];
      if(r.state==='ng') rows.push('<dt>いま</dt><dd>'+esc(r.note)+'</dd>');
      if(r.state==='skip') rows.push('<dt>いま</dt><dd>'+esc(r.note)+'</dd>');
      rows.push('<dt>なぜ</dt><dd class="how">'+esc(r.why)+'</dd>');
      return '<div class="f '+st+'"><div class="t">'+esc(r.name)+
        '<span class="w" style="margin-left:auto">決めごと</span></div><dl>'+
        rows.join('')+'</dl></div>';
    }).join('');
  }
  document.getElementById('notes').innerHTML=h||'<p class="none">まだチェックしていない。</p>';
}
draw();
</script></body></html>
