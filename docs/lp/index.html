<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- ★検索避け。リンクを知っている人だけが見る想定 -->
<meta name="robots" content="noindex,nofollow,noarchive">
<title>版管理（LP / 動画）</title>
<style>
/* ── 雰囲気テンプレの画面 ───────────────────────── */
.tb{border-collapse:collapse;width:100%;margin:0 0 22px;font-size:12.5px;line-height:1.6}
.tb th,.tb td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tb th{color:var(--live);font-weight:800;white-space:nowrap;background:rgba(0,0,0,.02)}
.tb td.k{color:var(--live);font-weight:800;white-space:nowrap;width:120px}
.tb code{font-size:11.5px}
.mh{font-size:15px;margin:34px 0 4px;padding-top:20px;border-top:2px solid var(--line)}
.mh .cl{font-size:12px;font-weight:400}
.ul{margin:6px 0 20px;padding-left:20px;font-size:12.5px;line-height:1.85}
.ul.bad li{color:var(--bad,#b4342a)}

*{box-sizing:border-box;margin:0}
:root{
  --bg:#f5f6f8; --panel:#fff; --line:#e3e6ea; --ink:#1f2937; --mute:#6b7280;
  --live:#00B21F; --frozen:#94a3b8; --review:#f59e0b; --draft:#cbd5e1; --bad:#dc2626;
}
html,body{height:100%}
body{font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);
  color:var(--ink);line-height:1.65;font-size:14px}
.app{display:flex;min-height:100vh}

/* ── 左：サイドバー ─────────────────────────── */
.side{width:248px;flex:none;background:#111827;color:#e5e7eb;padding:20px 0;
  position:sticky;top:0;height:100vh;overflow:auto}
.side h1{font-size:15px;padding:0 18px 14px;border-bottom:1px solid #263041;color:#fff}
.side .cap{font-size:10.5px;letter-spacing:.14em;color:#7d8797;padding:16px 18px 6px}
.side a{display:block;padding:9px 18px;color:#cbd5e1;text-decoration:none;font-size:13.5px;
  border-left:3px solid transparent;cursor:pointer}
.side a:hover{background:#1b2433;color:#fff}
.side a.on{background:#1b2433;color:#fff;border-left-color:var(--live);font-weight:700}
.side .n{float:right;font-size:11px;background:#374151;border-radius:999px;padding:1px 8px;color:#e5e7eb}
.side .n.bad{background:var(--bad);color:#fff}
.side .foot{font-size:11px;color:#6b7280;padding:18px;border-top:1px solid #263041;margin-top:14px}

/* ── 右：本体 ──────────────────────────────── */
.main{flex:1;min-width:0;padding:22px 26px 70px}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.head h2{font-size:20px}
.head .cl{font-size:12.5px;color:var(--mute)}
.head .mainlink{font-size:12.5px}
.note{font-size:12.5px;color:var(--mute);margin-top:2px}
.tabs{display:flex;gap:4px;margin:18px 0 0;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;font:inherit;font-size:13.5px;padding:9px 16px;
  cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);font-weight:800;border-bottom-color:var(--live)}
/* 雰囲気テンプレ：タブが7つ並ぶので折り返しを許す */
.mtabs{flex-wrap:wrap;border-bottom-width:2px}
.mtabs button{padding:9px 13px;font-size:13px}
.mtabs .mt__n{margin-left:6px;font-size:11px;color:var(--mute)}
/* 雰囲気のタブは型のタブより一段小さく（軸が2つあることを形で示す） */
.mtabs--m{margin-top:6px;border-bottom-width:1px}
.mtabs--m button{padding:6px 11px;font-size:12.5px}
/* 埋め込み枠。テンプレは1440px設計なので、縮小して全幅に収める。
   🚨 iframe に直接 transform をかけると親の高さが縮まないので、外箱で高さを作る */
.mframe{position:relative;width:100%;padding-top:56%;margin:14px 0 6px;
  border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.mframe iframe{position:absolute;top:0;left:0;width:1440px;height:2400px;border:0;
  transform:scale(.55);transform-origin:0 0}
@media (max-width:900px){ .mframe{padding-top:82%} .mframe iframe{transform:scale(.34)} }
.pane{background:var(--panel);border:1px solid var(--line);border-top:0;
  border-radius:0 0 10px 10px;padding:18px}

/* 版一覧の表 */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--mute);font-weight:700;
  padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f0f2f4;vertical-align:top}
tr:hover td{background:#fafbfc}
.lk{font-weight:800;color:#0b64c8;text-decoration:none}
.lk:hover{text-decoration:underline}
.lk.dead{color:#9ca3af}
.pill{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;
  border-radius:999px;padding:1px 8px;white-space:nowrap}
.mg{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;
  padding:1px 8px;border:1px solid;white-space:nowrap}
.mg.y{color:#047a20;border-color:#a7e0b5;background:#f1fbf3}
.mg.n{color:#b91c1c;border-color:#fecaca;background:#fef2f2}
.warn{color:#b91c1c;font-size:12px;margin-top:4px}
.mainmark{background:#111827;color:#fff;font-size:10px;border-radius:3px;padding:1px 5px;margin-left:5px}

/* 動画の版一覧＝サムネイルの札。動画は見出しだけでは区別がつかない。
   ★一覧に <video> は置かない。開いた瞬間に全件読みに行って数十MB落ちる。
     静止画だけ出して、再生は版ごとのページ（docs/video/<id>/）へ送る。 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;
  display:flex;flex-direction:column;border-top:4px solid var(--c)}
.card .th{position:relative;display:block;aspect-ratio:16/9;background:#111;
  text-decoration:none;overflow:hidden}
.card .th img{width:100%;height:100%;object-fit:cover;display:block}
.card .th .play{position:absolute;inset:0;display:grid;place-items:center;
  color:#fff;font-size:34px;text-shadow:0 2px 10px rgba(0,0,0,.6);opacity:.9}
.card .th .len{position:absolute;right:7px;bottom:6px;background:rgba(0,0,0,.72);
  color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
.card .th.none{display:grid;place-items:center;background:#e5e7eb;color:#9ca3af;font-size:12px}
.card .bd{padding:11px 13px 13px;flex:1}
.card .t{font-size:13.5px;font-weight:800}
.card .d{font-size:10.5px;color:var(--mute);margin-top:1px}
.card .w{font-size:12.5px;margin-top:6px}
.card .ft{font-size:11px;color:var(--mute);margin-top:7px;display:flex;
  gap:8px;flex-wrap:wrap;align-items:center}

/* 構成シート＝1本を Hook/Body1/Body2/CTA の4枠で横に並べて、版どうしを縦に比べる。
   ★これは表。カードで並べると「同じ枠の文面どうし」が縦に揃わず、比べられなくなる。
   ★横に長いので、版の列だけ固定して中身を横スクロールさせる。 */
.sheetwrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:#fff}


.gck{margin-left:6px;font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:999px;vertical-align:middle}
.gck.ok{background:#e8f7ee;color:#1a7f45}
.gck.ng{background:#fdeaea;color:#b3261e}
.gck.no{background:#f1f3f6;color:#a8b0ba}
.gnode{cursor:pointer}
.dt{position:fixed;right:0;top:0;bottom:0;width:min(560px,92vw);background:#fff;z-index:60;
  box-shadow:-14px 0 40px rgba(20,26,36,.14);display:flex;flex-direction:column}
.dt__h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #eef0f3}
.dt__h b{font-size:15px}
.dt__w{color:#6b7480;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt__go{margin-left:auto;font-size:12px;color:#1a6ee0;text-decoration:none;white-space:nowrap}
.dt__x{border:0;background:#f1f3f6;border-radius:8px;width:28px;height:28px;cursor:pointer;color:#5b6472}
.dt__b{overflow:auto;padding:6px 16px 24px}
.dt__sec{margin:12px 0 18px}
.dt__cap{font-size:11.5px;letter-spacing:.05em;color:#8b94a3;margin:0 0 6px}
.dt__cap.ng{color:#b3261e;font-weight:700}
.head__rv{margin-left:auto;font-size:12px;color:#2563eb;text-decoration:none;white-space:nowrap;
  border:1px solid currentColor;border-radius:999px;padding:4px 12px}
.head__rv:hover{background:#2563eb;color:#fff}
.dt__l{list-style:none;margin:0;padding:0}
.dt__l li{display:grid;grid-template-columns:18px 150px 1fr;gap:8px;align-items:baseline;
  padding:5px 0;border-top:1px solid #f4f6f8;font-size:12.5px}
.dt__l li span{text-align:center;font-weight:700;color:#9aa3af}
.dt__l li.ng span{color:#b3261e}
.dt__l li.human span,.dt__l li.warn span{color:#9a6b12}
.dt__l li b{color:#2b3138}
.dt__l li i{font-style:normal;color:#5b6472;overflow-wrap:anywhere}
.dt__l li u{grid-column:2/-1;display:block;text-decoration:none;margin-top:5px;
  font-size:11.5px;line-height:1.75;color:#1f2937;background:#f4f7fb;
  border-left:3px solid #cfe0f2;border-radius:0 5px 5px 0;padding:6px 9px;
  overflow-wrap:anywhere}
.dt__md{white-space:pre-wrap;font-size:12px;line-height:1.85;color:#3c434c;background:#f8fafc;
  border:1px solid #eef0f3;border-radius:8px;padding:12px 14px;margin:0;max-height:52vh;overflow:auto}
.dt__none{color:#8b94a3;font-size:12.5px;line-height:1.8}
.dt__f>summary{cursor:pointer;font-size:12px;color:#78818e;padding:6px 0}
.dt__at{color:#a6adb8;font-size:11.5px;margin:10px 0 0}

.ck{border:1px solid #e6e9ee;border-radius:10px;margin:0 0 14px;overflow:hidden;background:#fff}
.ck__h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #eef0f3;font-size:13px}
.ck__sum{padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.ck__sum.ok{background:#e8f7ee;color:#1a7f45}
.ck__sum.ng{background:#fdeaea;color:#b3261e}
.ck__go{margin-left:10px;font-size:11.5px;color:#2563eb;text-decoration:none;
  border:1px solid currentColor;border-radius:999px;padding:2px 9px;white-space:nowrap}
.ck__go:hover{background:#2563eb;color:#fff}
.ck__at{margin-left:auto;color:#98a1ad;font-size:11.5px}
.ck__box{padding:8px 14px 10px;border-bottom:1px solid #f4f6f8}
.ck__box.ng{background:#fff6f5}
.ck__box.you{background:#fffaf0}
.ck__box.mine{background:#f9fafb}
.ck__box.warn{background:#fffdf4}
.ck__cap{font-size:11px;letter-spacing:.06em;color:#8b94a3;margin:0 0 4px}
.ck__box.ng .ck__cap{color:#b3261e;font-weight:700}
.ck__box.you .ck__cap{color:#9a6b12;font-weight:700}
.ck__r{display:grid;grid-template-columns:20px 148px 1fr;gap:8px;align-items:baseline;
  padding:3px 0;font-size:12.5px}
.ck__m{text-align:center;font-weight:700;color:#9aa3af}
.ck__box.ng .ck__m{color:#b3261e}
.ck__box.you .ck__m{color:#9a6b12}
.ck__n{font-weight:700;color:#2b3138}
.ck__d{color:#5b6472;overflow-wrap:anywhere}
.ck__f{border-bottom:1px solid #f4f6f8}
.ck__f>summary{padding:8px 14px;font-size:12px;color:#78818e;cursor:pointer;list-style:none}
.ck__f>summary::-webkit-details-marker{display:none}
.ck__f>summary::before{content:"▸ ";color:#b6bdc7}
.ck__f[open]>summary::before{content:"▾ "}
.ck__f .ck__r{padding:3px 14px}
table.sheet{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:1080px}
table.sheet th,table.sheet td{border-bottom:1px solid #eef0f3;border-right:1px solid #f2f4f6;
  padding:8px 10px;vertical-align:top}
table.sheet thead th{position:sticky;top:0;z-index:3;background:#f8fafc;font-size:11.5px;
  color:var(--mute);white-space:nowrap;border-bottom:2px solid var(--line)}
table.sheet .vcol{position:sticky;left:0;z-index:2;background:#fff;width:150px;min-width:150px}
table.sheet thead .vcol{z-index:4;background:#f8fafc}
table.sheet tr:hover td{background:#fbfcfd}
table.sheet tr:hover .vcol{background:#fbfcfd}
.sheet .sec{width:238px;min-width:238px}
/* 動画列。押すまでは静止画だけ（勝手に読み込ませない） */
.sheet .play{width:250px;min-width:250px}
.sheet thead th.play{text-align:left}
.vbox{position:relative;width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;
  background:#0d1117;cursor:pointer}
.vbox img,.vbox video{width:100%;height:100%;object-fit:cover;display:block}
.vbox video{cursor:auto;object-fit:contain;background:#000}
.vbox .pbtn{position:absolute;inset:0;display:grid;place-items:center;color:#fff;
  font-size:30px;text-shadow:0 2px 12px rgba(0,0,0,.65);opacity:.92}
.vbox:hover .pbtn{opacity:1;transform:scale(1.08);transition:.15s}
.vbox .plen{position:absolute;right:6px;bottom:5px;background:rgba(0,0,0,.72);color:#fff;
  font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
.sheet .sm{width:96px;min-width:96px}
.sheet .av{width:172px;min-width:172px}
.sheet .th{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px;
  background:#eef0f3;margin-bottom:6px}
/* 素材の落とし口。サムネ自体は押せない（意図せず数MB落とさないため） */
.thw{position:relative}
a.dl{position:absolute;right:4px;top:4px;background:rgba(8,12,18,.78);color:#fff;
  font-size:10px;font-weight:700;line-height:1;border-radius:4px;padding:3px 6px;
  text-decoration:none;opacity:.55;transition:.12s}
.thw:hover a.dl{opacity:1;background:#111827}
a.dl:hover{transform:translateY(-1px)}
.vdl{font-size:11px;color:var(--mute);margin-top:6px;position:relative;padding-right:52px}
.vdl a.dl{position:absolute;right:0;top:-2px;opacity:.75}
.sheet .noimg{display:grid;place-items:center;width:100%;aspect-ratio:16/9;border-radius:5px;
  background:#f3f5f7;color:#aab1ba;font-size:11px;margin-bottom:6px;
  border:1px dashed #dfe3e8}
.sheet .tx{line-height:1.55}
.sheet .ch{color:var(--mute);font-size:11px;margin-top:3px}
.sheet .ch b{color:var(--ink)}
.sheet .chain{margin-top:6px;display:flex;gap:3px;flex-wrap:wrap}
.sheet .sh{font-size:10px;border-radius:4px;padding:1px 6px;white-space:nowrap;
  border:1px solid #dfe3e8;color:#5b636d;background:#f8fafc}
.sheet .sh.img{background:#eef7f1;border-color:#bfe3cc;color:#1f7a44}
.sheet .rule{color:#78350f;background:#fffbeb;border-left:3px solid var(--review);
  border-radius:0 6px 6px 0;padding:7px 9px;font-size:11.5px;line-height:1.55}
.sheet .avpair{display:flex;gap:6px}
.sheet .avpair figure{margin:0;flex:1}
.sheet .avpair figcaption{font-size:10px;color:var(--mute);text-align:center;margin-top:2px}
.sheet .logo{display:block;width:100%;border-radius:4px;background:#fff;
  border:1px solid #eef0f3;padding:6px}
.sheet .vid{font-weight:800;font-size:13px}
.sheet .vmeta{font-size:10.5px;color:var(--mute);margin-top:2px}
.sheet tr.planned .tx{color:#4b5563}
.sheet .todo-pill{display:inline-block;font-size:10px;font-weight:800;border-radius:999px;
  padding:1px 7px;background:#eef2f7;border:1px solid #dbe2ea;color:#5b636d;margin-top:3px}
.sheet tr.tmpl td{background:#fffdf5}
.sheet tr.tmpl:hover td,.sheet tr.tmpl:hover .vcol{background:#fffaeb}
.sheet tr.tmpl .vcol{background:#fffdf5}

/* 派生図 */
.graph{position:relative;overflow-x:auto;padding:8px 4px 4px}
.gcanvas{position:relative;z-index:1}
/* ★節は絶対配置。縦位置は graphPane が計算する（列の頭から詰めない）。
   高さを固定しているのは、段の間隔と衝突させないため。 */
.gnode{position:absolute;width:212px;height:100px;overflow:hidden;
  border:1px solid var(--line);border-left:4px solid var(--c);
  background:var(--b);border-radius:8px;padding:9px 11px}
.gnode .t{font-weight:800;font-size:13.5px}
.gnode .d{font-size:10.5px;color:var(--mute)}
.gnode .w{font-size:11.5px;margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gnode .ext{font-size:10.5px;color:#0b64c8;margin-top:2px}
.gnode.hasext .w{-webkit-line-clamp:1}   /* 由来の1行が増えるぶん本文を1行に */
.gsvg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible}

/* FB履歴 */
.fbrow{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 4px;
  border-bottom:1px solid #f0f2f4}
.fbrow .dt{font-size:12px;color:var(--mute)}
.fbrow .wh{font-size:13.5px}
.fbrow .to{font-size:11.5px;color:var(--mute);margin-top:2px}

/* LP制作フロー ─ 派生図と同じ描き方（節＋SVGの線）*/
.fbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px}
.fleg{color:var(--mute);font-size:11.5px}
.fleg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 5px 0 14px}
.fleg i.ok{background:var(--live)} .fleg i.miss{background:var(--bad)}
.fleg i.none{background:var(--review)}

.fgraph{position:relative;overflow-x:auto;padding:6px 4px 10px;margin-top:14px}
.fcanvas{position:relative;z-index:1}
.fsvg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible}
.fgl{position:absolute;top:0;width:252px;border-bottom:2px solid #111827;padding-bottom:6px}
.fgt{font-size:13px;font-weight:800}
.fgt span{font-weight:400;font-size:11px;color:var(--mute);margin-left:7px}
.fgs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.fgs .sk{font-size:10px;padding:2px 7px}

.fnode{position:absolute;width:252px;height:44px;display:flex;align-items:center;gap:9px;
  background:#fff;border:1px solid var(--line);border-left:5px solid var(--live);
  border-radius:9px;padding:0 12px;cursor:pointer}
.fnode.miss{border-left-color:var(--bad)}
.fnode.none{border-left-color:var(--review)}
.fnode:hover{border-color:#94a3b8;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.fnode.on{background:#111827;border-color:#111827}
.fnode.on .fnm{color:#fff}
.fnode.on .fno{background:#fff;color:#111827}
.fnm{font-size:13px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fno{width:22px;height:22px;flex:none;border-radius:50%;background:#111827;color:#fff;
  font-size:11.5px;font-weight:800;display:grid;place-items:center}

.fdp{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
  margin-top:16px;min-height:64px}
.fdph{color:var(--mute);font-size:12.5px}
.fdh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fdh h3{font-size:15px}
.fdw{font-size:13px;margin:7px 0 8px}
.fm{font-size:12px;color:var(--mute);margin-bottom:3px}
.fm i{font-style:normal;font-weight:700;margin-right:7px;color:#9ca3af}

.frisk,.fgap,.floop{font-size:12.5px;margin-top:8px;padding:8px 11px;border-radius:0 7px 7px 0;line-height:1.6}
/* ループの節（工程12〜15）。戻り線と同じ色にして、絵と説明を結びつける */
.floop{background:#fff4ec;border-left:3px solid #e07a2f;color:#7c3d10}
.floop b{display:block;margin-bottom:3px}
.fnode.isloop{box-shadow:inset 0 0 0 2px #f3c7a4}
/* 型の構成表 */
.stt{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:13px}
.stt th,.stt td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.stt th{background:var(--paper);font-weight:700;white-space:nowrap}
.stt td.n{width:34px;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums}
.stt td.pt{white-space:nowrap;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--mute)}
.frisk{background:#fef2f2;border-left:3px solid var(--bad);color:#7f1d1d}
.fgap{background:#fffbeb;border-left:3px solid var(--review);color:#78350f}
.frisk b,.fgap b{display:block;font-size:11px;letter-spacing:.06em;margin-bottom:2px}
.sk{font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;border:1px solid}
.sk.have{background:#f1fbf3;border-color:#a7e0b5;color:#047a20}
.sk.miss{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.sk.none{background:#f8fafc;border-color:var(--line);color:#9ca3af}
.sd{color:var(--mute);font-size:12px}
tr.rmiss{background:#fef2f2}
.ghd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:22px 0 8px;
  padding-bottom:6px;border-bottom:2px solid #111827}
.ghd h3{font-size:16px}
.ghd span{font-size:12px;color:var(--mute)}
.ghdb{margin-left:auto}
.dlb{font-size:12px;font-weight:800;text-decoration:none;border-radius:7px;
  padding:6px 14px;background:#111827;color:#fff;white-space:nowrap}
.dlb:hover{background:#374151}

.upd{font-size:11.5px;color:var(--mute);margin-top:4px;
  border-left:2px solid var(--line);padding-left:8px}
.upd ul{margin:2px 0 0 14px}
.glo{margin-top:14px;border:1px solid var(--line);border-radius:9px;background:#fafbfc}
.glo summary{cursor:pointer;font-size:12.5px;font-weight:700;padding:9px 14px;color:var(--mute)}
.glo summary:hover{color:var(--ink)}
.glo dl{display:grid;grid-template-columns:88px 1fr;gap:5px 14px;padding:2px 16px 14px;font-size:12.5px}
.glo dt{font-weight:800}
.glo dd{color:var(--mute)}

.todo{background:#fff;border:1px solid #fecaca;border-radius:10px;padding:14px 18px;margin-bottom:16px}
.todo h3{font-size:14px;color:#b91c1c;margin-bottom:6px}
.todo li{margin-left:18px;font-size:13px;margin-top:4px}
.rules{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-size:12.5px}
/* 見出しの b だけ block にする。li の中の b まで block にすると箇条書きが崩れる */
.rules>b{display:block;margin-bottom:4px}
.rules li{margin-left:18px}
@media(max-width:820px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:static}
  .main{padding:16px}
  /* 幅が足りないのでブラケットは畳み、担当スキルを箱の中に出す */
  .lane{grid-template-columns:1fr}
  .brk{display:none}
  .skm{display:inline}
  .lnk{margin-left:calc(50% - 1px)}
}
</style>
</head>

": []}, {"id": "esl7", "date": "2026-09-07", "status": "shown", "parent": "esl3", "what": "半額キャンペーンCTAを追加（9-7〜10-31）", "fb": [{"date": "2026-09-07", "what": "半額キャンペーンにCTAを差し替え"}, {"date": "2026-09-07", "what": "CTA下部の文言（いつまでに2級〜）が戻っている／「さま」表記も戻っている＝先祖返り。CTAボタンはオレンジに"}], "alert": "★先祖返りの原因。8/31の esl6（FB反映版）ではなく 8/19の esl3 から複製したため、さま表記・CTA補足文・スクールマネージャー段落の修正が丸ごと落ちている", "shown_on": "2026-09-07"}, {"id": "esl9", "date": "2026-09-07", "status": "internal", "parent": "esl7", "what": "CTAボタンを緑→オレンジに", "fb": [{"date": "2026-09-07", "what": "CTAが地の緑と同色で埋もれている"}], "alert": "※要確認 クライアントに見せたか未記録。見せたなら lpv.py show esl9 を打つ（打つとそのリンクは凍る）"}, {"id": "esl10", "date": "2026-09-07", "status": "internal", "parent": "esl7", "what": "半額価格を赤に（CTAは緑のまま）", "fb": [{"date": "2026-09-07", "what": "最初の赤も見比べたい"}], "alert": "※要確認 クライアントに見せたか未記録。見せたなら lpv.py show esl10 を打つ（打つとそのリンクは凍る）"}, {"id": "esl11", "date": "2026-09-07", "status": "internal", "parent": "esl7", "what": "半額価格をオレンジに（CTAは緑のまま）", "fb": [{"date": "2026-09-07", "what": "オレンジだとどうかも見たい"}], "alert": "※要確認 クライアントに見せたか未記録。見せたなら lpv.py show esl11 を打つ（打つとそのリンクは凍る）"}, {"id": "esl13", "date": "2026-09-07", "status": "shown", "parent": "esl6", "what": "8/31のFB反映版(esl6)に半額CTAを移植＋CTAボタンをオレンジに。クライアントFB 8件すべて反映済み", "updates": [{"date": "2026-09-07", "what": "FB8件目（FVの画像の縦揺れ）を実測で確認。写真の動きは0.00%で停止済み"}, {"date": "2026-09-07", "what": "ヘッダー以外の黄色い「無料体験レッスンはこちら」ボタンを削除（CTA3箇所）。キャンペーンのオレンジCTAに一本化"}, {"date": "2026-09-07", "what": "一番下のCTAで白い箱が二重だったので内側のカード(camp--card)を外した"}, {"date": "2026-09-07", "what": "コード一式を先方共有用にzip化（ESLclub_オンライン校LP_20260907.zip / index.html＋img 22枚）"}], "fb": [{"date": "2026-09-10", "what": "比較表『他の英語スクールとの違い』の ESL club ロゴが異様に小さい"}], "shown_on": "2026-09-10"}, {"id": "esl16", "date": "2026-09-10", "status": "shown", "parent": "esl13", "what": "クライアントFB反映：比較表の ESL club ロゴを大きく", "updates": [{"date": "2026-09-10", "what": "比較表の ESL club ロゴを2.2倍に（字の高さがA社/B社と揃う）。スマホで『バイリンガル講師のマンツーマンレッスン』の最終行が1文字だけ落ちていたのも修正"}, {"date": "2026-09-10", "wh トランの節。見出しと本文はよいが、その下（流れ5つ・メニュー8曲・演奏編成・シェフのひとこと＋セリフ例）が微妙。デザインから画像生成でやり直したい"}, {"date": "2026-09-14", "what": "So：FVの写真は、素材の『名称未設定のデザイン.png』のように複数使う形でもよいかも。ときには背景を透過（切り抜き）。ぴったり決まる1枚が無い"}, {"date": "2026-09-14", "what": "So：背景の図形は常時動く感じのアニメーションが欲しい"}, {"date": "2026-09-14", "what": "So：3つの安心（予約・申込不要／途中入場も途中退出も自由／走っても大丈夫な芝生の広場）の高さを統一したい、同じ高さに"}, {"date": "2026-09-14", "what": "So：楽器体験の丸写真（ヴァイオリン・チェロ・フルート・ピアノ）は体験会の時の写真を使いたい（今は公式サイトの写真）"}, {"date": "2026-09-14", "what": "So：図形のアニメーションは一気に動きすぎ。1個か2個ずつ。頻度も高すぎる"}, {"date": "2026-09-14", "what": "So：演奏編成がおかしいことになっている（貼られた文字：ヴァイオリン＋ヴァイオリン／ … ヴァイオリン＋チェロ。）。ちゃんと確認して"}, {"date": "2026-09-14", "what": "So：メニュー（8曲）はもっとメニューっぽくしたい"}, {"date": "2026-09-14", "what": "So：FVの図形、いちばん左上のピンクは消して良い"}, {"date": "2026-09-14", "what": "So：FVの3枚目の画像（ピアノの男の子）で、男の子が何を演奏しているのか見えにくい"}, {"date": "2026-09-14", "what": "So：開いたときに『ARK Hills Music Week 2026｜音の遊び場』が見えない。いちばん上までスクロールした状態で始まるようにしないと"}, {"date": "2026-09-14", "what": "So：メニューと演奏編成をデザイン的にもう一度やり直したい（画像生成でもよい）。これからは新しいリンクに更新"}], "script": "v2"}, {"id": "suzuki-ark2", "date": "2026-09-15", "status": "internal", "parent": "suzuki-ark1", "what": "So の指示（9/14）『これから新しいリンクに更新』。suzuki-ark1 はここで止め、以降の直しはこちら。まずメニューと演奏編成を画像生成からやり直す", "updates": [{"date": "2026-09-15", "what": "So FB 2件：①FVのCTAを写真の下の段から『…ピアノに触れられます。』の直下（左の列）へ ②レスポンシブ：8幅（375〜1440）で横溢れ・文字切れ0を実測したうえで、601〜900pxのFVのコラージュ幅を560pxに（FV 1,427→1,291px）、同じ幅でメニューを2列に、スマホの追従CTAの小さい字12px・ロゴのリンク44px。og:image を suzuki-ark2 に"}, {"date": "2026-09-15", "what": "ヘッダーをロゴとCTAだけにした（So『ヘッダーはロゴとCTAのみで良い』）：ページ内ナビ6つ・メニューボタン・全画面メニューと、その開閉・今いる節の表示のJSを外した。スマホはロゴだけで、CTAは画面下の追従のまま"}, {"date": "2026-09-15", "what": "スマホのヘッダーにもCTA（So『ロゴ＋CTA・下の追従も残す』）：900px以下は高さ44px・14px、420px以下は13pxで矢印なし、359px以下はロゴ30px。320〜1440pxで横溢れ0"}, {"date": "2026-09-15", "what": "メニューと演奏編成を T6 伝票に（So が『トーンそのまま4案』から選択）：券売機（黒い帯＋灰色の台＋色の線）をやめ、8曲を教本の順に1列・点線で区切った伝票。演奏編成も同じ点線の4行（楽器の色は名前の前の点だけ）。左の列の下端合わせをやめ、演奏編成を流れのすぐ下へ（寄せると約200pxの穴があいた）"}, {"date": "2026-09-15", "what": "音楽レストランを絵つきに（So『2x2だと初めて読んでよく分からない。画像を』）：流れ5手順を画像生成の線画つきで横一列（スマホは縦）、その下に③メニュー｜④シェフ（絵つき）・⑤演奏編成を手順順に。見出しの前に手順の番号（CSSで描く）。ヘッダーはナビ3つ＋CTA（演奏スケジュール／楽器体験／よくある質問）。よくある質問の矢印を閉＝下向き・開＝上向きに"}, {"date": "2026-09-15", "what": "FV：スマホにも背景の図形6つ（文字に重なり0を実測）／イベント名を見出しの直上へ（PCは写真の位置を前と同じに保った）／会場名を日付と同じ大きさ（26px・太字、375pxはアークヒルズの後ろでだけ折る）。缶バッジを立体に（手元の画像処理で縁・艶・影、外部に出さず）"}, {"date": "2026-09-15", "what": "音楽レストランの絵をページの画風に作り直し（So『イラストのトーンが絶対におかしい』）：ページの図形（色と粒子）を下敷きに、人も丸い図形・輪郭線なし・顔の描き込みなし・シェフ帽なしで流れ5枚＋シェフ1枚。演奏編成は色の丸 → 同じ画風の楽器の絵（So『アイコンも入れたい』）"}, {"date": "2026-09-15", "what": "メニュー／シェフのひとこと／演奏編成の見出しの前の番号（3・4・5）を外した（So『番号そのもの無くて良い』）。流れの1〜5は残す"}, {"date": "2026-09-15", "what": "スマホのFVで条件3つを写真の上へ（So『画像の上にこないと』）：日付・会場→条件→写真→見出し→CTA。条件のアイコンを同じ画風の絵に（So『微妙』）：ハートの入場券／人が通る開いた扉／ヴァイオリンを持つ子。PCのFVの高さ・写真の位置は前と同じ"}, {"date": "2026-09-15", "what": "文字サイズをESL基準に（So『バラバラか小さいか』）：本文・リード・表・FAQ・メニュー＝18px、注記・ラベル＝16pxの2段、h2 28px・h3 23px（1440pxで18pxが全文字の79%）。18pxで出た孤立行は文節の <wbr>＋keep-all で解消。シェフの絵を全身が入る角丸に（So『途中で切れている』）。スマホFVを B：日付→条件→見出し→写真→リード→CTA"}, {"date": "2026-09-15", "what": "スマホで段落が左に寄って右が空く所を全部直した（So『楽器の下のテキストや缶バッジなど、右に空き』『全て確認して』）：文節でしか折らない指定（前回の孤立行対策）・FAQの行の長さをそろえる指定・塊の改行（nb）が原因。本文はふつうに折り、最後の行が数文字だけの段落だけスクリプトで幅を最大3文字〜17%詰める。320〜1440pxの22幅で右空き0"}, {"date": "2026-09-15", "what": "FVの日付・会場と条件3つを白いカードにまとめた（So『ボックスに入れる感じ』→3案から白いカード→『物足りない、周りに二重の線？』）：縁の線＋5px空けてもう1本。カードの内側と見出しまでの間を詰めて、1440pxでFVの中身の下がりを+22pxに抑えた"}, {"date": "2026-09-15", "what": "スマホで本文の行末が右端まで届かず左に寄って見えた所を両端揃えに。見出し・ボタン・FAQ・セリフ・特典の札は文節で折る（アークヒルズ公式／イベントページ）。画面下の追従ボタンの日付と会場を2行に分けて中央に。孤立行は幅を変えずに字間と送りで直す"}, {"date": "2026-09-15", "what": "記念フォトカード本文を特典の枠から出して独立したまとまりに（写真を添える）・特典の枠はイラストに。スマホの並び：演奏編成をシェフのひとことの前に／スズキ・メソードについては見出し→写真→本文。Googleカレンダーを2日間の終日の予定に（10/10だけ登録されていた）"}, {"date": "2026-09-15", "what": "FVの箱を白地＋線1本に（外側の2本目を外した）。スマホの本文の字間を同じ間隔に（両端揃えをやめ、字間を整えて列の幅に収める）。記念フォトカード本文の写真を子どもの顔にピントが合った1枚に"}, {"date": "2026-09-15", "what": "スマホの本文：字間を整えて列の幅に収めたうえで両端揃え（右の余白なし・広がるのは禁則の行だけ）。text-wrap:pretty と末尾の送りをやめた"}, {"date": "2026-09-15", "what": "スマホの画面下の追従CTAを外した（So：指示が無ければ消して良い。ヘッダーに同じCTAが ・日付が最初』を満たしつつ、スマホで良い配置はないか"}, {"date": "2026-09-15", "what": "So：スマホFVはB（日付→条件→見出し→写真→リード→CTA）"}, {"date": "2026-09-15", "what": "So：スマホのとき、4つの楽器の下のテキストや缶バッジなど、ところどころ左に寄っていて右に空きがある"}, {"date": "2026-09-15", "what": "So：FVの日付・会場と条件3つのところがまだ微妙。何かボックスに入れる感じ（冒頭にまとめるサイトのような）はどうか。イメージつく？"}, {"date": "2026-09-15", "what": "So：FVのボックスは案1 白いカードでいいが、何か物足りない。周りに二重の線？"}, {"date": "2026-09-15", "what": "So：（再）スマホで楽器の下のテキストや缶バッジなど、ところどころ左に寄って右に空きがある。これ何が治ったの？"}, {"date": "2026-09-15", "what": "So：①スマホで右にスペースがある（marginの問題では）②スマホは演奏編成をシェフのひとことの前に ③記念フォトカード本文「はじめて楽器にふれた日を一枚の写真に。…カードです。」がまるまる抜けていないか。来場特典の方はイラストに、この本文には今の記念フォトカードの写真を使う ④スマホの「どの子も育つ 育て方ひとつ」は見出し→写真→本文の順 ⑤Googleカレンダーに追加が10/10しか登録されない"}, {"date": "2026-09-15", "what": "So：FVのボックスはやっぱり線（1本）でいい。白背景の"}, {"date": "2026-09-15", "what": "So：ガチでなんなん。文字の間隔は戻ったけど、また右に余白ができた"}, {"date": "2026-09-15", "what": "So：スマホの時、CTAが下に映るのって指示あったっけ？なければ消して良い → 消す（ヘッダーに同じCTAが常に出ている）"}, {"date": "2026-09-15", "what": "So（編集依頼が来た）：来場者バッジ＝ご来場特典の缶バッジの画像を、支給の写真 image (67).png（缶バッジ3個：フルート・ピアノ・ヴァイオリン）に変える。背景は透過して"}]}, {"id": "suzuki-ark3", "date": "2026-09-15", "status": "shown", "parent": "suzuki-ark2", "what": "suzuki-ark2 は一旦完成（So 9/15）なので止めて残し、以降の直しはこちら。まず来場者バッジ（ご来場特典の缶バッジ）を支給の写真（缶バッジ3個・背景透過）に差し替え", "updates": [{"date": "2026-09-15", "what": "来場者バッジ（ご来場特典の缶バッジの画像）を、編集依頼の写真 image (67).png（缶バッジ3個：フルート・ピアノ・ヴァイオリン）に差し替え。背景は macOS の Vision で透過（ローカル・外部に出していない）、縁に混ざった紙の色を抜いて 640px の WebP（68KB）。表示は幅260px・高さ229px（隣の記念フォトカードの絵と同じ高さ）、影は前の立体の缶バッジと同じく下に弱く。代替テキストも写真に合わせた。前の img/badge-3d.webp は残してある"}], "fb": [{"date": "2026-09-19", "what": "クライアント（実行委員会の回答つき）から修正項目まとめ.pdf（4枚・黄=追加/変更・取り消し線=削除）。①日時に11:00-17:00を追加 ②条件は「3歳前後から体験いただけます」 ③コンサート＝リード文追加（芝生コンサートはステージと客席を区切らず奏者が広場に散らばる）／表を『コンサート』の2公演（10/10 11:15-11:45 スズキチルドレン アンサンブル〜芝生コンサート〜・10/11 11:00-11:30 スズキ・メソード コンサート〜滝前コンサート〜）に／出演の項目を削除／曲目末尾の1文を削除／コンサート写真を追加（キャプション例：昨年の「滝前コンサート」より）／保護者向けの一文を差し替え ④楽器体験＝リードを「聴くだけではありません。広場で楽器に触れて、鳴らしてみましょう。」に、本文は「指導者が横につきます」のみ、場所の注記は削除 ⑤音楽レストラン＝トピックス版の本文に差し替え、メニュー8曲・シェフのひとこと・楽器編成・2 程12〜15を、FBが来るたび回る"}], "steps": [{"n": 0, "group": "propose", "name": "材料を揃える", "what": "対象企業名とコーポレートサイトURL / 問い合わせメールの原文 / 入口になった営業オファーの内容（何を無料と案内したか）", "skill": "lp-proposal", "tool": null, "out": "メール本文から明示的に求められているものの箇条書き（認識ズレの確認）", "risk": "3点が揃わないうちに始めると、後半で前提が崩れて全部やり直しになる", "gap": null, "loop": false}, {"n": 1, "group": "propose", "name": "企業と公開情報のリサーチ", "what": "正式社名・法人番号・所在地・設立・資本金・代表者名・従業員数・事業内容・許認可・収益構造の推定 / 実績（サイト外含む）/ 想定される集客経路 / 市場相場", "skill": "lp-proposal", "tool": null, "out": "事実（出典URL付き）と推測を分けたリサーチ結果、取得できなかった項目のリスト", "risk": "同名の別会社と混同する。必ず所在地・ドメイン・電話番号で同定する", "gap": null, "loop": false}, {"n": 2, "group": "propose", "name": "サイト内全ページの精読", "what": "実績一覧とカテゴリから個別ページURLを全て辿り、1件ずつ本文を取得。特色をどうデザイン判断に変換したかを原文に近い形で抜く", "skill": "lp-proposal", "tool": null, "out": "事例ごとの制作意図（URL・クライアント名を紐づけ）/ トップで伝わっていない資産のリスト", "risk": "一覧のリード文で止めた結果、47件を件数と社名としてしか扱えず、提案の背骨になる材料をまるごと逃した。キービジュアルの画像内文言も見落とし、既に公開済みのものを追加提案しかけた", "gap": null, "loop": false}, {"n": 3, "group": "propose", "name": "強みの言語化とギャップ抽出", "what": "事例を読んでから共通点を帰納し、型に名前をつける。型が鮮明に出ている事例を3件選び、トップで語られているかを確認する", "skill": "lp-proposal", "tool": null, "out": "型の名前 / 事例3件（選定理由・外した理由つき）/ トップとのギャップ", "risk": "強みを先に決めて事例を後から探すと、どの同業にも当てはまる一般論になる。社名の知名度で選ぶのも同じ結果になる", "gap": null, "loop": false}, {"n": 4, "group": "propose", "name": "顧客側の時間軸の整理", "what": "クライアントの見込み客が、発生（課題が生まれる）→ 空白期間（動けない）→ 発火（問い合わせを押す）のどこで動くかを場面として書き出す", "skill": "lp-proposal", "tool": null, "out": "発火のトリガー3つと、それぞれにLPで何をすれば答えられるかの対応", "risk": "トリガーがずれるとLPの構成順序ごと変わる。ここは必ず相手の実感と突き合わせる", "gap": null, "loop": false}, {"n": 5, "group": "propose", "name": "提案スライドを作る", "what": "初回ミーティング用の7枚。カラーは3段階（濃紺=主役／青=次／グレー=既存）、文字サイズは 24/18/14/12/11 で固定", "skill": "lp-proposal", "tool": "PPTX→PDF化して全枚を目視", "out": "提案スライド 7枚", "risk": "強みを断言するスライドを作ったのに、根拠となる事例が資料のどこにも無かった。相手が専門家だと、根拠のない称賛は営業の持ち上げに見える", "gap": null, "loop": false}, {"n": 6, "group": "propose", "name": "LP構成案を作る（＝流し込み表を埋める）", "what": "FV→共感→強みの実例→実績と規模→進め方→3つの安心→料金→お客様の声→他との違い→FAQ→会社情報→クロージング。各セクションに『なぜその位置か』を1行添える", "skill": "lp-proposal", "tool": null, "out": "content/<案件id>.json と content/<案件id>_構成案.md（テンプレの差し替え箇所ぜんぶ。素材が無い箇所は空欄＝素材依頼リスト）", "risk": "🚨 構成案と流し込み表を別に書くと必ずズレる。2026-09-11、構成案は13節ぶんしか書いておらず、テンプレの131箇所のうち118箇所が誰の担当でもなくなった。結果、13節のうち11節にテンプレ元（別業種）の文が残ったまま検査を全部通った。★同じJSONから構成案も出す。埋めるのは1箇所だけにする。", "gap": null, "loop": false, "how": "★先に型（骨格）を確定してから始める。型は工程1〜4のリサーチで決まる（BtoB/BtoC × 検討の長さ × 単発/継続）。\n  1. python3 ~/lp-moods/build.py <雰囲気> --type=<型>\n  2. python3 ~/lp-moods/pour.py <案件id> --init <雰囲気> --type=<型>\n     → 差し替え箇所の一覧（E型で131箇所・うち必須86）と構成案の1枚が出る\n  3. 構成案の『書くこと』を埋める（＝JSONの to を埋める）\n  4. python3 ~/lp-moods/pour.py <案件id> --audit で触れていない箇所を確認"}, {"n": 7, "group": "propose", "name": "確認事項を抽出する", "what": "納品形式 / 掲載許諾の範囲 / 現在の集客施策と反応 / 現在の問い合わせ件数と目標。後から出てくると見積が崩れる項目を優先", "skill": "lp-proposal", "tool": null, "out": "確認事項リスト（スライドP.7とLP構成案の両方に反映）", "risk": "こちらがかけたフォーム営業を、先方が実施している施策として資料に書いた。営業行為と先方の実態を混ぜない", "gap": null, "loop": false}, {"n": 8, "group": "build", "name": "雰囲気テンプレを選ぶ", "what": "構成が決まった後、雰囲気6型のテンプレから合うものを選ぶ。あわせて『写真が何枚・文字が何行』で構成の合う実物FVをベンチマークとして2〜3本押さえる", "skill": "lp-benchmark", "tool": "~/lp-moods/gen_mood.py（既存LPのスクショ→6型）/ build.py（トークン差し替え）", "out": "採用する雰囲気 1つ＋参照する実物LP 2〜3本", "risk": "参照なしで作ると出力が頭打ちになる。一覧のサムネだけで選ぶと必ず外す。静かな雰囲気はCTAが沈むので要注意 ／ ★雰囲気は見た目だけで骨格（差し替え箇所）を変えない。だから工程6を先に進めてよい。ただし 01_genki だけ専用FVを持つので、元気に決まったら --init を作り直す（FVの箇所が変わる）。", "loop": false}, {"n": 9, "group": "build", "name": "デザイン案を出す", "what": "選んだ雰囲気で、本物のLPのスクショを /images/edits で着せ替える。ゼロから生成しない", "skill": null, "tool": "gen_edit.py --mood", "out": "案 3〜6枚（1枚 約¥30）", "risk": "ゼロ生成は『AIくさい発明レイアウト』になって全部ボツ。edits は元をなぞるので文字が化けずレイアウトも本物のまま", "gap": "手順は確立済みだがスキル化されていない。lp-restyle にすべき", "loop": false}, {"n": 10, "group": "build", "name": "コードに起こす", "what": "採用した画像を実測してHTML/CSSに落とす。目分量で書かない", "skill": "lp-repro", "tool": "measure.py / shot.py / diff.py", "out": "index.html（工程6で埋めた表を pour.py で流し込む。手打ちしない）", "risk": "測定窓が隣の要素を拾って誤った値を採る。字面ではなく字送りで測る", "gap": null, "loop": false}, {"n": 11, "group": "build", "name": "仕上げる", "what": "配色のメリハリ・アクセントの置き場所・スマホの崩れ・背景の動き", "skill": "lp-polish", "tool": null, "out": "index.html（初稿）", "risk": "日本語の改行は auto-phrase が Safari で効かない。nbスパン＋wbr を必ず入れる。入れないと画面外へ溢れる", "gap": null, "loop": false}, {"n": 12, "group": "build", "name": "検証する", "what": "check.py を通す（5幅で撮って21項目を測る）／落ちたらリンクを渡さない／_shot.jpg を見て claude 項目に where・what・how を書く", "skill": "lp-polish", "tool": "check.py（lpv.py new / show の中で自動的に走る）／shot.py", "out": "_check.json（21項目の判定）＋ ~/Desktop/lp_check.png（5幅を1枚に）", "risk": "headlessの375pxは実機と違う。切れて見えても実機では切れていないことがある。★『実機スマホ』だけは機械で出ない（human項目）。★2026-09-11まで、この工程に check.py が書かれておらず、『私が覚えていれば通る』状態だった。いまは lpv.py new / show の中で関門として走る（飛ばすには --skip-check が必要で、飛ばした事実は台帳に残る）", "gap": null, "loop": true}, {"n": 13, "group": "manage", "name": "リンクを作って見せる", "what": "まず「自分の確認用」で公開して自分で見る。渡したら lpv.py show を打つ", "skill": "lp-version", "tool": "lpv.py new → lpv.py show", "out": "クライアントに渡すリンク＋台帳の1行", "risk": "派生元を書かずに cp -r で作ると、そのリンクがどこから来たか永久に分からなくなる／★lpv.py show は check.py を通ってからでないと記録できない（落ちているページを渡した記録は作らせない）", "gap": null, "loop": true}, {"n": 14, "group": "manage", "name": "FBを受ける", "what": "指摘が来たら【直す前に】台帳へ1行入れる", "skill": "lp-version", "tool": "lpv.py fb", "out": "FB履歴", "risk": "直してから記録しようとすると、直した内容しか残らず『何を言われたか』が消える", "gap": null, "loop": true}, {"n": 15, "group": "manage", "name": "直す", "what": "渡す前のリンクは中身を直す。渡した後のリンクは触らず、新しいリンクへ逃がす", "skill": "lp-version", "tool": "lpv.py update（渡した後なら自動で新リンク）", "out": "更新の記録、または新しいリンク", "risk": "クライアントが見ている最中に中身が変わるのが一番まずい。逆に、直したのに古いリンクを渡したままだと『FB反映前の版』と言われる（2026-09-07）", "gap": null, "loop": true}], "loops": [{"from": 15, "to": 12, "label": "FBが来るたび回る", "note": "初稿ができたら、ここから先は一方通行ではなくループ。直す → check.py を通す → リンクを出す → FBを受ける → また直す。★見せたリンクは凍るので、直すと lpv.py が自動で新しいリンクへ逃がす（クライアントが見ている最中に中身が変わるのを防ぐため）。だから『リンクが増える』のは正常で、増えないほうが異常。"}]}, "skills": [{"id": "banner-design", "name": "banner-design", "desc": "Design banners for social media, ads, website heroes, creative assets, and print. Multiple art direction options with AI-generated visuals. Actions: design, create, generate banner. Platforms: Facebook, Twitter/X, LinkedIn, YouTube, Instagram, Google Display, website hero, print. Styles: minimalist, gradient, bold typography, photo-based, illustrated, geometric, retro, glassmorphism, 3D, neon, duotone, editorial, collage. Uses ui-ux-pro-max, frontend-design, ai-artist, ai-multimodal skills.", "mine": false, "blocked": 0}, {"id": "brand", "name": "brand", "desc": "Brand voice, visual identity, messaging frameworks, asset management, brand consistency. Activate for branded content, tone of voice, marketing assets, brand compliance, style guides.", "mine": false, "blocked": 0}, {"id": "brief", "name": "brief", "desc": "報告を短くする。作業が終わったとき、選択肢を出すとき、聞かれたことに答えるときの既定の型。報告が10行を超えそうになったら必ず使う。「要点だけ」「長い」「短く」と言われたら使う。", "mine": true, "blocked": 0}, {"id": "design", "name": "design", "desc": "Comprehensive design skill: brand identity, design tokens, UI styling, logo generation (55 styles, Gemini AI), corporate identity program (50 deliverables, CIP mockups), HTML presentations (Chart.js), banner design (22 styles, social/ads/web/print), icon design (15 styles, SVG, Gemini 3.1 Pro), social photos (HTML→screenshot, multi-platform). Actions: design logo, create CIP, generate mockups, build slides, design banner, generate icon, create social photos, social media images, brand identity, design system. Platforms: Facebook, Twitter, LinkedIn, YouTube, Instagram, Pinterest, TikTok, Threads, Google Ads.", "mine": false, "blocked": 0}, {"id": "design-system", "name": "design-system", "desc": "Token architecture, component specifications, and slide generation. Three-layer tokens (primitive→semantic→component), CSS variables, spacing/typography scales, component specs, strategic slide creation. Use for design tokens, systematic design, brand-compliant presentations.", "mine": false, "blocked": 0}, {"id": "llmo-measure", "name": "llmo-measure", "desc": "ChatGPTとGeminiの実画面から、あるブランドの言及率・登場順・引用元・特徴の反映を実測する。AI可視性（LLMO/GEO）の定点観測、Ahrefs Brand Radarの代替・検証、提案資料に載せる実データが要るときに使う。無料・ログイン不要。", "mine": true, "blocked": 0}, {"id": "lp-benchmark", "name": "lp-benchmark", "desc": "LPの雰囲気を決める。「どんな感じにする？」「雰囲気を選びたい」「テイストを変えたい」「この感じで作って」と言われたら使う。既存LPのスクショを6つの雰囲気に振って、並べて選んでもらう。ゼロから画像生成してはいけない。", "mine": true, "blocked": 0}, {"id": "lp-check", "name": "lp-check", "desc": "LPの検査項目を精査・追加・変更する。「チェック項目を見直したい」「項目を足したい」「この指摘を次から機械で見たい」「誤検出が出る」「他のエンジニアに渡したい」と言われたら使う。品質チェック23項目と決めごと6件の実体・判定の在り処・増やし方・検証のやり方・過去に踏んだ罠が入っている。LPを実際に検査するのは `check.py`、こちらはその検査自体を直す側。", "mine": true, "blocked": 0}, {"id": "lp-polish", "name": "lp-polish", "desc": "組み終わったLPを仕上げる。「ここ変じゃない？」「もっとメリハリ」「スマホで崩れてる」「背景に動きを入れて」「色がマッチしてない」「表が読みにくい」といったクライアント指摘に、目分量でなく実測で答えるための手順と道具。配色のメリハリ設計・保護色（アクセント）の作り方と置き場所・SVG背景の常時アニメーション・図解の連結線・日本語LPのレスポンシブ・検証の罠が入っている。画像からの起こしは lp-repro、こちらはその後の工程。", "mine": true, "blocked": 0}, {"id": "lp-proposal", "name": "lp-proposal", "desc": "LP改修提案の進行役。問い合わせを受けてから、初回ミーティング資料7枚とLP構成案までを1フェーズずつ導く。「LP改修の提案を作りたい」「問い合わせが来た」「初回ミーティングの資料」「この会社を調べて提案して」と言われたら使う。フェーズを飛ばさない・原文にない制作意図を創作しない・こちらの営業行為を先方の実態として書かないための手順。", "mine": true, "blocked": 0}, {"id": "lp-repro", "name": "lp-repro", "desc": "デザイン画像（ChatGPT等で作ったモック・スクショ・カンプ）を、目分量ではなく実測でHTML/CSSに起こす。「この画像をコードにして」「再現して」「LPに組んで」「この通りに作って」と言われたら使う。文字位置±2px・背景の階調±3/255まで詰めるための測定スクリプトと手順が入っている。", "mine": true, "blocked": 0}, {"id": "lp-version", "name": "lp-version", "desc": "LPのリンクを作る・クライアントに渡した記録を残す・FBを残す・直す。「LPをデプロイして」「別リンクで見せて」「クライアントに送った」「FBが来た」「これを直して」と言われたら必ず使う。フォルダを cp -r で作ってはいけない。渡したリンクはそこで凍り、以降の直しは自動で新しいリンクへ逃げる。", "mine": true, "blocked": 0}, {"id": "slides", "name": "slides", "desc": "Create strategic HTML presentations with Chart.js, design tokens, responsive layouts, copywriting formulas, and contextual slide strategies.", "mine": false, "blocked": 0}, {"id": "ui-styling", "name": "ui-styling", "desc": "Create beautiful, accessible user interfaces with shadcn/ui components (built on Radix UI + Tailwind), Tailwind CSS utility-first styling, and canvas-based visual designs. Use when building user interfaces, implementing design systems, creating responsive layouts, adding accessible components (dialogs, dropdowns, forms, tables), customizing themes and colors, implementing dark mode, generating visual designs and posters, or establishing consistent styling patterns across applications.", "mine": false, "blocked": 0}, {"id": "ui-ux-pro-max", "name": "ui-ux-pro-max", "desc": "UI/UX design intelligence for web and mobile. Searchable local database with 84 styles, 192 color palettes, 74 font pairings, 192 product types, 98 UX guidelines, 104 icon entries, 16 GSAP motion presets, and 25 chart types across 22 stacks (React, Next.js, Vue, Nuxt, Svelte, Astro, SwiftUI, React Native, Flutter, Tailwind, shadcn/ui, Jetpack Compose, Angular, Laravel, JavaFX, WPF, WinUI, Avalonia, Uno Platform, UWP, Three.js, and HTML/CSS). Use when designing, building, or reviewing UI: pages, components, color schemes, typography, layout, accessibility, animation, or data visualization.", "mine": false, "blocked": 0}], "bundle": {"path": "skills/lp-skills.zip", "n": 8, "kb": 102, "ids": ["brief", "llmo-measure", "lp-benchmark", "lp-check", "lp-polish", "lp-proposal", "lp-repro", "lp-version"]}, "moods": {"updated": "2026-09-15", "local": {"root": "~/lp-moods/", "serve": "cd ~/lp-moods && python3 -m http.server 8796", "index": "http://localhost:8796/"}, "rules": ["色は雰囲気で変えない。ブランドカラーは案件の資産。差は 書体・級数・余白・角丸・桁 で出す。", "級数を変えたら桁（--fv-col-l/r）も動かす。12 × h1 < 0.913L + 140.9 を満たさないと見出しが折れる。", "書体はコードで振る。画像生成は日本語が化けるので書体の判断に使えない。", "書体は型ごとに必ず変える。2型ずつ同じ書体にすると『どれも似ている』になる。", "テンプレを選ぶ基準は「FVで何をさせたいか」。資料を見せて納得させたいならA型、いきなり問い合わせを取りたいならB型。"], "gaps": ["レイアウト（骨格）はA型の6雰囲気とも同じ。骨格まで変えるなら1型ずつ手で書き直す。", "2026-09-09に「B型は5節・画像2枚」と書いたのは誤り。29コミット古い版を土台にしていた。正しくは15節・15枚。", "C型で新しく作ったのは3節だけ（期限つきオファーの帯・講師紹介・受講者の声）。残り9節はA型の部品をそのまま使っている。骨格の違いは「順番」と「CTAの回数」", "D型は新しい部品ゼロで組めた（blue10 が <dl> なので実施概要に流用でき、blue11 にフォームがある）。実測の実物は英検プレテストLPで const SCRIPTS={"eslclub-kids": {"v1": "# ESL club オンライン校 小学生向けLP 原稿 v1\n受領: 2026-09-09 ／ 反映先: esl15\n\n## FV\nバイリンガル講師のマンツーマンレッスンでオンラインでも集中が続く\n\"小学生で英検2級\"を目指せる英語塾\n\n## CTA（1回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子様のレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 短期で英検合格を目指せる4つの特徴\n- POINT1　学習効率を向上｜バイリンガル講師のマンツーマンレッスン\n- POINT2　保護者様が忙しくても安心｜計画の実行をフォローするスクールマネージャー\n- POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\n- POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n\n## POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\nESL clubでは、英検1級・TOEFL iBT95点・TOEIC900点レベル以上のバイリンガル講師のみを採用しています。1対1のため、お子様が画面の前で手を止めたり、表情が曇ったりすれば、すぐに声をかけられます。分からないところは日本語に切り替えて説明するので、低学年のお子様でも分からないまま時間だけが過ぎることがありません。年齢の近い講師との距離の近さも、英語を好きなまま続ける支えになります。\n見出し：実際のレッスンの様子をご覧ください\n（画像：YouTube動画サムネイル　小3男子　初学者　ハシモトカズマくん）\n（画像：YouTube動画サムネイル　小4女子　学習経験者　オオツカキサちゃん）\n\n## POINT2　保護者様が忙しくても安心｜計画の実行をフォローするスクールマネージャー\nスクールマネージャーが中心となり、学習計画どおりにレッスンが進むよう講師へ内容を伝達し、生徒様の進捗をレッスンごとに保護者様へ共有します。保護者様が学習内容を把握したり、レッスンに付き添っていただく必要はありません。お忙しいご家庭でも安心してお任せいただけます。\n\n## POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\nESL clubでは2015年の開塾以降、英検をカリキュラムに用いて、着実な英語力の向上と英検合格に導いてきました。国際基準であるCEFRに対応した英検を用いることで、バランスよく4技能＋語彙力を高めていきます。一般的には、英検2級が高校卒業時の到達目標とされていますが、ESL clubでは、小学生、中学生の時点での高い合格率を誇っています。\n（表：ESL clubの小中学生の英検合格率）5級100%、4級88%、3級86%、準2級64%、2級75%\n注記：2023年度第2回の実績（ESL clubオンライン校）／受験者のうち1次・2次受験双方に合格した生徒の割合\n\n## POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n目標とする級と時期、現在の英語レベル、学習に充てられる時間の4点から逆算して個別の学習計画を作成し、確保できる学習時間に合わせてレッスンの進め方と宿題量を設計します。学習時間そのものを増やすのではなく、限られた時間の使い方を組み立て直すため、他の習い事で忙しいお子様でも無理なく進められます。将来中学受験をお考えのご家庭でも、低学年のうちに英語を進めておくことで、高学年になったときに他の教科へ時間を回しやすくなります。\n\n## CTA（2回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子様のレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## CTA（3回目・4回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：いつまでに2級合格できるかレッスン後にご案内します\n\n## 以降\n現状のLP（/online-c）と同様：キャンペーンバナー／スクールマネジャー紹介／講師紹介／保護者さまの声／中学受験合格実績／他の英語スクールとの違い／教室紹介／フッター\n", "v2": "# ESL club オンライン校 小学生向けLP 原稿 v2\n受領: 2026-09-10（梶さんFB反映） ／ 反映先: esl17\n\n## FV\nバイリンガル講師のマンツーマンレッスンでオンラインでも集中が続く\n\"小学生で英検2級\"を目指せる英語塾\n\n## CTA（1回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 短期で英検合格を目指せる4つの特徴\n- POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\n- POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\n- POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\n- POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n\n## POINT1　オンラインでも集中が続く｜バイリンガル講師のマンツーマンレッスン\nESL clubでは、英検1級・TOEFL iBT95点・TOEIC900点レベル以上のバイリンガル講師のみを採用しています。1対1のため、お子さまが画面の前で手を止めたり、表情が曇ったりすれば、すぐに声をかけられます。分からないところは日本語に切り替えて説明するので、低学年のお子さまでも分からないまま時間だけが過ぎることがありません。年齢の近い講師との距離の近さも、英語を好きなまま続ける支えになります。\n見出し：実際のレッスンの様子をご覧ください\n（画像：YouTube動画サムネイル　小3男子　初学者　ハシモトカズマくん）\n（画像：YouTube動画サムネイル　小4女子　学習経験者　オオツカキサちゃん）\n\n## POINT2　保護者さまが忙しくても安心｜計画の実行をフォローするスクールマネージャー\nスクールマネージャーが中心となり、学習計画どおりにレッスンが進むよう講師へ内容を伝達し、生徒さまの進捗をレッスンごとに保護者さまへ共有します。レッスン後、保護者さまへフィードバックを行うので、レッスンに付き添わなくとも、お子さまの英語力の伸びを安心して見守っていただけます。\n\n## POINT3　高い英検合格率を実現｜累計1,000名以上を合格に導いた英検ベースのカリキュラム\nESL clubでは2015年の開塾以降、英検をカリキュラムに用いて、着実な英語力の向上と英検合格に導いてきました。国際基準であるCEFRに対応した英検を用いることで、バランスよく4技能＋語彙力を高めていきます。一般的には、英検2級が高校卒業時の到達目標とされていますが、ESL clubでは、小学生、中学生の時点での高い合格率を誇っています。\n（表：ESL clubの小中学生の英検合格率）5級100%、4級88%、3級86%、準2級64%、2級75%\n注記：2023年度第2回の実績（ESL clubオンライン校）／受験者のうち1次・2次受験双方に合格した生徒の割合\n\n## POINT4　習い事と両立できる｜生活スケジュールに合わせた学習計画\n目標とする級と時期、現在の英語レベル、学習に充てられる時間の4点から逆算して個別の学習計画を作成し、確保できる学習時間に合わせてレッスンの進め方と宿題量を設計します。学習時間そのものを増やすのではなく、限られた時間の使い方を組み立て直すため、他の習い事で忙しいお子さまでも無理なく進められます。将来中学受験をお考えのご家庭でも、低学年のうちに英語を進めておくことで、高学年になったときに他の教科へ時間を回しやすくなります。\n\n## CTA（2回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## CTA（3回目・4回目）\n- ボタン：無料体験レッスンはこちら\n- 補助コピー：お子さまのレッスンでの様子と現レベルから、学習の進め方をご案内します\n\n## 以降\n現状のLP（/online-c）と同様：キャンペーンバナー／スクールマネジャー紹介／講師紹介／保護者さまの声／中学受験合格実績／他の英語スクールとの違い／教室紹介／フッター\n\n## v1 からの変更（梶さんFB 2026-09-10）\n- 4つの特徴の一覧：POINT1 を「学習効率を向上」→「オンラインでも集中が続く」（詳細と不一致だった）\n- POINT2 本文を差し替え\n- POINT3 の注記を一段小さく（デザイン指示）\n- 比較表の ESL club ロゴを大きく（デザイン指示）\n- 表記を「お子さま／保護者さま／生徒さま」に統一\n- CTA補助コピーは4回とも同じ文言に（施主判断。原稿の3・4回目とは異なる）\n- ※要確認：ハシモトカズマくんの動画が「ログインしてください」になる（YouTube側の公開設定）\n"}, "suzuki-ark": {"v1": "# ARK Hills Music Week 2026｜音の遊び場 ── LP原稿 v1\n\n## １．ファーストビュー\n- 上部タグ：ARK Hills Music Week 2026｜音の遊び場\n- メインコピー：カラヤン広場ではじめての楽器に出会う2日間\n- サブコピー：スズキ・メソードの指導者・卒業生・子どもたちがカラヤン広場に敷かれた芝生の上で演奏します。演奏の後はヴァイオリン・チェロ・フルート・ピアノに触れられます。\n- イベント概要：10月10日（土）・11日（日）／アークヒルズ　アーク・カラヤン広場\n- 条件ブロック（アイコン付きで横並び。コピーより先に目に入る位置）\n  - 入場無料・事前予約不要・参加費不要\n  - 出入り自由\n  - 3歳から体験いただけます\n- CTA：会場へのアクセス（主CTA・ページ内アクセスへ）／演奏スケジュールを見る（ページ内リンク）\n\n## ２．3つの安心\n見出し：思い立ったらお立ち寄りいただけます\n1. 予約・申込不要　当日広場に来ていただくだけです。参加費もかかりません。\n2. 途中入場も途中退出も自由　演奏の途中でも体験の途中でもご自由に出入りいただけます。お子さまの機嫌に合わせて15分だけでも大丈夫です。\n3. 走っても大丈夫な芝生の広場　静かに座って聴く場所ではありません。屋根のある広場に芝生が敷かれますので、赤ちゃん連れでも動き回る年齢でもお楽しみいただけます。\n\n## ３．演奏会\n- 見出し：広場の芝生の上で、すぐそばで音楽が生まれる30分\n- リード：ステージと客席を区切らず、奏者が広場の中に散らばってみなさんと同じ場所から演奏します。\n\n| 日時 | プログラム名 | 内容 |\n| --- | --- | --- |\n| 10月10日（土）11:15－11:45 | スズキチルドレン アンサンブル | ヴァイオリン・チェロ・フルート・ピアノを学ぶ子どもたちによるアンサンブル演奏 |\n| 10月11日（日）11:00－11:30 | スズキ・メソードコンサート | 弦楽器とフルートによるアンサンブル・コンサート |\n\n- 出演：幼児から大人までスズキ・メソードで学ぶ生徒・卒業生・指導者約100名\n- 曲目：スズキ・メソードで最初に学ぶ曲を中心に6曲から7曲を予定しています。フィナーレは子どもたちが一番はじめに学ぶキラキラ星変奏曲。小さな子どもから大人までが同じ曲を一緒に弾きます。\n- 保護者の方へ：こんなに小さな子どもたちが弾いている。子どもと大人が一緒に演奏している。音楽はこんなに身近なんだと感じていただける演奏です。\n\n## ４．ブース\n- 見出し：演奏のあとはそのまま楽器体験へ\n- リード：聴くだけではありません。芝生の上のテーブルとブースで楽器に触れて、メニューから1曲えらんで、写真を持ち帰れます。\n\n### 4-1．楽器体験\n- 小見出し：楽器に触ったことがないお子さまでも楽器を体験できます\n- 本文：ヴァイオリン・チェロ・フルート・ピアノ。興味のある楽器を実際に構えて鳴らしてみてください。複数の楽器を試すこともできます。指導者が横につきますので楽器を触ったことがなくても大丈夫です。\n- ※ヴァイオリン・チェロ・フルートは芝生の上のテーブルで、ピアノはブース内で体験できます。ピアノは電子ピアノでの体験となります。\n\n### 4-2．音楽レストラン\n- 小見出し：メニューから1曲えらんで注文すると目の前で演奏します\n- コンセプト：音楽を鑑賞するものから、子どもが自分で選び注文し受け取るものへ。ブースの一角を小さなレストランに見立ててメニューボードと食券受付を設置します。演奏者はシェフとして白いエプロンで来場者を迎えます。メニューの8曲から子どもが自分で選び、音楽家とやり取りし、生の音を受け取る体験です。\n- 流れ：缶バッジをつくる → できあがったら食券をもらう → メニューの8曲から聴きたい曲を1曲えらぶ → シェフ役の先生に食券を渡して注文する → 目の前で2人の先生が生演奏\n- メニュー（8曲）：タカタカタッタのキラキラ星／クリスマスの歌／ちょうちょう／かすみか雲か／こぎつね／ロング・ロング・アゴー／むすんでひらいて／アレグロ\n  - いずれもスズキ・メソードの子どもたちが実際に最初に学んでいる曲です。\n- 演奏編成：ヴァイオリン＋ヴァイオリン／ヴァイオリン＋ピアノ／ヴァイオリン＋フルート／ヴァイオリン＋チェロ。同じ曲でも組み合わせで響きが変わりますので2回目のご注文も可能です。\n- シェフのひとこと：演奏者がスズキのロゴの缶バッジをつけた白いエプロンを着用し、シェフとしてお迎えします\n  - セリフ例：いらっしゃい   // 絶対URLにすると、手元で開いた時にサムネイルが出ない。
  const url = kind==='vid'
    ? id=>{const v=ALL[id];return (v&&v.url)||'../video/'+id+'/';}
    : id=>{const v=ALL[id];return (v&&v.url)||reg.base_url+id+'/';};
  return {kind,reg,ALL,OWNER,url};
}

function exists(id){

const MOOD_IDS = (function(){
  if(!MOODS) return [];

    (t.moods||[]).forEach(function(m){ o.push(t.key+'/'+m.id); });

function readHash(){
  const h=decodeURIComponent((location.hash||'').replace(/^#/,''));
  if(!h) return false;
  // 🚨 雰囲気テンプレのタブは「a/03_seijitsu」とスラッシュを含む。
  //    lastIndexOf('/') で切ると型が id 側に食われるので、先に __moods__ を見る。
  let id, tb;
  if(h==='__moods__' || h.indexOf('__moods__/')===0){
    id='__moods__'; tb=h.slice('__moods__/'.length);
  }else{
    const i=h.lastIndexOf('/');
    id=i<0?h:h.slice(0,i); tb=i<0?'':h.slice(i+1);
  }
  if(!exists(id)) return false;
  cur=id;
  // タブは「その画面に在るもの」だけ。無ければ既定に落とす
  // 🚨 雰囲気テンプレは「雰囲気id」をタブとして持つ。案件のタブ集合とは別なので先に分ける
  if(id==='__moods__'){ tab = MOOD_IDS.includes(tb) ? tb : MOOD_IDS[0]; return true; }
  const okTabs = (id==='__flow__') ? [] : (id.slice(0,4)==='vid:'?TABS.filter(x=>x!=='check'):TABS.filter(x=>x!=='sheet'));
  tab = okTabs.includes(tb) ? tb : (id.slice(0,4)==='vid:'?'sheet':'graph');
  return true;
}
function writeHash(){
  const h = (cur==='__flow__') ? cur : cur+'/'+tab;

function skillTag(id){

  return `<span class="sk have">${esc(id)}</span>`;

/* 派生図と同じ描き方でフローを描く。
   ★節は【番号と工程名だけ】。何をやるかも事故も、押すまで出さない。
     16工程ぶんの説明を最初から並べると読む気が失せる（前の版で却下された）。
   ★列＝大きな塊（提案／制作／公開・管理）。線は SVG のベジェで引く。 */
const FN={}; STEPS.forEach(s=>FN[s.n]=s);
const FW=252, FGX=76, FRH=58, FTOP=58;   // FTOP は見出し2行ぶん   // 節の幅 / 列間 / 段の高さ / 見出しの分の余白

function flowPane(){
  if(!STEPS.length)return '<p style="color:var(--mute)">lp-flow.json がありません。</p>';
  const GR=(DATA.flow.groups||[{id:null,name:''}]);
  const pos={};
  let nodes='', heads='', maxR=0;
  GR.forEach((g,c)=>{
    const st=STEPS.filter(s=>s.group===g.id);
    if(!st.length)return;
    // ★どのスキルがこの塊を受け持つかを見出しに出す。
    //   工程ごとのバッジだけだと「この塊は誰の担当か」が読み取れない。
    const sk=[]; st.forEach(s=>{ if(!sk.includes(s.skill)) sk.push(s.skill); });
    const chips=sk.map(id=>id
      ? `<span class="sk ${SK[id]?'have':'miss'}">${esc(id)}${SK[id]?'':'／未作成'}</span>`
      : '<span class="sk none">型なし</span>').join('');
    heads+=`<div class="fgl" style="left:${c*(FW+FGX)}px">
      <div class="fgt">${esc(g.name)}<span>${st.length}工程</span></div>
      <div class="fgs">${chips}</div></div>`;
    st.forEach((s,r)=>{
      pos[s.n]=[c,r]; maxR=Math.max(maxR,r);
      const st8=s.skill?(SK[s.skill]?'ok':'miss'):'none';
      nodes+=`<div class="fnode ${st8}${s.loop?' isloop':''}" id="f-${s.n}" data-step="${s.n}"
        style="left:${c*(FW+FGX)}px;top:${FTOP+r*FRH}px">
        <span class="fno">${s.n}</span><span class="fnm">${esc(s.name)}</span></div>`;
    });
  });
  FLOWPOS=pos;
  const g=STEPS.filter(s=>s.gap).length;
  const have=STEPS.filter(s=>s.skill&&SK[s.skill]).length;
  const W=GR.length*(FW+FGX)-FGX, H=FTOP+(maxR+1)*FRH;
  return `<div class="fbar">
      <span>全${STEPS.length}工程 ／ スキルで型になっているのは ${have}
      ${g?`／ <b style="color:var(--bad)">型が無い工程 ${g}</b>`:''}</span>
      <span class="fleg"><i class="ok"></i>スキルあり<i class="miss"></i>未作成<i class="none"></i>型なし</span>
    </div>
    <div class="fgraph"><svg class="fsvg"></svg>
      <div class="fcanvas" style="width:${W}px;height:${H}px">${heads}${nodes}</div></div>
    <div class="fdp" id="fdp"><p class="fdph">工程を押すと、何をやるか・出るもの・過去にそこで何をやらかしたかが出ます。</p></div>
    <div class="ghd" style="margin-top:26px"><h3>スキル一覧</h3>
      <span>~/.claude/skills/ の中身。展開先も同じ場所</span>
      <span class="ghdb">${dlAll()}</span></div>
    ${skillTable()}`;
}

let FLOWPOS={};
function drawFlow(){
  const wrap=document.querySelector('.fgraph'); if(!wrap)return;
  const svg=wrap.querySelector('.fsvg'), R=wrap.getBoundingClientRect();
  svg.setAttribute('width',wrap.scrollWidth); svg.setAttribute('height',wrap.scrollHeight);
  let d='<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">'
       +'<path d="M0 0 L7 3.5 L0 7 z" fill="#cbd5e1"/></marker></defs>';
  for(let i=0;i<STEPS.length-1;i++){
    const a=document.getElementById('f-'+STEPS[i].n), b=document.getElementById('f-'+STEPS[i+1].n);
    if(!a||!b)continue;
    const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
    const L=x=>x-R.left+wrap.scrollLeft, T=y=>y-R.top+wrap.scrollTop;
    const same=FLOWPOS[STEPS[i].n][0]===FLOWPOS[STEPS[i+1].n][0];
    let p;
    if(same){   // 同じ塊の中は真下へ
      const x=L(ra.left+ra.width/2);
      p=`M${x} ${T(ra.bottom)} L${x} ${T(rb.top)-3}`;
    }else{      // 塊をまたぐ時は右へ回す
      const x1=L(ra.right), y1=T(ra.top+ra.height/2);
      const x2=L(rb.left)-3, y2=T(rb.top+rb.height/2), mx=(x1+x2)/2;
      p=`M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`;
    }
    d+=`<path d="${p}" fill="none" stroke="#cbd5e1" stroke-width="2" marker-end="url(#ah)"/>`;
  }
  // ── 戻り線（ループ）。左側へ大きく回して、行きの線と重ならないようにする
  d+='<defs><marker id="ah2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">'
    +'<path d="M0 0 L7 3.5 L0 7 z" fill="#e07a2f"/></marker></defs>';
  LOOPS.forEach(function(lp){
    const a=document.getElementById('f-'+lp.from), b=document.getElementById('f-'+lp.to);
    if(!a||!b) return;
    const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
    const L=x=>x-R.left+wrap.scrollLeft, T=y=>y-R.top+wrap.scrollTop;
    const x1=L(ra.left), y1=T(ra.top+ra.height/2);
    const x2=L(rb.left)-3, y2=T(rb.top+rb.height/2);
    const bend=Math.min(x1,x2)-34;          // 左の外側に回す
    const p=`M${x1} ${y1} C${bend} ${y1} ${bend} ${y2} ${x2} ${y2}`;
    d+=`<path d="${p}" fill="none" stroke="#e07a2f" stroke-width="2" stroke-dasharray="5 4"
         marker-end="url(#ah2)"/>`;
    d+=`<text x="${bend-4}" y="${(y1+y2)/2}" fill="#e07a2f" font-size="11" font-weight="700"
         text-anchor="end">${esc(lp.label||'')}</text>`;
  });
  svg.innerHTML=d;
}

function skillTable(){

  const rows=list.map(s=>{

    return `<tr>

      <td>${at.length?at.map(x=>esc(x.n+'. '+x.name)).join('<br>')
                     :'<span style="color:#9ca3af">フロー未接続</span>'}</td></tr>`}).join('');
  const gaps=STEPS.filter(s=>!s.skill&&s.gap);
  const bl=list.filter(s=>s.mine&&s.blocked).map(s=>s.id);
  return `<table><thead><tr><th>スキル</th><th>種別</th><th>説明</th>
      <th>フローのどこで動くか</th></tr></thead><tbody>${miss}${rows}</tbody></table>
    <p class="note" style="margin-top:8px">zip は <code>~/.claude/skills/</code> に展開すれば使える。
      ${bl.length?`<b style="color:var(--bad)">${bl.map(esc).join(' / ')} は案件名を含むため束に入れていない。</b>`:''}</p>
    ${gaps.length?`<div class="todo" style="margin-top:16px"><h3>スキルにすべき工程 ${gaps.length}件</h3><ul>${
      gaps.map(s=>`<li><b>${s.n}. ${esc(s.name)}</b> … ${esc(s.gap)}</li>`).join('')}</ul></div>`:''}`;
}

/* ── 構成シート ──────────────────────────────────────────────
   横軸＝Hook / Body1 / Body2 / CTA ＋ ロゴ ＋ アバター（2カメ）
   縦軸＝版。大元のテンプレを一番上に置いて、その下に各本を並べる。
   ★1枠に「文面・字数・使った画像・ショットの並び」を全部入れる。
     文面だけの表にすると、結局どの画像とどのアングルを当てたかを動画で確認しに戻ることになる。 */
const SECS=[['hook','Hook','つかみ'],['body1','Body1','何が分かるか'],
            ['body2','Body2','どう使えるか'],['cta','CTA','行動']];

/* 素材の落とし口。サムネの角に小さく ⇩ を出す。
   ★サムネ自体をリンクにしない。押すつもりが無いのに数MB落ちるのは事故。 */
const mbs2=b=>(b>=1e6?(b/1e6).toFixed(1)+'MB':Math.round(b/1e3)+'KB');
function dl(v,role){
  const f=v.comp&&v.comp.files&&v.comp.files[role];
  if(!f)return '';
  const t=esc(f.label)+'　'+mbs2(f.bytes)+(f.compressed?'（圧縮版）':'');
  return `<a class="dl" download href="../video/${esc(v.id)}/files/${esc(f.name)}"
     title="${t}">⇩ ${mbs2(f.bytes)}</a>`;
}

function secCell(v,s){
  if(!s)return '<td class="sec"><span style="color:#9ca3af">—</span></td>';
  if(s.rule)return `<td class="sec"><div class="rule">${esc(s.rule)}</div>
    <div class="tx" style="color:var(--mute);margin-top:6px">${esc(s.text||'')}</div></td>`;
  const planned=v.comp&&v.comp.planned;      // まだ作っていない＝素材が決まっていない
  const img=s.image
    ? `<div class="thw"><img class="th" src="../video/${esc(v.id)}/parts/${esc(s.thumb||s.image)}"
         alt="" loading="lazy">${dl(v,s.key)}</div>`
    : `<div class="noimg">${planned?'素材未定':'画像なし（アバターのみ）'}</div>`;
  const chain=(s.shots||[]).map(x=>x.kind==='image'
    ? `<span class="sh img">${esc(x.file)} ${x.dur}s</span>`
    : `<span class="sh">${esc(x.label)} ${x.dur}s</span>`).join('');
  return `<td class="sec">${img}
    <div class="tx">${esc(s.text||'')}</div>

    <div class="sheetwrap"><table class="sheet"><thead><tr>

      <th class="sm">ロゴ</th><th class="av">アバター（2カメ）</th>

/* ★用語は説明を画面に置く。頭の中にしか無い言葉は、3日で意味が分からなくなる。 */
function glossary(kind){
  const G=[
   ['未公開','まだリンクを作っていない。作りかけ'],
   ['自分の確認用','リンクはあるが、まだクライアントには渡していない。ここは何度でも直してよい'],
   ['クライアントに提示','渡した。<b>このリンクはここで凍る</b>。以降の直しは自動で新しいリンクへ逃がす'],
   ['派生元','そのリンクを作るとき、どのリンクをコピーして始めたか。ここが抜けると系統が追えなくなる'],
  ];
  if(kind==='vid')G.push(['原本','ここにあるのは web用に圧縮したもの（CRF26）。'
    +'原本と編集データは <code>~/video-edit-tool/projects/</code> が正']);
  else G.push(['更新','<b>同じリンクのまま</b>中身を直した回数。提示前のリンクだけ増える']);
  return `<details class="glo"><summary>用語の意味</summary><dl>${
    G.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></details>`;
}

function graphPane(p,R){
  if(!p.versions.length)return '<p style="color:var(--mute)">まだ版がありません。</p>';
  const NW=212, GX=64, RH=116;              // 節の幅 / 横の間隔 / 1段の高さ
  const by={}; p.versions.forEach(v=>by[v.id]=v);
  // 親が別プロジェクトにいる場合（例：小学生向けの親はオンライン校の版）は根として扱う
  const par=v=>(v.parent&&by[v.parent])||null;

  // 横位置＝世代
  // ★循環（a→b→a）を踏むと無限再帰でページごと固まる。必ず seen で止める。
  const depth={};
  const d=(v,seen)=>{
    if(depth[v.id]!=null)return depth[v.id];
    seen=seen||{};
    if(seen[v.id])throw new Error('派生元が循環しています：'+v.id);
    seen[v.id]=1;
    const pa=par(v); return depth[v.id]=pa?d(pa,seen)+1:0;};
  try{ p.versions.forEach(v=>d(v)); }
  catch(e){ return `<p style="color:var(--bad);font-weight:700">▲ ${esc(e.message)}<br>
    <span style="font-weight:400;font-size:12.5px">台帳の parent を直してください。</span></p>`; }

  const kids={};
  p.versions.forEach(v=>{const pa=par(v); if(pa)(kids[pa.id]=kids[pa.id]||[]).push(v);});

  // ★縦位置：葉を上から1段ずつ積み、親は【最初の子と同じ高さ】に置く。
  //   ・世代ごとに列の頭から詰めると、子が必ず親より上に来る（前の実装の不具合）
  //   ・子の"中央"に置くのも駄目。枝分かれのたびに先頭の子が親より上に出る
  //   この置き方だと最初の系統が一番上を真横に走り、派生は必ず下へ垂れる。
  const row={}; let slot=0;
  const place=v=>{
    if(row[v.id]!=null)return row[v.id];
    const c=kids[v.id]||[];
    if(!c.length)return row[v.id]=slot++;
    return row[v.id]=c.map(place)[0];
  };
  p.versions.filter(v=>!par(v)).forEach(place);
  p.versions.forEach(place);                // 取りこぼし（循環など）の保険

  const maxD=Math.max(...p.versions.map(v=>depth[v.id]));
  const maxR=Math.max(...p.versions.map(v=>row[v.id]));
  const nodes=p.versions.map(v=>{const [lab,c,b]=S[v.status]||S.draft;
    // 親が別案件にいる版は、この図では根に見える。由来が消えるので明示する。
    const out=v.parent&&!by[v.parent]&&R.ALL[v.parent];
    const ext=out?`<div class="ext">← ${esc(R.OWNER[v.parent].name)} の ${esc(v.parent)} から</div>`:'';
    const m=v.media||{};
    const sub=R.kind==='vid'
      ? (m.duration?` · ${mmss(m.duration)}`:'')
      : ((v.updates||[]).length?` · <b>更新${v.updates.length}回</b>`:'');
    // ★チェックの状態を節に出す。○＝機械はすべて通過 ／ ⚠n＝指摘n件 ／ 無印＝未チェック
    const ck=CHECKS[v.id];
    let flag='';
    if(ck){
      const bad=ck.items.filter(i=>i.state==='ng').length;
      const memo=ck.items.filter(i=>['claude','human','warn'].includes(i.state)).length;
      flag=bad?`<span class="gck ng" title="要対応 ${bad}">✗${bad}</span>`
            :`<span class="gck ok" title="機械はすべて通過。見どころ ${memo}">○${memo?' '+memo:''}</span>`;
    }else{
      flag=`<span class="gck no" title="まだチェックしていない">−</span>`;
    }
    return `<div class="gnode${out?' hasext':''}" id="g-${v.id}" data-v="${v.id}" style="--c:${c};--b:${b};`
      +`left:${depth[v.id]*(NW+GX)}px;top:${(row[v.id]*RH).toFixed(1)}px">
      <div class="t">${linkCell(v,R)}${flag}</div>
      <div class="d">${esc(v.date)} · ${lab}${sub}</div>
      ${ext}<div class="w">${esc(v.what)}</div></div>`}).join('');
  // 世代が深いと画面に入り切らない。畳むと系統が読めなくなるので幅は変えず、断り書きだけ出す
  const hint=maxD>=5?`<p class="note" style="margin-bottom:8px">
    ${maxD+1}世代あります。図は右に続くので横にスクロールしてください。</p>`:'';
  return `${hint}<div class="graph"><svg class="gsvg"></svg>
    <div class="gcanvas" style="width:${(maxD+1)*(NW+GX)-GX}px;height:${maxR*RH+108}px">${nodes}</div></div>`;
}


// ── 版の詳細（派生図の節を押すと右から出る） ──────────────
// 見るのは2つだけ：この版の【原稿】と、【直した方がよさそうな箇所】。
// 直すかどうかは So が決める。ここは指摘を並べるだけで、勝手に直さない。
function detailPane(vid){
  const own=Object.values(LP.OWNER||{}).length?LP.OWNER[vid]:null;
  const p=own||DATA.projects.find(x=>x.versions.some(v=>v.id===vid));
  const v=p&&p.versions.find(x=>x.id===vid);
  if(!v) return '';
  const ck=CHECKS[vid];
  const sc=(SCRIPTS[p.id]||{});
  // 原稿は「この版に記録されたもの」。無ければ派生元をたどる（最新を当てにいかない）
  let sv=null,cv=v,seen={};
  while(cv&&!seen[cv.id]){ if(cv.script){sv=cv.script;break;} seen[cv.id]=1;
    cv=p.versions.find(x=>x.id===cv.parent); }
  const body=sc[sv]||'';

  let notes='';
  if(!ck){
    notes=`<p class="dt__none">まだチェックしていない。<br>
      <code>python3 check.py docs/${vid}/index.html</code></p>`;
  }else{
    const ng=ck.items.filter(i=>i.state==='ng');
    const mind=ck.items.filter(i=>['claude','human','warn'].includes(i.state));
    // ★「どこ・何が・どう直すか」を出す。項目名だけだと何をすればいいか分からない。
    const li=(i,m,cls)=>`<li class="${cls}"><span>${m}</span>
      <b>${esc(i.name)}</b><i>${esc(i.where?i.where+' — ':'')}${esc(i.what||i.msg||'')}</i>
      ${i.how?`<u>→ ${esc(i.how)}</u>`:''}</li>`;
    notes=`${ng.length?`<div class="dt__cap ng">直した方がよい（${ng.length}）・直すかはあなたが決める</div>
        <ul class="dt__l">${ng.map(i=>li(i,'✗','ng')).join('')}</ul>`:''}
      ${mind.length?`<div class="dt__cap">あなたが見る・公開前に確かめる（${mind.length}）</div>
        <ul class="dt__l">${mind.map(i=>li(i,i.state==='human'?'□':i.state==='warn'?'△':'◇',i.state)).join('')}</ul>`:''}
      <details class="dt__f"><summary>通過した ${ck.items.filter(i=>i.state==='ok').length} 項目</summary>
        <ul class="dt__l">${ck.items.filter(i=>i.state==='ok').map(i=>li(i,'○','ok')).join('')}</ul></details>
      <p class="dt__at">最後にチェックしたのは ${esc(ck.at)}</p>`;
  }
  return `<aside class="dt" id="dt">
    <div class="dt__h"><b>${esc(vid)}</b>
      <span class="dt__w">${esc(v.what||'')}</span>
      <a class="dt__go" href="./review.html?v=${vid}" target="_blank">レビューを開く ↗</a>
      <button class="dt__x" data-close>✕</button></div>
    <div class="dt__b">
      <div class="dt__sec">${notes}</div>
      <div class="dt__sec">
        <div class="dt__cap">原稿 ${sv?esc(sv):'（未登録）'}</div>
        ${body?`<pre class="dt__md">${esc(body)}</pre>`
              :`<p class="dt__none">原稿がまだ無い。<br><code>lpv.py script ${p.id} --new</code></p>`}
      </div>
    </div></aside>`;
}

function drawLines(p){
  const wrap=document.querySelector('.graph'); if(!wrap)return;
  const svg=wrap.querySelector('.gsvg'); const R=wrap.getBoundingClientRect();
  svg.setAttribute('width',wrap.scrollWidth); svg.setAttribute('height',wrap.scrollHeight);
  let d='';
  p.versions.forEach(v=>{
    if(!v.parent)return;
    const a=document.getElementById('g-'+v.parent), b=document.getElementById('g-'+v.id);
    if(!a||!b)return;
    const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
    const x1=ra.right-R.left+wrap.scrollLeft, y1=ra.top-R.top+ra.height/2+wrap.scrollTop;
    const x2=rb.left-R.left+wrap.scrollLeft,  y2=rb.top-R.top+rb.height/2+wrap.scrollTop;
    const mx=(x1+x2)/2;
    d+=`<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"
         fill="none" stroke="#cbd5e1" stroke-width="2"/>`;
  });
  svg.innerHTML=d;
}


// ── チェック ─────────────────────────────────────────
// check.py が各版に残した _check.json を読む。
// 機械が判定したものは色で、人が見るものは□で出す。項目の定義は checklist.json。
function checkPane(p){
  const vs=p.versions.filter(v=>CHECKS[v.id]).map(v=>v.id).reverse();
  if(!vs.length) return `<p class="empty">まだチェックしていない。<br>
    <code>python3 check.py docs/&lt;版id&gt;/index.html</code> を通すとここに出る。</p>`;
  return vs.map(vid=>{
    const c=CHECKS[vid];
    const pick=s=>c.items.filter(i=>s.includes(i.state));
    const ng=pick(['ng']), you=pick(['human']), mine=pick(['claude']),
          ok=pick(['ok']), warn=pick(['warn']), todo=pick(['todo','skip','pending']);
    const row=(i,m)=>`<div class="ck__r"><span class="ck__m">${m}</span>
      <span class="ck__n">${esc(i.name)}</span><span class="ck__d">${esc(i.msg||'')}</span></div>`;
    const fold=(t,n,items,m)=>n?`<details class="ck__f"><summary>${t} <b>${n}</b> 項目</summary>
      ${items.map(i=>row(i,m)).join('')}</details>`:'';
    return `<div class="ck">
      <div class="ck__h"><b>${vid}</b>
        <span class="ck__sum ${ng.length?'ng':'ok'}">${ng.length?`要対応 ${ng.length}`:'機械はすべて通過'}</span>
        <span class="ck__at">${c.at}</span>
        <a class="ck__go" href="./review.html?v=${vid}" target="_blank">原稿と並べて見る ↗</a></div>

      ${ng.length?`<div class="ck__box ng"><div class="ck__cap">直してから出す</div>
        ${ng.map(i=>row(i,'✗')).join('')}</div>`:''}

      ${you.length?`<div class="ck__box you"><div class="ck__cap">あなたが見る</div>
        ${you.map(i=>row(i,'□')).join('')}</div>`:''}

      ${mine.length?`<div class="ck__box mine"><div class="ck__cap">私が画像を見て判断する</div>
        ${mine.map(i=>`<div class="ck__r"><span class="ck__m">◇</span>
          <span class="ck__n">${esc(i.name)}</span>
          <span class="ck__d">${esc(i.done||'まだ見ていない')}</span></div>`).join('')}</div>`:''}

      ${warn.map(i=>`<div class="ck__box warn">${row(i,'△')}</div>`).join('')}
      ${fold('機械が通した',ok.length,ok,'○')}
      ${fold('これから作る',todo.length,todo,'…')}
    </div>`;
  }).join('');
}

function fbPane(p){
  const all=[];
  p.versions.forEach(v=>(v.fb||[]).forEach(f=>all.push({...f,ver:v})));
  all.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(!all.length)return '<p style="color:var(--mute)">記録されたFBはありません。</p>';
  return all.map(f=>`<div class="fbrow"><div class="dt">${esc(f.date)}<br>
    <span style="font-size:11px">${esc(f.from||'')}</span></div>
    <div><div class="wh">${esc(f.what)}</div>
    <div class="to">→ ${esc(f.ver.id)} で対応</div>
    </div></div>`).join('');
}

function rules(kind){
  const cli=kind==='vid'?'vv.py':'lpv.py';
  const last=kind==='vid'
    ? 'ここにあるのは web用の圧縮版。<b>原本と編集データは ~/video-edit-tool/projects/ が正</b>'
    : '作業は git の docs/ 配下で行う。Desktopの複製フォルダを正にしない';
  return `<div class="rules" style="margin-top:16px"><b>運用ルール</b><ol>
      <li>FBが来たら<b>直す前に</b>台帳へ1行足す（<code>${cli} fb</code>）</li>
      <li><b>渡す前</b>のリンクは、同じリンクの中身を直して update に記録する</li>
      <li><b>渡した後</b>のリンクは直さない。update すると自動で新しいリンクが出る</li>
      <li>クライアントに渡したら <code>${cli} show &lt;id&gt;</code> を打つ。打った時点で凍る</li>
      <li>${last}</li>
      ${kind==='vid'?'<li>文面と画像を変えたら <code>vv.py compose &lt;id&gt; --project &lt;作業場&gt;</code> で構成を取り直す</li>':''}
    </ol></div>`;
}

function render(){
  writeHash();
  document.querySelector('.side').innerHTML=sidebar();
  // 「しくみ」の画面は案件に属さないので、先に分岐して描き切る
  if(cur==='__moods__'){
    // 🚨 例外で止めると main が空のまま＝「何も表示されない」。止まった理由を画面に出す
    try{ document.querySelector('.main').innerHTML = moodsPane(tab); }
    catch(e){ console.error(e);
      document.querySelector('.main').innerHTML =
        `<p class="note">雰囲気テンプレの画面を作れませんでした：${esc(e.message)}（lp-moods.json を確認）</p>`; }
    return;
  }
  if(cur==='__flow__'){
    document.querySelector('.main').innerHTML=`
      <div class="head"><h2>LP制作フローとスキル</h2>
        <span class="cl">問い合わせを受けてから、直して見せ続けるまで</span></div>
      <p class="note">各工程で動くスキルと、過去にそこで何をやらかしたかを1枚にしてある。
        定義は lp-flow.json、説明は各 SKILL.md の先頭から。
        案件の中身は載せない（このリポジトリは公開）。</p>
      <div class="pane">${flowPane()}</div>`;
    // 派生図と同じ理由で rAF に頼らない（背面タブだと発火しない）
    setTimeout(drawFlow,0);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(drawFlow);
    addEventListener('load',drawFlow,{once:true});
    return;
  }
  const R=RG(), p=R.reg.projects.find(x=>x.id===PID());
  if(!p){document.querySelector('.main').innerHTML=
    '<p class="note">案件が見つかりません。</p>';return;}
  const al=alerts(p);
  const todo=al.length?`<div class="todo"><h3>要対応 ${al.length}件</h3><ul>${
    al.map(v=>`<li><b>${esc(v.id)}</b> … ${esc(v.alert)}</li>`).join('')}</ul></div>`:'';
  const body = tab==='sheet'?sheetPane(p,R)
             : tab==='list' ?listPane(p,R)
             : tab==='graph'?graphPane(p,R)
             : tab==='check'?checkPane(p) : fbPane(p);
  // テンプレは「未制作の本数」に数えない。作る対象ではなく型なので
  const nd = p.versions.filter(v=>v.status==='draft'&&!(v.comp&&v.comp.template)).length;
  const nmade = p.versions.filter(v=>v.status!=='draft').length;
  const count = R.kind==='vid'
    ? `${nmade}本 / 計 ${mmss(vsec(p))}` + (nd?`　未制作 ${nd}`:'')
    : `リンク ${p.versions.length}本`;
  document.querySelector('.main').innerHTML=`
    <div class="head"><h2>${esc(p.name)}</h2>
      <span class="cl">${esc(p.client||'')}</span>
      <span class="mainlink">${count}</span>
      ${R.kind==='vid'?'':(()=>{
        // この案件のうち、最後にチェックした版を開く
        const cs=p.versions.filter(v=>CHECKS[v.id]);
        if(!cs.length) return '';
        cs.sort((a,b)=>String(CHECKS[b.id].at).localeCompare(String(CHECKS[a.id].at)));
        return `<a class="head__rv" href="./review.html?v=${cs[0].id}" target="_blank"
          >原稿とレビュー（${cs[0].id}）↗</a>`;})()}
    </div>
    <p class="note">${esc(p.note||'')}</p>
    ${todo}
    <div class="tabs">
      ${R.kind==='vid'?`<button data-t="sheet" class="${tab==='sheet'?'on':''}">構成</button>`:''}
      <button data-t="list" class="${tab==='list'?'on':''}">版一覧</button>
      <button data-t="graph" class="${tab==='graph'?'on':''}">派生図</button>
      <button data-t="fb" class="${tab==='fb'?'on':''}">FB履歴</button>
      ${R.kind==='vid'?'':`<button data-t="check" class="${tab==='check'?'on':''}">チェック</button>`}
    </div><div class="pane">${body}</div>
    ${rules(R.kind)}`;
  // ★requestAnimationFrame は【タブが非表示だと発火しない】。
  //   背面タブで開くと線が引かれない事故になるので rAF に依存しない。
  if(tab==='graph'){ setTimeout(()=>drawLines(p),0);
    // Webフォントの読み込みで箱の高さが動くので、確定後にもう一度引く
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>drawLines(p));
    addEventListener('load',()=>drawLines(p),{once:true}); }
}

document.addEventListener('click',e=>{
  const a=e.target.closest('.side a[data-p]');
  // 動画は構成シートが先（ここで文面と画像を管理する）。LPは系統が先
  if(a){cur=a.dataset.p;
    tab = cur==='__moods__' ? MOOD_IDS[0] : (cur.slice(0,4)==='vid:'?'sheet':'graph');
    render();return;}
  const b=e.target.closest('.tabs button'); if(b){tab=b.dataset.t;render();return;}
  // 派生図の節 → その版の原稿と指摘を右に出す
  const gn=e.target.closest('.gnode[data-v]');
  if(gn && !e.target.closest('a')){
    document.getElementById('dt')?.remove();
    document.body.insertAdjacentHTML('beforeend', detailPane(gn.dataset.v));
    return;
  }
  if(e.target.closest('[data-close]')){ document.getElementById('dt')?.remove(); return; }
  // シートの中の再生。押されたセルだけ <video> に差し替える
  const pc=e.target.closest('.vbox[data-play]');
  if(pc){
    const id=pc.dataset.play;
    pc.removeAttribute('data-play');
    pc.innerHTML=`<video src="../video/${id}/ad.mp4" poster="../video/${id}/poster.jpg"
      controls autoplay playsinline preload="metadata"></video>`;
    const vd=pc.querySelector('video');
    // 音が重ならないよう、再生し始めたら他は止める
    vd.addEventListener('play',()=>document.querySelectorAll('.vbox video').forEach(o=>{
      if(o!==vd) o.pause();}));
    return;
  }
  // フローの節を押したら、下の欄に詳細を出す（図は描き直さない）
  const fn=e.target.closest('.fnode');
  if(fn){showStep(+fn.dataset.step);}
});
addEventListener('hashchange',()=>{ if(readHash()) render(); else writeHash(); });   // 壊れたURLは黙って今の場所に直す
addEventListener('resize',()=>{
  if(cur==='__flow__')return drawFlow();
  if(tab==='graph'){const R=RG();drawLines(R.reg.projects.find(x=>x.id===PID()));}});
readHash();          // URLに書いてあればそこを開く
render();
</script>
</body></html>
