<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;
  font-feature-settings:"palt" 1}
.sec{width:720px;height:327px;position:relative;overflow:hidden}
.lead{text-align:center;padding-top:26px;font-size:9.5px;font-weight:700;color:#3a3a3a;letter-spacing:.02em}
.h2{margin-top:8px;text-align:center;font-size:21px;font-weight:800;color:#222;line-height:1}
.h2 em{font-style:normal;color:#2eb872}
.sub{margin-top:20px;text-align:center;font-size:7.5px;color:#555;line-height:1.7}
.cards{position:absolute;left:104px;top:133px;display:flex;gap:6px}
.card{position:relative;width:166px;height:159px;border-radius:14px;padding:30px 14px 0}
.card::before{content:"";position:absolute;left:0;top:0;width:34px;height:26px;
  background:#fff;border-bottom-right-radius:11px}
.no{position:absolute;left:4px;top:2px;font-size:19px;font-weight:800;line-height:1;letter-spacing:-.02em;z-index:2}
.t{text-align:center;font-size:9.5px;font-weight:800;color:#333;line-height:1.75}
.c1{background:#eaf6e6} .c1 .no{color:#2fae62}
.c2{background:#dff0f2} .c2 .no{color:#2b9fb5}
.c3{background:#fbdde6} .c3 .no{color:#e0567f}
</style></head><body>
<div class="sec">
  <p class="lead">学力だけじゃない！生きる力が身につく</p>
  <p class="h2">学研教室の<em>魅力</em></p>
  <p class="sub">「学習方法」「教材」「先生」で<br>しっかりお子さまをサポートします！</p>
  <div class="cards">
    <div class="card c1"><span class="no">01</span><p class="t">「自分で考える力」が<br>身につく学習方法</p></div>
    <div class="card c2"><span class="no">02</span><p class="t">基礎から応用・発展まで<br>よくわかるオリジナル教材</p></div>
    <div class="card c3"><span class="no">03</span><p class="t">しっかり子どもに<br>寄り添う先生</p></div>
  </div>
</div>
</body></html>
