<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;
  font-feature-settings:"palt" 1}
.sec{width:1440px;height:590px;position:relative;background:#fff}
.panel{position:absolute;left:110px;top:-40px;width:1220px;height:600px;
  background:#fff;border:1px solid #e6e6e6;border-radius:6px}
.grid{position:absolute;left:0;top:0;width:1440px}
.d{position:absolute;width:214px;height:214px;border-radius:50%;
  display:grid;place-content:center;text-align:center}
.d::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(#3cb234 0 var(--p), #e8e8e8 var(--p) 100%)}
.d::after{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}
.d span,.d b{position:relative;z-index:2}
.d span{display:block;font-size:20px;font-weight:700;color:#333;letter-spacing:.02em}
.d b{display:block;margin-top:4px;font-family:"Noto Sans JP",sans-serif;
  font-size:44px;font-weight:900;color:#3cb234;line-height:1;letter-spacing:-.01em}
.d b i{font-style:normal;font-size:.5em;margin-left:1px}
.n1{left:359px;top:18px;--p:100%}
.n2{left:613px;top:18px;--p:88%}
.n3{left:867px;top:18px;--p:86%}
.n4{left:486px;top:252px;--p:64%}
.n5{left:740px;top:252px;--p:75%}
.note{position:absolute;left:0;right:0;top:512px;text-align:center;font-size:11px;color:#888}
</style></head><body>
<div class="sec">
  <div class="panel"></div>
  <div class="grid">
    <div class="d n1"><span>英検5級</span><b>100<i>%</i></b></div>
    <div class="d n2"><span>英検4級</span><b>88<i>%</i></b></div>
    <div class="d n3"><span>英検3級</span><b>86<i>%</i></b></div>
    <div class="d n4"><span>英検準2級</span><b>64<i>%</i></b></div>
    <div class="d n5"><span>英検2級</span><b>75<i>%</i></b></div>
  </div>
  <p class="note">※2023年度第2回の実績（ESL clubオンライン校）　※受験者のうち1次・2次受験双方に合格した生徒の割合</p>
</div>
</body></html>
