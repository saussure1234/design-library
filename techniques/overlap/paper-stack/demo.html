<style>
/* ==========================================================
   overlap/paper-stack — 背後にもう1枚の紙を数度ずらして重ね、端で断ち落とす
   :where(:root) はトークン未読込時のフォールバック（優先度0）。
   ========================================================== */
:where(:root){
  --c-primary:#00B220; --c-primary-d:#05A81F; --c-primary-l:#E8F7EA; --c-accent:#FF9301;
  --c-ink:#111111; --c-ink2:#333333; --c-ink3:#707070;
  --c-bg:#FFFFFF; --c-bg2:#F7F8F7; --c-line:#E3E3E3; --c-on-primary:#FFFFFF;
  --f-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-num:"Helvetica Neue",Arial,var(--f-sans);
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px; --fs-lg:21px; --fs-xl:28px;
  --lh-tight:1.35; --lh-head:1.5; --lh-body:1.9;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px; --s7:52px;
  --r-s:6px; --r-m:12px; --r-l:24px; --r-pill:999px;
  --shadow:0 6px 24px rgba(17,17,17,.08);
  --w-max:1120px; --w-gut:clamp(18px,4vw,32px);
}

.tq-pst{
  font-family:var(--f-sans); color:var(--c-ink2); background:var(--c-bg);
  max-width:var(--w-max); margin:0 auto; padding:var(--s6) var(--w-gut);
}
.tq-pst :where(p,figure,figcaption,h3){ margin:0; }
.tq-pst__h{ font-size:var(--fs-md); font-weight:700; color:var(--c-ink); line-height:var(--lh-tight); margin:0 0 var(--s2); }
.tq-pst__lead{ font-size:var(--fs-sm); line-height:var(--lh-body); color:var(--c-ink3); margin:0 0 var(--s5); }
.tq-pst__row{ display:grid; gap:var(--s5); grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr)); }
.tq-pst__cap{ font-size:var(--fs-note); line-height:var(--lh-head); color:var(--c-ink3); margin:var(--s3) 0 0; }
.tq-pst__cap b{ display:block; color:var(--c-ink); font-size:var(--fs-sm); margin-bottom:2px; }

/* 舞台。負のz-indexが下へ抜けないよう isolation:isolate を必ず付ける */
.tq-pst__stage{
  position:relative; isolation:isolate; height:250px; box-sizing:border-box;
  background:var(--c-bg2); border:1px solid var(--c-line); border-radius:var(--r-m);
  display:grid; place-items:center; padding:var(--s6) var(--s5);
}
.tq-pst__ttl{ font-size:var(--fs-base); font-weight:700; color:var(--c-ink); line-height:var(--lh-tight); }
.tq-pst__sub{ font-size:var(--fs-note); color:var(--c-ink3); line-height:var(--lh-head); margin:var(--s2) 0 0; }

/* --- A｜普通：1枚だけ、影で浮かせて終わり --- */
.tq-pst__solo{
  width:100%; max-width:300px; background:var(--c-bg);
  border-radius:var(--r-m); box-shadow:var(--shadow); padding:var(--s5);
}

/* --- B｜背後にもう1枚。上と左を厚く＝楔形にのぞく --- */
.tq-pst__sheet{ position:relative; width:100%; max-width:300px; }
.tq-pst__sheet::before{
  content:""; position:absolute; inset:-18px -12px 26px -6px;
  background:var(--c-primary-l); border-radius:var(--r-m);
  transform:rotate(-1.5deg);
}
.tq-pst__face{
  position:relative;                       /* ::before より後ろのDOM＝上に載る */
  background:var(--c-bg); border-radius:var(--r-m); padding:var(--s5);
  box-shadow:var(--shadow);
}

/* --- C｜中身なしの空フレームを右上へ14pxずらす --- */
.tq-pst__phwrap{ position:relative; width:100%; max-width:280px; }
.tq-pst__phwrap::before{
  content:""; position:absolute; z-index:-1;   /* 舞台の背景の上・写真の下 */
  inset:-14px -14px 14px 14px;
  background:var(--c-bg); border:1px solid var(--c-line); border-radius:var(--r-m);
}
.tq-pst__phwrap img{
  position:relative; display:block; width:100%; height:150px;
  object-fit:cover; border-radius:var(--r-m);
}

/* --- D｜逆向きに傾けて食い込ませ、左端で断ち落とす --- */
.tq-pst__stage--deck{ overflow:hidden; padding:0; }
.tq-pst__deck{ position:absolute; inset:0; }
.tq-pst__deck > *{
  position:absolute; top:50%; width:240px; box-sizing:border-box;
  background:var(--c-bg); border-radius:var(--r-m); padding:var(--s4);
  box-shadow:var(--shadow);
}
.tq-pst__deck > :nth-child(1){ left:-56px;  transform:translateY(-50%) rotate(-3deg); }
.tq-pst__deck > :nth-child(2){ left:190px; z-index:2; transform:translateY(-56%) rotate(2deg); }

/* --- E｜幅も高さも違う3枚を階段状に、8pxだけ重ねる --- */
.tq-pst__fig--wide{ grid-column:1 / -1; }
.tq-pst__stage--stair{ height:300px; place-items:start center; padding:var(--s5); }
.tq-pst__stair{ display:grid; grid-template-columns:repeat(3,auto); align-items:start; }
.tq-pst__stair img{
  display:block; object-fit:cover; border-radius:var(--r-l);
  border:4px solid var(--c-bg); box-shadow:var(--shadow); box-sizing:border-box;
}
.tq-pst__stair img:nth-child(1){ width:150px; height:150px; transform:translateY(18px); }
.tq-pst__stair img:nth-child(2){ width:130px; height:180px; margin-left:-8px; position:relative; z-index:2; transform:translateY(54px); }
.tq-pst__stair img:nth-child(3){ width:160px; height:160px; margin-left:-8px; transform:translateY(0); }

@media (max-width:420px){
  .tq-pst__stage{ height:230px; padding:var(--s5) var(--s4); }
  .tq-pst__deck > *{ width:190px; }
  .tq-pst__deck > :nth-child(2){ left:110px; }
  .tq-pst__stage--stair{ height:270px; }
  .tq-pst__stair img:nth-child(1){ width:104px; height:104px; }
  .tq-pst__stair img:nth-child(2){ width:92px;  height:126px; }
  .tq-pst__stair img:nth-child(3){ width:112px; height:112px; }
}
</style>

<div class="tq-pst">

  <p class="tq-pst__h">紙は1枚に見せない。もう1枚を数度ずらして背後に置く</p>
  <p class="tq-pst__lead">
    左上が「1枚＋影」の普通。右上は疑似要素1つで背後に紙を足し、1.5°傾けて上と左を厚くのぞかせた。
    楔形にのぞくので、背面が傾いていることが形だけで分かる。下段は中身なしの空フレーム版と、
    逆向きに傾けて端で断ち落とす版、8pxだけ重ねる階段版。
  </p>

  <div class="tq-pst__row">

    <figure>
      <div class="tq-pst__stage">
        <div class="tq-pst__solo">
          <p class="tq-pst__ttl">見出しがここに入ります</p>
          <p class="tq-pst__sub">補足テキストがここに入ります</p>
        </div>
      </div>
      <p class="tq-pst__cap"><b>普通</b>カードは1枚だけ置き、ドロップシャドウで浮かせて終わり。前後関係も「続きがある」感じも出ない。</p>
    </figure>

    <figure>
      <div class="tq-pst__stage">
        <div class="tq-pst__sheet">
          <div class="tq-pst__face">
            <p class="tq-pst__ttl">見出しがここに入ります</p>
            <p class="tq-pst__sub">補足テキストがここに入ります</p>
          </div>
        </div>
      </div>
      <p class="tq-pst__cap"><b>この工夫｜楔形にのぞかせる</b>背面を1.5°傾け、上辺は左が厚く右へ細る楔形に。右端にも同じ色が数px見える。要素はDOM上1つのまま。</p>
    </figure>

    <figure>
      <div class="tq-pst__stage">
        <div class="tq-pst__phwrap">
          <img src="../../../docs/demo/ph_a.jpg" alt="">
        </div>
      </div>

    </figure>

    <figure>
      <div class="tq-pst__stage tq-pst__stage--deck">
        <div class="tq-pst__deck">
          <div>

            <p class="tq-pst__sub">補足テキストがここに入ります</p>
          </div>
          <div>
            <p class="tq-pst__ttl">見出しがここに入ります</p>
            <p class="tq-pst__sub">補足テキストがここに入ります</p>
          </div>
        </div>
      </div>
      <p class="tq-pst__cap"><b>断ち落とし版</b>−3°と+2°で逆向きに傾けて食い込ませ、左のカードは端で切って全体を見せない。「まだ他にもある」が伝わる。</p>
    </figure>

    <figure class="tq-pst__fig--wide">
      <div class="tq-pst__stage tq-pst__stage--stair">
        <div class="tq-pst__stair">
          <img src="../../../docs/demo/ph_a.jpg" alt="">
          <img src="../../../docs/demo/ph_b.jpg" alt="">
          <img src="../../../docs/demo/ph_a.jpg" alt="">
        </div>
      </div>
      <p class="tq-pst__cap"><b>階段版</b>幅も高さも違う3枚を段違いに置き、隣同士を8pxだけ重ねて中央を最前面に。並んだ3人ではなく、集まった3人に見える。</p>
    </figure>

  </div>
</div>
