<style>
/* ==========================================================
   overlap/callout-bites — 吹き出し・注釈箱を対象に噛ませ、尻尾か1px線で刺す
   :where(:root) はトークン未読込時のフォールバック（優先度0）。
   ========================================================== */
:where(:root){
  --c-primary:#00B220; --c-primary-d:#05A81F; --c-primary-l:#E8F7EA; --c-accent:#FF9301;
  --c-ink:#111111; --c-ink2:#333333; --c-ink3:#707070;
  --c-bg:#FFFFFF; --c-bg2:#F7F8F7; --c-line:#E3E3E3; --c-on-primary:#FFFFFF;
  --f-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-num:"Helvetica Neue",Arial,var(--f-sans);
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px; --fs-lg:21px; --fs-xl:28px;
  --lh-tight:1.35; --lh-head:1.5; --lh-body:1.9;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px; --s7:52px;
  --r-s:6px; --r-m:12px; --r-l:24px; --r-pill:999px;
  --shadow:0 6px 24px rgba(17,17,17,.08);
  --w-max:1120px; --w-gut:clamp(18px,4vw,32px);
}

.tq-cbt{
  font-family:var(--f-sans); color:var(--c-ink2); background:var(--c-bg);
  max-width:var(--w-max); margin:0 auto; padding:var(--s6) var(--w-gut);
}
.tq-cbt, .tq-cbt *{ box-sizing:border-box; }
.tq-cbt :where(p,figure,figcaption){ margin:0; }
.tq-cbt__h{ font-size:var(--fs-md); font-weight:700; color:var(--c-ink); line-height:var(--lh-tight); margin:0 0 var(--s2); }
.tq-cbt__lead{ font-size:var(--fs-sm); line-height:var(--lh-body); color:var(--c-ink3); margin:0 0 var(--s5); }
.tq-cbt__row{ display:grid; gap:var(--s5); grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); }
.tq-cbt__cap{ font-size:var(--fs-note); line-height:var(--lh-head); color:var(--c-ink3); margin:var(--s3) 0 0; }
.tq-cbt__cap b{ display:block; color:var(--c-ink); font-size:var(--fs-sm); margin-bottom:2px; }
.tq-cbt__fig--wide{ grid-column:1 / -1; }

.tq-cbt__stage{
  position:relative; height:260px; box-sizing:border-box; overflow:visible;
  background:var(--c-bg2); border:1px solid var(--c-line); border-radius:var(--r-m);
  display:grid; place-items:center; padding:var(--s5);
}

/* --- A｜普通：写真の上に見出しとして置く --- */
.tq-cbt__plain{ display:flex; flex-direction:column; align-items:center; gap:var(--s3); }
.tq-cbt__plain img{
  width:112px; height:112px; object-fit:cover; border-radius:50%;
  border:4px solid var(--c-primary); box-sizing:border-box; display:block;
}
.tq-cbt__plainttl{ font-size:var(--fs-base); font-weight:700; color:var(--c-ink); line-height:var(--lh-tight); }

/* --- B｜吹き出しを対象に噛ませ、尻尾を内側へ刺す --- */
.tq-cbt__unit{ position:relative; width:200px; height:130px; }
.tq-cbt__photo{
  position:absolute; z-index:2; right:0; top:16px;
  width:112px; height:112px; object-fit:cover; border-radius:50%;
  border:4px solid var(--c-primary); box-sizing:border-box; display:block;
}
.tq-cbt__clock{
  position:absolute; z-index:1; right:82px; top:40px;
  width:92px; height:92px; box-sizing:border-box;
  border-radius:50%; border:4px solid var(--c-primary);
  background:conic-gradient(from 180deg, var(--c-accent) 0 25%, var(--c-bg) 0);
}
.tq-cbt__balloon{
  position:absolute; z-index:3; top:0; left:74px;              /* 円の上端に約16px噛ませる */
  background:var(--c-bg); border:3px solid var(--c-primary);
  border-radius:var(--r-s); padding:2px 12px;
  font-size:var(--fs-sm); font-weight:700; color:var(--c-primary); white-space:nowrap;
}
.tq-cbt__balloon::after{                                       /* 尻尾は対象の内側へ刺す */
  content:''; position:absolute; left:36px; bottom:-11px;
  width:14px; height:14px; background:var(--c-bg);
  border-left:3px solid var(--c-primary); border-bottom:3px solid var(--c-primary);
  transform:skewX(-25deg);
}

/* --- C｜引き出し線で図と数字を直結（1px × 24〜40px） --- */
.tq-cbt__stage--map{ height:300px; place-items:stretch; padding:var(--s5); }
.tq-cbt__map{ position:relative; height:100%; }
.tq-cbt__mapimg{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; border-radius:var(--r-m); display:block;
}
.tq-cbt__callout{
  position:absolute; z-index:2; background:var(--c-bg); border-radius:var(--r-s);
  padding:6px 10px; box-shadow:var(--shadow); text-align:center; white-space:nowrap;
  font-size:var(--fs-note); color:var(--c-ink3); line-height:1.3;
}
.tq-cbt__callout b{ display:block; font-size:var(--fs-sm); color:var(--c-ink); }
.tq-cbt__callout::after{ content:""; position:absolute; background:var(--c-primary); }
.tq-cbt__callout--a{ left:7%;  top:-12px; }   /* 図の上辺に半分かける */
.tq-cbt__callout--a::after{ left:50%; top:100%; width:1px; height:40px; }
.tq-cbt__callout--b{ right:9%; top:26px; }
.tq-cbt__callout--b::after{ left:22%; top:100%; width:1px; height:40px; }
.tq-cbt__callout--c{ left:22%; bottom:-10px; }  /* 図の下辺に半分かける */
.tq-cbt__callout--c::after{ left:64%; bottom:100%; width:1px; height:34px; }
.tq-cbt__callout--d{ right:26%; bottom:24px; }
.tq-cbt__callout--d::after{ left:36%; bottom:100%; width:1px; height:32px; }

@media (max-width:420px){
  .tq-cbt__stage{ height:240px; }
  .tq-cbt__stage--map{ height:300px; padding:var(--s4); }
  .tq-cbt__callout{ font-size:10px; padding:4px 6px; }
  .tq-cbt__callout--b{ right:6%; top:56px; }
  .tq-cbt__callout--d{ right:14%; bottom:44px; }
}
</style>

<div class="tq-cbt">

  <p class="tq-cbt__h">注釈は外に並べず、対象に噛ませて刺す</p>
  <p class="tq-cbt__lead">
    左は写真の下に見出しを置いた普通。中央は同じ言葉を吹き出しにして円の上端に16px噛ませ、尻尾を円の内側へ刺した。
    外から刺すことで、静止画が発話しているように読める。下段は1pxの引き出し線で数字と図を直結する版。
  </p>

  <div class="tq-cbt__row">

    <figure>
      <div class="tq-cbt__stage">
        <div class="tq-cbt__plain">
          <img src="../../../docs/demo/ph_a.jpg" alt="">
          <p class="tq-cbt__plainttl">ステップ名</p>
        </div>
      </div>
      <p class="tq-cbt__cap"><b>普通</b>ステップ名は写真の外に見出しとして置く。写真と言葉は上下に並んでいるだけで、誰の言葉かは示されない。</p>
    </figure>

    <figure>
      <div class="tq-cbt__stage">
        <div class="tq-cbt__unit">
          <img class="tq-cbt__photo" src="../../../docs/demo/ph_a.jpg" alt="">
          <div class="tq-cbt__clock"></div>
          <div class="tq-cbt__balloon">ステップ名</div>
        </div>
      </div>
      <p class="tq-cbt__cap"><b>この工夫｜噛ませて刺す</b>吹き出しは円の上端に16px重なり、左端は円の輪郭より外へ出る。尻尾は円の内側へ刺さり、斜めに歪めて手描き感を出す。</p>
    </figure>

    <figure class="tq-cbt__fig--wide">
      <div class="tq-cbt__stage tq-cbt__stage--map">
        <div class="tq-cbt__map">
          <img class="tq-cbt__mapimg" src="../../../docs/demo/ph_b.jpg" alt="">
          <div class="tq-cbt__callout tq-cbt__callout--a"><b>0,000</b>項目テキスト</div>
          <div class="tq-cbt__callout tq-cbt__callout--b"><b>0,000</b>項目テキスト</div>
          <div class="tq-cbt__callout tq-cbt__callout--c"><b>0,000</b>項目テキスト</div>
          <div class="tq-cbt__callout tq-cbt__callout--d"><b>0,000</b>項目テキスト</div>
        </div>
      </div>
      <p class="tq-cbt__cap"><b>引き出し線で直結</b>白い小箱を図の上下左右に置き、一部は図の上に乗せ、各箱から1px×28〜40pxの細線を対応する位置へ伸ばす。凡例を照合する手間が消える。箱は4つまで（5つ以上は線が交差して読めない）。</p>
    </figure>

  </div>
</div>
