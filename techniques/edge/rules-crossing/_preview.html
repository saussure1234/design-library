<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../parts/_tokens.css"><style>*{margin:0;padding:0}body{font-family:sans-serif}</style></head><body>
<style>
/* トークンのフォールバック。:where() で詰めているので、
   _tokens.css が読み込まれていればそちらが必ず勝つ。 */
:where(:root){
  --c-primary:#00B220; --c-primary-d:#05A81F; --c-primary-l:#E8F7EA; --c-accent:#FF9301;
  --c-ink:#111111; --c-ink2:#333333; --c-ink3:#707070;
  --c-bg:#FFFFFF; --c-bg2:#F7F8F7; --c-line:#E3E3E3; --c-on-primary:#FFFFFF;
  --f-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-disp:var(--f-sans); --f-num:"Helvetica Neue",Arial,var(--f-sans);
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px;
  --fs-lg:21px; --fs-xl:28px; --fs-2xl:38px;
  --lh-tight:1.35; --lh-head:1.5; --lh-body:1.9;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px; --s7:52px; --s8:76px;
  --sec-y:clamp(56px,7vw,110px);
  --r-s:6px; --r-m:12px; --r-l:24px; --r-pill:999px;
  --e:cubic-bezier(.23,1,.32,1); --d:.5s;
  --w-max:1120px; --w-gut:clamp(18px,4vw,32px);
}

/* ============ 土台 ============ */
.tq-xrule{
  font-family:var(--f-sans); color:var(--c-ink2); background:var(--c-bg);
  padding-block:var(--s7);
}
.tq-xrule *{box-sizing:border-box}
.tq-xrule__wrap{max-width:var(--w-max); margin-inline:auto; padding-inline:var(--w-gut)}
.tq-xrule__grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:var(--s7) var(--s5);
}

.tq-xrule__tag{
  display:inline-block; margin:0;
  font-size:var(--fs-note); letter-spacing:.08em; line-height:1;
  padding:var(--s2) var(--s3); border-radius:var(--r-pill);
  background:var(--c-bg2); color:var(--c-ink3);
}
.tq-xrule__tag--on{background:var(--c-primary-l); color:var(--c-primary-d)}
.tq-xrule__h{
  font-family:var(--f-disp); font-size:var(--fs-md); line-height:var(--lh-tight);
  letter-spacing:.02em; color:var(--c-ink); font-weight:800;
  margin:var(--s3) 0 var(--s4);
}
.tq-xrule__cap{
  margin:var(--s4) 0 0; font-size:var(--fs-sm); line-height:var(--lh-head); color:var(--c-ink3);
}
.tq-xrule__cap b{color:var(--c-ink2); font-weight:700}

/* ============ 白場＋写真パネル ============ */
.tq-xrule__stage{position:relative; background:var(--c-bg); overflow:hidden}
.tq-xrule__top{padding:var(--s6) var(--s5) var(--s5)}
.tq-xrule__big{
  margin:0; font-family:var(--f-disp); font-weight:800;
  font-size:var(--fs-2xl); line-height:1; letter-spacing:.01em; color:var(--c-ink);
}
.tq-xrule__panel{
  position:relative; z-index:0;
  margin-inline:4%;                 /* パネルは4%〜96%。右端の外にも1本走らせるため */
  aspect-ratio:16/9; min-height:170px; overflow:hidden; background:var(--c-bg2);
}
.tq-xrule__panel img{width:100%; height:100%; object-fit:cover; display:block}

/* ============ 縦罫 ============ */
.tq-xrule__rules{position:absolute; inset:0; z-index:2; pointer-events:none}
.tq-xrule__rule{
  position:absolute; top:0; width:1px; display:block;
  background:var(--c-ink3);
  background:color-mix(in srgb, var(--c-primary) 55%, transparent);
  transform-origin:top; transform:scaleY(0);
  animation:tq-xrule-grow calc(var(--d) * 1.6) var(--e) both;
}
@keyframes tq-xrule-grow{from{transform:scaleY(0)} to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){
  .tq-xrule__rule{animation:none; transform:scaleY(1)}
}

/* --- 普通：等間隔・セクション内で止まる（写真には触れない） --- */
.tq-xrule__rules--even .tq-xrule__rule{height:26%}
.tq-xrule__rules--even .tq-xrule__rule:nth-child(1){left:10%; animation-delay:0s}
.tq-xrule__rules--even .tq-xrule__rule:nth-child(2){left:25%; animation-delay:.06s}
.tq-xrule__rules--even .tq-xrule__rule:nth-child(3){left:40%; animation-delay:.12s}
.tq-xrule__rules--even .tq-xrule__rule:nth-child(4){left:55%; animation-delay:.18s}
.tq-xrule__rules--even .tq-xrule__rule:nth-child(5){left:70%; animation-delay:.24s}
.tq-xrule__rules--even .tq-xrule__rule:nth-child(6){left:85%; animation-delay:.30s}

/* --- この工夫：不等間隔・止まる深さも揃えない・写真へ越境 --- */
/* 高さは % 指定。写真の高さが画面幅で変わっても、必ず写真の内部で止まる */
.tq-xrule__rules--cross .tq-xrule__rule:nth-child(1) {left:7%;    height:48%; animation-delay:0s}
.tq-xrule__rules--cross .tq-xrule__rule:nth-child(2) {left:11%;   height:72%; animation-delay:.06s}
.tq-xrule__rules--cross .tq-xrule__rule:nth-child(3) {left:19.5%; height:58%; animation-delay:.12s}
.tq-xrule__rules--cross .tq-xrule__rule:nth-child(4) {left:22%;   height:86%; animation-delay:.18s}
.tq-xrule__rules--cross .tq-xrule__rule:nth-child(5) {left:31%;   height:44%; animation-delay:.24s}
.tq-xrule__rules--cross .tq-xrule__rule:nth-child(6) {left:34.5%; height:66%; animation-delay:.30s}
.tq-xrule__rules--cross .tq-xrule__rule:nth-child(7) {left:46%;   height:92%; animation-delay:.36s}
.tq-xrule__rules--cross .tq-xrule__rule:nth-child(8) {left:49%;   height:54%; animation-delay:.42s}
.tq-xrule__rules--cross .tq-xrule__rule:nth-child(9) {left:58%;   height:78%; animation-delay:.48s}
.tq-xrule__rules--cross .tq-xrule__rule:nth-child(10){left:71%;   height:62%; animation-delay:.54s}
/* 1本だけパネルの外側（右端96%より外）に置く */
.tq-xrule__rules--cross .tq-xrule__rule:nth-child(11){left:97.5%; height:50%; animation-delay:.60s}

@media (max-width:560px){
  .tq-xrule__top{padding:var(--s5) var(--s4) var(--s4)}
  .tq-xrule__big{font-size:var(--fs-xl)}
}
</style>

<section class="tq-xrule">
  <div class="tq-xrule__wrap">
    <div class="tq-xrule__grid">

      <div>
        <p class="tq-xrule__tag">普通の場合</p>
        <h2 class="tq-xrule__h">線は引かない。引いても等間隔でセクション内に収める</h2>
        <div class="tq-xrule__stage">
          <div class="tq-xrule__rules tq-xrule__rules--even" aria-hidden="true">
            <i class="tq-xrule__rule"></i><i class="tq-xrule__rule"></i><i class="tq-xrule__rule"></i>
            <i class="tq-xrule__rule"></i><i class="tq-xrule__rule"></i><i class="tq-xrule__rule"></i>
          </div>
          <div class="tq-xrule__top">
            <p class="tq-xrule__big">見出しがここに入ります</p>
          </div>
          <div class="tq-xrule__panel">
            <img src="../../../docs/demo/ph_b.jpg" alt="">
          </div>
        </div>
        <p class="tq-xrule__cap">同じ間隔・同じ長さで、写真の手前で揃って止まる。線は「白場の飾り」で完結し、白場と写真は別々の面のまま。</p>
      </div>

      <div>
        <p class="tq-xrule__tag tq-xrule__tag--on">この工夫｜不等間隔・越境</p>
        <h2 class="tq-xrule__h">極細の縦罫を不等間隔で降ろし、写真の中で止める</h2>
        <div class="tq-xrule__stage">
          <div class="tq-xrule__rules tq-xrule__rules--cross" aria-hidden="true">
            <i class="tq-xrule__rule"></i><i class="tq-xrule__rule"></i><i class="tq-xrule__rule"></i>
            <i class="tq-xrule__rule"></i><i class="tq-xrule__rule"></i><i class="tq-xrule__rule"></i>
            <i class="tq-xrule__rule"></i><i class="tq-xrule__rule"></i><i class="tq-xrule__rule"></i>
            <i class="tq-xrule__rule"></i><i class="tq-xrule__rule"></i>
          </div>
          <div class="tq-xrule__top">
            <p class="tq-xrule__big">見出しがここに入ります</p>
          </div>
          <div class="tq-xrule__panel">
            <img src="../../../docs/demo/ph_b.jpg" alt="">
          </div>
        </div>
        <p class="tq-xrule__cap">間隔も止まる深さも揃えない。1本はパネルの右端より外側を走る。線が境界を跨ぐので、<b>白場と写真が1枚の紙の上に見える</b>。</p>
      </div>

    </div>
  </div>
</section>

</body></html>
