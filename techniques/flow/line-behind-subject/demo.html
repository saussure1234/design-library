<style>
/* トークンのフォールバック。:where() で詰めているので、
   _tokens.css が読み込まれていればそちらが必ず勝つ。 */
:where(:root){
  --c-primary:#00B220; --c-primary-d:#05A81F; --c-primary-l:#E8F7EA; --c-accent:#FF9301;
  --c-ink:#111111; --c-ink2:#333333; --c-ink3:#707070;
  --c-bg:#FFFFFF; --c-bg2:#F7F8F7; --c-line:#E3E3E3; --c-on-primary:#FFFFFF;
  --f-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-disp:var(--f-sans); --f-num:"Helvetica Neue",Arial,var(--f-sans);
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px;
  --fs-lg:21px; --fs-xl:28px; --fs-2xl:38px;
  --lh-tight:1.35; --lh-head:1.5; --lh-body:1.9;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px; --s7:52px; --s8:76px;
  --sec-y:clamp(56px,7vw,110px);
  --r-s:6px; --r-m:12px; --r-l:24px; --r-pill:999px;
  --w-max:1120px; --w-gut:clamp(18px,4vw,32px);
}

.tq-line-behind{font-family:var(--f-sans); color:var(--c-ink2); background:var(--c-bg); padding-block:var(--s7)}
.tq-line-behind *{box-sizing:border-box}
.tq-line-behind__wrap{max-width:var(--w-max); margin-inline:auto; padding-inline:var(--w-gut)}
.tq-line-behind__grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--s7); align-items:start}
.tq-line-behind__blk{margin:0}
.tq-line-behind__tag{
  display:inline-block; margin:0 0 var(--s4);
  font-size:var(--fs-note); letter-spacing:.08em; line-height:1;
  padding:var(--s2) var(--s3); border-radius:var(--r-pill);
  background:var(--c-bg2); color:var(--c-ink3);
}
.tq-line-behind__tag--on{background:var(--c-primary-l); color:var(--c-primary-d)}
.tq-line-behind__cap{margin:var(--s4) 0 0; font-size:var(--fs-sm); line-height:var(--lh-body); color:var(--c-ink3)}

/* 舞台。isolation:isolate で z-index をこの箱の中だけに閉じる */
.tq-line-behind__stage{
  position:relative; isolation:isolate;
  aspect-ratio:1.32; background:var(--c-bg2); overflow:hidden; border-radius:var(--r-m);
}

/* ============ 普通：矢印を2本、同じ太さ・同じ色で引く ============ */
.tq-line-behind__flat{
  position:absolute; left:33%; bottom:0; width:34%; height:62%;
  object-fit:cover; display:block;
}
.tq-line-behind__ar{position:absolute; height:3px; background:var(--c-ink3)}
.tq-line-behind__ar::before{content:""; position:absolute; top:-7px; border:8px solid transparent}
.tq-line-behind__ar--l{left:8%; width:36%; top:26%}
.tq-line-behind__ar--l::before{left:-14px; border-right-color:var(--c-ink3)}
.tq-line-behind__ar--r{right:8%; width:36%; top:26%}
.tq-line-behind__ar--r::before{right:-14px; border-left-color:var(--c-ink3)}
.tq-line-behind__lab{
  position:absolute; top:12%; color:var(--c-ink2); font-weight:700;
  font-size:clamp(var(--fs-sm),1.7vw,var(--fs-md)); line-height:var(--lh-tight);
}
.tq-line-behind__lab--l{left:8%}
.tq-line-behind__lab--r{right:8%; text-align:right}

/* ============ この工夫：1本の斜線を人物の背後へ ============ */
.tq-line-behind__steps{
  position:absolute; left:12%; right:12%; bottom:0; height:30%;
  display:grid; grid-template-columns:repeat(3,1fr); align-items:end; z-index:0;
}
.tq-line-behind__steps i{display:block; background:var(--c-primary-l)}
.tq-line-behind__steps i:nth-child(1){height:50%}
.tq-line-behind__steps i:nth-child(2){height:72%}
.tq-line-behind__steps i:nth-child(3){height:100%}

.tq-line-behind__line{
  position:absolute; left:8%; bottom:39.5%; width:76%; height:3px;
  background:var(--c-primary);
  transform:rotate(-15deg); transform-origin:left center;
  z-index:0;                     /* 人物より下＝背面を通る */
}
.tq-line-behind__line::before{        /* 左端の矢羽 */
  content:""; position:absolute; left:-15px; top:-6.5px;
  border:8px solid transparent; border-right-color:var(--c-primary);
}

.tq-line-behind__subject{
  position:absolute; left:40%; bottom:21%; width:34%; height:auto;
  z-index:2;                     /* 線より上＝線がここで途切れる */
  display:block;
}
.tq-line-behind__subject .tq-line-behind__base{fill:var(--c-bg)}   /* 写真の下敷き＝不透明を保証 */
.tq-line-behind__subject .tq-line-behind__edge{fill:none; stroke:var(--c-line); stroke-width:2}

/* 主：濃く・大きく・太く */
.tq-line-behind__main{
  position:absolute; left:5%; bottom:43%; z-index:3;
  transform:rotate(-15deg); transform-origin:left bottom;
  color:var(--c-ink); font-weight:700; letter-spacing:.02em;
  font-size:clamp(var(--fs-md),2.7vw,var(--fs-xl)); line-height:var(--lh-tight);
}
.tq-line-behind__main b{display:block; color:var(--c-primary); font-weight:700}
/* 従：淡く・小さく・細く。色は線と同系ではなく、地に沈む灰へ */
.tq-line-behind__sub{
  position:absolute; right:2%; bottom:68%; z-index:1;
  transform:rotate(-15deg); transform-origin:right bottom; text-align:right;
  color:color-mix(in srgb, var(--c-ink3) 42%, var(--c-bg));
  font-weight:400; letter-spacing:.02em;
  font-size:clamp(var(--fs-sm),1.9vw,var(--fs-lg)); line-height:var(--lh-tight);
}

@media (max-width:768px){
  .tq-line-behind__grid{grid-template-columns:1fr; gap:var(--s6)}
  .tq-line-behind__main{font-size:clamp(var(--fs-md),5vw,var(--fs-xl))}
  .tq-line-behind__sub{font-size:clamp(var(--fs-sm),3.6vw,var(--fs-lg))}
  .tq-line-behind__lab{font-size:clamp(var(--fs-sm),3vw,var(--fs-md))}
}
</style>

<section class="tq-line-behind">
  <div class="tq-line-behind__wrap">
    <div class="tq-line-behind__grid">

      <figure class="tq-line-behind__blk">
        <p class="tq-line-behind__tag">普通の場合</p>
        <div class="tq-line-behind__stage">
          <img class="tq-line-behind__flat" src="../../../docs/demo/ph_a.jpg" alt="">
          <span class="tq-line-behind__ar tq-line-behind__ar--l"></span>
          <span class="tq-line-behind__ar tq-line-behind__ar--r"></span>
          <span class="tq-line-behind__lab tq-line-behind__lab--l">説明が<br>ここに入ります</span>
          <span class="tq-line-behind__lab tq-line-behind__lab--r">説明が<br>ここに入ります</span>
        </div>
        <figcaption class="tq-line-behind__cap">矢印2本・同じ太さ・同じ色・同じ文字サイズ。写真は四角いまま前に置かれ、どちらを押したいのかが決まらない。</figcaption>
      </figure>

      <figure class="tq-line-behind__blk">
        <p class="tq-line-behind__tag tq-line-behind__tag--on">この工夫</p>
        <div class="tq-line-behind__stage">
          <div class="tq-line-behind__steps"><i></i><i></i><i></i></div>

          <div class="tq-line-behind__line"></div>

          <svg class="tq-line-behind__subject" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <clipPath id="tqLineBehindCut">
                <circle cx="100" cy="44" r="27"/>
                <path d="M100,72 C80,72 68,80 65,98 L57,150 C55,163 70,165 72,153 L78,116 L80,168 L72,232 L69,282 C68,294 87,295 89,283 L100,228 L111,283 C113,295 132,294 131,282 L128,232 L120,168 L122,116 L128,153 C130,165 145,163 143,150 L135,98 C132,80 120,72 100,72 Z"/>
              </clipPath>
            </defs>
            <g clip-path="url(#tqLineBehindCut)">
              <rect class="tq-line-behind__base" x="0" y="0" width="200" height="300"/>
              <image href="../../../docs/demo/ph_a.jpg" x="0" y="0" width="200" height="300" preserveAspectRatio="xMidYMid slice"/>
            </g>
            <circle class="tq-line-behind__edge" cx="100" cy="44" r="27"/>
            <path class="tq-line-behind__edge" d="M100,72 C80,72 68,80 65,98 L57,150 C55,163 70,165 72,153 L78,116 L80,168 L72,232 L69,282 C68,294 87,295 89,283 L100,228 L111,283 C113,295 132,294 131,282 L128,232 L120,168 L122,116 L128,153 C130,165 145,163 143,150 L135,98 C132,80 120,72 100,72 Z"/>
          </svg>

          <span class="tq-line-behind__main">見出しが<b>ここに入ります</b></span>
          <span class="tq-line-behind__sub">補足がここに</span>
        </div>
        <figcaption class="tq-line-behind__cap">線は1本。人物の胴で途切れて背面へ抜けるので、平面の図に前後が生まれる。左端＝濃色＋強調色で大きく、右端＝淡い灰で小さく。同じ線の両端なのに主従が付き、押したい向きが1つに決まる。</figcaption>
      </figure>

    </div>
  </div>
</section>
