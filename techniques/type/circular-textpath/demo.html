<style>
/* トークンのフォールバック。:where() で詰めているので、
   _tokens.css が読み込まれていればそちらが必ず勝つ。 */
:where(:root){
  --c-primary:#00B220; --c-primary-d:#05A81F; --c-primary-l:#E8F7EA; --c-accent:#FF9301;
  --c-ink:#111111; --c-ink2:#333333; --c-ink3:#707070;
  --c-bg:#FFFFFF; --c-bg2:#F7F8F7; --c-line:#E3E3E3; --c-on-primary:#FFFFFF;
  --f-sans:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-disp:var(--f-sans); --f-num:"Helvetica Neue",Arial,var(--f-sans);
  --fs-note:12px; --fs-sm:13px; --fs-base:15px; --fs-md:17px;
  --fs-lg:21px; --fs-xl:28px; --fs-2xl:38px; --fs-3xl:50px; --fs-4xl:64px;
  --lh-tight:1.35; --lh-head:1.5; --lh-body:1.9;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px; --s7:52px; --s8:76px; --s9:110px;
  --sec-y:clamp(56px,7vw,110px);
  --r-s:6px; --r-m:12px; --r-l:24px; --r-pill:999px;
  --shadow:0 6px 24px rgba(17,17,17,.08);
  --w-max:1120px; --w-gut:clamp(18px,4vw,32px);
}
:where(body){margin:0}

.tq-ring{
  /* このセクションだけ --f-disp をセリフに差し替えた想定（案件では :root 側で当てる） */
  --f-disp:"Times New Roman","Hiragino Mincho ProN",serif;
  /* 円周の文字色。地(--c-bg2)より2〜3段暗いだけの、彫り込みのような階調 */
  --tq-ring-ink:color-mix(in srgb, var(--c-accent) 62%, var(--c-bg2));
  --tq-ring-ink-sunk:color-mix(in srgb, var(--c-accent) 38%, var(--c-bg2));
  font-family:var(--f-sans); color:var(--c-ink2); background:var(--c-bg2);
  padding-block:var(--s7);
}
.tq-ring *{box-sizing:border-box}
.tq-ring__wrap{max-width:var(--w-max); margin-inline:auto; padding-inline:var(--w-gut)}
.tq-ring__grid{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s6)}
.tq-ring__grid>*{min-width:0}
.tq-ring__tag{
  display:inline-block; margin:0 0 var(--s4);
  font-size:var(--fs-note); letter-spacing:.08em; line-height:1;
  padding:var(--s2) var(--s3); border-radius:var(--r-pill);
  background:var(--c-bg); color:var(--c-ink3);
}
.tq-ring__tag--on{background:var(--c-primary-l); color:var(--c-primary-d)}
.tq-ring__cap{margin:var(--s4) 0 0; font-size:var(--fs-sm); line-height:var(--lh-head); color:var(--c-ink3)}

/* ============ 舞台（正方形）============ */
.tq-ring__stage{position:relative; width:min(320px,100%); aspect-ratio:1; margin-inline:auto}
.tq-ring__svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.tq-ring__svg text{
  font-family:var(--f-disp); font-size:13px; letter-spacing:1.2px;
  fill:var(--tq-ring-ink);
}
.tq-ring__svg .tq-ring__rule{fill:none; stroke:var(--tq-ring-ink); stroke-width:1}
.tq-ring__svg .tq-ring__star{fill:var(--tq-ring-ink)}
.tq-ring__stage--sunk{--tq-ring-ink:var(--tq-ring-ink-sunk)}

/* アーチ型の写真。--r-pill が幅の半分で頭打ちになるので上辺が半円になる */
.tq-ring__ph{
  position:absolute; left:50%; transform:translateX(-50%);
  border-radius:var(--r-pill) var(--r-pill) 0 0;
  overflow:hidden; background:var(--c-line);
}
.tq-ring__ph img{width:100%; height:100%; object-fit:cover; display:block}
.tq-ring__ph--in{top:20%; width:54%; height:58%}     /* 円周の内側に収める */
.tq-ring__ph--out{top:14%; width:78%; height:80%}    /* 円周が写真の縁を横切る */

/* ============ 普通：写真の下に横1行のキャプション ============ */
.tq-ring__flat{
  margin:var(--s5) 0 0; text-align:center;
  font-family:var(--f-disp); font-size:13px; letter-spacing:1.2px;
  color:var(--tq-ring-ink);
}

@media (max-width:860px){
  .tq-ring__grid{grid-template-columns:1fr; gap:var(--s7)}
}
</style>

<section class="tq-ring">
  <div class="tq-ring__wrap">
    <div class="tq-ring__grid">

      <!-- ============ 普通 ============ -->
      <div>
        <p class="tq-ring__tag">普通の場合</p>
        <div class="tq-ring__stage">
          <div class="tq-ring__ph tq-ring__ph--in"><img src="../../../docs/demo/ph_a.jpg" alt=""></div>
        </div>
        <p class="tq-ring__flat">A LINE OF LATIN COPY</p>
        <p class="tq-ring__cap">英文コピーは写真の下に横1行。写真の外周は空いたままなので、密度を出そうとすると罫や飾りを別に足すことになる。</p>
      </div>

      <!-- ============ 工夫A：一周させて額装する ============ -->
      <div>
        <p class="tq-ring__tag tq-ring__tag--on">この工夫（一周・写真の外）</p>
        <div class="tq-ring__stage">
          <div class="tq-ring__ph tq-ring__ph--in"><img src="../../../docs/demo/ph_a.jpg" alt=""></div>
          <svg class="tq-ring__svg" viewBox="0 0 320 320">
            <defs>
              <path id="tq-ring-path-a" d="M160,30 a130,130 0 1,1 -0.1,0" fill="none"/>
            </defs>
            <!-- 内側にもう1本、上半分だけのアーチ罫 -->
            <path class="tq-ring__rule" d="M42,160 A118,118 0 0 1 278,160"/>
            <!-- 星グリフは1つだけ、12時の位置に -->
            <path class="tq-ring__star" transform="translate(160,13)"
              d="M0,-8 C1,-3 3,-1 8,0 C3,1 1,3 0,8 C-1,3 -3,1 -8,0 C-3,-1 -1,-3 0,-8 Z"/>
            <text>
              <textPath href="#tq-ring-path-a" startOffset="4%">A LINE OF LATIN COPY GOES AROUND THE CIRCLE · A LINE OF LATIN COPY GOES AROUND ·</textPath>
            </text>
          </svg>
        </div>
        <p class="tq-ring__cap">写真より一回り大きい円周（直径260px＝写真＋約50px）へ一周。内側に1pxのアーチ罫を重ね、星は上に1つだけ。線を1本も足さずに外周の密度が上がる。</p>
      </div>

      <!-- ============ 工夫B：360°回して写真の縁を横切らせる ============ -->
      <div>
        <p class="tq-ring__tag tq-ring__tag--on">この工夫（360°・縁を横切る）</p>
        <div class="tq-ring__stage tq-ring__stage--sunk">
          <div class="tq-ring__ph tq-ring__ph--out"><img src="../../../docs/demo/ph_b.jpg" alt=""></div>
          <svg class="tq-ring__svg" viewBox="0 0 320 320">
            <defs>
              <path id="tq-ring-path-b" d="M160,42 a118,118 0 1,1 -0.1,0" fill="none"/>
            </defs>
            <text>
              <textPath href="#tq-ring-path-b" startOffset="0%">A LINE OF LATIN COPY GOES AROUND THE CIRCLE · A LINE OF LATIN COPY GOES AROU ·</textPath>
            </text>
          </svg>
        </div>
        <p class="tq-ring__cap">同じ文字列を360°。下半分は逆さのまま写真の縁の上を横切る。色は地より2〜3段暗いだけに沈めるので、読ませる文字でなく彫りに見える。</p>
      </div>

    </div>
  </div>
</section>
