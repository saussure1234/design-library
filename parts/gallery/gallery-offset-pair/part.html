<section class="sec sec--alt gop">

  <div class="wrap gop__head">
    {{?eyebrow}}<p class="h-eyebrow fx" data-fx="left">{{eyebrow}}</p>{{/eyebrow}}
    <h2 class="h-lead gop__h fx" data-fx="fadeup" data-d="80">{{heading}}</h2>
    {{?lead}}<p class="h-sub gop__sub fx" data-fx="fadeup" data-d="140">{{lead}}</p>{{/lead}}
  </div>

  <div class="gop__stage">
    <ul class="gop__list">
      {{#items}}
      <li class="gop__item fx" data-fx="fadeup" data-d="{{.d}}">
        <a class="gop__link" href="{{.href}}" target="_blank" rel="noopener noreferrer">
          <span class="gop__frame">

            <img class="gop__img" src="{{.photo}}" alt="{{.photoAlt}}" loading="lazy" decoding="async">
            <span class="gop__scrim" aria-hidden="true"></span>

            <span class="gop__body">
              <span class="gop__play" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false"><path d="M9.4 6.6 17.8 12 9.4 17.4Z"/></svg>
              </span>
              <span class="gop__cap">
                {{?.meta}}<span class="gop__meta">{{.meta}}</span>{{/.meta}}
                <span class="gop__name">{{.caption}}</span>
              </span>
            </span>

          </span>
          {{?.srNote}}<span class="gop__sr">{{.srNote}}</span>{{/.srNote}}
        </a>
      </li>
      {{/items}}
    </ul>
  </div>

  {{?note}}<div class="wrap gop__foot"><p class="gop__note">{{note}}</p></div>{{/note}}

</section>
