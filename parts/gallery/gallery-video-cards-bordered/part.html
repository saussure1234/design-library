<section class="sec gvb">
  <div class="wrap">
    <div class="sec-head">
      {{?eyebrow}}<p class="sec-head__en">{{eyebrow}}</p>{{/eyebrow}}
      <h2 class="sec-head__ja">{{heading}}</h2>
      {{?lead}}<p class="sec-head__sub">{{lead}}</p>{{/lead}}
    </div>
    <ul class="gvb__grid">
      {{#items}}<li class="gvb__item fx" data-fx="fadeup" data-d="{{.d}}">
        <a class="gvb__card" href="{{.href}}" target="_blank" rel="noopener">
          <span class="gvb__thumb">
            <img src="{{.thumb}}" alt="{{.alt}}" loading="lazy">
            <span class="gvb__play" aria-hidden="true"></span>
          </span>
          <span class="gvb__cap">
            <b>{{.meta}}</b>
            <em>{{.name}}</em>
          </span>
        </a>
      </li>{{/items}}
    </ul>
    {{?note}}<p class="gvb__note">{{note}}</p>{{/note}}
  </div>
</section>
