<section class="sec vbi">
  <div class="wrap">
    <div class="sec-head">
      {{?eyebrow}}<p class="sec-head__en">{{eyebrow}}</p>{{/eyebrow}}
      <h2 class="sec-head__ja">{{heading}}</h2>
      {{?lead}}<p class="sec-head__sub">{{lead}}</p>{{/lead}}
    </div>
    <ul class="vbi__list">
      {{#items}}<li class="vbi__item fx" data-fx="fadeup" data-d="{{.d}}">
        <div class="vbi__side">
          <figure class="vbi__fig"><img src="{{.avatar}}" alt="" loading="lazy"></figure>
        </div>
        <div class="vbi__main">
          <h3 class="vbi__t">{{.title}}</h3>
          <p class="vbi__who">{{.who}}</p>
          <div class="vbi__body">{{.body}}</div>
          {{?.replyBody}}<div class="vbi__reply">
            <p class="vbi__replyhead"><span>{{.replyLabel}}</span></p>
            <div class="mbl__fold">
              <div class="vbi__replybody" id="vbir-{{.i}}">{{.replyBody}}</div>
            </div>
            <button class="mbl__more" type="button" aria-expanded="false" aria-controls="vbir-{{.i}}">
              <span class="mbl__more-t" data-open="{{openLabel}}" data-close="{{closeLabel}}">{{openLabel}}</span>
              <span class="mbl__more-i" aria-hidden="true"></span>
            </button>
          </div>{{/.replyBody}}
        </div>
      </li>{{/items}}
    </ul>
  </div>
</section>
