<section class="sec bnr">
  <div class="wrap">
    {{?heading}}<div class="sec-head">
      {{?eyebrow}}<p class="sec-head__en">{{eyebrow}}</p>{{/eyebrow}}
      <h2 class="sec-head__ja">{{heading}}</h2>
    </div>{{/heading}}
    <ul class="bnr__list">
      {{#items}}<li class="bnr__item fx" data-fx="fadeup" data-d="{{.d}}">
        <a href="{{.href}}"><img src="{{.img}}" alt="{{.alt}}" loading="lazy"></a>
      </li>{{/items}}
    </ul>
  </div>
</section>
