<section class="sec mbl">
  <div class="wrap">
    <div class="sec-head">
      {{?eyebrow}}<p class="sec-head__en">{{eyebrow}}</p>{{/eyebrow}}
      <h2 class="sec-head__ja">{{heading}}</h2>
      {{?lead}}<p class="sec-head__sub">{{lead}}</p>{{/lead}}
    </div>
    <ul class="mbl__list">
      {{#items}}<li class="mbl__item fx" data-fx="fadeup" data-d="{{.d}}">
        <div class="mbl__figwrap">
          <span class="mbl__b1" aria-hidden="true"></span>
          <span class="mbl__b2" aria-hidden="true"></span>
          <figure class="mbl__fig"><img src="{{.photo}}" alt="{{.alt}}" loading="lazy"></figure>
        </div>
        <div class="mbl__text">
          <p class="mbl__role">{{.role}}</p>
          <p class="mbl__name">{{.name}}{{?.career}}<span>{{.career}}</span>{{/.career}}</p>
          <p class="mbl__lead">{{.lead}}</p>
          <div class="mbl__fold">
            <div class="mbl__body" id="mblb-{{.i}}">{{.body}}</div>
          </div>
          <button class="mbl__more" type="button" aria-expanded="false" aria-controls="mblb-{{.i}}">
            <span class="mbl__more-t" data-open="{{openLabel}}" data-close="{{closeLabel}}">{{openLabel}}</span>
            <span class="mbl__more-i" aria-hidden="true"></span>
          </button>
        </div>
      </li>{{/items}}
    </ul>
  </div>
</section>
