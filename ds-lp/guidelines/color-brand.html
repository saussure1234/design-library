<!-- @dsCard group="Colors" -->
<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:34px;background:var(--ground);font-size:15px}
h2{font-size:15px;margin:0 0 4px}
p.n{font-size:12px;color:var(--ink-2);margin:0 0 20px;line-height:1.7}
.row{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 12px}
.sw{width:186px}
.box{height:104px;border-radius:6px;display:grid;place-content:center;
  font-size:12px;font-weight:700;text-align:center;padding:8px}
.cap{font-size:11px;color:var(--ink-2);margin:6px 0 0;line-height:1.6}
.ok{color:var(--brand);font-weight:700}
.ng{color:#C0392B;font-weight:700}
</style>

<h2>ブランドの色</h2>
<p class="n">この4色の外を持ち込まない（CRITERIA.md ④）。差し色は1セクションに1〜2箇所まで。</p>
<div class="row">
  <div class="sw"><div class="box" style="background:var(--brand);color:#fff">--brand<br>#0A7A2B</div><p class="cap">輝度0.142。濃地にも使える</p></div>
  <div class="sw"><div class="box" style="background:var(--accent);color:#12262C">--accent<br>#FFEE03</div><p class="cap">差し色。<b>輝度0.87で地(0.872)とほぼ同じ</b>。色相でしか区別できないので、面積か位置で効かせる</p></div>
  <div class="sw"><div class="box" style="background:var(--ink);color:#fff">--ink<br>#12262C</div><p class="cap">本文</p></div>
  <div class="sw"><div class="box" style="background:var(--ground);color:#12262C;border:1px solid var(--line)">--ground<br>#E8F3EA</div><p class="cap">地。輝度0.872</p></div>
</div>
