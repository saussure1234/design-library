<h2>級数 — 8段</h2>
<p class="n">6段に収めようとして数字を小さくするのは本末転倒だった。実測で「無駄な段は無い」ことを確認し、数字の段を別枠として正式に足してある。</p>
<div style="line-height:1.25">
  <div style="font-size:50px;font-weight:900">見出し 50px</div>
  <div style="font-size:34px;font-weight:900;color:var(--brand)">数字 34px</div>
  <div style="font-size:24px;font-weight:700">主CTA 24px</div>
  <div style="font-size:18px">本文 18px</div>
  <div style="font-size:15px">ナビ・副CTA 15px</div>
  <div style="font-size:13px;color:var(--ink-2)">単位 13px</div>
  <div style="font-size:11px;color:var(--ink-2)">小見出し・注記 11px</div>
</div>
<p class="n" style="margin-top:20px">★見出しの上限は <b>幅 ÷ 最長行の字数 × 0.93</b> で出す。<br>先に級数を決めて字数を後から数えると、必ず区切りの中で折り返す。<br>例：使える幅1360 ÷ 15字 ＝ 90px → 実際は 84px が安全側。</p>
